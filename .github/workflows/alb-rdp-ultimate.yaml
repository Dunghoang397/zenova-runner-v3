          if ($foundRepoImg) {
            $origExt = $foundRepoImg.Extension
            $targetWall = "$wallDir\Zenova-Original$origExt"
            if ($foundRepoImg.FullName -ne $targetWall) {
              Copy-Item -Path $foundRepoImg.FullName -Destination $targetWall -Force
            }

            @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop'
            ) | ForEach-Object {
              if (Test-Path $_) {
                Remove-ItemProperty -Path $_ -Name 'Wallpaper' -Force -EA SilentlyContinue
                Remove-ItemProperty -Path $_ -Name 'WallpaperStyle' -Force -EA SilentlyContinue
                Remove-ItemProperty -Path $_ -Name 'NoChangingWallPaper' -Force -EA SilentlyContinue
              }
            }

            @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers',
              'Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers'
            ) | ForEach-Object {
              New-Item -Path $_ -Force | Out-Null
              Set-ItemProperty -Path $_ -Name 'BackgroundType' -Value 0 -Type DWord -Force -EA SilentlyContinue
              Set-ItemProperty -Path $_ -Name 'BackgroundHistoryPath0' -Value $targetWall -Force -EA SilentlyContinue
            }

            $themesDir = "$env:APPDATA\Microsoft\Windows\Themes"
            New-Item -ItemType Directory -Force -Path $themesDir | Out-Null
            Copy-Item -Path $targetWall -Destination "$themesDir\TranscodedWallpaper" -Force -EA SilentlyContinue
            Remove-Item -Path "$themesDir\CachedFiles\*" -Force -EA SilentlyContinue

            @('HKCU:\Control Panel\Desktop','Registry::HKEY_USERS\.DEFAULT\Control Panel\Desktop') | ForEach-Object {
              if (Test-Path $_) {
                Set-ItemProperty -Path $_ -Name 'Wallpaper' -Value $targetWall -Force -EA SilentlyContinue
                Set-ItemProperty -Path $_ -Name 'WallpaperStyle' -Value '10' -Force -EA SilentlyContinue
                Set-ItemProperty -Path $_ -Name 'TileWallpaper' -Value '0' -Force -EA SilentlyContinue
              }
            }

            $enforcerPs1 = 'C:\ALB-Apps\enforce-wallpaper.ps1'
            @(
