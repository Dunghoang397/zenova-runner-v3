          Write-Host "  Creator     : $env:CREATOR" -ForegroundColor Cyan
          Write-Host "  IP Tailscale: $env:TAILSCALE_IP (RDP: 3389)" -ForegroundColor White
          Write-Host "  Sunshine    : https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "  Panel       : http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Yellow
