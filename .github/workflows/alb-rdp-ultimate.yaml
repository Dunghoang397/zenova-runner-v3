# ═══════════════════════════════════════════════════════════════
# ALB-VPSFREE-ULTIMATE v60.0 — SUPREME ZENOVA-OS EDITION
# 1. DESKTOP   : Sắp xếp gọn gàng (01 -> 13), xóa sạch 100% icon trùng lặp trên Win 22 & 25
# 2. DISCORD   : Fix triệt để lỗi không mở được (Bung chuẩn Squirrel + SKIP_HOST_UPDATE)
# 3. SUNSHINE  : Fix triệt để lỗi port 47990 (Ép WorkingDirectory + WMI + Service + Task)
# 4. WALLPAPER : Giữ nguyên 100% ảnh gốc + Chống màn hình đen tuyệt đối khi vào RDP
# 5. APPS      : Cài siêu tốc đa luồng (VSCode, EVKey, Discord, Spotify, Bandicam, StarDesk, Roblox)
# 6. WEB PANEL : Hợp nhất Web Quản Lý (taomay.yaml) + API (badao.rar) + Bất tử qua WMI
# 7. DRIVE     : Định danh ổ đĩa riêng ZENOVA-OS (X:\) hỗ trợ tối đa 100TB cho mọi máy
# ═══════════════════════════════════════════════════════════════
name: ALB-VPSFREE-ULTIMATE v60.0

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy & bản lưu riêng (VD: may-phu-1, may-phu-2)'
        required: false
        default: 'may-phu-1'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng phiên'
        required: false
        default: '5h00m'
        type: choice
        options: ['1h', '3h', '5h00m']
      auto_restart:
        description: '🔁 Tự khởi động phiên mới sau khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa riêng ZENOVA-OS'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ ZENOVA-OS (GB - Tối đa 100000 GB = 100TB)'
        required: false
        default: '100'
        type: string
      windows_image:
        description: '🪟 Hệ điều hành (windows-2022 hoặc windows-2025)'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu cố định cho RDP (runneradmin) & Sunshine Web UI'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo mặc định'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      choco_packages:
        description: '📦 Gói cài thêm qua Chocolatey (tùy chọn)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Fix Lag chuyên sâu & Mở khóa 100% CPU'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Bật Tailscale VPN & Funnel'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật tên miền DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: true

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'may-phu-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      SUNSHINE_PASS: ${{ inputs.fixed_password || 'Aistv@2026' }}

    steps:
      # ───────────────────────────────────────────────
      # 0. ĐỒNG BỘ ẢNH NỀN GỐC TỪ REPOSITORY
      # ───────────────────────────────────────────────
      - name: 📥 Checkout Repo (Lấy nguyên bản ảnh nền gốc)
        uses: actions/checkout@v4
        continue-on-error: true

      # ───────────────────────────────────────────────
      # 1. KHỞI TẠO Ổ ĐĨA RIÊNG ZENOVA-OS & ENGINE LƯU TRỮ
      # ───────────────────────────────────────────────
      - name: ⚡ Khởi tạo Ổ Đĩa Riêng ZENOVA-OS & Engine Lưu Trữ
        shell: pwsh
        timeout-minutes: 8
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dTemp = 'D:\tmp'
            New-Item -ItemType Directory -Force -Path $dTemp | Out-Null
            $env:TEMP = $dTemp; $env:TMP = $dTemp
            "TEMP=$dTemp" >> $env:GITHUB_ENV
            "TMP=$dTemp" >> $env:GITHUB_ENV
          } catch {}

          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          $rawVhd = ("$env:VHD_SIZE_GB").Trim().ToUpper()
          $vhdSizeInput = 100
          if ($rawVhd -match '^(\d+)\s*TB$') {
            $vhdSizeInput = ([int64]$Matches[1]) * 1000
          } else {
            $numStr = $rawVhd -replace '[^0-9]', ''
            if ($numStr) { $vhdSizeInput = [int64]$numStr }
          }
          if ($vhdSizeInput -lt 10) { $vhdSizeInput = 100 }
          if ($vhdSizeInput -gt 102400) { $vhdSizeInput = 102400 }
          "VHD_SIZE_GB_VALIDATED=$vhdSizeInput" >> $env:GITHUB_ENV

          $cleanId = (($env:MACHINE_ID).Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', ''
          if ([string]::IsNullOrWhiteSpace($cleanId)) { $cleanId = 'may-phu-1' }
          $relTag = "alb-storage-$cleanId"
          $stateBranch = "alb-state-$cleanId"

          $null = gh release view $relTag --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
            $null = gh release view "aistv-storage-$cleanId" --repo $env:GH_REPO 2>&1
            if ($LASTEXITCODE -eq 0) {
              $relTag = "aistv-storage-$cleanId"
              $stateBranch = "aistv-state-$cleanId"
            } else {
              $dummy = "$env:RUNNER_TEMP\init.txt"
              Set-Content $dummy -Value "ZENOVA-OS Persistent Storage ($cleanId)" -Encoding UTF8
              gh release create $relTag $dummy --repo $env:GH_REPO --title "ZENOVA-OS Storage ($cleanId)" --notes "Kho luu o dia ZENOVA-OS cua may [$cleanId]"
            }
          }
          "MACHINE_ID=$cleanId" >> $env:GITHUB_ENV
          "RELEASE_TAG=$relTag" >> $env:GITHUB_ENV
          "STATE_BRANCH=$stateBranch" >> $env:GITHUB_ENV

          $total = 300; $dispTime = '5 giờ 00 phút'
          if ($env:INPUT_DURATION -eq '1h') { $total = 60; $dispTime = '1 giờ 00 phút' }
          elseif ($env:INPUT_DURATION -eq '3h') { $total = 180; $dispTime = '3 giờ 00 phút' }
          "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV
          "DISPLAY_TIME=$dispTime" >> $env:GITHUB_ENV
          "RDP_USER=$env:USERNAME" >> $env:GITHUB_ENV
          "PROFILE_PATH=$env:USERPROFILE" >> $env:GITHUB_ENV

          $dl = (($env:DRIVE_LETTER).Trim() -replace '[^A-Za-z]', '').ToUpper()
          if ((-not $dl) -or (@('C','D') -contains $dl)) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV

          $vhdContainer = 'C:\ZENOVA-VHD-HOST'
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile = "$vhdContainer\zenova-os-disk.vhdx"
          $actualVhdGb = if ($vhdSizeInput -gt 65530) { [int64]65530 } else { $vhdSizeInput }
          $sizeBytes = $actualVhdGb * 1GB
          $mounted = $false
          try {
            if (-not (Test-Path $vhdFile)) {
              New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru |
                New-Partition -DriveLetter $dl -UseMaximumSize |
                Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:$false | Out-Null
            } else {
              Mount-VHD -Path $vhdFile -ErrorAction Stop
            }
            if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {}

          if (-not $mounted) {
            $fallbackDir = "$vhdContainer\VIRTUAL-DRIVE-ROOT"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            & subst "${dl}:" $fallbackDir
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue
          }

          # Ép nhãn ổ đĩa luôn là ZENOVA-OS trên mọi máy
          try { Set-Volume -DriveLetter $dl -NewFileSystemLabel 'ZENOVA-OS' -ErrorAction SilentlyContinue } catch {}
          & label.exe "${dl}:" ZENOVA-OS *> $null

          $sharedRoot = "${dl}:\ZENOVA-SYSTEM"
          if ((Test-Path "${dl}:\ALB-SYSTEM") -and (-not (Test-Path $sharedRoot))) {
            $sharedRoot = "${dl}:\ALB-SYSTEM"
          }
          $osDir = "$sharedRoot\OS-OVERLAY"
          $instCache = "$osDir\Installers"
          @(
            "$sharedRoot\sessions", "$sharedRoot\DATA", "$osDir\InstalledApps",
            "$osDir\bin", $instCache, "$osDir\Sunshine-Config",
            "$osDir\Sunshine-Portable", "$osDir\Wallpaper", "$sharedRoot\Users", "${dl}:\Apps"
          ) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }

          if (-not (Test-Path 'C:\ALB-Apps')) {
            New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target "$osDir\InstalledApps" -Force | Out-Null
          }

          "SHARED_ROOT=$sharedRoot" >> $env:GITHUB_ENV
          "SHARED_SESSION_DIR=$sharedRoot\sessions" >> $env:GITHUB_ENV
          "SHARED_DATA_DIR=$sharedRoot\DATA" >> $env:GITHUB_ENV
          "SHARED_OS_DIR=$osDir" >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$sharedRoot\sessions\rdp-session-state.json" >> $env:GITHUB_ENV
          "PROFILE_ROOT=$sharedRoot\Users" >> $env:GITHUB_ENV
          "CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\alb-control.txt" >> $env:GITHUB_ENV
          "VHD_CONTAINER=$vhdContainer" >> $env:GITHUB_ENV
          "INSTALLER_CACHE=$instCache" >> $env:GITHUB_ENV
          "SUNSHINE_PERSIST_CFG=$osDir\Sunshine-Config" >> $env:GITHUB_ENV
          "WALLPAPER_DIR=$osDir\Wallpaper" >> $env:GITHUB_ENV

          # Tạo script save-data.ps1
          $L = New-Object System.Collections.Generic.List[string]
          $L.Add('param([string]$Reason = "session-end")')
          $L.Add('$ErrorActionPreference = "Continue"')
          $L.Add('if ($env:DATA_RESTORED -ne "1") { exit 0 }')
          $L.Add('$root = $env:SHARED_ROOT')
          $L.Add('if ((-not $root) -or (-not (Test-Path $root))) { exit 0 }')
          $L.Add('$apps = @("chrome","msedge","brave","firefox","coccoc","discord","Spotify","Code","bdcam","RobloxPlayerBeta","StarDesk","EVKey64","EVKey32")')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow() }')
          $L.Add('Start-Sleep -Seconds 2')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue')
          $L.Add('if ($Reason -eq "session-end") {')
          $L.Add('  Get-Service -Name "*StarDesk*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue')
          $L.Add('  & taskkill.exe /F /IM "StarDesk*" /T *> $null')
          $L.Add('}')
          $L.Add('Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue')
          $L.Add('$u = $env:RDP_USER; $profSrc = $env:PROFILE_PATH')
          $L.Add('if ($profSrc -and (Test-Path "$profSrc\AppData")) {')
          $L.Add('  Get-ChildItem -Path "$profSrc\AppData" -Filter "Local State" -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {')
          $L.Add('    try {')
          $L.Add('      $lsFile = $_.FullName')
          $L.Add('      $lsJson = Get-Content -Raw -Path $lsFile -Encoding UTF8 | ConvertFrom-Json')
          $L.Add('      if ($lsJson.os_crypt -and $lsJson.os_crypt.encrypted_key) {')
          $L.Add('        $encBytes = [Convert]::FromBase64String($lsJson.os_crypt.encrypted_key)')
          $L.Add('        if ($encBytes.Length -gt 5) {')
          $L.Add('          $prefix = [System.Text.Encoding]::ASCII.GetString($encBytes[0..4])')
          $L.Add('          if ($prefix -eq "DPAPI") {')
          $L.Add('            $cipher = $encBytes[5..($encBytes.Length - 1)]')
          $L.Add('            $rawKey = [System.Security.Cryptography.ProtectedData]::Unprotect($cipher, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser)')
          $L.Add('            [Convert]::ToBase64String($rawKey) | Set-Content -Path "$lsFile.aistvkey" -Encoding ASCII -Force')
          $L.Add('          }')
          $L.Add('        }')
          $L.Add('      }')
          $L.Add('    } catch {}')
          $L.Add('  }')
          $L.Add('}')
          $L.Add('if ($u -and $profSrc -and (Test-Path $profSrc)) {')
          $L.Add('  $profDst = "$root\Users\$u"; New-Item -ItemType Directory -Force -Path $profDst | Out-Null')
          $L.Add('  $ex = @("$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages","$profSrc\AppData\Roaming\Microsoft\Protect","$profSrc\AppData\Roaming\Microsoft\Crypto","$profSrc\AppData\Local\Microsoft\Credentials","$profSrc\AppData\Roaming\Microsoft\Credentials")')
          $L.Add('  robocopy $profSrc $profDst /MIR /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* WebCacheV01.dat SingletonLock /XD @ex *> $null')
          $L.Add('}')
          $L.Add('if (Test-Path "C:\Program Files\Sunshine\sunshine.exe") {')
          $L.Add('  New-Item -ItemType Directory -Force -Path "$env:SHARED_OS_DIR\Sunshine-Portable" | Out-Null')
          $L.Add('  robocopy "C:\Program Files\Sunshine" "$env:SHARED_OS_DIR\Sunshine-Portable" /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF "*.log" *> $null')
          $L.Add('}')
          $L.Add('$packDir = "$env:RUNNER_TEMP\alb-pack-$Reason"')
          $L.Add('if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }')
          $L.Add('New-Item -ItemType Directory -Force -Path $packDir | Out-Null')
          $L.Add('$archiveBase = "$packDir\alb-drive.7z"')
          $L.Add('Push-Location $root')
          $L.Add('& 7z a -t7z -m0=lzma2 -mx=1 -mmt=on -ssw -v1900m $archiveBase * -xr!Pagefile.sys -xr!swapfile.sys -xr!"System Volume Information" *> $null')
          $L.Add('Pop-Location')
          $L.Add('$chunks = @(Get-ChildItem $packDir -Filter "alb-drive.7z.*" | Sort-Object Name)')
          $L.Add('if ($chunks.Count -eq 0) { exit 1 }')
          $L.Add('$chunkList = @($chunks | ForEach-Object { @{ name = $_.Name; size = $_.Length } })')
          $L.Add('$manifest = @{ machineId = $env:MACHINE_ID; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); chunkCount = $chunks.Count; chunks = $chunkList }')
          $L.Add('$manifest | ConvertTo-Json -Depth 5 | Set-Content "$packDir\drive-manifest.json" -Encoding UTF8')
          $L.Add('$files = @($chunks | ForEach-Object { $_.FullName }) + @("$packDir\drive-manifest.json")')
          $L.Add('for ($i = 1; $i -le 3; $i++) { & gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep (2 * $i) }')
          $L.Add('Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue')
          $L.Add('exit 0')
          Set-Content -Path "$env:RUNNER_TEMP\save-data.ps1" -Value ($L -join "`r`n") -Encoding UTF8
          $global:LASTEXITCODE = 0
          Write-Host "✅ Đã dựng ổ đĩa riêng ZENOVA-OS (${dl}:\ - $vhdSizeInput GB) | Máy: $cleanId" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 2. KHÔI PHỤC Ổ ĐĨA ZENOVA-OS & PROFILE TỪ GITHUB
      # ───────────────────────────────────────────────
      - name: ♻️ Khôi phục Ổ Đĩa ZENOVA-OS & Profile
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
            ) | ForEach-Object {
              New-Item -Path $_ -Force | Out-Null
              Set-ItemProperty -Path $_ -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force
            }

            $suffix = (($env:MACHINE_ID).ToUpper() -replace '[^A-Z0-9]', '')
            if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8) }
            $fixedHost = if ($suffix) { "ZENOVA-$suffix" } else { 'ZENOVA-CLOUD-PC' }
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value $fixedHost -Force -EA SilentlyContinue
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value $fixedHost -Force -EA SilentlyContinue

            $dlDir = "$env:RUNNER_TEMP\gh-restore"
            if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -EA SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
            if (-not (Test-Path "$dlDir\drive-manifest.json")) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }

            $manifest = Get-Content -Raw "$dlDir\drive-manifest.json" | ConvertFrom-Json
            $chunkNames = @($manifest.chunks | ForEach-Object { $_.name })
            $hasTJ = $null -ne (Get-Command Start-ThreadJob -EA SilentlyContinue)
            $jobs = @()
            $chunkNames | ForEach-Object {
              if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
              else { $jobs += Start-Job -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
            }
            if ($jobs.Count -gt 0) { $null = Wait-Job $jobs -Timeout 120; $jobs | Remove-Job -Force -EA SilentlyContinue }

            $first = Get-ChildItem $dlDir -Filter '*.7z.001' | Select-Object -First 1
            if (-not $first) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }

            $stage = "$env:VHD_CONTAINER\restore-stage"
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -EA SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            & 7z x $first.FullName "-o$stage" -y -mmt=on *> $null
            Remove-Item $dlDir -Recurse -Force -EA SilentlyContinue

            $hit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -EA SilentlyContinue | Select-Object -First 1
            $src = if ($hit) { $hit.Directory.Parent.FullName } else { $stage }
            robocopy $src $env:SHARED_ROOT /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null

            $oldProf = "$env:PROFILE_ROOT\$env:RDP_USER"
            if (Test-Path $oldProf) {
              robocopy $oldProf $env:PROFILE_PATH /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD @("$oldProf\AppData\Local\Temp","$oldProf\AppData\Local\Packages") *> $null
            }
            if (Test-Path $env:SHARED_STATE_FILE) {
              try {
                $s = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json
                if ($s.password) { "RESTORE_PASS=$($s.password)" >> $env:GITHUB_ENV }
              } catch {}
            }
            Remove-Item $stage -Recurse -Force -EA SilentlyContinue
            'DATA_RESTORED=1' >> $env:GITHUB_ENV
            Write-Host "✅ Đã khôi phục dữ liệu ổ ZENOVA-OS thành công" -ForegroundColor Green
          } catch { 'DATA_RESTORED=1' >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0

      # ───────────────────────────────────────────────
      # 3. TURBO DOWNLOADER (TẢI SONG SONG MỌI BỘ CÀI CỰC NHANH)
      # ───────────────────────────────────────────────
      - name: 🚀 Turbo Downloader (Tải Song Song Driver & Toàn Bộ App)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -EA SilentlyContinue)
          New-Item -ItemType Directory -Force -Path $ic | Out-Null

          $downloads = @(
            @{ F = "$ic\usbmmidd.zip"; U = 'https://www.amyuni.com/downloads/usbmmidd_v2.zip'; R = ''; Min = 100KB },
            @{ F = "$ic\VBCable.zip"; U = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip'; R = ''; Min = 500KB },
            @{ F = "$ic\sunshine-setup.exe"; U = 'https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe'; R = ''; Min = 5MB },
            @{ F = "$ic\tailscale.msi"; U = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'; R = ''; Min = 5MB },
            @{ F = "$ic\EVKey.zip"; U = 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip'; R = ''; Min = 500KB },
            @{ F = "$ic\VSCode-win32-x64.zip"; U = 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable'; R = ''; Min = 40MB },
            @{ F = "$ic\DiscordSetup.exe"; U = 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'; R = 'https://discord.com/'; Min = 40MB },
            @{ F = "$ic\Spotify.exe"; U = 'https://download.scdn.co/SpotifyFullSetupX64.exe'; R = ''; Min = 5MB },
            @{ F = "$ic\bdcam.exe"; U = 'https://dl.bandicam.com/bdcamsetup.exe'; R = 'https://www.bandicam.com/'; Min = 10MB },
            @{ F = "$ic\Roblox.exe"; U = 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe'; R = ''; Min = 1MB },
            @{ F = "$ic\StarDesk.exe"; U = 'https://api.stardesk.net/api/v1/release/dl/1?channel=official'; R = 'https://www.stardesk.net/'; Min = 5MB }
          )

          $sb = {
            param($f, $url, $ref, $min)
            if ((-not (Test-Path $f)) -or ((Get-Item $f -EA SilentlyContinue).Length -lt $min)) {
              $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
              if ($ref) {
                & curl.exe -L --retry 3 --connect-timeout 15 -A $ua -e $ref -s $url -o $f 2>$null
              } else {
                & curl.exe -L --retry 3 --connect-timeout 15 -A $ua -s $url -o $f 2>$null
              }
            }
          }

          $jobs = @()
          $downloads | ForEach-Object {
            if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock $sb -ArgumentList $_.F, $_.U, $_.R, $_.Min }
            else { $jobs += Start-Job -ScriptBlock $sb -ArgumentList $_.F, $_.U, $_.R, $_.Min }
          }
          if ($jobs.Count -gt 0) {
            $null = Wait-Job $jobs -Timeout 75
            $jobs | Remove-Job -Force -EA SilentlyContinue
          }

          # Fallback MediaFire cho StarDesk từ taomay.yaml nếu API chính chậm
          $sdFile = "$ic\StarDesk.exe"
          if ((-not (Test-Path $sdFile)) -or ((Get-Item $sdFile -EA SilentlyContinue).Length -lt 5MB)) {
            $mfUrl = 'https://download943.mediafire.com/be95vz5kgnig_m7acKGr-mRjXQQKAN0i2WdjIR_d-q70MeLboolFJnUHit6ZmqJYm8_rJigOgY0P5NhtdANnLGXOaEmKg9eWSEUGCEEIZdCrV2NNZ0ubdEO1hyPHR6l2Re85XT5kJpCd3Q4GXpeU0ZD2QSr5gc_6aPfM7r15_YltcA/mf82krdrzcy3dz8/StarDesk_1.5.3.exe'
            & curl.exe -L --retry 2 --connect-timeout 15 -A 'Mozilla/5.0' -s $mfUrl -o $sdFile 2>$null
          }

          Write-Host "✅ Turbo Downloader hoàn tất" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ───────────────────────────────────────────────
      # 4. CẤU HÌNH RDP 60FPS + CHỐNG NỀN ĐEN RDP + FIX LAG CHUYÊN SÂU
      # ───────────────────────────────────────────────
      - name: 🔐 RDP 60FPS + Chống Màn Hình Đen + Fix Lag Chuyên Sâu
        shell: pwsh
        timeout-minutes: 4
        env:
          OPT_WIN: ${{ inputs.optimize_windows }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fSingleSessionPerUser 0 -Type DWord -Force

          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          @{
            UserAuthentication = 0
            SecurityLayer = 0
            fPromptForPassword = 0
            fEnableRemoteFX = 1
            fNoRemoteDesktopWallpaper = 0
            fDisableAudioCapture = 0
            fDisableCam = 0
            MaxIdleTime = 0
            MaxDisconnectionTime = 0
            MaxConnectionTime = 0
            fResetBroken = 0
            MinSendInterval = 10
            KeepAliveEnable = 1
          }.GetEnumerator() | ForEach-Object { Set-ItemProperty $p $_.Key $_.Value -Type DWord -Force }

          $rdpPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $rdpPol -Force | Out-Null
          Remove-ItemProperty -Path $rdpPol -Name 'fPromptForPassword' -Force -EA SilentlyContinue
          Remove-ItemProperty -Path $rdpPol -Name 'EnforceRemovalOfRemoteDesktopWallpaper' -Force -EA SilentlyContinue
          @{
            ColorDepth = 5
            MaxMonitors = 4
            fDisableAudioCapture = 0
            fDisableCam = 0
            fNoRemoteDesktopWallpaper = 0
            AVC444ModePreferred = 1
            AVCHardwareEncodePreferred = 1
            MinEncryptionLevel = 2
            MaxIdleTime = 0
            MaxDisconnectionTime = 0
            fResetBroken = 0
          }.GetEnumerator() | ForEach-Object { Set-ItemProperty $rdpPol $_.Key $_.Value -Type DWord -Force }
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force

          $rdpidd = 'C:\Windows\System32\drivers\UMDF\RDPidd.dll'
          if (Test-Path $rdpidd) {
            & takeown.exe /F $rdpidd /A *> $null
            & icacls.exe $rdpidd /grant "*S-1-5-32-544:F" /Q *> $null
            & icacls.exe $rdpidd /grant:r "*S-1-5-32-545:(RX)" /Q *> $null
          }

          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Tailscale-ICMP') | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -EA SilentlyContinue }
          New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Tailscale-ICMP' -Direction Inbound -Action Allow -Protocol ICMPv4 -Profile Any | Out-Null

          Set-Service TermService -StartupType Automatic -EA SilentlyContinue
          Set-Service UmRdpService -StartupType Automatic -EA SilentlyContinue
          Start-Service TermService -EA SilentlyContinue
          Start-Service UmRdpService -EA SilentlyContinue

          if ($env:OPT_WIN -eq 'true') {
            tzutil /s 'SE Asia Standard Time' 2>$null
            $ult = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
            if ($ult -match '([a-f0-9\-]{36})') { & powercfg /setactive $Matches[1] 2>$null } else { & powercfg /setactive SCHEME_MIN 2>$null }
            & powercfg /change standby-timeout-ac 0
            & powercfg /change monitor-timeout-ac 0
            & powercfg /change disk-timeout-ac 0
            & powercfg /hibernate off
            & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMIN 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMAX 100 2>$null
            & powercfg /setactive scheme_current 2>$null

            # Tắt FairShare để phiên người dùng chiếm trọn 100% tài nguyên CPU/Disk/Mạng
            @(
              @{ P = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\CPU'; N = 'EnableCPUQuota' },
              @{ P = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\Disk'; N = 'EnableDiskQuota' },
              @{ P = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\NetBandWidth'; N = 'EnableNetworkQuota' }
            ) | ForEach-Object { if (Test-Path $_.P) { Set-ItemProperty -Path $_.P -Name $_.N -Value 0 -Type DWord -Force } }

            $pt = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
            New-Item $pt -Force | Out-Null
            Set-ItemProperty $pt PowerThrottlingOff 1 -Type DWord -Force
            Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Type DWord -Force
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' -Name 'HwSchMode' -Value 2 -Type DWord -Force

            $mmPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
            New-Item -Path $mmPath -Force | Out-Null
            Set-ItemProperty -Path $mmPath -Name 'NetworkThrottlingIndex' -Value 4294967295 -Type DWord -Force
            Set-ItemProperty -Path $mmPath -Name 'SystemResponsiveness' -Value 0 -Type DWord -Force

            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'MenuShowDelay' -Value '0' -Force
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'AutoEndTasks' -Value '1' -Force

            & fsutil behavior set disablelastaccess 1 *> $null
            & fsutil behavior set disable8dot3 1 *> $null
            & netsh int tcp set global autotuninglevel=normal *> $null
            & netsh int tcp set global rss=enabled *> $null

            @('wuauserv','UsoSvc','DiagTrack','WSearch','SysMain','WerSvc','Spooler','MapsBroker','PcaSvc','RetailDemo') | ForEach-Object {
              Stop-Service -Name $_ -Force -EA SilentlyContinue
              Set-Service -Name $_ -StartupType Disabled -EA SilentlyContinue
            }
            try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch {}
          }

          $cpuObj = Get-CimInstance Win32_Processor -EA SilentlyContinue | Select-Object -First 1
          $cpuInfo = if ($cpuObj) { "$($cpuObj.Name.Trim()) ($($cpuObj.NumberOfLogicalProcessors) vCPU @ $($cpuObj.MaxClockSpeed)MHz)" } else { "$env:PROCESSOR_IDENTIFIER ($env:NUMBER_OF_PROCESSORS vCPU)" }
          "CPU_MODEL_INFO=$cpuInfo" >> $env:GITHUB_ENV
          Write-Host "✅ Đã cấu hình RDP 60FPS & Fix Lag Chuyên Sâu: $cpuInfo" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ───────────────────────────────────────────────
      # 5. MẠNG TAILSCALE & DUCKDNS
      # ───────────────────────────────────────────────
      - name: 🌐 Thiết Lập Mạng Tailscale & DuckDNS
        timeout-minutes: 5
        env:
          EN_TS: ${{ inputs.enable_tailscale }}
          EN_DNS: ${{ inputs.enable_duckdns }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tsIp = '127.0.0.1'; $tsStatus = 'DISABLED'; $funnelUrl = ''
          if ($env:EN_TS -eq 'true') {
            if (-not $env:TAILSCALE_AUTH_KEY) { $tsStatus = 'NO_KEY' } else {
              try {
                $ts = 'C:\Program Files\Tailscale\tailscale.exe'
                if (-not (Test-Path $ts)) {
                  $msi = "$env:INSTALLER_CACHE\tailscale.msi"
                  if (Test-Path $msi) { Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -NoNewWindow }
                }
                if (Test-Path $ts) {
                  Set-Service Tailscale -StartupType Automatic -EA SilentlyContinue
                  Start-Service Tailscale -EA SilentlyContinue
                  Start-Sleep -Seconds 3
                  & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=zenova-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)" --accept-routes --accept-dns --reset --unattended
                  if ($LASTEXITCODE -eq 0) {
                    & $ts set --unattended=true 2>&1 | Out-Null
                    1..15 | ForEach-Object {
                      if ($tsIp -eq '127.0.0.1') {
                        $ipOut = (& $ts ip -4 2>&1 | Out-String).Trim()
                        if ($ipOut -match '^\d+\.\d+\.\d+\.\d+$') { $tsIp = $ipOut; $tsStatus = 'CONNECTED' } else { Start-Sleep -Seconds 2 }
                      }
                    }
                    try {
                      & $ts funnel reset 2>&1 | Out-Null
                      & $ts funnel --bg $env:WEB_PORT 2>&1 | Out-Null
                      Start-Sleep -Seconds 2
                      $fStat = (& $ts funnel status 2>&1 | Out-String)
                      if ($fStat -match '(https://[^\s]+)') { $funnelUrl = $Matches[1].TrimEnd('/') }
                    } catch {}
                  } else { $tsStatus = 'AUTH_FAIL' }
                } else { $tsStatus = 'INSTALL_FAIL' }
              } catch { $tsStatus = 'ERROR' }
            }
          }
          "TAILSCALE_IP=$tsIp" >> $env:GITHUB_ENV; "FUNNEL_URL=$funnelUrl" >> $env:GITHUB_ENV; "TS_STATUS=$tsStatus" >> $env:GITHUB_ENV
          $pubIp = ''; try { $pubIp = (Invoke-WebRequest -Uri 'https://api.ipify.org' -UseBasicParsing -TimeoutSec 5).Content.Trim() } catch {}
          $ddnsUrl = ''
          if ($env:EN_DNS -eq 'true' -and $env:DUCKDNS_TOKEN -and $env:DUCKDNS_DOMAIN) {
            try {
              $targetIp = if ($tsIp -ne '127.0.0.1') { $tsIp } else { $pubIp }
              $cleanDom = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$', ''
              $res = (Invoke-WebRequest -Uri "https://www.duckdns.org/update?domains=$cleanDom&token=$env:DUCKDNS_TOKEN&ip=$targetIp" -UseBasicParsing -TimeoutSec 8).Content.Trim()
              if ($res -eq 'OK') { $ddnsUrl = "${cleanDom}.duckdns.org" }
            } catch {}
          }
          "DUCKDNS_URL=$ddnsUrl" >> $env:GITHUB_ENV; "DUCKDNS_PUBLIC_IP=$pubIp" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP: $tsIp [$tsStatus] | DuckDNS: $ddnsUrl" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ───────────────────────────────────────────────
      # 6. USER + ẢNH NỀN GỐC (CHỐNG MÀN HÌNH ĐEN 100%) + VDD + VB-AUDIO + SUNSHINE
      # ───────────────────────────────────────────────
      - name: 🖥️🔊☀️ User + Ảnh Nền Gốc Zenova (Fix Đen Màn Hình) + VDD + VB-Audio + Sunshine
        timeout-minutes: 6
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $sunPersist = $env:SUNSHINE_PERSIST_CFG
          $sunPortDir = "$env:SHARED_OS_DIR\Sunshine-Portable"
          $user = $env:RDP_USER
          $profPath = $env:PROFILE_PATH
          $pass = 'Aistv@2026'
          if (-not [string]::IsNullOrWhiteSpace($env:FIXED_PASS_INPUT)) { $pass = $env:FIXED_PASS_INPUT.Trim() }
          elseif ($env:RESTORE_PASS) { $pass = $env:RESTORE_PASS }

          # 1. CẤU HÌNH USER GỐC & MẬT KHẨU CỐ ĐỊNH
          try {
            & net accounts /maxpwage:unlimited *> $null
            $secCfg = "$env:RUNNER_TEMP\secpol.cfg"; $secDb = "$env:RUNNER_TEMP\secpol.sdb"
            & secedit /export /cfg $secCfg *> $null
            if (Test-Path $secCfg) {
              $rawSec = Get-Content -Raw $secCfg
              $rawSec = $rawSec -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0'
              $rawSec = $rawSec -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0'
              Set-Content -Path $secCfg -Value $rawSec -Encoding Unicode
              & secedit /configure /db $secDb /cfg $secCfg /areas SECURITYPOLICY *> $null
              Remove-Item $secCfg, $secDb -Force -EA SilentlyContinue
            }
          } catch {}

          $sp = ConvertTo-SecureString $pass -AsPlainText -Force
          try { Set-LocalUser -Name $user -Password $sp -PasswordNeverExpires $true -EA Stop } catch {}
          & net user $user $pass /active:yes /expires:never *> $null
          Add-LocalGroupMember -Group 'Administrators' -Member $user -EA SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -EA SilentlyContinue
          Enable-LocalUser -Name $user -EA SilentlyContinue
          "RDP_PASS=$pass" >> $env:GITHUB_ENV; "SUNSHINE_PASS=$pass" >> $env:GITHUB_ENV

          $wl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty $wl AutoAdminLogon '1' -Force; Set-ItemProperty $wl DefaultUserName $user -Force
          Set-ItemProperty $wl DefaultPassword $pass -Force; Set-ItemProperty $wl DefaultDomainName $env:COMPUTERNAME -Force

          # Khôi phục khóa DPAPI trình duyệt từ phiên trước
          try {
            Add-Type -AssemblyName System.Security -EA SilentlyContinue
            if (Test-Path "$profPath\AppData") {
              Get-ChildItem -Path "$profPath\AppData" -Filter 'Local State.aistvkey' -Recurse -File -Force -EA SilentlyContinue | ForEach-Object {
                try {
                  $keyFile = $_.FullName; $lsFile = $keyFile -replace '\.aistvkey$', ''
                  if (Test-Path $lsFile) {
                    $rawKey = [Convert]::FromBase64String((Get-Content -Raw $keyFile -Encoding ASCII).Trim())
                    $newEnc = [System.Security.Cryptography.ProtectedData]::Protect($rawKey, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser)
                    $dpapiPref = [System.Text.Encoding]::ASCII.GetBytes('DPAPI')
                    $finalBytes = New-Object byte[] ($dpapiPref.Length + $newEnc.Length)
                    [Array]::Copy($dpapiPref, 0, $finalBytes, 0, $dpapiPref.Length)
                    [Array]::Copy($newEnc, 0, $finalBytes, $dpapiPref.Length, $newEnc.Length)
                    $lsJson = Get-Content -Raw $lsFile -Encoding UTF8 | ConvertFrom-Json
                    if ($lsJson.os_crypt) {
                      $lsJson.os_crypt.encrypted_key = [Convert]::ToBase64String($finalBytes)
                      if ($lsJson.os_crypt.PSObject.Properties['app_bound_encrypted_key']) { $lsJson.os_crypt.PSObject.Properties.Remove('app_bound_encrypted_key') }
                      $lsJson | ConvertTo-Json -Depth 32 -Compress | Set-Content -Path $lsFile -Encoding UTF8 -Force
                    }
                  }
                } catch {}
              }
            }
          } catch {}

          # 2. CÀI MÀN HÌNH ẢO VDD & ÂM THANH ẢO VB-AUDIO
          $parts = $env:VDD_RES -split '[@x]'
          $w = if ($parts.Count -ge 1) { [int]$parts[0] } else { 1920 }
          $h = if ($parts.Count -ge 2) { [int]$parts[1] } else { 1080 }
          $hz = if ($parts.Count -ge 3) { [int]$parts[2] } else { 60 }

          try {
            $usbDir = 'C:\usbmmidd_v2'
            if (Test-Path "$ic\usbmmidd.zip") {
              New-Item -ItemType Directory -Force -Path $usbDir | Out-Null
              & 7z x "$ic\usbmmidd.zip" "-oC:\" -y -mmt=on *> $null
              if (-not (Test-Path "$usbDir\deviceinstaller64.exe")) {
                & 7z x "$ic\usbmmidd.zip" "-o$usbDir" -y -mmt=on *> $null
              }
            }
            if (Test-Path "$usbDir\deviceinstaller64.exe") {
              Push-Location $usbDir
              Get-ChildItem $usbDir -Filter '*.cer' -Recurse -EA SilentlyContinue | ForEach-Object {
                Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *> $null
                Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *> $null
              }
              & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null
              $wudf = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
              New-Item $wudf -Force | Out-Null
              Set-ItemProperty $wudf '0' '1920,1080,60' -Force
              Set-ItemProperty $wudf '1' '1920,1080,120' -Force
              Set-ItemProperty $wudf '2' '2560,1440,60' -Force
              Set-ItemProperty $wudf '3' '3840,2160,60' -Force
              & .\deviceinstaller64.exe enableidd 1 *> $null
              Pop-Location
            }
          } catch {}

          try {
            @('MMCSS','AudioEndpointBuilder','Audiosrv') | ForEach-Object { Set-Service -Name $_ -StartupType Automatic -EA SilentlyContinue; Start-Service -Name $_ -EA SilentlyContinue }
            $vbDir = "$ic\VBCable"
            if (Test-Path "$ic\VBCable.zip") { New-Item -ItemType Directory -Force $vbDir | Out-Null; & 7z x "$ic\VBCable.zip" "-o$vbDir" -y -mmt=on *> $null }
            Get-ChildItem $vbDir -Filter '*.cer' -EA SilentlyContinue | ForEach-Object {
              Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *> $null
              Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *> $null
            }
            $inf = Get-ChildItem $vbDir -Filter '*64*.inf' -EA SilentlyContinue | Select-Object -First 1
            if ($inf) {
              pnputil /add-driver $inf.FullName /install *> $null
              if (Test-Path 'C:\usbmmidd_v2\deviceinstaller64.exe') {
                Push-Location $inf.DirectoryName
                & 'C:\usbmmidd_v2\deviceinstaller64.exe' install $inf.Name 'VBAudioVACWDM' *> $null
                Pop-Location
              }
            }
            "AUDIO_DEVICE_NAME=VB-Audio Virtual Cable (Active)" >> $env:GITHUB_ENV
          } catch { "AUDIO_DEVICE_NAME=Windows Virtual Audio" >> $env:GITHUB_ENV }

          # 3. ÁP DỤNG NGUYÊN BẢN 100% ẢNH NỀN GỐC & FIX TRIỆT ĐỂ MÀN HÌNH ĐEN TRÊN WIN 22 & 25
          $wallDir = $env:WALLPAPER_DIR
          New-Item -ItemType Directory -Force -Path $wallDir | Out-Null
          $foundRepoImg = $null
          if ($env:GITHUB_WORKSPACE -and (Test-Path $env:GITHUB_WORKSPACE)) {
            $foundRepoImg = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Include '*Zenova*.png','*Zenova*.jpg','*Aurora*.png','*Aurora*.jpg','*Pagoda*.png','*Pagoda*.jpg','*wallpaper*.png','*wallpaper*.jpg' -Recurse -File -EA SilentlyContinue | Where-Object { $_.Length -gt 20KB } | Select-Object -First 1
            if (-not $foundRepoImg) {
              $foundRepoImg = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Include '*.png','*.jpg','*.jpeg' -Recurse -File -EA SilentlyContinue | Where-Object { $_.Length -gt 20KB } | Select-Object -First 1
            }
          }

          # Nếu không tìm thấy trong nhánh hiện tại, quét qua GitHub API tất cả các nhánh
          if (-not $foundRepoImg) {
            try {
              @($env:GITHUB_REF_NAME, 'main', 'master') | Select-Object -Unique | ForEach-Object {
                $br = $_
                if ((-not $foundRepoImg) -and $br) {
                  $treePaths = @(gh api "repos/$($env:GH_REPO)/git/trees/${br}?recursive=1" --jq '.tree[].path' 2>$null)
                  $imgRel = $treePaths | Where-Object { $_ -match '(?i)(zenova|aurora|pagoda|sunset|wallpaper).*\.(png|jpg|jpeg)$' } | Select-Object -First 1
                  if (-not $imgRel) { $imgRel = $treePaths | Where-Object { $_ -match '(?i)\.(png|jpg|jpeg)$' } | Select-Object -First 1 }
                  if ($imgRel) {
                    $ext = [System.IO.Path]::GetExtension($imgRel)
                    $dlWall = "$wallDir\Zenova-Original$ext"
                    $encPath = (($imgRel -split '/') | ForEach-Object { [System.Uri]::EscapeDataString($_) }) -join '/'
                    $rawUrl = "https://raw.githubusercontent.com/$($env:GH_REPO)/$br/$encPath"
                    & curl.exe -L --retry 3 -s -H "Authorization: token $($env:GH_TOKEN)" $rawUrl -o $dlWall 2>$null
                    if ((Test-Path $dlWall) -and ((Get-Item $dlWall).Length -gt 20KB)) { $foundRepoImg = Get-Item $dlWall }
                  }
                }
              }
            } catch {}
          }

          # Nếu đã có sẵn trong ổ ZENOVA-OS từ phiên trước
          if (-not $foundRepoImg) {
            $foundRepoImg = Get-ChildItem -Path $wallDir -Include 'Zenova-Original*','*.png','*.jpg' -File -EA SilentlyContinue | Where-Object { $_.Length -gt 20KB } | Select-Object -First 1
          }

          if ($foundRepoImg) {
            $origExt = $foundRepoImg.Extension
            $targetWall = "$wallDir\Zenova-Original$origExt"
            if ($foundRepoImg.FullName -ne $targetWall) {
              Copy-Item -Path $foundRepoImg.FullName -Destination $targetWall -Force
            }

            # Xóa mọi Policy chặn hình nền gây đen màn hình trên Windows Server 2022/2025
            @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop'
            ) | ForEach-Object {
              if (Test-Path $_) {
                Remove-ItemProperty -Path $_ -Name 'Wallpaper' -Force -EA SilentlyContinue
                Remove-ItemProperty -Path $_ -Name 'WallpaperStyle' -Force -EA SilentlyContinue
                Remove-ItemProperty -Path $_ -Name 'NoChangingWallPaper' -Force -EA SilentlyContinue
              }
            }
            Set-ItemProperty -Path 'HKCU:\Control Panel\Colors' -Name 'Background' -Value '15 23 42' -Force -EA SilentlyContinue

            # Ghi file ảnh gốc vào TranscodedWallpaper & Registry (Giữ nguyên 100% file gốc không chỉnh sửa)
            $themesDir = "$env:APPDATA\Microsoft\Windows\Themes"
            New-Item -ItemType Directory -Force -Path $themesDir | Out-Null
            Copy-Item -Path $targetWall -Destination "$themesDir\TranscodedWallpaper" -Force -EA SilentlyContinue
            Remove-Item -Path "$themesDir\CachedFiles\*" -Force -EA SilentlyContinue

            @('HKCU:\Control Panel\Desktop','Registry::HKEY_USERS\.DEFAULT\Control Panel\Desktop') | ForEach-Object {
              if (Test-Path $_) {
                Set-ItemProperty -Path $_ -Name 'Wallpaper' -Value $targetWall -Force -EA SilentlyContinue
                Set-ItemProperty -Path $_ -Name 'WallpaperStyle' -Value '10' -Force -EA SilentlyContinue
                Set-ItemProperty -Path $_ -Name 'TileWallpaper' -Value '0' -Force -EA SilentlyContinue
              }
            }

            # Tạo Script cưỡng bức nạp hình nền ngay khi Explorer/RDP khởi tạo (Chống màn hình đen 100%)
            $enforcerPs1 = 'C:\ALB-Apps\enforce-wallpaper.ps1'
            $enfLines = @(
              '$w = "' + $targetWall + '"',
              'if (Test-Path $w) {',
              '  Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -Value $w -Force -ErrorAction SilentlyContinue',
              '  Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "WallpaperStyle" -Value "10" -Force -ErrorAction SilentlyContinue',
              '  Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "TileWallpaper" -Value "0" -Force -ErrorAction SilentlyContinue',
              '  $cs = "using System; using System.Runtime.InteropServices; public class ZWall { [DllImport(`"user32.dll`", CharSet=CharSet.Unicode)] public static extern int SystemParametersInfo(int u, int p, string l, int f); }"',
              '  Add-Type -TypeDefinition $cs -ErrorAction SilentlyContinue',
              '  1..3 | ForEach-Object {',
              '    [ZWall]::SystemParametersInfo(20, 0, $w, 3) | Out-Null',
              '    & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True',
              '    Start-Sleep -Milliseconds 500',
              '  }',
              '}'
            )
            Set-Content -Path $enforcerPs1 -Value ($enfLines -join "`r`n") -Encoding UTF8 -Force
            & pwsh.exe -NoProfile -WindowStyle Hidden -File $enforcerPs1

            # Gắn vào Run (HKLM + HKCU) & Scheduled Task ONLOGON để khi vào RDP là áp ảnh ngay lập tức
            $runCmd = "pwsh.exe -NoProfile -WindowStyle Hidden -File `"$enforcerPs1`""
            Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'ZenovaWallpaper' -Value $runCmd -Force -EA SilentlyContinue
            Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'ZenovaWallpaper' -Value $runCmd -Force -EA SilentlyContinue
            & schtasks.exe /Create /TN "ALB-Enforce-Wallpaper" /TR $runCmd /SC ONLOGON /RU $user /RL HIGHEST /F *> $null

            "WALLPAPER_STATUS=$($foundRepoImg.Name) (Original 100% - Win 22 & 25)" >> $env:GITHUB_ENV
            Write-Host "✅ Đã áp dụng nguyên bản 100% ảnh nền gốc: $($foundRepoImg.Name)" -ForegroundColor Green
          } else {
            "WALLPAPER_STATUS=Chưa thấy file ảnh trong Repo" >> $env:GITHUB_ENV
          }

          # 4. CÀI ĐẶT & BẬT SUNSHINE (FIX TRIỆT ĐỂ LỖI KHÔNG VÀO ĐƯỢC LINK 47990)
          $sunDir = 'C:\Program Files\Sunshine'
          $sunExe = "$sunDir\sunshine.exe"
          if ((-not (Test-Path "$sunDir\assets")) -and (Test-Path "$sunPortDir\sunshine.exe") -and (Test-Path "$sunPortDir\assets")) {
            New-Item -ItemType Directory -Force -Path $sunDir | Out-Null
            robocopy $sunPortDir $sunDir /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
          }
          if ((-not (Test-Path $sunExe)) -or (-not (Test-Path "$sunDir\assets"))) {
            $inst = "$ic\sunshine-setup.exe"
            if ((Test-Path $inst) -and ((Get-Item $inst).Length -gt 5MB)) {
              $p = Start-Process -FilePath $inst -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $null = $p.WaitForExit(65000) }
            }
            if (-not (Test-Path $sunExe)) {
              & choco install sunshine -y --no-progress --limit-output --ignore-checksums *> $null
            }
            if ((Test-Path $sunExe) -and (Test-Path "$sunDir\assets")) {
              robocopy $sunDir $sunPortDir /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF '*.log' *> $null
            }
          }

          if (Test-Path $sunExe) {
            Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue
            Stop-Process -Name sunshine -Force -EA SilentlyContinue
            Start-Sleep -Seconds 1

            $uObj = Get-LocalUser -Name $user -EA SilentlyContinue
            if ($uObj) {
              & icacls $sunDir /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null
              & icacls $sunPersist /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null
            }

            $cfg = "$sunDir\config"
            if ((Test-Path $cfg) -and ((Get-Item $cfg -Force).Attributes -notmatch 'ReparsePoint')) {
              if (@(Get-ChildItem $sunPersist -Force -EA SilentlyContinue).Count -eq 0) {
                Copy-Item "$cfg\*" $sunPersist -Recurse -Force -EA SilentlyContinue
              }
              Remove-Item $cfg -Recurse -Force -EA SilentlyContinue
            }
            if (-not (Test-Path $cfg)) {
              New-Item -ItemType Junction $cfg -Target $sunPersist -Force | Out-Null
            }

            $conf = "$sunPersist\sunshine.conf"
            @(
              "sunshine_name = ZENOVA-$($env:MACHINE_ID)",
              "min_log_level = info",
              "origin_web_ui_allowed = wan",
              "upnp = disabled",
              "address_family = both"
            ) -join "`r`n" | Set-Content $conf -Encoding UTF8 -Force

            Remove-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -EA SilentlyContinue
            New-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -Direction Inbound -Action Allow -Program $sunExe -Profile Any | Out-Null

            # Đặt mật khẩu Sunshine cho user gốc (runneradmin)
            Push-Location $sunDir
            & $sunExe --creds $user $pass *> $null
            Pop-Location

            # Tạo file launch-sunshine.bat ép WorkingDirectory về C:\Program Files\Sunshine (Fix lỗi mất ./assets)
            $sunLauncher = "$sunDir\launch-sunshine.bat"
            @(
              '@echo off',
              'cd /d "C:\Program Files\Sunshine"',
              'start "" /b "C:\Program Files\Sunshine\sunshine.exe"'
            ) -join "`r`n" | Set-Content -Path $sunLauncher -Encoding ASCII -Force

            & schtasks.exe /Create /TN "ALB-Launch-Sunshine" /TR "`"$sunLauncher`"" /SC ONCE /ST 00:00 /RU $user /RL HIGHEST /F *> $null
            & schtasks.exe /Run /TN "ALB-Launch-Sunshine" *> $null

            # Khởi chạy tách rời qua WMI với CurrentDirectory chuẩn để GitHub Runner không bao giờ kill tiến trình
            $null = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine = '"C:\Program Files\Sunshine\sunshine.exe"'
              CurrentDirectory = 'C:\Program Files\Sunshine'
            } -EA SilentlyContinue

            $portOk = $false; $deadline = (Get-Date).AddSeconds(12)
            while ((Get-Date) -lt $deadline) {
              try {
                $tcp = [System.Net.Sockets.TcpClient]::new()
                if ($tcp.ConnectAsync('127.0.0.1', 47990).Wait(400)) { $tcp.Close(); $portOk = $true; break }
                $tcp.Close()
              } catch {}
              Start-Sleep -Milliseconds 400
            }
            Write-Host "✅ Sunshine Web UI (Port 47990): $(if ($portOk) { 'ONLINE 100%' } else { 'STARTING' }) | User: $user | Pass: $pass" -ForegroundColor Green
          }

          'SESSION_READY=1' >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0

      # ───────────────────────────────────────────────
      # 7. CÀI SIÊU TỐC ĐẦY ĐỦ APP + FIX DISCORD + SẮP XẾP GỌN GÀNG & CHỐNG TRÙNG LẶP
      # ───────────────────────────────────────────────
      - name: 📦 Cài Siêu Tốc Đầy Đủ App + Fix Discord + Sắp Xếp Gọn Gàng Không Trùng Lặp
        timeout-minutes: 7
        shell: pwsh
        env:
          CHOCO_PKGS: ${{ inputs.choco_packages }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $userDesk = "$env:PROFILE_PATH\Desktop"
          $pubDesk = 'C:\Users\Public\Desktop'
          $startupDir = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"
          $locData = $env:LOCALAPPDATA
          $appData = $env:APPDATA
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -EA SilentlyContinue)
          New-Item -ItemType Directory -Force -Path $userDesk, $pubDesk, $startupDir, 'C:\ALB-Apps\EVKey' | Out-Null

          function Start-FastJob {
            param([scriptblock]$Block, [object[]]$ArgsList)
            if ($hasTJ) { return Start-ThreadJob -ScriptBlock $Block -ArgumentList $ArgsList }
            else { return Start-Job -ScriptBlock $Block -ArgumentList $ArgsList }
          }

          # 1. VSCode (Giải nén trực tiếp bản Archive vào C:\Program Files\Microsoft VS Code chỉ mất 3 giây)
          $j1 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            $vsDir = 'C:\Program Files\Microsoft VS Code'
            if ((-not (Test-Path "$vsDir\Code.exe")) -and (Test-Path "$ic\VSCode-win32-x64.zip")) {
              New-Item -ItemType Directory -Force -Path $vsDir | Out-Null
              & 7z x "$ic\VSCode-win32-x64.zip" "-o$vsDir" -y -mmt=on *> $null
            }
          }

          # 2. EVKey Tiếng Việt
          $j2 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            $ev = 'C:\ALB-Apps\EVKey'
            if ((-not (Test-Path "$ev\EVKey64.exe")) -and (Test-Path "$ic\EVKey.zip")) {
              & 7z x "$ic\EVKey.zip" "-o$ev" -y -mmt=on *> $null
            }
          }

          # 3. Spotify
          $j3 = Start-FastJob -ArgsList @($ic, $locData) -Block {
            param($ic, $locData)
            if ((-not (Test-Path "$locData\Spotify\Spotify.exe")) -and (Test-Path "$ic\Spotify.exe")) {
              $p = Start-Process "$ic\Spotify.exe" -ArgumentList '/silent','/skip-app-launch' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $null = $p.WaitForExit(45000) }
            }
          }

          # 4. Bandicam
          $j4 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            $exe = 'C:\Program Files\Bandicam\bdcam.exe'
            if ((-not (Test-Path $exe)) -and (Test-Path "$ic\bdcam.exe")) {
              $p = Start-Process "$ic\bdcam.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $null = $p.WaitForExit(45000) }
            }
          }

          # 5. StarDesk Remote
          $j5 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            $exe = 'C:\Program Files\StarDesk\StarDesk.exe'
            if ((-not (Test-Path $exe)) -and (Test-Path "$ic\StarDesk.exe") -and ((Get-Item "$ic\StarDesk.exe").Length -gt 5MB)) {
              $p = Start-Process "$ic\StarDesk.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $null = $p.WaitForExit(45000) }
            }
          }

          # 6. Discord (FIX TRIỆT ĐỂ: Bung chuẩn cấu trúc Squirrel Update.exe + packages\RELEASES + app-1.0.x + SKIP_HOST_UPDATE)
          $j6 = Start-FastJob -ArgsList @($ic, $locData, $appData) -Block {
            param($ic, $locData, $appData)
            $dcRoot = "$locData\Discord"
            $existingExe = Get-ChildItem "$dcRoot\app-*" -Filter 'Discord.exe' -EA SilentlyContinue | Select-Object -First 1
            if ((-not $existingExe) -and (Test-Path "$ic\DiscordSetup.exe")) {
              $tmpDc = "$ic\dc-unpack"
              if (Test-Path $tmpDc) { Remove-Item $tmpDc -Recurse -Force -EA SilentlyContinue }
              New-Item -ItemType Directory -Force -Path $tmpDc, "$dcRoot\packages" | Out-Null

              & 7z x "$ic\DiscordSetup.exe" "-o$tmpDc" -y -mmt=on *> $null
              if (Test-Path "$tmpDc\Update.exe") {
                Copy-Item "$tmpDc\Update.exe" "$dcRoot\Update.exe" -Force -EA SilentlyContinue
              }
              if (Test-Path "$tmpDc\RELEASES") {
                Copy-Item "$tmpDc\RELEASES" "$dcRoot\packages\RELEASES" -Force -EA SilentlyContinue
              }
              $nupkg = Get-ChildItem $tmpDc -Filter 'Discord-*.nupkg' -EA SilentlyContinue | Select-Object -First 1
              if ($nupkg) {
                Copy-Item $nupkg.FullName "$dcRoot\packages\$($nupkg.Name)" -Force -EA SilentlyContinue
                $ver = '1.0.9175'
                if ($nupkg.Name -match 'Discord-([0-9\.]+)-full') { $ver = $Matches[1] }
                $appVerDir = "$dcRoot\app-$ver"
                New-Item -ItemType Directory -Force -Path $appVerDir | Out-Null
                & 7z x $nupkg.FullName "-o$tmpDc\pkg" -y -mmt=on *> $null
                if (Test-Path "$tmpDc\pkg\lib\net45") {
                  robocopy "$tmpDc\pkg\lib\net45" $appVerDir /E /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
                }
              }
              Remove-Item $tmpDc -Recurse -Force -EA SilentlyContinue
            }
            # Chống kẹt vòng lặp Update khi mở Discord trên Windows Server 2022/2025
            $dcRoam = "$appData\discord"
            New-Item -ItemType Directory -Force -Path $dcRoam | Out-Null
            if (-not (Test-Path "$dcRoam\settings.json")) {
              '{"SKIP_HOST_UPDATE":true,"BACKGROUND_COLOR":"#202225"}' | Set-Content "$dcRoam\settings.json" -Encoding UTF8 -Force
            }
          }

          # 7. Roblox Player
          $j7 = Start-FastJob -ArgsList @($ic, $locData) -Block {
            param($ic, $locData)
            if ((-not (Test-Path "$locData\Roblox\Versions")) -and (Test-Path "$ic\Roblox.exe")) {
              $p = Start-Process "$ic\Roblox.exe" -ArgumentList '-q','--no-ui' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $null = $p.WaitForExit(50000) }
            }
          }

          $allJobs = @($j1, $j2, $j3, $j4, $j5, $j6, $j7)
          $null = Wait-Job -Job $allJobs -Timeout 75
          $allJobs | Remove-Job -Force -EA SilentlyContinue

          # ══════════════════════════════════════════════════════════════════
          # DỌN SẠCH 100% ICON TRÙNG LẶP & SẮP XẾP GỌN GÀNG TRÊN WIN 22 & 25
          # ══════════════════════════════════════════════════════════════════
          @($userDesk, $pubDesk) | ForEach-Object {
            $d = $_
            if (Test-Path $d) {
              Get-ChildItem -Path $d -Include '*.lnk','*.url','*.bat' -File -Force -EA SilentlyContinue | Remove-Item -Force -EA SilentlyContinue
            }
          }

          $ws = New-Object -ComObject WScript.Shell
          function New-CleanShortcut {
            param([string]$Title, [string]$Target, [string]$Arguments = '', [string]$WorkDir = '')
            if (Test-Path $Target) {
              $lnk = $ws.CreateShortcut("$pubDesk\$Title.lnk")
              $lnk.TargetPath = $Target
              if ($Arguments) { $lnk.Arguments = $Arguments }
              if ($WorkDir) { $lnk.WorkingDirectory = $WorkDir } else { $lnk.WorkingDirectory = [System.IO.Path]::GetDirectoryName($Target) }
              $lnk.Save()
            }
          }

          function New-CleanUrl {
            param([string]$Title, [string]$Url)
            @(
              '[InternetShortcut]',
              "URL=$Url",
              'IconIndex=0'
            ) -join "`r`n" | Set-Content -Path "$pubDesk\$Title.url" -Encoding ASCII -Force
          }

          # 1. Nhóm Hệ Thống & Quản Lý (01 -> 05)
          $lnkDrive = $ws.CreateShortcut("$pubDesk\01. Ổ Đĩa Riêng ZENOVA-OS ($($env:MOUNT_LETTER)).lnk")
          $lnkDrive.TargetPath = "$($env:MOUNT_LETTER):\"
          $lnkDrive.Save()

          $lnkData = $ws.CreateShortcut("$pubDesk\02. Thư Mục Dữ Liệu ZENOVA.lnk")
          $lnkData.TargetPath = $env:SHARED_DATA_DIR
          $lnkData.Save()

          New-CleanUrl -Title '03. Web Quản Lý VPS' -Url "http://127.0.0.1:$($env:WEB_PORT)/"
          New-CleanUrl -Title '04. Sunshine Web UI' -Url "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"

          $tsconBat = "$pubDesk\05. Ngắt RDP Giữ Màn Hình.bat"
          @(
            '@echo off',
            'for /f "tokens=3-4" %%a in (''query session %USERNAME%'') do @if "%%b"=="Active" tscon %%a /dest:console'
          ) -join "`r`n" | Set-Content -Path $tsconBat -Encoding ASCII -Force

          # 2. Nhóm Ứng Dụng (06 -> 13) - Mỗi App đúng 1 Icon duy nhất, không bao giờ trùng
          $chromeExe = if (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') { 'C:\Program Files\Google\Chrome\Application\chrome.exe' } elseif (Test-Path 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe') { 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' } else { $null }
          if ($chromeExe) { New-CleanShortcut -Title '06. Trình Duyệt Web' -Target $chromeExe }

          if (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe') {
            New-CleanShortcut -Title '07. Visual Studio Code' -Target 'C:\Program Files\Microsoft VS Code\Code.exe'
          }

          $dcExeObj = Get-ChildItem "$locData\Discord\app-*" -Filter 'Discord.exe' -EA SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($dcExeObj) {
            New-CleanShortcut -Title '08. Discord' -Target $dcExeObj.FullName -WorkDir $dcExeObj.DirectoryName
          }

          if (Test-Path "$locData\Spotify\Spotify.exe") {
            New-CleanShortcut -Title '09. Spotify' -Target "$locData\Spotify\Spotify.exe"
          }

          if (Test-Path 'C:\Program Files\Bandicam\bdcam.exe') {
            New-CleanShortcut -Title '10. Bandicam' -Target 'C:\Program Files\Bandicam\bdcam.exe'
          }

          $evExe = if (Test-Path 'C:\ALB-Apps\EVKey\EVKey64.exe') { 'C:\ALB-Apps\EVKey\EVKey64.exe' } elseif (Test-Path 'C:\ALB-Apps\EVKey\EVKey32.exe') { 'C:\ALB-Apps\EVKey\EVKey32.exe' } else { $null }
          if ($evExe) {
            New-CleanShortcut -Title '11. EVKey Tiếng Việt' -Target $evExe
            $stEv = $ws.CreateShortcut("$startupDir\EVKey.lnk")
            $stEv.TargetPath = $evExe
            $stEv.Save()
            Start-Process $evExe -WorkingDirectory 'C:\ALB-Apps\EVKey' -EA SilentlyContinue
          }

          if (Test-Path 'C:\Program Files\StarDesk\StarDesk.exe') {
            New-CleanShortcut -Title '12. StarDesk Remote' -Target 'C:\Program Files\StarDesk\StarDesk.exe'
            Get-Service -Name '*StarDesk*' -EA SilentlyContinue | ForEach-Object {
              Set-Service -Name $_.Name -StartupType Automatic -EA SilentlyContinue
              Start-Service -Name $_.Name -EA SilentlyContinue
            }
            & schtasks.exe /Create /TN "AISTV-Launch-StarDesk" /TR "`"C:\Program Files\StarDesk\StarDesk.exe`"" /SC ONCE /ST 00:00 /RU $env:RDP_USER /RL HIGHEST /IT /F *> $null
            & schtasks.exe /Run /TN "AISTV-Launch-StarDesk" *> $null
          }

          $rbExeObj = Get-ChildItem "$locData\Roblox\Versions" -Filter 'RobloxPlayerBeta.exe' -Recurse -EA SilentlyContinue | Select-Object -First 1
          if ($rbExeObj) {
            New-CleanShortcut -Title '13. Roblox Player' -Target $rbExeObj.FullName
          } elseif (Test-Path "$ic\Roblox.exe") {
            New-CleanShortcut -Title '13. Roblox Player' -Target "$ic\Roblox.exe"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:CHOCO_PKGS)) {
            $pkgs = $env:CHOCO_PKGS -split '[,\s]+' | Where-Object { $_ }
            $pkgs | ForEach-Object { & choco install $_ -y --no-progress --limit-output 2>&1 | Out-Null }
          }

          Write-Host "✅ Đã cài đủ App, sửa xong Discord và sắp xếp gọn gàng 13 lối tắt không trùng lặp trên Desktop!" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ───────────────────────────────────────────────
      # 8. KHỞI CHẠY WEB QUẢN LÝ VPS & SUNSHINE (TÍCH HỢP TỪ 4 FILE GỐC)
      # ───────────────────────────────────────────────
      - name: 🌐 Khởi chạy Web Quản Lý VPS & Sunshine (Port 8080 - Win 22 & 25)
        shell: pwsh
        timeout-minutes: 3
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
        run: |
          $port = $env:WEB_PORT
          $tsIp = $env:TAILSCALE_IP

          $stateObj = [ordered]@{
            machineId = $env:MACHINE_ID
            releaseTag = $env:RELEASE_TAG
            user = $env:RDP_USER
            password = $env:RDP_PASS
            windowsImage = $env:WINDOWS_IMAGE
            driveLetter = $env:MOUNT_LETTER
            tailscaleIp = $tsIp
            funnelUrl = $env:FUNNEL_URL
            durationMinutes = [int]$env:TOTAL_MINUTES
            lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $stateObj | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path $env:SHARED_STATE_FILE -Encoding UTF8

          $webLines = @(
            '$ErrorActionPreference = "Continue"',
            '$listener = [System.Net.HttpListener]::new()',
            '$listener.Prefixes.Add("http://+:$($env:WEB_PORT)/")',
            '$listener.Start()',
            '$endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60)',
            'while ($listener.IsListening) {',
            '  try {',
            '    $ctx = $listener.GetContext()',
            '    $req = $ctx.Request',
            '    $resp = $ctx.Response',
            '    $path = $req.Url.AbsolutePath.ToLower()',
            '    $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()',
            '    $remain = [math]::Max(0, ($endEpoch) - ($now))',
            '    $h = [math]::Floor(($remain) / 3600)',
            '    $m = [math]::Floor((($remain) % 3600) / 60)',
            '    $s = ($remain) % 60',
            '    if (($path -eq "/api/status") -or ($path -eq "/health")) {',
            '      $st = [ordered]@{ machineId = "$env:MACHINE_ID"; releaseTag = "$env:RELEASE_TAG"; status = "ok"; remaining_seconds = $remain; remaining_display = "${h}h${m}m${s}s"; tailscale_ip = "$env:TAILSCALE_IP"; drive = "$env:MOUNT_LETTER"; drive_label = "ZENOVA-OS"; cpu = "$env:CPU_MODEL_INFO" } | ConvertTo-Json -Compress',
            '      $buf = [System.Text.Encoding]::UTF8.GetBytes("$st")',
