          }
          if (-not $foundRepoImg) {
            $foundRepoImg = Get-ChildItem -Path $wallDir -Include 'Zenova-Original*','*.png','*.jpg' -File -EA SilentlyContinue | Where-Object { $_.Length -gt 20KB } | Select-Object -First 1
