name: ALB-VPSFREE

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy & bản lưu riêng'
        required: false
        default: 'may-phu-2'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h00m'
        type: choice
        options: ['1h', '3h', '5h00m']
      auto_restart:
        description: '🔁 Tự khởi động phiên mới'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng VHDX (GB)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu cố định RDP & Sunshine'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      choco_packages:
        description: '📦 App cài thêm bằng choco'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu Windows'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Bật Tailscale Funnel'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'may-phu-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'

    steps:
      - name: 🧱 Dựng ổ đĩa riêng & thông số kho lưu
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV"
          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', ''
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'may-phu-1' }
          $relTag = "alb-storage-$cleanId"; $stateBranch = "alb-state-$cleanId"
          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV"; "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV"; "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV"
          $total = 300; $display = '5 giờ 00 phút'
          if ("$env:INPUT_DURATION" -eq '1h') { $total = 60; $display = '1 giờ' } elseif ("$env:INPUT_DURATION" -eq '3h') { $total = 180; $display = '3 giờ' }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV"; "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV"
          $user = "$env:USERNAME"; $profPath = "$env:USERPROFILE"
          "RDP_USER=$user" >> "$env:GITHUB_ENV"; "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV"
          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper()
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV"
          $vhdContainer = 'C:\ALB-VHD-HOST'; New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'alb-os-disk.vhdx')
          $sizeBytes = ([int64]"$env:VHD_SIZE_GB") * 1GB
          $mounted = $false
          try {
              if (-not (Test-Path "$vhdFile")) { New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ALB-OS' -Confirm:($false) | Out-Null }
              else { Mount-VHD -Path "$vhdFile" }
              $null = Get-PSDrive -Name "$dl" -ErrorAction Stop; if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {}
          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT'); New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null
              & subst "${dl}:" "$fallbackDir"
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue
          }
          $sharedRoot = "${dl}:\ALB-SYSTEM"; $sharedSessionDir = "$sharedRoot\sessions"; $sharedDataDir = "$sharedRoot\DATA"; $sharedOsDir = "$sharedRoot\OS-OVERLAY"; $sharedStateFile = "$sharedSessionDir\rdp-session-state.json"; $profileStoreRoot = "$sharedRoot\Users"; $baselineFile = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json'); $controlSignal = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'alb-control-action.txt')
          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps") | ForEach-Object { New-Item -ItemType Directory -Force -Path "$_" | Out-Null }
          $baseline = @{ PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name); PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name); PD = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) }
          $baseline | ConvertTo-Json -Depth 4 | Set-Content -Path "$baselineFile" -Encoding UTF8
          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV"; "VHD_FILE=$vhdFile" >> "$env:GITHUB_ENV"; "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV"; "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV"; "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV"; "SHARED_OS_DIR=$sharedOsDir" >> "$env:GITHUB_ENV"; "SHARED_STATE_FILE=$sharedStateFile" >> "$env:GITHUB_ENV"; "PROFILE_ROOT=$profileStoreRoot" >> "$env:GITHUB_ENV"; "BASELINE_FILE=$baselineFile" >> "$env:GITHUB_ENV"; "CONTROL_SIGNAL_FILE=$controlSignal" >> "$env:GITHUB_ENV"
          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild
          "OS_BUILD=$build" >> "$env:GITHUB_ENV"
          $null = gh release view "$relTag" --repo "$env:GH_REPO" 2>&1
          if (($LASTEXITCODE) -ne 0) {
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt'); Set-Content -Path "$dummy" -Value "ALB Storage Init for $cleanId" -Encoding UTF8
              gh release create "$relTag" "$dummy" --repo "$env:GH_REPO" --title "ALB Storage ($cleanId)" --notes "Kho lưu tự động của máy [$cleanId]"
          }
          $global:LASTEXITCODE = 0; Write-Host "OK mount ${dl}:\ | May: $cleanId" -ForegroundColor Green

      - name: 🧰 Tạo save-data.ps1 (LƯU STARDESK + EVKEY + SPOTIFY)
        shell: pwsh
        run: |
          $scriptLines = @(
              'param([string]$Reason = "session-end")'
              '$ErrorActionPreference = "Continue"'
              'if ("$env:DATA_RESTORED" -ne "1") { exit 0 }'
              '$root = "$env:SHARED_ROOT"; $osDir = "$env:SHARED_OS_DIR"; $dl = "$env:MOUNT_LETTER"'
              'if ((-not ("$root")) -or (-not (Test-Path "$root"))) { exit 0 }'
              'try { $drive = Get-PSDrive -Name "$dl" -ErrorAction Stop; $freeGB = [math]::Round($drive.Free / 1GB, 2); if ($freeGB -lt 2) { exit 1 } } catch {}'
              '$appsToClose = @("chrome","msedge","brave","firefox","coccoc","opera","vivaldi","discord","Telegram","Zalo","steam","EpicGamesLauncher","Spotify","Code","Notion","StarDesk","EVKey","EVKey64")'
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow() }; Start-Sleep -Seconds 3'
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue'
              'if ("$Reason" -eq "session-end") { Get-Service -Name "*StarDesk*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue; Get-Process -Name "StarDesk*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; & taskkill.exe /F /IM "StarDesk*" /T *> $null }'
              'Start-Sleep -Seconds 2; Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue'
              '$u = "$env:RDP_USER"; $profSrc = "$env:PROFILE_PATH"'
              'if (("$profSrc") -and (Test-Path "$profSrc\AppData")) { Get-ChildItem -Path "$profSrc\AppData" -Filter "Local State" -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object { try { $lsFile = $_.FullName; $lsJson = Get-Content -Raw -Path "$lsFile" -Encoding UTF8 | ConvertFrom-Json; if ($lsJson.os_crypt -and $lsJson.os_crypt.encrypted_key) { $encBytes = [Convert]::FromBase64String($lsJson.os_crypt.encrypted_key); if ($encBytes.Length -gt 5) { $prefix = [System.Text.Encoding]::ASCII.GetString($encBytes[0..4]); if ($prefix -eq "DPAPI") { $cipher = $encBytes[5..($encBytes.Length - 1)]; $rawKey = [System.Security.Cryptography.ProtectedData]::Unprotect($cipher, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser); [Convert]::ToBase64String($rawKey) | Set-Content -Path "$lsFile.albkey" -Encoding ASCII -Force } } } } catch {} } }'
              '$regBk = [System.IO.Path]::Combine("$osDir", "Registry"); New-Item -ItemType Directory -Force -Path "$regBk" | Out-Null'
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null; reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x86.reg" /y *> $null'
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null; reg export "HKLM\SOFTWARE\Microsoft\Cryptography" "$regBk\Machine-Cryptography.reg" /y *> $null; reg export "HKLM\SOFTWARE\Microsoft\SQMClient" "$regBk\Machine-SQMClient.reg" /y *> $null'
              'New-Item -ItemType Directory -Force -Path "$regBk\AppSoftware" | Out-Null'
              'Get-ChildItem "HKCU:\Software" -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -notin @("Microsoft","Classes","Policies","RegisteredApplications") } | ForEach-Object { $subName = $_.PSChildName; $safeName = ($subName -replace "[^A-Za-z0-9._\-]", "_"); reg export "HKCU\Software\$subName" "$regBk\AppSoftware\App-$safeName.reg" /y *> $null }'
              'reg export "HKCU\Environment" "$regBk\User-Env.reg" /y *> $null; reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" "$regBk\User-StartupRun.reg" /y *> $null'
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\Configuration" "$regBk\Display-Config.reg" /y *> $null; reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\Connectivity" "$regBk\Display-Conn.reg" /y *> $null; reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\ScaleFactors" "$regBk\Display-Scale.reg" /y *> $null'
              'reg export "HKCU\Control Panel\Desktop" "$regBk\User-Desktop.reg" /y *> $null; reg export "HKCU\Control Panel\Desktop\WindowMetrics" "$regBk\User-WindowMetrics.reg" /y *> $null; reg export "HKCU\Control Panel\Personalization" "$regBk\User-Personalization.reg" /y *> $null; reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" "$regBk\User-Themes.reg" /y *> $null; reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" "$regBk\User-Wallpapers.reg" /y *> $null; reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" "$regBk\User-Explorer.reg" /y *> $null; reg export "HKCU\Software\Microsoft\Multimedia\Audio" "$regBk\User-Audio.reg" /y *> $null; reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio" "$regBk\System-MMDevices-Audio.reg" /y *> $null'
              'if (("$u") -and ("$profSrc") -and (Test-Path "$profSrc")) { $profDst = [System.IO.Path]::Combine("$root", "Users", "$u"); New-Item -ItemType Directory -Force -Path "$profDst" | Out-Null; $excludeDirs = @("$profSrc\AppData\Roaming\Microsoft\Protect","$profSrc\AppData\Roaming\Microsoft\Crypto","$profSrc\AppData\Local\Microsoft\Credentials","$profSrc\AppData\Roaming\Microsoft\Credentials","$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages","$profSrc\AppData\Local\TileDataLayer","$profSrc\AppData\Local\ConnectedDevicesPlatform","$profSrc\AppData\Local\Microsoft\Windows\Explorer","$profSrc\AppData\Local\Microsoft\Windows\INetCache","$profSrc\AppData\Local\Microsoft\Windows\WebCache","$profSrc\AppData\Local\Microsoft\Windows\Caches","$profSrc\AppData\Local\D3DSCache"); robocopy "$profSrc" "$profDst" /MIR /XJ /R:2 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* WebCacheV01.dat parent.lock lockfile SingletonLock SingletonCookie SingletonSocket /XD @excludeDirs *> $null; $global:LASTEXITCODE = 0 }'
              'if (("$env:BASELINE_FILE") -and (Test-Path "$env:BASELINE_FILE")) { try { $base = Get-Content -Raw -Path "$env:BASELINE_FILE" | ConvertFrom-Json; $skipNames = @("Tailscale","chocolatey","Package Cache","Microsoft","Windows Defender"); $cOverlay = [System.IO.Path]::Combine("$osDir", "C-Drive-Overlay"); New-Item -ItemType Directory -Force -Path "$cOverlay\PF64" | Out-Null; New-Item -ItemType Directory -Force -Path "$cOverlay\PF86" | Out-Null; New-Item -ItemType Directory -Force -Path "$cOverlay\PD" | Out-Null; Get-ChildItem "C:\Program Files" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PF64)) -and ($_.Name -notin ($skipNames)) } | ForEach-Object { $dest = [System.IO.Path]::Combine("$cOverlay\PF64", $_.Name); robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }; Get-ChildItem "C:\Program Files (x86)" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PF86)) -and ($_.Name -notin $skipNames) } | ForEach-Object { $dest = [System.IO.Path]::Combine("$cOverlay\PF86", $_.Name); robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }; Get-ChildItem "C:\ProgramData" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PD)) -and ($_.Name -notin $skipNames) } | ForEach-Object { $dest = [System.IO.Path]::Combine("$cOverlay\PD", $_.Name); robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null } } catch {} }'
              '$sdBackupDir = [System.IO.Path]::Combine("$osDir", "StarDesk-Backup")'
              'if (Test-Path "$sdBackupDir") { Remove-Item -Path "$sdBackupDir" -Recurse -Force -ErrorAction SilentlyContinue }'
              'New-Item -ItemType Directory -Force -Path "$sdBackupDir" | Out-Null'
              'if (Test-Path "C:\Program Files\StarDesk") { robocopy "C:\Program Files\StarDesk" "$sdBackupDir\ProgramFiles" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
              'if (Test-Path "C:\ProgramData\StarDesk") { robocopy "C:\ProgramData\StarDesk" "$sdBackupDir\ProgramData" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
              'if (Test-Path "$env:LOCALAPPDATA\StarDesk") { robocopy "$env:LOCALAPPDATA\StarDesk" "$sdBackupDir\LocalAppData" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
              'if (Test-Path "$env:APPDATA\StarDesk") { robocopy "$env:APPDATA\StarDesk" "$sdBackupDir\RoamingAppData" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
              'if (Test-Path "$env:USERPROFILE\.stardesk") { robocopy "$env:USERPROFILE\.stardesk" "$sdBackupDir\DotStarDesk" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
              '$sdRegDir = [System.IO.Path]::Combine("$sdBackupDir", "Registry"); New-Item -ItemType Directory -Force -Path "$sdRegDir" | Out-Null'
              'reg export "HKCU\Software\StarDesk" "$sdRegDir\HKCU-StarDesk.reg" /y *> $null; reg export "HKLM\SOFTWARE\StarDesk" "$sdRegDir\HKLM-StarDesk.reg" /y *> $null; reg export "HKLM\SOFTWARE\WOW6432Node\StarDesk" "$sdRegDir\HKLM-WOW6432-StarDesk.reg" /y *> $null'
              '$evKeyDir = [System.IO.Path]::Combine("$osDir", "EVKey"); if (Test-Path "$evKeyDir") { Remove-Item -Path "$evKeyDir" -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path "$evKeyDir" | Out-Null; if (Test-Path "C:\ALB-Apps\EVKey") { robocopy "C:\ALB-Apps\EVKey" "$evKeyDir" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
              '$gitStage = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "git-state-sync")'
              'try { if (Test-Path "$gitStage") { Remove-Item -Path "$gitStage" -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path "$gitStage" | Out-Null; Push-Location "$gitStage"; git init -q; git config user.name "ALB-Bot"; git config user.email "bot@alb.local"; $encodedToken = [System.Uri]::EscapeDataString($env:GH_TOKEN); git remote add origin "https://x-access-token:$encodedToken@github.com/$($env:GH_REPO).git"; git fetch origin "$env:STATE_BRANCH" -q 2>$null; if (($LASTEXITCODE) -eq 0) { git checkout -B "$env:STATE_BRANCH" "origin/$env:STATE_BRANCH" -q } else { git checkout --orphan "$env:STATE_BRANCH" -q }; robocopy "$env:SHARED_SESSION_DIR" "$gitStage\sessions" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null; robocopy "$regBk" "$gitStage\registry" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0; git add -A; git commit -m "Sync state [$env:MACHINE_ID]" -q 2>$null; git push -u origin "$env:STATE_BRANCH" --force -q 2>$null; Pop-Location } catch { if (((Get-Location).Path) -eq "$gitStage") { Pop-Location } }'
              '$packDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "alb-pack-$Reason"); if (Test-Path "$packDir") { Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path "$packDir" | Out-Null'
              '$archiveBase = [System.IO.Path]::Combine("$packDir", "alb-drive.7z"); Push-Location "$root"; $sevenZipArgs = @("a", "-t7z", "-mx=1", "-mmt=2", "-ssw", "-v1900m", "$archiveBase", "*", "-xr!Pagefile.sys", "-xr!swapfile.sys", "-xr!System Volume Information"); & 7z @sevenZipArgs *> $null; $sevenZipCode = $LASTEXITCODE; Pop-Location'
              '$chunks = @(Get-ChildItem -Path "$packDir" -Filter "alb-drive.7z.*" | Sort-Object Name); if (($chunks.Count) -eq 0) { exit 1 }'
              '$manifest = [ordered]@{ machineId = "$env:MACHINE_ID"; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); reason = "$Reason"; chunkCount = $chunks.Count; chunks = @($chunks | ForEach-Object { [ordered]@{ name = $_.Name; size = $_.Length } }) }'
              '$manifestPath = [System.IO.Path]::Combine("$packDir", "drive-manifest.json"); $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "$manifestPath" -Encoding UTF8'
              '$uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @("$manifestPath"); $uploadOk = $false'
              'for ($i = 1; $i -le 3; $i++) { $allOk = $true; foreach ($f in $uploadFiles) { gh release upload "$env:RELEASE_TAG" "$f" --repo "$env:GH_REPO" --clobber; if (($LASTEXITCODE) -ne 0) { $allOk = $false }; Start-Sleep -Seconds 1 }; if ($allOk) { $uploadOk = $true; break }; Start-Sleep -Seconds 10 }'
              'if (-not $uploadOk) { exit 1 }'
              'try { $relJson = gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" --json assets | ConvertFrom-Json; $validNames = @($chunks.Name) + @("drive-manifest.json", "init.txt"); @($relJson.assets) | ForEach-Object { if (($_.name -like "alb-drive.7z.*") -and ($_.name -notin ($validNames))) { gh release delete-asset "$env:RELEASE_TAG" ($_.name) --repo "$env:GH_REPO" -y *> $null } } } catch {}'
              'Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue; Write-Host "[$Reason] Da luu o dia [$env:MACHINE_ID]!" -ForegroundColor Green; exit 0'
          )
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1')
          Set-Content -Path "$saveScriptPath" -Value ($scriptLines -join "`r`n") -Encoding UTF8

      - name: ♻️ Khôi phục ổ đĩa & Profile
        shell: pwsh
        run: |
          $dl = "$env:MOUNT_LETTER"
          @('HKLM:\SOFTWARE\Policies\Google\Chrome','HKLM:\SOFTWARE\Policies\Microsoft\Edge','HKLM:\SOFTWARE\Policies\BraveSoftware\Brave','HKLM:\SOFTWARE\Policies\CocCoc\Browser') | ForEach-Object { New-Item -Path "$_" -Force | Out-Null; Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force }
          $suffix = (("$env:MACHINE_ID").ToUpper() -replace '[^A-Z0-9]', ''); if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8) }
          $fixedHost = if ($suffix) { "ALB-$suffix" } else { 'ALB-CLOUD-PC' }
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'Hostname' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'NV Hostname' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue
          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore'); if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path "$dlDir" | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null
          $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json')
