# ═══════════════════════════════════════════════════════════════════════════
# ALB-VPSFREE-ULTIMATE v70.1 — PRO EXTREME ZENOVA-OS EDITION (FULLY CLEANED)
# - [FIX] Loại bỏ 100% ký tự \vert{}, dính chữ, dính link markdown
# - [SPEED]     Bung siêu tốc VSCode, Spotify, Discord, EVKey bằng 7z đa luồng
# - [WALLPAPER] Giữ nguyên 100% ảnh gốc + Fix triệt để lỗi màn hình đen RDP
# - [DESKTOP]   Đầy đủ 100% App, đánh số 01 -> 13 gọn gàng, xóa sạch icon trùng
# - [DISCORD]   Bung chuẩn Squirrel + SKIP_HOST_UPDATE
# - [SUNSHINE]  WMI Detached Process + WorkingDirectory chuẩn (Port 47990 ONLINE)
# - [PRO-LAG]   TCP NoDelay, TSFairShare Off, Core Unparking 100%, RDP 60FPS
# - [DURATION]  Mặc định 6h, tùy chỉnh tới 24h (Chained Auto-Restart)
# - [STORAGE]   Ổ đĩa ZENOVA-OS (X:\) tối đa 100TB
# ═══════════════════════════════════════════════════════════════════════════
name: ALB-VPSFREE-ULTIMATE v70.1

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy & bản lưu riêng'
        required: false
        default: 'may-phu-1'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng máy (Mặc định: 6h, tối đa: 24h)'
        required: false
        default: '6h'
        type: choice
        options: ['1h', '3h', '6h', '12h', '18h', '24h']
      auto_restart:
        description: '🔁 Tự động nối phiên khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa riêng ZENOVA-OS'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ ZENOVA-OS (GB - Tối đa 100TB)'
        required: false
        default: '100'
        type: string
      windows_image:
        description: '🪟 Hệ điều hành'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu cố định RDP & Sunshine'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      choco_packages:
        description: '📦 Gói cài thêm qua Chocolatey'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Fix Lag & Mở khóa 100% CPU'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Bật Tailscale VPN & Funnel'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: true

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'may-phu-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      SUNSHINE_PASS: ${{ inputs.fixed_password || 'Aistv@2026' }}

    steps:
      - name: 📥 Checkout Repo (Lấy nguyên bản ảnh nền gốc)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: ⚡ Khởi tạo Ổ Đĩa Riêng ZENOVA-OS (6h - 24h) & Engine Lưu Trữ
        shell: pwsh
        timeout-minutes: 8
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dTemp = 'D:\tmp'
            New-Item -ItemType Directory -Force -Path $dTemp | Out-Null
            $env:TEMP = $dTemp; $env:TMP = $dTemp
            "TEMP=$dTemp" >> $env:GITHUB_ENV
            "TMP=$dTemp" >> $env:GITHUB_ENV
          } catch {}

          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          $rawVhd = ("$env:VHD_SIZE_GB").Trim().ToUpper()
          $vhdSizeInput = 100
          if ($rawVhd -match '^(\d+)\s*TB$') {
            $vhdSizeInput = ([int64]$Matches[1]) * 1000
          } else {
            $numStr = $rawVhd -replace '[^0-9]', ''
            if ($numStr) { $vhdSizeInput = [int64]$numStr }
          }
          if ($vhdSizeInput -lt 10) { $vhdSizeInput = 100 }
          if ($vhdSizeInput -gt 102400) { $vhdSizeInput = 102400 }
          "VHD_SIZE_GB_VALIDATED=$vhdSizeInput" >> $env:GITHUB_ENV

          $cleanId = (($env:MACHINE_ID).Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', ''
          if ([string]::IsNullOrWhiteSpace($cleanId)) { $cleanId = 'may-phu-1' }
          $relTag = "alb-storage-$cleanId"

          $null = gh release view $relTag --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
            $null = gh release view "aistv-storage-$cleanId" --repo $env:GH_REPO 2>&1
            if ($LASTEXITCODE -eq 0) {
              $relTag = "aistv-storage-$cleanId"
            } else {
              $dummy = "$env:RUNNER_TEMP\init.txt"
              Set-Content $dummy -Value "ZENOVA-OS Storage ($cleanId)" -Encoding UTF8
              gh release create $relTag $dummy --repo $env:GH_REPO --title "ZENOVA-OS Storage ($cleanId)" --notes "Kho luu o dia ZENOVA-OS cua may [$cleanId]"
            }
          }
          "MACHINE_ID=$cleanId" >> $env:GITHUB_ENV
          "RELEASE_TAG=$relTag" >> $env:GITHUB_ENV

          $reqHours = 6
          if ($env:INPUT_DURATION -match '^(\d+)h') { $reqHours = [int]$Matches[1] }
          if ($reqHours -lt 1) { $reqHours = 6 }
          if ($reqHours -gt 24) { $reqHours = 24 }
          $requestedMinutes = $reqHours * 60
          $runnerSafeMinutes = if ($requestedMinutes -ge 348) { 348 } else { $requestedMinutes }
          $dispTime = "${reqHours} giờ 00 phút"

          "REQUESTED_HOURS=$reqHours" >> $env:GITHUB_ENV
          "REQUESTED_MINUTES=$requestedMinutes" >> $env:GITHUB_ENV
          "TOTAL_MINUTES=$runnerSafeMinutes" >> $env:GITHUB_ENV
          "DISPLAY_TIME=$dispTime" >> $env:GITHUB_ENV
          "RDP_USER=$env:USERNAME" >> $env:GITHUB_ENV
          "PROFILE_PATH=$env:USERPROFILE" >> $env:GITHUB_ENV

          $dl = (($env:DRIVE_LETTER).Trim() -replace '[^A-Za-z]', '').ToUpper()
          if ((-not $dl) -or (@('C','D') -contains $dl)) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV

          $vhdContainer = 'C:\ZENOVA-VHD-HOST'
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile = "$vhdContainer\zenova-os-disk.vhdx"
          $actualVhdGb = if ($vhdSizeInput -gt 65530) { [int64]65530 } else { $vhdSizeInput }
          $sizeBytes = $actualVhdGb * 1GB
          $mounted = $false
          try {
            if (-not (Test-Path $vhdFile)) {
              New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru |
                New-Partition -DriveLetter $dl -UseMaximumSize |
                Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:$false | Out-Null
            } else {
              Mount-VHD -Path $vhdFile -ErrorAction Stop
            }
            if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {}

          if (-not $mounted) {
            $fallbackDir = "$vhdContainer\VIRTUAL-DRIVE-ROOT"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            & subst "${dl}:" $fallbackDir
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -EA SilentlyContinue
          }

          try { Set-Volume -DriveLetter $dl -NewFileSystemLabel 'ZENOVA-OS' -EA SilentlyContinue } catch {}
          & label.exe "${dl}:" ZENOVA-OS *> $null

          $sharedRoot = "${dl}:\ZENOVA-SYSTEM"
          if ((Test-Path "${dl}:\ALB-SYSTEM") -and (-not (Test-Path $sharedRoot))) {
            $sharedRoot = "${dl}:\ALB-SYSTEM"
          }
          $osDir = "$sharedRoot\OS-OVERLAY"
          $instCache = "$osDir\Installers"
          @(
            "$sharedRoot\sessions", "$sharedRoot\DATA", "$osDir\InstalledApps",
            "$osDir\bin", $instCache, "$osDir\Sunshine-Config",
            "$osDir\Sunshine-Portable", "$osDir\Wallpaper", "$sharedRoot\Users", "${dl}:\Apps"
          ) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }

          if (-not (Test-Path 'C:\ALB-Apps')) {
            New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target "$osDir\InstalledApps" -Force | Out-Null
          }

          "SHARED_ROOT=$sharedRoot" >> $env:GITHUB_ENV
          "SHARED_SESSION_DIR=$sharedRoot\sessions" >> $env:GITHUB_ENV
          "SHARED_DATA_DIR=$sharedRoot\DATA" >> $env:GITHUB_ENV
          "SHARED_OS_DIR=$osDir" >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$sharedRoot\sessions\rdp-session-state.json" >> $env:GITHUB_ENV
          "PROFILE_ROOT=$sharedRoot\Users" >> $env:GITHUB_ENV
          "CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\alb-control.txt" >> $env:GITHUB_ENV
          "VHD_CONTAINER=$vhdContainer" >> $env:GITHUB_ENV
          "INSTALLER_CACHE=$instCache" >> $env:GITHUB_ENV
          "SUNSHINE_PERSIST_CFG=$osDir\Sunshine-Config" >> $env:GITHUB_ENV
          "WALLPAPER_DIR=$osDir\Wallpaper" >> $env:GITHUB_ENV

          $L = New-Object System.Collections.Generic.List[string]
          $L.Add('param([string]$Reason = "session-end")')
          $L.Add('$ErrorActionPreference = "Continue"')
          $L.Add('if ($env:DATA_RESTORED -ne "1") { exit 0 }')
          $L.Add('$root = $env:SHARED_ROOT')
          $L.Add('if ((-not $root) -or (-not (Test-Path $root))) { exit 0 }')
          $L.Add('$apps = @("chrome","msedge","brave","firefox","coccoc","discord","Spotify","Code","bdcam","RobloxPlayerBeta","StarDesk","EVKey64","EVKey32")')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow() }')
          $L.Add('Start-Sleep -Seconds 2')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue')
          $L.Add('if ($Reason -eq "session-end") {')
          $L.Add('  Get-Service -Name "*StarDesk*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue')
          $L.Add('  & taskkill.exe /F /IM "StarDesk*" /T *> $null')
          $L.Add('}')
          $L.Add('Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue')
          $L.Add('$u = $env:RDP_USER; $profSrc = $env:PROFILE_PATH')
          $L.Add('if ($profSrc -and (Test-Path "$profSrc\AppData")) {')
          $L.Add('  Get-ChildItem -Path "$profSrc\AppData" -Filter "Local State" -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {')
          $L.Add('    try {')
          $L.Add('      $lsFile = $_.FullName')
          $L.Add('      $lsJson = Get-Content -Raw -Path $lsFile -Encoding UTF8 | ConvertFrom-Json')
          $L.Add('      if ($lsJson.os_crypt -and $lsJson.os_crypt.encrypted_key) {')
          $L.Add('        $encBytes = [Convert]::FromBase64String($lsJson.os_crypt.encrypted_key)')
          $L.Add('        if ($encBytes.Length -gt 5) {')
          $L.Add('          $prefix = [System.Text.Encoding]::ASCII.GetString($encBytes[0..4])')
          $L.Add('          if ($prefix -eq "DPAPI") {')
          $L.Add('            $cipher = $encBytes[5..($encBytes.Length - 1)]')
          $L.Add('            $rawKey = [System.Security.Cryptography.ProtectedData]::Unprotect($cipher, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser)')
          $L.Add('            [Convert]::ToBase64String($rawKey) | Set-Content -Path "$lsFile.aistvkey" -Encoding ASCII -Force')
          $L.Add('          }')
          $L.Add('        }')
          $L.Add('      }')
          $L.Add('    } catch {}')
          $L.Add('  }')
          $L.Add('}')
          $L.Add('if ($u -and $profSrc -and (Test-Path $profSrc)) {')
          $L.Add('  $profDst = "$root\Users\$u"; New-Item -ItemType Directory -Force -Path $profDst | Out-Null')
          $L.Add('  $ex = @("$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages","$profSrc\AppData\Roaming\Microsoft\Protect","$profSrc\AppData\Roaming\Microsoft\Crypto","$profSrc\AppData\Local\Microsoft\Credentials","$profSrc\AppData\Roaming\Microsoft\Credentials")')
          $L.Add('  robocopy $profSrc $profDst /MIR /XJ /R:0 /W:0 /MT:32 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* WebCacheV01.dat SingletonLock /XD @ex *> $null')
          $L.Add('}')
          $L.Add('if (Test-Path "C:\Program Files\Sunshine\sunshine.exe") {')
          $L.Add('  New-Item -ItemType Directory -Force -Path "$env:SHARED_OS_DIR\Sunshine-Portable" | Out-Null')
          $L.Add('  robocopy "C:\Program Files\Sunshine" "$env:SHARED_OS_DIR\Sunshine-Portable" /E /XJ /R:0 /W:0 /MT:32 /NFL /NDL /NJH /NJS /NP /XF "*.log" *> $null')
          $L.Add('}')
          $L.Add('$packDir = "$env:RUNNER_TEMP\alb-pack-$Reason"')
          $L.Add('if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }')
          $L.Add('New-Item -ItemType Directory -Force -Path $packDir | Out-Null')
          $L.Add('$archiveBase = "$packDir\alb-drive.7z"')
          $L.Add('Push-Location $root')
          $L.Add('& 7z a -t7z -m0=lzma2 -mx=1 -mmt=on -ssw -v1900m $archiveBase * -xr!Pagefile.sys -xr!swapfile.sys -xr!"System Volume Information" *> $null')
          $L.Add('Pop-Location')
          $L.Add('$chunks = @(Get-ChildItem $packDir -Filter "alb-drive.7z.*" | Sort-Object Name)')
          $L.Add('if ($chunks.Count -eq 0) { exit 1 }')
          $L.Add('$chunkList = @($chunks | ForEach-Object { @{ name = $_.Name; size = $_.Length } })')
          $L.Add('$manifest = @{ machineId = $env:MACHINE_ID; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); chunkCount = $chunks.Count; chunks = $chunkList }')
          $L.Add('$manifest | ConvertTo-Json -Depth 5 | Set-Content "$packDir\drive-manifest.json" -Encoding UTF8')
          $L.Add('$files = @($chunks | ForEach-Object { $_.FullName }) + @("$packDir\drive-manifest.json")')
          $L.Add('for ($i = 1; $i -le 3; $i++) { & gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep (2 * $i) }')
          $L.Add('Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue')
          $L.Add('exit 0')
          Set-Content -Path "$env:RUNNER_TEMP\save-data.ps1" -Value ($L -join "`r`n") -Encoding UTF8
          $global:LASTEXITCODE = 0
          Write-Host "✅ Đã dựng ổ đĩa ZENOVA-OS (${dl}:\ - $vhdSizeInput GB) | Thời lượng: $dispTime" -ForegroundColor Green

      - name: 🚀 Khôi Phục Siêu Tốc Ổ Đĩa ZENOVA-OS & Turbo Parallel Downloader
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -EA SilentlyContinue)

          try {
            @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
            ) | ForEach-Object {
              New-Item -Path $_ -Force | Out-Null
              Set-ItemProperty -Path $_ -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force
            }

            $dlDir = "$env:RUNNER_TEMP\gh-restore"
            if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -EA SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null

            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
            if (Test-Path "$dlDir\drive-manifest.json") {
              $manifest = Get-Content -Raw "$dlDir\drive-manifest.json" | ConvertFrom-Json
              $chunkNames = @($manifest.chunks | ForEach-Object { $_.name })
              $rJobs = @()
              $chunkNames | ForEach-Object {
                if ($hasTJ) { $rJobs += Start-ThreadJob -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
                else { $rJobs += Start-Job -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
              }
              if ($rJobs.Count -gt 0) { $null = Wait-Job $rJobs -Timeout 120; $rJobs | Remove-Job -Force -EA SilentlyContinue }

              $first = Get-ChildItem $dlDir -Filter '*.7z.001' | Select-Object -First 1
              if ($first) {
                $stage = "$env:VHD_CONTAINER\restore-stage"
                if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -EA SilentlyContinue }
                New-Item -ItemType Directory -Force -Path $stage | Out-Null
                & 7z x $first.FullName "-o$stage" -y -mmt=on *> $null
                Remove-Item $dlDir -Recurse -Force -EA SilentlyContinue

                $hit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -EA SilentlyContinue | Select-Object -First 1
                $src = if ($hit) { $hit.Directory.Parent.FullName } else { $stage }
                robocopy $src $env:SHARED_ROOT /E /XJ /R:0 /W:0 /MT:32 /NFL /NDL /NJH /NJS /NP *> $null

                $oldProf = "$env:PROFILE_ROOT\$env:RDP_USER"
                if (Test-Path $oldProf) {
                  robocopy $oldProf $env:PROFILE_PATH /E /XJ /R:0 /W:0 /MT:32 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD @("$oldProf\AppData\Local\Temp","$oldProf\AppData\Local\Packages") *> $null
                }
                if (Test-Path $env:SHARED_STATE_FILE) {
                  try {
                    $s = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json
                    if ($s.password) { "RESTORE_PASS=$($s.password)" >> $env:GITHUB_ENV }
                  } catch {}
                }
                Remove-Item $stage -Recurse -Force -EA SilentlyContinue
              }
            }
          } catch {}
          'DATA_RESTORED=1' >> $env:GITHUB_ENV

          $ic = $env:INSTALLER_CACHE
          New-Item -ItemType Directory -Force -Path $ic | Out-Null
          $downloads = @(
            @{ F = "$ic\usbmmidd.zip"; U = 'https://www.amyuni.com/downloads/usbmmidd_v2.zip'; R = ''; Min = 100KB },
            @{ F = "$ic\VBCable.zip"; U = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip'; R = ''; Min = 500KB },
            @{ F = "$ic\sunshine-setup.exe"; U = 'https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe'; R = ''; Min = 5MB },
            @{ F = "$ic\tailscale.msi"; U = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'; R = ''; Min = 5MB },
            @{ F = "$ic\EVKey.zip"; U = 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip'; R = ''; Min = 500KB },
            @{ F = "$ic\VSCode-win32-x64.zip"; U = 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable'; R = ''; Min = 40MB },
            @{ F = "$ic\DiscordSetup.exe"; U = 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'; R = 'https://discord.com/'; Min = 40MB },
            @{ F = "$ic\Spotify.exe"; U = 'https://download.scdn.co/SpotifyFullSetupX64.exe'; R = ''; Min = 5MB },
            @{ F = "$ic\bdcam.exe"; U = 'https://dl.bandicam.com/bdcamsetup.exe'; R = 'https://www.bandicam.com/'; Min = 10MB },
            @{ F = "$ic\Roblox.exe"; U = 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe'; R = ''; Min = 1MB },
            @{ F = "$ic\StarDesk.exe"; U = 'https://api.stardesk.net/api/v1/release/dl/1?channel=official'; R = 'https://www.stardesk.net/'; Min = 5MB }
          )

          $dlBlock = {
            param($f, $url, $ref, $min)
            if ((-not (Test-Path $f)) -or ((Get-Item $f -EA SilentlyContinue).Length -lt $min)) {
              $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
              if ($ref) {
                & curl.exe -L --retry 3 --connect-timeout 12 -A $ua -e $ref -s $url -o $f 2>$null
              } else {
                & curl.exe -L --retry 3 --connect-timeout 12 -A $ua -s $url -o $f 2>$null
              }
            }
          }

          $dJobs = @()
          $downloads | ForEach-Object {
            if ($hasTJ) { $dJobs += Start-ThreadJob -ScriptBlock $dlBlock -ArgumentList $_.F, $_.U, $_.R, $_.Min }
            else { $dJobs += Start-Job -ScriptBlock $dlBlock -ArgumentList $_.F, $_.U, $_.R, $_.Min }
          }
          if ($dJobs.Count -gt 0) {
            $null = Wait-Job $dJobs -Timeout 65
            $dJobs | Remove-Job -Force -EA SilentlyContinue
          }

          $sdFile = "$ic\StarDesk.exe"
          if ((-not (Test-Path $sdFile)) -or ((Get-Item $sdFile -EA SilentlyContinue).Length -lt 5MB)) {
