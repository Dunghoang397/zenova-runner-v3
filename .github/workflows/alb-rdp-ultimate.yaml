      - name: ⏳ Duy trì phiên (WATCHDOG)
        id: keepalive
        shell: pwsh
        run: |
          function Test-Port { param($Port,$TimeoutMs=1500) try { $tcp = [System.Net.Sockets.TcpClient]::new(); $t = $tcp.ConnectAsync('127.0.0.1', $Port); if ($t.Wait($TimeoutMs)) { $tcp.Close(); return $true }; $tcp.Close(); return $false } catch { return $false } }
          $jobStart = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $endEpoch = $jobStart + ([long]$env:TOTAL_MINUTES * 60)
          $saveScript = "$env:RUNNER_TEMP\save-data.ps1"; $sigFile = $env:CONTROL_SIGNAL_FILE
          $u = $env:RDP_USER; $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'; $sunExe = 'C:\Program Files\Sunshine\sunshine.exe'
          $lastLog = (Get-Date).AddHours(-1); $warned = $false; $quserCache = (Get-Date).AddSeconds(-60); $tsCache = (Get-Date).AddSeconds(-60)

          while ($true) {
              if (Test-Path $sigFile) { $cmd = (Get-Content -Raw $sigFile -ErrorAction SilentlyContinue).Trim(); Remove-Item $sigFile -Force -ErrorAction SilentlyContinue; if ($cmd -in 'save','SAVE_NOW') { & $saveScript -Reason 'manual'; $global:LASTEXITCODE = 0 } elseif ($cmd -in 'restart','RESTART_SESSION','start-new') { 'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV"; break } elseif ($cmd -in 'stop','STOP_SESSION') { 'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV"; break } }
              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); $remain = $endEpoch - $now; if ($remain -le 0) { break }
              if (((Get-Date) - $lastLog).TotalMinutes -ge 5) { $svc = Get-Service TermService -ErrorAction SilentlyContinue; $sunOK = Test-Port 47990; $h = [math]::Floor($remain/3600); $m = [math]::Floor(($remain%3600)/60); Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP:$($svc.Status) Sun:$sunOK Còn:${h}h${m}m" -ForegroundColor Blue; $lastLog = Get-Date }
              if (-not (Test-Port 47990)) { Stop-Service SunshineService,sunshinesvc -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1; $svc = Get-Service SunshineService,sunshinesvc -ErrorAction SilentlyContinue | Select-Object -First 1; if ($svc) { Start-Service $svc.Name -ErrorAction SilentlyContinue } elseif (Test-Path $sunExe) { Start-Process $sunExe -WorkingDirectory 'C:\Program Files\Sunshine' -WindowStyle Hidden } }
              if (-not (Test-Port 3389)) { Restart-Service TermService -Force -ErrorAction SilentlyContinue }
              if (((Get-Date) - $quserCache).TotalSeconds -gt 15) { try { @(quser 2>$null) | ForEach-Object { $line = $_ -replace '^>',''; if ($line -match $u -and $line -match 'Disc') { $sid = ($line.Trim() -split '\s+' | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1); if ($sid) { & tscon $sid /dest:console *> $null } } } } catch {}; $quserCache = Get-Date }
              if (((Get-Date) - $tsCache).TotalSeconds -gt 30) { if (Test-Path $tsExe) { $tsOut = & $tsExe status 2>&1 | Out-String; if ($tsOut -notmatch '100\.') { & $tsExe up --reset --unattended 2>&1 | Out-Null } }; $tsCache = Get-Date }
              if (-not $warned -and $remain -le 300) { try { msg * /TIME:290 "ALB RDP [$env:MACHINE_ID] sap het gio ($([math]::Floor($remain/60)) phut)!" } catch {}; $warned = $true }
              Start-Sleep -Seconds 2
          }
          exit 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        run: |
          Stop-Service SunshineService,sunshinesvc -Force -ErrorAction SilentlyContinue
          Stop-Process -Name sunshine -Force -ErrorAction SilentlyContinue
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $saveScript = "$env:RUNNER_TEMP\save-data.ps1"
          if (Test-Path $saveScript) { & $saveScript -Reason 'session-end'; $global:LASTEXITCODE = 0 }
          exit 0

      - name: 🧹 Dọn dẹp
        if: always()
        shell: pwsh
        run: |
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (Test-Path $ts) { & $ts logout 2>&1 | Out-Null; & $ts down 2>&1 | Out-Null }
          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP') | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 1 -Force -ErrorAction SilentlyContinue
          Stop-Service TermService -Force -ErrorAction SilentlyContinue
          exit 0

      - name: 🔁 Auto-restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || inputs.auto_restart == 'true' || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          WALL_URL: ${{ inputs.wallpaper_url }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          TS_EN: ${{ inputs.enable_tailscale }}
          DDNS_EN: ${{ inputs.enable_duckdns }}
        run: |
          $wf = [System.IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])
          $ghArgs = @('workflow','run',$wf,'--ref',$env:GITHUB_REF_NAME,'-f',"machine_id=$env:MACHINE_ID",'-f',"duration=$env:DURATION",'-f','auto_restart=true','-f',"drive_letter=$env:MOUNT_LETTER",'-f',"vhd_size_gb=$env:VHD_SIZE_GB_VALIDATED",'-f',"windows_image=$env:WIN_IMAGE",'-f',"fixed_password=$env:FIXED_PASS",'-f',"vdd_resolution=$env:VDD_RES",'-f',"wallpaper_url=$env:WALL_URL",'-f',"choco_packages=$env:PKGS",'-f',"optimize_windows=$($env:OPT.ToLower())",'-f',"enable_tailscale=$($env:TS_EN.ToLower())",'-f',"enable_duckdns=$($env:DDNS_EN.ToLower())")
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'Auto-restart fail' }
