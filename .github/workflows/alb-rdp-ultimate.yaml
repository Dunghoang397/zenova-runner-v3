          function Start-FastJob {
            param([scriptblock]$Block, [object[]]$ArgsList)
            if ($hasTJ) { return Start-ThreadJob -ScriptBlock $Block -ArgumentList $ArgsList }
            else { return Start-Job -ScriptBlock $Block -ArgumentList $ArgsList }
