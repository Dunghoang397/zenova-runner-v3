      - name: ⏳ Duy trì phiên làm việc (lắng nghe web panel & giữ Sunshine/StarDesk/Audio)
        id: keepalive
        shell: pwsh
        run: |
          function Test-Port {
              param($Port, $TimeoutMs = 1500)
              try {
                  $tcp = New-Object System.Net.Sockets.TcpClient
                  $task = $tcp.ConnectAsync("127.0.0.1", $Port)
                  if ($task.Wait($TimeoutMs)) { $tcp.Close(); return $true }
                  $tcp.Close(); return $false
              } catch { return $false }
          }

          $jobStart = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $endEpoch   = $jobStart + (([long]$env:TOTAL_MINUTES) * 60)
          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1')
          $sigFile    = "$env:CONTROL_SIGNAL_FILE"
          $u          = "$env:RDP_USER"
          $sdExe      = 'C:\Program Files\StarDesk\StarDesk.exe'

          Write-Host "KEEPALIVE [$env:MACHINE_ID]..." -ForegroundColor Yellow
          $lastLog = (Get-Date).AddHours(-1)
          $warned  = $false
          $diskWarned = $false

          while ($true) {
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim()
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue
                  if ("$cmd" -eq 'SAVE_NOW') {
                      Write-Host "SAVE_NOW" -ForegroundColor Cyan
                      & "$saveScript" -Reason 'manual-web-save'
                      $global:LASTEXITCODE = 0
                  } elseif ("$cmd" -eq 'RESTART_SESSION') {
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV"
                      break
                  } elseif ("$cmd" -eq 'STOP_SESSION') {
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV"
                      break
                  }
              }

              try {
                  @(quser 2>$null) | ForEach-Object {
                      $lineStr = "$_"
                      if (("$lineStr" -match "^\s*>?$([regex]::Escape("$u"))\s+") -and ("$lineStr" -notmatch "\s+console\s+")) {
                          $parts  = (($lineStr -replace '^>', ' ').Trim()) -split '\s+'
                          $sidNum = $parts[1..(($parts.Count) - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1
                          if (($sidNum) -and ("$lineStr" -match "\s+Disc\s+")) {
                              & tscon "$sidNum" /dest:console *> $null
                          }
                      }
                  }
              } catch {}

              $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              $remain = ($endEpoch) - ($now)
              if (($remain) -le 0) { break }

              if ((((Get-Date) - ($lastLog)).TotalMinutes) -ge 5) {
                  $svc     = Get-Service -Name TermService -ErrorAction SilentlyContinue
                  $audSvc  = Get-Service -Name Audiosrv -ErrorAction SilentlyContinue
                  $sunOK   = Test-Port 47990
                  $sdProc  = Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue
                  $sdStat  = if ($sdProc) { 'R' } else { 'S' }
                  $h = [math]::Floor(($remain) / 3600)
                  $m = [math]::Floor((($remain) % 3600) / 60)
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP:$($svc.Status) Sun:$sunOK SD:$sdStat Aud:$($audSvc.Status) Con:${h}h${m}m" -ForegroundColor Blue
                  $lastLog = Get-Date
              }

              if (-not (Test-Port 47990)) {
                  Write-Host "Sunshine port 47990 khong listen, restart..." -ForegroundColor Yellow
                  Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                  $sunSvc = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($sunSvc) { Start-Service -Name ($sunSvc.Name) -ErrorAction SilentlyContinue }
                  else { Start-Process -FilePath 'C:\Program Files\Sunshine\sunshine.exe' -WorkingDirectory 'C:\Program Files\Sunshine' -WindowStyle Hidden -ErrorAction SilentlyContinue }
              }

              if ((Test-Path "$sdExe") -and (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue))) {
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
                  & schtasks.exe /Run /TN "ALB-Launch-StarDesk" *> $null
              }

              try {
                  $disk = Get-PSDrive -Name "$env:MOUNT_LETTER" -ErrorAction Stop
                  $usedGB = [math]::Round($disk.Used / 1GB, 2)
                  $totalGB = [int]"$env:VHD_SIZE_GB"
                  if (($usedGB -gt ($totalGB * 0.85)) -and (-not $diskWarned)) {
                      Write-Host "O $env:MOUNT_LETTER:\ da dung ${usedGB}GB / ${totalGB}GB (>85%)!" -ForegroundColor Yellow
                      $diskWarned = $true
                  }
              } catch {}

              if ((-not $warned) -and (($remain) -le 300)) {
                  try { msg * /TIME:290 "ALB RDP [$($env:MACHINE_ID)] sap het gio (5 phut)!" } catch {}
                  $warned = $true
              }

              Start-Sleep -Seconds 2
          }
          exit 0

      - name: 💾 Tắt Sunshine, Kill StarDesk & Lưu toàn bộ ổ đĩa cuối phiên lên GitHub
        if: always()
        shell: pwsh
        run: |
          Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue
          Stop-Process -Name 'sunshine' -Force -ErrorAction SilentlyContinue
          & schtasks.exe /Delete /TN "ALB-Launch-StarDesk" /F *> $null
          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1')
          if (Test-Path "$saveScript") {
              & "$saveScript" -Reason 'session-end'
              $global:LASTEXITCODE = 0
          }
          exit 0

      - name: 🧹 Dọn dẹp hệ thống
        if: always()
        shell: pwsh
        run: |
          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path "$ts") {
              & "$ts" logout 2>&1 | Out-Null
              & "$ts" down 2>&1 | Out-Null
          }
          Remove-NetFirewallRule -DisplayName 'ALB-RDP' -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'ALB-Sunshine-TCP' -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'ALB-Sunshine-UDP' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force -ErrorAction SilentlyContinue
          Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue
          exit 0

      - name: 🔁 Kích hoạt phiên tiếp theo & Mở lại ổ đĩa
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && inputs.auto_restart && !inputs.run_once }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          RDP_USERNAME: ${{ inputs.rdp_username }}
          RDP_PASSWORD: ${{ inputs.rdp_password }}
          CREATOR: ${{ inputs.creator_name }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          PKGS: ${{ inputs.choco_packages }}
          APP_URLS: ${{ inputs.app_urls }}
          OPT: ${{ inputs.optimize_windows }}
          DDNS: ${{ inputs.enable_duckdns }}
        run: |
          $wf      = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0])
          $optStr  = ("$env:OPT").ToLower()
          $ddnsStr = ("$env:DDNS").ToLower()
          Write-Host "Restart: $wf may [$env:MACHINE_ID]" -ForegroundColor Cyan
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" `
              -f "machine_ids=$env:MACHINE_ID" `
              -f "duration=$env:DURATION" `
              -f auto_restart=true `
              -f run_once=false `
              -f "drive_letter=$env:MOUNT_LETTER" `
              -f "vhd_size_gb=$env:VHD_SIZE_GB" `
              -f "windows_image=$env:WIN_IMAGE" `
              -f "rdp_username=$env:RDP_USERNAME" `
              -f "rdp_password=$env:RDP_PASSWORD" `
              -f "creator_name=$env:CREATOR" `
              -f "vdd_resolution=$env:VDD_RES" `
              -f "choco_packages=$env:PKGS" `
              -f "app_urls=$env:APP_URLS" `
              -f "optimize_windows=$optStr" `
              -f "enable_duckdns=$ddnsStr"
          if (($LASTEXITCODE) -ne 0) { throw 'Khong restart duoc' }
          Write-Host "Restart OK" -ForegroundColor Green