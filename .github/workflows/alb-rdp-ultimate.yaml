            if (-not $foundRepoImg) {
              $foundRepoImg = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Include '*.png','*.jpg','*.jpeg' -Recurse -File -EA SilentlyContinue | Where-Object { $_.Length -gt 20KB } | Select-Object -First 1
