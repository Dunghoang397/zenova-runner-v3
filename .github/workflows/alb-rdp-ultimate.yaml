            '<h1>🌸 ZENOVA CLOUD</h1>',
            '<p>Máy: $($env:MACHINE_ID) | IP: $tsIp</p>',
            '<p>Mật khẩu: $($env:RDP_PASS)</p>',
            '<p><a href="https://${tsIp}:$($env:SUNSHINE_WEB_PORT)/" style="color:#facc15">☀️ Sunshine UI</a></p>',
            '<form action="/save" method="POST"><button class="btn-save">💾 Lưu Dữ Liệu Ngay</button></form>',
            '<form action="/restart" method="POST"><button class="btn-restart">🔁 Khởi Động Lại</button></form>',
            '<form action="/stop" method="POST"><button class="btn-stop">🛑 Tắt Server</button></form>',
            '</div></body></html>'
          )
          Set-Content "$env:RUNNER_TEMP\panel.html" -Value ($htmlLines -join "`r`n") -Encoding UTF8

          $serverLines = @(
            '$listener = [System.Net.HttpListener]::new()',
            '$listener.Prefixes.Add("http://+:$($env:WEB_PORT)/")',
            '$listener.Start()',
            'while ($listener.IsListening) {',
            '  try {',
            '    $ctx = $listener.GetContext(); $req = $ctx.Request; $resp = $ctx.Response',
            '    $urlPath = $req.Url.AbsolutePath.ToLower()',
            '    if ($req.HttpMethod -eq "POST") {',
            '      if ($urlPath -eq "/save") { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value "SAVE_NOW" -Encoding UTF8 }',
            '      elseif ($urlPath -eq "/restart") { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value "RESTART_SESSION" -Encoding UTF8 }',
            '      elseif ($urlPath -eq "/stop") { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value "STOP_SESSION" -Encoding UTF8 }',
            '      $resp.Redirect("/")',
