              $rawSec = $rawSec -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0'
              Set-Content -Path $secCfg -Value $rawSec -Encoding Unicode
              & secedit /configure /db $secDb /cfg $secCfg /areas SECURITYPOLICY *> $null
              Remove-Item $secCfg, $secDb -Force -EA SilentlyContinue
            }
          } catch {}

          $sp = ConvertTo-SecureString $pass -AsPlainText -Force
          try { Set-LocalUser -Name $user -Password $sp -PasswordNeverExpires $true -EA Stop } catch {}
          & net user $user $pass /active:yes /expires:never *> $null
          Add-LocalGroupMember -Group 'Administrators' -Member $user -EA SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -EA SilentlyContinue
          Enable-LocalUser -Name $user -EA SilentlyContinue
          "RDP_PASS=$pass" >> $env:GITHUB_ENV; "SUNSHINE_PASS=$pass" >> $env:GITHUB_ENV

