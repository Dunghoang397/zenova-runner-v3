          foreach ($u in @($user, $newUser)) { Add-LocalGroupMember -Group 'Administrators' -Member "$u" -ErrorAction SilentlyContinue; Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "$u" -ErrorAction SilentlyContinue; Enable-LocalUser -Name "$u" -ErrorAction SilentlyContinue }
          try { Set-Service -Name 'AppXSvc' -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name 'AppXSvc' -ErrorAction SilentlyContinue; Set-Service -Name 'StateRepository' -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name 'StateRepository' -ErrorAction SilentlyContinue; & icacls "$profPath\AppData\Local\Packages" /grant "*S-1-15-2-1:(OI)(CI)F" /T /C /Q *> $null; if (Test-Path 'C:\Windows\ImmersiveControlPanel\appxmanifest.xml') { Add-AppxPackage -Register 'C:\Windows\ImmersiveControlPanel\appxmanifest.xml' -DisableDevelopmentMode -ErrorAction SilentlyContinue } } catch {}
          $global:LASTEXITCODE = 0; "RDP_PASS=$matKhau" >> "$env:GITHUB_ENV"; "RDP_EXTRA_USER=$newUser" >> "$env:GITHUB_ENV"
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'; Set-ItemProperty -Path "$winlogon" -Name 'AutoAdminLogon' -Value '1' -Force; Set-ItemProperty -Path "$winlogon" -Name 'DefaultUserName' -Value "$user" -Force; Set-ItemProperty -Path "$winlogon" -Name 'DefaultPassword' -Value "$matKhau" -Force; Set-ItemProperty -Path "$winlogon" -Name 'DefaultDomainName' -Value "$env:COMPUTERNAME" -Force
          $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"; $sunPersistCfg = "$env:SUNSHINE_PERSIST_CFG"; $uObj = Get-LocalUser -Name "$user" -ErrorAction SilentlyContinue; $userSid = if ($uObj) { $uObj.SID.Value } else { $null }
          if (Test-Path "$sunExe") { if ($userSid) { & icacls "$sunDir" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null; & icacls "$sunPersistCfg" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null }; Push-Location "$sunDir"; & "$sunExe" --creds "$user" "$matKhau" *> $null; Pop-Location; $svcExe = "$sunDir\tools\sunshinesvc.exe"; $svcObj = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1; if ((-not ($svcObj)) -and (Test-Path "$svcExe")) { & sc.exe create SunshineService binPath= "`"$svcExe`"" start= auto DisplayName= "Sunshine Gamestream Service" *> $null; $svcObj = Get-Service -Name 'SunshineService' -ErrorAction SilentlyContinue }; if ($svcObj) { Set-Service -Name ($svcObj.Name) -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name ($svcObj.Name) -ErrorAction SilentlyContinue } else { Start-Process -FilePath "$sunExe" -WorkingDirectory "$sunDir" -WindowStyle Hidden }; "SUNSHINE_READY=1" >> "$env:GITHUB_ENV" }
          try { $desktopDir = [System.IO.Path]::Combine("$profPath", 'Desktop'); New-Item -ItemType Directory -Force -Path "$desktopDir" | Out-Null; $ws = New-Object -ComObject WScript.Shell; @("$desktopDir", 'C:\Users\Public\Desktop') | ForEach-Object { $d = "$_"; $ws.CreateShortcut("$d\WEB-QUAN-LY-RDP.url").TargetPath = "http://127.0.0.1:$($env:WEB_PORT)/"; $ws.CreateShortcut("$d\WEB-QUAN-LY-RDP.url").Save(); $ws.CreateShortcut("$d\SUNSHINE-WEB-UI.url").TargetPath = "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"; $ws.CreateShortcut("$d\SUNSHINE-WEB-UI.url").Save() } } catch {}
