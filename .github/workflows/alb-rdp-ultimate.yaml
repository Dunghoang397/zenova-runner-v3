name: 'ZENOVA ULTIMATE VPS (Windows + Linux)'

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: '🖥️ Hệ điều hành (Windows, Linux, hoặc Cả hai)'
        required: false
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'both'
      machine_id:
        description: '🆔 Tên định danh máy (VD: zenova-1)'
        required: true
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      windows_image:
        description: '🪟 Phiên bản Windows (2022 hoặc 2025)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      duration:
        description: '⏱️ Thời gian sử dụng (tối đa 24h - tự động nối phiên liên tục)'
        required: false
        default: '24h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔄 Tự khởi động lại nối tiếp khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💾 Ký tự ổ đĩa ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '💾 Dung lượng ổ đĩa ảo (hỗ trợ tối đa 60TB)'
        required: false
        default: '60TB'
        type: choice
        options:
          - '100GB'
          - '250GB'
          - '500GB'
          - '1TB'
          - '2TB'
          - '5TB'
          - '10TB'
          - '20TB'
          - '40TB'
          - '60TB'
      fixed_password:
        description: '🔑 Mật khẩu RDP / Sunshine / Windows'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: '📌 Mã PIN StarDesk Trung'
        required: false
        default: 'Zenova2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo'
        required: false
        default: '1920x1080@120'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'
      choco_packages:
        description: '📦 App cài thêm bằng choco (tùy chọn)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚡ Tối ưu Windows (Fix lag)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: zenova-ultimate-${{ github.event.inputs.machine_id || 'zenova-1' }}-${{ github.event.inputs.os_type || 'windows' }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. WINDOWS RUNNER (120FPS, TAILSCALE, SUNSHINE, STARDESK, 60TB VHD, APPS)
  # =========================================================================
  Zenova-Windows:
    name: '🪟 Windows RDP (${{ github.event.inputs.windows_image || ''windows-2022'' }} - 120fps)'
    runs-on: ${{ github.event.inputs.windows_image || 'windows-2022' }}
    if: ${{ github.event.inputs.os_type != 'linux' }}
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_KEY || secrets.TAILSCALE_AUTH_KEY || secrets.TS_AUTHKEY || secrets.TAILSCALE || secrets.TS_KEY || secrets.TAILSCALE_TOKEN }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-1' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || 'Zenova Ultimate Machine' }}
      DRIVE_LETTER: ${{ github.event.inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ github.event.inputs.vhd_size_gb || '60TB' }}
      FIXED_PASSWORD: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}
      INPUT_PIN_CODE: ${{ github.event.inputs.pin_code || 'Zenova2026' }}
      DURATION_INPUT: ${{ github.event.inputs.duration || '24h' }}
      AUTO_RESTART: ${{ github.event.inputs.auto_restart }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      ENABLE_DUCKDNS: ${{ github.event.inputs.enable_duckdns }}

    steps:
      # =====================================================================
      # 1. DỰNG Ổ ĐĨA RIÊNG (HỖ TRỢ ĐẾN 60TB VHDX) & CHUẨN BỊ THÔNG SỐ
      # =====================================================================
      - name: 💾 Dựng ổ đĩa riêng (Hỗ trợ đến 60TB) & Chuẩn bị thông số
        shell: pwsh
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          Add-Content -Path $env:GITHUB_ENV -Value "JOB_START_EPOCH=$nowEpoch";

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1' }
          $relTag = "zenova-storage-$cleanId";
          Add-Content -Path $env:GITHUB_ENV -Value "MACHINE_ID=$cleanId";
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$relTag";

          $durStr = "$env:DURATION_INPUT".ToLower().Trim();
          $total = 1440;
          if ($durStr -match '^(\d+)h') { $total = [int]$matches[1] * 60; }
          elseif ($durStr -match '^(\d+)m') { $total = [int]$matches[1]; }
          Add-Content -Path $env:GITHUB_ENV -Value "TOTAL_MINUTES=$total";

          $user = 'zenova';
          $profPath = 'C:\Users\zenova';
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_USER=$user";
          Add-Content -Path $env:GITHUB_ENV -Value "PROFILE_PATH=$profPath";

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          Add-Content -Path $env:GITHUB_ENV -Value "MOUNT_LETTER=$dl";

          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          # Tính dung lượng VHD hỗ trợ tối đa 60TB (60,000 GB)
          $rawSize = "$env:VHD_SIZE_GB".Trim().ToUpper();
          $sizeBytes = 100GB;
          if ($rawSize -match '^(\d+)\s*TB$') {
              $tb = [int64]$matches[1];
              if ($tb -gt 60) { $tb = 60; }
              if ($tb -lt 1) { $tb = 1; }
              $sizeBytes = $tb * 1TB;
          } elseif ($rawSize -match '^(\d+)\s*GB$') {
              $gb = [int64]$matches[1];
              if ($gb -gt 61440) { $gb = 61440; }
              if ($gb -lt 10) { $gb = 10; }
              $sizeBytes = $gb * 1GB;
          } elseif ($rawSize -match '^(\d+)$') {
              $val = [int64]$matches[1];
              if ($val -le 60) { $sizeBytes = $val * 1TB; }
              else {
                  if ($val -gt 61440) { $val = 61440; }
                  $sizeBytes = $val * 1GB;
              }
          }

          Write-Host "💾 Khởi tạo ổ đĩa ảo $dl`: với dung lượng tối đa: $($sizeBytes / 1GB) GB (Dynamic VHDX)..." -ForegroundColor Cyan;
          $mounted = $false;
          try {
              if (-not (Test-Path "$vhdFile")) {
                  New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
              } else { Mount-VHD -Path "$vhdFile"; }
              $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
              if (Test-Path "${dl}:\") { $mounted = $true; }
          } catch {}

          if (-not ($mounted)) {
              Write-Host "⚠️ Chuyển sang chế độ thư mục ảo subst $dl`:..." -ForegroundColor Yellow;
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null;
              & subst "${dl}:" "$fallbackDir";
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY";
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json";
          $profileStoreRoot = "$sharedRoot\Users";
          $baselineFile     = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json');
          $controlSignal    = 'C:\ZENOVA-VHD-HOST\control-signal.txt';

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps", 'C:\Apps') | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null;
          };

          Add-Content -Path $env:GITHUB_ENV -Value "VHD_CONTAINER=$vhdContainer";
          Add-Content -Path $env:GITHUB_ENV -Value "VHD_FILE=$vhdFile";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_ROOT=$sharedRoot";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_SESSION_DIR=$sharedSessionDir";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_DATA_DIR=$sharedDataDir";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_OS_DIR=$sharedOsDir";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_STATE_FILE=$sharedStateFile";
          Add-Content -Path $env:GITHUB_ENV -Value "PROFILE_ROOT=$profileStoreRoot";
          Add-Content -Path $env:GITHUB_ENV -Value "CONTROL_SIGNAL_FILE=$controlSignal";

          # Tạo release storage nếu chưa tồn tại
          $null = gh release view "$relTag" --repo "$env:GH_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt');
              Set-Content -Path "$dummy" -Value "Zenova Storage Init" -Encoding UTF8;
              gh release create "$relTag" "$dummy" --repo "$env:GH_REPO" --title "Zenova Storage ($cleanId)" --notes "Auto persistent storage";
          }
          $global:LASTEXITCODE = 0;

      # =====================================================================
      # 2. TẠO SCRIPT LƯU TRỮ VÀ ĐÓNG GÓI Ổ ĐĨA
      # =====================================================================
      - name: 📦 Tạo script lưu trữ ổ đĩa & đóng gói
        shell: pwsh
        run: |
          $scriptLines = @(
              'param([string]$Reason = "session-end")',
              '$ErrorActionPreference = "Continue";',
              '$root  = "$env
