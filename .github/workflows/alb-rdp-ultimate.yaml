# ═══════════════════════════════════════════════════════════════
# ALB-VPSFREE-ULTIMATE v38.0 — ZERO-PARSE-RISK
# - Loại bỏ hoàn toàn scriptblock lồng trong array
# - Mỗi job là Start-ThreadJob/Start-Job độc lập
# - cancel-in-progress: true — không dồn run
# - Timeout step-level — không treo vô hạn
# - TEMP → D: — I/O nhanh
# ═══════════════════════════════════════════════════════════════
name: ALB-VPSFREE-ULTIMATE v38.0

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên máy'
        required: false
        default: 'may-phu-1'
        type: string
      duration:
        description: '🕐 Thời gian'
        required: false
        default: '5h00m'
        type: choice
        options: ['1h', '3h', '5h00m']
      auto_restart:
        description: '🔁 Tự restart'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ổ ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 VHDX (GB)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Windows'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Resolution'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      wallpaper_url:
        description: '🖼️ Wallpaper URL'
        required: false
        default: 'https://files.catbox.moe/qwnvpw.png'
        type: string
      choco_packages:
        description: '📦 Choco packages'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Optimize'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Tailscale'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: true

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'

    steps:
      - name: ⚡ TEMP sang D:
        shell: pwsh
        timeout-minutes: 3
        run: |
          try {
            $dTemp = 'D:\tmp'
            New-Item -ItemType Directory -Force -Path $dTemp | Out-Null
            $env:TEMP = $dTemp; $env:TMP = $dTemp
            "TEMP=$dTemp" >> $env:GITHUB_ENV
            "TMP=$dTemp" >> $env:GITHUB_ENV
            Write-Host "OK TEMP=$dTemp" -ForegroundColor Green
          } catch { Write-Host "SKIP TEMP: $_" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      - name: 🧱 Dựng ổ đĩa
        shell: pwsh
        timeout-minutes: 10
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            "JOB_START_EPOCH=$nowEpoch" >> $env:GITHUB_ENV
            $vhdSizeInput = [int64]($env:VHD_SIZE_GB -replace '[^0-9]','')
            if ($vhdSizeInput -lt 10) { $vhdSizeInput = 45 }
            if ($vhdSizeInput -gt 100000) { exit 1 }
            "VHD_SIZE_GB_VALIDATED=$vhdSizeInput" >> $env:GITHUB_ENV

            $cleanId = (($env:MACHINE_ID).Trim().ToLower() -replace '[^a-z0-9\-]','-') -replace '\-+','-' -replace '^\-|\-$',''
            if ([string]::IsNullOrWhiteSpace($cleanId)) { $cleanId = 'may-phu-1' }
            $relTag = "alb-storage-$cleanId"
            $null = gh release view $relTag --repo $env:GH_REPO 2>&1
            if ($LASTEXITCODE -ne 0) {
                $dummy = "$env:RUNNER_TEMP\init.txt"
                Set-Content $dummy -Value "ALB Init" -Encoding UTF8
                gh release create $relTag $dummy --repo $env:GH_REPO --title "ALB Storage ($cleanId)" --notes "Kho luu [$cleanId]"
            }
            "MACHINE_ID=$cleanId" >> $env:GITHUB_ENV
            "RELEASE_TAG=$relTag" >> $env:GITHUB_ENV

            $total = 300
            if ($env:INPUT_DURATION -eq '1h') { $total = 60 }
            elseif ($env:INPUT_DURATION -eq '3h') { $total = 180 }
            "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV
            "RDP_USER=$env:USERNAME" >> $env:GITHUB_ENV
            "PROFILE_PATH=$env:USERPROFILE" >> $env:GITHUB_ENV

            $dl = (($env:DRIVE_LETTER).Trim() -replace '[^A-Za-z]','').ToUpper()
            if (-not $dl -or $dl -in @('C','D')) { $dl = 'X' }
            "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV

            $vhdContainer = 'C:\ALB-VHD-HOST'
            New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
            $vhdFile = "$vhdContainer\alb-os-disk.vhdx"
            $sizeBytes = $vhdSizeInput * 1GB
            $mounted = $false
            try {
                if (-not (Test-Path $vhdFile)) {
                    New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                      Mount-VHD -PassThru |
                      Initialize-Disk -PartitionStyle GPT -PassThru |
                      New-Partition -DriveLetter $dl -UseMaximumSize |
                      Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ALB-OS' -Confirm:$false | Out-Null
                } else { Mount-VHD -Path $vhdFile }
                $null = Get-PSDrive -Name $dl -ErrorAction Stop
                if (Test-Path "${dl}:\") { $mounted = $true }
            } catch {}
            if (-not $mounted) {
                $fallbackDir = "$vhdContainer\VIRTUAL-DRIVE-ROOT"
                New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
                & subst "${dl}:" $fallbackDir
            }

            $sharedRoot = "${dl}:\ALB-SYSTEM"
            @("$sharedRoot\sessions","$sharedRoot\DATA","$sharedRoot\OS-OVERLAY","$sharedRoot\Users","${dl}:\Apps") |
              ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }

            $baseline = @{
                PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
                PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
                PD   = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
            }
            $baseline | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP\baseline.json" -Encoding UTF8

            "SHARED_ROOT=$sharedRoot" >> $env:GITHUB_ENV
            "SHARED_OS_DIR=$sharedRoot\OS-OVERLAY" >> $env:GITHUB_ENV
            "SHARED_STATE_FILE=$sharedRoot\sessions\rdp-session-state.json" >> $env:GITHUB_ENV
            "PROFILE_ROOT=$sharedRoot\Users" >> $env:GITHUB_ENV
            "BASELINE_FILE=$env:RUNNER_TEMP\baseline.json" >> $env:GITHUB_ENV
            "CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\alb-control.txt" >> $env:GITHUB_ENV
            "VHD_CONTAINER=$vhdContainer" >> $env:GITHUB_ENV
            $global:LASTEXITCODE = 0
            Write-Host "OK o ${dl}:\ | $cleanId | ${vhdSizeInput}GB" -ForegroundColor Green
          } catch { Write-Host "LOI: $_" -ForegroundColor Red; exit 1 }

      - name: 🧰 Tạo save-data.ps1
        shell: pwsh
        timeout-minutes: 3
        run: |
          $L = New-Object System.Collections.Generic.List[string]
          $L.Add('param([string]$Reason = "session-end")')
          $L.Add('$ErrorActionPreference = "Continue"')
          $L.Add('if ("$env:DATA_RESTORED" -ne "1") { exit 0 }')
          $L.Add('$root = "$env:SHARED_ROOT"; $osDir = "$env:SHARED_OS_DIR"')
          $L.Add('if ((-not $root) -or (-not (Test-Path $root))) { exit 0 }')
          $L.Add('$apps = @("chrome","msedge","discord","Telegram","Zalo","steam","Spotify","Code","StarDesk","EVKey","bdcam","RobloxPlayerBeta")')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue')
          $L.Add('Start-Sleep -Seconds 1')
          $L.Add('$u = "$env:RDP_USER"; $profSrc = "$env:PROFILE_PATH"')
          $L.Add('if ($u -and $profSrc -and (Test-Path $profSrc)) { $profDst = "$root\Users\$u"; New-Item -ItemType Directory -Force -Path $profDst | Out-Null; $ex = @("$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages"); robocopy $profSrc $profDst /MIR /XJ /R:1 /W:1 /MT:2 /NFL /NDL /NJH /NJS /NP /XD @ex *> $null; $global:LASTEXITCODE = 0 }')
          $L.Add('$packDir = "$env:RUNNER_TEMP\alb-pack-$Reason"; if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path $packDir | Out-Null')
          $L.Add('$archiveBase = "$packDir\alb-drive.7z"; Push-Location $root; & 7z a -t7z -m0=lzma2 -mx=1 -mmt=4 -v1900m $archiveBase * -xr!Pagefile.sys -xr!"System Volume Information" *> $null; Pop-Location')
          $L.Add('$chunks = @(Get-ChildItem $packDir -Filter "alb-drive.7z.*" | Sort-Object Name); if ($chunks.Count -eq 0) { exit 1 }')
          $L.Add('$manifest = @{ machineId=$env:MACHINE_ID; updatedUtc=(Get-Date).ToUniversalTime().ToString("o"); chunkCount=$chunks.Count; chunks=@($chunks | ForEach-Object { @{ name=$_.Name; size=$_.Length } }) }')
          $L.Add('$manifestPath = "$packDir\drive-manifest.json"; $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding UTF8')
          $L.Add('$files = @($chunks | ForEach-Object { $_.FullName }) + @($manifestPath); $ok = $false')
          $L.Add('for ($i=1;$i-le 3;$i++) { & gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber; if ($LASTEXITCODE -eq 0) { $ok=$true; break }; Start-Sleep ($3*$i) }')
          $L.Add('if (-not $ok) { exit 1 }')
          $L.Add('Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue; Write-Host "Saved [$env:MACHINE_ID]" -ForegroundColor Green; exit 0')
          Set-Content -Path "$env:RUNNER_TEMP\save-data.ps1" -Value ($L -join "`r`n") -Encoding UTF8
          Write-Host "OK save-data.ps1" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: ♻️ Khôi phục ổ đĩa
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dlDir = "$env:RUNNER_TEMP\gh-restore"
            if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
            if (-not (Test-Path "$dlDir\drive-manifest.json")) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }

            $manifest = Get-Content -Raw "$dlDir\drive-manifest.json" | ConvertFrom-Json
            $chunkNames = @($manifest.chunks | ForEach-Object { $_.name })
            $hasThreadJob = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)

            # Mỗi chunk một job độc lập — không array scriptblock
            $jobs = @()
            foreach ($c in $chunkNames) {
                if ($hasThreadJob) {
                    $jobs += Start-ThreadJob -ScriptBlock {
                        param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null
                    } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $c, $dlDir
                } else {
                    $jobs += Start-Job -ScriptBlock {
                        param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null
                    } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $c, $dlDir
                }
            }
            $null = Wait-Job $jobs -Timeout 120
            $jobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }

            $firstChunk = Get-ChildItem $dlDir -Filter '*.7z.001' | Select-Object -First 1
            if (-not $firstChunk) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }

            $stage = "$env:VHD_CONTAINER\restore-stage"
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            & 7z x $firstChunk.FullName "-o$stage" -y -mmt=4 *> $null
            Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue

            $stateHit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            $sourceRoot = if ($stateHit) { $stateHit.Directory.Parent.FullName } else { $stage }
            robocopy $sourceRoot $env:SHARED_ROOT /E /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null
            $global:LASTEXITCODE = 0

            $oldProf = "$env:PROFILE_ROOT\$env:RDP_USER"
            if (Test-Path $oldProf) {
                $skip = @("$oldProf\AppData\Local\Packages","$oldProf\AppData\Local\Temp")
                robocopy $oldProf $env:PROFILE_PATH /E /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* /XD @skip *> $null
                $global:LASTEXITCODE = 0
            }

            if (Test-Path $env:SHARED_STATE_FILE) {
                try { $s = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json; if ($s.password) { "RESTORE_PASS=$($s.password)" >> $env:GITHUB_ENV } } catch {}
            }
            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
            'DATA_RESTORED=1' >> $env:GITHUB_ENV
            Write-Host "OK Restore" -ForegroundColor Green
          } catch { Write-Host "WARN Restore: $_" -ForegroundColor Yellow; 'DATA_RESTORED=1' >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0

      - name: 🔗 Gắn kết OS
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            $osDir = $env:SHARED_OS_DIR
            $instCache = "$osDir\Installers"
            @("$osDir\InstalledApps","$osDir\bin",$instCache,"$osDir\Sunshine-Config","$osDir\Wallpaper") |
              ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
            if (-not (Test-Path 'C:\ALB-Apps')) { New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target "$osDir\InstalledApps" -Force | Out-Null }
            "INSTALLER_CACHE=$instCache" >> $env:GITHUB_ENV
            "SUNSHINE_PERSIST_CFG=$osDir\Sunshine-Config" >> $env:GITHUB_ENV
            "WALLPAPER_DIR=$osDir\Wallpaper" >> $env:GITHUB_ENV
            Write-Host "OK Gan ket" -ForegroundColor Green
          } catch { Write-Host "WARN: $_" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      - name: 🔐 RDP + Firewall
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
            Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fSingleSessionPerUser 0 -Type DWord -Force
            $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
            @{UserAuthentication=1;SecurityLayer=2;fPromptForPassword=1;fResetBroken=0;fEnableRemoteFX=1;MaxIdleTime=0;MaxDisconnectionTime=0;MaxConnectionTime=0;fDisableAudioCapture=0;fNoRemoteDesktopWallpaper=0} |
              ForEach-Object { $_.GetEnumerator() | ForEach-Object { Set-ItemProperty $p $_.Key $_.Value -Type DWord -Force -ErrorAction SilentlyContinue } }
            @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP') | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
            New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -Profile Any | Out-Null
            New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
            New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null
            Set-Service TermService -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service TermService -ErrorAction SilentlyContinue
            Write-Host "OK RDP" -ForegroundColor Green
          } catch { Write-Host "WARN RDP: $_" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      - name: ⚡ Fix lag + CPU
        if: ${{ inputs.optimize_windows == true }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          tzutil /s 'SE Asia Standard Time' 2>$null
          try {
            $ult = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
            if ($ult -match '([a-f0-9\-]{36})') { & powercfg /setactive $Matches[1] 2>$null }
            & powercfg /change standby-timeout-ac 0; & powercfg /change monitor-timeout-ac 0; & powercfg /hibernate off
            & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
            & powercfg /setactive scheme_current 2>$null
          } catch {}
          try { $pt = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'; if (-not (Test-Path $pt)) { New-Item $pt -Force | Out-Null }; Set-ItemProperty $pt PowerThrottlingOff 1 -Type DWord -Force } catch {}
          @('wuauserv','DiagTrack','WSearch','SysMain','Spooler') | ForEach-Object { Stop-Service $_ -Force -ErrorAction SilentlyContinue; Set-Service $_ -StartupType Disabled -ErrorAction SilentlyContinue }
          $cpu = Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -First 1
          "CPU_MODEL_INFO=$($cpu.Name) ($($cpu.NumberOfLogicalProcessors) vCPU)" >> $env:GITHUB_ENV
          Write-Host "OK Fix lag" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🌐 Tailscale
        if: ${{ inputs.enable_tailscale == true }}
        timeout-minutes: 8
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
            "TAILSCALE_IP=127.0.0.1" >> $env:GITHUB_ENV; "FUNNEL_URL=" >> $env:GITHUB_ENV; "TS_STATUS=NO_KEY" >> $env:GITHUB_ENV; exit 0
          }
          try {
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            if (-not (Test-Path $ts)) {
              $msi = "$env:INSTALLER_CACHE\tailscale.msi"
              if (-not (Test-Path $msi)) { & curl.exe -L --retry 2 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -o $msi 2>$null }
              if (Test-Path $msi) { Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -NoNewWindow }
            }
            if (-not (Test-Path $ts)) { "TAILSCALE_IP=127.0.0.1" >> $env:GITHUB_ENV; "FUNNEL_URL=" >> $env:GITHUB_ENV; "TS_STATUS=FAIL" >> $env:GITHUB_ENV; exit 0 }
            Set-Service Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service Tailscale -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=alb-$($env:MACHINE_ID)" --accept-routes --accept-dns --reset --unattended
            if ($LASTEXITCODE -ne 0) { "TAILSCALE_IP=127.0.0.1" >> $env:GITHUB_ENV; "FUNNEL_URL=" >> $env:GITHUB_ENV; "TS_STATUS=AUTH_FAIL" >> $env:GITHUB_ENV; exit 0 }
            & $ts set --unattended=true 2>&1 | Out-Null
            Start-Sleep -Seconds 2
            $ip = (& $ts ip -4 2>&1 | Out-String).Trim()
            if ($ip -match '^\d+\.\d+\.\d+\.\d+$') { "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV } else { "TAILSCALE_IP=127.0.0.1" >> $env:GITHUB_ENV }
            $funnel = & $ts funnel status 2>&1 | Out-String
            if ($funnel -match '(https://[^\s]+)') { "FUNNEL_URL=$($Matches[1])" >> $env:GITHUB_ENV } else { "FUNNEL_URL=" >> $env:GITHUB_ENV }
            "TS_STATUS=CONNECTED" >> $env:GITHUB_ENV
            Write-Host "OK Tailscale" -ForegroundColor Green
          } catch { "TAILSCALE_IP=127.0.0.1" >> $env:GITHUB_ENV; "FUNNEL_URL=" >> $env:GITHUB_ENV; "TS_STATUS=ERROR" >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0

      - name: 🖥️ VDD + VB-Audio + Sunshine
        timeout-minutes: 12
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $ErrorActionPreference = 'Continue'
          $instCache = $env:INSTALLER_CACHE
          $sunPersist = $env:SUNSHINE_PERSIST_CFG
          $parts = $env:VDD_RES -split '[@x]'
          $w = if ($parts.Count -ge 1) { [int]$parts[0] } else { 1920 }
          $h = if ($parts.Count -ge 2) { [int]$parts[1] } else { 1080 }
          $hz = if ($parts.Count -ge 3) { [int]$parts[2] } else { 60 }

          # VDD
          try {
            $cache = "$instCache\.vdd"
            if (-not (Test-Path $cache)) {
              $zip = "$instCache\usbmmidd.zip"
              if (-not (Test-Path $zip)) { & curl.exe -L --retry 2 -s 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -o $zip 2>$null }
              if (Test-Path $zip) {
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                $z = [System.IO.Compression.ZipFile]::OpenRead($zip)
                New-Item -ItemType Directory -Force 'C:\usbmmidd_v2' | Out-Null
                foreach ($e in $z.Entries) { if ($e.Name -match '\.(inf|sys|cer|cat|exe)$') { [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, "C:\usbmmidd_v2\$($e.Name)", $true) } }
                $z.Dispose()
                if (Test-Path 'C:\usbmmidd_v2\deviceinstaller64.exe') {
                  Push-Location 'C:\usbmmidd_v2'
                  & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null
                  $wudf = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
                  New-Item $wudf -Force | Out-Null
                  Set-ItemProperty $wudf '0' "${w},${h},${hz}" -Force
                  & .\deviceinstaller64.exe enableidd 1 *> $null
                  Pop-Location
                }
              }
              New-Item -ItemType File -Force -Path $cache | Out-Null
            }
            Write-Host "OK VDD" -ForegroundColor Green
          } catch { Write-Host "WARN VDD: $_" -ForegroundColor Yellow }

          # VB-Audio
          try {
            $cache = "$instCache\.vb"
            if (-not (Test-Path $cache)) {
              $zip = "$instCache\VBCable.zip"
              if (-not (Test-Path $zip)) { & curl.exe -L --retry 2 -s 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -o $zip 2>$null }
              if (Test-Path $zip) {
                Add-Type -AssemblyName System.IO.Compression.FileSystem
                $z = [System.IO.Compression.ZipFile]::OpenRead($zip)
                foreach ($e in $z.Entries) { if ($e.Name -match '\.(inf|sys|cer|cat|exe)$') { [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, "$instCache\VBCable\$($e.Name)", $true) } }
                $z.Dispose()
                $inf = Get-ChildItem "$instCache\VBCable" -Filter 'VBCABLE_Setup_x64.inf' -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($inf) { pnputil /add-driver $inf.FullName /install *> $null }
              }
              New-Item -ItemType File -Force -Path $cache | Out-Null
            }
            Write-Host "OK VB-Audio" -ForegroundColor Green
          } catch { Write-Host "WARN VB: $_" -ForegroundColor Yellow }

          # Sunshine
          try {
            $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"
            if (-not (Test-Path $sunExe)) {
              $inst = "$instCache\sunshine-setup.exe"
              if (-not (Test-Path $inst)) { & curl.exe -L --retry 3 -s 'https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe' -o $inst 2>$null }
              if ((Test-Path $inst) -and (Get-Item $inst).Length -gt 5MB) { Start-Process $inst -ArgumentList '/S' -Wait -NoNewWindow -ErrorAction SilentlyContinue }
            }
            if (Test-Path $sunExe) {
              Stop-Service SunshineService,sunshinesvc -Force -ErrorAction SilentlyContinue
              Stop-Process -Name sunshine -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 1
              $cfg = "$sunDir\config"
              if ((Test-Path $cfg) -and ((Get-Item $cfg -Force).Attributes -notmatch 'ReparsePoint')) {
                if (@(Get-ChildItem $sunPersist -Force -ErrorAction SilentlyContinue).Count -eq 0) { Copy-Item "$cfg\*" $sunPersist -Recurse -Force -ErrorAction SilentlyContinue }
                Remove-Item $cfg -Recurse -Force -ErrorAction SilentlyContinue
              }
              New-Item -ItemType Junction $cfg -Target $sunPersist -Force | Out-Null
              $conf = "$sunPersist\sunshine.conf"
              if (-not (Test-Path $conf)) { Set-Content $conf -Value "sunshine_name = ALB-$($env:MACHINE_ID)`r`norigin_web_ui_allowed = wan`r`nupnp = disabled" -Encoding UTF8 }
              $svc = Get-Service SunshineService,sunshinesvc -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($svc) { Set-Service $svc.Name -StartupType Automatic; Start-Service $svc.Name -ErrorAction SilentlyContinue }
              else { Start-Process $sunExe -WorkingDirectory $sunDir -WindowStyle Hidden }
              Start-Sleep -Seconds 2
              Write-Host "OK Sunshine" -ForegroundColor Green
            }
          } catch { Write-Host "WARN Sunshine: $_" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      - name: 👤 User + Wallpaper
        shell: pwsh
        timeout-minutes: 8
        env:
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
          WALLPAPER_URL_INPUT: ${{ inputs.wallpaper_url }}
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          try {
            $pass = if ($env:FIXED_PASS_INPUT) { $env:FIXED_PASS_INPUT.Trim() } elseif ($env:RESTORE_PASS) { $env:RESTORE_PASS } else { 'Aistv@2026' }
            $sp = ConvertTo-SecureString $pass -AsPlainText -Force
            try { Set-LocalUser -Name $user -Password $sp -PasswordNeverExpires $true -ErrorAction Stop } catch {}
            & net user $user $pass /active:yes /expires:never *> $null
            Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue
            "RDP_PASS=$pass" >> $env:GITHUB_ENV
            $wl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
            Set-ItemProperty $wl AutoAdminLogon '1' -Force
            Set-ItemProperty $wl DefaultUserName $user -Force
            Set-ItemProperty $wl DefaultPassword $pass -Force
          } catch { Write-Host "WARN User: $_" -ForegroundColor Yellow }

          try {
            $wall = "$env:WALLPAPER_DIR\wall.jpg"
            if ($env:WALLPAPER_URL_INPUT -match '^https?://') { & curl.exe -L -s $env:WALLPAPER_URL_INPUT -o $wall 2>$null }
            if ((Test-Path $wall) -and (Get-Item $wall).Length -gt 50KB) {
              Set-ItemProperty 'HKCU:\Control Panel\Desktop' Wallpaper $wall -Force
              Set-ItemProperty 'HKCU:\Control Panel\Desktop' WallpaperStyle '10' -Force
            }
          } catch {}
          'SESSION_READY=1' >> $env:GITHUB_ENV
          Write-Host "OK User+Wallpaper" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════════
      # STEP CÀI APP — AN TOÀN TUYỆT ĐỐI, KHÔNG SCRIPTBLOCK LỒNG
      # ═══════════════════════════════════════════════
      - name: 🚀 Cài app — song song
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $instCache = $env:INSTALLER_CACHE
          $appsDir = 'C:\ALB-Apps'
          $desktop = "$env:PROFILE_PATH\Desktop"
          $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"
          New-Item -ItemType Directory -Force -Path $instCache,$appsDir,$desktop,$startup | Out-Null
          $hasThreadJob = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)

          # TẢI — mỗi job độc lập
          $jobs = @()

          $jobs += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock { param($p) if (-not (Test-Path "$p\EVKey.zip")) { & curl.exe -L --retry 2 -s 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip' -o "$p\EVKey.zip" 2>$null } } -ArgumentList $instCache
          } else {
            Start-Job -ScriptBlock { param($p) if (-not (Test-Path "$p\EVKey.zip")) { & curl.exe -L --retry 2 -s 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip' -o "$p\EVKey.zip" 2>$null } } -ArgumentList $instCache
          }

          $jobs += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock { param($p) $f="$p\VSCode.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://update.code.visualstudio.com/latest/win32-x64-system/stable' -o $f 2>$null } } -ArgumentList $instCache
          } else {
            Start-Job -ScriptBlock { param($p) $f="$p\VSCode.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://update.code.visualstudio.com/latest/win32-x64-system/stable' -o $f 2>$null } } -ArgumentList $instCache
          }

          $jobs += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock { param($p) $f="$p\Discord.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://dl.discord.com/apps/win/1.0.9171/DiscordSetup.exe' -o $f 2>$null } } -ArgumentList $instCache
          } else {
            Start-Job -ScriptBlock { param($p) $f="$p\Discord.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://dl.discord.com/apps/win/1.0.9171/DiscordSetup.exe' -o $f 2>$null } } -ArgumentList $instCache
          }

          $jobs += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock { param($p) $f="$p\Spotify.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://download.scdn.co/SpotifyFullSetupX64.exe' -o $f 2>$null } } -ArgumentList $instCache
          } else {
            Start-Job -ScriptBlock { param($p) $f="$p\Spotify.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://download.scdn.co/SpotifyFullSetupX64.exe' -o $f 2>$null } } -ArgumentList $instCache
          }

          $jobs += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock { param($p) $f="$p\bdcam.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://dl.bandicam.com/bdcamsetup.exe' -o $f 2>$null } } -ArgumentList $instCache
          } else {
            Start-Job -ScriptBlock { param($p) $f="$p\bdcam.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://dl.bandicam.com/bdcamsetup.exe' -o $f 2>$null } } -ArgumentList $instCache
          }

          $jobs += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock { param($p) $f="$p\Roblox.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe' -o $f 2>$null } } -ArgumentList $instCache
          } else {
            Start-Job -ScriptBlock { param($p) $f="$p\Roblox.exe"; if (-not (Test-Path $f)) { & curl.exe -L --retry 2 -s 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe' -o $f 2>$null } } -ArgumentList $instCache
          }

          $null = Wait-Job $jobs -Timeout 90
          $jobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }
          Write-Host "OK Tai installer" -ForegroundColor Green

          # EVKey
          try {
            $ev = "$appsDir\EVKey"
            if (-not (Test-Path "$ev\EVKey64.exe")) { if (Test-Path "$instCache\EVKey.zip") { Expand-Archive "$instCache\EVKey.zip" $ev -Force } }
            $exe = if (Test-Path "$ev\EVKey64.exe") { "$ev\EVKey64.exe" } elseif (Test-Path "$ev\EVKey32.exe") { "$ev\EVKey32.exe" } else { $null }
            if ($exe) {
              $ws = New-Object -ComObject WScript.Shell
              $ws.CreateShortcut("$startup\EVKey.lnk").TargetPath = $exe
              $ws.CreateShortcut("$desktop\EVKey.lnk").TargetPath = $exe
              Start-Process $exe -WorkingDirectory $ev -ErrorAction SilentlyContinue
            }
          } catch {}

          # CÀI — mỗi job độc lập
          $ij = @()

          $ij += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock {
              param($ic,$dd)
              $exe = 'C:\Program Files\Microsoft VS Code\Code.exe'
              if (-not (Test-Path $exe)) { $i="$ic\VSCode.exe"; if (Test-Path $i) { Start-Process $i -ArgumentList '/VERYSILENT','/NORESTART' -Wait -NoNewWindow -ErrorAction SilentlyContinue } }
              if (Test-Path $exe) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\VSCode.lnk").TargetPath=$exe }
            } -ArgumentList $instCache,$desktop
          } else {
            Start-Job -ScriptBlock {
              param($ic,$dd)
              $exe = 'C:\Program Files\Microsoft VS Code\Code.exe'
              if (-not (Test-Path $exe)) { $i="$ic\VSCode.exe"; if (Test-Path $i) { Start-Process $i -ArgumentList '/VERYSILENT','/NORESTART' -Wait -NoNewWindow -ErrorAction SilentlyContinue } }
              if (Test-Path $exe) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\VSCode.lnk").TargetPath=$exe }
            } -ArgumentList $instCache,$desktop
          }

          $ij += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock {
              param($ic,$dd)
              $exe = "$env:LOCALAPPDATA\Discord\Update.exe"
              if (-not (Test-Path $exe)) { $i="$ic\Discord.exe"; if (Test-Path $i) { $p=Start-Process $i -ArgumentList '--silent' -PassThru -NoNewWindow -ErrorAction SilentlyContinue; $null=$p.WaitForExit(60) } }
              $d = Get-ChildItem "$env:LOCALAPPDATA\Discord" -Filter 'Discord.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($d) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\Discord.lnk").TargetPath=$d.FullName }
            } -ArgumentList $instCache,$desktop
          } else {
            Start-Job -ScriptBlock {
              param($ic,$dd)
              $exe = "$env:LOCALAPPDATA\Discord\Update.exe"
              if (-not (Test-Path $exe)) { $i="$ic\Discord.exe"; if (Test-Path $i) { $p=Start-Process $i -ArgumentList '--silent' -PassThru -NoNewWindow -ErrorAction SilentlyContinue; $null=$p.WaitForExit(60) } }
              $d = Get-ChildItem "$env:LOCALAPPDATA\Discord" -Filter 'Discord.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($d) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\Discord.lnk").TargetPath=$d.FullName }
            } -ArgumentList $instCache,$desktop
          }

          $ij += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock {
              param($ic)
              if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")) { $i="$ic\Spotify.exe"; if (Test-Path $i) { $p=Start-Process $i -ArgumentList '/silent' -PassThru -NoNewWindow -ErrorAction SilentlyContinue; $null=$p.WaitForExit(40) } }
            } -ArgumentList $instCache
          } else {
            Start-Job -ScriptBlock {
              param($ic)
              if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")) { $i="$ic\Spotify.exe"; if (Test-Path $i) { $p=Start-Process $i -ArgumentList '/silent' -PassThru -NoNewWindow -ErrorAction SilentlyContinue; $null=$p.WaitForExit(40) } }
            } -ArgumentList $instCache
          }

          $ij += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock {
              param($ic,$dd)
              $exe = 'C:\Program Files\Bandicam\bdcam.exe'
              if (-not (Test-Path $exe)) { $i="$ic\bdcam.exe"; if (Test-Path $i) { Start-Process $i -ArgumentList '/S' -Wait -NoNewWindow -ErrorAction SilentlyContinue } }
              if (Test-Path $exe) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\Bandicam.lnk").TargetPath=$exe }
            } -ArgumentList $instCache,$desktop
          } else {
            Start-Job -ScriptBlock {
              param($ic,$dd)
              $exe = 'C:\Program Files\Bandicam\bdcam.exe'
              if (-not (Test-Path $exe)) { $i="$ic\bdcam.exe"; if (Test-Path $i) { Start-Process $i -ArgumentList '/S' -Wait -NoNewWindow -ErrorAction SilentlyContinue } }
              if (Test-Path $exe) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\Bandicam.lnk").TargetPath=$exe }
            } -ArgumentList $instCache,$desktop
          }

          $ij += if ($hasThreadJob) {
            Start-ThreadJob -ScriptBlock {
              param($ic,$dd)
              if (-not (Test-Path "$env:LOCALAPPDATA\Roblox\Versions")) { $i="$ic\Roblox.exe"; if (Test-Path $i) { Start-Process $i -ArgumentList '-q','--no-ui' -Wait -NoNewWindow -ErrorAction SilentlyContinue; Start-Sleep -Seconds 8 } }
              $r = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Filter 'RobloxPlayerBeta.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($r) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\Roblox.lnk").TargetPath=$r.FullName }
            } -ArgumentList $instCache,$desktop
          } else {
            Start-Job -ScriptBlock {
              param($ic,$dd)
              if (-not (Test-Path "$env:LOCALAPPDATA\Roblox\Versions")) { $i="$ic\Roblox.exe"; if (Test-Path $i) { Start-Process $i -ArgumentList '-q','--no-ui' -Wait -NoNewWindow -ErrorAction SilentlyContinue; Start-Sleep -Seconds 8 } }
              $r = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Filter 'RobloxPlayerBeta.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($r) { $ws=New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$dd\Roblox.lnk").TargetPath=$r.FullName }
            } -ArgumentList $instCache,$desktop
          }

          $null = Wait-Job $ij -Timeout 150
          $ij | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }
          Write-Host "OK Cai app" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🌐 Web Panel
        shell: pwsh
        timeout-minutes: 5
        run: |
          $tsIp = $env:TAILSCALE_IP
          $port = $env:WEB_PORT
          $url = if ($env:FUNNEL_URL) { $env:FUNNEL_URL } else { "http://${tsIp}:${port}" }
          "WEB_PANEL_URL=$url" >> $env:GITHUB_ENV

          $h = New-Object System.Collections.Generic.List[string]
          $h.Add('<!DOCTYPE html><html><head><meta charset="utf-8"><title>ALB v38</title></head><body>')
          $h.Add("<h1>ALB Panel v38.0</h1><p>Machine: $($env:MACHINE_ID)</p><p>IP: $tsIp</p><p>Panel: <a href='$url'>$url</a></p>")
          $h.Add("<p>User: $($env:RDP_USER) | Pass: $($env:RDP_PASS)</p></body></html>")
          Set-Content "$env:RUNNER_TEMP\panel.html" -Value ($h -join "`r`n") -Encoding UTF8

          $w = New-Object System.Collections.Generic.List[string]
          $w.Add('$l = [System.Net.HttpListener]::new()')
          $w.Add('$l.Prefixes.Add("http://+:' + $port + '/")')
          $w.Add('$l.Start()')
          $w.Add('while ($l.IsListening) { try { $c = $l.GetContext(); $h = Get-Content -Raw "$env:RUNNER_TEMP\panel.html"; $b = [System.Text.Encoding]::UTF8.GetBytes($h); $c.Response.ContentType = "text/html; charset=utf-8"; $c.Response.ContentLength64 = $b.Length; $c.Response.OutputStream.Write($b,0,$b.Length); $c.Response.OutputStream.Close() } catch {} }')
          Set-Content "$env:RUNNER_TEMP\web.ps1" -Value ($w -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile','-WindowStyle','Hidden','-File',"`"$env:RUNNER_TEMP\web.ps1`""
          Start-Sleep -Seconds 2
          Write-Host "OK Web Panel" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: ⏳ Watchdog
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        run: |
          function Test-Port { param($P) try { $t=[System.Net.Sockets.TcpClient]::new(); $a=$t.ConnectAsync('127.0.0.1',$P); if ($a.Wait(1500)) { $t.Close(); return $true }; $t.Close(); return $false } catch { return $false } }
          $start = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $end = $start + ([long]$env:TOTAL_MINUTES * 60)
          $save = "$env:RUNNER_TEMP\save-data.ps1"
          $sig = $env:CONTROL_SIGNAL_FILE
          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'
          while ($true) {
            if (Test-Path $sig) { $c = (Get-Content -Raw $sig).Trim(); Remove-Item $sig -Force -ErrorAction SilentlyContinue; if ($c -in 'save','SAVE_NOW') { & $save -Reason 'manual' }; elseif ($c -in 'restart','start-new') { 'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV; break }; elseif ($c -eq 'stop') { 'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV; break } }
            $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $remain = $end - $now
            if ($remain -le 0) { break }
            if (-not (Test-Port 47990)) { Start-Service SunshineService -ErrorAction SilentlyContinue }
            if (-not (Test-Port 3389)) { Restart-Service TermService -Force -ErrorAction SilentlyContinue }
            if (Test-Path $tsExe) { $st = & $tsExe status 2>&1 | Out-String; if ($st -notmatch '100\.') { & $tsExe up --reset --unattended 2>&1 | Out-Null } }
            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          try { $s = "$env:RUNNER_TEMP\save-data.ps1"; if (Test-Path $s) { & $s -Reason 'session-end' } } catch {}
          $global:LASTEXITCODE = 0

      - name: 🧹 Dọn dẹp
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            if (Test-Path $ts) { & $ts logout 2>&1 | Out-Null; & $ts down 2>&1 | Out-Null }
            @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP') | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
            Stop-Service TermService -Force -ErrorAction SilentlyContinue
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🔁 Auto-restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          WALL_URL: ${{ inputs.wallpaper_url }}
        run: |
          $wf = [System.IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])
          $a = @('workflow','run',$wf,'--ref',$env:GITHUB_REF_NAME,'-f',"machine_id=$env:MACHINE_ID",'-f',"duration=$env:DURATION",'-f','auto_restart=true','-f',"drive_letter=$env:MOUNT_LETTER",'-f',"vhd_size_gb=$env:VHD_SIZE_GB_VALIDATED",'-f',"windows_image=$env:WIN_IMAGE",'-f',"fixed_password=$env:FIXED_PASS",'-f',"vdd_resolution=$env:VDD_RES",'-f',"wallpaper_url=$env:WALL_URL")
          & gh @a
          if ($LASTEXITCODE -ne 0) { throw 'Auto-restart fail' }
