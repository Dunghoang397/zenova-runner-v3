          if (-not (Test-Path "$ts")) { "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV"; "FUNNEL_URL=" >> "$env:GITHUB_ENV"; exit 0 }
          Set-Service -Name 'Tailscale' -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name 'Tailscale' -ErrorAction SilentlyContinue; Start-Sleep -Seconds 6
          $tsHost = "alb-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)"; & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset --unattended
          if (($LASTEXITCODE) -ne 0) { Start-Sleep -Seconds 5; & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset --unattended; if (($LASTEXITCODE) -ne 0) { "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV"; "FUNNEL_URL=" >> "$env:GITHUB_ENV"; exit 0 } }
          & "$ts" set --unattended=true
          Start-Sleep -Seconds 2
          try { & "$ts" funnel --bg 8080 2>&1 | Out-Null; Start-Sleep -Seconds 3; $funnelStatus = (& "$ts" funnel status 2>&1 | Out-String); if ($funnelStatus -match '(https://[^\s]+)') { $funnelUrl = $Matches[1].TrimEnd('/'); "FUNNEL_URL=$funnelUrl" >> "$env:GITHUB_ENV"; Write-Host "OK: Funnel URL = $funnelUrl" -ForegroundColor Green } else { "FUNNEL_URL=" >> "$env:GITHUB_ENV" } } catch { "FUNNEL_URL=" >> "$env:GITHUB_ENV" }
          $ip = $null; 1..20 | ForEach-Object { if (-not ($ip)) { $out = (& "$ts" ip -4 2>&1 | Out-String).Trim(); if ("$out" -match '^\d+\.\d+\.\d+\.\d+$') { $ip = "$out" } else { Start-Sleep -Seconds 3 } } }
          if (-not ($ip)) { "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV"; exit 0 }
          "TAILSCALE_IP=$ip" >> "$env:GITHUB_ENV"
          exit 0

      - name: 👤 User gốc + Sunshine (Mật khẩu cố định Aistv@2026)
        shell: pwsh
        env:
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
        run: |
          $user = "$env:RDP_USER"; $profPath = "$env:PROFILE_PATH"
          if (-not ([string]::IsNullOrWhiteSpace("$env:FIXED_PASS_INPUT"))) { $matKhau = ("$env:FIXED_PASS_INPUT").Trim(); $source = 'fixed_input' }
          elseif ("$env:RESTORE_PASS") { $matKhau = "$env:RESTORE_PASS"; $source = 'restored' }
          else { $matKhau = 'Aistv@2026'; $source = 'default_fixed' }
          try { & net accounts /maxpwage:unlimited *> $null; $secCfg = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.cfg'); $secDb = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.sdb'); & secedit /export /cfg "$secCfg" *> $null; if (Test-Path "$secCfg") { $rawSec = Get-Content -Raw -Path "$secCfg"; $rawSec = $rawSec -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0'; $rawSec = $rawSec -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0'; Set-Content -Path "$secCfg" -Value "$rawSec" -Encoding Unicode; & secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY *> $null; Remove-Item -Path "$secCfg", "$secDb" -Force -ErrorAction SilentlyContinue } } catch {}
          $securePass = ConvertTo-SecureString "$matKhau" -AsPlainText -Force
          try { Set-LocalUser -Name "$user" -Password ($securePass) -PasswordNeverExpires ($true) -ErrorAction Stop } catch { & net user "$user" "$matKhau" /active:yes /expires:never *> $null }
          & net user "$user" "$matKhau" /active:yes /expires:never *> $null
          Add-LocalGroupMember -Group 'Administrators' -Member "$user" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "$user" -ErrorAction SilentlyContinue
          Enable-LocalUser -Name "$user" -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0; "RDP_PASS=$matKhau" >> "$env:GITHUB_ENV"; "RDP_PASS_SOURCE=$source" >> "$env:GITHUB_ENV"
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'; Set-ItemProperty -Path "$winlogon" -Name 'AutoAdminLogon' -Value '1' -Force; Set-ItemProperty -Path "$winlogon" -Name 'DefaultUserName' -Value "$user" -Force; Set-ItemProperty -Path "$winlogon" -Name 'DefaultPassword' -Value "$matKhau" -Force; Set-ItemProperty -Path "$winlogon" -Name 'DefaultDomainName' -Value "$env:COMPUTERNAME" -Force
          $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"; $sunPersistCfg = "$env:SUNSHINE_PERSIST_CFG"; $uObj = Get-LocalUser -Name "$user" -ErrorAction SilentlyContinue; $userSid = if ($uObj) { $uObj.SID.Value } else { $null }
          if (Test-Path "$sunExe") { if ($userSid) { & icacls "$sunDir" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null; & icacls "$sunPersistCfg" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null }; Push-Location "$sunDir"; & "$sunExe" --creds "$user" "$matKhau" *> $null; Pop-Location; $svcExe = "$sunDir\tools\sunshinesvc.exe"; $svcObj = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1; if ((-not ($svcObj)) -and (Test-Path "$svcExe")) { & sc.exe create SunshineService binPath= "`"$svcExe`"" start= auto DisplayName= "Sunshine Gamestream Service" *> $null; $svcObj = Get-Service -Name 'SunshineService' -ErrorAction SilentlyContinue }; if ($svcObj) { Set-Service -Name ($svcObj.Name) -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name ($svcObj.Name) -ErrorAction SilentlyContinue } else { Start-Process -FilePath "$sunExe" -WorkingDirectory "$sunDir" -WindowStyle Hidden }; "SUNSHINE_READY=1" >> "$env:GITHUB_ENV" }
          try { $desktopDir = [System.IO.Path]::Combine($profPath, 'Desktop'); New-Item -ItemType Directory -Force -Path "$desktopDir" | Out-Null; $ws = New-Object -ComObject WScript.Shell; @("$desktopDir", 'C:\Users\Public\Desktop') | ForEach-Object { $d = "$_"; $ws.CreateShortcut("$d\WEB-QUAN-LY-RDP.url").TargetPath = "http://127.0.0.1:$($env:WEB_PORT)/"; $ws.CreateShortcut("$d\WEB-QUAN-LY-RDP.url").Save(); $ws.CreateShortcut("$d\SUNSHINE-WEB-UI.url").TargetPath = "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"; $ws.CreateShortcut("$d\SUNSHINE-WEB-UI.url").Save(); $tsconBat = "$d\NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat"; $batLines = @('@echo off', 'for /f "tokens=3-4" %%a in (''query session %USERNAME%'') do @if "%%b"=="Active" tscon %%a /dest:console'); Set-Content -Path "$tsconBat" -Value ($batLines -join "`r`n") -Encoding ASCII } } catch {}
          'SESSION_READY=1' >> "$env:GITHUB_ENV"; exit 0

      - name: 📦 Cài EVKey + Spotify + Discord + StarDesk (SIÊU NHANH)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'; $ProgressPreference = 'SilentlyContinue'
          $user = "$env:RDP_USER"; $instCache = "$env:INSTALLER_CACHE"; $appsDir = "C:\ALB-Apps"
          New-Item -ItemType Directory -Force -Path "$instCache", "$appsDir\EVKey" | Out-Null
          try { Write-Host "  [1/4] EVKey..." -ForegroundColor Cyan; $evKeyZip = "$env:TEMP\EVKey.zip"; $evKeyDest = "$appsDir\EVKey"; if (-not (Test-Path "$evKeyDest\EVKey64.exe")) { Invoke-WebRequest -Uri "https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip" -OutFile $evKeyZip -UseBasicParsing -TimeoutSec 30; if (Test-Path $evKeyZip) { Expand-Archive -Path $evKeyZip -DestinationPath "$evKeyDest" -Force; $evKeyExe = if (Test-Path "$evKeyDest\EVKey64.exe") { "$evKeyDest\EVKey64.exe" } elseif (Test-Path "$evKeyDest\EVKey32.exe") { "$evKeyDest\EVKey32.exe" } else { $null }; if ($evKeyExe) { $startupDir = [System.IO.Path]::Combine($env:APPDATA, 'Microsoft\Windows\Start Menu\Programs\Startup'); New-Item -ItemType Directory -Force -Path "$startupDir" | Out-Null; $ws = New-Object -ComObject WScript.Shell; $ws.CreateShortcut("$startupDir\EVKey.lnk").TargetPath = "$evKeyExe"; $ws.CreateShortcut("$startupDir\EVKey.lnk").Save(); Write-Host "  OK: EVKey" -ForegroundColor Green } } } else { Write-Host "  OK: EVKey da co san" -ForegroundColor Green } } catch { Write-Host "  WARN: EVKey - $($_.Exception.Message)" -ForegroundColor Yellow }
          try { Write-Host "  [2/4] Spotify..." -ForegroundColor Cyan; $spCacheDir = [System.IO.Path]::Combine("$instCache", 'Spotify'); New-Item -ItemType Directory -Force -Path "$spCacheDir" | Out-Null; $spInstaller = "$spCacheDir\SpotifySetup.exe"; $spInstalled = Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe"; if ($spInstalled) { Write-Host "  OK: Spotify da cai san" -ForegroundColor Green } else { if (-not (Test-Path "$spInstaller")) { try { winget install Spotify.Spotify --silent --accept-package-agreements --accept-source-agreements 2>&1 | Out-Null; $global:LASTEXITCODE = 0 } catch {}; if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")) { try { Invoke-WebRequest -Uri "https://download.scdn.co/SpotifyFullSetupX64.exe" -OutFile "$spInstaller" -UseBasicParsing -TimeoutSec 60 } catch {} } }; if ((Test-Path "$spInstaller") -and ((Get-Item "$spInstaller").Length -gt 5MB)) { $proc = Start-Process -FilePath "$spInstaller" -ArgumentList '/silent', '/skip-app-launch' -Wait -PassThru } } } catch { Write-Host "  WARN: Spotify - $($_.Exception.Message)" -ForegroundColor Yellow }
          try { Write-Host "  [3/4] StarDesk..." -ForegroundColor Cyan; $sdBackup = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", "StarDesk-Backup"); $appExe = 'C:\Program Files\StarDesk\StarDesk.exe'; if (Test-Path "$sdBackup\ProgramFiles") { robocopy "$sdBackup\ProgramFiles" "C:\Program Files\StarDesk" /E /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0; if (Test-Path "$sdBackup\ProgramData") { robocopy "$sdBackup\ProgramData" "C:\ProgramData\StarDesk" /E /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }; if (Test-Path "$sdBackup\LocalAppData") { robocopy "$sdBackup\LocalAppData" "$env:LOCALAPPDATA\StarDesk" /E /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }; $sdRegDir = [System.IO.Path]::Combine("$sdBackup", "Registry"); if (Test-Path "$sdRegDir") { Get-ChildItem -Path "$sdRegDir" -Filter '*.reg' | ForEach-Object { reg import ($_.FullName) *>$null } } }; if (-not (Test-Path "$appExe")) { $sdInstaller = "$instCache\StarDesk_latest.exe"; if (-not (Test-Path $sdInstaller)) { try { Invoke-WebRequest -Uri "https://api.stardesk.net/api/v1/release/dl/1?channel=official" -OutFile $sdInstaller -UseBasicParsing -TimeoutSec 60 } catch {} }; if ((Test-Path "$sdInstaller") -and ((Get-Item "$sdInstaller").Length -gt 5MB)) { $proc = Start-Process -FilePath "$sdInstaller" -ArgumentList '/S' -Wait -PassThru -ErrorAction SilentlyContinue; Start-Sleep -Seconds 5 } }; Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | ForEach-Object { Set-Service -Name ($_.Name) -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name ($_.Name) -ErrorAction SilentlyContinue }; if (Test-Path "$appExe") { try { & schtasks.exe /Create /TN "ALB-Launch-StarDesk" /TR "`"$appExe`"" /SC ONCE /ST 00:00 /RU "$user" /RL HIGHEST /IT /F *> $null; & schtasks.exe /Run /TN "ALB-Launch-StarDesk" *> $null; Start-Sleep -Seconds 3 } catch {}; if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) { Start-Process -FilePath "$appExe" -WorkingDirectory 'C:\Program Files\StarDesk' -ErrorAction SilentlyContinue }; "STARDESK_READY=1" >> "$env:GITHUB_ENV" } } catch { Write-Host "  WARN: StarDesk - $($_.Exception.Message)" -ForegroundColor Yellow }
          try { Write-Host "  [4/4] Discord..." -ForegroundColor Cyan; Get-Process -Name "Discord*", "DiscordSetup*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1; Remove-Item -Path "$env:LOCALAPPDATA\Discord" -Recurse -Force -ErrorAction SilentlyContinue; $discord = "$env:TEMP\DiscordSetup.exe"; Invoke-WebRequest -Uri "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64" -OutFile $discord -UseBasicParsing -TimeoutSec 45; if (Test-Path $discord) { $proc = Start-Process -FilePath $discord -PassThru -NoNewWindow; $waited = 0; while ((-not $proc.HasExited) -and ($waited -lt 75)) { Start-Sleep -Seconds 1; $waited += 1 }; if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } } } catch { Write-Host "  WARN: Discord - $($_.Exception.Message)" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0; exit 0

      - name: 🌐 Web Panel (API + chống lag)
        shell: pwsh
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
        run: |
          $savePass = if ("$env:RDP_PASS_SOURCE" -ne 'secret') { "$env:RDP_PASS" } else { $null }
          $uObj = Get-LocalUser -Name "$env:RDP_USER" -ErrorAction SilentlyContinue; $userSid = $uObj.SID.Value
          $state = [ordered]@{ machineId = "$env:MACHINE_ID"; releaseTag = "$env:RELEASE_TAG"; user = "$env:RDP_USER"; sid = $userSid; password = $savePass; passwordSource = "$env:RDP_PASS_SOURCE"; windowsImage = "$env:WINDOWS_IMAGE"; osBuild = "$env:OS_BUILD"; driveLetter = "$env:MOUNT_LETTER"; tailscaleIp = "$env:TAILSCALE_IP"; funnelUrl = "$env:FUNNEL_URL"; durationMinutes = [int]"$env:TOTAL_MINUTES"; startUtc = (Get-Date).ToUniversalTime().ToString('o'); runId = "$env:GITHUB_RUN_ID"; lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString('o') }
          $state | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path "$env:SHARED_STATE_FILE" -Encoding UTF8
          $webScript = @'
          $ErrorActionPreference = "Continue"
          $listener = [System.Net.HttpListener]::new()
          $listener.Prefixes.Add("http://+:$($env:WEB_PORT)/")
          $listener.Start()
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60)
          $statusCache = @{}; $cacheTime = @{}
          while ($listener.IsListening) {
              try {
                  $ctx = $listener.GetContext(); $req = $ctx.Request; $resp = $ctx.Response
                  $path = $req.Url.AbsolutePath.ToLower()
                  $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
                  $remain = [math]::Max(0, ($endEpoch) - ($now))
                  if (($path -eq "/api/status" -or $path -eq "/health")) {
                      $cacheKey = "status"
                      if (-not $cacheTime[$cacheKey] -or ($now - $cacheTime[$cacheKey]) -gt 3) {
                          $ram = Get-CimInstance Win32_OperatingSystem
                          $disk = Get-PSDrive -Name "$env:MOUNT_LETTER" -ErrorAction SilentlyContinue
                          $statusCache[$cacheKey] = [ordered]@{ machineId = "$env:MACHINE_ID"; creator = "ALB"; status = "ok"; rdp = (Get-Service TermService -ErrorAction SilentlyContinue).Status.ToString(); remaining_seconds = $remain; remaining_display = "$([math]::Floor($remain/3600))h$([math]::Floor(($remain%3600)/60))m$($remain%60)s"; tailscale_ip = "$env:TAILSCALE_IP"; funnel_url = "$env:FUNNEL_URL"; drive = "$env:MOUNT_LETTER"; ram_total_gb = [math]::Round($ram.TotalVisibleMemorySize / 1MB, 1); ram_free_gb = [math]::Round($ram.FreePhysicalMemory / 1MB, 1); disk_total_gb = if ($disk) { [math]::Round(($disk.Used + $disk.Free) / 1GB, 1) } else { 0 }; disk_free_gb = if ($disk) { [math]::Round($disk.Free / 1GB, 1) } else { 0 }; apps = @(@{ name = "StarDesk"; ok = (Test-Path "C:\Program Files\StarDesk\StarDesk.exe") }, @{ name = "EVKey"; ok = (Test-Path "C:\ALB-Apps\EVKey\EVKey64.exe") }, @{ name = "Spotify"; ok = (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe") }) }
                          $cacheTime[$cacheKey] = $now
                      }
                      $json = $statusCache[$cacheKey] | ConvertTo-Json -Compress -Depth 5
                      $buf = [System.Text.Encoding]::UTF8.GetBytes("$json")
                      $resp.ContentType = "application/json"; $resp.ContentLength64 = $buf.Length
                      $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close(); continue
                  }
                  if (($req.HttpMethod -eq "POST") -and ($path -like "/api/action/*")) {
                      $action = $path -replace "/api/action/", ""
                      $valid = @("save", "restart", "stop", "start-new")
                      if ($action -in $valid) { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "$action" -Encoding UTF8; $result = @{ ok = $true; action = $action } | ConvertTo-Json -Compress }
                      else { $result = @{ ok = $false; error = "invalid action" } | ConvertTo-Json -Compress }
                      $buf = [System.Text.Encoding]::UTF8.GetBytes("$result")
                      $resp.ContentType = "application/json"; $resp.ContentLength64 = $buf.Length
                      $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close(); continue
                  }
                  $h = [math]::Floor($remain / 3600); $m = [math]::Floor(($remain % 3600) / 60); $s = $remain % 60
                  $html = "<!DOCTYPE html><html><head><meta charset='utf-8'><title>ALB Panel</title><link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap' rel='stylesheet'><style>body{background:#070a12;color:#eef2f8;font-family:Inter,sans-serif;padding:24px;display:flex;justify-content:center;min-height:100vh;align-items:center}.card{max-width:600px;width:100%;background:rgba(15,22,38,0.9);border:1px solid rgba(255,215,0,0.15);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}h1{font-family:'Playfair Display',serif;color:#ffd700;margin:0 0 8px;font-size:26px}.sub{color:#8a9bb8;font-size:13px;margin-bottom:24px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06)}.label{color:#8a9bb8;font-size:13px}.val{color:#eef2f8;font-weight:600;font-family:'JetBrains Mono',monospace}.val.gold{color:#ffd700}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.btn{padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;color:white}.btn-save{background:linear-gradient(135deg,#0ea5e9,#0369a1)}.btn-restart{background:linear-gradient(135deg,#f59e0b,#b45309)}.btn-stop{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn-new{background:linear-gradient(135deg,#8b5cf6,#6d28d9);grid-column:span 2}</style></head><body><div class='card'><h1>ALB PANEL</h1><div class='sub'>$env:MACHINE_ID · $env:TAILSCALE_IP</div><div class='row'><span class='label'>RDP</span><span class='val'>Running</span></div><div class='row'><span class='label'>Remaining</span><span class='val gold'>${h}h ${m}m ${s}s</span></div><div class='row'><span class='label'>Drive</span><span class='val'>$env:MOUNT_LETTER:\</span></div><div class='btns'><button class='btn btn-save' onclick='a(\"save\")'>Lưu</button><button class='btn btn-restart' onclick='a(\"restart\")'>Restart</button><button class='btn btn-stop' onclick='a(\"stop\")'>Tắt</button><button class='btn btn-new' onclick='a(\"start-new\")'>Phiên Mới</button></div></div><script>async function a(x){if(!confirm('Xác nhận '+x+'?'))return;try{const r=await fetch('/api/action/'+x,{method:'POST'});const j=await r.json();alert(j.ok?'OK':'Lỗi: '+j.error)}catch(e){alert('Lỗi kết nối')}}</script></body></html>"
                  $buf = [System.Text.Encoding]::UTF8.GetBytes($html)
                  $resp.ContentType = "text/html; charset=utf-8"; $resp.ContentLength64 = $buf.Length
                  $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close()
              } catch {}
          }
          '@
          $webScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'web-panel.ps1')
          Set-Content -Path "$webScriptPath" -Value $webScript -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScriptPath`""
          Start-Sleep -Seconds 3
          $test = Test-NetConnection 127.0.0.1 -Port $env:WEB_PORT -WarningAction SilentlyContinue
          if ($test.TcpTestSucceeded) { Write-Host "✅ Web Panel: http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Green }
          exit 0

      - name: 🎉 Thông tin kết nối
        shell: pwsh
        run: |
          $passText = "$env:RDP_PASS"; if ("$env:RDP_PASS_SOURCE" -eq 'secret') { $passText = '(secret)' }
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  ALB-VPSFREE — EVKEY + SPOTIFY + STARDESK MỚI NHẤT" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  May         : $env:MACHINE_ID" -ForegroundColor Cyan
          Write-Host "  IP Tailscale: $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "  Funnel URL  : $env:FUNNEL_URL" -ForegroundColor Yellow
          Write-Host "  User        : $env:RDP_USER" -ForegroundColor Green
          Write-Host "  Mat khau    : $passText (Aistv@2026)" -ForegroundColor Green
          Write-Host "  Web Panel   : http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "  Sunshine    : https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "  EVKey       : C:\ALB-Apps\EVKey" -ForegroundColor Green
          Write-Host "  Spotify     : winget + fallback" -ForegroundColor Green
          Write-Host "  StarDesk    : api.stardesk.net (bản mới nhất)" -ForegroundColor Green
          Write-Host "  Ngat VPS    : NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat (Desktop)" -ForegroundColor Green
          Write-Host "============================================================" -ForegroundColor Cyan
          exit 0

      - name: ⏳ Duy trì phiên
        id: keepalive
        shell: pwsh
        run: |
          function Test-Port { param($Port, $TimeoutMs = 1500) try { $tcp = New-Object System.Net.Sockets.TcpClient; $task = $tcp.ConnectAsync("127.0.0.1", $Port); if ($task.Wait($TimeoutMs)) { $tcp.Close(); return $true }; $tcp.Close(); return $false } catch { return $false } }
          $jobStart = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $endEpoch = $jobStart + (([long]$env:TOTAL_MINUTES) * 60); $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1'); $sigFile = "$env:CONTROL_SIGNAL_FILE"; $u = "$env:RDP_USER"; $sdExe = 'C:\Program Files\StarDesk\StarDesk.exe'
          $lastLog = (Get-Date).AddHours(-1); $warned = $false; $quserCache = (Get-Date).AddSeconds(-60)
          while ($true) {
              if (Test-Path "$sigFile") { $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim(); Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue; if ("$cmd" -eq 'save' -or "$cmd" -eq 'SAVE_NOW') { & "$saveScript" -Reason 'manual'; $global:LASTEXITCODE = 0 } elseif ("$cmd" -eq 'restart' -or "$cmd" -eq 'RESTART_SESSION') { 'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV"; break } elseif ("$cmd" -eq 'stop' -or "$cmd" -eq 'STOP_SESSION') { 'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV"; break } elseif ("$cmd" -eq 'start-new') { 'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV"; & "$saveScript" -Reason 'manual'; $global:LASTEXITCODE = 0; break } }
              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); $remain = $endEpoch - $now; if ($remain -le 0) { break }
              if (((Get-Date) - $lastLog).TotalMinutes -ge 5) { $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue; $sunOK = Test-Port 47990; $h = [math]::Floor($remain / 3600); $m = [math]::Floor(($remain % 3600) / 60); Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP:$($svc.Status) Sun:$sunOK Con:${h}h${m}m" -ForegroundColor Blue; $lastLog = Get-Date }
              if (-not (Test-Port 47990)) { Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; $sunSvc = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1; if ($sunSvc) { Start-Service -Name ($sunSvc.Name) -ErrorAction SilentlyContinue } else { Start-Process -FilePath 'C:\Program Files\Sunshine\sunshine.exe' -WorkingDirectory 'C:\Program Files\Sunshine' -WindowStyle Hidden -ErrorAction SilentlyContinue } }
              if ((Test-Path "$sdExe") -and (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue))) { Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue; & schtasks.exe /Run /TN "ALB-Launch-StarDesk" *> $null; Start-Sleep -Seconds 1 }
              if (((Get-Date) - $quserCache).TotalSeconds -gt 30) { try { @(quser 2>$null) | ForEach-Object { $lineStr = "$_"; if (("$lineStr" -match "^\s*>?$([regex]::Escape("$u"))\s+") -and ("$lineStr" -notmatch "\s+console\s+")) { $parts = (($lineStr -replace '^>', ' ').Trim()) -split '\s+'; $sidNum = $parts[1..(($parts.Count) - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1; if (($sidNum) -and ("$lineStr" -match "\s+Disc\s+")) { & tscon "$sidNum" /dest:console *> $null } } } } catch {}; $quserCache = Get-Date }
              if ((-not $warned) -and ($remain -le 300)) { try { msg * /TIME:290 "ALB RDP [$env:MACHINE_ID] sap het gio!" } catch {}; $warned = $true }
              Start-Sleep -Seconds 5
          }
          exit 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        run: |
          Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue; Stop-Process -Name 'sunshine' -Force -ErrorAction SilentlyContinue; & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1'); if (Test-Path "$saveScript") { & "$saveScript" -Reason 'session-end'; $global:LASTEXITCODE = 0 }; exit 0

      - name: 🧹 Dọn dẹp
        if: always()
        shell: pwsh
        run: |
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"; if (Test-Path "$ts") { & "$ts" logout 2>&1 | Out-Null; & "$ts" down 2>&1 | Out-Null }
          Remove-NetFirewallRule -DisplayName 'ALB-RDP' -ErrorAction SilentlyContinue; Remove-NetFirewallRule -DisplayName 'ALB-Sunshine-TCP' -ErrorAction SilentlyContinue; Remove-NetFirewallRule -DisplayName 'ALB-Sunshine-UDP' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force -ErrorAction SilentlyContinue; Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue; exit 0

      - name: 🔁 Auto-restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || inputs.auto_restart == 'true' || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          TS_ENABLED: ${{ inputs.enable_tailscale }}
        run: |
          $wf = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0])
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" -f "machine_id=$env:MACHINE_ID" -f "duration=$env:DURATION" -f auto_restart=true -f "drive_letter=$env:MOUNT_LETTER" -f "vhd_size_gb=$env:VHD_SIZE_GB" -f "windows_image=$env:WIN_IMAGE" -f "fixed_password=$env:FIXED_PASS" -f "vdd_resolution=$env:VDD_RES" -f "choco_packages=$env:PKGS" -f "optimize_windows=$($env:OPT.ToLower())" -f "enable_tailscale=$($env:TS_ENABLED.ToLower())"
          if (($LASTEXITCODE) -ne 0) { throw 'Restart fail' }
