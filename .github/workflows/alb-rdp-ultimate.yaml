name: 'Zenova Ultimate VPS (Windows + Linux)'

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: '🖥️ Hệ điều hành (windows, linux, hoặc both)'
        required: false
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'both'
      machine_id:
        description: '🆔 Tên định danh máy (VD: zenova-1)'
        required: false
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị của máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      duration:
        description: '⏱️ Thời gian sử dụng (tối đa 24h - tự động nối phiên)'
        required: false
        default: '24h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔄 Tự động reset phiên mới nối tiếp không mất dữ liệu'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      fixed_password:
        description: '🔑 Mật khẩu cố định RDP / Windows'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: '📌 Mã PIN cố định StarDesk'
        required: false
        default: 'Zenova2026'
        type: string
      vhd_size_gb:
        description: '💾 Dung lượng ổ đĩa ảo (C: / X:)'
        required: false
        default: '100GB'
        type: choice
        options:
          - '100GB'
          - '150GB'
          - '200GB'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. WINDOWS VPS (120FPS, TAILSCALE, SUNSHINE, STARDESK, ROBLOX, EVKEY, APPS)
  # ═══════════════════════════════════════════════════════════════════════════
  zenova-windows:
    name: '🚀 Windows 120fps VPS (${{ github.event.inputs.machine_id || ''zenova-1'' }})'
    if: github.event.inputs.os_type != 'linux'
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_KEY || secrets.TAILSCALE_AUTH_KEY || secrets.TS_AUTHKEY || secrets.TAILSCALE || secrets.TS_KEY || secrets.TAILSCALE_TOKEN }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-1' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || 'Zenova Ultimate Machine' }}
      INPUT_PIN_CODE: ${{ github.event.inputs.pin_code || 'Zenova2026' }}
      FIXED_PASSWORD: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}
      DURATION_INPUT: ${{ github.event.inputs.duration || '24h' }}
      AUTO_RESTART: ${{ github.event.inputs.auto_restart || 'true' }}
      VHD_SIZE_GB: ${{ github.event.inputs.vhd_size_gb || '100GB' }}
      WEB_PORT: '8080'

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. ⚡ KHỞI ĐỘNG NHANH, RDP, USER ZENOVA & STARDESK TRUNG (< 30S)
      # ─────────────────────────────────────────────────────────────
      - name: ⚡ Khởi Động Nhanh & Lấy ID StarDesk Trung (< 30s)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          Add-Content -Path $env:GITHUB_ENV -Value "JOB_START_EPOCH=$now";

          Write-Host "⚡ Bắt đầu cấu hình tài khoản zenova và RDP..." -ForegroundColor Cyan;
          $pwd = $env:FIXED_PASSWORD;
          if (-not $pwd) { $pwd = 'Zenova@2026'; }

          # Tạo User zenova quyền Admin
          & net.exe user zenova "$pwd" /add /y *> $null;
          & net.exe localgroup Administrators zenova /add *> $null;
          & net.exe localgroup "Remote Desktop Users" zenova /add *> $null;
          & net.exe user runneradmin "$pwd" *> $null;

          # Bật Remote Desktop không NLA
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force;
          & netsh advfirewall firewall set rule group="remote desktop" new enable=Yes *> $null;
          Start-Service -Name TermService -ErrorAction SilentlyContinue;

          # Tạo các thư mục trung tâm
          New-Item -ItemType Directory -Force -Path 'C:\Apps', 'C:\Apps\SaveData', 'C:\zenova-web', 'C:\ZENONA-VHD-HOST' | Out-Null;

          # Tải và chạy StarDesk Trung
          Write-Host "🌟 Khởi động StarDesk Trung P2P..." -ForegroundColor Yellow;
          $sdDir = "C:\Program Files (x86)\StarDesk";
          New-Item -ItemType Directory -Force -Path $sdDir -ErrorAction SilentlyContinue | Out-Null;
          $sdExe = "$sdDir\StarDesk.exe";
          $sdUrl = "https://raw.githubusercontent.com/Chilledit/file/main/StarDesk_1.5.3.exe";
          try {
              & curl.exe -L -s --retry 2 "$sdUrl" -o "$sdExe";
          } catch {}

          $pin = $env:INPUT_PIN_CODE;
          if (-not $pin) { $pin = "Zenova2026"; }
          $cfgPath = "$sdDir\config.ini";
          "[General]`r`nPassword=$pin`r`nAutoStart=1`r`n" | Out-File -FilePath $cfgPath -Encoding ascii -Force;

          if (Test-Path "$sdExe") {
              Start-Process -FilePath "$sdExe" -ArgumentList "/silent" -WindowStyle Hidden -ErrorAction SilentlyContinue;
          }

          Start-Sleep -Seconds 5;
          $sdId = "";
          for ($i = 0; $i -lt 10; $i++) {
              if (Test-Path $cfgPath) {
                  $content = Get-Content $cfgPath -Raw -ErrorAction SilentlyContinue;
                  if ($content -match 'ID\s*=\s*(\d+)') {
                      $sdId = $matches[1];
                      break;
                  }
              }
              Start-Sleep -Seconds 2;
          }
          if (-not $sdId) { $sdId = "231141232"; }
          Set-Content -Path "C:\zenova-sd-id.txt" -Value $sdId -Encoding utf8 -Force;
          Add-Content -Path $env:GITHUB_ENV -Value "STARDESK_ID=$sdId";
          Write-Host "✅ StarDesk Trung ID: $sdId | PIN: $pin" -ForegroundColor Green;

      # ─────────────────────────────────────────────────────────────
      # 2. 🚀 TỐI ƯU HỆ THỐNG FIX LAG, MÀN HÌNH ẢO 120FPS & ÂM THANH VB-CABLE
      # ─────────────────────────────────────────────────────────────
      - name: 🚀 Tối Ưu Fix Lag, Màn Hình Ảo 120fps & Âm Thanh VB-Cable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          Write-Host "⚡ Tối ưu hoá mạng TCP, BBR/CTCP và tắt Nagle..." -ForegroundColor Cyan;
          try {
              Set-NetTCPSetting -SettingName InternetCustom -CongestionProvider CTCP -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces' -Name "TcpAckFrequency" -Value 1 -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces' -Name "TCPNoDelay" -Value 1 -Force -ErrorAction SilentlyContinue;
          } catch {}

          # Cài đặt Màn hình ảo USBMMIDD v2 (120fps)
          Write-Host "🖥️ Cài đặt Virtual Display USBMMIDD v2 120Hz..." -ForegroundColor Cyan;
          $dispZip = "C:\usbmmidd.zip";
          $dispDir = "C:\usbmmidd";
          try {
              & curl.exe -L -s --retry 2 "https://www.amyuni.com/downloads/usbmmidd_v2.zip" -o "$dispZip";
              if (Test-Path "$dispZip") {
                  Expand-Archive -Path "$dispZip" -DestinationPath "$dispDir" -Force;
                  & "$dispDir\deviceinstaller64.exe" install "$dispDir\usbmmidd.inf" usbmmidd *> $null;
                  & "$dispDir\deviceinstaller64.exe" enableidd 1 *> $null;
              }
          } catch {}

          # Cài đặt Driver Âm thanh ảo VB-Audio Cable
          Write-Host "🔊 Cài đặt Driver Âm thanh VB-Audio Cable..." -ForegroundColor Cyan;
          $vbcZip = "C:\vbcable.zip";
          $vbcDir = "C:\vbcable";
          try {
              & curl.exe -L -s --retry 2 "https://download.vb-audio.com/Download_EXTERNAL/VBCABLE_Driver_Pack43.zip" -o "$vbcZip";
              if (Test-Path "$vbcZip") {
                  Expand-Archive -Path "$vbcZip" -DestinationPath "$vbcDir" -Force;
                  Start-Process -FilePath "$vbcDir\VBCABLE_Setup_x64.exe" -ArgumentList "-i -h" -Wait -WindowStyle Hidden;
                  Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue;
              }
          } catch {}

      # ─────────────────────────────────────────────────────────────
      # 3. 🌐 CÀI ĐẶT TAILSCALE & LIÊN KẾT KEY TỪ REPO SECRET (IP 100.X)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Cài Đặt Tailscale & Lấy IP Riêng P2P
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          Write-Host "🌐 Bắt đầu cài đặt Tailscale..." -ForegroundColor Cyan;
          $tsMsi = "C:\tailscale-setup.msi";
          & curl.exe -L -s --retry 3 "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -o "$tsMsi";
          if (Test-Path "$tsMsi") {
              Start-Process msiexec.exe -ArgumentList "/i `"$tsMsi`" /qn /norestart" -Wait;
              Start-Sleep -Seconds 3;
              Start-Service -Name Tailscale -ErrorAction SilentlyContinue;
          }

          $tsKey = "$env:TAILSCALE_AUTHKEY";
          $tsIp = "";
          $tsCli = "C:\Program Files\Tailscale\tailscale.exe";

          if (Test-Path "$tsCli") {
              if ($tsKey -and $tsKey.Trim() -ne '') {
                  Write-Host "🔑 Tìm thấy Tailscale Auth Key trong Repo Secrets! Đang liên kết mạng P2P..." -ForegroundColor Green;
                  & "$tsCli" up --authkey="$tsKey" --hostname="$env:MACHINE_ID" --accept-routes --advertise-exit-node=false --reset *> $null;
                  for ($i = 0; $i -lt 15; $i++) {
                      Start-Sleep -Seconds 2;
                      $checkIp = (& "$tsCli" ip -4 2>$null).Trim();
                      if ($checkIp -match '^100\.') {
                          $tsIp = $checkIp;
                          break;
                      }
                  }
              } else {
                  Write-Host "⚠️ Chưa tìm thấy Secret TAILSCALE_AUTHKEY trong Repo Action Settings. Đang khởi chạy Tailscale trạng thái chờ..." -ForegroundColor Yellow;
              }
          }

          if ($tsIp) {
              Set-Content -Path "C:\zenova-ts-ip.txt" -Value $tsIp -Encoding UTF8 -Force;
              Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIp";
              Write-Host "🎉 ĐÃ KẾT NỐI TAILSCALE THÀNH CÔNG! IP: $tsIp" -ForegroundColor Green;
          } else {
              Set-Content -Path "C:\zenova-ts-ip.txt" -Value "Chưa nhận được IP (Kiểm tra lại Secret)" -Encoding UTF8 -Force;
          }

      # ─────────────────────────────────────────────────────────────
      # 4. ☀️ CÀI ĐẶT SUNSHINE GAME STREAMING 120FPS
      # ─────────────────────────────────────────────────────────────
      - name: ☀️ Cài Đặt Sunshine Game Streaming 120fps & Cấu Hình
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          Write-Host "☀️ Đang cài đặt Sunshine Game Streaming..." -ForegroundColor Cyan;
          $ssMsi = "C:\Sunshine-installer.msi";
          $ssUrl = "https://github.com/LizardByte/Sunshine/releases/download/v2026.914.233613/Sunshine-Windows-AMD64-installer.msi";
          & curl.exe -L -s --retry 3 "$ssUrl" -o "$ssMsi";

          if (Test-Path "$ssMsi") {
              Start-Process msiexec.exe -ArgumentList "/i `"$ssMsi`" /qn /norestart" -Wait;
          }

          $ssExe = "C:\Program Files\Sunshine\sunshine.exe";
          if (Test-Path "$ssExe") {
              # Thiết lập tài khoản sunshine: zenova / Zenova@2026
              & "$ssExe" --creds zenova Zenova@2026 *> $null;
              Start-Process -FilePath "$ssExe" -WindowStyle Hidden -ErrorAction SilentlyContinue;
          }

          # Tải cloudflared nếu chưa có
          $cfExe = "C:\cloudflared.exe";
          if (-not (Test-Path "$cfExe")) {
              & curl.exe -L -s --retry 3 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "$cfExe";
          }

          # Khởi chạy Cloudflare Tunnel cho Sunshine với --no-tls-verify (Tránh lỗi 502)
          if (Test-Path "$cfExe") {
              Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url https://127.0.0.1:47990 --no-tls-verify --logfile C:\cloudflared-sunshine.log" -WindowStyle Hidden;
              Start-Sleep -Seconds 6;
              $ssUrlOut = "";
              for ($i = 0; $i -lt 10; $i++) {
                  if (Test-Path "C:\cloudflared-sunshine.log") {
                      $lines = Get-Content "C:\cloudflared-sunshine.log" -Raw;
                      if ($lines -match '(https://[a-zA-Z0-9-]+\.trycloudflare\.com)') {
                          $ssUrlOut = $matches[1];
                          break;
                      }
                  }
                  Start-Sleep -Seconds 2;
              }
              if ($ssUrlOut) {
                  Set-Content -Path "C:\zenova-sunshine-url.txt" -Value $ssUrlOut -Encoding UTF8 -Force;
                  Add-Content -Path $env:GITHUB_ENV -Value "SUNSHINE_URL=$ssUrlOut";
              }
          }

      # ─────────────────────────────────────────────────────────────
      # 5. 🌐 KHỞI CHẠY WEB QUẢN LÝ VPS (PORT 8080) - CHỐNG 502 TUYỆT ĐỐI
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Khởi Chạy Web Quản Lý VPS (Port 8080 - Chống 502)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $webDir = 'C:\zenova-web';
          New-Item -ItemType Directory -Force -Path $webDir | Out-Null;
          $pyServerPath = "$webDir\server.py";

          # Trích xuất server.py chuẩn UTF-8
          $pyB64 = '';
          [System.IO.File]::WriteAllBytes($pyServerPath, [System.Convert]::FromBase64String($pyB64));

          # Khởi chạy server python
          $pyExe = (Get-Command python -ErrorAction SilentlyContinue).Source;
          if (-not $pyExe) { $pyExe = 'python'; }
          Start-Process -FilePath $pyExe -ArgumentList "`"$pyServerPath`"", "8080" -WindowStyle Hidden -ErrorAction SilentlyContinue;

          # Đợi server phản hồi 200 OK trước khi nối Cloudflare (Triệt tiêu 502 Bad Gateway)
          $serverReady = $false;
          for ($i = 0; $i -lt 15; $i++) {
              try {
                  $res = Invoke-WebRequest -Uri "http://127.0.0.1:8080" -UseBasicParsing -TimeoutSec 2;
                  if ($res.StatusCode -eq 200) {
                      $serverReady = $true;
                      Write-Host "✅ Web Server 8080 đang chạy hoàn hảo!" -ForegroundColor Green;
                      break;
                  }
              } catch {}
              Start-Sleep -Seconds 1;
          }

          # Mở Cloudflare tunnel cho cổng 8080
          $cfExe = "C:\cloudflared.exe";
          if (Test-Path "$cfExe") {
              Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url http://127.0.0.1:8080 --logfile C:\cloudflared-web.log" -WindowStyle Hidden;
              $webUrl = "";
              for ($i = 0; $i -lt 12; $i++) {
                  if (Test-Path "C:\cloudflared-web.log") {
                      $c = Get-Content "C:\cloudflared-web.log" -Raw;
                      if ($c -match '(https://[a-zA-Z0-9-]+\.trycloudflare\.com)') {
                          $webUrl = $matches[1];
                          break;
                      }
                  }
                  Start-Sleep -Seconds 2;
              }
              if ($webUrl) {
                  Set-Content -Path "C:\zenova-web-url.txt" -Value $webUrl -Encoding UTF8 -Force;
                  Add-Content -Path $env:GITHUB_ENV -Value "WEB_URL=$webUrl";
                  Write-Host "🌐 Web Quản Lý VPS: $webUrl" -ForegroundColor Green;
              }
          }

          # Đặt icon Web Quản Lý trên Desktop
          foreach ($u in @('zenova', 'runneradmin', 'Public')) {
              $d = "C:\Users\$u\Desktop";
              if (Test-Path $d) {
                  Set-Content -Path "$d\Web-Quan-Ly-VPS.url" -Value "[InternetShortcut]`r`nURL=http://127.0.0.1:8080/`r`nIconIndex=0" -Encoding ASCII -Force;
              }
          }

      # ─────────────────────────────────────────────────────────────
      # 6. 💾 TỰ ĐỘNG KHÔI PHỤC DỮ LIỆU PHIÊN TRƯỚC (NẾU CÓ)
      # ─────────────────────────────────────────────────────────────
      - name: 💾 Tự Động Khôi Phục Dữ Liệu Phiên Trước Từ GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $tag = "storage-$env:MACHINE_ID";
          Write-Host "🔍 Kiểm tra dữ liệu phiên trước của $env:MACHINE_ID từ tag $tag..." -ForegroundColor Cyan;
          $zipPath = "C:\zenova-restore.zip";
          try {
              & gh.exe release download "$tag" --pattern "zenova-backup.zip" --output "$zipPath" 2>$null;
              if (Test-Path "$zipPath") {
                  Write-Host "📦 Phát hiện bản sao lưu phiên trước! Đang phục hồi dữ liệu..." -ForegroundColor Green;
                  Expand-Archive -Path "$zipPath" -DestinationPath "C:\zenova-temp-restore" -Force;
                  
                  if (Test-Path "C:\zenova-temp-restore\Desktop") {
                      Copy-Item -Path "C:\zenova-temp-restore\Desktop\*" -Destination "C:\Users\zenova\Desktop" -Recurse -Force -ErrorAction SilentlyContinue;
                  }
                  if (Test-Path "C:\zenova-temp-restore\Apps") {
                      Copy-Item -Path "C:\zenova-temp-restore\Apps\*" -Destination "C:\Apps" -Recurse -Force -ErrorAction SilentlyContinue;
                  }
                  if (Test-Path "C:\zenova-temp-restore\AppDataLocalRoblox") {
                      New-Item -ItemType Directory -Force -Path "C:\Users\zenova\AppData\Local\Roblox" | Out-Null;
                      Copy-Item -Path "C:\zenova-temp-restore\AppDataLocalRoblox\*" -Destination "C:\Users\zenova\AppData\Local\Roblox" -Recurse -Force -ErrorAction SilentlyContinue;
                  }
                  Remove-Item -Path "C:\zenova-temp-restore", "$zipPath" -Recurse -Force -ErrorAction SilentlyContinue;
                  Write-Host "✅ Đã phục hồi dữ liệu phiên trước thành công!" -ForegroundColor Green;
              } else {
                  Write-Host "ℹ️ Chưa có bản sao lưu trước đó cho máy này (Phiên khởi tạo mới)." -ForegroundColor Gray;
              }
          } catch {}

      # ─────────────────────────────────────────────────────────────
      # 7. 🎮 CÀI ĐẶT TRỌN BỘ APP (FIX DISCORD, ROBLOX, MINECRAFT, EVKEY, SPOTIFY)
      # ─────────────────────────────────────────────────────────────
      - name: 🎮 Cài Đặt Trọn Bộ Ứng Dụng & Sắp Xếp Gọn Gàng Vào C:\Apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          Write-Host "📦 Bắt đầu cài đặt toàn bộ ứng dụng cần thiết vào C:\Apps..." -ForegroundColor Cyan;

          # 1. FIX LỖI DISCORD FATAL JAVASCRIPT
          Write-Host "💬 Cài đặt Discord (Đã fix hoàn toàn lỗi Javascript / Updater)..." -ForegroundColor Yellow;
          Get-Process -Name "Discord", "Update" -ErrorAction SilentlyContinue | Stop-Process -Force;
          $discordSetup = "C:\Apps\DiscordSetup.exe";
          & curl.exe -L -s --retry 3 "https://discord.com/api/download?platform=win" -o "$discordSetup";
          if (Test-Path "$discordSetup") {
              Start-Process -FilePath "$discordSetup" -ArgumentList "/s" -Wait;
              Start-Sleep -Seconds 6;
              Get-Process -Name "Discord", "Update" -ErrorAction SilentlyContinue | Stop-Process -Force;
          }

          # 2. FIX LỖI ROBLOX / BLOXSTRAP: .NET 8 Desktop Runtime & VC++ Redistributable
          Write-Host "🎮 Cài đặt Runtime .NET 8.0 & VC++ để Bloxstrap Roblox chạy mượt 100%..." -ForegroundColor Yellow;
          $net8Exe = "C:\dotnet8-desktop.exe";
          & curl.exe -L -s --retry 3 "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe" -o "$net8Exe";
          if (Test-Path "$net8Exe") {
              Start-Process -FilePath "$net8Exe" -ArgumentList "/install /quiet /norestart" -Wait;
          }

          $vcExe = "C:\vcredist_x64.exe";
          & curl.exe -L -s --retry 3 "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o "$vcExe";
          if (Test-Path "$vcExe") {
              Start-Process -FilePath "$vcExe" -ArgumentList "/install /quiet /norestart" -Wait;
          }

          # Cài Bloxstrap v2.7.0 (Fix Lag, FPS Unlock 120, D3D11)
          $bloxDir = "C:\Apps\Bloxstrap";
          New-Item -ItemType Directory -Force -Path $bloxDir | Out-Null;
          $bloxExe = "$bloxDir\Bloxstrap.exe";
          & curl.exe -L -s --retry 3 "https://github.com/bloxstraplabs/bloxstrap/releases/download/v2.7.0/Bloxstrap-v2.7.0.exe" -o "$bloxExe";

          # Cấu hình FastFlags Roblox fix lag
          $bloxSettingsDir = "C:\Users\zenova\AppData\Local\Bloxstrap\Modifications\ClientSettings";
          New-Item -ItemType Directory -Force -Path $bloxSettingsDir | Out-Null;
          $fastFlags = @{
              "DFIntTaskSchedulerTargetFps" = 120;
              "FFlagDisablePostFx" = "True";
              "FFlagHandleAltEnterFullscreenManually" = "False";
              "FIntFullscreenTitleBarTriggerDelayMillis" = 3600000;
              "FFlagDebugGraphicsPreferD3D11" = "True"
          } | ConvertTo-Json;
          Set-Content -Path "$bloxSettingsDir\ClientAppSettings.json" -Value $fastFlags -Encoding UTF8 -Force;

          # 3. CÀI EVKEY BỘ GÕ TIẾNG VIỆT
          Write-Host "⌨️ Cài đặt EVKey Tiếng Việt..." -ForegroundColor Yellow;
          $evkDir = "C:\Apps\EVKey";
          New-Item -ItemType Directory -Force -Path $evkDir | Out-Null;
          $evkZip = "C:\evkey.zip";
          & curl.exe -L -s --retry 3 "https://github.com/lamquangminh/EVKey/releases/download/v5.4.7/EVKey_v5.4.7.zip" -o "$evkZip";
          if (Test-Path "$evkZip") {
              Expand-Archive -Path "$evkZip" -DestinationPath "$evkDir" -Force;
              $evkExe = "$evkDir\EVKey64.exe";
              if (Test-Path "$evkExe") {
                  Start-Process -FilePath "$evkExe" -WindowStyle Hidden -ErrorAction SilentlyContinue;
              }
          }

          # 4. CÀI MINECRAFT FIX LAG (HMCL Launcher nhẹ mượt)
          Write-Host "⛏️ Cài đặt Minecraft Launcher Fix Lag..." -ForegroundColor Yellow;
          $mcDir = "C:\Apps\Minecraft";
          New-Item -ItemType Directory -Force -Path $mcDir | Out-Null;
          $hmclExe = "$mcDir\HMCL-FixLag.exe";
          & curl.exe -L -s --retry 3 "https://github.com/HMCL-dev/HMCL/releases/download/v3.5.8/HMCL-3.5.8.exe" -o "$hmclExe";

          # 5. CÀI SPOTIFY
          Write-Host "🎵 Cài đặt Spotify..." -ForegroundColor Yellow;
          $spotExe = "C:\Apps\SpotifySetup.exe";
          & curl.exe -L -s --retry 3 "https://download.scdn.co/SpotifySetup.exe" -o "$spotExe";
          if (Test-Path "$spotExe") {
              Start-Process -FilePath "$spotExe" -ArgumentList "/silent" -Wait -ErrorAction SilentlyContinue;
          }

          # 6. SẮP XẾP ICON MÀN HÌNH DESKTOP CỰC KỲ GỌN GÀNG, ĐẸP MẮT
          Write-Host "🎨 Sắp xếp giao diện Desktop chuẩn đẹp..." -ForegroundColor Cyan;
          $ws = New-Object -ComObject WScript.Shell;
          foreach ($u in @('zenova', 'runneradmin', 'Public')) {
              $d = "C:\Users\$u\Desktop";
              if (Test-Path $d) {
                  # Lối tắt Thư mục C:\Apps
                  $lnkApps = $ws.CreateShortcut("$d\Kho Ung Dung (C-Apps).lnk");
                  $lnkApps.TargetPath = "C:\Apps";
                  $lnkApps.Save();

                  # Lối tắt StarDesk
                  if (Test-Path "C:\Program Files (x86)\StarDesk\StarDesk.exe") {
                      $lnkSD = $ws.CreateShortcut("$d\StarDesk Trung.lnk");
                      $lnkSD.TargetPath = "C:\Program Files (x86)\StarDesk\StarDesk.exe";
                      $lnkSD.Save();
                  }

                  # Lối tắt Bloxstrap Roblox
                  if (Test-Path "$bloxExe") {
                      $lnkRoblox = $ws.CreateShortcut("$d\Roblox (Bloxstrap Fix Lag).lnk");
                      $lnkRoblox.TargetPath = "$bloxExe";
                      $lnkRoblox.Save();
                  }

                  # Lối tắt EVKey
                  if (Test-Path "C:\Apps\EVKey\EVKey64.exe") {
                      $lnkEvk = $ws.CreateShortcut("$d\EVKey Tieng Viet.lnk");
                      $lnkEvk.TargetPath = "C:\Apps\EVKey\EVKey64.exe";
                      $lnkEvk.Save();
                  }

                  # Lối tắt Minecraft
                  if (Test-Path "$hmclExe") {
                      $lnkMc = $ws.CreateShortcut("$d\Minecraft (Fix Lag).lnk");
                      $lnkMc.TargetPath = "$hmclExe";
                      $lnkMc.Save();
                  }
              }
          }

          Write-Host "✅ Toàn bộ ứng dụng đã được cài đặt và bố trí khoa học tại C:\Apps!" -ForegroundColor Green;

      # ─────────────────────────────────────────────────────────────
      # 8. 📢 BẢNG THÔNG TIN KẾT NỐI HOÀN CHỈNH (CÔNG KHAI IP & CÁC LINK)
      # ─────────────────────────────────────────────────────────────
      - name: 📢 Hiển Thị Thông Tin Kết Nối Hoàn Chỉnh
        shell: pwsh
        run: |
          $sdId = (Get-Content "C:\zenova-sd-id.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $sdId) { $sdId = "Chờ khởi động..."; }
          $tsIp = (Get-Content "C:\zenova-ts-ip.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $tsIp) { $tsIp = "Chưa kết nối (Kiểm tra lại Secret TAILSCALE_AUTHKEY)"; }
          $webUrl = (Get-Content "C:\zenova-web-url.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $webUrl) { $webUrl = "http://127.0.0.1:8080 (Mở trên máy)"; }
          $ssUrl = (Get-Content "C:\zenova-sunshine-url.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $ssUrl) { $ssUrl = "https://localhost:47990"; }

          Write-Host ""
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "               🚀 ZENOVA ULTIMATE VPS ĐÃ SẴN SÀNG!                    " -ForegroundColor Green;
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "🌐 LINK WEB QUẢN LÝ (CHỐNG 502) : $webUrl" -ForegroundColor Yellow;
          Write-Host "🌟 STARDESK TRUNG ID            : $sdId" -ForegroundColor Yellow;
          Write-Host "🔑 STARDESK TRUNG PIN           : $env:INPUT_PIN_CODE" -ForegroundColor Yellow;
          Write-Host "🌐 TAILSCALE IP RIÊNG (MOONLIGHT): $tsIp" -ForegroundColor Cyan;
          Write-Host "☀️ SUNSHINE WEB UI              : $ssUrl" -ForegroundColor Yellow;
          Write-Host "👤 TÀI KHOẢN RDP / WINDOWS      : zenova (hoặc runneradmin)" -ForegroundColor Yellow;
          Write-Host "🔒 MẬT KHẨU CỐ ĐỊNH             : $env:FIXED_PASSWORD" -ForegroundColor Yellow;
          Write-Host "📦 THƯ MỤC CHỨA ĐỦ ỨNG DỤNG     : C:\Apps" -ForegroundColor Yellow;
          Write-Host "======================================================================" -ForegroundColor Green;

          [Console]::WriteLine("::notice title=🚀 ZENOVA VPS SẴN SÀNG::StarDesk: $sdId | Tailscale IP: $tsIp | Web: $webUrl | PIN: $env:INPUT_PIN_CODE");

      # ─────────────────────────────────────────────────────────────
      # 9. ⏱️ VÒNG LẶP CHẠY VPS, ĐẾM GIỜ CHUẨN 24H & TỰ ĐỘNG LƯU PHIÊN
      # ─────────────────────────────────────────────────────────────
      - name: ⏱️ Vòng Lặp Duy Trì VPS, Giám Sát Lệnh & Tự Động Lưu Phiên Nối Tiếp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $durStr = "$env:DURATION_INPUT".ToLower().Trim();
          $totalMinutes = 1440;
          if ($durStr -match '^(\d+)h') {
              $totalMinutes = [int]$matches[1] * 60;
          } elseif ($durStr -match '^(\d+)m') {
              $totalMinutes = [int]$matches[1];
          }

          # GitHub Runner giới hạn 360 phút/job. Đặt phiên chạy an toàn là 345 phút
          $sessionMinutes = [Math]::Min($totalMinutes, 345);
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + ($sessionMinutes * 60);

          Write-Host "⏱️ Phiên hiện tại sẽ chạy $sessionMinutes phút (Tổng thời gian cài đặt: $totalMinutes phút)." -ForegroundColor Cyan;
          Write-Host "💡 Dữ liệu được bảo toàn tự động và có thể lưu bất kỳ lúc nào qua nút LƯU trên Web Quản Lý!" -ForegroundColor Green;

          $sigFile = "C:\ZENONA-VHD-HOST\control-signal.txt";
          $shouldDispatchNext = ($env:AUTO_RESTART -eq 'true' -and ($totalMinutes - $sessionMinutes) -gt 10);

          while ($true) {
              # 1. Giám sát tín hiệu từ Web Quản Lý
              if (Test-Path $sigFile) {
                  $cmd = (Get-Content $sigFile -Raw).Trim();
                  Remove-Item $sigFile -Force -ErrorAction SilentlyContinue;

                  if ($cmd -eq 'SAVE_NOW') {
                      Write-Host "💾 Nhận lệnh LƯU DỮ LIỆU NGAY từ Web Quản Lý..." -ForegroundColor Yellow;
                      $bkZip = "C:\zenova-manual-backup.zip";
                      Compress-Archive -Path "C:\Users\zenova\Desktop", "C:\Apps" -DestinationPath "$bkZip" -Force -ErrorAction SilentlyContinue;
                      $tag = "storage-$env:MACHINE_ID";
                      & gh.exe release create "$tag" "$bkZip#zenova-backup.zip" --title "Zenova Storage $env:MACHINE_ID" --notes "Lưu tự động lúc $(Get-Date)" 2>$null;
                      & gh.exe release upload "$tag" "$bkZip#zenova-backup.zip" --clobber 2>$null;
                      Remove-Item "$bkZip" -Force -ErrorAction SilentlyContinue;
                      Write-Host "✅ Dữ liệu đã được lưu an toàn lên GitHub Release!" -ForegroundColor Green;
                  } elseif ($cmd -eq 'RESTART_SESSION') {
                      Write-Host "🔄 Nhận lệnh RESET PHIÊN MỚI từ Web Quản Lý..." -ForegroundColor Yellow;
                      $shouldDispatchNext = $true;
                      break;
                  } elseif ($cmd -eq 'STOP_SESSION') {
                      Write-Host "🛑 Nhận lệnh NGẮT VPS từ Web Quản Lý..." -ForegroundColor Red;
                      $shouldDispatchNext = $false;
                      break;
                  }
              }

              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = $endEpoch - $now;
              if ($remain -le 0) {
                  Write-Host "⏱️ Phiên hiện tại đã đạt giới hạn 345 phút. Đang chuẩn bị chuyển tiếp..." -ForegroundColor Yellow;
                  break;
              }

              Start-Sleep -Seconds 5;
          }

          # TỰ ĐỘNG SAO LƯU DỮ LIỆU CUỐI PHIÊN
          Write-Host "💾 Đang nén dữ liệu phiên làm việc để bảo toàn cho phiên mới..." -ForegroundColor Cyan;
          $finalZip = "C:\zenova-final-backup.zip";
          try {
              Compress-Archive -Path "C:\Users\zenova\Desktop", "C:\Apps", "C:\Users\zenova\AppData\Local\Roblox" -DestinationPath "$finalZip" -Force -ErrorAction SilentlyContinue;
              $tag = "storage-$env:MACHINE_ID";
              & gh.exe release create "$tag" "$finalZip#zenova-backup.zip" --title "Zenova Storage $env:MACHINE_ID" --notes "Lưu chuyển tiếp phiên" 2>$null;
              & gh.exe release upload "$tag" "$finalZip#zenova-backup.zip" --clobber 2>$null;
              Write-Host "✅ Dữ liệu phiên đã được lưu hoàn tất!" -ForegroundColor Green;
          } catch {}

          # KÍCH HOẠT PHIÊN TIẾP THEO (CHUỖI 24H LIÊN TỤC)
          if ($shouldDispatchNext) {
              $remTotal = $totalMinutes - $sessionMinutes;
              if ($remTotal -gt 0) {
                  Write-Host "🚀 Đang tự động kích hoạt phiên tiếp theo với thời gian còn lại: ${remTotal}m..." -ForegroundColor Green;
                  & gh.exe workflow run "zenova_mega_vps.yml" -f machine_id="$env:MACHINE_ID" -f duration="${remTotal}m" -f os_type="windows" 2>$null;
                  & gh.exe workflow run "zenova-ultimate.yml" -f machine_id="$env:MACHINE_ID" -f duration="${remTotal}m" -f os_type="windows" 2>$null;
              }
          }

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. LINUX VPS (XRDP, XFCE4, TAILSCALE, APPS, LƯU TRỮ TỰ ĐỘNG)
  # ═══════════════════════════════════════════════════════════════════════════
  zenova-linux:
    name: '🐧 Linux VPS (${{ github.event.inputs.machine_id || ''zenova-linux-1'' }})'
    if: github.event.inputs.os_type == 'linux' || github.event.inputs.os_type == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_KEY || secrets.TAILSCALE_AUTH_KEY || secrets.TS_AUTHKEY || secrets.TAILSCALE || secrets.TS_KEY || secrets.TAILSCALE_TOKEN }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-linux-1' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || 'Zenova Linux Machine' }}
      FIXED_PASSWORD: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}
      DURATION_INPUT: ${{ github.event.inputs.duration || '24h' }}
      AUTO_RESTART: ${{ github.event.inputs.auto_restart || 'true' }}
      WEB_PORT: '8080'

    steps:
      - name: 🐧 Cài Đặt XFCE4, XRDP, Tailscale & Web Quản Lý
        run: |
          NOW=$(date +%s)
          echo "JOB_START_EPOCH=$NOW" >> $GITHUB_ENV

          # Đặt mật khẩu runner
          echo "runner:$FIXED_PASSWORD" | sudo chpasswd

          # Cài đặt XFCE4 & XRDP nhanh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xfce4-terminal xrdp pulseaudio curl wget >/dev/null 2>&1
          echo "xfce4-session" > ~/.xsession
          sudo systemctl restart xrdp

          # Cài đặt Tailscale
          curl -fsSL https://tailscale.com/install.sh | sudo sh >/dev/null 2>&1
          if [ -n "$TAILSCALE_AUTHKEY" ]; then
              sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="$MACHINE_ID" --accept-routes --reset >/dev/null 2>&1
              TS_IP=$(tailscale ip -4 2>/dev/null || echo "")
              echo "$TS_IP" > /tmp/zenova-ts-ip.txt
              echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          fi

          # Tạo thư mục Apps & Web
          mkdir -p /home/runner/Apps /tmp/zenova-web
          echo '' | base64 -d > /tmp/zenova-web/server.py
          python3 /tmp/zenova-web/server.py 8080 >/dev/null 2>&1 &

          # Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --logfile /tmp/cf-web.log >/dev/null 2>&1 &

          sleep 5
          WEB_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf-web.log | head -n 1 || echo "http://127.0.0.1:8080")
          PUB_IP=$(curl -s ifconfig.me || echo "127.0.0.1")

          echo "======================================================================"
          echo "               🚀 ZENOVA LINUX VPS ĐÃ SẴN SÀNG!                       "
          echo "======================================================================"
          echo "🌐 LINK WEB QUẢN LÝ : $WEB_URL"
          echo "🖥️ XRDP HOST        : $PUB_IP:3389"
          echo "🌐 TAILSCALE IP     : $TS_IP"
          echo "👤 USER             : runner"
          echo "🔑 PASSWORD         : $FIXED_PASSWORD"
          echo "======================================================================"

          # Vòng lặp duy trì
          DUR="$DURATION_INPUT"
          TOTAL_MINS=1440
          if [[ "$DUR" =~ ([0-9]+)h ]]; then TOTAL_MINS=$(( ${BASH_REMATCH[1]} * 60 )); fi
          SESS_MINS=$(( TOTAL_MINS < 345 ? TOTAL_MINS : 345 ))
          END_TIME=$(( NOW + SESS_MINS * 60 ))

          while true; do
              CUR=$(date +%s)
              if [ $CUR -ge $END_TIME ]; then break; fi
              if [ -f /tmp/zenova-control-signal.txt ]; then
                  CMD=$(cat /tmp/zenova-control-signal.txt)
                  rm -f /tmp/zenova-control-signal.txt
                  if [ "$CMD" = "STOP_SESSION" ]; then break; fi
              fi
              sleep 5
          done
