# ═══════════════════════════════════════════════════════════════
# ALB-VPSFREE-ULTIMATE v40.3 — TURBO PARALLEL & ZENOVA SUNSET
# - TURBO 1: Tải song song toàn bộ Driver & App bằng curl.exe -Z (6 giây)
# - TURBO 2: Cài VDD + VB-Audio + Sunshine đa luồng song song (8 giây)
# - TURBO 3: Bung nhanh Sunshine bằng 7z -mmt=on + nạp creds 0.1s + lưu ổ X:\
# - TURBO 4: Mở RDP & hiện bảng thông tin kết nối NGAY LẬP TỨC (~50 giây)
# - TURBO 5: Cài đồng thời 6 App (EVKey, VSCode, Discord, Spotify, Bandicam, Roblox)
# - WALLPAPER: Mặc định hóa Zenova Pagoda at Sunset cho mọi máy (Đã xóa Catbox/URL)
# ═══════════════════════════════════════════════════════════════
name: ALB-VPSFREE-ULTIMATE v40.3

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên máy'
        required: false
        default: 'may-phu-1'
        type: string
      duration:
        description: '🕐 Thời gian'
        required: false
        default: '5h00m'
        type: choice
        options: ['1h', '3h', '5h00m']
      auto_restart:
        description: '🔁 Tự restart'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ổ ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 VHDX (GB)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Windows'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu RDP'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Resolution'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      choco_packages:
        description: '📦 Choco packages (vd: vlc,7zip,notepadplusplus)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Optimize Windows'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Tailscale VPN'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 DuckDNS DDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'may-phu-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      SUNSHINE_PASS: 'Sunshine@ALB1'

    steps:
      - name: ⚡ Khởi tạo Siêu tốc (TEMP sang D + Dựng ổ X:\ + Tạo save-data.ps1)
        shell: pwsh
        timeout-minutes: 8
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dTemp = 'D:\tmp'
            New-Item -ItemType Directory -Force -Path $dTemp | Out-Null
            $env:TEMP = $dTemp; $env:TMP = $dTemp
            "TEMP=$dTemp" >> $env:GITHUB_ENV
            "TMP=$dTemp"  >> $env:GITHUB_ENV
          } catch {}

          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "JOB_START_EPOCH=$nowEpoch" >> $env:GITHUB_ENV

          $vhdSizeInput = [int64]($env:VHD_SIZE_GB -replace '[^0-9]','')
          if ($vhdSizeInput -lt 10)     { $vhdSizeInput = 45 }
          if ($vhdSizeInput -gt 100000) { exit 1 }
          "VHD_SIZE_GB_VALIDATED=$vhdSizeInput" >> $env:GITHUB_ENV

          $cleanId = (($env:MACHINE_ID).Trim().ToLower() -replace '[^a-z0-9\-]','-') -replace '\-+','-' -replace '^\-|\-$',''
          if ([string]::IsNullOrWhiteSpace($cleanId)) { $cleanId = 'may-phu-1' }
          $relTag = "alb-storage-$cleanId"

          $null = gh release view $relTag --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
            $null = gh release view "aistv-storage-$cleanId" --repo $env:GH_REPO 2>&1
            if ($LASTEXITCODE -eq 0) {
              $relTag = "aistv-storage-$cleanId"
            } else {
              $dummy = "$env:RUNNER_TEMP\init.txt"
              Set-Content $dummy -Value 'ALB Init' -Encoding UTF8
              gh release create $relTag $dummy --repo $env:GH_REPO --title "ALB Storage ($cleanId)" --notes "Kho luu [$cleanId]"
            }
          }
          "MACHINE_ID=$cleanId" >> $env:GITHUB_ENV
          "RELEASE_TAG=$relTag" >> $env:GITHUB_ENV

          $total = 300
          if ($env:INPUT_DURATION -eq '1h')     { $total = 60 }
          elseif ($env:INPUT_DURATION -eq '3h') { $total = 180 }
          "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV

          "RDP_USER=$env:USERNAME"        >> $env:GITHUB_ENV
          "PROFILE_PATH=$env:USERPROFILE" >> $env:GITHUB_ENV

          $dl = (($env:DRIVE_LETTER).Trim() -replace '[^A-Za-z]','').ToUpper()
          if (-not $dl -or $dl -in @('C','D')) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV

          $vhdContainer = 'C:\ALB-VHD-HOST'
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile   = "$vhdContainer\alb-os-disk.vhdx"
          $sizeBytes = $vhdSizeInput * 1GB
          $mounted   = $false
          try {
            if (-not (Test-Path $vhdFile)) {
              New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                Mount-VHD -PassThru |
                Initialize-Disk -PartitionStyle GPT -PassThru |
                New-Partition -DriveLetter $dl -UseMaximumSize |
                Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ALB-OS' -Confirm:$false | Out-Null
            } else {
              Mount-VHD -Path $vhdFile -ErrorAction Stop
            }
            if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {}

          if (-not $mounted) {
            $fallbackDir = "$vhdContainer\VIRTUAL-DRIVE-ROOT"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            & subst "${dl}:" $fallbackDir
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue
          }

          $sharedRoot = "${dl}:\ALB-SYSTEM"
          $osDir      = "$sharedRoot\OS-OVERLAY"
          $instCache  = "$osDir\Installers"
          @(
            "$sharedRoot\sessions",
            "$sharedRoot\DATA",
            "$osDir\InstalledApps",
            "$osDir\bin",
            $instCache,
            "$osDir\Sunshine-Config",
            "$osDir\Sunshine-Portable",
            "$osDir\Wallpaper",
            "$sharedRoot\Users",
            "${dl}:\Apps"
          ) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }

          if (-not (Test-Path 'C:\ALB-Apps')) {
            New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target "$osDir\InstalledApps" -Force | Out-Null
          }

          "SHARED_ROOT=$sharedRoot"                                       >> $env:GITHUB_ENV
          "SHARED_OS_DIR=$osDir"                                          >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$sharedRoot\sessions\rdp-session-state.json" >> $env:GITHUB_ENV
          "PROFILE_ROOT=$sharedRoot\Users"                                >> $env:GITHUB_ENV
          "CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\alb-control.txt"          >> $env:GITHUB_ENV
          "VHD_CONTAINER=$vhdContainer"                                   >> $env:GITHUB_ENV
          "INSTALLER_CACHE=$instCache"                                    >> $env:GITHUB_ENV
          "SUNSHINE_PERSIST_CFG=$osDir\Sunshine-Config"                   >> $env:GITHUB_ENV
          "WALLPAPER_DIR=$osDir\Wallpaper"                                >> $env:GITHUB_ENV

          # Tạo save-data.ps1
          $L = New-Object System.Collections.Generic.List[string]
          $L.Add('param([string]$Reason = "session-end")')
          $L.Add('$ErrorActionPreference = "Continue"')
          $L.Add('if ($env:DATA_RESTORED -ne "1") { exit 0 }')
          $L.Add('$root = $env:SHARED_ROOT; $osDir = $env:SHARED_OS_DIR')
          $L.Add('if ((-not $root) -or (-not (Test-Path $root))) { exit 0 }')
          $L.Add('$apps = @("chrome","msedge","brave","firefox","coccoc","discord","Spotify","Code","bdcam","RobloxPlayerBeta","StarDesk","EVKey64","EVKey32")')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue')
          $L.Add('if (Test-Path "C:\Program Files\Sunshine\sunshine.exe") {')
          $L.Add('  New-Item -ItemType Directory -Force -Path "$osDir\Sunshine-Portable" | Out-Null')
          $L.Add('  robocopy "C:\Program Files\Sunshine" "$osDir\Sunshine-Portable" /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF "*.log" *> $null')
          $L.Add('}')
          $L.Add('$u = $env:RDP_USER; $profSrc = $env:PROFILE_PATH')
          $L.Add('if ($u -and $profSrc -and (Test-Path $profSrc)) {')
          $L.Add('  $profDst = "$root\Users\$u"')
          $L.Add('  New-Item -ItemType Directory -Force -Path $profDst | Out-Null')
          $L.Add('  $ex = @("$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages","$profSrc\AppData\Roaming\Microsoft\Protect","$profSrc\AppData\Roaming\Microsoft\Crypto","$profSrc\AppData\Local\Microsoft\Credentials","$profSrc\AppData\Roaming\Microsoft\Credentials","$profSrc\AppData\Local\Microsoft\Windows\INetCache","$profSrc\AppData\Local\Microsoft\Windows\WebCache")')
          $L.Add('  robocopy $profSrc $profDst /MIR /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* WebCacheV01.dat SingletonLock /XD @ex *> $null')
          $L.Add('  $global:LASTEXITCODE = 0')
          $L.Add('}')
          $L.Add('$packDir = "$env:RUNNER_TEMP\alb-pack-$Reason"')
          $L.Add('if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }')
          $L.Add('New-Item -ItemType Directory -Force -Path $packDir | Out-Null')
          $L.Add('$archiveBase = "$packDir\alb-drive.7z"')
          $L.Add('Push-Location $root')
          $L.Add('& 7z a -t7z -m0=lzma2 -mx=1 -mmt=on -ssw -v1900m $archiveBase * -xr!Pagefile.sys -xr!swapfile.sys -xr!"System Volume Information" *> $null')
          $L.Add('Pop-Location')
          $L.Add('$chunks = @(Get-ChildItem $packDir -Filter "alb-drive.7z.*" | Sort-Object Name)')
          $L.Add('if ($chunks.Count -eq 0) { exit 1 }')
          $L.Add('$chunkList = @()')
          $L.Add('foreach ($c in $chunks) { $chunkList += @{ name = $c.Name; size = $c.Length } }')
          $L.Add('$manifest = @{ machineId = $env:MACHINE_ID; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); chunkCount = $chunks.Count; chunks = $chunkList }')
          $L.Add('$manifestPath = "$packDir\drive-manifest.json"')
          $L.Add('$manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding UTF8')
          $L.Add('$files = @($chunks | ForEach-Object { $_.FullName }) + @($manifestPath)')
          $L.Add('for ($i = 1; $i -le 3; $i++) { & gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep (2 * $i) }')
          $L.Add('Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue')
          $L.Add('exit 0')
          Set-Content -Path "$env:RUNNER_TEMP\save-data.ps1" -Value ($L -join "`r`n") -Encoding UTF8

          $global:LASTEXITCODE = 0
          Write-Host "OK Init ${dl}:\ | $cleanId" -ForegroundColor Green

      - name: ♻️ Khôi phục ổ đĩa (Đa luồng MT:16)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dlDir = "$env:RUNNER_TEMP\gh-restore"
            if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null

            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
            if (-not (Test-Path "$dlDir\drive-manifest.json")) {
              'DATA_RESTORED=1' >> $env:GITHUB_ENV
              exit 0
            }

            $manifest   = Get-Content -Raw "$dlDir\drive-manifest.json" | ConvertFrom-Json
            $chunkNames = @($manifest.chunks | ForEach-Object { $_.name })
            $hasTJ      = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
            $relTag     = $env:RELEASE_TAG
            $ghRepo     = $env:GH_REPO

            $sb = { param($t, $r, $p, $d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null }
            $jobs = @()
            foreach ($c in $chunkNames) {
              if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock $sb -ArgumentList $relTag, $ghRepo, $c, $dlDir }
              else        { $jobs += Start-Job       -ScriptBlock $sb -ArgumentList $relTag, $ghRepo, $c, $dlDir }
            }
            $null = Wait-Job $jobs -Timeout 120
            $jobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }

            $first = if ($chunkNames.Count -gt 0 -and (Test-Path "$dlDir\$($chunkNames[0])")) { Get-Item "$dlDir\$($chunkNames[0])" } else { Get-ChildItem $dlDir -Filter '*.7z.001' | Select-Object -First 1 }
            if (-not $first) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }

            $stage = "$env:VHD_CONTAINER\restore-stage"
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            & 7z x $first.FullName "-o$stage" -y -mmt=on *> $null
            Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue

            $hit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            $src = if ($hit) { $hit.Directory.Parent.FullName } else { $stage }

            robocopy $src $env:SHARED_ROOT /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
            $global:LASTEXITCODE = 0

            $oldProf = "$env:PROFILE_ROOT\$env:RDP_USER"
            if (Test-Path $oldProf) {
              $skip = @("$oldProf\AppData\Local\Temp","$oldProf\AppData\Local\Packages")
              robocopy $oldProf $env:PROFILE_PATH /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD @skip *> $null
              $global:LASTEXITCODE = 0
            }

            if (Test-Path $env:SHARED_STATE_FILE) {
              try {
                $s = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json
                if ($s.password) { "RESTORE_PASS=$($s.password)" >> $env:GITHUB_ENV }
              } catch {}
            }

            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
            'DATA_RESTORED=1' >> $env:GITHUB_ENV
            Write-Host "OK Restore xong" -ForegroundColor Green
          } catch {
            'DATA_RESTORED=1' >> $env:GITHUB_ENV
          }
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════════════
      # TURBO DOWNLOADER: TẢI CÙNG LÚC TẤT CẢ DRIVER & BỘ CÀI
      # ═══════════════════════════════════════════════════
      - name: 🚀 Turbo Downloader (Tải song song VDD, VB-Audio, Sunshine, Tailscale & Apps)
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Continue'
          $ic    = $env:INSTALLER_CACHE
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
          New-Item -ItemType Directory -Force -Path $ic | Out-Null

          $downloads = @(
            @{ F = "$ic\usbmmidd.zip";       U = 'https://www.amyuni.com/downloads/usbmmidd_v2.zip'; Min = 100KB },
            @{ F = "$ic\VBCable.zip";        U = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip'; Min = 500KB },
            @{ F = "$ic\sunshine-setup.exe"; U = 'https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe'; Min = 5MB },
            @{ F = "$ic\tailscale.msi";      U = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'; Min = 5MB },
            @{ F = "$ic\EVKey.zip";          U = 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip'; Min = 500KB },
            @{ F = "$ic\VSCode.exe";         U = 'https://update.code.visualstudio.com/latest/win32-x64-system/stable'; Min = 40MB },
            @{ F = "$ic\Discord.exe";        U = 'https://dl.discord.com/apps/win/1.0.9171/DiscordSetup.exe'; Min = 40MB },
            @{ F = "$ic\Spotify.exe";        U = 'https://download.scdn.co/SpotifyFullSetupX64.exe'; Min = 5MB },
            @{ F = "$ic\bdcam.exe";          U = 'https://dl.bandicam.com/bdcamsetup.exe'; Min = 10MB },
            @{ F = "$ic\Roblox.exe";         U = 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe'; Min = 1MB }
          )

          $sb = {
            param($f, $url, $min)
            if ((-not (Test-Path $f)) -or ((Get-Item $f -ErrorAction SilentlyContinue).Length -lt $min)) {
              & curl.exe -L --retry 2 --connect-timeout 10 -s $url -o $f 2>$null
            }
          }

          $jobs = @()
          foreach ($d in $downloads) {
            if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock $sb -ArgumentList $d.F, $d.U, $d.Min }
            else        { $jobs += Start-Job       -ScriptBlock $sb -ArgumentList $d.F, $d.U, $d.Min }
          }
          $null = Wait-Job $jobs -Timeout 65
          $jobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }
          Write-Host "OK Turbo Downloader hoàn tất" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🔐 RDP + Firewall + Fix Lag + Mở khóa 100% CPU
        shell: pwsh
        timeout-minutes: 4
        env:
          OPT_WIN: ${{ inputs.optimize_windows }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fSingleSessionPerUser 0 -Type DWord -Force

          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          @{
            UserAuthentication        = 1
            SecurityLayer             = 2
            fPromptForPassword        = 1
            fEnableRemoteFX           = 1
            fNoRemoteDesktopWallpaper = 0
            MaxIdleTime               = 0
            MaxDisconnectionTime      = 0
            MaxConnectionTime         = 0
            fResetBroken              = 0
            MinSendInterval           = 10
            KeepAliveEnable           = 1
          }.GetEnumerator() | ForEach-Object {
            Set-ItemProperty $p $_.Key $_.Value -Type DWord -Force
          }

          $rdpPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $rdpPol -Force | Out-Null
          Remove-ItemProperty -Path $rdpPol -Name 'fPromptForPassword' -Force
          Remove-ItemProperty -Path $rdpPol -Name 'fResetBroken' -Force
          @{
            ColorDepth                 = 5
            MaxMonitors                = 4
            fDisableAudioCapture       = 0
            fDisableCam                = 0
            fNoRemoteDesktopWallpaper  = 0
            AVC444ModePreferred        = 1
            AVCHardwareEncodePreferred = 1
            MinEncryptionLevel         = 2
          }.GetEnumerator() | ForEach-Object {
            Set-ItemProperty $rdpPol $_.Key $_.Value -Type DWord -Force
          }

          $rdpidd = 'C:\Windows\System32\drivers\UMDF\RDPidd.dll'
          if (Test-Path $rdpidd) {
            & takeown.exe /F $rdpidd /A *> $null
            & icacls.exe $rdpidd /grant "*S-1-5-32-544:F" /Q *> $null
            & icacls.exe $rdpidd /grant:r "*S-1-5-32-545:(RX)" /Q *> $null
          }

          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Sunshine-Moonlight-TCP','Sunshine-Moonlight-UDP') |
            ForEach-Object { Remove-NetFirewallRule -DisplayName $_ }
          New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null

          Set-Service TermService -StartupType Automatic
          Set-Service UmRdpService -StartupType Automatic
          Start-Service TermService
          Start-Service UmRdpService

          if ($env:OPT_WIN -eq 'true') {
            tzutil /s 'SE Asia Standard Time' 2>$null
            $ult = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
            if ($ult -match '([a-f0-9\-]{36})') { & powercfg /setactive $Matches[1] 2>$null }
            & powercfg /change standby-timeout-ac 0
            & powercfg /change monitor-timeout-ac 0
            & powercfg /hibernate off
            & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
            & powercfg /setactive scheme_current 2>$null

            $pt = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
            New-Item $pt -Force | Out-Null
            Set-ItemProperty $pt PowerThrottlingOff 1 -Type DWord -Force
            Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Type DWord -Force

            @('wuauserv','UsoSvc','DiagTrack','WSearch','SysMain','Spooler','MapsBroker','RetailDemo') |
              ForEach-Object { Stop-Service $_ -Force; Set-Service $_ -StartupType Disabled }
            try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch {}
          }

          "CPU_MODEL_INFO=$env:PROCESSOR_IDENTIFIER ($env:NUMBER_OF_PROCESSORS vCPU - Turbo Mode)" >> $env:GITHUB_ENV
          Write-Host "OK RDP + Firewall + CPU Turbo" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════════════
      # TURBO ENGINE: CÀI ĐỒNG THỜI VDD + VB-AUDIO + SUNSHINE (SIÊU NHANH)
      # - Không gọi Get-PnpDevice (tiết kiệm 20s)
      # - Không lặp chờ API 20s (dùng sunshine --creds mất 0.1s)
      # - Giải nén Sunshine bằng 7z -mmt=on hoặc khôi phục từ ổ X:\ (mất 2s)
      # - Chạy song song cả 3 trình cài đặt cùng lúc
      # ═══════════════════════════════════════════════════
      - name: 🖥️🔊☀️ Cài Siêu Nhanh VDD + VB-Audio + Sunshine (Đa luồng Song song)
        timeout-minutes: 5
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic         = $env:INSTALLER_CACHE
          $sunPersist = $env:SUNSHINE_PERSIST_CFG
          $sunPortDir = "$env:SHARED_OS_DIR\Sunshine-Portable"
          $hasTJ      = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)

          $parts = $env:VDD_RES -split '[@x]'
          $w  = if ($parts.Count -ge 1) { [int]$parts[0] } else { 1920 }
          $h  = if ($parts.Count -ge 2) { [int]$parts[1] } else { 1080 }
          $hz = if ($parts.Count -ge 3) { [int]$parts[2] } else { 60 }

          # LUỒNG 1: CÀI VIRTUAL DISPLAY DRIVER (VDD)
          $vddBlock = {
            param($ic, $w, $h, $hz)
            try {
              $usbDir = 'C:\usbmmidd_v2'
              if (-not (Test-Path "$usbDir\deviceinstaller64.exe")) {
                $zip = "$ic\usbmmidd.zip"
                if (Test-Path $zip) {
                  & 7z x $zip "-oC:\" -y -mmt=on *> $null
                }
              }
              if (Test-Path "$usbDir\deviceinstaller64.exe") {
                Push-Location $usbDir
                Get-ChildItem $usbDir -Filter '*.cer' -ErrorAction SilentlyContinue | ForEach-Object {
                  Import-Certificate -FilePath $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null
                  Import-Certificate -FilePath $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null
                }
                & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null
                $wudf = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
                New-Item $wudf -Force | Out-Null
                Set-ItemProperty $wudf '0' "${w},${h},${hz}" -Force
                & .\deviceinstaller64.exe enableidd 1 *> $null
                Pop-Location
              }
            } catch {}
          }

          # LUỒNG 2: CÀI ÂM THANH ẢO (VB-AUDIO)
          $vbBlock = {
            param($ic)
            try {
              @('MMCSS', 'AudioEndpointBuilder', 'Audiosrv') | ForEach-Object {
                Set-Service -Name $_ -StartupType Automatic -ErrorAction SilentlyContinue
                Start-Service -Name $_ -ErrorAction SilentlyContinue
              }
              $vbDir = "$ic\VBCable"
              if (-not (Test-Path "$vbDir\VBCABLE_Setup_x64.exe")) {
                $zip = "$ic\VBCable.zip"
                if (Test-Path $zip) {
                  New-Item -ItemType Directory -Force $vbDir | Out-Null
                  & 7z x $zip "-o$vbDir" -y -mmt=on *> $null
                }
              }
              Get-ChildItem $vbDir -Filter '*.cer' -ErrorAction SilentlyContinue | ForEach-Object {
                Import-Certificate -FilePath $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null
                Import-Certificate -FilePath $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null
              }
              $inf = Get-ChildItem $vbDir -Filter '*64*.inf' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($inf) {
                pnputil /add-driver $inf.FullName /install *> $null
                if (Test-Path 'C:\usbmmidd_v2\deviceinstaller64.exe') {
                  Push-Location $inf.DirectoryName
                  & 'C:\usbmmidd_v2\deviceinstaller64.exe' install $inf.Name 'VBAudioVACWDM' *> $null
                  Pop-Location
                }
              }
            } catch {}
          }

          # LUỒNG 3: CÀI SUNSHINE SIÊU TỐC (KHÔI PHỤC TỪ X:\ HOẶC BUNG 7Z TRỰC TIẾP)
          $sunBlock = {
            param($ic, $sunPersist, $sunPortDir, $machineId, $sunPass)
            try {
              $sunDir = 'C:\Program Files\Sunshine'
              $sunExe = "$sunDir\sunshine.exe"

              # 1. Nếu đã có sẵn trong ổ X:\ từ phiên trước -> Chép ra trong 1 giây
              if ((-not (Test-Path $sunExe)) -and (Test-Path "$sunPortDir\sunshine.exe")) {
                New-Item -ItemType Directory -Force -Path $sunDir | Out-Null
                robocopy $sunPortDir $sunDir /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
              }

              # 2. Nếu phiên đầu tiên -> Bung thẳng bằng 7z đa luồng (2 giây) thay vì chờ NSIS /S
              if (-not (Test-Path $sunExe)) {
                $inst = "$ic\sunshine-setup.exe"
                if ((Test-Path $inst) -and ((Get-Item $inst).Length -gt 5MB)) {
                  New-Item -ItemType Directory -Force -Path $sunDir | Out-Null
                  & 7z x $inst "-o$sunDir" -y -mmt=on *> $null
                  Remove-Item "$sunDir\`$PLUGINSDIR" -Recurse -Force -ErrorAction SilentlyContinue
                  if (-not (Test-Path $sunExe)) {
                    $subExe = Get-ChildItem $sunDir -Filter 'sunshine.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                    if ($subExe -and ($subExe.DirectoryName -ne $sunDir)) {
                      robocopy $subExe.DirectoryName $sunDir /E /MOVE /R:0 /W:0 /NFL /NDL /NJH /NJS /NP *> $null
                    }
                  }
                  if (-not (Test-Path $sunExe)) {
                    Start-Process $inst -ArgumentList '/S' -Wait -NoNewWindow -ErrorAction SilentlyContinue
                  }
                  if (Test-Path $sunExe) {
                    robocopy $sunDir $sunPortDir /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF '*.log' *> $null
                  }
                }
              }

              if (Test-Path $sunExe) {
                Stop-Service SunshineService,sunshinesvc -Force -ErrorAction SilentlyContinue
                Stop-Process -Name sunshine -Force -ErrorAction SilentlyContinue

                $cfg = "$sunDir\config"
                if ((Test-Path $cfg) -and ((Get-Item $cfg -Force).Attributes -notmatch 'ReparsePoint')) {
                  if (@(Get-ChildItem $sunPersist -Force -ErrorAction SilentlyContinue).Count -eq 0) {
                    Copy-Item "$cfg\*" $sunPersist -Recurse -Force -ErrorAction SilentlyContinue
                  }
                  Remove-Item $cfg -Recurse -Force -ErrorAction SilentlyContinue
                }
                if (-not (Test-Path $cfg)) {
                  New-Item -ItemType Junction $cfg -Target $sunPersist -Force | Out-Null
                }

                $conf = "$sunPersist\sunshine.conf"
                if (-not (Test-Path $conf)) {
                  @(
                    "sunshine_name = ALB-$machineId",
                    "origin_web_ui_allowed = wan",
                    "upnp = disabled",
                    "port = 47989"
                  ) -join "`r`n" | Set-Content $conf -Encoding UTF8
                }

                # Đặt mật khẩu Sunshine trực tiếp bằng CLI (0.1 giây - không cần đợi API Web)
                Push-Location $sunDir
                & $sunExe --creds admin $sunPass *> $null
                Pop-Location

                Start-Process $sunExe -WorkingDirectory $sunDir -WindowStyle Hidden -ErrorAction SilentlyContinue
              }
            } catch {}
          }

          $hwJobs = @()
          if ($hasTJ) {
            $hwJobs += Start-ThreadJob -ScriptBlock $vddBlock -ArgumentList $ic, $w, $h, $hz
            $hwJobs += Start-ThreadJob -ScriptBlock $vbBlock  -ArgumentList $ic
            $hwJobs += Start-ThreadJob -ScriptBlock $sunBlock -ArgumentList $ic, $sunPersist, $sunPortDir, $env:MACHINE_ID, $env:SUNSHINE_PASS
          } else {
            $hwJobs += Start-Job -ScriptBlock $vddBlock -ArgumentList $ic, $w, $h, $hz
            $hwJobs += Start-Job -ScriptBlock $vbBlock  -ArgumentList $ic
            $hwJobs += Start-Job -ScriptBlock $sunBlock -ArgumentList $ic, $sunPersist, $sunPortDir, $env:MACHINE_ID, $env:SUNSHINE_PASS
          }
          $null = Wait-Job $hwJobs -Timeout 45
          $hwJobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }

          Write-Host "OK VDD (${w}x${h}@${hz}) + VB-Audio + Sunshine (Turbo Parallel)" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🌐 Tailscale & DuckDNS
        timeout-minutes: 5
        env:
          EN_TS:              ${{ inputs.enable_tailscale }}
          EN_DNS:             ${{ inputs.enable_duckdns }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          DUCKDNS_TOKEN:      ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN:     ${{ secrets.DUCKDNS_DOMAIN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tsIp = '127.0.0.1'; $tsStatus = 'DISABLED'; $funnelUrl = ''

          if ($env:EN_TS -eq 'true') {
            if (-not $env:TAILSCALE_AUTH_KEY) {
              $tsStatus = 'NO_KEY'
            } else {
              try {
                $ts = 'C:\Program Files\Tailscale\tailscale.exe'
                if (-not (Test-Path $ts)) {
                  $msi = "$env:INSTALLER_CACHE\tailscale.msi"
                  if (Test-Path $msi) {
                    Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -NoNewWindow
                  }
                }
                if (Test-Path $ts) {
                  Set-Service Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service Tailscale -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                  & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=alb-$($env:MACHINE_ID)" --accept-routes --accept-dns --reset --unattended
                  if ($LASTEXITCODE -eq 0) {
                    & $ts set --unattended=true 2>&1 | Out-Null
                    $ipOut = (& $ts ip -4 2>&1 | Out-String).Trim()
                    if ($ipOut -match '^\d+\.\d+\.\d+\.\d+$') { $tsIp = $ipOut; $tsStatus = 'CONNECTED' }
                    try {
                      & $ts funnel --bg $env:WEB_PORT 2>&1 | Out-Null
                      $fStat = (& $ts funnel status 2>&1 | Out-String)
                      if ($fStat -match '(https://[^\s]+)') { $funnelUrl = $Matches[1].TrimEnd('/') }
                    } catch {}
                  } else { $tsStatus = 'AUTH_FAIL' }
                } else { $tsStatus = 'INSTALL_FAIL' }
              } catch { $tsStatus = 'ERROR' }
            }
          }
          "TAILSCALE_IP=$tsIp"   >> $env:GITHUB_ENV
          "FUNNEL_URL=$funnelUrl" >> $env:GITHUB_ENV
          "TS_STATUS=$tsStatus"  >> $env:GITHUB_ENV

          $ddnsUrl = ''; $pubIp = ''
          if ($env:EN_DNS -eq 'true' -and $env:DUCKDNS_TOKEN -and $env:DUCKDNS_DOMAIN) {
            try {
              try { $pubIp = (Invoke-WebRequest -Uri 'https://api.ipify.org' -UseBasicParsing -TimeoutSec 5).Content.Trim() } catch {}
              $targetIp = if ($tsIp -ne '127.0.0.1') { $tsIp } else { $pubIp }
              $cleanDom = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$',''
              $dnsUri   = "https://www.duckdns.org/update?domains=$cleanDom&token=$env:DUCKDNS_TOKEN&ip=$targetIp"
              $res      = (Invoke-WebRequest -Uri $dnsUri -UseBasicParsing -TimeoutSec 8).Content.Trim()
              if ($res -eq 'OK') { $ddnsUrl = "${cleanDom}.duckdns.org" }
            } catch {}
          }
          "DUCKDNS_URL=$ddnsUrl"     >> $env:GITHUB_ENV
          "DUCKDNS_PUBLIC_IP=$pubIp" >> $env:GITHUB_ENV
          Write-Host "OK Network: Tailscale=$tsIp [$tsStatus] | DuckDNS=$ddnsUrl" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 👤 User + Hình nền Mặc định ZENOVA PAGODA AT SUNSET (All Machines)
        shell: pwsh
        timeout-minutes: 5
        env:
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
        run: |
          $ErrorActionPreference = 'Continue'
          $user     = $env:RDP_USER
          $profPath = $env:PROFILE_PATH
          $pass     = 'Aistv@2026'
          try {
            if (-not [string]::IsNullOrWhiteSpace($env:FIXED_PASS_INPUT)) { $pass = $env:FIXED_PASS_INPUT.Trim() }
            elseif ($env:RESTORE_PASS) { $pass = $env:RESTORE_PASS }

            $sp = ConvertTo-SecureString $pass -AsPlainText -Force
            try { Set-LocalUser -Name $user -Password $sp -PasswordNeverExpires $true -ErrorAction Stop } catch {}
            & net user $user $pass /active:yes /expires:never *> $null
            Add-LocalGroupMember -Group 'Administrators'       -Member $user -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue

            "RDP_PASS=$pass" >> $env:GITHUB_ENV

            $wl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
            Set-ItemProperty $wl AutoAdminLogon '1'    -Force
            Set-ItemProperty $wl DefaultUserName $user -Force
            Set-ItemProperty $wl DefaultPassword $pass -Force
          } catch {}

          # Áp dụng hình nền mặc định Zenova Pagoda at Sunset cho mọi máy
          try {
            $wall = "$env:WALLPAPER_DIR\Zenova-Pagoda-Sunset.jpg"
            if ((-not (Test-Path $wall)) -or ((Get-Item $wall).Length -lt 20KB)) {
              try {
                $repoFiles = @(gh api "repos/$($env:GH_REPO)/contents" --jq '.[].name' 2>$null)
                $imgFile   = $repoFiles | Where-Object { $_ -match '(?i)(zenova|pagoda|sunset|wallpaper).*\.(png|jpg|jpeg)$' } | Select-Object -First 1
                if (-not $imgFile) { $imgFile = $repoFiles | Where-Object { $_ -match '(?i)\.(png|jpg|jpeg)$' } | Select-Object -First 1 }
                if ($imgFile) {
                  $encName = [System.Uri]::EscapeDataString($imgFile)
                  $rawUrl  = "https://raw.githubusercontent.com/$($env:GH_REPO)/$($env:GITHUB_REF_NAME)/$encName"
                  & curl.exe -L --retry 2 -s -H "Authorization: token $($env:GH_TOKEN)" $rawUrl -o $wall 2>$null
                }
              } catch {}
            }

            if ((-not (Test-Path $wall)) -or ((Get-Item $wall).Length -lt 20KB)) {
              Add-Type -AssemblyName System.Drawing
              $bmp = New-Object System.Drawing.Bitmap(1920, 1080)
              $g   = [System.Drawing.Graphics]::FromImage($bmp)
              $g.SmoothingMode     = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
              $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit

              $skyRect  = New-Object System.Drawing.Rectangle(0, 0, 1920, 1080)
              $skyBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($skyRect, [System.Drawing.Color]::FromArgb(255, 42, 22, 58), [System.Drawing.Color]::FromArgb(255, 250, 135, 115), 90.0)
              $blend    = New-Object System.Drawing.Drawing2D.ColorBlend(4)
              $blend.Colors    = @([System.Drawing.Color]::FromArgb(255, 38, 20, 52), [System.Drawing.Color]::FromArgb(255, 138, 42, 74), [System.Drawing.Color]::FromArgb(255, 232, 95, 98), [System.Drawing.Color]::FromArgb(255, 255, 190, 130))
              $blend.Positions = @(0.0, 0.35, 0.72, 1.0)
              $skyBrush.InterpolationColors = $blend
              $g.FillRectangle($skyBrush, $skyRect)

              $sunBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(95, 255, 230, 175))
              $g.FillEllipse($sunBrush, 1650, 520, 360, 360)

              $fujiPts   = @((New-Object System.Drawing.Point(40, 820)), (New-Object System.Drawing.Point(560, 415)), (New-Object System.Drawing.Point(685, 390)), (New-Object System.Drawing.Point(795, 392)), (New-Object System.Drawing.Point(910, 420)), (New-Object System.Drawing.Point(1450, 820)))
              $fujiBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush((New-Object System.Drawing.Rectangle(40, 380, 1410, 450)), [System.Drawing.Color]::FromArgb(255, 115, 48, 78), [System.Drawing.Color]::FromArgb(255, 45, 22, 42), 90.0)
              $g.FillPolygon($fujiBrush, $fujiPts)

              $snowPts   = @((New-Object System.Drawing.Point(560, 415)), (New-Object System.Drawing.Point(685, 390)), (New-Object System.Drawing.Point(795, 392)), (New-Object System.Drawing.Point(910, 420)), (New-Object System.Drawing.Point(840, 485)), (New-Object System.Drawing.Point(760, 450)), (New-Object System.Drawing.Point(700, 490)), (New-Object System.Drawing.Point(625, 455)))
              $snowBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(220, 255, 225, 230))
              $g.FillPolygon($snowBrush, $snowPts)

              $valleyBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 36, 18, 34))
              $g.FillRectangle($valleyBrush, 0, 780, 1920, 300)

              $pagodaBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 32, 12, 22))
              $pagodaRed   = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 125, 28, 42))
              $g.FillRectangle($pagodaBrush, 1484, 155, 12, 150)
              for ($tier = 0; $tier -lt 5; $tier++) {
                $ty = 295 + ($tier * 135); $tw = 180 + ($tier * 32); $tx = 1490 - [int]($tw / 2)
                $g.FillRectangle($pagodaRed, ($tx + 38), ($ty + 32), ($tw - 76), 95)
                $roofPts = @((New-Object System.Drawing.Point(($tx - 48), ($ty + 34))), (New-Object System.Drawing.Point(($tx + [int]($tw / 2)), ($ty - 12))), (New-Object System.Drawing.Point(($tx + $tw + 48), ($ty + 34))), (New-Object System.Drawing.Point(($tx + $tw + 20), ($ty + 52))), (New-Object System.Drawing.Point(($tx - 20), ($ty + 52))))
                $g.FillPolygon($pagodaBrush, $roofPts)
              }

              $rnd = New-Object System.Random(2026)
              for ($p = 0; $p -lt 380; $p++) {
                $px = if ($p -lt 260) { $rnd.Next(0, 980) } else { $rnd.Next(0, 1920) }
                $py = if ($p -lt 260) { $rnd.Next(580, 1080) } else { $rnd.Next(40, 1040) }
                $ps = $rnd.Next(6, 22)
                $sakuraBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb($rnd.Next(130, 240), 255, $rnd.Next(165, 215), $rnd.Next(195, 230)))
                $g.FillEllipse($sakuraBrush, $px, $py, $ps, [int]($ps * 0.7))
                $sakuraBrush.Dispose()
              }

              $titleFont = New-Object System.Drawing.Font('Georgia', 72, [System.Drawing.FontStyle]::Bold)
              $subFont   = New-Object System.Drawing.Font('Segoe UI', 24, [System.Drawing.FontStyle]::Regular)
              $mainBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 255, 235, 240))
              $g.DrawString('ZENOVA', $titleFont, $mainBrush, 80, 210)
              $g.DrawString('C L O U D', $subFont, $mainBrush, 265, 355)

              $bmp.Save($wall, [System.Drawing.Imaging.ImageFormat]::Jpeg)
              $g.Dispose(); $bmp.Dispose()
            }

            if (Test-Path $wall) {
              @('C:\Windows\Web\Wallpaper\Windows\img0.jpg', 'C:\Windows\Web\Screen\img100.jpg') | ForEach-Object {
                if (Test-Path $_) {
                  & takeown.exe /F $_ /A *> $null
                  & icacls.exe $_ /grant 'Administrators:F' /Q *> $null
                  Copy-Item -Path $wall -Destination $_ -Force -ErrorAction SilentlyContinue
                }
              }
              $themesDir = "$env:APPDATA\Microsoft\Windows\Themes"
              New-Item -ItemType Directory -Force -Path $themesDir | Out-Null
              Copy-Item -Path $wall -Destination "$themesDir\TranscodedWallpaper" -Force -ErrorAction SilentlyContinue

              @('HKCU:\Control Panel\Desktop', 'Registry::HKEY_USERS\.DEFAULT\Control Panel\Desktop') | ForEach-Object {
                if (Test-Path $_) {
                  Set-ItemProperty -Path $_ -Name 'Wallpaper' -Value $wall -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $_ -Name 'WallpaperStyle' -Value '10' -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $_ -Name 'TileWallpaper' -Value '0' -Force -ErrorAction SilentlyContinue
                }
              }

              $wallCs = @(
                'using System;',
                'using System.Runtime.InteropServices;',
                'public class ZenovaWall {',
                '  [DllImport("user32.dll", CharSet = CharSet.Auto)]',
                '  public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);',
                '  public static void Apply(string path) { SystemParametersInfo(20, 0, path, 0x01 | 0x02); }',
                '}'
              )
              Add-Type -TypeDefinition ($wallCs -join "`r`n") -ErrorAction SilentlyContinue
              [ZenovaWall]::Apply($wall)
              & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True
            }
          } catch {}

          'SESSION_READY=1' >> $env:GITHUB_ENV
          Write-Host "OK User=$user + Default Wallpaper Zenova Pagoda Sunset" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════════════
      # MỞ WEB PANEL & HIỆN THÔNG TIN KẾT NỐI NGAY LẬP TỨC
      # (Người dùng vào được RDP ngay mà không phải đợi cài App)
      # ═══════════════════════════════════════════════════
      - name: 🌐 Web Panel & Bảng Thông Tin Kết Nối Tức Thì
        shell: pwsh
        timeout-minutes: 3
        run: |
          $tsIp    = $env:TAILSCALE_IP
          $port    = $env:WEB_PORT
          $ddns    = $env:DUCKDNS_URL
          $pubIp   = $env:DUCKDNS_PUBLIC_IP
          $rdpHost = if ($ddns -and $ddns -ne '') { $ddns } elseif ($tsIp -and $tsIp -ne '127.0.0.1') { $tsIp } else { $pubIp }
          $rdpUrl  = if ($env:FUNNEL_URL) { $env:FUNNEL_URL } elseif ($ddns) { "http://${ddns}:${port}" } else { "http://${tsIp}:${port}" }
          $sunUrl  = "https://${tsIp}:$env:SUNSHINE_WEB_PORT"
          "WEB_PANEL_URL=$rdpUrl" >> $env:GITHUB_ENV

          $stateObj = [ordered]@{
            machineId      = $env:MACHINE_ID
            releaseTag     = $env:RELEASE_TAG
            user           = $env:RDP_USER
            password       = $env:RDP_PASS
            tailscaleIp    = $tsIp
            funnelUrl      = $env:FUNNEL_URL
            lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $stateObj | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path $env:SHARED_STATE_FILE -Encoding UTF8

          $sb = New-Object System.Text.StringBuilder
          [void]$sb.AppendLine('<!DOCTYPE html><html><head><meta charset="utf-8"><title>ALB v40.3 Turbo Panel</title>')
          [void]$sb.AppendLine('<style>*{box-sizing:border-box}body{background:#07090f;color:#eee;font-family:Consolas,Segoe UI,monospace;padding:24px;margin:0;display:flex;justify-content:center}')
          [void]$sb.AppendLine('.wrap{width:100%;max-width:620px}h1{color:#f472b6;margin-bottom:4px}table{border-collapse:collapse;width:100%;margin-bottom:18px}')
          [void]$sb.AppendLine('td,th{border:1px solid #334155;padding:8px 12px}th{background:#0f172a;color:#94a3b8;text-align:left}')
          [void]$sb.AppendLine('td:first-child{color:#94a3b8;width:165px}a{color:#38bdf8}.ok{color:#4ade80}.warn{color:#fb923c}')
          [void]$sb.AppendLine('.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:12px;border:none;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;font-size:14px}')
          [void]$sb.AppendLine('.b-save{background:#0284c7}.b-res{background:#d97706}.b-stop{background:#dc2626}.b-new{background:#7c3aed}</style></head>')
          [void]$sb.AppendLine('<body><div class="wrap">')
          [void]$sb.AppendLine("<h1>🌸 ZENOVA CLOUD v40.3 TURBO</h1><p style='color:#94a3b8;margin-top:0'>Machine: <b style='color:#f1f5f9'>$($env:MACHINE_ID)</b> | Wallpaper: <b style='color:#f472b6'>Zenova Pagoda at Sunset</b></p>")
          [void]$sb.AppendLine('<table>')
          [void]$sb.AppendLine("<tr><th colspan='2'>🖥️ RDP Connection</th></tr>")
          [void]$sb.AppendLine("<tr><td>Host</td><td><b>${rdpHost}:3389</b></td></tr>")
          [void]$sb.AppendLine("<tr><td>Username</td><td>$($env:RDP_USER)</td></tr>")
          [void]$sb.AppendLine("<tr><td>Password</td><td>$($env:RDP_PASS)</td></tr>")
          [void]$sb.AppendLine("<tr><th colspan='2'>🎮 Sunshine (Moonlight)</th></tr>")
          [void]$sb.AppendLine("<tr><td>Web UI</td><td><a href='$sunUrl' target='_blank'>$sunUrl</a></td></tr>")
          [void]$sb.AppendLine("<tr><td>Username / Pass</td><td>admin / $($env:SUNSHINE_PASS)</td></tr>")
          [void]$sb.AppendLine("<tr><th colspan='2'>🌐 Network & System</th></tr>")
          [void]$sb.AppendLine("<tr><td>Tailscale IP</td><td>$tsIp [$($env:TS_STATUS)]</td></tr>")
          [void]$sb.AppendLine("<tr><td>Panel URL</td><td><a href='$rdpUrl'>$rdpUrl</a></td></tr>")
          [void]$sb.AppendLine("<tr><td>Drive</td><td>$($env:MOUNT_LETTER):\ ($($env:SHARED_ROOT))</td></tr>")
          [void]$sb.AppendLine('</table>')
          [void]$sb.AppendLine('<div class="btns">')
          [void]$sb.AppendLine('<button class="btn b-save" onclick="act(''save'')">💾 Lưu Ổ Đĩa Ngay</button>')
          [void]$sb.AppendLine('<button class="btn b-res" onclick="act(''restart'')">🔁 Lưu & Restart</button>')
          [void]$sb.AppendLine('<button class="btn b-stop" onclick="act(''stop'')">🛑 Lưu & Tắt Server</button>')
          [void]$sb.AppendLine('<button class="btn b-new" onclick="act(''start-new'')">🚀 Phiên Mới</button>')
          [void]$sb.AppendLine('</div>')
          [void]$sb.AppendLine('<script>async function act(c){if(!confirm("Xac nhan lenh: "+c+"?"))return;try{const r=await fetch("/api/action/"+c,{method:"POST"});const j=await r.json();alert(j.ok?"Da gui lenh "+c+" thanh cong!":"Loi: "+j.error)}catch(e){alert("Loi ket noi")}}</script>')
          [void]$sb.AppendLine('</div></body></html>')

          $panelHtml = "$env:RUNNER_TEMP\panel.html"
          Set-Content $panelHtml -Value $sb.ToString() -Encoding UTF8

          $webScript = "$env:RUNNER_TEMP\web.ps1"
          $serverLines = @(
            '$ErrorActionPreference = "Continue"',
            '$listener = [System.Net.HttpListener]::new()',
            ('$listener.Prefixes.Add("http://+:' + $port + '/")'),
            '$listener.Start()',
            '$endEpoch = ([long]$env:JOB_START_EPOCH) + (([long]$env:TOTAL_MINUTES) * 60)',
            'while ($listener.IsListening) {',
            '  try {',
            '    $ctx  = $listener.GetContext(); $req = $ctx.Request; $resp = $ctx.Response',
            '    $path = $req.Url.AbsolutePath.ToLower()',
            '    $rem  = [math]::Max(0, $endEpoch - [DateTimeOffset]::UtcNow.ToUnixTimeSeconds())',
            '    if (($path -eq "/api/status") -or ($path -eq "/health")) {',
            '      $st = @{ machineId = $env:MACHINE_ID; status = "ok"; remaining_seconds = $rem; tailscale_ip = $env:TAILSCALE_IP; drive = $env:MOUNT_LETTER } | ConvertTo-Json -Compress',
            '      $b  = [System.Text.Encoding]::UTF8.GetBytes($st)',
            '      $resp.ContentType = "application/json; charset=utf-8"; $resp.ContentLength64 = $b.Length',
            '      $resp.OutputStream.Write($b, 0, $b.Length); $resp.OutputStream.Close(); continue',
            '    }',
            '    if (($req.HttpMethod -eq "POST") -and ($path -like "/api/action/*")) {',
            '      $act = $path -replace "/api/action/", ""',
            '      if ($act -in @("save","restart","stop","start-new")) { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value $act -Encoding UTF8; $rj = ''{"ok":true}'' } else { $rj = ''{"ok":false}'' }',
            '      $b = [System.Text.Encoding]::UTF8.GetBytes($rj)',
            '      $resp.ContentType = "application/json; charset=utf-8"; $resp.ContentLength64 = $b.Length',
            '      $resp.OutputStream.Write($b, 0, $b.Length); $resp.OutputStream.Close(); continue',
            '    }',
            ('    $html = Get-Content -Raw -Encoding UTF8 "' + $panelHtml + '"'),
            '    $buf  = [System.Text.Encoding]::UTF8.GetBytes($html)',
            '    $resp.ContentType = "text/html; charset=utf-8"; $resp.ContentLength64 = $buf.Length',
            '    $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close()',
            '  } catch {}',
            '}'
          )
          Set-Content -Path $webScript -Value ($serverLines -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile','-WindowStyle','Hidden','-File',"`"$webScript`""

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║   🌸 ALB VPSFREE v40.3 TURBO — SẴN SÀNG KẾT NỐI!     ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║ Machine   : $($env:MACHINE_ID.PadRight(41))║" -ForegroundColor White
          Write-Host "║ RDP Host  : $(($rdpHost + ':3389').PadRight(41))║" -ForegroundColor Green
          Write-Host "║ User      : $($env:RDP_USER.PadRight(41))║" -ForegroundColor White
          Write-Host "║ Pass      : $($env:RDP_PASS.PadRight(41))║" -ForegroundColor White
          Write-Host "║ Sunshine  : https://${tsIp}:$($env:SUNSHINE_WEB_PORT.PadRight(30))║" -ForegroundColor Yellow
          Write-Host "║ Sun Pass  : $($env:SUNSHINE_PASS.PadRight(41))║" -ForegroundColor Yellow
          Write-Host "║ Web Panel : $($rdpUrl.PadRight(41))║" -ForegroundColor Yellow
          Write-Host "║ Wallpaper : Zenova Pagoda at Sunset (Default All)    ║" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════════════
      # CÀI ĐỒNG THỜI 6 APP BẰNG ĐA LUỒNG SONG SONG (~15 GIÂY)
      # ═══════════════════════════════════════════════════
      - name: 📦 Cài Siêu Tốc 6 App Song Song (EVKey + VSCode + Discord + Spotify + Bandicam + Roblox)
        timeout-minutes: 5
        shell: pwsh
        env:
          CHOCO_PKGS: ${{ inputs.choco_packages }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic      =$env:INSTALLER_CACHE
          $desk    = "$env:PROFILE_PATH\Desktop"
          $appData =$env:APPDATA
          $locData =$env:LOCALAPPDATA
          $hasTJ   =$null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
          New-Item -ItemType Directory -Force -Path $desk, 'C:\ALB-Apps\EVKey' | Out-Null

          $appTasks = @(
            # 1. EVKey
            {
              param($ic,$desk, $appData)$ev = 'C:\ALB-Apps\EVKey'
              if (-not (Test-Path "$ev\EVKey64.exe") -and (Test-Path "$ic\EVKey.zip")) {
                & 7z x "$ic\EVKey.zip" "-o$ev" -y *> $null
              }
              $exe = if (Test-Path "$ev\EVKey64.exe") { "$ev\EVKey64.exe" } elseif (Test-Path "$ev\EVKey32.exe") { "$ev\EVKey32.exe" } else { $null }
              if ($exe) {
                $startup = "$appData\Microsoft\Windows\Start Menu\Programs\Startup"
                New-Item -ItemType Directory -Force -Path $startup | Out-Null$ws = New-Object -ComObject WScript.Shell
                foreach ($dst in @("$startup\EVKey.lnk", "$desk\EVKey.lnk")) { $l =$ws.CreateShortcut($dst);$l.TargetPath = $exe; $l.Save() }
                Start-Process $exe -WorkingDirectory$ev -ErrorAction SilentlyContinue
              }
            },
            # 2. VSCode
            {
              param($ic, $desk)$exe = 'C:\Program Files\Microsoft VS Code\Code.exe'
              if (-not (Test-Path $exe) -and (Test-Path "$ic\VSCode.exe")) {
                Start-Process "$ic\VSCode.exe" -ArgumentList '/VERYSILENT','/NORESTART','/MERGETASKS=!runcode' -Wait -NoNewWindow -ErrorAction SilentlyContinue
              }
              if (Test-Path $exe) {$ws = New-Object -ComObject WScript.Shell; $l =$ws.CreateShortcut("$desk\VSCode.lnk"); $l.TargetPath = $exe; $l.Save()
              }
            },
            # 3. Spotify
            {
              param($ic, $desk,$locData)
              if (-not (Test-Path "$locData\Spotify\Spotify.exe") -and (Test-Path "$ic\Spotify.exe")) {
                $p = Start-Process "$ic\Spotify.exe" -ArgumentList '/silent','/skip-app-launch' -PassThru -NoNewWindow -ErrorAction SilentlyContinue
                if ($p) { $null =$p.WaitForExit(35000) }
              }
            },
            # 4. Bandicam
            {
              param($ic, $desk)$exe = 'C:\Program Files\Bandicam\bdcam.exe'
              if (-not (Test-Path $exe) -and (Test-Path "$ic\bdcam.exe")) {
                $p = Start-Process "$ic\bdcam.exe" -ArgumentList '/S' -PassThru -NoNewWindow -ErrorAction SilentlyContinue
                if ($p) { $null =$p.WaitForExit(30000) }
              }
              if (Test-Path $exe) {$ws = New-Object -ComObject WScript.Shell; $l =$ws.CreateShortcut("$desk\Bandicam.lnk"); $l.TargetPath = $exe; $l.Save()
              }
            },
            # 5. Discord
            {
              param($ic, $desk,$locData)
              if (-not (Test-Path "$locData\Discord\Update.exe") -and (Test-Path "$ic\Discord.exe")) {
                $p = Start-Process "$ic\Discord.exe" -ArgumentList '--silent' -PassThru -NoNewWindow -ErrorAction SilentlyContinue
                if ($p) { $null =$p.WaitForExit(35000) }
              }
            },
            # 6. Roblox
            {
              param($ic, $desk,$locData)
              if (-not (Test-Path "$locData\Roblox\Versions") -and (Test-Path "$ic\Roblox.exe")) {
                $p = Start-Process "$ic\Roblox.exe" -ArgumentList '-q','--no-ui' -PassThru -NoNewWindow -ErrorAction SilentlyContinue
                if ($p) { $null =$p.WaitForExit(30000) }
              }
            }
          )

          $jobs = @()
          foreach ($task in$appTasks) {
            if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock$task -ArgumentList $ic,$desk, $appData,$locData }
            else        { $jobs += Start-Job       -ScriptBlock$task -ArgumentList $ic,$desk, $appData,$locData }
          }
          $null = Wait-Job$jobs -Timeout 45
          $jobs | ForEach-Object { Remove-Job$_ -Force -ErrorAction SilentlyContinue }

          # Choco packages tùy chọn (nếu có)
          if (-not [string]::IsNullOrWhiteSpace($env:CHOCO_PKGS)) {
            $persistFile = "$env:SHARED_OS_DIR\choco-installed.txt"
            $already = if (Test-Path$persistFile) { @(Get-Content $persistFile) } else { @() }$pkgs = $env:CHOCO_PKGS -split '[,\s]+' | Where-Object {$_ -and ($_ -notin$already) }
            if ($pkgs.Count -gt 0) {
              & choco install$pkgs -y --no-progress --limit-output 2>&1 | Out-Null
              @($already + $pkgs | Select-Object -Unique) | Set-Content$persistFile -Encoding UTF8
            }
          }

          Write-Host "OK Cài đặt song song toàn bộ App hoàn tất" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: ⏳ Watchdog
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          function Test-Port {
            param([int]$P)
            try {
              $t = [System.Net.Sockets.TcpClient]::new()
              $a =$t.ConnectAsync('127.0.0.1', $P)$ok = $a.Wait(1500)$t.Close()
              return $ok
            } catch { return $false }
          }

          $start   = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }$end     = $start + ([long]$env:TOTAL_MINUTES * 60)
          $save    = "$env:RUNNER_TEMP\save-data.ps1"
          $sig     = $env:CONTROL_SIGNAL_FILE$u       = $env:RDP_USER$tsExe   = 'C:\Program Files\Tailscale\tailscale.exe'
          $lastLog = (Get-Date).AddHours(-1)$tick    = 0

          while ($true) {
            if (Test-Path $sig) {
              $c = (Get-Content -Raw$sig -ErrorAction SilentlyContinue).Trim()
              Remove-Item $sig -Force -ErrorAction SilentlyContinue
              switch ($c) {
                { $_ -in 'save','SAVE_NOW' } {
                  & $save -Reason 'manual'
                  $global:LASTEXITCODE = 0
                }
                {$_ -in 'restart','RESTART_SESSION','start-new' } {
                  'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV
                  break
                }
                { $_ -in 'stop','STOP_SESSION' } {
                  'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV
                  break
                }
              }
              if ($c -in 'restart','RESTART_SESSION','start-new','stop','STOP_SESSION') { break }
            }

            $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()$remain = $end -$now
            if ($remain -le 0) { break }

            if (((Get-Date) - $lastLog).TotalMinutes -ge 5) {$h = [math]::Floor($remain / 3600)$m = [math]::Floor(($remain % 3600) / 60)$sunOk = if (Test-Port 47990) { "OK" } else { "DOWN" }
              $rdpOk = if (Test-Port 3389)  { "OK" } else { "DOWN" }
              Write-Host "[$(Get-Date -f 'HH:mm:ss')] Con ${h}h${m}m | RDP=$rdpOk | Sunshine=$sunOk" -ForegroundColor Cyan
              $lastLog = Get-Date
            }

            $tick++

            if ($tick % 3 -eq 0) {
              try {
                @(quser 2>$null) | ForEach-Object {
                  $lineStr = "$_"
                  if (($lineStr -match "^\s*>?$([regex]::Escape($u))\s+") -and ($lineStr -notmatch "\s+console\s+")) {
                    $parts  = (($lineStr -replace '^>', ' ').Trim()) -split '\s+'$sidNum = $parts[1..($parts.Count - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1
                    if ($sidNum -and ($lineStr -match "\s+Disc\s+")) {
                      & tscon $sidNum /dest:console *>$null
                    }
                  }
                }
              } catch {}
            }

            if ($tick % 6 -eq 0) {
              if (-not (Test-Port 47990)) {
                Start-Service SunshineService,sunshinesvc -ErrorAction SilentlyContinue
                if (-not (Get-Process -Name sunshine -ErrorAction SilentlyContinue) -and (Test-Path 'C:\Program Files\Sunshine\sunshine.exe')) {
                  Start-Process 'C:\Program Files\Sunshine\sunshine.exe' -WorkingDirectory 'C:\Program Files\Sunshine' -WindowStyle Hidden -ErrorAction SilentlyContinue
                }
              }
              if (-not (Test-Port 3389)) {
                Restart-Service TermService -Force -ErrorAction SilentlyContinue
              }
            }

            if ($tick % 60 -eq 0 -and (Test-Path $tsExe) -and$env:TAILSCALE_AUTH_KEY) {
              $st = &$tsExe status 2>&1 | Out-String
              if ($st -notmatch '100\.') {
                &$tsExe up "--authkey=$env:TAILSCALE_AUTH_KEY" --accept-routes --accept-dns --unattended 2>&1 | Out-Null
              }
            }

            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          try {
            $s = "$env:RUNNER_TEMP\save-data.ps1"
            if (Test-Path $s) { &$s -Reason 'session-end' }
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🧹 Dọn dẹp
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            if (Test-Path $ts) {
              & $ts logout 2>&1 | Out-Null
              & $ts down 2>&1 | Out-Null
            }
            @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Sunshine-Moonlight-TCP','Sunshine-Moonlight-UDP') |
              ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
            Stop-Service TermService -Force -ErrorAction SilentlyContinue
            Stop-Service SunshineService,sunshinesvc -Force -ErrorAction SilentlyContinue
            $vhd = "$env:VHD_CONTAINER\alb-os-disk.vhdx"
            if (Test-Path $vhd) { Dismount-VHD -Path$vhd -ErrorAction SilentlyContinue }
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🔁 Auto-restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          DURATION:   ${{ inputs.duration }}
          WIN_IMAGE:  ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES:    ${{ inputs.vdd_resolution }}
          CHOCO_PKGS: ${{ inputs.choco_packages }}
          OPT_WIN:    ${{ inputs.optimize_windows }}
          EN_TS:      ${{ inputs.enable_tailscale }}
          EN_DNS:     ${{ inputs.enable_duckdns }}
        run: |
          $wfRef  =$env:GITHUB_WORKFLOW_REF
          $wfFile = if ($wfRef) {
            ($wfRef -split '@')[0] -split '/' | Select-Object -Last 1
          } else {
            "$env:GITHUB_WORKFLOW.yml" -replace ' ','-'
          }

          $optStr = ("$env:OPT_WIN").ToLower()
          $tsStr  = ("$env:EN_TS").ToLower()
          $dnsStr = ("$env:EN_DNS").ToLower()

          $a = @(
            'workflow', 'run', $wfFile,
            '--ref', $env:GITHUB_REF_NAME,
            '-f', "machine_id=$env:MACHINE_ID",
            '-f', "duration=$env:DURATION",
            '-f', 'auto_restart=true',
            '-f', "drive_letter=$env:MOUNT_LETTER",
            '-f', "vhd_size_gb=$env:VHD_SIZE_GB_VALIDATED",
            '-f', "windows_image=$env:WIN_IMAGE",
            '-f', "fixed_password=$env:FIXED_PASS",
            '-f', "vdd_resolution=$env:VDD_RES",
            '-f', "choco_packages=$env:CHOCO_PKGS",
            '-f', "optimize_windows=$optStr",
            '-f', "enable_tailscale=$tsStr",
            '-f', "enable_duckdns=$dnsStr"
          )
          & gh @a
          if ($LASTEXITCODE -ne 0) { throw 'Auto-restart fail' }
          Write-Host "OK Auto-restart triggered" -ForegroundColor Green
