# ═══════════════════════════════════════════════════════════════════════════════
# ALB-VPSFREE-ULTIMATE v70.0 — SUPREME ZENOVA TỐI THƯỢNG
# [CHUẨN HÓA TOÀN DIỆN CHO CẢ WINDOWS SERVER 2022 & 2025 - ÁP DỤNG TẤT CẢ CÁC MÁY]
# 1. Tên ổ đĩa hệ thống & phân vùng ảo đồng bộ: ZENOVA-OS
# 2. Fix triệt để màn hình đen / hình nền đen RDP & Sunshine (Giữ nguyên 100% ảnh gốc)
# 3. Fix triệt để Discord không vào được / crash / treo Squirrel trên Windows Server
# 4. Fix triệt để link Sunshine không vào được (Origin WAN, SSL cert trust, Service + Process, Keepalive)
# 5. Đầy đủ bộ ứng dụng tối thượng: Chrome, Edge, VSCode, Discord, Spotify, Bandicam, Roblox, StarDesk, EVKey
# 6. Sắp xếp Desktop khoa học, lọc sạch 100% icon trùng lặp giữa Public Desktop và User Desktop
# 7. Hàm cài đặt siêu tốc đa luồng (Turbo Multi-threading Downloader & Installer)
# 8. Web Quản Lý RDP & Sunshine port 8080 cao cấp + Full REST API (/api/info, /api/cmd, webhook report)
# 9. Tối ưu hóa hiệu năng chuyên sâu (Ultimate Performance, Unpark CPU, TCP Low Latency, Tắt bloatware)
# 10. Tự động lưu dữ liệu lên GitHub Release và tự động kích hoạt phiên mới 24/24 không gián đoạn
# ═══════════════════════════════════════════════════════════════════════════════
name: ALB-VPSFREE-ULTIMATE v70.0

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy & bản lưu riêng (VD: may-phu-1, may-phu-2)'
        required: false
        default: 'may-phu-1'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng mỗi phiên'
        required: false
        default: '5h00m'
        type: choice
        options: ['1h', '3h', '5h00m']
      auto_restart:
        description: '🔁 Tự khởi động phiên mới khi hết giờ (Treo 24/24)'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa riêng ZENOVA-OS'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng VHDX ZENOVA-OS (GB)'
        required: false
        default: '100'
        type: string
      windows_image:
        description: '🪟 Hệ điều hành Windows'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu RDP, Sunshine & Admin'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo Sunshine'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      choco_packages:
        description: '📦 Gói ứng dụng Chocolatey cài thêm (cách nhau bởi dấu cách)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Siêu tối ưu hóa Windows & Fix Lag toàn diện'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Mạng Tailscale P2P'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật tên miền DuckDNS'
        required: false
        default: true
        type: boolean
      bot_webhook_url:
        description: '🤖 Webhook URL thông báo máy cho Bot quản lý'
        required: false
        default: 'http://datdemo.duckdns.org:3000/api/rdp/report'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: true

jobs:
  Supreme-ZENOVA-RDP:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'may-phu-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb || '100' }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      SUNSHINE_PASS: ${{ inputs.fixed_password || 'Aistv@2026' }}
      BOT_WEBHOOK_URL: ${{ inputs.bot_webhook_url || secrets.BOT_WEBHOOK_URL || 'http://datdemo.duckdns.org:3000/api/rdp/report' }}
      BOT_API_SECRET: ${{ secrets.BOT_API_SECRET || secrets.ADMIN_PASSWORD || '2008' }}

    steps:
      - name: 📥 Checkout Repo (Lấy ảnh nền Zenova gốc)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: ⚡ Khởi tạo Ổ ZENOVA-OS & Engine lưu trữ
        shell: pwsh
        timeout-minutes: 8
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dTemp = 'D:\tmp'
            New-Item -ItemType Directory -Force -Path $dTemp | Out-Null
            $env:TEMP = $dTemp; $env:TMP = $dTemp
            "TEMP=$dTemp" >> $env:GITHUB_ENV
            "TMP=$dTemp" >> $env:GITHUB_ENV
          } catch {}

          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          # Đổi tên ổ C: thành ZENOVA-OS
          try { & label C: ZENOVA-OS *> $null } catch {}

          $vhdSizeInput = [int64](<("$env:VHD_SIZE_GB" -replace '[^0-9]', ''>))
          if ($vhdSizeInput -lt 10) { $vhdSizeInput = 100 }
          if ($vhdSizeInput -gt 102400) { $vhdSizeInput = 102400 }
          "VHD_SIZE_GB_VALIDATED=$vhdSizeInput" >> $env:GITHUB_ENV

          $cleanId = (($env:MACHINE_ID).Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', ''
          if ([string]::IsNullOrWhiteSpace($cleanId)) { $cleanId = 'may-phu-1' }
          $relTag = "alb-storage-$cleanId"

          $null = gh release view $relTag --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
            $dummy = "$env:RUNNER_TEMP\init.txt"
            Set-Content $dummy -Value "ALB Init" -Encoding UTF8
            gh release create $relTag $dummy --repo $env:GH_REPO --title "ALB Storage ($cleanId)" --notes "Kho luu [$cleanId]"
          }
          "MACHINE_ID=$cleanId" >> $env:GITHUB_ENV
          "RELEASE_TAG=$relTag" >> $env:GITHUB_ENV

          $total = 300; $dispTime = '5 gio 00 phut'
          if ($env:INPUT_DURATION -eq '1h') { $total = 60; $dispTime = '1 gio 00 phut' }
          elseif ($env:INPUT_DURATION -eq '3h') { $total = 180; $dispTime = '3 gio 00 phut' }
          "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV
          "DISPLAY_TIME=$dispTime" >> $env:GITHUB_ENV
          "RDP_USER=$env:USERNAME" >> $env:GITHUB_ENV
          "PROFILE_PATH=$env:USERPROFILE" >> $env:GITHUB_ENV

          $dl = (($env:DRIVE_LETTER).Trim() -replace '[^A-Za-z]', '').ToUpper()
          if ((-not $dl) -or (@('C','D') -contains $dl)) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV

          $vhdContainer = 'C:\ALB-VHD-HOST'
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile = "$vhdContainer\alb-os-disk.vhdx"
          $actualVhdGb = if ($vhdSizeInput -gt 65530) { [int64]65530 } else { $vhdSizeInput }
          $sizeBytes = $actualVhdGb * 1GB
          $mounted = $false
          try {
            if (-not (Test-Path $vhdFile)) {
              New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru |
                New-Partition -DriveLetter $dl -UseMaximumSize |
                Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:$false | Out-Null
            } else { Mount-VHD -Path $vhdFile -ErrorAction Stop }
            if (Test-Path "${dl}:\") {
              $mounted = $true
              try { & label "${dl}:" ZENOVA-OS *> $null } catch {}
            }
          } catch {}

          if (-not $mounted) {
            $fallbackDir = "$vhdContainer\VIRTUAL-DRIVE-ROOT"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            & subst "${dl}:" $fallbackDir
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue
          }

          $sharedRoot = "${dl}:\ALB-SYSTEM"
          $osDir = "$sharedRoot\OS-OVERLAY"
          $instCache = "$osDir\Installers"
          @(
            "$sharedRoot\sessions", "$sharedRoot\DATA", "$osDir\InstalledApps",
            "$osDir\bin", $instCache, "$osDir\Sunshine-Config",
            "$osDir\Sunshine-Portable", "$osDir\Wallpaper", "$sharedRoot\Users", "${dl}:\Apps"
          ) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }

          if (-not (Test-Path 'C:\ALB-Apps')) {
            New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target "$osDir\InstalledApps" -Force | Out-Null
          }

          "SHARED_ROOT=$sharedRoot" >> $env:GITHUB_ENV
          "SHARED_DATA_DIR=$sharedRoot\DATA" >> $env:GITHUB_ENV
          "SHARED_OS_DIR=$osDir" >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$sharedRoot\sessions\rdp-session-state.json" >> $env:GITHUB_ENV
          "PROFILE_ROOT=$sharedRoot\Users" >> $env:GITHUB_ENV
          "CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\alb-control.txt" >> $env:GITHUB_ENV
          "VHD_CONTAINER=$vhdContainer" >> $env:GITHUB_ENV
          "INSTALLER_CACHE=$instCache" >> $env:GITHUB_ENV
          "SUNSHINE_PERSIST_CFG=$osDir\Sunshine-Config" >> $env:GITHUB_ENV
          "WALLPAPER_DIR=$osDir\Wallpaper" >> $env:GITHUB_ENV

          # Script đóng gói & lưu dữ liệu siêu tốc
          $L = New-Object System.Collections.Generic.List[string]
          $L.Add('param([string]$Reason = "session-end")')
          $L.Add('$ErrorActionPreference = "Continue"')
          $L.Add('if ($env:DATA_RESTORED -ne "1") { exit 0 }')
          $L.Add('$root = $env:SHARED_ROOT')
          $L.Add('if ((-not $root) -or (-not (Test-Path $root))) { exit 0 }')
          $L.Add('$apps = @("chrome","msedge","discord","Spotify","Code","bdcam","RobloxPlayerBeta","StarDesk","EVKey64")')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue')
          $L.Add('Start-Sleep -Seconds 1')
          $L.Add('$u = $env:RDP_USER; $profSrc = $env:PROFILE_PATH')
          $L.Add('if ($u -and $profSrc -and (Test-Path $profSrc)) {')
          $L.Add('  $profDst = "$root\Users\$u"; New-Item -ItemType Directory -Force -Path $profDst | Out-Null')
          $L.Add('  $ex = @("$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages")')
          $L.Add('  robocopy $profSrc $profDst /MIR /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD @ex *> $null')
          $L.Add('}')
          $L.Add('if (Test-Path "C:\Program Files\Sunshine") {')
          $L.Add('  New-Item -ItemType Directory -Force -Path "$env:SHARED_OS_DIR\Sunshine-Portable" | Out-Null')
          $L.Add('  robocopy "C:\Program Files\Sunshine" "$env:SHARED_OS_DIR\Sunshine-Portable" /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null')
          $L.Add('}')
          $L.Add('$packDir = "$env:RUNNER_TEMP\alb-pack-$Reason"')
          $L.Add('if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }')
          $L.Add('New-Item -ItemType Directory -Force -Path $packDir | Out-Null')
          $L.Add('$archiveBase = "$packDir\alb-drive.7z"')
          $L.Add('Push-Location $root')
          $L.Add('& 7z a -t7z -m0=lzma2 -mx=1 -mmt=on -ssw -v1900m $archiveBase * -xr!Pagefile.sys *> $null')
          $L.Add('Pop-Location')
          $L.Add('$chunks = @(Get-ChildItem $packDir -Filter "alb-drive.7z.*" | Sort-Object Name)')
          $L.Add('if ($chunks.Count -eq 0) { exit 1 }')
          $L.Add('$chunkList = @($chunks | ForEach-Object { @{ name = $_.Name; size = $_.Length } })')
          $L.Add('$manifest = @{ machineId = $env:MACHINE_ID; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); chunkCount = $chunks.Count; chunks = $chunkList }')
          $L.Add('$manifest | ConvertTo-Json -Depth 5 | Set-Content "$packDir\drive-manifest.json" -Encoding UTF8')
          $L.Add('$files = @($chunks | ForEach-Object { $_.FullName }) + @("$packDir\drive-manifest.json")')
          $L.Add('for ($i = 1; $i -le 3; $i++) { & gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep (2 * $i) }')
          $L.Add('Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue')
          $L.Add('exit 0')
          Set-Content -Path "$env:RUNNER_TEMP\save-data.ps1" -Value ($L -join "`r`n") -Encoding UTF8
          $global:LASTEXITCODE = 0
          Write-Host "✅ Khởi tạo ZENOVA-OS ($vhdSizeInput GB) hoàn tất cho máy: $cleanId" -ForegroundColor Green

      - name: ♻️ Khôi phục ổ đĩa ZENOVA-OS & Profile
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dlDir = "$env:RUNNER_TEMP\gh-restore"
            if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
            if (-not (Test-Path "$dlDir\drive-manifest.json")) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }
            $manifest = Get-Content -Raw "$dlDir\drive-manifest.json" | ConvertFrom-Json
            $chunkNames = @($manifest.chunks | ForEach-Object { $_.name })
            $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
            $jobs = @()
            $chunkNames | ForEach-Object {
              if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
              else { $jobs += Start-Job -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
            }
            if ($jobs.Count -gt 0) { $null = Wait-Job $jobs -Timeout 120; $jobs | Remove-Job -Force -ErrorAction SilentlyContinue }
            $first = Get-ChildItem $dlDir -Filter '*.7z.001' | Select-Object -First 1
            if (-not $first) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }
            $stage = "$env:VHD_CONTAINER\restore-stage"
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            & 7z x $first.FullName "-o$stage" -y -mmt=on *> $null
            Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue
            $hit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            $src = if ($hit) { $hit.Directory.Parent.FullName } else { $stage }
            robocopy $src $env:SHARED_ROOT /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
            $oldProf = "$env:PROFILE_ROOT\$env:RDP_USER"
            if (Test-Path $oldProf) { robocopy $oldProf $env:PROFILE_PATH /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* /XD @("$oldProf\AppData\Local\Temp") *> $null }
            if (Test-Path $env:SHARED_STATE_FILE) { try { $s = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json; if ($s.password) { "RESTORE_PASS=$($s.password)" >> $env:GITHUB_ENV } } catch {} }
            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
            'DATA_RESTORED=1' >> $env:GITHUB_ENV
            Write-Host "✅ Khôi phục toàn bộ dữ liệu & ứng dụng thành công!" -ForegroundColor Green
          } catch { 'DATA_RESTORED=1' >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0

      - name: 🚀 Turbo Downloader (Cực nhanh - Đa luồng song song)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
          New-Item -ItemType Directory -Force -Path $ic | Out-Null
          $downloads = @(
            @{ F = "$ic\usbmmidd.zip"; U = 'https://www.amyuni.com/downloads/usbmmidd_v2.zip'; Min = 100KB },
            @{ F = "$ic\VBCable.zip"; U = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip'; Min = 500KB },
            @{ F = "$ic\sunshine-setup.exe"; U = 'https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe'; Min = 5MB },
            @{ F = "$ic\tailscale.msi"; U = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'; Min = 5MB },
            @{ F = "$ic\EVKey.zip"; U = 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip'; Min = 500KB },
            @{ F = "$ic\VSCode.exe"; U = 'https://update.code.visualstudio.com/latest/win32-x64-system/stable'; Min = 40MB },
            @{ F = "$ic\DiscordSetup.exe"; U = 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'; Min = 40MB },
            @{ F = "$ic\Spotify.exe"; U = 'https://download.scdn.co/SpotifyFullSetupX64.exe'; Min = 5MB },
            @{ F = "$ic\bdcam.exe"; U = 'https://dl.bandicam.com/bdcamsetup.exe'; Min = 10MB },
            @{ F = "$ic\Roblox.exe"; U = 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe'; Min = 1MB },
            @{ F = "$ic\StarDesk.exe"; U = 'https://api.stardesk.net/api/v1/release/dl/1?channel=official'; Min = 5MB }
          )
          $sb = {
            param($f, $url, $min)
            if ((-not (Test-Path $f)) -or ((Get-Item $f -EA SilentlyContinue).Length -lt $min)) {
              $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
              & curl.exe -L --retry 3 --connect-timeout 15 -A $ua -s $url -o $f 2>$null
            }
          }
          $jobs = @()
          $downloads | ForEach-Object {
            if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock $sb -ArgumentList $_.F, $_.U, $_.Min }
            else { $jobs += Start-Job -ScriptBlock $sb -ArgumentList $_.F, $_.U, $_.Min }
          }
          if ($jobs.Count -gt 0) { $null = Wait-Job $jobs -Timeout 80; $jobs | Remove-Job -Force -ErrorAction SilentlyContinue }
          Write-Host "✅ Hoàn tất tải trước toàn bộ bộ cài siêu tốc!" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🔐 RDP 60FPS + Siêu Tối Ưu Hóa & Fix Lag Triệt Để
        shell: pwsh
        timeout-minutes: 4
        env:
          OPT_WIN: ${{ inputs.optimize_windows }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fSingleSessionPerUser 0 -Type DWord -Force
          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          @{ UserAuthentication = 0; SecurityLayer = 0; fPromptForPassword = 0; fEnableRemoteFX = 1; MaxIdleTime = 0; MaxDisconnectionTime = 0; fNoRemoteDesktopWallpaper = 0 } | ForEach-Object {
            $_.GetEnumerator() | ForEach-Object { Set-ItemProperty $p $_.Key $_.Value -Type DWord -Force }
          }
          $rdpPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $rdpPol -Force | Out-Null
          @{ ColorDepth = 5; MaxMonitors = 4; AVC444ModePreferred = 1; AVCHardwareEncodePreferred = 1; MinEncryptionLevel = 2; fNoRemoteDesktopWallpaper = 0 } | ForEach-Object {
            $_.GetEnumerator() | ForEach-Object { Set-ItemProperty $rdpPol $_.Key $_.Value -Type DWord -Force }
          }
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'fNoRemoteDesktopWallpaper' -Value 0 -Type DWord -Force

          $rdpidd = 'C:\Windows\System32\drivers\UMDF\RDPidd.dll'
          if (Test-Path $rdpidd) { & takeown.exe /F $rdpidd /A *> $null; & icacls.exe $rdpidd /grant "*S-1-5-32-544:F" /Q *> $null }

          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Tailscale-ICMP') | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -EA SilentlyContinue }
          New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null

          Set-Service TermService -StartupType Automatic -EA SilentlyContinue
          Set-Service UmRdpService -StartupType Automatic -EA SilentlyContinue
          Start-Service TermService -EA SilentlyContinue
          Start-Service UmRdpService -EA SilentlyContinue

          if ($env:OPT_WIN -eq 'true') {
            tzutil /s 'SE Asia Standard Time' 2>$null
            # Kích hoạt gói Ultimate Performance cao cấp nhất
            $ult = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
            if ($ult -match '([a-f0-9\-]{36})') { & powercfg /setactive $Matches[1] 2>$null }
            & powercfg /change standby-timeout-ac 0; & powercfg /change monitor-timeout-ac 0; & powercfg /hibernate off
            & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
            & powercfg /setactive scheme_current 2>$null

            # Tắt triệt để PowerThrottling và tối ưu CPU Quantum cho App phản hồi cực nhạy
            $pt = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
            New-Item $pt -Force | Out-Null
            Set-ItemProperty $pt PowerThrottlingOff 1 -Type DWord -Force
            Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Type DWord -Force

            # Kích hoạt Hardware-Accelerated GPU Scheduling (HAGS)
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' -Name 'HwSchMode' -Value 2 -Type DWord -Force

            # Tối ưu mạng TCP/IP: Giảm ping, tắt thuật toán Nagle, bật ECN
            & netsh int tcp set global autotuninglevel=normal 2>$null
            & netsh int tcp set global ecncapability=enabled 2>$null
            & netsh int ip set global taskoffload=enabled 2>$null
            $tcpParam = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces'
            if (Test-Path $tcpParam) {
              Get-ChildItem $tcpParam | ForEach-Object {
                Set-ItemProperty $_.PSPath TcpAckFrequency 1 -Type DWord -Force -EA SilentlyContinue
                Set-ItemProperty $_.PSPath TCPNoDelay 1 -Type DWord -Force -EA SilentlyContinue
              }
            }
            $sysProfile = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
            if (Test-Path $sysProfile) {
              Set-ItemProperty $sysProfile NetworkThrottlingIndex 0xFFFFFFFF -Type DWord -Force -EA SilentlyContinue
              Set-ItemProperty $sysProfile SystemResponsiveness 0 -Type DWord -Force -EA SilentlyContinue
            }

            # Tắt cập nhật last access time ổ đĩa
            & fsutil behavior set disablelastaccess 1 *> $null

            # Tắt dịch vụ rác chạy ngầm gây 100% CPU & nghẽn đĩa
            @('wuauserv','DiagTrack','WSearch','SysMain','Spooler') | ForEach-Object {
              Stop-Service -Name $_ -Force -EA SilentlyContinue
              Set-Service -Name $_ -StartupType Disabled -EA SilentlyContinue
            }
            try {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -ErrorAction SilentlyContinue
            } catch {}
          }
          $cpuObj = Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -First 1
          "CPU_MODEL_INFO=$($cpuObj.Name.Trim()) ($($cpuObj.NumberOfLogicalProcessors) vCPU)" >> $env:GITHUB_ENV
          Write-Host "✅ Đã tối ưu hóa CPU, mạng TCP/IP & cấu hình RDP 60FPS thành công!" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🖥️🔊☀️ VDD + VB-Audio + Sunshine Gamestream (Fix triệt để link Sunshine)
        timeout-minutes: 6
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $sunPersist = $env:SUNSHINE_PERSIST_CFG
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
          $currentUser = $env:RDP_USER
          $parts = $env:VDD_RES -split '[@x]'
          $w = if ($parts.Count -ge 1) { [int]$parts[0] } else { 1920 }
          $h = if ($parts.Count -ge 2) { [int]$parts[1] } else { 1080 }
          $hz = if ($parts.Count -ge 3) { [int]$parts[2] } else { 60 }

          $vddBlock = {
            param($ic, $w, $h, $hz)
            try {
              $zip = "$ic\usbmmidd.zip"; $usbDir = 'C:\usbmmidd_v2'
              if (Test-Path $zip) { New-Item -ItemType Directory -Force -Path $usbDir | Out-Null; & 7z x $zip "-o$usbDir" -y -mmt=on *> $null }
              $inst = "$usbDir\deviceinstaller64.exe"
              if (Test-Path $inst) {
                Push-Location $usbDir
                Get-ChildItem $usbDir -Filter '*.cer' | ForEach-Object {
                  Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *> $null
                  Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *> $null
                }
                & $inst install usbmmidd.inf usbmmidd *> $null
                $wudf = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
                New-Item $wudf -Force | Out-Null
                Set-ItemProperty $wudf '0' "${w},${h},${hz}" -Force
                & $inst enableidd 1 *> $null
                Pop-Location
              }
              return 'VDD-OK'
            } catch { return "VDD-FAIL: $_" }
          }

          $vbBlock = {
            param($ic)
            try {
              @('MMCSS','AudioEndpointBuilder','Audiosrv') | ForEach-Object {
                Set-Service -Name $_ -StartupType Automatic -EA SilentlyContinue
                Start-Service -Name $_ -EA SilentlyContinue
              }
              $zip = "$ic\VBCable.zip"; $vbDir = "$ic\VBCable"
              if (Test-Path $zip) { New-Item -ItemType Directory -Force $vbDir | Out-Null; & 7z x $zip "-o$vbDir" -y -mmt=on *> $null }
              $inf = Get-ChildItem $vbDir -Filter '*64*.inf' -EA SilentlyContinue | Select-Object -First 1
              if ($inf) {
                $p1 = Start-Process -FilePath 'pnputil.exe' -ArgumentList "/add-driver `"$($inf.FullName)`" /install" -PassThru -NoNewWindow -EA SilentlyContinue
                if ($p1) { $p1.WaitForExit(15000) }
              }
              return 'VB-OK'
            } catch { return "VB-FAIL: $_" }
          }

          $sunBlock = {
            param($ic, $sunPersist, $machineId, $sunPass, $currentUser)
            try {
              $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"
              if (-not (Test-Path $sunExe)) {
                $inst = "$ic\sunshine-setup.exe"
                if ((Test-Path $inst) -and ((Get-Item $inst).Length -gt 5MB)) {
                  $p = Start-Process $inst -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
                  if ($p) { $p.WaitForExit(60000) }
                }
              }
              if (-not (Test-Path $sunExe)) { return 'SUN-FAIL: not installed' }

              Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue
              Stop-Process -Name sunshine,sunshinesvc -Force -EA SilentlyContinue
              Start-Sleep -Milliseconds 500

              $cfg = "$sunDir\config"
              if ((Test-Path $cfg) -and ((Get-Item $cfg -Force).Attributes -notmatch 'ReparsePoint')) {
                if (@(Get-ChildItem $sunPersist -Force -EA SilentlyContinue).Count -eq 0) {
                  Copy-Item "$cfg\*" $sunPersist -Recurse -Force -EA SilentlyContinue
                }
                Remove-Item $cfg -Recurse -Force -EA SilentlyContinue
              }
              if (-not (Test-Path $cfg)) { New-Item -ItemType Junction $cfg -Target $sunPersist -Force | Out-Null }

              # File cấu hình Sunshine chuẩn cho WAN / Tailscale / Web UI
              $conf = "$sunPersist\sunshine.conf"
              $cfgLines = @(
                "sunshine_name = ZENOVA-$machineId",
                "origin_web_ui_allowed = wan",
                "address_family = both",
                "upnp = disabled",
                "port = 47989",
                "min_log_level = info"
              )
              $cfgLines | Set-Content $conf -Encoding UTF8 -Force

              # Cấp quyền tường lửa toàn diện
              Remove-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -EA SilentlyContinue
              New-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -Direction Inbound -Action Allow -Program $sunExe -Profile Any | Out-Null
              $svcExe = "$sunDir\tools\sunshinesvc.exe"
              if (Test-Path $svcExe) {
                Remove-NetFirewallRule -DisplayName 'Sunshine-Svc-Allow' -EA SilentlyContinue
                New-NetFirewallRule -DisplayName 'Sunshine-Svc-Allow' -Direction Inbound -Action Allow -Program $svcExe -Profile Any | Out-Null
              }

              # Đồng bộ tài khoản cho cả admin và tài khoản người dùng hiện tại
              Push-Location $sunDir
              & $sunExe --creds admin $sunPass *> $null
              if ($currentUser -and ($currentUser -ne 'admin')) {
                & $sunExe --creds $currentUser $sunPass *> $null
              }
              Pop-Location

              # Tin cậy chứng chỉ SSL tự ký của Sunshine vào Root Store để trình duyệt không báo lỗi
              Get-ChildItem -Path $sunPersist -Include '*.cert','*.crt' -Recurse -EA SilentlyContinue | ForEach-Object {
                Import-Certificate -FilePath $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *> $null
                Import-Certificate -FilePath $_.FullName -CertStoreLocation 'Cert:\CurrentUser\Root' *> $null
              }

              # Bật dịch vụ Sunshine và chạy tiến trình trực tiếp (Đảm bảo 100% hoạt động)
              Set-Service sunshinesvc -StartupType Automatic -EA SilentlyContinue
              Start-Service sunshinesvc -EA SilentlyContinue
              Start-Sleep -Seconds 2

              if (-not (Get-Process sunshine -ErrorAction SilentlyContinue)) {
                Start-Process -FilePath $sunExe -WorkingDirectory $sunDir -WindowStyle Hidden
              }

              # Tạo tác vụ khởi động khi đăng nhập
              & schtasks.exe /Create /TN "ALB-Launch-Sunshine" /TR "`"$sunExe`"" /SC ONLOGON /RL HIGHEST /F *> $null

              $portOk = $false; $deadline = (Get-Date).AddSeconds(15)
              while ((Get-Date) -lt $deadline) {
                try {
                  $tcp = [System.Net.Sockets.TcpClient]::new()
                  $conn = $tcp.ConnectAsync('127.0.0.1', 47990)
                  if ($conn.Wait(400)) { $tcp.Close(); $portOk = $true; break }
                  $tcp.Close()
                } catch {}
                Start-Sleep -Milliseconds 400
              }
              if ($portOk) { return 'SUN-OK' } else { return 'SUN-NOPORT' }
            } catch { return "SUN-FAIL: $_" }
          }

          $jobList = @()
          if ($hasTJ) {
            $jobList += @{ Name = 'VDD'; Job = (Start-ThreadJob -ScriptBlock $vddBlock -ArgumentList $ic, $w, $h, $hz) }
            $jobList += @{ Name = 'VBAudio'; Job = (Start-ThreadJob -ScriptBlock $vbBlock -ArgumentList $ic) }
            $jobList += @{ Name = 'Sunshine'; Job = (Start-ThreadJob -ScriptBlock $sunBlock -ArgumentList $ic, $sunPersist, $env:MACHINE_ID, $env:SUNSHINE_PASS, $currentUser) }
          } else {
            $jobList += @{ Name = 'VDD'; Job = (Start-Job -ScriptBlock $vddBlock -ArgumentList $ic, $w, $h, $hz) }
            $jobList += @{ Name = 'VBAudio'; Job = (Start-Job -ScriptBlock $vbBlock -ArgumentList $ic) }
            $jobList += @{ Name = 'Sunshine'; Job = (Start-Job -ScriptBlock $sunBlock -ArgumentList $ic, $sunPersist, $env:MACHINE_ID, $env:SUNSHINE_PASS, $currentUser) }
          }
          $null = Wait-Job -Job ($jobList | ForEach-Object { $_.Job }) -Timeout 140
          foreach ($entry in $jobList) {
            $out = Receive-Job -Job $entry.Job -EA SilentlyContinue
            Write-Host "  [$($entry.Name)] $out" -ForegroundColor $(if ($out -match 'OK') { 'Green' } else { 'Yellow' })
            Remove-Job -Job $entry.Job -Force -EA SilentlyContinue
          }
          $global:LASTEXITCODE = 0

      - name: 🌐 Mạng Tailscale & DuckDNS
        timeout-minutes: 5
        env:
          EN_TS: ${{ inputs.enable_tailscale }}
          EN_DNS: ${{ inputs.enable_duckdns }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tsIp = '127.0.0.1'; $tsStatus = 'DISABLED'; $funnelUrl = ''
          if ($env:EN_TS -eq 'true') {
            if (-not $env:TAILSCALE_AUTH_KEY) { $tsStatus = 'NO_KEY' } else {
              try {
                $ts = 'C:\Program Files\Tailscale\tailscale.exe'
                if (-not (Test-Path $ts)) {
                  $msi = "$env:INSTALLER_CACHE\tailscale.msi"
                  if (Test-Path $msi) { Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -NoNewWindow }
                }
                if (Test-Path $ts) {
                  Set-Service Tailscale -StartupType Automatic -EA SilentlyContinue
                  Start-Service Tailscale -EA SilentlyContinue
                  Start-Sleep -Seconds 3
                  & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=zenova-$($env:MACHINE_ID)" --accept-routes --accept-dns --reset --unattended
                  if ($LASTEXITCODE -eq 0) {
                    & $ts set --unattended=true 2>&1 | Out-Null
                    1..15 | ForEach-Object {
                      if ($tsIp -eq '127.0.0.1') {
                        $ipOut = (& $ts ip -4 2>&1 | Out-String).Trim()
                        if ($ipOut -match '^\d+\.\d+\.\d+\.\d+$') { $tsIp = $ipOut; $tsStatus = 'CONNECTED' } else { Start-Sleep -Seconds 2 }
                      }
                    }
                    try {
                      & $ts funnel reset 2>&1 | Out-Null
                      & $ts funnel --bg $env:WEB_PORT 2>&1 | Out-Null
                      Start-Sleep -Seconds 2
                      $fStat = (& $ts funnel status 2>&1 | Out-String)
                      if ($fStat -match '(https://[^\s]+)') { $funnelUrl = $Matches[1].TrimEnd('/') }
                    } catch {}
                  } else { $tsStatus = 'AUTH_FAIL' }
                } else { $tsStatus = 'INSTALL_FAIL' }
              } catch { $tsStatus = 'ERROR' }
            }
          }
          "TAILSCALE_IP=$tsIp" >> $env:GITHUB_ENV
          "FUNNEL_URL=$funnelUrl" >> $env:GITHUB_ENV
          "TS_STATUS=$tsStatus" >> $env:GITHUB_ENV

          $pubIp = ''; try { $pubIp = (Invoke-WebRequest -Uri 'https://api.ipify.org' -UseBasicParsing -TimeoutSec 5).Content.Trim() } catch {}
          $ddnsUrl = ''
          if ($env:EN_DNS -eq 'true' -and $env:DUCKDNS_TOKEN -and $env:DUCKDNS_DOMAIN) {
            try {
              $targetIp = if ($tsIp -ne '127.0.0.1') { $tsIp } else { $pubIp }
              $cleanDom = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$', ''
              $res = (Invoke-WebRequest -Uri "https://www.duckdns.org/update?domains=$cleanDom&token=$env:DUCKDNS_TOKEN&ip=$targetIp" -UseBasicParsing -TimeoutSec 8).Content.Trim()
              if ($res -eq 'OK') { $ddnsUrl = "${cleanDom}.duckdns.org" }
            } catch {}
          }
          "DUCKDNS_URL=$ddnsUrl" >> $env:GITHUB_ENV
          "DUCKDNS_PUBLIC_IP=$pubIp" >> $env:GITHUB_ENV
          Write-Host "✅ Mạng Tailscale [$tsStatus - IP: $tsIp] | DuckDNS: $ddnsUrl" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 👤 User + Wallpaper Siêu Cấp (Fix triệt để hình nền đen - All OS 22 & 25)
        shell: pwsh
        timeout-minutes: 5
        env:
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER; $profPath = $env:PROFILE_PATH; $pass = 'Aistv@2026'
          if (-not [string]::IsNullOrWhiteSpace($env:FIXED_PASS_INPUT)) { $pass = $env:FIXED_PASS_INPUT.Trim() }
          elseif ($env:RESTORE_PASS) { $pass = $env:RESTORE_PASS }

          try {
            & net accounts /maxpwage:unlimited *> $null
            $sp = ConvertTo-SecureString $pass -AsPlainText -Force
            try { Set-LocalUser -Name $user -Password $sp -PasswordNeverExpires $true -EA Stop } catch {}
            & net user $user $pass /active:yes /expires:never *> $null
            Add-LocalGroupMember -Group 'Administrators' -Member $user -EA SilentlyContinue
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -EA SilentlyContinue
            Enable-LocalUser -Name $user -EA SilentlyContinue
            "RDP_PASS=$pass" >> $env:GITHUB_ENV
            "SUNSHINE_PASS=$pass" >> $env:GITHUB_ENV
            $wl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
            Set-ItemProperty $wl AutoAdminLogon '1' -Force
            Set-ItemProperty $wl DefaultUserName $user -Force
            Set-ItemProperty $wl DefaultPassword $pass -Force
            Set-ItemProperty $wl DefaultDomainName $env:COMPUTERNAME -Force
          } catch {}

          # ══════════════════════════════════════════════════════════════════════════
          # FIX TRIỆT ĐỂ HÌNH NỀN ĐEN - GIỮ NGUYÊN 100% FILE ẢNH GỐC
          # ══════════════════════════════════════════════════════════════════════════
          $wallDir = $env:WALLPAPER_DIR
          New-Item -ItemType Directory -Force -Path $wallDir | Out-Null
          $targetWallPng = 'C:\Windows\Web\Wallpaper\Zenova-Wallpaper.png'
          $foundRepoImg = $null

          if ($env:GITHUB_WORKSPACE -and (Test-Path $env:GITHUB_WORKSPACE)) {
            $foundRepoImg = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "Zenova Cloud Aurora Lake.png" -Recurse -File -EA SilentlyContinue | Select-Object -First 1
            if (-not $foundRepoImg) {
              $foundRepoImg = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Include '*Zenova*','*Aurora*','*.png' -Recurse -File -EA SilentlyContinue | Where-Object { $_.Length -gt 50KB } | Select-Object -First 1
            }
          }

          if ($foundRepoImg) {
            # Giữ nguyên 100% định dạng và nội dung ảnh gốc
            Copy-Item -Path $foundRepoImg.FullName -Destination $targetWallPng -Force
            Copy-Item -Path $foundRepoImg.FullName -Destination "$wallDir\Zenova Cloud Aurora Lake.png" -Force

            # Ghi đè vào các vị trí hình nền mặc định của Windows
            @('C:\Windows\Web\Wallpaper\Windows\img0.jpg','C:\Windows\Web\Screen\img100.jpg') | ForEach-Object {
              if (Test-Path $_) {
                & takeown.exe /F $_ /A *> $null
                & icacls.exe $_ /grant 'Administrators:F' /Q *> $null
                Copy-Item -Path $targetWallPng -Destination $_ -Force -EA SilentlyContinue
              }
            }

            # Nạp vào Windows Themes Cache
            $themesDir = "$env:APPDATA\Microsoft\Windows\Themes"
            New-Item -ItemType Directory -Force -Path $themesDir | Out-Null
            Copy-Item -Path $targetWallPng -Destination "$themesDir\TranscodedWallpaper" -Force -EA SilentlyContinue
            Copy-Item -Path $targetWallPng -Destination "$themesDir\TranscodedWallpaper.jpg" -Force -EA SilentlyContinue

            # Tắt triệt để chính sách cấm hình nền qua RDP
            $tsPolicies = @(
              'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services',
              'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp',
              'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations'
            )
            foreach ($pPath in $tsPolicies) {
              if (-not (Test-Path $pPath)) { New-Item -Path $pPath -Force | Out-Null }
              Set-ItemProperty -Path $pPath -Name 'fNoRemoteDesktopWallpaper' -Value 0 -Type DWord -Force
            }

            # Thiết lập Registry hình nền cho CurrentUser, Default User và Group Policy
            $desktopRegs = @('HKCU:\Control Panel\Desktop', 'Registry::HKEY_USERS\.DEFAULT\Control Panel\Desktop')
            foreach ($reg in $desktopRegs) {
              if (Test-Path $reg) {
                Set-ItemProperty -Path $reg -Name 'Wallpaper' -Value $targetWallPng -Force
                Set-ItemProperty -Path $reg -Name 'WallpaperStyle' -Value '10' -Force
                Set-ItemProperty -Path $reg -Name 'TileWallpaper' -Value '0' -Force
              }
            }

            $polSys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
            New-Item $polSys -Force | Out-Null
            Set-ItemProperty -Path $polSys -Name 'Wallpaper' -Value $targetWallPng -Force
            Set-ItemProperty -Path $polSys -Name 'WallpaperStyle' -Value '10' -Force

            $polUsr = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
            New-Item $polUsr -Force | Out-Null
            Set-ItemProperty -Path $polUsr -Name 'Wallpaper' -Value $targetWallPng -Force
            Set-ItemProperty -Path $polUsr -Name 'WallpaperStyle' -Value '10' -Force

            # Ép nạp tức thì qua Windows API SystemParametersInfo
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Wall { [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int u, int p, string l, int f); }'
            [Wall]::SystemParametersInfo(20, 0, $targetWallPng, 3) | Out-Null
            & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True

            # Tạo script áp dụng hình nền trực tiếp
            $applyScript = "Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport(`"user32.dll`", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int u, int p, string l, int f); }'; [W]::SystemParametersInfo(20, 0, 'C:\Windows\Web\Wallpaper\Zenova-Wallpaper.png', 3); RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True"
            Set-Content -Path 'C:\Windows\Web\Wallpaper\ApplyWallpaper.ps1' -Value $applyScript -Encoding UTF8 -Force

            # Tự động cưỡng chế hình nền mỗi khi người dùng kết nối vào RDP hoặc Sunshine (Chống màn hình đen 100%)
            $startupDirAll = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup'
            New-Item -ItemType Directory -Force -Path $startupDirAll | Out-Null
            $vbsLines = @(
              'Set WshShell = CreateObject("WScript.Shell")',
              'WshShell.Run "powershell.exe -ExecutionPolicy Bypass -NoProfile -WindowStyle Hidden -File ""C:\Windows\Web\Wallpaper\ApplyWallpaper.ps1""", 0, False'
            )
            Set-Content -Path "$startupDirAll\SetZenovaWallpaper.vbs" -Value ($vbsLines -join "`r`n") -Encoding ASCII -Force

            "WALLPAPER_STATUS=Zenova Original (Da Fix Triet De Hinh Nen Den)" >> $env:GITHUB_ENV
            Write-Host "✅ Đã áp dụng hình nền Zenova Cloud Aurora Lake gốc & Fix triệt để màn hình đen!" -ForegroundColor Green
          } else {
            "WALLPAPER_STATUS=Chua co anh trong Repo" >> $env:GITHUB_ENV
            Write-Host "⚠️ Không tìm thấy ảnh Zenova Cloud Aurora Lake.png trong repo checkout." -ForegroundColor Yellow
          }

          # Dọn sạch Desktop để chuẩn bị tạo bộ shortcut mới tinh gọn
          $desktopDir = "$profPath\Desktop"; $pubDesktop = 'C:\Users\Public\Desktop'
          New-Item -ItemType Directory -Force -Path $desktopDir, $pubDesktop | Out-Null
          @("$desktopDir\*", "$pubDesktop\*") | ForEach-Object {
            Get-ChildItem $_ -Filter '*.lnk' -EA SilentlyContinue | Where-Object { $_.Name -match 'WEB|SUNSHINE|O-DIA|ZENOVA|AISTV|NGAT|VSCode|Code|Bandicam|Discord|Spotify|EVKey|Roblox|StarDesk|Chrome|Edge' } | Remove-Item -Force -EA SilentlyContinue
            Get-ChildItem $_ -Filter '*.url' -EA SilentlyContinue | Where-Object { $_.Name -match 'WEB|SUNSHINE|ZENOVA' } | Remove-Item -Force -EA SilentlyContinue
            Get-ChildItem $_ -Filter '*.bat' -EA SilentlyContinue | Where-Object { $_.Name -match 'NGAT|RDP' } | Remove-Item -Force -EA SilentlyContinue
          }
          $global:LASTEXITCODE = 0

      - name: 📦 Cài Đặt Siêu Tốc App & Sắp Xếp Desktop Chuẩn Hóa 100% (Không Trùng Lặp)
        timeout-minutes: 8
        shell: pwsh
        env:
          CHOCO_PKGS: ${{ inputs.choco_packages }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $pubDesk = 'C:\Users\Public\Desktop'
          $profDesk = "$env:PROFILE_PATH\Desktop"
          $locData = $env:LOCALAPPDATA
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)

          function Start-FastJob {
            param([scriptblock]$Block, [object[]]$ArgsList)
            if ($hasTJ) { return Start-ThreadJob -ScriptBlock $Block -ArgumentList $ArgsList }
            else { return Start-Job -ScriptBlock $Block -ArgumentList $ArgsList }
          }

          # 1. VS Code System Installer
          $j1 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            if (-not (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe')) {
              $p = Start-Process "$ic\VSCode.exe" -ArgumentList '/VERYSILENT','/NORESTART' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $p.WaitForExit(60000) }
            }
          }

          # 2. EVKey - Bộ gõ Tiếng Việt siêu nhẹ
          $j2 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            $ev = 'C:\ALB-Apps\EVKey'
            if (-not (Test-Path "$ev\EVKey64.exe")) {
              if (Test-Path "$ic\EVKey.zip") { & 7z x "$ic\EVKey.zip" "-o$ev" -y -mmt=on *> $null }
            }
          }

          # 3. Spotify
          $j3 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")) {
              $p = Start-Process "$ic\Spotify.exe" -ArgumentList '/silent' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $p.WaitForExit(60000) }
            }
          }

          # 4. Bandicam
          $j4 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            if ((-not (Test-Path 'C:\Program Files\Bandicam\bdcam.exe')) -and (-not (Test-Path 'C:\Program Files (x86)\Bandicam\bdcam.exe'))) {
              $p = Start-Process "$ic\bdcam.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $p.WaitForExit(60000) }
            }
          }

          # 5. StarDesk Remote Control
          $j5 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            if ((-not (Test-Path 'C:\Program Files\StarDesk\StarDesk.exe')) -and (-not (Test-Path 'C:\Program Files (x86)\StarDesk\StarDesk.exe'))) {
              $p = Start-Process "$ic\StarDesk.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $p.WaitForExit(60000) }
            }
          }

          # 6. DISCORD: FIX TRIỆT ĐỂ KHÔNG VÀO ĐƯỢC / CRASH TRÊN WINDOWS SERVER 2022 & 2025
          $j6 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            try {
              # Dừng các tiến trình Discord cũ đang kẹt
              Get-Process -Name Discord,Update -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Milliseconds 500

              # Đảm bảo dịch vụ Audio đang bật (Discord bắt buộc cần Audio Endpoint để khởi tạo)
              Start-Service -Name Audiosrv -ErrorAction SilentlyContinue

              # Cài đặt qua DiscordSetup.exe
              if (Test-Path "$ic\DiscordSetup.exe") {
                $p = Start-Process "$ic\DiscordSetup.exe" -ArgumentList '-s' -PassThru -NoNewWindow -EA SilentlyContinue
                if ($p) { $p.WaitForExit(65000) }
              }

              # Sau khi cài xong, Squirrel tự mở Discord nền headless, ta đóng lại để tránh treo tiến trình
              Start-Sleep -Seconds 3
              Get-Process -Name Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

              # Cấu hình sẵn settings.json chống crash đồ họa và tối ưu render trên Cloud Server
              $dcCfgDir = "$env:APPDATA\discord"
              New-Item -ItemType Directory -Force -Path $dcCfgDir | Out-Null
              $dcSettings = @{
                IS_MAXIMIZED = $false
                IS_MINIMIZED = $false
                WINDOW_BOUNDS = @{ x = 100; y = 100; width = 1280; height = 720 }
                BACKGROUND_COLOR = "#202225"
                enableHardwareAcceleration = $false
              }
              $dcSettings | ConvertTo-Json | Set-Content "$dcCfgDir\settings.json" -Encoding UTF8 -Force
            } catch {}
          }

          # 7. Roblox Player
          $j7 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            if (-not (Test-Path "$env:LOCALAPPDATA\Roblox\Versions")) {
              $p = Start-Process "$ic\Roblox.exe" -ArgumentList '-q','--no-ui' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $p.WaitForExit(70000) }
              Start-Sleep -Seconds 3
            }
          }

          $allJobs = @($j1, $j2, $j3, $j4, $j5, $j6, $j7)
          $null = Wait-Job -Job $allJobs -Timeout 110
          $allJobs | Remove-Job -Force -EA SilentlyContinue

          # Cài thêm gói choco nếu có
          if (-not [string]::IsNullOrWhiteSpace($env:CHOCO_PKGS)) {
            $pkgs = $env:CHOCO_PKGS -split '[,\s]+' | Where-Object { $_ }
            $pkgs | ForEach-Object { & choco install $_ -y --no-progress --limit-output 2>&1 | Out-Null }
          }

          # ══════════════════════════════════════════════════════════════════════════
          # SẮP XẾP LẠI TOÀN BỘ ỨNG DỤNG - LOẠI BỎ TRIỆT ĐỂ ICON TRÙNG LẶP
          # ══════════════════════════════════════════════════════════════════════════
          # Xóa sạch shortcut cũ trên cả 2 thư mục Desktop để chống trùng 100%
          @($pubDesk, $profDesk) | ForEach-Object {
            if (Test-Path $_) {
              Get-ChildItem -Path $_ -Filter '*.lnk' -EA SilentlyContinue | Where-Object { $_.Name -match 'Chrome|Edge|VSCode|Code|Discord|Spotify|Bandicam|Roblox|StarDesk|EVKey|ZENOVA|O-DIA' } | Remove-Item -Force -EA SilentlyContinue
              Get-ChildItem -Path $_ -Filter '*.url' -EA SilentlyContinue | Where-Object { $_.Name -match 'WEB|SUNSHINE' } | Remove-Item -Force -EA SilentlyContinue
              Get-ChildItem -Path $_ -Filter '*.bat' -EA SilentlyContinue | Where-Object { $_.Name -match 'NGAT' } | Remove-Item -Force -EA SilentlyContinue
            }
          }

          $ws = New-Object -ComObject WScript.Shell
          function Add-CleanIcon {
            param([string]$Name, [string]$Target, [string]$Args = '', [string]$WorkingDir = '', [string]$Icon = '')
            if (Test-Path $Target) {
              $lnk = $ws.CreateShortcut("$pubDesk\$Name.lnk")
              $lnk.TargetPath = $Target
              if ($Args) { $lnk.Arguments = $Args }
              if ($WorkingDir) { $lnk.WorkingDirectory = $WorkingDir } else { $lnk.WorkingDirectory = Split-Path $Target -Parent }
              if ($Icon) { $lnk.IconLocation = $Icon }
              $lnk.Save()
            }
          }

          # 1. Trình duyệt Google Chrome
          $chromePath = @('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($chromePath) { Add-CleanIcon 'Google Chrome' $chromePath }

          # 2. Trình duyệt Microsoft Edge
          $edgePath = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($edgePath) { Add-CleanIcon 'Microsoft Edge' $edgePath }

          # 3. Discord (Khởi chạy chuẩn qua Update.exe)
          $dcUpdate = "$locData\Discord\Update.exe"
          $dcExe = Get-ChildItem "$locData\Discord" -Filter 'Discord.exe' -Recurse -EA SilentlyContinue | Select-Object -First 1
          if (Test-Path $dcUpdate) {
            $dcIcon = if ($dcExe) { "$($dcExe.FullName),0" } else { '' }
            Add-CleanIcon 'Discord' $dcUpdate '--processStart Discord.exe' "$locData\Discord" $dcIcon
          } elseif ($dcExe) {
            Add-CleanIcon 'Discord' $dcExe.FullName '' $dcExe.DirectoryName
          }

          # 4. Visual Studio Code
          $vscodePath = @('C:\Program Files\Microsoft VS Code\Code.exe', "$locData\Programs\Microsoft VS Code\Code.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($vscodePath) { Add-CleanIcon 'VS Code' $vscodePath }

          # 5. Spotify
          $spotifyPath = "$locData\Spotify\Spotify.exe"
          if (Test-Path $spotifyPath) { Add-CleanIcon 'Spotify' $spotifyPath }

          # 6. Bandicam
          $bdcamPath = @('C:\Program Files\Bandicam\bdcam.exe','C:\Program Files (x86)\Bandicam\bdcam.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($bdcamPath) { Add-CleanIcon 'Bandicam' $bdcamPath }

          # 7. Roblox Player
          $rbApp = Get-ChildItem "$locData\Roblox\Versions" -Filter 'RobloxPlayerBeta.exe' -Recurse -EA SilentlyContinue | Select-Object -First 1
          if ($rbApp) { Add-CleanIcon 'Roblox Player' $rbApp.FullName }

          # 8. StarDesk Remote Desktop
          $sdPath = @('C:\Program Files\StarDesk\StarDesk.exe','C:\Program Files (x86)\StarDesk\StarDesk.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($sdPath) { Add-CleanIcon 'StarDesk' $sdPath }

          # 9. EVKey Tiếng Việt (Tạo shortcut Desktop + Khởi động cùng Windows)
          $evExe = 'C:\ALB-Apps\EVKey\EVKey64.exe'
          if (Test-Path $evExe) {
            Add-CleanIcon 'EVKey Tiếng Việt' $evExe
            $startupAll = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup'
            $evStart = $ws.CreateShortcut("$startupAll\EVKey.lnk")
            $evStart.TargetPath = $evExe
            $evStart.WorkingDirectory = 'C:\ALB-Apps\EVKey'
            $evStart.Save()
          }

          # 10. Shortcut Ổ đĩa ZENOVA-OS
          $driveLnk = $ws.CreateShortcut("$pubDesk\ZENOVA-OS ($($env:MOUNT_LETTER)).lnk")
          $driveLnk.TargetPath = "$($env:MOUNT_LETTER):\"
          $driveLnk.Save()

          # 11. Shortcut Web Quản Lý RDP & Sunshine
          $webUrl = $ws.CreateShortcut("$pubDesk\Web Quản Lý RDP.url")
          $webUrl.TargetPath = "http://127.0.0.1:$($env:WEB_PORT)/"
          $webUrl.Save()

          $sunUrl = $ws.CreateShortcut("$pubDesk\Sunshine Web UI.url")
          $sunUrl.TargetPath = "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"
          $sunUrl.Save()

          # 12. Script ngắt RDP giữ màn hình cho Sunshine / StarDesk
          Set-Content -Path "$pubDesk\Ngắt RDP Giữ Màn Hình.bat" -Value "@echo off`r`nfor /f `"tokens=3-4`" %%a in ('query session %USERNAME%') do @if `"%%b`"==`"Active`" tscon %%a /dest:console" -Encoding ASCII -Force

          Write-Host "✅ Đã sắp xếp lại toàn bộ Desktop gọn gàng, loại bỏ 100% ứng dụng trùng!" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🌐 Web Quản Lý RDP & Sunshine (Port 8080) + Full REST API
        shell: pwsh
        timeout-minutes: 3
        run: |
          $port = $env:WEB_PORT
          $htmlCode = @'
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ZENOVA CLOUD - CONTROL PANEL v70</title>
            <style>
              :root {
                --bg: #0b0f19;
                --card-bg: #151d30;
                --border: #233152;
                --accent: #ec4899;
                --accent-glow: rgba(236, 72, 153, 0.3);
                --cyan: #06b6d4;
                --green: #10b981;
                --yellow: #f59e0b;
                --text: #f1f5f9;
                --text-dim: #94a3b8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
              body { background: var(--bg); color: var(--text); padding: 24px; display: flex; justify-content: center; min-height: 100vh; }
              .container { max-width: 680px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
              .header { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
              .brand { display: flex; align-items: center; gap: 14px; }
              .logo-icon { font-size: 32px; filter: drop-shadow(0 0 10px var(--accent-glow)); }
              .title { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
              .title span { color: var(--accent); }
              .subtitle { font-size: 13px; color: var(--text-dim); }
              .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--green); color: var(--green); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
              .pulse { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); animation: pulseAnim 1.5s infinite; }
              @keyframes pulseAnim { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
              .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
              .card-title { font-size: 15px; font-weight: 600; color: var(--cyan); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
              .grid-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
              .info-item { background: rgba(11, 15, 25, 0.6); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
              .info-label { font-size: 12px; color: var(--text-dim); }
              .info-value { font-size: 14px; font-weight: 600; color: #fff; word-break: break-all; display: flex; justify-content: space-between; align-items: center; }
              .copy-btn { background: none; border: none; color: var(--cyan); cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; transition: 0.2s; }
              .copy-btn:hover { background: rgba(6, 182, 212, 0.2); }
              .sunshine-box { background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(236, 72, 153, 0.1)); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 14px; padding: 16px; margin-top: 10px; }
              .sunshine-btn { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; padding: 14px; background: linear-gradient(90deg, #f59e0b, #ec4899); color: white; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4); transition: transform 0.2s, box-shadow 0.2s; }
              .sunshine-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6); }
              .sunshine-hint { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.5; }
              .sunshine-hint b { color: #f59e0b; }
              .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
              .action-btn { width: 100%; padding: 14px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: white; transition: 0.2s; }
              .btn-save { background: #0284c7; } .btn-save:hover { background: #0369a1; }
              .btn-restart { background: #d97706; } .btn-restart:hover { background: #b45309; }
              .btn-stop { background: #dc2626; } .btn-stop:hover { background: #b91c1c; }
              .footer-note { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 8px; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="header">
                <div class="brand">
                  <div class="logo-icon">🌸</div>
                  <div>
                    <div class="title">ZENOVA <span>CLOUD v70</span></div>
                    <div class="subtitle">Bảng Quản Lý RDP, Sunshine & Lưu Ổ Đĩa Tối Thượng</div>
                  </div>
                </div>
                <div class="status-badge">
                  <div class="pulse"></div> ĐANG HOẠT ĐỘNG
                </div>
              </div>

              <div class="card">
                <div class="card-title">🖥️ Thông Tin Máy & Kết Nối</div>
                <div class="grid-info">
                  <div class="info-item">
                    <div class="info-label">🏷️ Tên Định Danh Máy</div>
                    <div class="info-value"><span>{{MACHINE_ID}}</span></div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">⏳ Thời Gian Còn Lại</div>
                    <div class="info-value"><span id="remain-timer" style="color: #4ade80;">{{REMAIN_TEXT}}</span></div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">🌐 IP Tailscale (P2P)</div>
                    <div class="info-value">
                      <span>{{TAILSCALE_IP}}</span>
                      <button class="copy-btn" onclick="navigator.clipboard.writeText('{{TAILSCALE_IP}}')">Sao chép</button>
                    </div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">🦆 Tên Miền DuckDNS</div>
                    <div class="info-value"><span>{{DUCKDNS_URL}}</span></div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">👤 Tài Khoản RDP & Sunshine</div>
                    <div class="info-value">
                      <span>{{RDP_USER}}</span>
                      <button class="copy-btn" onclick="navigator.clipboard.writeText('{{RDP_USER}}')">Sao chép</button>
                    </div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">🔐 Mật Khẩu Đăng Nhập</div>
                    <div class="info-value">
                      <span style="color: #facc15;">{{RDP_PASS}}</span>
                      <button class="copy-btn" onclick="navigator.clipboard.writeText('{{RDP_PASS}}')">Sao chép</button>
                    </div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">⚡ Vi Xử Lý (CPU)</div>
                    <div class="info-value"><span>{{CPU_INFO}}</span></div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">💽 Ổ Đĩa ZENOVA-OS ({{MOUNT_LETTER}}:)</div>
                    <div class="info-value"><span>Đã dùng: {{DISK_USED}} GB / Còn trống: {{DISK_FREE}} GB</span></div>
                  </div>
                </div>

                <div class="sunshine-box">
                  <a href="https://{{TAILSCALE_IP}}:{{SUNSHINE_PORT}}/" target="_blank" class="sunshine-btn">
                    ☀️ Mở Sunshine Web UI (Port {{SUNSHINE_PORT}}) ➔
                  </a>
                  <div class="sunshine-hint">
                    💡 <b>Hướng dẫn kết nối Sunshine:</b> Trình duyệt sẽ hiện cảnh báo chứng chỉ SSL tự ký (Not Secure). Hãy nhấn <b>Nâng cao (Advanced)</b> ➔ <b>Tiếp tục truy cập (Proceed)</b>. Đăng nhập bằng tài khoản <code>{{RDP_USER}}</code> hoặc <code>admin</code> và mật khẩu: <code>{{RDP_PASS}}</code>.
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-title">⚙️ Điều Khiển & Lưu Dữ Liệu</div>
                <div class="btn-group">
                  <form action="/save" method="POST">
                    <button type="submit" class="action-btn btn-save">
                      <span>💾 Lưu Dữ Liệu Ngay Lập Tức</span>
                      <span>(Không ngắt máy) ➔</span>
                    </button>
                  </form>
                  <form action="/restart" method="POST">
                    <button type="submit" class="action-btn btn-restart">
                      <span>🔁 Lưu Toàn Bộ & Khởi Động Phiên Mới</span>
                      <span>(Treo 24/24) ➔</span>
                    </button>
                  </form>
                  <form action="/stop" method="POST">
                    <button type="submit" class="action-btn btn-stop">
                      <span>🛑 Lưu Dữ Liệu & Tắt Hẳn Server</span>
                      <span>(An toàn 100%) ➔</span>
                    </button>
                  </form>
                </div>
                <div class="footer-note">💡 Hãy dùng các nút trên để tắt hoặc khởi động lại máy để đảm bảo toàn bộ dữ liệu ổ đĩa được nén và đẩy lên GitHub an toàn!</div>
              </div>
            </div>
          </body>
          </html>
'@
          # Thay thế các biến ban đầu vào template
          $tsIpVal = if ($env:TAILSCALE_IP) { $env:TAILSCALE_IP } else { '127.0.0.1' }
          $ddnsVal = if ($env:DUCKDNS_URL) { $env:DUCKDNS_URL } else { 'Chưa cấu hình' }
          $htmlCode = $htmlCode.Replace('{{MACHINE_ID}}', "$env:MACHINE_ID")
          $htmlCode = $htmlCode.Replace('{{TAILSCALE_IP}}', $tsIpVal)
          $htmlCode = $htmlCode.Replace('{{DUCKDNS_URL}}', $ddnsVal)
          $htmlCode = $htmlCode.Replace('{{RDP_USER}}', "$env:RDP_USER")
          $htmlCode = $htmlCode.Replace('{{RDP_PASS}}', "$env:RDP_PASS")
          $htmlCode = $htmlCode.Replace('{{SUNSHINE_PORT}}', "$env:SUNSHINE_WEB_PORT")
          $htmlCode = $htmlCode.Replace('{{CPU_INFO}}', "$env:CPU_MODEL_INFO")
          $htmlCode = $htmlCode.Replace('{{MOUNT_LETTER}}', "$env:MOUNT_LETTER")
          Set-Content -Path "$env:RUNNER_TEMP\panel.html" -Value $htmlCode -Encoding UTF8

          # Server HTTP backend trong PowerShell hỗ trợ REST API (/api/info, /api/cmd) & Dashboard
          $serverScript = @'
          $ErrorActionPreference = "Continue"
          $port = $env:WEB_PORT
          if (-not $port) { $port = 8080 }
          $listener = [System.Net.HttpListener]::new()
          $listener.Prefixes.Add("http://+:" + $port + "/")
          $listener.Start()

          $startEpoch = [long]$env:JOB_START_EPOCH
          $totalMinutes = [long]$env:TOTAL_MINUTES
          $endEpoch = $startEpoch + ($totalMinutes * 60)
          $machineId = $env:MACHINE_ID
          $tsIp = if ($env:TAILSCALE_IP) { $env:TAILSCALE_IP } else { '127.0.0.1' }
          $user = $env:RDP_USER
          $pass = $env:RDP_PASS
          $sunPort = $env:SUNSHINE_WEB_PORT
          $ddns = $env:DUCKDNS_URL
          $mountLetter = $env:MOUNT_LETTER

          while ($listener.IsListening) {
            try {
              $ctx = $listener.GetContext()
              $req = $ctx.Request
              $resp = $ctx.Response
              $urlPath = $req.Url.AbsolutePath.ToLower()

              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              $remainSec = [math]::Max(0, $endEpoch - $now)
              $h = [math]::Floor($remainSec / 3600)
              $m = [math]::Floor(($remainSec % 3600) / 60)
              $s = $remainSec % 60
              $remainText = "${h}h ${m}m ${s}s"

              $diskUsed = 0; $diskFree = 0
              try {
                $dObj = Get-PSDrive -Name $mountLetter -ErrorAction SilentlyContinue
                if ($dObj) {
                  $diskUsed = [math]::Round($dObj.Used / 1GB, 1)
                  $diskFree = [math]::Round($dObj.Free / 1GB, 1)
                }
              } catch {}

              $apps = @()
              @('sunshine', 'StarDesk', 'Discord', 'chrome', 'Spotify', 'Code', 'bdcam') | ForEach-Object {
                if (Get-Process -Name $_ -ErrorAction SilentlyContinue) { $apps += $_ }
              }

              if ($urlPath -eq '/api/info') {
                $info = [ordered]@{
                  ok = $true
                  machineId = $machineId
                  tailscaleIp = $tsIp
                  duckdnsUrl = $ddns
                  webPort = $port
                  sunshinePort = $sunPort
                  user = $user
                  password = $pass
                  remainSeconds = $remainSec
                  remainText = $remainText
                  diskUsedGb = $diskUsed
                  diskFreeGb = $diskFree
                  activeApps = $apps
                }
                $buf = [System.Text.Encoding]::UTF8.GetBytes(($info | ConvertTo-Json -Depth 5))
                $resp.ContentType = "application/json; charset=utf-8"
                $resp.ContentLength64 = $buf.Length
                $resp.OutputStream.Write($buf, 0, $buf.Length)
              }
              elseif ($urlPath -eq '/api/cmd' -and $req.HttpMethod -eq 'POST') {
                $reader = [System.IO.StreamReader]::new($req.InputStream, [System.Text.Encoding]::UTF8)
                $bodyStr = $reader.ReadToEnd()
                $reader.Close()
                $cmdObj = $null
                try { $cmdObj = $bodyStr | ConvertFrom-Json } catch {}
                $c = if ($cmdObj -and $cmdObj.cmd) { $cmdObj.cmd.ToLower() } else { '' }
                $text = if ($cmdObj -and $cmdObj.text) { $cmdObj.text } else { '' }

                if ($c -eq 'save') { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value 'SAVE_NOW' -Force }
                elseif ($c -eq 'restart') { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value 'RESTART_SESSION' -Force }
                elseif ($c -eq 'stop') { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value 'STOP_SESSION' -Force }
                elseif ($c -eq 'pass' -and $text) {
                  & net user $user "$text" *> $null
                  $env:RDP_PASS = $text
                }
                elseif ($c -eq 'msg' -and $text) {
                  & msg * "$text" *> $null
                }

                $respObj = @{ ok = $true; cmd = $c; pong = ($c -eq 'ping') }
                $buf = [System.Text.Encoding]::UTF8.GetBytes(($respObj | ConvertTo-Json))
                $resp.ContentType = "application/json; charset=utf-8"
                $resp.ContentLength64 = $buf.Length
                $resp.OutputStream.Write($buf, 0, $buf.Length)
              }
              elseif ($req.HttpMethod -eq 'POST') {
                if ($urlPath -eq '/save') { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value 'SAVE_NOW' -Force }
                elseif ($urlPath -eq '/restart') { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value 'RESTART_SESSION' -Force }
                elseif ($urlPath -eq '/stop') { Set-Content -Path $env:CONTROL_SIGNAL_FILE -Value 'STOP_SESSION' -Force }
                $resp.Redirect('/')
              }
              else {
                $html = Get-Content -Raw -Path "$env:RUNNER_TEMP\panel.html" -Encoding UTF8
                $html = $html.Replace('{{REMAIN_TEXT}}', $remainText)
                $html = $html.Replace('{{DISK_USED}}', "$diskUsed")
                $html = $html.Replace('{{DISK_FREE}}', "$diskFree")
                $buf = [System.Text.Encoding]::UTF8.GetBytes($html)
                $resp.ContentType = "text/html; charset=utf-8"
                $resp.ContentLength64 = $buf.Length
                $resp.OutputStream.Write($buf, 0, $buf.Length)
              }
              $resp.OutputStream.Close()
            } catch {}
          }
'@
          Set-Content -Path "$env:RUNNER_TEMP\web.ps1" -Value $serverScript -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile','-WindowStyle','Hidden','-File',"`"$env:RUNNER_TEMP\web.ps1`""
          Start-Sleep -Seconds 2

          # Tự động gửi báo cáo trạng thái đến Webhook Bot nếu được chỉ định
          if ($env:BOT_WEBHOOK_URL) {
            try {
              $payload = [ordered]@{
                machineId    = "$env:MACHINE_ID"
                status       = 'ready'
                ip           = $tsIpVal
                webPort      = "$port"
                sunshinePort = "$env:SUNSHINE_WEB_PORT"
                user         = "$env:RDP_USER"
                pass         = "$env:RDP_PASS"
                runId        = "$env:GITHUB_RUN_ID"
                windowsImage = "$env:ImageOS"
                driveLetter  = "$env:MOUNT_LETTER"
                duckdnsDomain= "$env:DUCKDNS_URL"
                timestampUtc = (Get-Date).ToUniversalTime().ToString('o')
              }
              $jsonBody = $payload | ConvertTo-Json -Depth 5 -Compress
              Invoke-RestMethod -Uri $env:BOT_WEBHOOK_URL -Method Post -Body $jsonBody -ContentType 'application/json; charset=utf-8' -Headers @{ 'x-bot-secret' = "$env:BOT_API_SECRET" } -TimeoutSec 6 | Out-Null
            } catch {}
          }

          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host " 🌐 WEB QUẢN LÝ RDP: http://${tsIpVal}:$port/" -ForegroundColor Yellow
          Write-Host " ☀️ SUNSHINE GAMING: https://${tsIpVal}:$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🎉 Thông Tin Kết Nối & Cấu Hình
        shell: pwsh
        timeout-minutes: 2
        if: always()
        run: |
          $tsIp = if ($env:TAILSCALE_IP) { $env:TAILSCALE_IP } else { '127.0.0.1' }
          $hostStr = if ($env:DUCKDNS_URL) { $env:DUCKDNS_URL } else { $tsIp }
          $summary = @(
            "# 🌸 ZENOVA CLOUD SUPREME v70 TỐI THƯỢNG",
            "",
            "| Mục cấu hình | Chi tiết kết nối |",
            "|:---|:---|",
            "| 🏷️ Định danh máy | **$($env:MACHINE_ID)** |",
            "| 🖥️ RDP Host | `${hostStr}:3389` |",
            "| 👤 Tài khoản User | `$($env:RDP_USER)` |",
            "| 🔐 Mật khẩu RDP & Sunshine | `$($env:RDP_PASS)` |",
            "| 🌐 Web Quản Lý (Panel) | [http://${tsIp}:$($env:WEB_PORT)/](http://${tsIp}:$($env:WEB_PORT)/) |",
            "| ☀️ Sunshine Gamestream | [https://${tsIp}:$($env:SUNSHINE_WEB_PORT)/](https://${tsIp}:$($env:SUNSHINE_WEB_PORT)/) |",
            "| 💽 Ổ Đĩa ZENOVA-OS | `$($env:MOUNT_LETTER):\` |",
            "| 🖼️ Hình Nền Zenova | $($env:WALLPAPER_STATUS) |"
          )
          $summary | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }
          $global:LASTEXITCODE = 0

      - name: ⏳ Watchdog & Giữ Kết Nối (Sunshine / Audio / Tự Phục Hồi)
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        run: |
          function Test-Port {
            param($P)
            try {
              $t = [System.Net.Sockets.TcpClient]::new()
              $a = $t.ConnectAsync('127.0.0.1', $P)
              $ok = $a.Wait(1500)
              $t.Close()
              return $ok
            } catch { return $false }
          }

          $sunExe = 'C:\Program Files\Sunshine\sunshine.exe'
          $sunDir = 'C:\Program Files\Sunshine'
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + ([long]$env:TOTAL_MINUTES * 60)
          $sig = $env:CONTROL_SIGNAL_FILE

          while ($true) {
            # 1. Kiểm tra tín hiệu từ Web Panel
            if (Test-Path $sig) {
              $c = (Get-Content -Raw $sig).Trim()
              Remove-Item $sig -Force -EA SilentlyContinue
              if ($c -eq 'SAVE_NOW') {
                Write-Host "💾 Nhận lệnh lưu từ Web Panel, đang đóng gói dữ liệu..." -ForegroundColor Cyan
                & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'manual'
              }
              elseif ($c -eq 'RESTART_SESSION') {
                Write-Host "🔁 Nhận lệnh khởi động lại từ Web Panel..." -ForegroundColor Yellow
                'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV
                break
              }
              elseif ($c -eq 'STOP_SESSION') {
                Write-Host "🛑 Nhận lệnh tắt máy từ Web Panel..." -ForegroundColor Red
                'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV
                break
              }
            }

            # 2. Kiểm tra hết thời gian phiên
            if ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() -ge $end) { break }

            # 3. Tự phục hồi Sunshine nếu bị tắt hoặc đứt kết nối
            if (-not (Test-Port 47990)) {
              if (Test-Path $sunExe) {
                if (-not (Get-Process sunshine -ErrorAction SilentlyContinue)) {
                  Start-Process -FilePath $sunExe -WorkingDirectory $sunDir -WindowStyle Hidden
                }
              }
            }

            # 4. Giữ dịch vụ Audio luôn bật
            $aud = Get-Service Audiosrv -ErrorAction SilentlyContinue
            if ($aud -and ($aud.Status -ne 'Running')) {
              Start-Service Audiosrv -ErrorAction SilentlyContinue
            }

            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Lưu Cuối Phiên Lên GitHub Release
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          try {
            Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue
            & taskkill.exe /F /IM 'StarDesk*' /T *> $null
            & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'session-end'
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🔁 Kích Hoạt Phiên Tiếp Theo & Treo Máy 24/24
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          BOT_URL: ${{ inputs.bot_webhook_url }}
        run: |
          $wf = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0])
          $optStr = ("$env:OPT").ToLower()
          Write-Host "🔁 Đang kích hoạt phiên mới cho máy [$env:MACHINE_ID] trên file workflow: $wf..." -ForegroundColor Cyan
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" `
            -f "machine_id=$env:MACHINE_ID" `
            -f "duration=$env:DURATION" `
            -f "auto_restart=true" `
            -f "drive_letter=$env:MOUNT_LETTER" `
            -f "vhd_size_gb=$env:VHD_SIZE_GB" `
            -f "windows_image=$env:WIN_IMAGE" `
            -f "fixed_password=$env:FIXED_PASS" `
            -f "vdd_resolution=$env:VDD_RES" `
            -f "choco_packages=$env:PKGS" `
            -f "optimize_windows=$optStr" `
            -f "bot_webhook_url=$env:BOT_URL"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Đã kích hoạt phiên tiếp theo thành công (Treo 24/24 liên tục)!" -ForegroundColor Green
          } else {
            Write-Host "⚠️ Kích hoạt phiên tiếp theo có thể cần cấp quyền workflow write." -ForegroundColor Yellow
          }
          $global:LASTEXITCODE = 0
