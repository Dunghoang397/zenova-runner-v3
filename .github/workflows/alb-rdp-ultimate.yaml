# ═══════════════════════════════════════════════════════════════
# ALB-VPSFREE-ULTIMATE v32.0 — TURBO EDITION
# - TỐI ƯU TOÀN DIỆN: ~2-3 phút thay vì ~15 phút
# - VDD+Audio+Sunshine: chỉ extract file cần, bỏ pnputil scan, bỏ restart service
# - Restore ổ đĩa: tải song song + 7z -mx=0 -mmt=4
# - Cài app: 7 job song song, không chờ
# - Tailscale: cache MSI, auth song song
# - FIX: GPU registry, Test-Port, Web Panel here-string
# ═══════════════════════════════════════════════════════════════
name: ALB-VPSFREE-ULTIMATE v32.0

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy & bản lưu riêng'
        required: false
        default: 'may-phu-1'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h00m'
        type: choice
        options: ['1h', '3h', '5h00m']
      auto_restart:
        description: '🔁 Tự khởi động phiên mới'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng VHDX (GB) — tối đa 100000GB = 100TB'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu cố định RDP & Sunshine'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      wallpaper_url:
        description: '🖼️ Link ảnh nền (bỏ trống = dùng link catbox)'
        required: false
        default: 'https://files.catbox.moe/qwnvpw.png'
        type: string
      choco_packages:
        description: '📦 App cài thêm bằng choco'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Fix lag + mở khóa 100% CPU'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Bật Tailscale Funnel'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'

    steps:
      - name: 🧱 Dựng ổ đĩa riêng & kho lưu (TURBO)
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $startTime = Get-Date
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV"

          $vhdSizeInput = [int64]($env:VHD_SIZE_GB -replace '[^0-9]','')
          if ($vhdSizeInput -lt 10) { $vhdSizeInput = 45 }
          if ($vhdSizeInput -gt 100000) {
              Write-Host "❌ VHD_SIZE_GB=$vhdSizeInput vượt 100TB. Workflow bị chặn." -ForegroundColor Red
              exit 1
          }
          "VHD_SIZE_GB_VALIDATED=$vhdSizeInput" >> "$env:GITHUB_ENV"

          $cleanId = (($env:MACHINE_ID).Trim().ToLower() -replace '[^a-z0-9\-]','-') -replace '\-+','-' -replace '^\-|\-$',''
          if ([string]::IsNullOrWhiteSpace($cleanId)) { $cleanId = 'may-phu-1' }
          $relTag = "alb-storage-$cleanId"; $stateBranch = "alb-state-$cleanId"
          $null = gh release view $relTag --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
              $null = gh release view "aistv-storage-$cleanId" --repo $env:GH_REPO 2>&1
              if ($LASTEXITCODE -eq 0) { $relTag = "aistv-storage-$cleanId"; $stateBranch = "aistv-state-$cleanId" }
          }
          "MACHINE_ID=$cleanId"       >> "$env:GITHUB_ENV"
          "RELEASE_TAG=$relTag"       >> "$env:GITHUB_ENV"
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV"

          $total = 300; $display = '5 giờ 00 phút'
          if ($env:INPUT_DURATION -eq '1h') { $total = 60; $display = '1 giờ' }
          elseif ($env:INPUT_DURATION -eq '3h') { $total = 180; $display = '3 giờ' }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV"
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV"

          $user = $env:USERNAME; $profPath = $env:USERPROFILE
          "RDP_USER=$user"       >> "$env:GITHUB_ENV"
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV"

          $dl = (($env:DRIVE_LETTER).Trim() -replace '[^A-Za-z]','').ToUpper()
          if (-not $dl -or $dl -in @('C','D')) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV"

          $vhdContainer = 'C:\ALB-VHD-HOST'
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile = "$vhdContainer\alb-os-disk.vhdx"
          $sizeBytes = $vhdSizeInput * 1GB
          $mounted = $false
          try {
              if (-not (Test-Path $vhdFile)) {
                  New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                    Mount-VHD -PassThru |
                    Initialize-Disk -PartitionStyle GPT -PassThru |
                    New-Partition -DriveLetter $dl -UseMaximumSize |
                    Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ALB-OS' -Confirm:$false | Out-Null
              } else { Mount-VHD -Path $vhdFile }
              $null = Get-PSDrive -Name $dl -ErrorAction Stop
              if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {}
          if (-not $mounted) {
              $fallbackDir = "$vhdContainer\VIRTUAL-DRIVE-ROOT"
              New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
              & subst "${dl}:" $fallbackDir
              $null = New-PSDrive -Name $dl -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue
          }

          $sharedRoot       = "${dl}:\ALB-SYSTEM"
          $sharedSessionDir = "$sharedRoot\sessions"
          $sharedDataDir    = "$sharedRoot\DATA"
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY"
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json"
          $profileStoreRoot = "$sharedRoot\Users"
          $baselineFile     = "$env:RUNNER_TEMP\baseline-c-dirs.json"
          $controlSignal    = "$env:RUNNER_TEMP\alb-control-action.txt"

          @($sharedRoot,$sharedSessionDir,$sharedDataDir,$sharedOsDir,$profileStoreRoot,"${dl}:\Apps") |
            ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }

          $baseline = @{
              PF64 = @(Get-ChildItem 'C:\Program Files'      -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              PD   = @(Get-ChildItem 'C:\ProgramData'         -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
          }
          $baseline | ConvertTo-Json -Depth 4 | Set-Content $baselineFile -Encoding UTF8

          "VHD_CONTAINER=$vhdContainer"       >> "$env:GITHUB_ENV"
          "VHD_FILE=$vhdFile"                 >> "$env:GITHUB_ENV"
          "SHARED_ROOT=$sharedRoot"           >> "$env:GITHUB_ENV"
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV"
          "SHARED_DATA_DIR=$sharedDataDir"    >> "$env:GITHUB_ENV"
          "SHARED_OS_DIR=$sharedOsDir"        >> "$env:GITHUB_ENV"
          "SHARED_STATE_FILE=$sharedStateFile" >> "$env:GITHUB_ENV"
          "PROFILE_ROOT=$profileStoreRoot"    >> "$env:GITHUB_ENV"
          "BASELINE_FILE=$baselineFile"       >> "$env:GITHUB_ENV"
          "CONTROL_SIGNAL_FILE=$controlSignal" >> "$env:GITHUB_ENV"

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild
          "OS_BUILD=$build" >> "$env:GITHUB_ENV"

          $null = gh release view $relTag --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
              $dummy = "$env:RUNNER_TEMP\init.txt"
              Set-Content $dummy -Value "ALB Storage Init for $cleanId" -Encoding UTF8
              gh release create $relTag $dummy --repo $env:GH_REPO --title "ALB Storage ($cleanId)" --notes "Kho lưu tự động [$cleanId] — tối đa 100TB"
          }
          $global:LASTEXITCODE = 0
          Write-Host "✅ Ổ ${dl}:\ | Máy: $cleanId | Size: ${vhdSizeInput}GB | $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green

      - name: 🧰 Tạo save-data.ps1 (7Z TURBO)
        shell: pwsh
        run: |
          $scriptLines = @(
            'param([string]$Reason = "session-end")'
            '$ErrorActionPreference = "Continue"'
            'if ("$env:DATA_RESTORED" -ne "1") { exit 0 }'
            '$root = "$env:SHARED_ROOT"; $osDir = "$env:SHARED_OS_DIR"; $dl = "$env:MOUNT_LETTER"'
            'if ((-not $root) -or (-not (Test-Path $root))) { exit 0 }'
            'try { $drive = Get-PSDrive -Name $dl -ErrorAction Stop; $freeGB = [math]::Round($drive.Free/1GB,2); if ($freeGB -lt 2) { exit 1 } } catch {}'
            '$appsToClose = @("chrome","msedge","brave","firefox","coccoc","opera","discord","Telegram","Zalo","steam","EpicGamesLauncher","Spotify","Code","StarDesk","EVKey","EVKey64","bdcam","RobloxPlayerBeta","RobloxStudioBeta")'
            'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow() }; Start-Sleep -Seconds 2'
            'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue'
            'if ($Reason -eq "session-end") { Get-Service -Name "*StarDesk*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue; Get-Process -Name "StarDesk*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; & taskkill.exe /F /IM "StarDesk*" /T *> $null }'
            'Start-Sleep -Seconds 1'
            '$u = "$env:RDP_USER"; $profSrc = "$env:PROFILE_PATH"'
            '$regBk = [System.IO.Path]::Combine($osDir,"Registry"); New-Item -ItemType Directory -Force -Path $regBk | Out-Null'
            'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null'
            'reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x86.reg" /y *> $null'
            'reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null'
            'reg export "HKCU\Environment" "$regBk\User-Env.reg" /y *> $null'
            'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" "$regBk\User-StartupRun.reg" /y *> $null'
            'reg export "HKCU\Control Panel\Desktop" "$regBk\User-Desktop.reg" /y *> $null'
            'if ($u -and $profSrc -and (Test-Path $profSrc)) { $profDst = [System.IO.Path]::Combine($root,"Users",$u); New-Item -ItemType Directory -Force -Path $profDst | Out-Null; $excludeDirs = @("$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages","$profSrc\AppData\Local\Microsoft\Windows\INetCache","$profSrc\AppData\Local\Microsoft\Windows\WebCache"); robocopy $profSrc $profDst /MIR /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP /XD @excludeDirs *> $null; $global:LASTEXITCODE = 0 }'
            'if ($env:BASELINE_FILE -and (Test-Path $env:BASELINE_FILE)) { try { $base = Get-Content -Raw $env:BASELINE_FILE | ConvertFrom-Json; $skip = @("Tailscale","chocolatey","Package Cache","Microsoft","Windows Defender"); $cOverlay = [System.IO.Path]::Combine($osDir,"C-Drive-Overlay"); New-Item -ItemType Directory -Force -Path "$cOverlay\PF64","$cOverlay\PF86","$cOverlay\PD" | Out-Null; Get-ChildItem "C:\Program Files" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin $base.PF64 -and $_.Name -notin $skip } | ForEach-Object { robocopy $_.FullName "$cOverlay\PF64\$($_.Name)" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }; Get-ChildItem "C:\Program Files (x86)" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin $base.PF86 -and $_.Name -notin $skip } | ForEach-Object { robocopy $_.FullName "$cOverlay\PF86\$($_.Name)" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }; Get-ChildItem "C:\ProgramData" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin $base.PD -and $_.Name -notin $skip } | ForEach-Object { robocopy $_.FullName "$cOverlay\PD\$($_.Name)" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null } } catch {} }'
            '$sdBk = [System.IO.Path]::Combine($osDir,"StarDesk-Backup"); New-Item -ItemType Directory -Force -Path $sdBk | Out-Null'
            'if (Test-Path "C:\Program Files\StarDesk") { robocopy "C:\Program Files\StarDesk" "$sdBk\ProgramFiles" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
            'if (Test-Path "C:\ProgramData\StarDesk") { robocopy "C:\ProgramData\StarDesk" "$sdBk\ProgramData" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
            '$evKeyDir = [System.IO.Path]::Combine($osDir,"EVKey"); New-Item -ItemType Directory -Force -Path $evKeyDir | Out-Null; if (Test-Path "C:\ALB-Apps\EVKey") { robocopy "C:\ALB-Apps\EVKey" $evKeyDir /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }'
            '$sunPortableDir = [System.IO.Path]::Combine($osDir,"Sunshine-Portable")'
            'if (Test-Path "C:\Program Files\Sunshine") { if (Test-Path $sunPortableDir) { Remove-Item $sunPortableDir -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path $sunPortableDir | Out-Null; robocopy "C:\Program Files\Sunshine" $sunPortableDir /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF "*.log" *> $null; $global:LASTEXITCODE = 0 }'
            '$packDir = "$env:RUNNER_TEMP\alb-pack-$Reason"; if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }; New-Item -ItemType Directory -Force -Path $packDir | Out-Null'
            '$archiveBase = "$packDir\alb-drive.7z"; Push-Location $root; & 7z a -t7z -mx=0 -mmt=4 -ssw -v1900m $archiveBase * -xr!Pagefile.sys -xr!swapfile.sys -xr!"System Volume Information" *> $null; Pop-Location'
            '$chunks = @(Get-ChildItem $packDir -Filter "alb-drive.7z.*" | Sort-Object Name); if ($chunks.Count -eq 0) { exit 1 }'
            '$manifest = [ordered]@{ machineId=$env:MACHINE_ID; updatedUtc=(Get-Date).ToUniversalTime().ToString("o"); reason=$Reason; osBuild=$env:OS_BUILD; chunkCount=$chunks.Count; chunks=@($chunks | ForEach-Object { [ordered]@{ name=$_.Name; size=$_.Length } }) }'
            '$manifestPath = "$packDir\drive-manifest.json"; $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding UTF8'
            '$uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @($manifestPath); $uploadOk = $false'
            'for ($i=1;$i-le 3;$i++) { $ghArgs = @("release","upload",$env:RELEASE_TAG)+$uploadFiles+@("--repo",$env:GH_REPO,"--clobber"); & gh @ghArgs; if ($LASTEXITCODE -eq 0) { $uploadOk=$true; break }; Start-Sleep ($3*$i) }'
            'if (-not $uploadOk) { Write-Host "Upload that bai" -ForegroundColor Red; exit 1 }'
            'Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue; Write-Host "[$Reason] Da luu o dia [$env:MACHINE_ID]!" -ForegroundColor Green; exit 0'
          )
          $saveScriptPath = "$env:RUNNER_TEMP\save-data.ps1"
          Set-Content $saveScriptPath -Value ($scriptLines -join "`r`n") -Encoding UTF8

      - name: ♻️ Khôi phục ổ đĩa & Profile (TURBO)
        shell: pwsh
        run: |
          $startTime = Get-Date
          $dl = $env:MOUNT_LETTER
          @('HKLM:\SOFTWARE\Policies\Google\Chrome','HKLM:\SOFTWARE\Policies\Microsoft\Edge','HKLM:\SOFTWARE\Policies\BraveSoftware\Brave','HKLM:\SOFTWARE\Policies\CocCoc\Browser') |
            ForEach-Object { New-Item -Path $_ -Force | Out-Null; Set-ItemProperty -Path $_ -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force }

          $suffix = ($env:MACHINE_ID.ToUpper() -replace '[^A-Z0-9]','')
          if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0,8) }
          $fixedHost = if ($suffix) { "ALB-$suffix" } else { 'ALB-CLOUD-PC' }
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' ComputerName $fixedHost -Force -ErrorAction SilentlyContinue
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' ComputerName $fixedHost -Force -ErrorAction SilentlyContinue
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' Hostname $fixedHost -Force -ErrorAction SilentlyContinue

          $dlDir = "$env:RUNNER_TEMP\gh-restore"
          if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
          if (-not (Test-Path "$dlDir\drive-manifest.json")) { 'DATA_RESTORED=1' >> "$env:GITHUB_ENV"; exit 0 }

          $manifest = Get-Content -Raw "$dlDir\drive-manifest.json" | ConvertFrom-Json
          $chunkNames = @($manifest.chunks | ForEach-Object { $_.name })
          $dlJobs = @()
          foreach ($chunk in $chunkNames) {
              $dlJobs += Start-Job -ScriptBlock {
                  param($tag, $repo, $pattern, $dir)
                  & gh release download $tag --repo $repo --pattern $pattern --dir $dir 2>$null
              } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $chunk, $dlDir
          }
          $null = Wait-Job $dlJobs -Timeout 120
          $dlJobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }

          $firstChunk = Get-ChildItem $dlDir -Filter '*.7z.001' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $firstChunk) { exit 1 }

          $stage = "$env:VHD_CONTAINER\restore-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          & 7z x $firstChunk.FullName "-o$stage" -y -mmt=4 *> $null
          Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue

          $stateHit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $sourceRoot = $stage
          if ($stateHit) { $sourceRoot = $stateHit.Directory.Parent.FullName }
          robocopy $sourceRoot $env:SHARED_ROOT /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
          $global:LASTEXITCODE = 0

          $cOverlay = "$env:SHARED_OS_DIR\C-Drive-Overlay"
          if (Test-Path "$cOverlay\PF64") { robocopy "$cOverlay\PF64" 'C:\Program Files'      /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null }
          if (Test-Path "$cOverlay\PF86") { robocopy "$cOverlay\PF86" 'C:\Program Files (x86)' /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null }
          if (Test-Path "$cOverlay\PD")   { robocopy "$cOverlay\PD"   'C:\ProgramData'         /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null }
          $global:LASTEXITCODE = 0

          $oldProf = "$env:PROFILE_ROOT\$env:RDP_USER"
          if (-not (Test-Path $oldProf)) {
              $fb = Get-ChildItem $env:PROFILE_ROOT -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($fb) { $oldProf = $fb.FullName }
          }
          if (Test-Path $oldProf) {
              $skipDirs = @("$oldProf\AppData\Local\Packages","$oldProf\AppData\Local\Temp","$oldProf\AppData\Local\Microsoft\Windows\INetCache","$oldProf\AppData\Local\Microsoft\Windows\WebCache")
              robocopy $oldProf $env:PROFILE_PATH /E /XJ /COPY:DAT /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD @skipDirs *> $null
              $global:LASTEXITCODE = 0
          }

          $sdBk = "$env:SHARED_OS_DIR\StarDesk-Backup"
          if (Test-Path $sdBk) {
              if (Test-Path "$sdBk\ProgramFiles") { robocopy "$sdBk\ProgramFiles" 'C:\Program Files\StarDesk' /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }
              if (Test-Path "$sdBk\ProgramData")  { robocopy "$sdBk\ProgramData"  'C:\ProgramData\StarDesk'   /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }
          }
          $evKeyBk = "$env:SHARED_OS_DIR\EVKey"
          if (Test-Path $evKeyBk) { New-Item -ItemType Directory -Force -Path 'C:\ALB-Apps\EVKey' | Out-Null; robocopy $evKeyBk 'C:\ALB-Apps\EVKey' /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }
          $sunPortable = "$env:SHARED_OS_DIR\Sunshine-Portable"
          if ((Test-Path "$sunPortable\sunshine.exe") -and -not (Test-Path 'C:\Program Files\Sunshine\sunshine.exe')) {
              New-Item -ItemType Directory -Force -Path 'C:\Program Files\Sunshine' | Out-Null
              robocopy $sunPortable 'C:\Program Files\Sunshine' /E /XJ /R:1 /W:1 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
              $global:LASTEXITCODE = 0
          }
          if (Test-Path $env:SHARED_STATE_FILE) {
              try { $state = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json; if ($state.password) { "RESTORE_PASS=$($state.password)" >> "$env:GITHUB_ENV" } } catch {}
          }
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          'DATA_RESTORED=1' >> "$env:GITHUB_ENV"
          Write-Host "✅ Restore hoàn tất sau $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green
          exit 0

      - name: 🔗 Gắn kết OS & Apps
        shell: pwsh
        run: |
          $osDir      = $env:SHARED_OS_DIR
          $appsDir    = "$osDir\InstalledApps"
          $binDir     = "$osDir\bin"
          $chocoCache = "$osDir\choco-cache"
          $instCache  = "$osDir\Installers"
          $sunCfgDir  = "$osDir\Sunshine-Config"
          $wallDir    = "$osDir\Wallpaper"
          $dl         = $env:MOUNT_LETTER
          @($appsDir,$binDir,$chocoCache,$instCache,$sunCfgDir,$wallDir,"${dl}:\Apps") |
            ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }
          if (-not (Test-Path 'C:\ALB-Apps')) { New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target $appsDir -Force | Out-Null }
          $sysEnv  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $curPath = (Get-ItemProperty $sysEnv Path).Path
          if ($curPath -notlike "*$binDir*") { Set-ItemProperty $sysEnv Path "$binDir;$curPath" -Force }
          "INSTALLER_CACHE=$instCache"       >> "$env:GITHUB_ENV"
          "SUNSHINE_PERSIST_CFG=$sunCfgDir"  >> "$env:GITHUB_ENV"
          "WALLPAPER_DIR=$wallDir"           >> "$env:GITHUB_ENV"

      - name: 🔐 CẤU HÌNH RDP (BẮT BUỘC PASS)
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fSingleSessionPerUser 0 -Type DWord -Force
          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          @{UserAuthentication=1;SecurityLayer=2;fPromptForPassword=1;fResetBroken=0;fEnableRemoteFX=1;MaxIdleTime=0;MaxDisconnectionTime=0;MaxConnectionTime=0;fDisableAudioCapture=0;fNoRemoteDesktopWallpaper=0;MinSendInterval=10;KeepAliveEnable=1} |
            ForEach-Object { $_.GetEnumerator() | ForEach-Object { Set-ItemProperty $p $_.Key $_.Value -Type DWord -Force -ErrorAction SilentlyContinue } }
          $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $tsPolicy -Force | Out-Null
          Remove-ItemProperty $tsPolicy fPromptForPassword -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty $tsPolicy fResetBroken -Force -ErrorAction SilentlyContinue
          Set-ItemProperty $tsPolicy AVC444ModePreferred 1 -Type DWord -Force
          Set-ItemProperty $tsPolicy AVCHardwareEncodePreferred 1 -Type DWord -Force
          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP') |
            ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
          New-NetFirewallRule -DisplayName 'RDP-Premium'           -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080           -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP'  -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP'  -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null
          Set-Service TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service TermService -ErrorAction SilentlyContinue
          exit 0

      - name: 🔐 FIX QUYỀN RDPIDD.DLL
        shell: pwsh
        run: |
          $rdpidd = 'C:\Windows\System32\drivers\UMDF\RDPidd.dll'
          if (Test-Path $rdpidd) { & icacls $rdpidd /grant:r '*S-1-5-32-545:(RX)' /Q *> $null; Write-Host '✅ RDPidd.dll OK' -ForegroundColor Green }
          exit 0

      - name: ⚡ FIX LAG + MỞ KHÓA 100% CPU + GPU (AN TOÀN)
        if: ${{ inputs.optimize_windows == true || inputs.optimize_windows == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          tzutil /s 'SE Asia Standard Time' 2>$null
          try {
              $ultOut = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
              if ($ultOut -match '([a-f0-9\-]{36})') { & powercfg /setactive $Matches[1] 2>$null } else { & powercfg /setactive SCHEME_MIN 2>$null }
              & powercfg /change standby-timeout-ac 0; & powercfg /change monitor-timeout-ac 0; & powercfg /change disk-timeout-ac 0; & powercfg /hibernate off
              & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
              & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
              & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMIN 100 2>$null
              & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMAX 100 2>$null
              & powercfg /setactive scheme_current 2>$null
          } catch {}
          try { $ptPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'; if (-not (Test-Path $ptPath)) { New-Item $ptPath -Force | Out-Null }; Set-ItemProperty $ptPath PowerThrottlingOff 1 -Type DWord -Force -ErrorAction Stop } catch {}
          @(@{Path='HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\CPU'; Name='EnableCPUQuota'},@{Path='HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\Disk'; Name='EnableDiskQuota'},@{Path='HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\NetBandWidth'; Name='EnableNetworkQuota'}) | ForEach-Object { try { if (Test-Path $_.Path) { Set-ItemProperty $_.Path $_.Name 0 -Type DWord -Force -ErrorAction Stop } } catch {} }
          try { Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Type DWord -Force -ErrorAction Stop } catch {}
          try {
              $mmPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
              if (-not (Test-Path $mmPath)) { New-Item $mmPath -Force | Out-Null }
              Set-ItemProperty $mmPath NetworkThrottlingIndex 4294967295 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty $mmPath SystemResponsiveness 0 -Type DWord -Force -ErrorAction Stop
              $gamesTask = "$mmPath\Tasks\Games"; if (-not (Test-Path $gamesTask)) { New-Item $gamesTask -Force | Out-Null }
              Set-ItemProperty $gamesTask 'GPU Priority' 8 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty $gamesTask 'Priority' 6 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty $gamesTask 'Scheduling Category' 'High' -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty $gamesTask 'SFIO Priority' 'High' -Type String -Force -ErrorAction SilentlyContinue
          } catch {}
          $gpuPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers'
          if (Test-Path $gpuPath) {
              try { Set-ItemProperty $gpuPath TdrLevel 0 -Type DWord -Force -ErrorAction Stop; Set-ItemProperty $gpuPath TdrDelay 60 -Type DWord -Force -ErrorAction Stop; Set-ItemProperty $gpuPath HwSchMode 2 -Type DWord -Force -ErrorAction Stop } catch {}
          }
          try { Set-ItemProperty 'HKCU:\Control Panel\Desktop' MenuShowDelay '0' -Force -ErrorAction SilentlyContinue; Set-ItemProperty 'HKCU:\Control Panel\Desktop' DragFullWindows '0' -Force -ErrorAction SilentlyContinue; Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' VisualFXSetting 2 -Type DWord -Force -ErrorAction SilentlyContinue } catch {}
          & fsutil behavior set disablelastaccess 1 *> $null
          & fsutil behavior set disable8dot3 1 *> $null
          & netsh int tcp set global autotuninglevel=normal *> $null
          & netsh int tcp set global rss=enabled *> $null
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue } catch {}
          @('wuauserv','UsoSvc','DiagTrack','WSearch','SysMain','WerSvc','XblAuthManager','XblGameSave','XboxNetApiSvc','XboxGipSvc','Spooler','MapsBroker','PcaSvc','RetailDemo','dmwappushservice','WbioSrvc','PhoneSvc','PrintNotify') | ForEach-Object { Stop-Service $_ -Force -ErrorAction SilentlyContinue; Set-Service $_ -StartupType Disabled -ErrorAction SilentlyContinue }
          $cpuInfo = Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -First 1
          $cpuName = if ($cpuInfo) { "$($cpuInfo.Name) ($($cpuInfo.NumberOfLogicalProcessors) vCPU @ $($cpuInfo.MaxClockSpeed)MHz)" } else { 'GitHub Cloud vCPU' }
          "CPU_MODEL_INFO=$cpuName" >> "$env:GITHUB_ENV"
          Write-Host "✅ Fix lag OK" -ForegroundColor Green
          exit 0

      - name: 🌐 Tailscale + Funnel (CACHE + SONG SONG)
        if: ${{ inputs.enable_tailscale == true || inputs.enable_tailscale == 'true' }}
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          $startTime = Get-Date
          if (-not $env:TAILSCALE_AUTH_KEY) {
              "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV"; "FUNNEL_URL=" >> "$env:GITHUB_ENV"; "TS_STATUS=NO_KEY" >> "$env:GITHUB_ENV"; exit 0
          }
          $ProgressPreference = 'SilentlyContinue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $ts)) {
              $msiCache = "$env:INSTALLER_CACHE\tailscale-premium.msi"
              if (-not (Test-Path $msiCache) -or (Get-Item $msiCache).Length -lt 5MB) {
                  & curl.exe -L --retry 2 --connect-timeout 15 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -o $msiCache 2>$null
              }
              if (Test-Path $msiCache) {
                  $localMsi = "$env:RUNNER_TEMP\tailscale-setup.msi"
                  Copy-Item $msiCache $localMsi -Force
                  Start-Process msiexec.exe -ArgumentList "/i `"$localMsi`" /quiet /norestart" -Wait
              }
          }
          if (-not (Test-Path $ts)) { "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV"; "FUNNEL_URL=" >> "$env:GITHUB_ENV"; "TS_STATUS=INSTALL_FAIL" >> "$env:GITHUB_ENV"; exit 0 }

          Set-Service Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $tsHost = "alb-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)"
          & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset --unattended
          if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 3
              & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset --unattended
              if ($LASTEXITCODE -ne 0) { "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV"; "FUNNEL_URL=" >> "$env:GITHUB_ENV"; "TS_STATUS=AUTH_FAIL" >> "$env:GITHUB_ENV"; exit 0 }
          }
          & $ts set --unattended=true 2>&1 | Out-Null
          try { Remove-NetFirewallRule -DisplayName 'Tailscale-ICMP' -ErrorAction SilentlyContinue; New-NetFirewallRule -DisplayName 'Tailscale-ICMP' -Direction Inbound -Action Allow -Protocol ICMPv4 -Profile Any | Out-Null } catch {}
          Start-Sleep -Seconds 2
          $tsStatus = & $ts status 2>&1 | Out-String
          if ($tsStatus -match '100\.\d+\.\d+\.\d+') { "TS_STATUS=CONNECTED" >> "$env:GITHUB_ENV" }
          else { "TS_STATUS=UNKNOWN" >> "$env:GITHUB_ENV" }

          $funnelOk = $false
          try {
              & $ts funnel reset 2>&1 | Out-Null; Start-Sleep -Seconds 1
              & $ts funnel --bg 8080 2>&1 | Out-Null; Start-Sleep -Seconds 3
              Stop-Service Tailscale -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              Start-Service Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
              $funnelStatus = & $ts funnel status 2>&1 | Out-String
              if ($funnelStatus -match '(https://[^\s]+)') {
                  $funnelUrl = $Matches[1].TrimEnd('/')
                  "FUNNEL_URL=$funnelUrl" >> "$env:GITHUB_ENV"
                  $funnelOk = $true
              }
          } catch {}
          if (-not $funnelOk) { "FUNNEL_URL=" >> "$env:GITHUB_ENV" }

          $ip = $null
          1..10 | ForEach-Object {
              if (-not $ip) {
                  $out = (& $ts ip -4 2>&1 | Out-String).Trim()
                  if ($out -match '^\d+\.\d+\.\d+\.\d+$') { $ip = $out } else { Start-Sleep -Seconds 1 }
              }
          }
          if (-not $ip) { $ip = '127.0.0.1' }
          "TAILSCALE_IP=$ip" >> "$env:GITHUB_ENV"
          Write-Host "✅ Tailscale OK sau $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green
          exit 0

      - name: 🦆 DuckDNS
        if: ${{ inputs.enable_duckdns == true || inputs.enable_duckdns == 'true' }}
        shell: pwsh
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        run: |
          if (-not $env:DUCKDNS_TOKEN -or -not $env:DUCKDNS_DOMAIN -or -not $env:TAILSCALE_IP) { exit 0 }
          $domain = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$',''
          if ($domain -notmatch '^[a-z0-9-]+$') { exit 0 }
          try { $res = Invoke-RestMethod "https://www.duckdns.org/update?domains=$domain&token=$($env:DUCKDNS_TOKEN)&ip=$($env:TAILSCALE_IP)" -TimeoutSec 10; if ($res.Trim() -eq 'OK') { "DUCKDNS_HOST=${domain}.duckdns.org" >> "$env:GITHUB_ENV" } } catch {}
          exit 0

      # ══════════════════════════════════════════════
      # VDD + VB-Audio + Sunshine — TỐI ƯU TRIỆT ĐỂ
      # ══════════════════════════════════════════════
      - name: 🖥️🔊☀️ VDD + VB-Audio + Sunshine (SIÊU NHANH)
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $startTime = Get-Date
          $ErrorActionPreference = 'Continue'; $ProgressPreference = 'SilentlyContinue'
          $instCache  = $env:INSTALLER_CACHE
          $sunPersist = $env:SUNSHINE_PERSIST_CFG
          $dl         = $env:MOUNT_LETTER

          $resParts = $env:VDD_RES -split '[@x]'
          $vWidth  = if ($resParts.Count -ge 1) { [int]$resParts[0] } else { 1920 }
          $vHeight = if ($resParts.Count -ge 2) { [int]$resParts[1] } else { 1080 }
          $vHz     = if ($resParts.Count -ge 3) { [int]$resParts[2] } else { 60 }

          # ── 1. VDD — CHỈ CÀI NẾU CHƯA CÓ ──
          $vddInstalled = Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match 'usbmmidd|Virtual Display' -and $_.Status -eq 'OK' }
          if (-not $vddInstalled) {
              try {
                  $vddCache = "$instCache\VDD"; New-Item -ItemType Directory -Force $vddCache | Out-Null
                  $usbZip   = "$vddCache\usbmmidd_v2.zip"; $usbDir = 'C:\usbmmidd_v2'
                  if (-not (Test-Path $usbZip)) { & curl.exe -L --retry 2 --connect-timeout 10 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -o $usbZip 2>$null }
                  if (Test-Path $usbZip) {
                      Add-Type -AssemblyName System.IO.Compression.FileSystem
                      $zip = [System.IO.Compression.ZipFile]::OpenRead($usbZip)
                      New-Item -ItemType Directory -Force 'C:\usbmmidd_v2' | Out-Null
                      foreach ($entry in $zip.Entries) {
                          if ($entry.Name -match '\.(inf|sys|cer|cat|exe)$') {
                              $destPath = "C:\usbmmidd_v2\$($entry.Name)"
                              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destPath, $true)
                          }
                      }
                      $zip.Dispose()
                      if (Test-Path "$usbDir\deviceinstaller64.exe") {
                          Push-Location $usbDir
                          Get-ChildItem $usbDir -Filter '*.cer' -Recurse | ForEach-Object { Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null; Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null }
                          & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null
                          $wudfPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
                          New-Item $wudfPath -Force | Out-Null
                          Set-ItemProperty $wudfPath '0' "${vWidth},${vHeight},${vHz}" -Force
                          Set-ItemProperty $wudfPath '1' '1920,1080,120' -Force
                          Set-ItemProperty $wudfPath '2' '2560,1440,60' -Force
                          Set-ItemProperty $wudfPath '3' '3840,2160,60' -Force
                          & .\deviceinstaller64.exe enableidd 1 *> $null
                          Pop-Location
                      }
                  }
              } catch {}
              Write-Host "│ ✅ VDD cài mới" -ForegroundColor Green
          } else { Write-Host "│ ⚡ VDD đã có, skip" -ForegroundColor Green }

          # ── 2. VB-AUDIO — CHỈ CÀI NẾU CHƯA CÓ ──
          $vbInstalled = Get-PnpDevice -Class MEDIA -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match 'VB-Audio|CABLE' -and $_.Status -eq 'OK' }
          if (-not $vbInstalled) {
              try {
                  $vbCache = "$instCache\VBCable"; New-Item -ItemType Directory -Force $vbCache | Out-Null
                  $vbZip   = "$vbCache\VBCABLE_Driver_Pack43.zip"
                  if (-not (Test-Path $vbZip)) { & curl.exe -L --retry 2 --connect-timeout 10 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -o $vbZip 2>$null }
                  if (Test-Path $vbZip) {
                      Add-Type -AssemblyName System.IO.Compression.FileSystem
                      $zip = [System.IO.Compression.ZipFile]::OpenRead($vbZip)
                      New-Item -ItemType Directory -Force $vbCache | Out-Null
                      foreach ($entry in $zip.Entries) {
                          if ($entry.Name -match '\.(inf|sys|cer|cat|exe)$') {
                              $destPath = [System.IO.Path]::Combine($vbCache, $entry.Name)
                              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destPath, $true)
                          }
                      }
                      $zip.Dispose()
                      $vbInf = Get-ChildItem $vbCache -Filter '*64*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      if (-not $vbInf) { $vbInf = Get-ChildItem $vbCache -Filter '*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
                      if ($vbInf) { pnputil /add-driver $vbInf.FullName /install *> $null }
                  }
              } catch {}
              Write-Host "│ ✅ VB-Audio cài mới" -ForegroundColor Green
          } else { Write-Host "│ ⚡ VB-Audio đã có, skip" -ForegroundColor Green }

          $audioDevs = @(Get-PnpDevice -Class 'MEDIA','AudioEndpoint' -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match 'VB-Audio|CABLE|Virtual' -and $_.Status -eq 'OK' } | Select-Object -ExpandProperty FriendlyName -Unique)
          "AUDIO_DEVICE_NAME=$($audioDevs -join ', ')" >> "$env:GITHUB_ENV"
          $global:LASTEXITCODE = 0

          # ── 3. SUNSHINE — RESTORE CHỈ FILE CẦN THIẾT ──
          $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"
          $sunBackupDir = "$env:SHARED_OS_DIR\Sunshine-Portable"

          if (-not (Test-Path $sunExe) -and (Test-Path "$sunBackupDir\sunshine.exe")) {
              Write-Host "│ ⚡ Restore Sunshine từ backup (chỉ file cần)..." -ForegroundColor Green
              New-Item -ItemType Directory -Force $sunDir | Out-Null
              Get-ChildItem $sunBackupDir -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -match '^\.(exe|dll|json|conf|pem|key)$' } | ForEach-Object { Copy-Item $_.FullName "$sunDir\$($_.Name)" -Force -ErrorAction SilentlyContinue }
              if (Test-Path "$sunBackupDir\tools") {
                  New-Item -ItemType Directory -Force "$sunDir\tools" | Out-Null
                  Get-ChildItem "$sunBackupDir\tools" -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object { Copy-Item $_.FullName "$sunDir\tools\$($_.Name)" -Force -ErrorAction SilentlyContinue }
              }
          }

          if (-not (Test-Path $sunExe)) {
              Write-Host "│ 📦 Cài Sunshine mới..." -ForegroundColor Cyan
              & sc.exe stop SunshineService *> $null; & sc.exe delete SunshineService *> $null
              $job = Start-Job -ScriptBlock { choco install sunshine -y --no-progress --limit-output --ignore-checksums 2>&1 | Out-Null }
              $done = Wait-Job $job -Timeout 60
              if (-not $done) { Stop-Job $job -ErrorAction SilentlyContinue }
              Remove-Job $job -Force -ErrorAction SilentlyContinue
              $global:LASTEXITCODE = 0
          }

          if (Test-Path $sunExe) {
              Stop-Service SunshineService,sunshinesvc -Force -ErrorAction SilentlyContinue
              Stop-Process -Name sunshine -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 1
              $sunCfg = "$sunDir\config"
              if (Test-Path $sunCfg) {
                  $item = Get-Item $sunCfg -Force
                  if ($item.Attributes -notmatch 'ReparsePoint') {
                      if (@(Get-ChildItem $sunPersist -Force -ErrorAction SilentlyContinue).Count -eq 0) { Copy-Item "$sunCfg\*" $sunPersist -Recurse -Force -ErrorAction SilentlyContinue }
                      Remove-Item $sunCfg -Recurse -Force -ErrorAction SilentlyContinue
                  }
              }
              New-Item -ItemType Junction $sunCfg -Target $sunPersist -Force | Out-Null
              $confFile = "$sunPersist\sunshine.conf"
              $defaultConf = @("sunshine_name = ALB-$($env:MACHINE_ID)","min_log_level = info","origin_web_ui_allowed = wan","upnp = disabled","address_family = both","port = 47989","pkey = ","cert = ","file_state = ","credentials_file = ") -join "`r`n"
              if (-not (Test-Path $confFile)) { Set-Content $confFile -Value $defaultConf -Encoding UTF8 }
              else { $curConf = Get-Content -Raw $confFile -ErrorAction SilentlyContinue; if ($curConf -notmatch 'origin_web_ui_allowed\s*=\s*wan') { $curConf = $curConf -replace 'origin_web_ui_allowed\s*=\s*\w+','origin_web_ui_allowed = wan'; Set-Content $confFile -Value $curConf -Encoding UTF8 } }
              Remove-NetFirewallRule -DisplayName 'Sunshine-WebUI-TCP','Sunshine-WebUI-UDP' -ErrorAction SilentlyContinue
              New-NetFirewallRule -DisplayName 'Sunshine-WebUI-TCP' -Direction Inbound -Action Allow -Protocol TCP -Program $sunExe -Profile Any | Out-Null
              New-NetFirewallRule -DisplayName 'Sunshine-WebUI-UDP' -Direction Inbound -Action Allow -Protocol UDP -Program $sunExe -Profile Any | Out-Null
              $svcExe = "$sunDir\tools\sunshinesvc.exe"
              $svcObj = Get-Service -Name 'SunshineService','sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $svcObj -and (Test-Path $svcExe)) {
                  & sc.exe create SunshineService binPath= "`"$svcExe`"" start= auto DisplayName= 'Sunshine Gamestream Service' *> $null
                  $svcObj = Get-Service SunshineService -ErrorAction SilentlyContinue
              }
              if ($svcObj) { Set-Service $svcObj.Name -StartupType Automatic; Start-Service $svcObj.Name -ErrorAction SilentlyContinue }
              else { Start-Process $sunExe -WorkingDirectory $sunDir -WindowStyle Hidden }
              Start-Sleep -Seconds 2
              $sunListen = netstat -ano | Select-String ':47990'
              if ($sunListen) { Write-Host "│ ✅ Sunshine port 47990 OK" -ForegroundColor Green; "SUNSHINE_PORT_OK=1" >> "$env:GITHUB_ENV" }
              else { Write-Host "│ ⚠️ Sunshine chưa listen, chờ thêm..." -ForegroundColor Yellow; Start-Sleep -Seconds 2; $sunListen2 = netstat -ano | Select-String ':47990'; if ($sunListen2) { "SUNSHINE_PORT_OK=1" >> "$env:GITHUB_ENV" } }
              "SUNSHINE_READY=1" >> "$env:GITHUB_ENV"
          }

          Write-Host "✅ VDD+Audio+Sunshine OK sau $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green
          $global:LASTEXITCODE = 0; exit 0

      - name: 👤 User + Mật khẩu + Wallpaper
        shell: pwsh
        env:
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
          WALLPAPER_URL_INPUT: ${{ inputs.wallpaper_url }}
        run: |
          $startTime = Get-Date
          $user     = $env:RDP_USER
          $profPath = $env:PROFILE_PATH

          if (-not [string]::IsNullOrWhiteSpace($env:FIXED_PASS_INPUT)) { $matKhau = $env:FIXED_PASS_INPUT.Trim(); $source = 'fixed_input' }
          elseif ($env:RESTORE_PASS) { $matKhau = $env:RESTORE_PASS; $source = 'restored' }
          else { $matKhau = 'Aistv@2026'; $source = 'default_fixed' }

          try {
              & net accounts /maxpwage:unlimited *> $null
              $secCfg = "$env:RUNNER_TEMP\secpol.cfg"; $secDb = "$env:RUNNER_TEMP\secpol.sdb"
              & secedit /export /cfg $secCfg *> $null
              if (Test-Path $secCfg) {
                  $raw = Get-Content -Raw $secCfg
                  $raw = $raw -replace 'PasswordComplexity\s*=\s*1','PasswordComplexity = 0'
                  $raw = $raw -replace 'MinimumPasswordLength\s*=\s*\d+','MinimumPasswordLength = 0'
                  Set-Content $secCfg -Value $raw -Encoding Unicode
                  & secedit /configure /db $secDb /cfg $secCfg /areas SECURITYPOLICY *> $null
                  Remove-Item $secCfg,$secDb -Force -ErrorAction SilentlyContinue
              }
          } catch {}

          $secPass = ConvertTo-SecureString $matKhau -AsPlainText -Force
          try { Set-LocalUser -Name $user -Password $secPass -PasswordNeverExpires $true -ErrorAction Stop } catch {}
          & net user $user $matKhau /active:yes /expires:never *> $null
          Add-LocalGroupMember -Group 'Administrators'       -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue
          Enable-LocalUser -Name $user -ErrorAction SilentlyContinue
          "RDP_PASS=$matKhau"       >> "$env:GITHUB_ENV"
          "RDP_PASS_SOURCE=$source" >> "$env:GITHUB_ENV"

          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty $winlogon AutoAdminLogon    '1'             -Force
          Set-ItemProperty $winlogon DefaultUserName   $user           -Force
          Set-ItemProperty $winlogon DefaultPassword   $matKhau        -Force
          Set-ItemProperty $winlogon DefaultDomainName $env:COMPUTERNAME -Force

          $wallPersist = "$env:WALLPAPER_DIR\Zenova-Pagoda-Sunset.jpg"
          $wallOk = $false
          if (-not [string]::IsNullOrWhiteSpace($env:WALLPAPER_URL_INPUT) -and $env:WALLPAPER_URL_INPUT -match '^https?://') {
              try { & curl.exe -L --retry 2 --connect-timeout 10 -A 'Mozilla/5.0' $env:WALLPAPER_URL_INPUT -o $wallPersist 2>$null; if ((Test-Path $wallPersist) -and (Get-Item $wallPersist).Length -gt 50KB) { $wallOk = $true } } catch {}
          }
          if (-not $wallOk) {
              try {
                  Add-Type -AssemblyName System.Drawing -ErrorAction SilentlyContinue
                  $bmp = New-Object System.Drawing.Bitmap(1920,1080); $g = [System.Drawing.Graphics]::FromImage($bmp)
                  $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
                  $rect = New-Object System.Drawing.Rectangle(0,0,1920,1080)
                  $bgBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect,[System.Drawing.Color]::FromArgb(255,40,5,15),[System.Drawing.Color]::FromArgb(255,180,60,80),90.0)
                  $g.FillRectangle($bgBrush,$rect)
                  $rnd = New-Object System.Random(2026)
                  for ($i=0;$i-lt 80;$i++) { $px = $rnd.Next(0,1920); $py = $rnd.Next(0,600); $ps = $rnd.Next(4,14); $pb = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb($rnd.Next(100,220),255,160,180)); $g.FillEllipse($pb,$px,$py,$ps,$ps); $pb.Dispose() }
                  $tf = New-Object System.Drawing.Font('Segoe UI',80,[System.Drawing.FontStyle]::Bold); $sf = New-Object System.Drawing.Font('Segoe UI',28,[System.Drawing.FontStyle]::Bold)
                  $tb = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(240,255,210,220)); $sb = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(200,220,180,200))
                  $g.DrawString('ZENOVA',$tf,$tb,80,380); $g.DrawString('C L O U D',$sf,$sb,145,510)
                  $bmp.Save($wallPersist,[System.Drawing.Imaging.ImageFormat]::Jpeg); $g.Dispose(); $bmp.Dispose()
              } catch {}
          }

          if (Test-Path $wallPersist) {
              try {
                  $sysWalls = @('C:\Windows\Web\Wallpaper\Windows\img0.jpg','C:\Windows\Web\Screen\img100.jpg')
                  if (Test-Path 'C:\Windows\Web\4K\Wallpaper\Windows') { $sysWalls += @(Get-ChildItem 'C:\Windows\Web\4K\Wallpaper\Windows' -Filter '*.jpg' -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) }
                  foreach ($sw in $sysWalls) { if (Test-Path $sw) { & takeown.exe /F $sw /A *> $null; & icacls.exe $sw /grant 'Administrators:F' /Q *> $null; Copy-Item $wallPersist $sw -Force -ErrorAction SilentlyContinue } }
                  $themesDir = "$env:APPDATA\Microsoft\Windows\Themes"; New-Item -ItemType Directory -Force $themesDir | Out-Null; Copy-Item $wallPersist "$themesDir\TranscodedWallpaper" -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty 'HKCU:\Control Panel\Desktop' Wallpaper $wallPersist -Force
                  Set-ItemProperty 'HKCU:\Control Panel\Desktop' WallpaperStyle '10' -Force
                  Set-ItemProperty 'HKCU:\Control Panel\Desktop' TileWallpaper '0' -Force
                  $wallCs = @('using System; using System.Runtime.InteropServices;','public class WallSetter { [DllImport("user32.dll",CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int uAction,int uParam,string lpvParam,int fuWinIni);','    public static void Apply(string p){SystemParametersInfo(20,0,p,0x01|0x02);}}')
                  Add-Type -TypeDefinition ($wallCs -join ' ') -ErrorAction SilentlyContinue
                  [WallSetter]::Apply($wallPersist)
                  & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True
              } catch {}
          }

          $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"
          if (Test-Path $sunExe) {
              $uObj = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
              if ($uObj) { & icacls $sunDir /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null; & icacls $env:SUNSHINE_PERSIST_CFG /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null }
              Push-Location $sunDir; & $sunExe --creds $user $matKhau *> $null; Pop-Location
          }

          try {
              $desktopDir = "$profPath\Desktop"; New-Item -ItemType Directory -Force $desktopDir | Out-Null
              $ws = New-Object -ComObject WScript.Shell; $tsIp = $env:TAILSCALE_IP
              foreach ($d in @($desktopDir,'C:\Users\Public\Desktop')) {
                  $lnk = $ws.CreateShortcut("$d\WEB-PANEL.url"); $lnk.TargetPath = "http://$($tsIp):$($env:WEB_PORT)/"; $lnk.Save()
                  $lnk2 = $ws.CreateShortcut("$d\SUNSHINE-HTTPS.url"); $lnk2.TargetPath = "https://$($tsIp):$($env:SUNSHINE_WEB_PORT)/"; $lnk2.Save()
                  $tsconBat = "$d\NGAT-RDP-GIU-MAN-HINH.bat"
                  Set-Content $tsconBat -Value "@echo off`r`nfor /f `"tokens=3-4`" %%a in ('query session %USERNAME%') do @if `"%%b`"==`"Active`" tscon %%a /dest:console" -Encoding ASCII
              }
          } catch {}
          'SESSION_READY=1' >> "$env:GITHUB_ENV"
          Write-Host "✅ User+Wallpaper OK sau $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green
          exit 0

      - name: 🚀 CÀI APP SIÊU NHANH — 7 JOB SONG SONG
        shell: pwsh
        env:
          PKGS: ${{ inputs.choco_packages }}
          WIN_IMG: ${{ inputs.windows_image }}
        run: |
          $startTime = Get-Date
          $ErrorActionPreference = 'Continue'; $ProgressPreference = 'SilentlyContinue'
          $user = $env:RDP_USER; $profPath = $env:PROFILE_PATH
          $instCache = $env:INSTALLER_CACHE; $appsDir = 'C:\ALB-Apps'
          $desktopDir = "$profPath\Desktop"; $downloadsDir = "$profPath\Downloads"; $startupDir = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"
          $ws = New-Object -ComObject WScript.Shell
          New-Item -ItemType Directory -Force -Path $instCache,$appsDir,"$appsDir\EVKey",$desktopDir,$downloadsDir,$startupDir | Out-Null

          Write-Host "━━━ TẢI SONG SONG 5 INSTALLER ━━━" -ForegroundColor Cyan
          $dlJobs = @()
          $dlJobs += Start-Job -ScriptBlock { param($p) if (-not (Test-Path "$p\EVKey.zip")) { & curl.exe -L --retry 2 --connect-timeout 10 -s 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip' -o "$p\EVKey.zip" 2>$null } } -ArgumentList $instCache
          $dlJobs += Start-Job -ScriptBlock { param($p) $vs = "$p\VSCodeSetup-x64.exe"; if (-not (Test-Path $vs) -or (Get-Item $vs).Length -lt 40MB) { & curl.exe -L --retry 2 --connect-timeout 10 -s 'https://update.code.visualstudio.com/latest/win32-x64-system/stable' -o $vs 2>$null } } -ArgumentList $instCache
          $dlJobs += Start-Job -ScriptBlock { param($p) $sp = "$p\SpotifySetup.exe"; if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe") -and -not (Test-Path $sp)) { & curl.exe -L --retry 2 --connect-timeout 10 -s 'https://download.scdn.co/SpotifyFullSetupX64.exe' -o $sp 2>$null } } -ArgumentList $instCache
          $dlJobs += Start-Job -ScriptBlock { param($p) $dc = "$p\DiscordSetup.exe"; if (-not (Test-Path $dc) -or (Get-Item $dc).Length -lt 20MB) { & curl.exe -L --retry 2 --connect-timeout 10 -s 'https://dl.discord.com/apps/win/1.0.9171/DiscordSetup.exe' -o $dc 2>$null } } -ArgumentList $instCache
          $dlJobs += Start-Job -ScriptBlock { param($p) $sd = "$p\StarDesk_latest.exe"; if (-not (Test-Path $sd) -or (Get-Item $sd).Length -lt 5MB) { & curl.exe -L --retry 3 --connect-timeout 15 -s -A 'Mozilla/5.0' 'https://api.stardesk.net/api/v1/release/dl/1?channel=official' -o $sd 2>$null } } -ArgumentList $instCache
          $null = Wait-Job $dlJobs -Timeout 60
          $dlJobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }
          Write-Host "│ ✅ Tải xong sau $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green

          # EVKEY
          try {
              $evDest = "$appsDir\EVKey"
              if (-not (Test-Path "$evDest\EVKey64.exe")) { $zip = "$instCache\EVKey.zip"; if (Test-Path $zip) { Expand-Archive $zip $evDest -Force } }
              $exe = if (Test-Path "$evDest\EVKey64.exe") { "$evDest\EVKey64.exe" } elseif (Test-Path "$evDest\EVKey32.exe") { "$evDest\EVKey32.exe" } else { $null }
              if ($exe) { $lnk = $ws.CreateShortcut("$startupDir\EVKey.lnk"); $lnk.TargetPath = $exe; $lnk.Save(); $lnk = $ws.CreateShortcut("$desktopDir\EVKey.lnk"); $lnk.TargetPath = $exe; $lnk.Save(); Start-Process $exe -WorkingDirectory $evDest -ErrorAction SilentlyContinue }
          } catch {}

          Write-Host "━━━ CÀI SONG SONG 7 JOB ━━━" -ForegroundColor Cyan
          $installJobs = @()
          $installJobs += Start-Job -ScriptBlock { param($instCache, $desktopDir) $vsExe = 'C:\Program Files\Microsoft VS Code\Code.exe'; if (-not (Test-Path $vsExe)) { $inst = "$instCache\VSCodeSetup-x64.exe"; if ((Test-Path $inst) -and (Get-Item $inst).Length -gt 40MB) { Start-Process $inst -ArgumentList '/VERYSILENT','/NORESTART','/MERGETASKS=!runcode,addtopath' -Wait -ErrorAction SilentlyContinue } }; if (Test-Path $vsExe) { $ws = New-Object -ComObject WScript.Shell; $lnk = $ws.CreateShortcut("$desktopDir\Visual Studio Code.lnk"); $lnk.TargetPath = $vsExe; $lnk.Save() } } -ArgumentList $instCache, $desktopDir
          $installJobs += Start-Job -ScriptBlock { param($instCache, $desktopDir) $dcExe = "$env:LOCALAPPDATA\Discord\Update.exe"; if (-not (Test-Path $dcExe)) { $inst = "$instCache\DiscordSetup.exe"; if ((Test-Path $inst) -and (Get-Item $inst).Length -gt 20MB) { $proc = Start-Process $inst -ArgumentList '--silent' -PassThru -ErrorAction SilentlyContinue; $null = $proc.WaitForExit(60) } }; $dcApp = Get-ChildItem "$env:LOCALAPPDATA\Discord" -Filter 'Discord.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1; if ($dcApp) { $ws = New-Object -ComObject WScript.Shell; $lnk = $ws.CreateShortcut("$desktopDir\Discord.lnk"); $lnk.TargetPath = $dcApp.FullName; $lnk.Save() } } -ArgumentList $instCache, $desktopDir
          $installJobs += Start-Job -ScriptBlock { param($instCache) if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")) { $inst = "$instCache\SpotifySetup.exe"; if ((Test-Path $inst) -and (Get-Item $inst).Length -gt 5MB) { $p = Start-Process $inst -ArgumentList '/silent','/skip-app-launch' -PassThru -ErrorAction SilentlyContinue; $null = $p.WaitForExit(40) } } } -ArgumentList $instCache
          $installJobs += Start-Job -ScriptBlock { param($desktopDir) $bdExe = 'C:\Program Files\Bandicam\bdcam.exe'; if (-not (Test-Path $bdExe)) { choco install bandicam -y --no-progress --limit-output --ignore-checksums 2>&1 | Out-Null }; if (Test-Path $bdExe) { $ws = New-Object -ComObject WScript.Shell; $lnk = $ws.CreateShortcut("$desktopDir\Bandicam.lnk"); $lnk.TargetPath = $bdExe; $lnk.Save() } } -ArgumentList $desktopDir
          $installJobs += Start-Job -ScriptBlock { param($instCache, $desktopDir, $winImg) $robloxInstalled = Test-Path "$env:LOCALAPPDATA\Roblox\Versions" -ErrorAction SilentlyContinue; if (-not $robloxInstalled) { if ($winImg -match '2025') { winget install Roblox.Roblox --silent --accept-package-agreements --accept-source-agreements 2>&1 | Out-Null }; if (-not (Test-Path "$env:LOCALAPPDATA\Roblox\Versions")) { $robloxInst = "$instCache\RobloxPlayerInstaller.exe"; if (-not (Test-Path $robloxInst)) { & curl.exe -L --retry 2 --connect-timeout 15 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe' -o $robloxInst 2>$null }; if ((Test-Path $robloxInst) -and (Get-Item $robloxInst).Length -gt 500KB) { Start-Process $robloxInst -ArgumentList '-q','--no-ui' -Wait -ErrorAction SilentlyContinue; Start-Sleep -Seconds 10 } } }; $robloxExe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Filter 'RobloxPlayerBeta.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1; if ($robloxExe) { $ws = New-Object -ComObject WScript.Shell; $lnk = $ws.CreateShortcut("$desktopDir\Roblox.lnk"); $lnk.TargetPath = $robloxExe.FullName; $lnk.Save() } } -ArgumentList $instCache, $desktopDir, $env:WIN_IMG

          try { $src = "$instCache\StarDesk_latest.exe"; if (Test-Path $src) { $bytes = [System.IO.File]::ReadAllBytes($src)[0..1]; if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) { Copy-Item $src "$downloadsDir\StarDesk_latest.exe" -Force } } } catch {}
          try { $tsExe = 'C:\Program Files\Tailscale\tailscale-ipn.exe'; if (Test-Path $tsExe) { $lnk = $ws.CreateShortcut("$desktopDir\Tailscale.lnk"); $lnk.TargetPath = $tsExe; $lnk.Save() } } catch {}
          if ($env:WIN_IMG -match '2025') { $storePkg = Get-AppxPackage -Name '*WindowsStore*' -ErrorAction SilentlyContinue; if (-not $storePkg) { try { winget install 9WZDNCRFJBMP --silent --accept-package-agreements 2>&1 | Out-Null } catch {} } }

          $null = Wait-Job $installJobs -Timeout 90
          $installJobs | ForEach-Object { Remove-Job $_ -Force -ErrorAction SilentlyContinue }
          Write-Host "│ ✅ Cài song song xong sau $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green

          $pkgListFile = "$env:SHARED_OS_DIR\installed-choco-packages.txt"
          $savedPkgs = @(); if (Test-Path $pkgListFile) { $savedPkgs = @(Get-Content $pkgListFile | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' }) }
          $inputPkgs = @(); if (-not [string]::IsNullOrWhiteSpace($env:PKGS)) { $inputPkgs = @($env:PKGS -split '\s+' | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' }) }
          $allPkgs = @($savedPkgs + $inputPkgs | Select-Object -Unique)
          if ($allPkgs.Count -gt 0) { $allPkgs | Set-Content $pkgListFile -Encoding UTF8; $chocoJob = Start-Job -ScriptBlock { param($pkgs) $pkgs | ForEach-Object { choco install $_ -y --no-progress --limit-output 2>&1 | Out-Null } } -ArgumentList (,$allPkgs); $null = Wait-Job $chocoJob -Timeout 60; Remove-Job $chocoJob -Force -ErrorAction SilentlyContinue }
          Write-Host "✅ TẤT CẢ APP HOÀN TẤT sau $([math]::Round(((Get-Date)-$startTime).TotalSeconds))s" -ForegroundColor Green
          $global:LASTEXITCODE = 0; exit 0

      - name: 🔍 RDP CONNECTION TEST
        shell: pwsh
        run: |
          $rdpOk = $false
          for ($i=1;$i-le 5;$i++) { $test = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue; if ($test.TcpTestSucceeded) { $rdpOk = $true; break }; Start-Sleep -Seconds 1 }
          if ($rdpOk) { "RDP_TEST_STATUS=OK" >> "$env:GITHUB_ENV" }
          else { Restart-Service TermService -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; $t2 = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue; if ($t2.TcpTestSucceeded) { "RDP_TEST_STATUS=OK_AFTER_RESTART" >> "$env:GITHUB_ENV" } else { "RDP_TEST_STATUS=FAIL" >> "$env:GITHUB_ENV" } }
          exit 0

      - name: 🌐 Web Panel (AN TOÀN - KHÔNG HERE-STRING)
        shell: pwsh
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
        run: |
          $tsIp      = $env:TAILSCALE_IP
          $funnelUrl = $env:FUNNEL_URL
          $webPort   = $env:WEB_PORT
          $sunPort   = $env:SUNSHINE_WEB_PORT
          $machineId = $env:MACHINE_ID
          $rdpUser   = $env:RDP_USER
          $rdpPass   = $env:RDP_PASS
          $driveLetter = $env:MOUNT_LETTER
          $vhdSize   = $env:VHD_SIZE_GB_VALIDATED
          $winImage  = $env:WINDOWS_IMAGE
          $osBuild   = $env:OS_BUILD
          $cpuModel  = $env:CPU_MODEL_INFO

          $webPanelUrl = if ($funnelUrl) { $funnelUrl } elseif ($tsIp -and $tsIp -ne '127.0.0.1') { "http://${tsIp}:${webPort}" } else { "http://127.0.0.1:${webPort}" }
          $sunshineUrl = if ($tsIp -and $tsIp -ne '127.0.0.1') { "https://${tsIp}:${sunPort}" } else { "https://127.0.0.1:${sunPort}" }
          "WEB_PANEL_URL=$webPanelUrl" >> "$env:GITHUB_ENV"
          "SUNSHINE_URL=$sunshineUrl"  >> "$env:GITHUB_ENV"

          $savePass = if ($env:RDP_PASS_SOURCE -ne 'secret') { $rdpPass } else { $null }
          $state = [ordered]@{ machineId = $machineId; releaseTag = $env:RELEASE_TAG; user = $rdpUser; password = $savePass; passwordSource = $env:RDP_PASS_SOURCE; windowsImage = $winImage; osBuild = $osBuild; driveLetter = $driveLetter; tailscaleIp = $tsIp; funnelUrl = $funnelUrl; webPanelUrl = $webPanelUrl; sunshineUrl = $sunshineUrl; durationMinutes = [int]$env:TOTAL_MINUTES; startUtc = (Get-Date).ToUniversalTime().ToString('o'); runId = $env:GITHUB_RUN_ID }
          $state | ConvertTo-Json -Depth 5 -Compress | Set-Content $env:SHARED_STATE_FILE -Encoding UTF8

          $htmlLines = @(
              '<!DOCTYPE html><html><head><meta charset="utf-8"><title>ALB Panel v32.0</title>'
              '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">'
              '<style>*{box-sizing:border-box}body{background:#07090f;color:#eef2f8;font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{max-width:640px;width:100%;background:rgba(12,18,32,0.95);border:1px solid rgba(255,180,80,0.2);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}h1{color:#ffd700;margin:0 0 4px;font-size:22px}.sub{color:#8a9bb8;font-size:12px;margin-bottom:20px}.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06)}.label{color:#8a9bb8;font-size:12px}.val{color:#eef2f8;font-weight:600;font-size:13px}.val a{color:#38bdf8;text-decoration:none}.gold{color:#ffd700}.apps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.app{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}.app-ok{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3)}.app-no{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.2)}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{padding:13px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;color:white}.btn-save{background:linear-gradient(135deg,#0ea5e9,#0369a1)}.btn-restart{background:linear-gradient(135deg,#f59e0b,#b45309)}.btn-stop{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn-new{background:linear-gradient(135deg,#8b5cf6,#6d28d9);grid-column:span 2}</style></head><body><div class="card">'
              '<h1>🖥️ ALB PANEL v32.0</h1>'
              "<div class='sub'>$machineId &bull; $tsIp &bull; $winImage</div>"
              "<div class='row'><span class='label'>⏱️ Còn lại</span><span class='val gold' id='remain'>Loading...</span></div>"
              "<div class='row'><span class='label'>🌐 Web Panel</span><span class='val'><a href='$webPanelUrl' target='_blank'>$webPanelUrl</a></span></div>"
              "<div class='row'><span class='label'>☀️ Sunshine</span><span class='val'><a href='$sunshineUrl' target='_blank'>$sunshineUrl</a></span></div>"
              "<div class='row'><span class='label'>🔑 Pass</span><span class='val'>$rdpPass</span></div>"
              "<div class='row'><span class='label'>👤 User</span><span class='val'>$rdpUser</span></div>"
              "<div class='row'><span class='label'>💽 Ổ</span><span class='val'>${driveLetter}:\ ($vhdSize GB)</span></div>"
              "<div class='row'><span class='label'>⚡ CPU</span><span class='val'>$cpuModel</span></div>"
              "<div class='apps' id='apps'>Loading...</div>"
              "<div class='btns'>"
              "<button class='btn btn-save' onclick='act(\"save\")'>💾 Lưu</button>"
              "<button class='btn btn-restart' onclick='act(\"restart\")'>🔁 Restart</button>"
              "<button class='btn btn-stop' onclick='act(\"stop\")'>🛑 Tắt</button>"
              "<button class='btn btn-new' onclick='act(\"start-new\")'>🚀 Phiên Mới</button>"
              "</div></div>"
              "<script>async function act(x){if(!confirm('Xác nhận '+x+'?'))return;try{const r=await fetch('/api/action/'+x,{method:'POST'});const j=await r.json();alert(j.ok?'✅ '+x:'❌ '+j.error)}catch(e){alert('❌ Lỗi')}}async function loadStatus(){try{const r=await fetch('/api/status');const j=await r.json();if(j.apps){document.getElementById('apps').innerHTML=j.apps.map(a=>'<span class=\"app '+(a.ok?'app-ok':'app-no')+'\">'+(a.ok?'✅':'❌')+' '+a.name+'</span>').join('')}if(j.remaining_display){document.getElementById('remain').textContent=j.remaining_display}}catch(e){}}loadStatus();setInterval(loadStatus,10000);</script></body></html>"
          )
          $htmlPath = "$env:RUNNER_TEMP\panel.html"
          Set-Content -Path $htmlPath -Value ($htmlLines -join "`r`n") -Encoding UTF8

          $webScriptLines = @(
              '$ErrorActionPreference = "Continue"'
              '$listener = [System.Net.HttpListener]::new()'
              '$listener.Prefixes.Add("http://+:' + $webPort + '/")'
              '$listener.Start()'
              '$endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60)'
              '$statCache = @{}; $cacheTime = 0'
              'while ($listener.IsListening) {'
              '    try {'
              '        $ctx = $listener.GetContext(); $req = $ctx.Request; $resp = $ctx.Response'
              '        $path = $req.Url.AbsolutePath.ToLower()'
              '        $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()'
              '        $remain = [math]::Max(0, $endEpoch - $now)'
              '        if (($now - $cacheTime) -gt 5) {'
              '            $ram = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue'
              '            $disk = Get-PSDrive -Name "$env:MOUNT_LETTER" -ErrorAction SilentlyContinue'
              '            $statCache = [ordered]@{ machineId = "$env:MACHINE_ID"; status = "ok"; rdp = (Get-Service TermService -ErrorAction SilentlyContinue).Status.ToString(); remaining_seconds = $remain; remaining_display = "$([math]::Floor($remain/3600))h$([math]::Floor(($remain%3600)/60))m$($remain%60)s"; tailscale_ip = "$env:TAILSCALE_IP"; funnel_url = "$env:FUNNEL_URL"; web_panel_url = "$env:WEB_PANEL_URL"; sunshine_url = "$env:SUNSHINE_URL"; apps = @(@{name="Discord";   ok=(Test-Path "$env:LOCALAPPDATA\Discord")},@{name="VSCode";    ok=(Test-Path "C:\Program Files\Microsoft VS Code\Code.exe")},@{name="Spotify";   ok=(Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")},@{name="Bandicam";  ok=(Test-Path "C:\Program Files\Bandicam\bdcam.exe")},@{name="Roblox";    ok=(Test-Path "$env:LOCALAPPDATA\Roblox\Versions")},@{name="EVKey";     ok=(Test-Path "C:\ALB-Apps\EVKey\EVKey64.exe")},@{name="Tailscale"; ok=(Test-Path "C:\Program Files\Tailscale\tailscale.exe")},@{name="Sunshine";  ok=(Test-Path "C:\Program Files\Sunshine\sunshine.exe")}) }'
              '            $cacheTime = $now'
              '        }'
              '        if (($path -eq "/api/status") -or ($path -eq "/health")) { $statCache["remaining_seconds"] = $remain; $statCache["remaining_display"] = "$([math]::Floor($remain/3600))h$([math]::Floor(($remain%3600)/60))m$($remain%60)s"; $json = $statCache | ConvertTo-Json -Compress -Depth 5; $buf = [System.Text.Encoding]::UTF8.GetBytes($json); $resp.ContentType = "application/json; charset=utf-8"; $resp.ContentLength64 = $buf.Length; $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close(); continue }'
              '        if (($req.HttpMethod -eq "POST") -and ($path -like "/api/action/*")) { $action = $path -replace "/api/action/", ""; if ($action -eq "save") { Set-Content "$env:CONTROL_SIGNAL_FILE" "SAVE_NOW" -Encoding UTF8; $resJson = ''{"ok":true,"action":"save"}'' } elseif ($action -eq "restart") { Set-Content "$env:CONTROL_SIGNAL_FILE" "RESTART_SESSION" -Encoding UTF8; $resJson = ''{"ok":true,"action":"restart"}'' } elseif ($action -eq "stop") { Set-Content "$env:CONTROL_SIGNAL_FILE" "STOP_SESSION" -Encoding UTF8; $resJson = ''{"ok":true,"action":"stop"}'' } else { $resJson = ''{"ok":false,"error":"invalid"}'' }; $buf = [System.Text.Encoding]::UTF8.GetBytes($resJson); $resp.ContentType = "application/json; charset=utf-8"; $resp.ContentLength64 = $buf.Length; $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close(); continue }'
              '        $html = Get-Content -Raw "$env:RUNNER_TEMP\panel.html" -Encoding UTF8; $buf = [System.Text.Encoding]::UTF8.GetBytes($html); $resp.ContentType = "text/html; charset=utf-8"; $resp.ContentLength64 = $buf.Length; $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close()'
              '    } catch {}'
              '}'
          )
          $webScriptPath = "$env:RUNNER_TEMP\web-panel.ps1"
          Set-Content -Path $webScriptPath -Value ($webScriptLines -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile','-WindowStyle','Hidden','-File',"`"$webScriptPath`""
          Start-Sleep -Seconds 2
          exit 0

      - name: 🔍 VERIFY LINK
