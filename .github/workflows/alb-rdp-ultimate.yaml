      - name: 🌐 Tailscale (FIX UNATTENDED + VERIFY)
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          if (-not ("$env:TAILSCALE_AUTH_KEY")) { exit 1 }
          $ProgressPreference = 'SilentlyContinue'; $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path "$ts")) { Remove-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*Tailscale*' -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*Tailscale*' -Recurse -Force -ErrorAction SilentlyContinue; Get-Process -Name 'msiexec' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; $msiCache = [System.IO.Path]::Combine("$env:INSTALLER_CACHE", 'tailscale-premium.msi'); if ((Test-Path "$msiCache") -and ((Get-Item "$msiCache").Length -lt 5MB)) { Remove-Item -Path "$msiCache" -Force -ErrorAction SilentlyContinue }; if (-not (Test-Path "$msiCache")) { try { Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile "$msiCache" -UseBasicParsing } catch {} }; if (Test-Path "$msiCache") { $localMsi = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'tailscale-setup.msi'); Copy-Item -Path "$msiCache" -Destination "$localMsi" -Force; Start-Process msiexec.exe -ArgumentList "/i `"$localMsi`" /quiet /norestart" -Wait }; if (-not (Test-Path "$ts")) { $exePath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'tailscale-setup-latest.exe'); try { Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile "$exePath" -UseBasicParsing; if (Test-Path "$exePath") { Start-Process -FilePath "$exePath" -ArgumentList '/S', '/norestart' -Wait } } catch {} }; if (-not (Test-Path "$ts")) { choco install tailscale -y --no-progress --limit-output --ignore-checksums 2>&1 | Out-Null; $global:LASTEXITCODE = 0 } }
          if (-not (Test-Path "$ts")) { exit 1 }
          Set-Service -Name 'Tailscale' -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name 'Tailscale' -ErrorAction SilentlyContinue; Start-Sleep -Seconds 6
          $tsHost = "alb-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)"; & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset --unattended
          if (($LASTEXITCODE) -ne 0) { Start-Sleep -Seconds 5; & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset --unattended; if (($LASTEXITCODE) -ne 0) { exit 1 } }
          & "$ts" set --unattended=true
          Start-Sleep -Seconds 2
          Write-Host "  OK: Tailscale unattended mode enabled" -ForegroundColor Green
          $ip = $null; 1..20 | ForEach-Object { if (-not ($ip)) { $out = (& "$ts" ip -4 2>&1 | Out-String).Trim(); if ("$out" -match '^\d+\.\d+\.\d+\.\d+$') { $ip = "$out" } else { Start-Sleep -Seconds 3 } } }
          if (-not ($ip)) { exit 1 }; "TAILSCALE_IP=$ip" >> "$env:GITHUB_ENV"
          Write-Host "  Verify Tailscale connectivity..." -ForegroundColor Cyan
          $pingOk = $false
          1..10 | ForEach-Object { if (-not $pingOk) { $pingResult = & "$ts" ping "$ip" 2>&1 | Out-String; if ($pingResult -match 'pong') { $pingOk = $true } else { Start-Sleep -Seconds 3 } } }
          if ($pingOk) { Write-Host "  OK: Tailscale ping thanh cong" -ForegroundColor Green } else { Write-Host "  WARN: Tailscale ping that bai" -ForegroundColor Yellow }
          Write-Host "  Verify RDP port 3389 tren IP $ip..." -ForegroundColor Cyan
          $rdpOk = $false
          1..15 | ForEach-Object { if (-not $rdpOk) { $test = Test-NetConnection -ComputerName $ip -Port 3389 -WarningAction SilentlyContinue; if ($test.TcpTestSucceeded) { $rdpOk = $true } else { Start-Sleep -Seconds 3 } } }
          if ($rdpOk) { Write-Host "  OK: RDP port 3389 listen tren $ip" -ForegroundColor Green } else { Write-Host "  WARN: RDP port 3389 chua listen, restart TermService..." -ForegroundColor Yellow; Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 5; $test = Test-NetConnection -ComputerName $ip -Port 3389 -WarningAction SilentlyContinue; if ($test.TcpTestSucceeded) { Write-Host "  OK: RDP port 3389 listen sau restart" -ForegroundColor Green } else { Write-Host "  ERROR: RDP port 3389 KHONG listen" -ForegroundColor Red } }
          exit 0

      - name: 👤 User gốc + User ngoài + Sunshine
        shell: pwsh
