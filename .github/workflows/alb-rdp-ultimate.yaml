              $skipRestoreDirs = @("$oldProf\AppData\Roaming\Microsoft\Protect","$oldProf\AppData\Roaming\Microsoft\Crypto","$oldProf\AppData\Local\Microsoft\Credentials","$oldProf\AppData\Roaming\Microsoft\Credentials","$oldProf\AppData\Local\Packages","$oldProf\AppData\Local\TileDataLayer","$oldProf\AppData\Local\ConnectedDevicesPlatform","$oldProf\AppData\Local\Microsoft\Windows\Explorer")
