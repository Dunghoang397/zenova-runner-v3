      - name: ⚙️ Chế Độ Chuyên Nghiệp (RDP 60FPS + Fix Lag Tuyệt Đối + Mở Khóa 100% CPU)
        shell: pwsh
        timeout-minutes: 3
        env:
          OPT_WIN: ${{ inputs.optimize_windows }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fSingleSessionPerUser 0 -Type DWord -Force

          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          @{
            UserAuthentication = 0
            SecurityLayer = 0
            fPromptForPassword = 0
            fEnableRemoteFX = 1
            fNoRemoteDesktopWallpaper = 0
            fDisableAudioCapture = 0
            fDisableCam = 0
            MaxIdleTime = 0
            MaxDisconnectionTime = 0
            MaxConnectionTime = 0
            fResetBroken = 0
            MinSendInterval = 10
            KeepAliveEnable = 1
          }.GetEnumerator() | ForEach-Object { Set-ItemProperty $p $_.Key $_.Value -Type DWord -Force }

          $rdpPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $rdpPol -Force | Out-Null
          Remove-ItemProperty -Path $rdpPol -Name 'fPromptForPassword' -Force -EA SilentlyContinue
          Remove-ItemProperty -Path $rdpPol -Name 'EnforceRemovalOfRemoteDesktopWallpaper' -Force -EA SilentlyContinue
          @{
            ColorDepth = 5
            MaxMonitors = 4
            fDisableAudioCapture = 0
            fDisableCam = 0
            fNoRemoteDesktopWallpaper = 0
            AVC444ModePreferred = 1
            AVCHardwareEncodePreferred = 1
            MinEncryptionLevel = 2
            MaxIdleTime = 0
            MaxDisconnectionTime = 0
            fResetBroken = 0
          }.GetEnumerator() | ForEach-Object { Set-ItemProperty $rdpPol $_.Key $_.Value -Type DWord -Force }
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force

          $rdpidd = 'C:\Windows\System32\drivers\UMDF\RDPidd.dll'
          if (Test-Path $rdpidd) {
            & takeown.exe /F $rdpidd /A *> $null
            & icacls.exe $rdpidd /grant "*S-1-5-32-544:F" /Q *> $null
            & icacls.exe $rdpidd /grant:r "*S-1-5-32-545:(RX)" /Q *> $null
          }

          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Tailscale-ICMP') | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -EA SilentlyContinue }
          New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Tailscale-ICMP' -Direction Inbound -Action Allow -Protocol ICMPv4 -Profile Any | Out-Null

          Set-Service TermService -StartupType Automatic -EA SilentlyContinue
          Set-Service UmRdpService -StartupType Automatic -EA SilentlyContinue
          Start-Service TermService -EA SilentlyContinue
          Start-Service UmRdpService -EA SilentlyContinue

          if ($env:OPT_WIN -eq 'true') {
            tzutil /s 'SE Asia Standard Time' 2>$null
            $ult = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
            if ($ult -match '([a-f0-9\-]{36})') { & powercfg /setactive $Matches[1] 2>$null } else { & powercfg /setactive SCHEME_MIN 2>$null }
            & powercfg /change standby-timeout-ac 0
            & powercfg /change monitor-timeout-ac 0
            & powercfg /change disk-timeout-ac 0
            & powercfg /hibernate off
            & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMIN 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMAX 100 2>$null
            & powercfg /setactive scheme_current 2>$null

            @(
              @{ P = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\CPU'; N = 'EnableCPUQuota' },
              @{ P = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\Disk'; N = 'EnableDiskQuota' },
              @{ P = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\NetBandWidth'; N = 'EnableNetworkQuota' }
            ) | ForEach-Object { if (Test-Path $_.P) { Set-ItemProperty -Path $_.P -Name $_.N -Value 0 -Type DWord -Force } }

            $pt = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
            New-Item $pt -Force | Out-Null
            Set-ItemProperty $pt PowerThrottlingOff 1 -Type DWord -Force
            Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Type DWord -Force
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' -Name 'HwSchMode' -Value 2 -Type DWord -Force
            $memMgmt = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
            Set-ItemProperty -Path $memMgmt -Name 'DisablePagingExecutive' -Value 1 -Type DWord -Force
            Set-ItemProperty -Path $memMgmt -Name 'FeatureSettingsOverride' -Value 3 -Type DWord -Force
            Set-ItemProperty -Path $memMgmt -Name 'FeatureSettingsOverrideMask' -Value 3 -Type DWord -Force

            $mmPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
            New-Item -Path $mmPath -Force | Out-Null
            Set-ItemProperty -Path $mmPath -Name 'NetworkThrottlingIndex' -Value 4294967295 -Type DWord -Force
            Set-ItemProperty -Path $mmPath -Name 'SystemResponsiveness' -Value 0 -Type DWord -Force
            Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces' -EA SilentlyContinue | ForEach-Object {
              Set-ItemProperty -Path $_.PSPath -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force -EA SilentlyContinue
              Set-ItemProperty -Path $_.PSPath -Name 'TCPNoDelay' -Value 1 -Type DWord -Force -EA SilentlyContinue
            }

            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'MenuShowDelay' -Value '0' -Force
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'AutoEndTasks' -Value '1' -Force
            Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'EnableTransparency' -Value 0 -Type DWord -Force

            & fsutil behavior set disablelastaccess 1 *> $null
            & fsutil behavior set disable8dot3 1 *> $null
            & netsh int tcp set global autotuninglevel=normal *> $null
            & netsh int tcp set global rss=enabled *> $null

            @('wuauserv','UsoSvc','DiagTrack','WSearch','SysMain','WerSvc','Spooler','MapsBroker','PcaSvc','RetailDemo') | ForEach-Object {
              Stop-Service -Name $_ -Force -EA SilentlyContinue
              Set-Service -Name $_ -StartupType Disabled -EA SilentlyContinue
            }
            try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch {}
          }

          $cpuObj = Get-CimInstance Win32_Processor -EA SilentlyContinue | Select-Object -First 1
          $cpuInfo = if ($cpuObj) { "$($cpuObj.Name.Trim()) ($($cpuObj.NumberOfLogicalProcessors) vCPU @ $($cpuObj.MaxClockSpeed)MHz)" } else { "$env:PROCESSOR_IDENTIFIER ($env:NUMBER_OF_PROCESSORS vCPU)" }
          "CPU_MODEL_INFO=$cpuInfo" >> $env:GITHUB_ENV
          Write-Host "✅ Đã kích hoạt Chế độ Chuyên Nghiệp Fix Lag: $cpuInfo" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🌐 Thiết Lập Mạng Tailscale & DuckDNS
        timeout-minutes: 4
        env:
          EN_TS: ${{ inputs.enable_tailscale }}
          EN_DNS: ${{ inputs.enable_duckdns }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tsIp = '127.0.0.1'; $tsStatus = 'DISABLED'; $funnelUrl = ''
          if ($env:EN_TS -eq 'true') {
            if (-not $env:TAILSCALE_AUTH_KEY) { $tsStatus = 'NO_KEY' } else {
              try {
                $ts = 'C:\Program Files\Tailscale\tailscale.exe'
                if (-not (Test-Path $ts)) {
                  $msi = "$env:INSTALLER_CACHE\tailscale.msi"
                  if (Test-Path $msi) { Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -NoNewWindow }
                }
                if (Test-Path $ts) {
                  Set-Service Tailscale -StartupType Automatic -EA SilentlyContinue
                  Start-Service Tailscale -EA SilentlyContinue
                  Start-Sleep -Seconds 2
                  & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=zenova-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)" --accept-routes --accept-dns --reset --unattended
                  if ($LASTEXITCODE -eq 0) {
                    & $ts set --unattended=true 2>&1 | Out-Null
                    1..15 | ForEach-Object {
                      if ($tsIp -eq '127.0.0.1') {
                        $ipOut = (& $ts ip -4 2>&1 | Out-String).Trim()
                        if ($ipOut -match '^\d+\.\d+\.\d+\.\d+$') { $tsIp = $ipOut; $tsStatus = 'CONNECTED' } else { Start-Sleep -Seconds 2 }
                      }
                    }
                    try {
                      & $ts funnel reset 2>&1 | Out-Null
                      & $ts funnel --bg $env:WEB_PORT 2>&1 | Out-Null
                      Start-Sleep -Seconds 2
                      $fStat = (& $ts funnel status 2>&1 | Out-String)
                      if ($fStat -match '(https://[^\s]+)') { $funnelUrl = $Matches[1].TrimEnd('/') }
                    } catch {}
                  } else { $tsStatus = 'AUTH_FAIL' }
                } else { $tsStatus = 'INSTALL_FAIL' }
              } catch { $tsStatus = 'ERROR' }
            }
          }
          "TAILSCALE_IP=$tsIp" >> $env:GITHUB_ENV; "FUNNEL_URL=$funnelUrl" >> $env:GITHUB_ENV; "TS_STATUS=$tsStatus" >> $env:GITHUB_ENV
          $pubIp = ''; try { $pubIp = (Invoke-WebRequest -Uri 'https://api.ipify.org' -UseBasicParsing -TimeoutSec 5).Content.Trim() } catch {}
          $ddnsUrl = ''
          if ($env:EN_DNS -eq 'true' -and $env:DUCKDNS_TOKEN -and $env:DUCKDNS_DOMAIN) {
            try {
              $targetIp = if ($tsIp -ne '127.0.0.1') { $tsIp } else { $pubIp }
              $cleanDom = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$', ''
              $res = (Invoke-WebRequest -Uri "https://www.duckdns.org/update?domains=$cleanDom&token=$env:DUCKDNS_TOKEN&ip=$targetIp" -UseBasicParsing -TimeoutSec 8).Content.Trim()
              if ($res -eq 'OK') { $ddnsUrl = "${cleanDom}.duckdns.org" }
            } catch {}
          }
          "DUCKDNS_URL=$ddnsUrl" >> $env:GITHUB_ENV; "DUCKDNS_PUBLIC_IP=$pubIp" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP: $tsIp [$tsStatus] | DuckDNS: $ddnsUrl" -ForegroundColor Green
          $global:LASTEXITCODE = 0

