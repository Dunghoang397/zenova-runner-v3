CreateObject("WScript.Shell").Run "powershell.exe -NoProfile -WindowStyle Hidden -Command `"Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport(`"user32.dll`")] public static extern int SystemParametersInfo(int u, int p, string l, int f); }'; [W]::SystemParametersInfo(20, 0, '$wallDest', 3); RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True`"", 0, False
"@
            $startupAll = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup'
            New-Item -ItemType Directory -Force -Path $startupAll | Out-Null
            Set-Content -Path "$startupAll\SetZenovaWallpaper.vbs" -Value $vbsContent -Encoding ASCII -Force
            "WALLPAPER_STATUS=Zenova Original (Fix 100%)" >> $env:GITHUB_ENV
