            Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'ZenovaWallpaper' -Value $runCmd -Force -EA SilentlyContinue
            & schtasks.exe /Create /TN "ALB-Enforce-Wallpaper" /TR $runCmd /SC ONLOGON /RU $user /RL HIGHEST /IT /F *> $null

            "WALLPAPER_STATUS=$($foundRepoImg.Name) (Original 100%)" >> $env:GITHUB_ENV
          } else {
