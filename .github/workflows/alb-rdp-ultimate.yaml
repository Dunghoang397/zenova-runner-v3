name: ALB-VPSFREE-ULTIMATE

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy & bản lưu riêng (VD: may-phu-1, may-phu-2 để chạy song song)'
        required: false
        default: 'may-phu-2'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng (tính từ lúc job bắt đầu)'
        required: false
        default: '5h00m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h00m'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới sau khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt chứa Hệ Điều Hành & Dữ Liệu'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo VHDX tối đa (GB - co giãn động)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows (Hỗ trợ cả Win 2022 & 2025, giữ cố định giữa các phiên)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: '🔐 Mật khẩu cố định cho RDP (runneradmin), Sunshine & Web Panel'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo mặc định cho Sunshine & StarDesk'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'
      wallpaper_url:
        description: '🖼️ Link ảnh nền Zenova Cloud trực tiếp (Để trống sẽ tự lấy ảnh trong Repo hoặc tự tạo)'
        required: false
        default: ''
        type: string
      choco_packages:
        description: '📦 App cài thêm bằng choco (tự động lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Fix lag Windows toàn diện & Mở khóa 100% xung nhịp CPU'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Bật mạng Tailscale & Tailscale Funnel'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS trỏ về IP Tailscale (cần secret DUCKDNS_TOKEN + DUCKDNS_DOMAIN)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'may-phu-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'

    steps:
      # ───────────────────────────────────────────────
      # 0. KIỂM TRA FILE ẢNH NỀN TRONG REPO (NẾU CÓ)
      # ───────────────────────────────────────────────
      - name: 📥 Đồng bộ file cấu hình & Ảnh nền từ Repository
        uses: actions/checkout@v4
        continue-on-error: true

      # ───────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG X:\ & CHUẨN BỊ KHO LƯU THEO MÁY
      # ───────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng X:\ & Chuẩn bị thông số Kho Lưu riêng theo máy
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV"

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', ''
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'may-phu-1' }

          # Hỗ trợ tương thích cả tag alb-storage lẫn aistv-storage
          $relTag      = "alb-storage-$cleanId"
          $stateBranch = "alb-state-$cleanId"
          $null = gh release view "aistv-storage-$cleanId" --repo "$env:GH_REPO" 2>&1
          if (($LASTEXITCODE) -eq 0) {
              $relTag      = "aistv-storage-$cleanId"
              $stateBranch = "aistv-state-$cleanId"
          }

          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV"
          "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV"
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV"

          $total = 300
          $display = '5 giờ 00 phút'
          if ("$env:INPUT_DURATION" -eq '1h') {
              $total = 60
              $display = '1 giờ'
          } elseif ("$env:INPUT_DURATION" -eq '3h') {
              $total = 180
              $display = '3 giờ'
          }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV"
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV"

          $user     = "$env:USERNAME"
          $profPath = "$env:USERPROFILE"
          "RDP_USER=$user" >> "$env:GITHUB_ENV"
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV"

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper()
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV"

          $vhdContainer = 'C:\ALB-VHD-HOST'
          New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'alb-os-disk.vhdx')

          $sizeBytes = ([int64]"$env:VHD_SIZE_GB") * 1GB
          Write-Host "💽 Đang dựng ổ đĩa riêng ${dl}:\ ($env:VHD_SIZE_GB GB Dynamic VHDX) cho máy [$cleanId]..." -ForegroundColor Cyan
          $mounted = $false
          try {
              if (-not (Test-Path "$vhdFile")) {
                  New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ALB-OS' -Confirm:($false) | Out-Null
              } else {
                  Mount-VHD -Path "$vhdFile"
              }
              $null = Get-PSDrive -Name "$dl" -ErrorAction Stop
              if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {
              Write-Host "⚠️ Chuyển sang cơ chế Ổ Đĩa Ảo Kernel DOS Devices cho ${dl}:\..." -ForegroundColor Yellow
          }

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT')
              New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null
              & subst "${dl}:" "$fallbackDir"
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue
          }

          $sharedRoot       = "${dl}:\ALB-SYSTEM"
          $sharedSessionDir = "$sharedRoot\sessions"
          $sharedDataDir    = "$sharedRoot\DATA"
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY"
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json"
          $profileStoreRoot = "$sharedRoot\Users"
          $baselineFile     = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json')
          $controlSignal    = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'alb-control-action.txt')

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null
          }

          $baseline = @{
              PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              PD   = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
          }
          $baseline | ConvertTo-Json -Depth 4 | Set-Content -Path "$baselineFile" -Encoding UTF8

          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV"
          "VHD_FILE=$vhdFile" >> "$env:GITHUB_ENV"
          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV"
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV"
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV"
          "SHARED_OS_DIR=$sharedOsDir" >> "$env:GITHUB_ENV"
          "SHARED_STATE_FILE=$sharedStateFile" >> "$env:GITHUB_ENV"
          "PROFILE_ROOT=$profileStoreRoot" >> "$env:GITHUB_ENV"
          "BASELINE_FILE=$baselineFile" >> "$env:GITHUB_ENV"
          "CONTROL_SIGNAL_FILE=$controlSignal" >> "$env:GITHUB_ENV"

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild
          "OS_BUILD=$build" >> "$env:GITHUB_ENV"

          $null = gh release view "$relTag" --repo "$env:GH_REPO" 2>&1
          if (($LASTEXITCODE) -ne 0) {
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt')
              Set-Content -Path "$dummy" -Value "ALB Persistent Storage Initialized for $cleanId" -Encoding UTF8
              gh release create "$relTag" "$dummy" --repo "$env:GH_REPO" --title "ALB Storage ($cleanId)" --notes "Kho lưu trữ ổ đĩa tự động của máy [$cleanId]"
          }
          $global:LASTEXITCODE = 0
          Write-Host "✅ Đã mount ổ đĩa ${dl}:\ ($sharedRoot) | Máy: $cleanId | Kho lưu: $relTag" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 2. TẠO ENGINE ĐỒNG BỘ Ổ ĐĨA LÊN GITHUB (SAVE-DATA.PS1)
      # ───────────────────────────────────────────────
      - name: 🧰 Tạo save-data.ps1 (Lưu Toàn Bộ App, StarDesk, EVKey, VSCode, Bandicam & Profile)
        shell: pwsh
        run: |
          $scriptLines = @(
              'param([string]$Reason = "session-end")'
              '$ErrorActionPreference = "Continue"'
              'if (("$env:DATA_RESTORED" -ne "1") -or ("$env:SESSION_READY" -ne "1")) {'
              '    Write-Host "⚠️ Phiên chưa khởi tạo hoàn chỉnh, bỏ qua lưu để bảo vệ dữ liệu gốc" -ForegroundColor Yellow'
              '    exit 0'
              '}'
              '$root = "$env:SHARED_ROOT"; $osDir = "$env:SHARED_OS_DIR"; $dl = "$env:MOUNT_LETTER"'
              'if ((-not ("$root")) -or (-not (Test-Path "$root"))) { exit 0 }'
              'try {'
              '    $cDrive = Get-PSDrive -Name "C" -ErrorAction Stop'
              '    $freeGB = [math]::Round($cDrive.Free / 1GB, 2)'
              '    if ($freeGB -lt 2.0) {'
              '        Write-Host "⚠️ Ổ C:\ còn ít hơn 2GB trống ($freeGB GB), dọn Temp trước khi nén..." -ForegroundColor Yellow'
              '        Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue'
              '    }'
              '} catch {}'
              'Write-Host "💾 [$Reason] Đang đóng an toàn các trình duyệt & ứng dụng để nhả khóa Cookie/Session..." -ForegroundColor Cyan'
              '$appsToClose = @("chrome","msedge","brave","firefox","coccoc","opera","vivaldi","discord","Telegram","Zalo","steam","EpicGamesLauncher","Spotify","Code","Notion","StarDesk","EVKey","EVKey64","bdcam")'
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow() }'
              'Start-Sleep -Seconds 3'
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue'
              'if ("$Reason" -eq "session-end") {'
              '    Get-Service -Name "*StarDesk*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue'
              '    Get-Process -Name "StarDesk*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue'
              '    & taskkill.exe /F /IM "StarDesk*" /T *> $null'
              '}'
              'Start-Sleep -Seconds 2'
              'Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue'
              '$u = "$env:RDP_USER"; $profSrc = "$env:PROFILE_PATH"'
              'if (("$profSrc") -and (Test-Path "$profSrc\AppData")) {'
              '    Get-ChildItem -Path "$profSrc\AppData" -Filter "Local State" -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {'
              '        try {'
              '            $lsFile = $_.FullName'
              '            $lsJson = Get-Content -Raw -Path "$lsFile" -Encoding UTF8 | ConvertFrom-Json'
              '            if ($lsJson.os_crypt -and $lsJson.os_crypt.encrypted_key) {'
              '                $encBytes = [Convert]::FromBase64String($lsJson.os_crypt.encrypted_key)'
              '                if ($encBytes.Length -gt 5) {'
              '                    $prefix = [System.Text.Encoding]::ASCII.GetString($encBytes[0..4])'
              '                    if ($prefix -eq "DPAPI") {'
              '                        $cipher = $encBytes[5..($encBytes.Length - 1)]'
              '                        $rawKey = [System.Security.Cryptography.ProtectedData]::Unprotect($cipher, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser)'
              '                        $b64Key = [Convert]::ToBase64String($rawKey)'
              '                        $b64Key | Set-Content -Path "$lsFile.albkey" -Encoding ASCII -Force'
              '                        $b64Key | Set-Content -Path "$lsFile.aistvkey" -Encoding ASCII -Force'
              '                    }'
              '                }'
              '            }'
              '        } catch {}'
              '    }'
              '}'
              '$regBk = [System.IO.Path]::Combine("$osDir", "Registry"); New-Item -ItemType Directory -Force -Path "$regBk" | Out-Null'
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null'
              'reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x86.reg" /y *> $null'
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null'
              'reg export "HKLM\SOFTWARE\Microsoft\Cryptography" "$regBk\Machine-Cryptography.reg" /y *> $null'
              'reg export "HKLM\SOFTWARE\Microsoft\SQMClient" "$regBk\Machine-SQMClient.reg" /y *> $null'
              'New-Item -ItemType Directory -Force -Path "$regBk\AppSoftware" | Out-Null'
              'Get-ChildItem "HKCU:\Software" -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -notin @("Microsoft","Classes","Policies","RegisteredApplications") } | ForEach-Object {'
              '    $subName = $_.PSChildName; $safeName = ($subName -replace "[^A-Za-z0-9._\-]", "_")'
              '    reg export "HKCU\Software\$subName" "$regBk\AppSoftware\App-$safeName.reg" /y *> $null'
              '}'
              'reg export "HKCU\Environment" "$regBk\User-Env.reg" /y *> $null'
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" "$regBk\User-StartupRun.reg" /y *> $null'
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\Configuration" "$regBk\Display-Config.reg" /y *> $null'
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\Connectivity" "$regBk\Display-Conn.reg" /y *> $null'
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\ScaleFactors" "$regBk\Display-Scale.reg" /y *> $null'
              'reg export "HKCU\Control Panel\Desktop" "$regBk\User-Desktop.reg" /y *> $null'
              'reg export "HKCU\Control Panel\Desktop\WindowMetrics" "$regBk\User-WindowMetrics.reg" /y *> $null'
              'reg export "HKCU\Control Panel\Personalization" "$regBk\User-Personalization.reg" /y *> $null'
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" "$regBk\User-Themes.reg" /y *> $null'
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" "$regBk\User-Wallpapers.reg" /y *> $null'
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" "$regBk\User-Explorer.reg" /y *> $null'
              'reg export "HKCU\Software\Microsoft\Multimedia\Audio" "$regBk\User-Audio.reg" /y *> $null'
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio" "$regBk\System-MMDevices-Audio.reg" /y *> $null'
              'if (("$u") -and ("$profSrc") -and (Test-Path "$profSrc")) {'
              '    $profDst = [System.IO.Path]::Combine("$root", "Users", "$u"); New-Item -ItemType Directory -Force -Path "$profDst" | Out-Null'
              '    $excludeDirs = @("$profSrc\AppData\Roaming\Microsoft\Protect","$profSrc\AppData\Roaming\Microsoft\Crypto","$profSrc\AppData\Local\Microsoft\Credentials","$profSrc\AppData\Roaming\Microsoft\Credentials","$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages","$profSrc\AppData\Local\TileDataLayer","$profSrc\AppData\Local\ConnectedDevicesPlatform","$profSrc\AppData\Local\Microsoft\Windows\Explorer","$profSrc\AppData\Local\Microsoft\Windows\INetCache","$profSrc\AppData\Local\Microsoft\Windows\WebCache","$profSrc\AppData\Local\Microsoft\Windows\Caches","$profSrc\AppData\Local\D3DSCache","$profSrc\AppData\Local\NuGet","$profSrc\AppData\Local\Package Cache","$profSrc\AppData\Local\CrashDumps","$profSrc\AppData\Local\pip","$profSrc\AppData\Local\npm-cache","$profSrc\AppData\Local\yarn","$profSrc\AppData\Local\go-build","$profSrc\AppData\Local\ms-playwright","$profSrc\AppData\Local\Cypress","$profSrc\.dotnet","$profSrc\.nuget","$profSrc\.m2","$profSrc\.cargo","$profSrc\.rustup","$profSrc\.templateengine","$profSrc\.azure","$profSrc\.ServiceHub","$profSrc\vcpkg")'
              '    robocopy "$profSrc" "$profDst" /MIR /XJ /R:2 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* WebCacheV01.dat parent.lock lockfile SingletonLock SingletonCookie SingletonSocket /XD @excludeDirs *> $null'
              '    $global:LASTEXITCODE = 0'
              '}'
              'if (("$env:BASELINE_FILE") -and (Test-Path "$env:BASELINE_FILE")) {'
              '    try {'
              '        $base = Get-Content -Raw -Path "$env:BASELINE_FILE" | ConvertFrom-Json'
              '        $skipNames = @("Tailscale","chocolatey","Package Cache","Microsoft","Windows Defender")'
              '        $cOverlay = [System.IO.Path]::Combine("$osDir", "C-Drive-Overlay")'
              '        New-Item -ItemType Directory -Force -Path "$cOverlay\PF64", "$cOverlay\PF86", "$cOverlay\PD" | Out-Null'
              '        Get-ChildItem "C:\Program Files" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PF64)) -and ($_.Name -notin ($skipNames)) } | ForEach-Object { $dest = [System.IO.Path]::Combine("$cOverlay\PF64", $_.Name); robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }'
              '        Get-ChildItem "C:\Program Files (x86)" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PF86)) -and ($_.Name -notin $skipNames) } | ForEach-Object { $dest = [System.IO.Path]::Combine("$cOverlay\PF86", $_.Name); robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }'
              '        Get-ChildItem "C:\ProgramData" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PD)) -and ($_.Name -notin $skipNames) } | ForEach-Object { $dest = [System.IO.Path]::Combine("$cOverlay\PD", $_.Name); robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }'
              '    } catch {}'
              '}'
              'try {'
              '    $extraRoot = [System.IO.Path]::Combine("$osDir", "DriveRoot-Extra"); New-Item -ItemType Directory -Force -Path "$extraRoot" | Out-Null'
              '    Get-ChildItem "${dl}:\" -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin @("ALB-SYSTEM","AISTV-SYSTEM","System Volume Information","$RECYCLE.BIN","Pagefile.sys") } | ForEach-Object {'
              '        $dest = [System.IO.Path]::Combine("$extraRoot", $_.Name)'
              '        if ($_.PSIsContainer) { robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null } else { Copy-Item -Path ($_.FullName) -Destination "$dest" -Force -ErrorAction SilentlyContinue }'
              '    }'
              '} catch {}'
              '$sdBackupDir = [System.IO.Path]::Combine("$osDir", "StarDesk-Backup"); New-Item -ItemType Directory -Force -Path "$sdBackupDir" | Out-Null'
              'if (Test-Path "C:\Program Files\StarDesk") { robocopy "C:\Program Files\StarDesk" "$sdBackupDir\ProgramFiles" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }'
              'if (Test-Path "C:\ProgramData\StarDesk") { robocopy "C:\ProgramData\StarDesk" "$sdBackupDir\ProgramData" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }'
              'if (Test-Path "$env:LOCALAPPDATA\StarDesk") { robocopy "$env:LOCALAPPDATA\StarDesk" "$sdBackupDir\LocalAppData" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }'
              'if (Test-Path "$env:APPDATA\StarDesk") { robocopy "$env:APPDATA\StarDesk" "$sdBackupDir\RoamingAppData" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }'
              'if (Test-Path "$env:USERPROFILE\.stardesk") { robocopy "$env:USERPROFILE\.stardesk" "$sdBackupDir\DotStarDesk" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }'
              '$sdRegDir = [System.IO.Path]::Combine("$sdBackupDir", "Registry"); New-Item -ItemType Directory -Force -Path "$sdRegDir" | Out-Null'
              'reg export "HKCU\Software\StarDesk" "$sdRegDir\HKCU-StarDesk.reg" /y *> $null; reg export "HKLM\SOFTWARE\StarDesk" "$sdRegDir\HKLM-StarDesk.reg" /y *> $null; reg export "HKLM\SOFTWARE\WOW6432Node\StarDesk" "$sdRegDir\HKLM-WOW6432-StarDesk.reg" /y *> $null'
              '$evKeyDir = [System.IO.Path]::Combine("$osDir", "EVKey"); New-Item -ItemType Directory -Force -Path "$evKeyDir" | Out-Null'
              'if (Test-Path "C:\ALB-Apps\EVKey") { robocopy "C:\ALB-Apps\EVKey" "$evKeyDir" /MIR /XJ /R:1 /W:1 /MT:4 /NFL /NDL /NJH /NJS /NP *> $null }'
              '$global:LASTEXITCODE = 0'
              '$gitStage = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "git-state-sync")'
              'try {'
              '    if (Test-Path "$gitStage") { Remove-Item -Path "$gitStage" -Recurse -Force -ErrorAction SilentlyContinue }'
              '    New-Item -ItemType Directory -Force -Path "$gitStage" | Out-Null; Push-Location "$gitStage"'
              '    git init -q; git config user.name "ALB-Bot"; git config user.email "bot@alb.local"'
              '    $encodedToken = [System.Uri]::EscapeDataString($env:GH_TOKEN)'
              '    git remote add origin "https://x-access-token:$encodedToken@github.com/$($env:GH_REPO).git"'
              '    git fetch origin "$env:STATE_BRANCH" -q 2>$null'
              '    if (($LASTEXITCODE) -eq 0) { git checkout -B "$env:STATE_BRANCH" "origin/$env:STATE_BRANCH" -q } else { git checkout --orphan "$env:STATE_BRANCH" -q }'
              '    robocopy "$env:SHARED_SESSION_DIR" "$gitStage\sessions" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null'
              '    robocopy "$regBk" "$gitStage\registry" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null'
              '    $global:LASTEXITCODE = 0; git add -A; git commit -m "Sync state [$env:MACHINE_ID - $Reason]" -q 2>$null; git push -u origin "$env:STATE_BRANCH" --force -q 2>$null; Pop-Location'
              '} catch { if (((Get-Location).Path) -eq "$gitStage") { Pop-Location } }'
              '$packDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "alb-pack-$Reason")'
              'if (Test-Path "$packDir") { Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue }'
              'New-Item -ItemType Directory -Force -Path "$packDir" | Out-Null'
              '$archiveBase = [System.IO.Path]::Combine("$packDir", "alb-drive.7z")'
              'Write-Host "📦 [$Reason] Đang nén toàn bộ ổ đĩa $root cho máy [$env:MACHINE_ID]..." -ForegroundColor Cyan'
              'Push-Location "$root"'
              '$sevenZipArgs = @("a", "-t7z", "-mx=1", "-mmt=on", "-ssw", "-v1900m", "$archiveBase", "*", "-xr!Pagefile.sys", "-xr!swapfile.sys", "-xr!System Volume Information")'
              '& 7z @sevenZipArgs *> $null; $sevenZipCode = $LASTEXITCODE; Pop-Location'
              '$chunks = @(Get-ChildItem -Path "$packDir" -Filter "alb-drive.7z.*" | Sort-Object Name)'
              'if (($chunks.Count) -eq 0) { exit 1 }'
              '$manifest = [ordered]@{ machineId = "$env:MACHINE_ID"; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); reason = "$Reason"; osBuild = "$env:OS_BUILD"; chunkCount = $chunks.Count; chunks = @($chunks | ForEach-Object { [ordered]@{ name = $_.Name; size = $_.Length } }) }'
              '$manifestPath = [System.IO.Path]::Combine("$packDir", "drive-manifest.json")'
              '$manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "$manifestPath" -Encoding UTF8'
              '$uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @("$manifestPath"); $uploadOk = $false'
              'for ($i = 1; $i -le 3; $i++) {'
              '    gh release upload "$env:RELEASE_TAG" @uploadFiles --repo "$env:GH_REPO" --clobber'
              '    if (($LASTEXITCODE) -eq 0) { $uploadOk = $true; break }'
              '    Start-Sleep -Seconds 8'
              '}'
              'if (-not $uploadOk) { Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue; exit 1 }'
              'try {'
              '    $relJson = gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" --json assets | ConvertFrom-Json'
              '    $validNames = @($chunks.Name) + @("drive-manifest.json", "init.txt")'
              '    @($relJson.assets) | ForEach-Object {'
              '        if ((($_.name -like "alb-drive.7z.*") -or ($_.name -like "aistv-drive.7z.*")) -and ($_.name -notin ($validNames))) {'
              '            gh release delete-asset "$env:RELEASE_TAG" ($_.name) --repo "$env:GH_REPO" -y *> $null'
              '        }'
              '    }'
              '} catch {}'
              'Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue'
              'Write-Host "✅ [$Reason] Đã lưu trọn vẹn ổ đĩa máy [$env:MACHINE_ID] lên Release [$env:RELEASE_TAG]!" -ForegroundColor Green'
              'exit 0'
          )
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1')
          Set-Content -Path "$saveScriptPath" -Value ($scriptLines -join "`r`n") -Encoding UTF8

      # ───────────────────────────────────────────────
      # 3. KHÔI PHỤC TOÀN BỘ Ổ ĐĨA & PROFILE TỪ GITHUB
      # ───────────────────────────────────────────────
      - name: ♻️ Khôi phục toàn bộ ổ đĩa & nạp thẳng vào User gốc
        shell: pwsh
        run: |
          $dl = "$env:MOUNT_LETTER"
          @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
          ) | ForEach-Object {
              New-Item -Path "$_" -Force | Out-Null
              Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force
          }

          $suffix = (("$env:MACHINE_ID").ToUpper() -replace '[^A-Z0-9]', '')
          if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8) }
          $fixedHost = if ($suffix) { "ALB-$suffix" } else { 'ALB-CLOUD-PC' }
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'Hostname' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'NV Hostname' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore')
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path "$dlDir" | Out-Null

          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null
          $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json')

          if (-not (Test-Path "$manifestFile")) {
              Write-Host "ℹ️ Chưa có bản lưu tại [$env:RELEASE_TAG] - khởi tạo phiên đầu tiên cho [$env:MACHINE_ID]!" -ForegroundColor Cyan
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV"
              exit 0
          }

          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern '*-drive.7z.*' --dir "$dlDir"
          if (($LASTEXITCODE) -ne 0) { exit 1 }

          $firstChunk = Get-ChildItem -Path "$dlDir" -Filter '*.7z.001' | Select-Object -First 1
          if (-not $firstChunk) { exit 1 }

          $stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", 'restore-stage')
          if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path "$stage" | Out-Null

          Write-Host "📂 Đang bung toàn bộ ổ đĩa vào ${dl}:\..." -ForegroundColor Cyan
          & 7z x ($firstChunk.FullName) "-o$stage" -y -mmt=on *> $null
          Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue

          $stateHit = Get-ChildItem -Path "$stage" -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -Force -ErrorAction SilentlyContinue | Select-Object -First 1
          $sourceRoot = "$stage"
          if ($stateHit) { $sourceRoot = $stateHit.Directory.Parent.FullName }

          robocopy "$sourceRoot" "$env:SHARED_ROOT" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null
          $global:LASTEXITCODE = 0
          New-Item -ItemType Directory -Force -Path "$env:SHARED_DATA_DIR" | Out-Null

          $extraRoot = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'DriveRoot-Extra')
          if (Test-Path "$extraRoot") { robocopy "$extraRoot" "${dl}:\" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null; $global:LASTEXITCODE = 0 }

          $cOverlay = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'C-Drive-Overlay')
          if (Test-Path "$cOverlay\PF64") { robocopy "$cOverlay\PF64" 'C:\Program Files' /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
          if (Test-Path "$cOverlay\PF86") { robocopy "$cOverlay\PF86" 'C:\Program Files (x86)' /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
          if (Test-Path "$cOverlay\PD")   { robocopy "$cOverlay\PD" 'C:\ProgramData' /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
          $global:LASTEXITCODE = 0

          $oldProf = [System.IO.Path]::Combine("$env:SHARED_ROOT", 'Users', "$env:RDP_USER")
          if (-not (Test-Path "$oldProf")) {
              $fallbackProf = Get-ChildItem -Path "$env:PROFILE_ROOT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($fallbackProf) { $oldProf = $fallbackProf.FullName }
          }
          if (Test-Path "$oldProf") {
              @("$oldProf\AppData\Roaming\Microsoft\Protect","$oldProf\AppData\Roaming\Microsoft\Crypto","$oldProf\AppData\Local\Microsoft\Credentials","$oldProf\AppData\Roaming\Microsoft\Credentials") | ForEach-Object {
                  if (Test-Path "$_") { Remove-Item -Path "$_" -Recurse -Force -ErrorAction SilentlyContinue }
              }
              $skipRestoreDirs = @("$oldProf\AppData\Roaming\Microsoft\Protect","$oldProf\AppData\Roaming\Microsoft\Crypto","$oldProf\AppData\Local\Microsoft\Credentials","$oldProf\AppData\Roaming\Microsoft\Credentials","$oldProf\AppData\Local\Packages","$oldProf\AppData\Local\TileDataLayer","$oldProf\AppData\Local\ConnectedDevicesPlatform","$oldProf\AppData\Local\Microsoft\Windows\Explorer")
              robocopy "$oldProf" "$env:PROFILE_PATH" /E /XJ /COPY:DAT /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* parent.lock lockfile SingletonLock SingletonCookie SingletonSocket /XD @skipRestoreDirs *> $null
              $global:LASTEXITCODE = 0
          }
          Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue

          $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry')
          if (Test-Path "$regBk") {
              Get-ChildItem -Path "$regBk" -Filter '*.reg' -Recurse | ForEach-Object { reg import ($_.FullName) *>$null }
              & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True
          }

          $sdBackup = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", "StarDesk-Backup")
          if (Test-Path "$sdBackup") {
              if (Test-Path "$sdBackup\ProgramFiles")   { robocopy "$sdBackup\ProgramFiles" "C:\Program Files\StarDesk" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
              if (Test-Path "$sdBackup\ProgramData")    { robocopy "$sdBackup\ProgramData" "C:\ProgramData\StarDesk" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
              if (Test-Path "$sdBackup\LocalAppData")   { robocopy "$sdBackup\LocalAppData" "$env:LOCALAPPDATA\StarDesk" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
              if (Test-Path "$sdBackup\RoamingAppData") { robocopy "$sdBackup\RoamingAppData" "$env:APPDATA\StarDesk" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
              if (Test-Path "$sdBackup\DotStarDesk")    { robocopy "$sdBackup\DotStarDesk" "$env:USERPROFILE\.stardesk" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null }
              $sdRegDir = [System.IO.Path]::Combine("$sdBackup", "Registry")
              if (Test-Path "$sdRegDir") { Get-ChildItem -Path "$sdRegDir" -Filter '*.reg' | ForEach-Object { reg import ($_.FullName) *>$null } }
              $global:LASTEXITCODE = 0
          }

          $evKeyBackup = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", "EVKey")
          if (Test-Path "$evKeyBackup") {
              New-Item -ItemType Directory -Force -Path "C:\ALB-Apps\EVKey" | Out-Null
              robocopy "$evKeyBackup" "C:\ALB-Apps\EVKey" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null
              $global:LASTEXITCODE = 0
          }

          if (Test-Path "$env:SHARED_STATE_FILE") {
              try {
                  $state = Get-Content -Raw -Path "$env:SHARED_STATE_FILE" | ConvertFrom-Json
                  if ($state.password) { "RESTORE_PASS=$($state.password)" >> "$env:GITHUB_ENV" }
              } catch {}
          }

          'DATA_RESTORED=1' >> "$env:GITHUB_ENV"
          Write-Host "✅ Khôi phục dữ liệu máy [$env:MACHINE_ID] hoàn tất!" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 4. GẮN KẾT THƯ MỤC OS & APPS SANG Ổ RIÊNG
      # ───────────────────────────────────────────────
      - name: 🔗 Gắn kết thư mục Hệ Điều Hành & Phần Mềm sang ổ riêng
        shell: pwsh
        run: |
          $osDir      = "$env:SHARED_OS_DIR"
          $appsDir    = [System.IO.Path]::Combine("$osDir", 'InstalledApps')
          $binDir     = [System.IO.Path]::Combine("$osDir", 'bin')
          $chocoCache = [System.IO.Path]::Combine("$osDir", 'choco-cache')
          $instCache  = [System.IO.Path]::Combine("$osDir", 'Installers')
          $sunCfgDir  = [System.IO.Path]::Combine("$osDir", 'Sunshine-Config')
          $wallDir    = [System.IO.Path]::Combine("$osDir", 'Wallpaper')
          $dl         = "$env:MOUNT_LETTER"

          @("$appsDir", "$binDir", "$chocoCache", "$instCache", "$sunCfgDir", "$wallDir", "${dl}:\Apps") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null
          }

          if (-not (Test-Path 'C:\ALB-Apps'))   { New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target "$appsDir" -Force | Out-Null }
          if (-not (Test-Path 'C:\AISTV-Apps')) { New-Item -ItemType Junction -Path 'C:\AISTV-Apps' -Target "$appsDir" -Force | Out-Null }

          $sysEnv  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $curPath = (Get-ItemProperty -Path "$sysEnv" -Name 'Path').Path
          if ("$curPath" -notlike "*$binDir*") {
              Set-ItemProperty -Path "$sysEnv" -Name 'Path' -Value "$binDir;$curPath" -Force
          }

          "INSTALLER_CACHE=$instCache" >> "$env:GITHUB_ENV"
          "SUNSHINE_PERSIST_CFG=$sunCfgDir" >> "$env:GITHUB_ENV"
          "WALLPAPER_DIR=$wallDir" >> "$env:GITHUB_ENV"

      # ───────────────────────────────────────────────
      # 5. CẤU HÌNH RDP 60FPS + CHỐNG KICK + MỞ PORT
      # ───────────────────────────────────────────────
      - name: 🔧 Cấu hình RDP 60FPS, Mở khóa Wallpaper RDP & Firewall
        shell: pwsh
        run: |
          try {
              $sessions = query session 2>$null | Select-String "rdp-tcp" -CaseSensitive:$false
              if ($sessions) {
                  $sessions | ForEach-Object {
                      if ($_ -match 'rdp-tcp#(\d+)') { $sid = $Matches[1]; & tscon.exe $sid /dest:console 2>$null }
                  }
              }
          } catch {}

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fSingleSessionPerUser' -Value 0 -Type DWord -Force

          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path "$p" -Name 'UserAuthentication' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'SecurityLayer' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'fPromptForPassword' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'fResetBroken' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'MaxIdleTime' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'MaxDisconnectionTime' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'MaxConnectionTime' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'fDisableAudioCapture' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'fDisableCam' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'fNoRemoteDesktopWallpaper' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'MinSendInterval' -Value 10 -Type DWord -Force
          Set-ItemProperty -Path "$p" -Name 'KeepAliveEnable' -Value 1 -Type DWord -Force

          $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path "$tsPolicy" -Force | Out-Null
          Set-ItemProperty -Path "$tsPolicy" -Name 'fNoRemoteDesktopWallpaper' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$tsPolicy" -Name 'AVC444ModePreferred' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "$tsPolicy" -Name 'AVCHardwareEncodePreferred' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "$tsPolicy" -Name 'MaxIdleTime' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$tsPolicy" -Name 'MaxDisconnectionTime' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$tsPolicy" -Name 'fResetBroken' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force -ErrorAction SilentlyContinue

          @('ALB-RDP','ALB-Sunshine-TCP','ALB-Sunshine-UDP','RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP') | ForEach-Object {
              Remove-NetFirewallRule -DisplayName "$_" -ErrorAction SilentlyContinue
          }
          New-NetFirewallRule -DisplayName 'ALB-RDP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'ALB-Sunshine-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'ALB-Sunshine-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null

          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Start-Service -Name UmRdpService -ErrorAction SilentlyContinue
          exit 0

      # ───────────────────────────────────────────────
      # 6. FIX LAG WINDOWS TOÀN BỘ & NÂNG CẤP MỞ KHÓA 100% CPU FREE
      # ───────────────────────────────────────────────
      - name: ⚡ Fix Lag Windows Toàn Bộ & Mở Khóa 100% Hiệu Năng CPU (Ultimate Performance)
        if: ${{ inputs.optimize_windows == true || inputs.optimize_windows == 'true' }}
        shell: pwsh
        run: |
          Write-Host "⚡ ĐANG MỞ KHÓA 100% XUNG NHỊP CPU & FIX LAG WINDOWS TOÀN BỘ..." -ForegroundColor Yellow

          # 1. Múi giờ Việt Nam
          tzutil /s 'SE Asia Standard Time'

          # 2. Kích hoạt gói nguồn Ultimate Performance & Mở khóa 100% Core Parking CPU
          try {
              $ultOut = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
              if ($ultOut -match '([a-f0-9\-]{36})') {
                  & powercfg /setactive $Matches[1] 2>$null
              } else {
                  & powercfg /setactive SCHEME_MIN 2>$null
              }
              & powercfg /change standby-timeout-ac 0
              & powercfg /change monitor-timeout-ac 0
              & powercfg /change disk-timeout-ac 0
              & powercfg /hibernate off
              # Mở khóa Core Parking (100% số nhân luôn hoạt động ở mức xung cao nhất)
              & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
              & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
              & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMIN 100 2>$null
              & powercfg -setacvalueindex scheme_current sub_processor PROCTHROTTLEMAX 100 2>$null
              & powercfg /setactive scheme_current 2>$null
          } catch {}

          # 3. Tắt Power Throttling & Tắt Windows Server Fair Share (Để 1 User dùng trọn 100% CPU/Disk/Net)
          $ptPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
          New-Item -Path "$ptPath" -Force | Out-Null
          Set-ItemProperty -Path "$ptPath" -Name 'PowerThrottlingOff' -Value 1 -Type DWord -Force

          @(
              @{Path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\CPU'; Name = 'EnableCPUQuota'},
              @{Path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\Disk'; Name = 'EnableDiskQuota'},
              @{Path = 'HKLM:\SYSTEM\CurrentControlSet\Services\TSFairShare\NetBandWidth'; Name = 'EnableNetworkQuota'}
          ) | ForEach-Object {
              if (Test-Path $_.Path) {
                  Set-ItemProperty -Path $_.Path -Name $_.Name -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              }
          }

          # 4. Tinh chỉnh Kernel Scheduler, Multimedia SystemProfile & Network Throttling
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 38 -Type DWord -Force
          $mmPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
          New-Item -Path "$mmPath" -Force | Out-Null
          Set-ItemProperty -Path "$mmPath" -Name 'NetworkThrottlingIndex' -Value 0xffffffff -Type DWord -Force
          Set-ItemProperty -Path "$mmPath" -Name 'SystemResponsiveness' -Value 0 -Type DWord -Force

          $gamesTask = "$mmPath\Tasks\Games"
          New-Item -Path "$gamesTask" -Force | Out-Null
          Set-ItemProperty -Path "$gamesTask" -Name 'GPU Priority' -Value 8 -Type DWord -Force
          Set-ItemProperty -Path "$gamesTask" -Name 'Priority' -Value 6 -Type DWord -Force
          Set-ItemProperty -Path "$gamesTask" -Name 'Scheduling Category' -Value 'High' -Type String -Force
          Set-ItemProperty -Path "$gamesTask" -Name 'SFIO Priority' -Value 'High' -Type String -Force

          # 5. Giảm độ trễ giao diện Desktop, Menu & Chuột (Tuyệt đối giữ nguyên quyền hiển thị Wallpaper)
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'MenuShowDelay' -Value '0' -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'AutoEndTasks' -Value '1' -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'HungAppTimeout' -Value '1000' -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WaitToKillAppTimeout' -Value '2000' -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'LowLevelHooksTimeout' -Value '1000' -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'DragFullWindows' -Value '0' -Force -ErrorAction SilentlyContinue

          $advExp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          New-Item -Path "$advExp" -Force | Out-Null
          Set-ItemProperty -Path "$advExp" -Name 'ListviewAlphaSelect' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$advExp" -Name 'ListviewShadow' -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "$advExp" -Name 'TaskbarAnimations' -Value 0 -Type DWord -Force

          $pers = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path "$pers" -Force | Out-Null
          Set-ItemProperty -Path "$pers" -Name 'EnableTransparency' -Value 0 -Type DWord -Force

          # 6. Tối ưu hóa FileSystem NTFS & TCP/IP Stack
          & fsutil behavior set disablelastaccess 1 *> $null
          & fsutil behavior set disable8dot3 1 *> $null
          & netsh int tcp set global autotuninglevel=normal *> $null
          & netsh int tcp set global rss=enabled *> $null
          & netsh int tcp set global ecncapability=disabled *> $null
          & netsh int tcp set global timestamps=disabled *> $null

          # 7. Tắt Windows Update, Defender Realtime & 19 Services ngốn RAM/CPU
          try { Set-MpPreference -DisableRealtimeMonitoring ($true) -ErrorAction SilentlyContinue } catch {}
          $svcsToDisable = @(
              'wuauserv','UsoSvc','DiagTrack','WSearch','SysMain','WerSvc',
              'XblAuthManager','XblGameSave','XboxNetApiSvc','XboxGipSvc',
              'Spooler','MapsBroker','PcaSvc','TabletInputService','RetailDemo',
              'dmwappushservice','WbioSrvc','PhoneSvc','PrintNotify'
          )
          foreach ($s in $svcsToDisable) {
              Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
              Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }

          $cpuInfo = Get-CimInstance Win32_Processor | Select-Object -First 1
          $cpuName = "$($cpuInfo.Name) ($($cpuInfo.NumberOfLogicalProcessors) vCPU @ $($cpuInfo.MaxClockSpeed)MHz)"
          "CPU_MODEL_INFO=$cpuName" >> "$env:GITHUB_ENV"
          Write-Host "✅ Đã mở khóa CPU & Fix Lag thành công: $cpuName" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 7. CÀI ĐẶT DRIVER MÀN HÌNH ẢO (VDD), ÂM THANH ẢO & SUNSHINE
      # ───────────────────────────────────────────────
      - name: 🖥️🔊☀️ Cài Màn Hình Ảo (VDD), Âm Thanh Ảo Đa Tầng & Sunshine
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference    = 'SilentlyContinue'
          $instCache             = "$env:INSTALLER_CACHE"
          $sunPersistCfg         = "$env:SUNSHINE_PERSIST_CFG"
          $dl                    = "$env:MOUNT_LETTER"

          $resParts = "$env:VDD_RES" -split '[@x]'
          $vWidth   = if (($resParts.Count) -ge 1) { [int]$resParts[0] } else { 1920 }
          $vHeight  = if (($resParts.Count) -ge 2) { [int]$resParts[1] } else { 1080 }
          $vHz      = if (($resParts.Count) -ge 3) { [int]$resParts[2] } else { 60 }

          $vddCacheDir = [System.IO.Path]::Combine("$instCache", 'VDD')
          New-Item -ItemType Directory -Force -Path "$vddCacheDir" | Out-Null
          $usbDir = 'C:\usbmmidd_v2'

          try {
              $usbZip = [System.IO.Path]::Combine("$vddCacheDir", 'usbmmidd_v2.zip')
              if (-not (Test-Path "$usbZip")) {
                  & curl.exe -L --retry 3 --connect-timeout 20 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -o "$usbZip" 2>$null
              }
              if (Test-Path "$usbZip") {
                  Expand-Archive -Path "$usbZip" -DestinationPath 'C:\' -Force
                  if (Test-Path "$usbDir\deviceinstaller64.exe") {
                      Push-Location "$usbDir"
                      Get-ChildItem -Path "$usbDir" -Filter '*.cer' -Recurse | ForEach-Object {
                          Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null
                          Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null
                      }
                      & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null
                      $wudfPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
                      New-Item -Path "$wudfPath" -Force | Out-Null
                      Set-ItemProperty -Path "$wudfPath" -Name '0' -Value '1920,1080,60' -Type String -Force
                      Set-ItemProperty -Path "$wudfPath" -Name '1' -Value '1920,1080,120' -Type String -Force
                      Set-ItemProperty -Path "$wudfPath" -Name '2' -Value '2560,1440,60' -Type String -Force
                      Set-ItemProperty -Path "$wudfPath" -Name '3' -Value '3840,2160,60' -Type String -Force
                      & .\deviceinstaller64.exe enableidd 1 *> $null
                      Pop-Location
                      Start-Sleep -Seconds 2

                      $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry')
                      if (Test-Path "$regBk\Display-Config.reg") {
                          reg import "$regBk\Display-Config.reg" *>$null
                          reg import "$regBk\Display-Conn.reg" *>$null
                          reg import "$regBk\Display-Scale.reg" *>$null
                      } else {
                          $csLines = @(
                              'using System;',
                              'using System.Runtime.InteropServices;',
                              'public class DisplaySetter {',
                              '    [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]',
                              '    public struct DEVMODE {',
                              '        [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;',
                              '        public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;',
                              '        public int dmFields; public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation;',
                              '        public int dmDisplayFixedOutput; public short dmColor; public short dmDuplex; public short dmYResolution;',
                              '        public short dmTTOption; public short dmCollate;',
                              '        [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;',
                              '        public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;',
                              '        public int dmDisplayFlags; public int dmDisplayFrequency;',
                              '        public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType;',
                              '        public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;',
                              '    }',
                              '    [DllImport("user32.dll", CharSet = CharSet.Ansi)]',
                              '    public static extern int EnumDisplaySettings(string lpszDeviceName, int iModeNum, ref DEVMODE lpDevMode);',
                              '    [DllImport("user32.dll", CharSet = CharSet.Ansi)]',
                              '    public static extern int ChangeDisplaySettings(ref DEVMODE lpDevMode, int dwFlags);',
                              '    public static void SetRes(int w, int h, int hz) {',
                              '        DEVMODE dm = new DEVMODE();',
                              '        dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));',
                              '        if (EnumDisplaySettings(null, -1, ref dm) != 0) {',
                              '            dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmDisplayFrequency = hz;',
                              '            dm.dmFields = 0x00080000 | 0x00100000 | 0x00400000;',
                              '            ChangeDisplaySettings(ref dm, 0x01);',
                              '        }',
                              '    }',
                              '}'
                          )
                          Add-Type -TypeDefinition ($csLines -join "`r`n") -ErrorAction SilentlyContinue
                          [DisplaySetter]::SetRes($vWidth, $vHeight, $vHz)
                      }
                  }
              }
          } catch {}

          try {
              @('MMCSS', 'AudioEndpointBuilder', 'Audiosrv') | ForEach-Object {
                  Set-Service -Name "$_" -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name "$_" -ErrorAction SilentlyContinue
              }
              $vbCacheDir = [System.IO.Path]::Combine("$instCache", 'VBCable')
              $vbZip      = [System.IO.Path]::Combine("$vbCacheDir", 'VBCABLE_Driver_Pack43.zip')
              New-Item -ItemType Directory -Force -Path "$vbCacheDir" | Out-Null

              if (-not (Test-Path "$vbZip")) {
                  & curl.exe -L --retry 2 --connect-timeout 20 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -o "$vbZip" 2>$null
                  if (-not (Test-Path "$vbZip")) {
                      & curl.exe -L --retry 2 --connect-timeout 20 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip' -o "$vbZip" 2>$null
                  }
              }
              if ((Test-Path "$vbZip") -and (-not (Test-Path "$vbCacheDir\VBCABLE_Setup_x64.exe"))) {
                  Expand-Archive -Path "$vbZip" -DestinationPath "$vbCacheDir" -Force
              }

              Get-ChildItem -Path "$vbCacheDir" -Include '*.cer','*.cat','*.sys','*.exe' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                  if ($_.Extension -eq '.cer') {
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null
                  } else {
                      $sig = Get-AuthenticodeSignature -FilePath ($_.FullName) -ErrorAction SilentlyContinue
                      if ($sig -and $sig.SignerCertificate) {
                          $storeRoot = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
                          $storeRoot.Open('ReadWrite'); $storeRoot.Add($sig.SignerCertificate); $storeRoot.Close()
                          $storePub = New-Object System.Security.Cryptography.X509Certificates.X509Store('TrustedPublisher', 'LocalMachine')
                          $storePub.Open('ReadWrite'); $storePub.Add($sig.SignerCertificate); $storePub.Close()
                      }
                  }
              }

              $vbInf = Get-ChildItem -Path "$vbCacheDir" -Filter '*64*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not ($vbInf)) { $vbInf = Get-ChildItem -Path "$vbCacheDir" -Filter '*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
              if ($vbInf) {
                  pnputil /add-driver ($vbInf.FullName) /install *> $null
                  if (Test-Path "$usbDir\deviceinstaller64.exe") {
                      Push-Location ($vbInf.DirectoryName)
                      & "$usbDir\deviceinstaller64.exe" install ($vbInf.Name) 'VBAudioVACWDM' *> $null
                      Pop-Location
                  }
              }
              pnputil /scan-devices *> $null
              Restart-Service -Name 'Audiosrv' -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              $finalAudio = @(Get-PnpDevice -Class 'MEDIA','AudioEndpoint' -ErrorAction SilentlyContinue | Where-Object { ($_.FriendlyName -match 'VB-Audio|CABLE|Virtual Audio|Speaker|Line') -and ($_.Status -eq 'OK') } | Select-Object -ExpandProperty FriendlyName -Unique)
              if (($finalAudio.Count) -gt 0) {
                  "AUDIO_DEVICE_NAME=$($finalAudio -join ', ')" >> "$env:GITHUB_ENV"
              } else {
                  "AUDIO_DEVICE_NAME=Windows Virtual Audio (Active)" >> "$env:GITHUB_ENV"
              }
          } catch {
              "AUDIO_DEVICE_NAME=Windows Virtual Audio" >> "$env:GITHUB_ENV"
          }

          $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"; $sunCfg = "$sunDir\config"
          if (-not (Test-Path "$sunExe")) {
              Remove-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*Sunshine*' -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*Sunshine*' -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path 'HKLM:\SOFTWARE\LizardByte*' -Recurse -Force -ErrorAction SilentlyContinue
              & sc.exe stop SunshineService *> $null; & sc.exe delete SunshineService *> $null
              & sc.exe stop sunshinesvc *> $null; & sc.exe delete sunshinesvc *> $null
              $installJob = Start-Job -ScriptBlock { choco install sunshine -y --no-progress --limit-output --ignore-checksums 2>&1 | Out-Null }
              $completed = Wait-Job -Job ($installJob) -Timeout 90
              if (-not ($completed)) {
                  Stop-Job -Job ($installJob) -ErrorAction SilentlyContinue
                  Get-Process | Where-Object { ($_.Name -match 'sunshine|choco') -and ($_.Name -ne 'sunshinesvc') } | Stop-Process -Force -ErrorAction SilentlyContinue
              } else {
                  Receive-Job -Job ($installJob) | Out-Null
              }
              Remove-Job -Job ($installJob) -Force -ErrorAction SilentlyContinue
              $global:LASTEXITCODE = 0
          }

          if (Test-Path "$sunExe") {
              Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue
              Stop-Process -Name 'sunshine' -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              if (Test-Path "$sunCfg") {
                  $item = Get-Item "$sunCfg" -Force
                  if (($item.Attributes) -notmatch 'ReparsePoint') {
                      if ((@(Get-ChildItem "$sunPersistCfg" -Force -ErrorAction SilentlyContinue).Count) -eq 0) {
                          Copy-Item -Path "$sunCfg\*" -Destination "$sunPersistCfg" -Recurse -Force -ErrorAction SilentlyContinue
                      }
                      Remove-Item -Path "$sunCfg" -Recurse -Force -ErrorAction SilentlyContinue
                      New-Item -ItemType Junction -Path "$sunCfg" -Target "$sunPersistCfg" -Force | Out-Null
                  }
              } else {
                  New-Item -ItemType Junction -Path "$sunCfg" -Target "$sunPersistCfg" -Force | Out-Null
              }
              $confFile = [System.IO.Path]::Combine("$sunPersistCfg", 'sunshine.conf')
              if (-not (Test-Path "$confFile")) {
                  @("sunshine_name = ALB-$($env:MACHINE_ID)","min_log_level = info","origin_web_ui_allowed = wan","upnp = disabled","address_family = both") | Set-Content -Path "$confFile" -Encoding UTF8
              }
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ───────────────────────────────────────────────
      # 8. THIẾT LẬP MẠNG TAILSCALE (+ FUNNEL) & DUCKDNS
      # ───────────────────────────────────────────────
      - name: 🌐 Thiết lập mạng Tailscale & Funnel
        if: ${{ inputs.enable_tailscale == true || inputs.enable_tailscale == 'true' }}
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          if (-not ("$env:TAILSCALE_AUTH_KEY")) {
              "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV"
              "FUNNEL_URL=" >> "$env:GITHUB_ENV"
              exit 0
          }
          $ProgressPreference = 'SilentlyContinue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path "$ts")) {
              $msiCache = [System.IO.Path]::Combine("$env:INSTALLER_CACHE", 'tailscale-premium.msi')
              if ((Test-Path "$msiCache") -and ((Get-Item "$msiCache").Length -lt 5MB)) { Remove-Item -Path "$msiCache" -Force -ErrorAction SilentlyContinue }
              if (-not (Test-Path "$msiCache")) {
                  & curl.exe -L --retry 3 --connect-timeout 20 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -o "$msiCache" 2>$null
              }
              if (Test-Path "$msiCache") {
                  $localMsi = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'tailscale-setup.msi')
                  Copy-Item -Path "$msiCache" -Destination "$localMsi" -Force
                  Start-Process msiexec.exe -ArgumentList "/i `"$localMsi`" /quiet /norestart" -Wait } if (-not (Test-Path "$ts")) { $exePath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'tailscale-setup-latest.exe') & curl.exe -L --retry 3 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -o "$exePath" 2>$null if (Test-Path "$exePath") { Start-Process -FilePath "$exePath" -ArgumentList '/S', '/norestart' -Wait } } if (-not (Test-Path "$ts")) { choco install tailscale -y --no-progress --limit-output --ignore-checksums 2>&1 \vert{} Out-Null $global:LASTEXITCODE = 0 } } if (-not (Test-Path "$ts")) { "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV" "FUNNEL_URL=" >> "$env:GITHUB_ENV" exit 0 } Set-Service -Name 'Tailscale' -StartupType Automatic -ErrorAction SilentlyContinue Start-Service -Name 'Tailscale' -ErrorAction SilentlyContinue Start-Sleep -Seconds 5  $tsHost = "alb-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)" & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset --unattended if (($LASTEXITCODE) -ne 0) { Start-Sleep -Seconds 5 & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$tsHost" --accept-routes --accept-dns --reset } & "$ts" set --unattended=true 2>$null  try { & "$ts" funnel --bg 8080 2>&1 \vert{} Out-Null Start-Sleep -Seconds 3 $funnelStatus = (& "$ts" funnel status 2>&1 \vert{} Out-String) if ($funnelStatus -match '(https://[^\s]+)') { $funnelUrl = $Matches[1].TrimEnd('/') "FUNNEL_URL=$funnelUrl" >> "$env:GITHUB_ENV" } else { "FUNNEL_URL=" >> "$env:GITHUB_ENV" } } catch { "FUNNEL_URL=" >> "$env:GITHUB_ENV" }  $ip = $null 1..20 \vert{} ForEach-Object { if (-not ($ip)) { $out = (& "$ts" ip -4 2>&1 \vert{} Out-String).Trim() if ("$out" -match '^\d+\.\d+\.\d+\.\d+$') { $ip = "$out" } else { Start-Sleep -Seconds 2 } } } if (-not ($ip)) { $ip = '127.0.0.1' } "TAILSCALE_IP=$ip" >> "$env:GITHUB_ENV" exit 0  - name: 🦆 Cập nhật DuckDNS (Optional) if: ${{ inputs.enable_duckdns == true \vert{}\vert{} inputs.enable_duckdns == 'true' }} shell: pwsh env: DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }} DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }} run: \vert{} if ((-not ("$env:DUCKDNS_TOKEN")) -or (-not ("$env:DUCKDNS_DOMAIN")) -or (-not ("$env:TAILSCALE_IP"))) { exit 0 } $domain = (("$env:DUCKDNS_DOMAIN").Trim().ToLower()) -replace '\.duckdns\.org$', '' if ("$domain" -notmatch '^[a-z0-9-]+$') { exit 0 } try { $uri = "https://www.duckdns.org/update?domains=$domain&token=$($env:DUCKDNS_TOKEN)&ip=$($env:TAILSCALE_IP)" $res = Invoke-RestMethod -Uri "$uri" -TimeoutSec 15 if (("$res").Trim() -eq 'OK') { "DUCKDNS_HOST=${domain}.duckdns.org" >> "$env:GITHUB_ENV" } } catch {} exit 0  # ─────────────────────────────────────────────── # 9. CẤU HÌNH USER GỐC, KHÔI PHỤC DPAPI & ÁP DỤNG HÌNH NỀN ZENOVA CLOUD # ─────────────────────────────────────────────── - name: 👤 Cấu hình User gốc, Đồng bộ DPAPI & Áp dụng Hình nền ZENOVA CLOUD (Win 22 & 25) shell: pwsh env: RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }} FIXED_PASS_INPUT: ${{ inputs.fixed_password }} WALLPAPER_URL_INPUT: ${{ inputs.wallpaper_url }} run: \vert{} $user     = "$env:RDP_USER" $profPath = "$env:PROFILE_PATH"  if (-not ([string]::IsNullOrWhiteSpace("$env:RDP_PASSWORD_SECRET"))) { $matKhau = ("$env:RDP_PASSWORD_SECRET").Trim(); $source = 'secret' } elseif (-not ([string]::IsNullOrWhiteSpace("$env:FIXED_PASS_INPUT"))) { $matKhau = ("$env:FIXED_PASS_INPUT").Trim(); $source = 'fixed_input' } elseif ("$env:RESTORE_PASS") { $matKhau = "$env:RESTORE_PASS"; $source = 'restored' } else { $matKhau = 'Aistv@2026'; $source = 'default_fixed' }  try { & net accounts /maxpwage:unlimited *> $null $secCfg = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.cfg') $secDb  = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.sdb') & secedit /export /cfg "$secCfg" *> $null if (Test-Path "$secCfg") { $rawSec = Get-Content -Raw -Path "$secCfg" $rawSec = $rawSec -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' $rawSec = $rawSec -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' Set-Content -Path "$secCfg" -Value "$rawSec" -Encoding Unicode & secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY *> $null Remove-Item -Path "$secCfg", "$secDb" -Force -ErrorAction SilentlyContinue } } catch {}  $securePass = ConvertTo-SecureString "$matKhau" -AsPlainText -Force try { Set-LocalUser -Name "$user" -Password ($securePass) -PasswordNeverExpires ($true) -ErrorAction Stop } catch { & net user "$user" "$matKhau" /active:yes /expires:never *> $null } & net user "$user" "$matKhau" /active:yes /expires:never *> $null Add-LocalGroupMember -Group 'Administrators' -Member "$user" -ErrorAction SilentlyContinue Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "$user" -ErrorAction SilentlyContinue Enable-LocalUser -Name "$user" -ErrorAction SilentlyContinue  "RDP_PASS=$matKhau" >> "$env:GITHUB_ENV" "RDP_PASS_SOURCE=$source" >> "$env:GITHUB_ENV"  $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' Set-ItemProperty -Path "$winlogon" -Name 'AutoAdminLogon' -Value '1' -Force Set-ItemProperty -Path "$winlogon" -Name 'DefaultUserName' -Value "$user" -Force Set-ItemProperty -Path "$winlogon" -Name 'DefaultPassword' -Value "$matKhau" -Force Set-ItemProperty -Path "$winlogon" -Name 'DefaultDomainName' -Value "$env:COMPUTERNAME" -Force  # 🔑 Tái mã hóa khóa DPAPI trình duyệt (.albkey / .aistvkey) try { Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue if (Test-Path "$profPath\AppData") { Get-ChildItem -Path "$profPath\AppData" -Include 'Local State.albkey','Local State.aistvkey' -Recurse -File -Force -ErrorAction SilentlyContinue \vert{} ForEach-Object { try { $keyFile = $_.FullName $lsFile  = $keyFile -replace '\.(albkey\vert{}aistvkey)$', '' if (Test-Path "$lsFile") { $rawB64  = (Get-Content -Raw -Path "$keyFile" -Encoding ASCII).Trim() $rawKey  = [Convert]::FromBase64String("$rawB64") $newEnc  = [System.Security.Cryptography.ProtectedData]::Protect($rawKey, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser) $dpapiPrefix = [System.Text.Encoding]::ASCII.GetBytes('DPAPI') $finalBytes  = New-Object byte[] ($dpapiPrefix.Length + $newEnc.Length) [Array]::Copy($dpapiPrefix, 0, $finalBytes, 0, $dpapiPrefix.Length) [Array]::Copy($newEnc, 0, $finalBytes, $dpapiPrefix.Length, $newEnc.Length)  $lsJson = Get-Content -Raw -Path "$lsFile" -Encoding UTF8 \vert{} ConvertFrom-Json if ($lsJson.os_crypt) { $lsJson.os_crypt.encrypted_key = [Convert]::ToBase64String($finalBytes) if ($lsJson.os_crypt.PSObject.Properties['app_bound_encrypted_key']) { $lsJson.os_crypt.PSObject.Properties.Remove('app_bound_encrypted_key') } $lsJson \vert{} ConvertTo-Json -Depth 32 -Compress \vert{} Set-Content -Path "$lsFile" -Encoding UTF8 -Force } } } catch {} } } } catch {}  # 🖼️ ÁP DỤNG HÌNH NỀN MẶC ĐỊNH ZENOVA CLOUD CHO CẢ WINDOWS 2022 VÀ 2025 Write-Host "🖼️ Đang thiết lập hình nền mặc định ZENOVA CLOUD cho Windows Server..." -ForegroundColor Cyan $wallPersist = [System.IO.Path]::Combine("$env:WALLPAPER_DIR", 'Zenova-Cloud-Wallpaper.jpg') $repoWallHit = $null if ("$env:GITHUB_WORKSPACE" -and (Test-Path "$env:GITHUB_WORKSPACE")) { $repoWallHit = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Include '*Zenova*.png','*Zenova*.jpg','*wallpaper*.png','*wallpaper*.jpg' -Recurse -File -ErrorAction SilentlyContinue \vert{} Select-Object -First 1 }  if ($repoWallHit) { Copy-Item -Path ($repoWallHit.FullName) -Destination "$wallPersist" -Force Write-Host "│ ✅ Đã nạp ảnh gốc từ Repository: $($repoWallHit.Name)" -ForegroundColor Green } elseif (-not ([string]::IsNullOrWhiteSpace("$env:WALLPAPER_URL_INPUT"))) { & curl.exe -L --retry 3 "$env:WALLPAPER_URL_INPUT" -o "$wallPersist" 2>$null }  if ((-not (Test-Path "$wallPersist")) -or ((Get-Item "$wallPersist").Length -lt 10KB)) { # Tự động kết xuất đồ họa ZENOVA CLOUD Cosmic Blade 1920x1080 chuẩn thiết kế Add-Type -AssemblyName System.Drawing $bmp = New-Object System.Drawing.Bitmap(1920, 1080) $g = [System.Drawing.Graphics]::FromImage($bmp) $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit  $rect = New-Object System.Drawing.Rectangle(0, 0, 1920, 1080) $bgBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect, [System.Drawing.Color]::FromArgb(255, 4, 8, 22), [System.Drawing.Color]::FromArgb(255, 10, 28, 74), 35.0) $g.FillRectangle($bgBrush, $rect)  $rnd = New-Object System.Random(2026) for ($i = 0; $i -lt 350; $i++) { $sx = $rnd.Next(0, 1920); $sy = $rnd.Next(0, 1080); $ss = $rnd.Next(1, 5) $alpha = $rnd.Next(80, 255) $starBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb($alpha, 160, 225, 255)) $g.FillEllipse($starBrush, $sx, $sy, $ss, $ss) $starBrush.Dispose() }  $glowPen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(140, 0, 195, 255), 3) $g.DrawEllipse($glowPen, 210, 290, 460, 460) $bladePen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(210, 56, 189, 248), 6) $g.DrawLine($bladePen, 680, 180, 1780, 880)  $titleFont = New-Object System.Drawing.Font('Segoe UI', 78, [System.Drawing.FontStyle]::Bold) $subFont   = New-Object System.Drawing.Font('Segoe UI', 28, [System.Drawing.FontStyle]::Bold) $textBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush((New-Object System.Drawing.Rectangle(120, 420, 800, 180)), [System.Drawing.Color]::FromArgb(255, 240, 249, 255), [System.Drawing.Color]::FromArgb(255, 56, 189, 248), 90.0) $subBrush  = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(230, 147, 197, 253))  $g.DrawString('ZENOVA', $titleFont, $textBrush, 140, 420) $g.DrawString('C  L  O  U  D', $subFont, $subBrush, 245, 565)  $bmp.Save("$wallPersist", [System.Drawing.Imaging.ImageFormat]::Jpeg) $g.Dispose(); $bmp.Dispose() Write-Host "│ ✅ Đã kết xuất ảnh nền ZENOVA CLOUD 1920x1080 mặc định" -ForegroundColor Green }  try { # Ghi đè thẳng vào toàn bộ ảnh mặc định của Windows Server 2022 & 2025 $sysWalls = @( 'C:\Windows\Web\Wallpaper\Windows\img0.jpg', 'C:\Windows\Web\Screen\img100.jpg' ) if (Test-Path 'C:\Windows\Web\4K\Wallpaper\Windows') { $sysWalls += @(Get-ChildItem 'C:\Windows\Web\4K\Wallpaper\Windows' -Filter '*.jpg' -File -ErrorAction SilentlyContinue \vert{} Select-Object -ExpandProperty FullName) } foreach ($sw in $sysWalls) { if (Test-Path "$sw") { & takeown.exe /F "$sw" /A *> $null & icacls.exe "$sw" /grant 'Administrators:F' /Q *> $null Copy-Item -Path "$wallPersist" -Destination "$sw" -Force -ErrorAction SilentlyContinue } }  $themesDir = "$env:APPDATA\Microsoft\Windows\Themes" New-Item -ItemType Directory -Force -Path "$themesDir" \vert{} Out-Null Copy-Item -Path "$wallPersist" -Destination "$themesDir\TranscodedWallpaper" -Force -ErrorAction SilentlyContinue Remove-Item -Path "$themesDir\CachedFiles\*" -Force -ErrorAction SilentlyContinue  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value "$wallPersist" -Force Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'TileWallpaper' -Value '0' -Force  $wallSetterCs = @' using System; using System.Runtime.InteropServices; public class WallSetter { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); public static void Apply(string path) { SystemParametersInfo(20, 0, path, 0x01 \vert{} 0x02); } } '@ Add-Type -TypeDefinition $wallSetterCs -ErrorAction SilentlyContinue [WallSetter]::Apply("$wallPersist") & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True "WALLPAPER_STATUS=ZENOVA CLOUD (Active)" >> "$env:GITHUB_ENV" } catch { "WALLPAPER_STATUS=Default" >> "$env:GITHUB_ENV" }  # Đồng bộ tài khoản Sunshine & bật dịch vụ Sunshine $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"; $sunPersistCfg = "$env:SUNSHINE_PERSIST_CFG" $uObj = Get-LocalUser -Name "$user" -ErrorAction SilentlyContinue $userSid = if ($uObj) { $uObj.SID.Value } else { $null } if (Test-Path "$sunExe") { if ($userSid) { & icacls "$sunDir" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null & icacls "$sunPersistCfg" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null } Push-Location "$sunDir"; & "$sunExe" --creds "$user" "$matKhau" *> $null; Pop-Location $svcExe = "$sunDir\tools\sunshinesvc.exe" $svcObj = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue \vert{} Select-Object -First 1 if ((-not ($svcObj)) -and (Test-Path "$svcExe")) { & sc.exe create SunshineService binPath= "`"$svcExe`"" start= auto DisplayName= "Sunshine Gamestream Service" *> $null
                  $svcObj = Get-Service -Name 'SunshineService' -ErrorAction SilentlyContinue
              }
              if ($svcObj) {
                  Set-Service -Name ($svcObj.Name) -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name ($svcObj.Name) -ErrorAction SilentlyContinue
              } else {
                  Start-Process -FilePath "$sunExe" -WorkingDirectory "$sunDir" -WindowStyle Hidden
              }
              "SUNSHINE_READY=1" >> "$env:GITHUB_ENV"
          }

          try {
              $desktopDir = [System.IO.Path]::Combine("$profPath", 'Desktop')
              New-Item -ItemType Directory -Force -Path "$desktopDir" | Out-Null
              $ws = New-Object -ComObject WScript.Shell
              @("$desktopDir", 'C:\Users\Public\Desktop') | ForEach-Object {
                  $d = "$_"
                  $lnk1 = $ws.CreateShortcut("$d\O-DIA-RIENG-ALB.lnk"); $lnk1.TargetPath = "$($env:MOUNT_LETTER):\"; $lnk1.Save()
                  $lnk2 = $ws.CreateShortcut("$d\WEB-QUAN-LY-RDP.url"); $lnk2.TargetPath = "http://127.0.0.1:$($env:WEB_PORT)/"; $lnk2.Save()
                  $lnk3 = $ws.CreateShortcut("$d\SUNSHINE-WEB-UI.url"); $lnk3.TargetPath = "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"; $lnk3.Save()
                  $tsconBat = "$d\NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat"
                  $batLines = @(
                      '@echo off',
                      'for /f "tokens=3-4" %%a in (''query session %USERNAME%'') do @if "%%b"=="Active" tscon %%a /dest:console'
                  )
                  Set-Content -Path "$tsconBat" -Value ($batLines -join "`r`n") -Encoding ASCII
              }
          } catch {}

          'SESSION_READY=1' >> "$env:GITHUB_ENV"
          exit 0

      # ───────────────────────────────────────────────
      # 10. CÀI ĐẶT SIÊU NHANH: STARDESK MỚI NHẤT + EVKEY + VSCODE + MS STORE + BANDICAM
      # ───────────────────────────────────────────────
      - name: 🚀 Cài đặt Siêu Nhanh: StarDesk Mới Nhất + EVKey + VSCode + Microsoft Store + Bandicam
        shell: pwsh
        env:
          PKGS: ${{ inputs.choco_packages }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference    = 'SilentlyContinue'
          $user      = "$env:RDP_USER"
          $profPath  = "$env:PROFILE_PATH"
          $instCache = "$env:INSTALLER_CACHE"
          $appsDir   = 'C:\ALB-Apps'
          $desktopDir = [System.IO.Path]::Combine("$profPath", 'Desktop')
          $ws = New-Object -ComObject WScript.Shell
          New-Item -ItemType Directory -Force -Path "$instCache", "$appsDir\EVKey", "$desktopDir" | Out-Null

          # 0. Cài các gói Chocolatey tùy chọn của người dùng (nếu có)
          $pkgListFile = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'installed-choco-packages.txt')
          $savedPkgs = @(); if (Test-Path "$pkgListFile") { $savedPkgs = @(Get-Content -Path "$pkgListFile" | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' }) }
          $inputPkgs = @(); if (-not ([string]::IsNullOrWhiteSpace("$env:PKGS"))) { $inputPkgs = @("$env:PKGS" -split '\s+' | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' }) }
          $allPkgs = @($savedPkgs + $inputPkgs | Select-Object -Unique)
          if (($allPkgs.Count) -gt 0) {
              $allPkgs | Set-Content -Path "$pkgListFile" -Encoding UTF8
              $allPkgs | ForEach-Object { choco install "$_" -y --no-progress --limit-output 2>&1 | Out-Null; $global:LASTEXITCODE = 0 }
          }

          # 1. CÀI EVKEY SIÊU NHANH
          Write-Host "⌨️ [1/6] Đang cài đặt EVKey (Bộ gõ tiếng Việt)..." -ForegroundColor Cyan
          try {
              $evKeyDest = "$appsDir\EVKey"
              if (-not (Test-Path "$evKeyDest\EVKey64.exe")) {
                  $evKeyZip = [System.IO.Path]::Combine("$instCache", 'EVKey.zip')
                  if (-not (Test-Path "$evKeyZip")) {
                      & curl.exe -L --retry 3 --connect-timeout 15 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip' -o "$evKeyZip" 2>$null
                  }
                  if (Test-Path "$evKeyZip") {
                      Expand-Archive -Path "$evKeyZip" -DestinationPath "$evKeyDest" -Force
                  }
              }
              $evKeyExe = if (Test-Path "$evKeyDest\EVKey64.exe") { "$evKeyDest\EVKey64.exe" } elseif (Test-Path "$evKeyDest\EVKey32.exe") { "$evKeyDest\EVKey32.exe" } else { $null }
              if ($evKeyExe) {
                  $startupDir = [System.IO.Path]::Combine($env:APPDATA, 'Microsoft\Windows\Start Menu\Programs\Startup')
                  New-Item -ItemType Directory -Force -Path "$startupDir" | Out-Null
                  $lnkEv1 = $ws.CreateShortcut("$startupDir\EVKey.lnk"); $lnkEv1.TargetPath = "$evKeyExe"; $lnkEv1.Save()
                  $lnkEv2 = $ws.CreateShortcut("$desktopDir\EVKey.lnk"); $lnkEv2.TargetPath = "$evKeyExe"; $lnkEv2.Save()
                  Start-Process -FilePath "$evKeyExe" -WorkingDirectory "$evKeyDest" -ErrorAction SilentlyContinue
                  Write-Host "│ ✅ EVKey đã sẵn sàng: $evKeyExe" -ForegroundColor Green
              }
          } catch { Write-Host "│ ⚠️ EVKey: $($_.Exception.Message)" -ForegroundColor Yellow }

          # 2. CÀI VISUAL STUDIO CODE (VSCODE) SIÊU NHANH
          Write-Host "💻 [2/6] Đang cài đặt Visual Studio Code (VSCode)..." -ForegroundColor Cyan
          try {
              $vsCodeExe = 'C:\Program Files\Microsoft VS Code\Code.exe'
              if (-not (Test-Path "$vsCodeExe")) {
                  $vsInstaller = [System.IO.Path]::Combine("$instCache", 'VSCodeSetup-x64.exe')
                  if ((-not (Test-Path "$vsInstaller")) -or ((Get-Item "$vsInstaller").Length -lt 40MB)) {
                      & curl.exe -L --retry 3 --connect-timeout 20 'https://update.code.visualstudio.com/latest/win32-x64-system/stable' -o "$vsInstaller" 2>$null
                  }
                  if ((Test-Path "$vsInstaller") -and ((Get-Item "$vsInstaller").Length -gt 40MB)) {
                      Start-Process -FilePath "$vsInstaller" -ArgumentList '/VERYSILENT', '/NORESTART', '/MERGETASKS=!runcode,addcontextmenufiles,addcontextmenufolders,addtopath' -Wait
                  } else {
                      choco install vscode -y --no-progress --limit-output 2>&1 | Out-Null
                  }
              }
              if (Test-Path "$vsCodeExe") {
                  $lnkVs = $ws.CreateShortcut("$desktopDir\Visual Studio Code.lnk"); $lnkVs.TargetPath = "$vsCodeExe"; $lnkVs.Save()
                  Write-Host "│ ✅ VSCode đã sẵn sàng: $vsCodeExe" -ForegroundColor Green
              }
          } catch { Write-Host "│ ⚠️ VSCode: $($_.Exception.Message)" -ForegroundColor Yellow }

          # 3. CÀI BANDICAM SIÊU NHANH
          Write-Host "🎥 [3/6] Đang cài đặt Bandicam..." -ForegroundColor Cyan
          try {
              $bdcamExe = 'C:\Program Files\Bandicam\bdcam.exe'
              if (-not (Test-Path "$bdcamExe")) {
                  $bdInstaller = [System.IO.Path]::Combine("$instCache", 'bdcamsetup.exe')
                  if ((-not (Test-Path "$bdInstaller")) -or ((Get-Item "$bdInstaller").Length -lt 10MB)) {
                      & curl.exe -L --retry 3 --connect-timeout 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" 'https://dl.bandicam.com/bdcamsetup.exe' -o "$bdInstaller" 2>$null
                  }
                  if ((Test-Path "$bdInstaller") -and ((Get-Item "$bdInstaller").Length -gt 10MB)) {
                      $bdJob = Start-Job -ScriptBlock { param($p) Start-Process -FilePath "$p" -ArgumentList '/S' -Wait } -ArgumentList "$bdInstaller"
                      $null = Wait-Job -Job $bdJob -Timeout 45
                      Stop-Job -Job $bdJob -ErrorAction SilentlyContinue
                      Remove-Job -Job $bdJob -Force -ErrorAction SilentlyContinue
                  }
                  if (-not (Test-Path "$bdcamExe")) {
                      choco install bandicam -y --no-progress --limit-output --ignore-checksums 2>&1 | Out-Null
                  }
              }
              if (Test-Path "$bdcamExe") {
                  $lnkBd = $ws.CreateShortcut("$desktopDir\Bandicam.lnk"); $lnkBd.TargetPath = "$bdcamExe"; $lnkBd.Save()
                  Write-Host "│ ✅ Bandicam đã sẵn sàng: $bdcamExe" -ForegroundColor Green
              }
          } catch { Write-Host "│ ⚠️ Bandicam: $($_.Exception.Message)" -ForegroundColor Yellow }

          # 4. CÀI MICROSOFT STORE CHO WINDOWS SERVER 2022 & 2025
          Write-Host "🛍️ [4/6] Đang kích hoạt & cài đặt Microsoft Store (Win 2022/2025)..." -ForegroundColor Cyan
          try {
              @('AppXSvc', 'ClipSVC', 'LicenseManager', 'StateRepository', 'wuauserv') | ForEach-Object {
                  Set-Service -Name "$_" -StartupType Manual -ErrorAction SilentlyContinue
                  Start-Service -Name "$_" -ErrorAction SilentlyContinue
              }
              & icacls "$profPath\AppData\Local\Packages" /grant "*S-1-15-2-1:(OI)(CI)F" /T /C /Q *> $null
              if (Test-Path 'C:\Windows\ImmersiveControlPanel\appxmanifest.xml') {
                  Add-AppxPackage -Register 'C:\Windows\ImmersiveControlPanel\appxmanifest.xml' -DisableDevelopmentMode -ErrorAction SilentlyContinue
              }

              $storePkg = Get-AppxPackage -Name '*WindowsStore*' -ErrorAction SilentlyContinue
              if (-not $storePkg) {
                  $storeCacheDir = [System.IO.Path]::Combine("$instCache", 'MSStore-Server')
                  $storeZip = [System.IO.Path]::Combine("$instCache", 'LTSC-Add-MicrosoftStore.zip')
                  if (-not (Test-Path "$storeZip")) {
                      & curl.exe -L --retry 3 --connect-timeout 25 'https://github.com/kkkgo/LTSC-Add-MicrosoftStore/archive/refs/heads/master.zip' -o "$storeZip" 2>$null
                  }
                  if ((Test-Path "$storeZip") -and (-not (Test-Path "$storeCacheDir"))) {
                      Expand-Archive -Path "$storeZip" -DestinationPath "$storeCacheDir" -Force
                  }
                  $storeSubDir = Get-ChildItem -Path "$storeCacheDir" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($storeSubDir) {
                      $sPath = $storeSubDir.FullName
                      Get-ChildItem -Path "$sPath" -Include '*VCLibs*x64*.appx','*UI.Xaml*x64*.appx','*NET.Native*x64*.appx' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                          Add-AppxProvisionedPackage -Online -PackagePath ($_.FullName) -SkipLicense -ErrorAction SilentlyContinue *> $null
                          Add-AppxPackage -Path ($_.FullName) -ErrorAction SilentlyContinue *> $null
                      }
                      $storeBundle = Get-ChildItem -Path "$sPath" -Filter '*WindowsStore*.*bundle' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      $storeLic    = Get-ChildItem -Path "$sPath" -Filter '*WindowsStore*.xml' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($storeBundle) {
                          if ($storeLic) {
                              Add-AppxProvisionedPackage -Online -PackagePath ($storeBundle.FullName) -LicensePath ($storeLic.FullName) -ErrorAction SilentlyContinue *> $null
                          } else {
                              Add-AppxProvisionedPackage -Online -PackagePath ($storeBundle.FullName) -SkipLicense -ErrorAction SilentlyContinue *> $null
                          }
                          Add-AppxPackage -Path ($storeBundle.FullName) -ErrorAction SilentlyContinue *> $null
                      }
                  }
              }
              $lnkStore = $ws.CreateShortcut("$desktopDir\Microsoft Store.url")
              $lnkStore.TargetPath = "ms-windows-store://home"
              $lnkStore.Save()
              $storeCheck = Get-AppxPackage -Name '*WindowsStore*' -ErrorAction SilentlyContinue
              if ($storeCheck) {
                  "MSSTORE_READY=1" >> "$env:GITHUB_ENV"
                  Write-Host "│ ✅ Microsoft Store đã được nạp thành công!" -ForegroundColor Green
              } else {
                  "MSSTORE_READY=Shortcut" >> "$env:GITHUB_ENV"
                  Write-Host "│ ✅ Đã tạo lối tắt Microsoft Store trên Desktop" -ForegroundColor Green
              }
          } catch { Write-Host "│ ⚠️ Microsoft Store: $($_.Exception.Message)" -ForegroundColor Yellow }

          # 5. CÀI SPOTIFY & DISCORD NHANH
          Write-Host "🎵 [5/6] Đang kiểm tra Spotify & Discord..." -ForegroundColor Cyan
          try {
              if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")) {
                  $spInstaller = [System.IO.Path]::Combine("$instCache", 'SpotifyFullSetupX64.exe')
                  if (-not (Test-Path "$spInstaller")) {
                      & curl.exe -L --retry 2 --connect-timeout 20 'https://download.scdn.co/SpotifyFullSetupX64.exe' -o "$spInstaller" 2>$null
                  }
                  if ((Test-Path "$spInstaller") -and ((Get-Item "$spInstaller").Length -gt 5MB)) {
                      Start-Process -FilePath "$spInstaller" -ArgumentList '/silent', '/skip-app-launch' -Wait -ErrorAction SilentlyContinue
                  }
              }
          } catch {}

          # 6. TẢI & CÀI STARDESK BẢN MỚI NHẤT (ĐA TẦNG DỰ PHÒNG CHỐNG LỖI TẢI)
          Write-Host "🚀 [6/6] Đang tải & cài đặt StarDesk (Bản mới nhất + Đa luồng dự phòng)..." -ForegroundColor Cyan
          $appDir = 'C:\Program Files\StarDesk'
          $appExe = 'C:\Program Files\StarDesk\StarDesk.exe'
          $dlFolder = [System.IO.Path]::Combine("$profPath", 'Downloads')
          New-Item -ItemType Directory -Force -Path "$dlFolder" | Out-Null

          $sdInstaller = [System.IO.Path]::Combine("$instCache", 'StarDesk_latest.exe')
          if ((-not (Test-Path "$sdInstaller")) -or ((Get-Item "$sdInstaller").Length -lt 5MB)) {
              $existingSd = @(
                  "$dlFolder\StarDesk_latest.exe",
                  "$dlFolder\StarDesk_1.5.3.exe",
                  "$dlFolder\StarDesk_1.5.2.exe",
                  'C:\Users\runneradmin\Downloads\StarDesk_1.5.3.exe',
                  'C:\Users\runneradmin\Downloads\StarDesk_1.5.2.exe'
              ) | Where-Object { (Test-Path "$_") -and ((Get-Item "$_").Length -gt 5MB) } | Select-Object -First 1

              if ($existingSd) {
                  Copy-Item -Path "$existingSd" -Destination "$sdInstaller" -Force
                  Write-Host "│ ✅ Sử dụng bộ cài StarDesk đã lưu sẵn: $existingSd" -ForegroundColor Green
              } else {
                  # Tầng 1: Tải trực tiếp bản Official mới nhất từ API StarDesk bằng curl.exe
                  Write-Host "│ ⬇️ Đang tải StarDesk bản mới nhất từ api.stardesk.net..." -ForegroundColor Cyan
                  & curl.exe -L --retry 3 --connect-timeout 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://api.stardesk.net/api/v1/release/dl/1?channel=official" -o "$sdInstaller" 2>$null

                  # Tầng 2: Dự phòng link MediaFire từ taomay.yaml nếu API chính bị chặn
                  if ((-not (Test-Path "$sdInstaller")) -or ((Get-Item "$sdInstaller").Length -lt 5MB)) {
                      $mfUrl = 'https://download943.mediafire.com/be95vz5kgnig_m7acKGr-mRjXQQKAN0i2WdjIR_d-q70MeLboolFJnUHit6ZmqJYm8_rJigOgY0P5NhtdANnLGXOaEmKg9eWSEUGCEEIZdCrV2NNZ0ubdEO1hyPHR6l2Re85XT5kJpCd3Q4GXpeU0ZD2QSr5gc_6aPfM7r15_YltcA/mf82krdrzcy3dz8/StarDesk_1.5.3.exe'
                      & curl.exe -L --retry 3 --connect-timeout 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$mfUrl" -o "$sdInstaller" 2>$null
                  }
              }
          }

          if ((-not (Test-Path "$appExe")) -and (Test-Path "$sdInstaller") -and ((Get-Item "$sdInstaller").Length -gt 5MB)) {
              Copy-Item -Path "$sdInstaller" -Destination "$dlFolder\StarDesk_latest.exe" -Force -ErrorAction SilentlyContinue
              Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
              Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 1

              $sdJob = Start-Job -ScriptBlock { param($exe) Start-Process -FilePath "$exe" -ArgumentList '/S' -Wait } -ArgumentList "$sdInstaller"
              $doneSd = Wait-Job -Job $sdJob -Timeout 55
              if (-not $doneSd) {
                  Stop-Job -Job $sdJob -ErrorAction SilentlyContinue
                  Get-Process -Name 'StarDesk_latest*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              }
              Remove-Job -Job $sdJob -Force -ErrorAction SilentlyContinue

              if ((-not (Test-Path "$appExe")) -and (-not (Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue))) {
                  $proc = Start-Process -FilePath "$sdInstaller" -PassThru -ErrorAction SilentlyContinue
                  $waited = 0
                  while (($waited -lt 40) -and (-not (Test-Path "$appExe"))) { Start-Sleep -Seconds 2; $waited += 2 }
                  Start-Sleep -Seconds 2
                  if (($proc) -and (-not ($proc.HasExited))) { Stop-Process -Id ($proc.Id) -Force -ErrorAction SilentlyContinue }
              }
          }

          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | ForEach-Object {
              Set-Service -Name ($_.Name) -StartupType Automatic -ErrorAction SilentlyContinue
              Start-Service -Name ($_.Name) -ErrorAction SilentlyContinue
          }

          if (Test-Path "$appExe") {
              try {
                  & schtasks.exe /Create /TN "ALB-Launch-StarDesk" /TR "`"$appExe`"" /SC ONCE /ST 00:00 /RU "$user" /RL HIGHEST /IT /F *> $null & schtasks.exe /Run /TN "ALB-Launch-StarDesk" *> $null Start-Sleep -Seconds 3 } catch {} if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) { Start-Process -FilePath "$appExe" -WorkingDirectory "$appDir" -ErrorAction SilentlyContinue } "STARDESK_READY=1" >> "$env:GITHUB_ENV" Write-Host "│ ✅ StarDesk đã cài đặt & mở sẵn thành công!" -ForegroundColor Green }  # Nâng độ ưu tiên CPU (High Priority) cho các tiến trình chính @('sunshine','StarDesk','Code','bdcam') \vert{} ForEach-Object { Get-Process -Name "$_" -ErrorAction SilentlyContinue \vert{} ForEach-Object { try { $_.PriorityClass = 'High' } catch {} } }  $global:LASTEXITCODE = 0 exit 0  # ─────────────────────────────────────────────── # 11. KHỞI CHẠY WEB PANEL QUẢN LÝ ĐA NĂNG (PORT 8080 - ÁP DỤNG MỌI MÁY) # ─────────────────────────────────────────────── - name: 🌐 Khởi chạy Web Quản Lý Đa Năng (Hợp nhất Giao diện AI-STV + API Bot Bridge) shell: pwsh env: WINDOWS_IMAGE: ${{ inputs.windows_image }} VDD_RES: ${{ inputs.vdd_resolution }} run: \vert{} $savePass = if ("$env:RDP_PASS_SOURCE" -ne 'secret') { "$env:RDP_PASS" } else { $null } $uObj = Get-LocalUser -Name "$env:RDP_USER" -ErrorAction SilentlyContinue $userSid = if ($uObj) { $uObj.SID.Value } else { $null }  $state = [ordered]@{ machineId       = "$env:MACHINE_ID" releaseTag      = "$env:RELEASE_TAG" user            = "$env:RDP_USER" sid             = "$userSid" password        = $savePass passwordSource  = "$env:RDP_PASS_SOURCE" windowsImage    = "$env:WINDOWS_IMAGE" osBuild         = "$env:OS_BUILD" driveLetter     = "$env:MOUNT_LETTER" tailscaleIp     = "$env:TAILSCALE_IP" funnelUrl       = "$env:FUNNEL_URL" duckdnsHost     = "$env:DUCKDNS_HOST" durationMinutes = [int]"$env:TOTAL_MINUTES" startUtc        = (Get-Date).ToUniversalTime().ToString('o') runId           = "$env:GITHUB_RUN_ID" lastUpdatedUtc  = (Get-Date).ToUniversalTime().ToString('o') } $state \vert{} ConvertTo-Json -Depth 5 -Compress \vert{} Set-Content -Path "$env:SHARED_STATE_FILE" -Encoding UTF8  $webScript = @' $ErrorActionPreference = "Continue" $listener = [System.Net.HttpListener]::new() $listener.Prefixes.Add("http://+:$($env:WEB_PORT)/") $listener.Start() $endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60) $statusCache = @{}; $cacheTime = @{}  while ($listener.IsListening) { try { $ctx  = $listener.GetContext() $req  = $ctx.Request $resp = $ctx.Response $path = $req.Url.AbsolutePath.ToLower() $now  = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() $remain = [math]::Max(0, ($endEpoch) - ($now)) $h = [math]::Floor($remain / 3600) $m = [math]::Floor(($remain \% 3600) / 60) $s = $remain \% 60  # 1. API JSON cho Bot Bridge (rdp-bridge.js) & Giám sát tự động if (($path -eq "/api/status") -or ($path -eq "/health")) { $cacheKey = "status" if ((-not $cacheTime[$cacheKey]) -or (($now - $cacheTime[$cacheKey]) -gt 3)) { $ram  = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue $disk = Get-PSDrive -Name "$env:MOUNT_LETTER" -ErrorAction SilentlyContinue $statusCache[$cacheKey] = [ordered]@{ machineId         = "$env:MACHINE_ID" releaseTag        = "$env:RELEASE_TAG" creator           = "ALB" status            = "ok" rdp               = (Get-Service TermService -ErrorAction SilentlyContinue).Status.ToString() remaining_seconds = $remain remaining_display = "${h}h${m}m${s}s" tailscale_ip      = "$env:TAILSCALE_IP" funnel_url        = "$env:FUNNEL_URL" duckdns_host      = "$env:DUCKDNS_HOST" drive             = "$env:MOUNT_LETTER" cpu_model         = "$env:CPU_MODEL_INFO" wallpaper         = "$env:WALLPAPER_STATUS" ram_total_gb      = if ($ram) { [math]::Round($ram.TotalVisibleMemorySize / 1MB, 1) } else { 16 } ram_free_gb       = if ($ram) { [math]::Round($ram.FreePhysicalMemory / 1MB, 1) } else { 8 } disk_total_gb     = if ($disk) { [math]::Round(($disk.Used + $disk.Free) / 1GB, 1) } else { 45 } disk_free_gb      = if ($disk) { [math]::Round($disk.Free / 1GB, 1) } else { 40 } apps              = @( @{ name = "StarDesk"; ok = (Test-Path "C:\Program Files\StarDesk\StarDesk.exe") }, @{ name = "EVKey"; ok = (Test-Path "C:\ALB-Apps\EVKey\EVKey64.exe") }, @{ name = "VSCode"; ok = (Test-Path "C:\Program Files\Microsoft VS Code\Code.exe") }, @{ name = "MSStore"; ok = ([bool](Get-AppxPackage -Name "*WindowsStore*" -ErrorAction SilentlyContinue)) }, @{ name = "Bandicam"; ok = (Test-Path "C:\Program Files\Bandicam\bdcam.exe") }, @{ name = "Spotify"; ok = (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe") } ) } $cacheTime[$cacheKey] = $now } $json = $statusCache[$cacheKey] \vert{} ConvertTo-Json -Compress -Depth 5 $buf  = [System.Text.Encoding]::UTF8.GetBytes("$json") $resp.ContentType = "application/json; charset=utf-8" $resp.ContentLength64 = $buf.Length $resp.OutputStream.Write($buf, 0, $buf.Length) $resp.OutputStream.Close() continue }  # 2. Xử lý API POST (/api/action/*) if (($req.HttpMethod -eq "POST") -and ($path -like "/api/action/*")) { $action = $path -replace "/api/action/", "" $mapSignal = @{ "save"      = "SAVE_NOW" "restart"   = "RESTART_SESSION" "stop"      = "STOP_SESSION" "start-new" = "RESTART_SESSION" } if ($mapSignal.ContainsKey("$action")) { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value ($mapSignal["$action"]) -Encoding UTF8 $result = @{ ok = $true; action = $action; machineId = "$env:MACHINE_ID" } \vert{} ConvertTo-Json -Compress } else { $result = @{ ok = $false; error = "invalid action" } \vert{} ConvertTo-Json -Compress } $buf = [System.Text.Encoding]::UTF8.GetBytes("$result") $resp.ContentType = "application/json; charset=utf-8" $resp.ContentLength64 = $buf.Length $resp.OutputStream.Write($buf, 0, $buf.Length) $resp.OutputStream.Close() continue }  # 3. Xử lý Form POST trực tiếp trên giao diện Web (/action/*) $statusMsg = "" if ($req.HttpMethod -eq "POST") { if ($path -eq "/action/save") { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "SAVE_NOW" -Encoding UTF8 $statusMsg = "✅ Đã gửi lệnh LƯU NGAY vào Release [$($env:RELEASE_TAG)]! (Mất khoảng 20-40 giây)." } elseif (($path -eq "/action/restart") -or ($path -eq "/action/start-new")) { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "RESTART_SESSION" -Encoding UTF8 $statusMsg = "🔁 Đã gửi lệnh LƯU Ổ ĐĨA & KHỞI ĐỘNG PHIÊN MỚI cho máy [$($env:MACHINE_ID)]!" } elseif ($path -eq "/action/stop") { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "STOP_SESSION" -Encoding UTF8 $statusMsg = "🛑 Đã gửi lệnh LƯU Ổ ĐĨA & TẮT HẲN SERVER [$($env:MACHINE_ID)]!" } }  $ramObj = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue $ramTxt = if ($ramObj) { "$([math]::Round(($ramObj.TotalVisibleMemorySize - $ramObj.FreePhysicalMemory)/1MB, 1)) / $([math]::Round($ramObj.TotalVisibleMemorySize/1MB, 1)) GB" } else { "16 GB" } $sdOk   = if (Test-Path "C:\Program Files\StarDesk\StarDesk.exe") { "✅ Đang chạy" } else { "⏳ Chờ" } $evOk   = if (Test-Path "C:\ALB-Apps\EVKey\EVKey64.exe") { "✅ Đã cài" } else { "❌" } $vsOk   = if (Test-Path "C:\Program Files\Microsoft VS Code\Code.exe") { "✅ Đã cài" } else { "❌" } $bdOk   = if (Test-Path "C:\Program Files\Bandicam\bdcam.exe") { "✅ Đã cài" } else { "❌" } $stOk   = if (Get-AppxPackage -Name "*WindowsStore*" -ErrorAction SilentlyContinue) { "✅ Đã cài" } else { "🔗 Shortcut" }  $bannerHtml = if ("$statusMsg") { "<div class='alert'>$statusMsg</div>" } else { "" } $html = @" <!DOCTYPE html> <html lang='vi'> <head> <meta charset='utf-8'> <meta name='viewport' content='width=device-width, initial-scale=1'> <title>ALB & AI-STV Control Panel ($($env:MACHINE_ID))</title> <style> * { box-sizing: border-box; font-family: 'Segoe UI', Inter, sans-serif; } body { background: #070b19; color: #f8fafc; margin: 0; padding: 24px; display: flex; justify-content: center; align-items: center; min-height: 100vh; } .card { max-width: 640px; width: 100\%; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 18px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); } h1 { margin: 0 0 6px 0; font-size: 23px; color: #38bdf8; } .sub { color: #94a3b8; font-size: 13px; margin-bottom: 18px; } .info { background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 18px; } .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13.5px; } .row:last-child { border-bottom: none; } .val { font-weight: 600; color: #4ade80; text-align: right; } .val.gold { color: #facc15; } .val a { color: #38bdf8; text-decoration: none; } .alert { background: #065f46; color: #ecfdf5; padding: 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; font-weight: 600; } .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } form { margin: 0; } button { width: 100\%; padding: 14px 16px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: white; transition: opacity 0.2s; } button:hover { opacity: 0.9; } .btn-save { background: linear-gradient(135deg, #0284c7, #0369a1); grid-column: span 2; } .btn-restart { background: linear-gradient(135deg, #d97706, #b45309); } .btn-stop { background: linear-gradient(135deg, #dc2626, #991b1b); } .note { font-size: 12px; color: #94a3b8; margin-top: 14px; text-align: center; } </style> </head> <body> <div class='card'> <h1>🎛️ BẢNG ĐIỀU KHIỂN ZENOVA CLOUD [$($env:MACHINE_ID)]</h1> <div class='sub'>Quản lý Ổ đĩa $($env:MOUNT_LETTER):\, Sunshine, StarDesk, Lưu dữ liệu & Chuyển phiên cho mọi máy</div> $bannerHtml <div class='info'> <div class='row'><span>🏷️ Định danh máy & Kho lưu:</span><span class='val'>$($env:MACHINE_ID) ($($env:RELEASE_TAG))</span></div> <div class='row'><span>🌐 IP Tailscale / RDP:</span><span class='val'>$($env:TAILSCALE_IP):3389</span></div> <div class='row'><span>🔗 Tailscale Funnel URL:</span><span class='val'><a href='$($env:FUNNEL_URL)' target='_blank'>$($env:FUNNEL_URL)</a></span></div> <div class='row'><span>☀️ Sunshine Web UI:</span><span class='val'><a href='https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/' target='_blank'>https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/</a></span></div> <div class='row'><span>👤 Tài khoản gốc:</span><span class='val'>$($env:RDP_USER)</span></div> <div class='row'><span>⚡ CPU & RAM:</span><span class='val'>$($env:CPU_MODEL_INFO) \vert{} $ramTxt</span></div> <div class='row'><span>🖥️ Màn hình & Hình nền:</span><span class='val'>$($env:VDD_RES) \vert{} Zenova Cloud</span></div> <div class='row'><span>🔊 Âm thanh ảo:</span><span class='val'>$($env:AUDIO_DEVICE_NAME)</span></div> <div class='row'><span>📦 Trạng thái App:</span><span class='val'>StarDesk:$sdOk \vert{} EVKey:$evOk \vert{} VSCode:$vsOk \vert{} Store:$stOk \vert{} Bandicam:$bdOk</span></div> <div class='row'><span>💽 Ổ đĩa lưu trữ:</span><span class='val'>$($env:MOUNT_LETTER):\ ($($env:SHARED_ROOT))</span></div> <div class='row'><span>⏳ Thời gian còn lại:</span><span class='val gold' id='timer'>${h}h ${m}m ${s}s</span></div> </div> <div class='grid-btns'> <form method='POST' action='/action/save'><button type='submit' class='btn-save'>💾 Lưu Dữ Liệu Ngay (Không tắt máy)</button></form> <form method='POST' action='/action/restart'><button type='submit' class='btn-restart'>🔁 Lưu & Khởi Động Phiên Mới</button></form> <form method='POST' action='/action/stop'><button type='submit' class='btn-stop'>🛑 Lưu & Tắt Hẳn Server</button></form> </div> <div class='note'>💡 Hỗ trợ đồng thời cả nút bấm trực tiếp lẫn API tự động (/api/status & /api/action/*).</div> </div> </body> </html> "@ $buf = [System.Text.Encoding]::UTF8.GetBytes($html) $resp.ContentType = "text/html; charset=utf-8" $resp.ContentLength64 = $buf.Length $resp.OutputStream.Write($buf, 0, $buf.Length) $resp.OutputStream.Close() } catch {} } '@ $webScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'web-panel.ps1') Set-Content -Path "$webScriptPath" -Value $webScript -Encoding UTF8 Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScriptPath`""
          Start-Sleep -Seconds 3
          exit 0

      # ───────────────────────────────────────────────
      # 12. HIỂN THỊ ĐẦY ĐỦ THÔNG TIN HỆ THỐNG & KẾT NỐI
      # ───────────────────────────────────────────────
      - name: 🎉 Bảng Thông Tin Kết Nối Đầy Đủ (RDP + Sunshine + StarDesk + Apps + CPU + Wallpaper)
        shell: pwsh
        run: |
          $tz    = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time')
          $start = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds([long]"$env:JOB_START_EPOCH").UtcDateTime, ($tz))
          $end   = $start.AddMinutes([int]"$env:TOTAL_MINUTES")

          $passText = if ("$env:RDP_PASS_SOURCE" -eq 'secret') { '(dùng secret RDP_PASSWORD)' } else { "$env:RDP_PASS" }
          $sdStat   = if (Test-Path 'C:\Program Files\StarDesk\StarDesk.exe') { 'Đang chạy (Bản mới nhất - Đã mở sẵn)' } else { 'Chưa cài' }
          $evStat   = if (Test-Path 'C:\ALB-Apps\EVKey\EVKey64.exe') { 'Đã cài & Tự bật (C:\ALB-Apps\EVKey)' } else { 'Chưa cài' }
          $vsStat   = if (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe') { 'Đã cài sẵn (Code.exe)' } else { 'Chưa cài' }
          $bdStat   = if (Test-Path 'C:\Program Files\Bandicam\bdcam.exe') { 'Đã cài sẵn (bdcam.exe)' } else { 'Chưa cài' }
          $msStat   = if (Get-AppxPackage -Name '*WindowsStore*' -ErrorAction SilentlyContinue) { 'Đã kích hoạt Microsoft Store' } else { 'Shortcut Desktop' }
          $ramInfo  = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
          $ramTotal = if ($ramInfo) { "$([math]::Round($ramInfo.TotalVisibleMemorySize / 1MB, 1)) GB" } else { '16 GB' }

          Write-Host ""
          Write-Host "┌────────────────────────────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│         👑 ALB-VPSFREE ULTIMATE — ZENOVA CLOUD EDITION SẴN SÀNG!           │" -ForegroundColor Cyan
          Write-Host "├────────────────────────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🏷️  Định danh máy     : $env:MACHINE_ID (Kho lưu: $env:RELEASE_TAG)" -ForegroundColor Cyan
          Write-Host "│ 🌿  Nhánh đồng bộ     : $env:STATE_BRANCH" -ForegroundColor Cyan
          Write-Host "│ 🪟  Hệ điều hành      : ${{ inputs.windows_image }} (Build: $env:OS_BUILD)" -ForegroundColor White
          Write-Host "│ ⚡  Vi xử lý & RAM    : $env:CPU_MODEL_INFO | RAM: $ramTotal (Ultimate Mode)" -ForegroundColor Yellow
          Write-Host "│ 🖼️  Hình nền mặc định : $env:WALLPAPER_STATUS (Áp dụng cả Win 22 & 25)" -ForegroundColor Magenta
          Write-Host "├────────────────────────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐  IP Tailscale      : $env:TAILSCALE_IP (RDP Port: 3389)" -ForegroundColor White
          if ("$env:FUNNEL_URL") {
              Write-Host "│ 🔗  Tailscale Funnel  : $env:FUNNEL_URL" -ForegroundColor Yellow
          }
          if ("$env:DUCKDNS_HOST") {
              Write-Host "│ 🦆  Tên miền DuckDNS  : $env:DUCKDNS_HOST" -ForegroundColor White
          }
          Write-Host "│ 🎛️  Web Quản Lý (All) : http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "│ ☀️  Sunshine Web UI   : https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "│ 👤  Tài khoản gốc     : $env:RDP_USER" -ForegroundColor Green
          Write-Host "│ 🔐  Mật khẩu cố định  : $passText" -ForegroundColor Green
          Write-Host "├────────────────────────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🚀  StarDesk          : $sdStat" -ForegroundColor Green
          Write-Host "│ ⌨️  EVKey             : $evStat" -ForegroundColor Green
          Write-Host "│ 💻  VSCode            : $vsStat" -ForegroundColor Green
          Write-Host "│ 🛍️  Microsoft Store   : $msStat" -ForegroundColor Green
          Write-Host "│ 🎥  Bandicam          : $bdStat" -ForegroundColor Green
          Write-Host "│ 🖥️  Màn hình ảo VDD   : ${{ inputs.vdd_resolution }}" -ForegroundColor Green
          Write-Host "│ 🔊  Âm thanh ảo       : $env:AUDIO_DEVICE_NAME" -ForegroundColor Green
          Write-Host "│ 💽  Ổ đĩa riêng       : $($env:MOUNT_LETTER):\ ($env:SHARED_ROOT)" -ForegroundColor Green
          Write-Host "│ ⏰  Thời gian phiên   : $env:DISPLAY_TIME ($($start.ToString('HH:mm:ss')) -> $($end.ToString('HH:mm:ss')))" -ForegroundColor White
          Write-Host "└────────────────────────────────────────────────────────────────────────────┘" -ForegroundColor Cyan
          exit 0

      # ───────────────────────────────────────────────
      # 13. DUY TRÌ PHIÊN & LẮNG NGHE WEB QUẢN LÝ
      # ───────────────────────────────────────────────
      - name: ⏳ Duy trì phiên làm việc (Lắng nghe Web Panel & Giữ Sunshine/StarDesk/Audio)
        id: keepalive
        shell: pwsh
        run: |
          $endEpoch   = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60)
          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1')
          $sigFile    = "$env:CONTROL_SIGNAL_FILE"
          $u          = "$env:RDP_USER"
          $sdExe      = 'C:\Program Files\StarDesk\StarDesk.exe'

          $lastLog = (Get-Date).AddHours(-1)
          $warned  = $false

          while ($true) {
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim()
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue

                  if (("$cmd" -eq 'SAVE_NOW') -or ("$cmd" -eq 'save')) {
                      Write-Host "💾 [WEB-PANEL] Nhận lệnh LƯU NGAY từ Web Quản Lý..." -ForegroundColor Cyan
                      & "$saveScript" -Reason 'manual-web-save'
                      if (Test-Path "$sdExe") {
                          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
                          if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) {
                              & schtasks.exe /Run /TN "ALB-Launch-StarDesk" *> $null
                              Start-Sleep -Seconds 2
                              if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) {
                                  Start-Process -FilePath "$sdExe" -WorkingDirectory 'C:\Program Files\StarDesk' -ErrorAction SilentlyContinue
                              }
                          }
                      }
                      $global:LASTEXITCODE = 0
                  } elseif (("$cmd" -eq 'RESTART_SESSION') -or ("$cmd" -eq 'restart') -or ("$cmd" -eq 'start-new')) {
                      Write-Host "🔁 [WEB-PANEL] Nhận lệnh LƯU & KHỞI ĐỘNG PHIÊN MỚI!" -ForegroundColor Yellow
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV"
                      break
                  } elseif (("$cmd" -eq 'STOP_SESSION') -or ("$cmd" -eq 'stop')) {
                      Write-Host "🛑 [WEB-PANEL] Nhận lệnh LƯU & TẮT HẲN SERVER!" -ForegroundColor Red
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV"
                      break
                  }
              }

              try {
                  @(quser 2>$null) | ForEach-Object {
                      $lineStr = "$_"
                      if (("$lineStr" -match "^\s*>?$([regex]::Escape("$u"))\s+") -and ("$lineStr" -notmatch "\s+console\s+")) {
                          $parts  = (($lineStr -replace '^>', ' ').Trim()) -split '\s+'
                          $sidNum = $parts[1..(($parts.Count) - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1
                          if (($sidNum) -and ("$lineStr" -match "\s+Disc\s+")) {
                              & tscon "$sidNum" /dest:console *> $null
                          }
                      }
                  }
              } catch {}

              $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              $remain = $endEpoch - $now
              if ($remain -le 0) { break }

              if ((((Get-Date) - $lastLog).TotalMinutes) -ge 5) {
                  $svc     = Get-Service -Name TermService -ErrorAction SilentlyContinue
                  $audSvc  = Get-Service -Name Audiosrv -ErrorAction SilentlyContinue
                  $sunProc = Get-Process -Name 'sunshine' -ErrorAction SilentlyContinue
                  $sunSvc  = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1
                  $sunStat = if (($sunProc) -or (($sunSvc) -and (($sunSvc.Status) -eq 'Running'))) { 'Running' } else { 'Stopped' }
                  $sdStat  = if (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue) { 'Running' } else { 'Stopped' }
                  $h = [math]::Floor($remain / 3600)
                  $m = [math]::Floor(($remain % 3600) / 60)
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 📊 [$env:MACHINE_ID] RDP:$($svc.Status) | Sunshine:$sunStat | StarDesk:$sdStat | Audio:$($audSvc.Status) | Còn:${h}h${m}m" -ForegroundColor Blue
                  $lastLog = Get-Date
              }

              $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
              if (($svc) -and (($svc.Status) -ne 'Running')) { Start-Service -Name TermService -ErrorAction SilentlyContinue }

              $audSvc = Get-Service -Name Audiosrv -ErrorAction SilentlyContinue
              if (($audSvc) -and (($audSvc.Status) -ne 'Running')) {
                  Start-Service -Name AudioEndpointBuilder -ErrorAction SilentlyContinue
                  Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
              }

              if (-not (Get-Process -Name 'sunshine' -ErrorAction SilentlyContinue)) {
                  $sunSvc = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($sunSvc) { Start-Service -Name ($sunSvc.Name) -ErrorAction SilentlyContinue }
              }

              if ((Test-Path "$sdExe") -and (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue))) {
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
                  & schtasks.exe /Run /TN "ALB-Launch-StarDesk" *> $null
                  Start-Sleep -Seconds 1
                  if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) {
                      Start-Process -FilePath "$sdExe" -WorkingDirectory 'C:\Program Files\StarDesk' -ErrorAction SilentlyContinue
                  }
              }

              if ((-not $warned) -and ($remain -le 300)) {
                  try { msg * /TIME:290 "ALB Cloud PC [$env:MACHINE_ID] sap het gio (con 5 phut). He thong se tu dong luu o dia $($env:MOUNT_LETTER): len GitHub!" } catch {}
                  $warned = $true
              }

              Start-Sleep -Seconds 3
          }
          exit 0

      # ───────────────────────────────────────────────
      # 14. LƯU DỮ LIỆU CUỐI PHIÊN & DỌN DẸP
      # ───────────────────────────────────────────────
      - name: 💾 Lưu toàn bộ ổ đĩa cuối phiên lên GitHub
        if: always()
        shell: pwsh
        run: |
          Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue
          Stop-Process -Name 'sunshine' -Force -ErrorAction SilentlyContinue
          & schtasks.exe /Delete /TN "ALB-Launch-StarDesk" /F *> $null
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null

          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1')
          if (Test-Path "$saveScript") {
              & "$saveScript" -Reason 'session-end'
              $global:LASTEXITCODE = 0
          }
          exit 0

      - name: 🧹 Dọn dẹp hệ thống
        if: always()
        shell: pwsh
        run: |
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path "$ts") {
              & "$ts" logout 2>&1 | Out-Null
              & "$ts" down 2>&1 | Out-Null
          }
          @('ALB-RDP','ALB-Sunshine-TCP','ALB-Sunshine-UDP') | ForEach-Object {
              Remove-NetFirewallRule -DisplayName "$_" -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force -ErrorAction SilentlyContinue
          Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue
          exit 0

      # ───────────────────────────────────────────────
      # 15. AUTO-RESTART (GỌI LẠI ĐÚNG MÃ MÁY & THÔNG SỐ)
      # ───────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo & Mở lại ổ đĩa
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || inputs.auto_restart == 'true' || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          WALL_URL: ${{ inputs.wallpaper_url }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          TS_ENABLED: ${{ inputs.enable_tailscale }}
          DDNS_ENABLED: ${{ inputs.enable_duckdns }}
        run: |
          $wf = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0])
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" `
            -f "machine_id=$env:MACHINE_ID" `
            -f "duration=$env:DURATION" `
            -f "auto_restart=true" `
            -f "drive_letter=$env:MOUNT_LETTER" `
            -f "vhd_size_gb=$env:VHD_SIZE_GB" `
            -f "windows_image=$env:WIN_IMAGE" `
            -f "fixed_password=$env:FIXED_PASS" `
            -f "vdd_resolution=$env:VDD_RES" `
            -f "wallpaper_url=$env:WALL_URL" `
            -f "choco_packages=$env:PKGS" `
            -f "optimize_windows=$($env:OPT.ToLower())" `
            -f "enable_tailscale=$($env:TS_ENABLED.ToLower())" `
            -f "enable_duckdns=$($env:DDNS_ENABLED.ToLower())"
          if (($LASTEXITCODE) -ne 0) { throw 'Không kích hoạt được phiên mới' }
