          $j1 = Start-FastJob -ArgsList @($ic) -Block { param($ic) if (-not (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe')) { $p = Start-Process "$ic\VSCode-win32-x64.zip" -ArgumentList '/VERYSILENT' -PassThru -NoNewWindow -EA SilentlyContinue; if ($p) { $p.WaitForExit(60000) } } }
