      - name: 🌐 Web Panel (FIX SERVY)
        shell: pwsh
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
          CREATOR: ${{ inputs.creator_name }}
        run: |
          $savePass = "$env:RDP_PASS"; $uObj = Get-LocalUser -Name "$env:RDP_USER" -ErrorAction SilentlyContinue; $userSid = if ($uObj) { $uObj.SID.Value } else { $null }
          $state = [ordered]@{ machineId = "$env:MACHINE_ID"; creator = "$env:CREATOR"; releaseTag = "$env:RELEASE_TAG"; user = "$env:RDP_USER"; extraUser = "$env:RDP_EXTRA_USER"; sid = "$userSid"; password = $savePass; windowsImage = "$env:WINDOWS_IMAGE"; driveLetter = "$env:MOUNT_LETTER"; tailscaleIp = "$env:TAILSCALE_IP"; durationMinutes = [int]"$env:TOTAL_MINUTES"; startUtc = (Get-Date).ToUniversalTime().ToString('o'); runId = "$env:GITHUB_RUN_ID" }
          $state | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path "$env:SHARED_STATE_FILE" -Encoding UTF8
          $webScript = @'
          $ErrorActionPreference = "Continue"
          $listener = [System.Net.HttpListener]::new()
          $listener.Prefixes.Add("http://+:$($env:WEB_PORT)/")
          $listener.Start()
          $jobStart = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $endEpoch = $jobStart + (([long]$env:TOTAL_MINUTES) * 60)
          while ($listener.IsListening) {
              try {
                  $ctx = $listener.GetContext(); $req = $ctx.Request; $resp = $ctx.Response
                  $path = $req.Url.AbsolutePath.ToLower()
                  $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); $remain = [math]::Max(0, ($endEpoch) - ($now))
                  $h = [math]::Floor($remain / 3600); $m = [math]::Floor(($remain % 3600) / 60); $s = $remain % 60
                  if ($path -eq "/health") { $health = [ordered]@{ machineId = "$env:MACHINE_ID"; creator = "$env:CREATOR"; status = "ok"; rdp = (Get-Service TermService -ErrorAction SilentlyContinue).Status.ToString(); remaining_seconds = $remain }; $json = $health | ConvertTo-Json -Compress; $buf = [System.Text.Encoding]::UTF8.GetBytes("$json"); $resp.ContentType = "application/json"; $resp.ContentLength64 = $buf.Length; $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close(); continue }
                  if ($req.HttpMethod -eq "POST") { if ($path -eq "/action/save") { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "SAVE_NOW" -Encoding UTF8 } elseif ($path -eq "/action/restart") { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "RESTART_SESSION" -Encoding UTF8 } elseif ($path -eq "/action/stop") { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "STOP_SESSION" -Encoding UTF8 } }
                  $html = "<!DOCTYPE html><html><head><meta charset='utf-8'><title>ALB Panel</title><style>body{background:#0f172a;color:#f8fafc;font-family:Segoe UI;padding:24px;display:flex;justify-content:center}.card{max-width:600px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px}h1{color:#38bdf8;margin:0 0 8px}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e293b}.val{color:#4ade80;font-weight:600}button{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:white;margin:6px 0}.btn-save{background:#0284c7}.btn-restart{background:#d97706}.btn-stop{background:#dc2626}</style></head><body><div class='card'><h1>ALB Panel [$env:MACHINE_ID]</h1><div class='row'><span>IP:</span><span class='val'>$env:TAILSCALE_IP</span></div><div class='row'><span>Creator:</span><span class='val'>$env:CREATOR</span></div><div class='row'><span>User:</span><span class='val'>$env:RDP_USER / $env:RDP_EXTRA_USER</span></div><div class='row'><span>O dia:</span><span class='val'>$env:MOUNT_LETTER:\</span></div><div class='row'><span>Con lai:</span><span class='val'>${h}h${m}m${s}s</span></div><form method='POST' action='/action/save'><button class='btn-save'>Luu Ngay</button></form><form method='POST' action='/action/restart'><button class='btn-restart'>Luu & Restart</button></form><form method='POST' action='/action/stop'><button class='btn-stop'>Luu & Tat</button></form></div></body></html>"
                  $buf = [System.Text.Encoding]::UTF8.GetBytes($html); $resp.ContentType = "text/html; charset=utf-8"; $resp.ContentLength64 = $buf.Length; $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close()
              } catch {}
          }
          '@
          $webScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'web-panel.ps1')
          Set-Content -Path "$webScriptPath" -Value $webScript -Encoding UTF8
          $servyCliPath = "$env:ProgramFiles\Servy\servy-cli.exe"; $servyOk = $false
          if (Test-Path $servyCliPath) { $servyOk = $true; Write-Host "  OK: Servy da co san" -ForegroundColor Green }
          else { Write-Host "  Cai Servy qua Chocolatey..." -ForegroundColor Cyan; try { choco install servy -y --no-progress 2>&1 | Out-Null; Start-Sleep -Seconds 5; $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine"); if (Test-Path $servyCliPath) { $servyOk = $true; Write-Host "  OK: Servy da cai qua Chocolatey" -ForegroundColor Green } } catch { Write-Host "  WARN: Chocolatey fail" -ForegroundColor Yellow } }
          if (-not $servyOk) { Write-Host "  Fallback: Tai Servy installer truc tiep..." -ForegroundColor Yellow; try { $servyInstaller = "$env:TEMP\servy-installer.exe"; $servyUrl = "https://github.com/aelassas/servy/releases/latest/download/servy-net48-x64-installer.exe"; Invoke-WebRequest -Uri $servyUrl -OutFile $servyInstaller -UseBasicParsing -TimeoutSec 120; if (Test-Path $servyInstaller) { Start-Process -FilePath $servyInstaller -ArgumentList '/VERYSILENT /NORESTART /SUPPRESSMSGBOXES /SP- /CLOSEAPPLICATIONS /NOCANCEL' -Wait -NoNewWindow; Start-Sleep -Seconds 5; $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine"); if (Test-Path $servyCliPath) { $servyOk = $true; Write-Host "  OK: Servy da cai qua installer" -ForegroundColor Green } } } catch { Write-Host "  WARN: Tai installer fail" -ForegroundColor Yellow } }
          if ($servyOk -and (Test-Path $servyCliPath)) { Write-Host "  Dung Servy de tao service..." -ForegroundColor Cyan; & $servyCliPath install --name="ALB-WebPanel" --path="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" --params="-NoProfile -File `"$webScriptPath`"" --startupType="Automatic" 2>&1 | Out-Null; & $servyCliPath start --name="ALB-WebPanel" 2>&1 | Out-Null; Start-Sleep -Seconds 3; $test = Test-NetConnection -ComputerName 127.0.0.1 -Port $env:WEB_PORT -WarningAction SilentlyContinue; if ($test.TcpTestSucceeded) { Write-Host "  OK: Web Panel service dang chay" -ForegroundColor Green } else { Write-Host "  WARN: Port khong listen, fallback Start-Job..." -ForegroundColor Yellow; Start-Job -ScriptBlock { & pwsh -NoProfile -File $using:webScriptPath } | Out-Null } }
          else { Write-Host "  Fallback: Chay Web Panel bang Start-Job..." -ForegroundColor Yellow; Start-Job -ScriptBlock { & pwsh -NoProfile -File $using:webScriptPath } | Out-Null; Start-Sleep -Seconds 3; $test = Test-NetConnection -ComputerName 127.0.0.1 -Port $env:WEB_PORT -WarningAction SilentlyContinue; if ($test.TcpTestSucceeded) { Write-Host "  OK: Web Panel dang chay (Start-Job)" -ForegroundColor Green } else { Write-Host "  WARN: Port khong listen" -ForegroundColor Yellow } }
          exit 0

      - name: 📋 IN IP DE KET NOI
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║                    THONG TIN KET NOI RDP                    ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  IP Tailscale : $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "║  User         : $env:RDP_EXTRA_USER (hoac $env:RDP_USER)" -ForegroundColor White
          Write-Host "║  Password     : $env:RDP_PASS" -ForegroundColor White
          Write-Host "║  Port         : 3389" -ForegroundColor White
          Write-Host "╠══════════════════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  NEU KHONG CONNECT DUOC:                                    ║" -ForegroundColor Yellow
          Write-Host "║  1. Xoa credential cu: cmdkey /delete:TERMSRV/<IP>          ║" -ForegroundColor Yellow
          Write-Host "║  2. Thu dung IP moi nhat tu log nay                         ║" -ForegroundColor Yellow
          Write-Host "║  3. Thu user: $env:RDP_USER thay vi $env:RDP_EXTRA_USER" -ForegroundColor Yellow
          Write-Host "╚══════════════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          exit 0

      - name: 🎉 Thông tin kết nối
        shell: pwsh
        env:
          CREATOR: ${{ inputs.creator_name }}
        run: |
          $passText = "$env:RDP_PASS"; $audioName = if ($env:AUDIO_DEVICE_NAME) { $env:AUDIO_DEVICE_NAME } else { 'N/A' }
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  ALB ULTIMATE RDP v15.0 FINAL" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  May         : $env:MACHINE_ID" -ForegroundColor Cyan
          Write-Host "  Creator     : $env:CREATOR" -ForegroundColor Cyan
          Write-Host "  IP Tailscale: $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "  User goc    : $env:RDP_USER" -ForegroundColor Green
          Write-Host "  User ngoai  : $env:RDP_EXTRA_USER" -ForegroundColor Green
          Write-Host "  Mat khau    : $passText" -ForegroundColor Green
          Write-Host "  Audio       : $audioName" -ForegroundColor Green
          Write-Host "  Web Panel   : http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "  Sunshine    : https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "  Discord     : Da cai san" -ForegroundColor Green
          Write-Host "  StarDesk    : Da cai san + backup/restore" -ForegroundColor Green
          Write-Host "  RDP Prompt  : NLA=0, TLS=0, fPromptForPassword=1 (2 vi tri)" -ForegroundColor Yellow
          Write-Host "  Tailscale   : UNATTENDED MODE" -ForegroundColor Yellow
          Write-Host "============================================================" -ForegroundColor Cyan
          exit 0

      - name: ⏳ Duy trì phiên
        id: keepalive
        shell: pwsh
        run: |
          function Test-Port { param($Port, $TimeoutMs = 1500) try { $tcp = New-Object System.Net.Sockets.TcpClient; $task = $tcp.ConnectAsync("127.0.0.1", $Port); if ($task.Wait($TimeoutMs)) { $tcp.Close(); return $true }; $tcp.Close(); return $false } catch { return $false } }
          $jobStart = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $endEpoch = $jobStart + (([long]$env:TOTAL_MINUTES) * 60); $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1'); $sigFile = "$env:CONTROL_SIGNAL_FILE"; $u = "$env:RDP_USER"
          $lastLog = (Get-Date).AddHours(-1); $warned = $false
          while ($true) {
              if (Test-Path "$sigFile") { $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim(); Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue; if ("$cmd" -eq 'SAVE_NOW') { & "$saveScript" -Reason 'manual'; $global:LASTEXITCODE = 0 } elseif ("$cmd" -eq 'RESTART_SESSION') { 'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV"; break } elseif ("$cmd" -eq 'STOP_SESSION') { 'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV"; break } }
              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); $remain = $endEpoch - $now; if ($remain -le 0) { break }
              if (((Get-Date) - $lastLog).TotalMinutes -ge 5) { $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue; $sunOK = Test-Port 47990; $h = [math]::Floor($remain / 3600); $m = [math]::Floor(($remain % 3600) / 60); Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP:$($svc.Status) Sun:$sunOK Con:${h}h${m}m" -ForegroundColor Blue; $lastLog = Get-Date }
              if (-not (Test-Port 47990)) { Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; $sunSvc = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1; if ($sunSvc) { Start-Service -Name ($sunSvc.Name) -ErrorAction SilentlyContinue } else { Start-Process -FilePath 'C:\Program Files\Sunshine\sunshine.exe' -WorkingDirectory 'C:\Program Files\Sunshine' -WindowStyle Hidden -ErrorAction SilentlyContinue } }
              if ((-not $warned) -and ($remain -le 300)) { try { msg * /TIME:290 "ALB RDP [$env:MACHINE_ID] sap het gio!" } catch {}; $warned = $true }
              Start-Sleep -Seconds 2
          }
          exit 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        run: |
          Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue; Stop-Process -Name 'sunshine' -Force -ErrorAction SilentlyContinue; & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1'); if (Test-Path "$saveScript") { & "$saveScript" -Reason 'session-end'; $global:LASTEXITCODE = 0 }; exit 0

      - name: 🧹 Dọn dẹp
        if: always()
        shell: pwsh
        run: |
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"; if (Test-Path "$ts") { & "$ts" logout 2>&1 | Out-Null; & "$ts" down 2>&1 | Out-Null }
          Remove-NetFirewallRule -DisplayName 'ALB-RDP' -ErrorAction SilentlyContinue; Remove-NetFirewallRule -DisplayName 'ALB-Sunshine-TCP' -ErrorAction SilentlyContinue; Remove-NetFirewallRule -DisplayName 'ALB-Sunshine-UDP' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force -ErrorAction SilentlyContinue; Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue; exit 0

      - name: 🔁 Auto-restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && inputs.auto_restart && !inputs.run_once }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          RDP_USERNAME: ${{ inputs.rdp_username }}
          RDP_PASSWORD: ${{ inputs.rdp_password }}
          CREATOR: ${{ inputs.creator_name }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          PKGS: ${{ inputs.choco_packages }}
          APP_URLS: ${{ inputs.app_urls }}
          OPT: ${{ inputs.optimize_windows }}
          DDNS: ${{ inputs.enable_duckdns }}
        run: |
          $wf = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0])
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" -f "machine_ids=$env:MACHINE_ID" -f "duration=$env:DURATION" -f auto_restart=true -f run_once=false -f "drive_letter=$env:MOUNT_LETTER" -f "vhd_size_gb=$env:VHD_SIZE_GB" -f "windows_image=$env:WIN_IMAGE" -f "rdp_username=$env:RDP_USERNAME" -f "rdp_password=$env:RDP_PASSWORD" -f "creator_name=$env:CREATOR" -f "vdd_resolution=$env:VDD_RES" -f "choco_packages=$env:PKGS" -f "app_urls=$env:APP_URLS" -f "optimize_windows=$($env:OPT.ToLower())" -f "enable_duckdns=$($env:DDNS.ToLower())"
          if (($LASTEXITCODE) -ne 0) { throw 'Restart fail' }
