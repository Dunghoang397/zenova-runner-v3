      - name: ⏳ Bước 10 - Watchdog
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        run: |
          function Test-Port {
            param([int]$P)
            try {
              $t = [System.Net.Sockets.TcpClient]::new()
              $a = $t.ConnectAsync('127.0.0.1', $P)
              $ok = $a.Wait(1500)
              $t.Close()
              return $ok
            } catch { return $false }
          }
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + ([long]$env:TOTAL_MINUTES * 60)
          $sig = $env:CONTROL_SIGNAL_FILE
          while ($true) {
            if (Test-Path $sig) {
              $c = (Get-Content -Raw $sig).Trim(); Remove-Item $sig -Force -EA SilentlyContinue
              if ($c -eq 'SAVE_NOW') { & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'manual' }
              elseif ($c -eq 'RESTART_SESSION') { 'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV; break }
              elseif ($c -eq 'STOP_SESSION') { 'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV; break }
            }
            if ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() -ge $end) { break }
            if (-not (Test-Port 47990)) { & schtasks.exe /Run /TN "ALB-Launch-Sunshine" *> $null }
            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Bước 11 - Lưu Cuối Phiên
        if: ${{ always() }}
        shell: pwsh
        timeout-minutes: 10
        run: |
          try { Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue; & taskkill.exe /F /IM 'StarDesk*' /T *> $null; if (Test-Path "$env:RUNNER_TEMP\save-data.ps1") { & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'session-end' } } catch {}
          $global:LASTEXITCODE = 0

      - name: 🧹 Bước 12 - Dọn Dẹp
        if: ${{ always() }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            if (Test-Path $ts) { & $ts logout 2>&1 | Out-Null; & $ts down 2>&1 | Out-Null }
            $vhd = "$env:VHD_CONTAINER\zenova-os-disk.vhdx"
            if (Test-Path $vhd) { Dismount-VHD -Path $vhd -EA SilentlyContinue }
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🔁 Bước 13 - Auto Restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          CHOCO_PKGS: ${{ inputs.choco_packages }}
          OPT_WIN: ${{ inputs.optimize_windows }}
          EN_TS: ${{ inputs.enable_tailscale }}
          EN_DNS: ${{ inputs.enable_duckdns }}
        run: |
          $wfRef = $env:GITHUB_WORKFLOW_REF
          $wfFile = if ($wfRef) { ($wfRef -split '@')[0] -split '/' | Select-Object -Last 1 } else { "$env:GITHUB_WORKFLOW.yml" -replace ' ', '-' }
          
          $a = @(
            'workflow', 'run', $wfFile,
            '--ref', $env:GITHUB_REF_NAME,
            '-f', "machine_id=$env:MACHINE_ID",
            '-f', "duration=$env:DURATION",
            '-f', 'auto_restart=true',
            '-f', "drive_letter=$env:MOUNT_LETTER",
            '-f', "vhd_size_gb=$env:VHD_SIZE_GB_VALIDATED",
            '-f', "windows_image=$env:WIN_IMAGE",
            '-f', "fixed_password=$env:FIXED_PASS",
            '-f', "vdd_resolution=$env:VDD_RES",
            '-f', "choco_packages=$env:CHOCO_PKGS",
            '-f', "optimize_windows=$($env:OPT_WIN.ToLower())",
            '-f', "enable_tailscale=$($env:EN_TS.ToLower())",
            '-f', "enable_duckdns=$($env:EN_DNS.ToLower())"
          )
          & gh @a
          if ($LASTEXITCODE -ne 0) { throw 'Auto-restart fail' }
          Write-Host "✅ Đã kích hoạt phiên tiếp theo" -ForegroundColor Green
