            }
            if ((-not (Test-Path $sunExe)) -or (-not (Test-Path "$sunDir\assets"))) {
              if ((Test-Path "$ic\sunshine-setup.exe") -and ((Get-Item "$ic\sunshine-setup.exe").Length -gt 5MB)) {
                $p = Start-Process "$ic\sunshine-setup.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
                if ($p) { $null = $p.WaitForExit(60000) }
              }
              if ((Test-Path $sunExe) -and (Test-Path "$sunDir\assets")) {
                robocopy $sunDir $sunPortDir /E /XJ /R:0 /W:0 /MT:32 /NFL /NDL /NJH /NJS /NP /XF '*.log' *> $null
              }
            }
          }

          $jVs = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            $vsPersist = 'C:\ALB-Apps\VSCode'
            if ((-not (Test-Path "$vsPersist\Code.exe")) -and (Test-Path "$ic\VSCode-win32-x64.zip")) {
              New-Item -ItemType Directory -Force -Path $vsPersist | Out-Null
              & 7z x "$ic\VSCode-win32-x64.zip" "-o$vsPersist" -y -mmt=on *> $null
            }
            if ((Test-Path "$vsPersist\Code.exe") -and (-not (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe'))) {
              New-Item -ItemType Junction -Path 'C:\Program Files\Microsoft VS Code' -Target $vsPersist -Force -EA SilentlyContinue | Out-Null
            }
          }

          $jSp = Start-FastJob -ArgsList @($ic, $locData) -Block {
            param($ic, $locData)
            $spDir = "$locData\Spotify"
            if ((-not (Test-Path "$spDir\Spotify.exe")) -and (Test-Path "$ic\Spotify.exe")) {
              New-Item -ItemType Directory -Force -Path $spDir | Out-Null
              & 7z x "$ic\Spotify.exe" "-o$spDir" -y -mmt=on *> $null
              if (-not (Test-Path "$spDir\Spotify.exe")) {
                $p = Start-Process "$ic\Spotify.exe" -ArgumentList '/silent','/skip-app-launch' -PassThru -NoNewWindow -EA SilentlyContinue
                if ($p) { $null = $p.WaitForExit(35000) }
              }
            }
          }

          $jDc = Start-FastJob -ArgsList @($ic, $locData, $appData) -Block {
            param($ic, $locData, $appData)
            $dcRoot = "$locData\Discord"
            $existingExe = Get-ChildItem "$dcRoot\app-*" -Filter 'Discord.exe' -EA SilentlyContinue | Select-Object -First 1
            if ((-not $existingExe) -and (Test-Path "$ic\DiscordSetup.exe")) {
              $tmpDc = "$ic\dc-unpack"
              if (Test-Path $tmpDc) { Remove-Item $tmpDc -Recurse -Force -EA SilentlyContinue }
              New-Item -ItemType Directory -Force -Path $tmpDc, "$dcRoot\packages" | Out-Null
              & 7z x "$ic\DiscordSetup.exe" "-o$tmpDc" -y -mmt=on *> $null
              if (Test-Path "$tmpDc\Update.exe") { Copy-Item "$tmpDc\Update.exe" "$dcRoot\Update.exe" -Force -EA SilentlyContinue }
              if (Test-Path "$tmpDc\RELEASES") { Copy-Item "$tmpDc\RELEASES" "$dcRoot\packages\RELEASES" -Force -EA SilentlyContinue }
              $nupkg = Get-ChildItem $tmpDc -Filter 'Discord-*.nupkg' -EA SilentlyContinue | Select-Object -First 1
              if ($nupkg) {
                Copy-Item $nupkg.FullName "$dcRoot\packages\$($nupkg.Name)" -Force -EA SilentlyContinue
                $ver = '1.0.9175'
                if ($nupkg.Name -match 'Discord-([0-9\.]+)-full') { $ver = $Matches[1] }
                $appVerDir = "$dcRoot\app-$ver"
                New-Item -ItemType Directory -Force -Path $appVerDir | Out-Null
                & 7z x $nupkg.FullName "-o$tmpDc\pkg" -y -mmt=on *> $null
                if (Test-Path "$tmpDc\pkg\lib\net45") {
                  robocopy "$tmpDc\pkg\lib\net45" $appVerDir /E /R:0 /W:0 /MT:32 /NFL /NDL /NJH /NJS /NP *> $null
                }
              }
              Remove-Item $tmpDc -Recurse -Force -EA SilentlyContinue
            }
            $dcRoam = "$appData\discord"
            New-Item -ItemType Directory -Force -Path $dcRoam | Out-Null
            '{"SKIP_HOST_UPDATE":true,"BACKGROUND_COLOR":"#202225"}' | Set-Content "$dcRoam\settings.json" -Encoding UTF8 -Force
          }

          $jApps = Start-FastJob -ArgsList @($ic, $locData) -Block {
            param($ic, $locData)
            $ev = 'C:\ALB-Apps\EVKey'
            if ((-not (Test-Path "$ev\EVKey64.exe")) -and (Test-Path "$ic\EVKey.zip")) {
              & 7z x "$ic\EVKey.zip" "-o$ev" -y -mmt=on *> $null
            }
            if ((-not (Test-Path 'C:\Program Files\Bandicam\bdcam.exe')) -and (Test-Path "$ic\bdcam.exe")) {
              $p1 = Start-Process "$ic\bdcam.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p1) { $null = $p1.WaitForExit(35000) }
            }
            if ((-not (Test-Path 'C:\Program Files\StarDesk\StarDesk.exe')) -and (Test-Path "$ic\StarDesk.exe") -and ((Get-Item "$ic\StarDesk.exe").Length -gt 5MB)) {
              $p2 = Start-Process "$ic\StarDesk.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p2) { $null = $p2.WaitForExit(35000) }
            }
            if ((-not (Test-Path "$locData\Roblox\Versions")) -and (-not (Test-Path 'C:\Program Files (x86)\Roblox\Versions')) -and (Test-Path "$ic\Roblox.exe")) {
              $p3 = Start-Process "$ic\Roblox.exe" -ArgumentList '-q','--no-ui' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p3) { $null = $p3.WaitForExit(35000) }
            }
          }

          $allJobs = @($jHw, $jSun, $jVs, $jSp, $jDc, $jApps)
          $null = Wait-Job -Job $allJobs -Timeout 70
          $allJobs | Remove-Job -Force -EA SilentlyContinue
          "AUDIO_DEVICE_NAME=VB-Audio Virtual Cable (Active)" >> $env:GITHUB_ENV

          $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"
          if (Test-Path $sunExe) {
            Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue
            Stop-Process -Name sunshine -Force -EA SilentlyContinue
            Start-Sleep -Milliseconds 500

            $uObj = Get-LocalUser -Name $user -EA SilentlyContinue
            if ($uObj) {
              & icacls $sunDir /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null
              & icacls $sunPersist /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null
            }

            $cfg = "$sunDir\config"
            if ((Test-Path $cfg) -and ((Get-Item $cfg -Force).Attributes -notmatch 'ReparsePoint')) {
              if (@(Get-ChildItem $sunPersist -Force -EA SilentlyContinue).Count -eq 0) {
                Copy-Item "$cfg\*" $sunPersist -Recurse -Force -EA SilentlyContinue
              }
              Remove-Item $cfg -Recurse -Force -EA SilentlyContinue
            }
            if (-not (Test-Path $cfg)) { New-Item -ItemType Junction $cfg -Target $sunPersist -Force | Out-Null }

            @(
              "sunshine_name = ZENOVA-$($env:MACHINE_ID)",
              "min_log_level = info",
              "origin_web_ui_allowed = wan",
              "upnp = disabled",
              "address_family = both"
            ) -join "`r`n" | Set-Content "$sunPersist\sunshine.conf" -Encoding UTF8 -Force

            Remove-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -EA SilentlyContinue
            New-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -Direction Inbound -Action Allow -Program $sunExe -Profile Any | Out-Null

            Push-Location $sunDir
            & $sunExe --creds $user $pass *> $null
            Pop-Location

            $sunLauncher = "$sunDir\launch-sunshine.bat"
            @(
              '@echo off',
              'cd /d "C:\Program Files\Sunshine"',
              'start "" /b "C:\Program Files\Sunshine\sunshine.exe"'
            ) -join "`r`n" | Set-Content -Path $sunLauncher -Encoding ASCII -Force

            & schtasks.exe /Create /TN "ALB-Launch-Sunshine" /TR "`"$sunLauncher`"" /SC ONCE /ST 00:00 /RU $user /RL HIGHEST /F *> $null
            $null = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine = '"C:\Program Files\Sunshine\sunshine.exe"'
              CurrentDirectory = 'C:\Program Files\Sunshine'
            } -EA SilentlyContinue
          }

          @($userDesk, $pubDesk) | ForEach-Object {
            if (Test-Path $_) {
              Get-ChildItem -Path $_ -Include '*.lnk','*.url','*.bat' -File -Force -EA SilentlyContinue | Remove-Item -Force -EA SilentlyContinue
            }
          }

          $ws = New-Object -ComObject WScript.Shell
          function New-CleanShortcut {
            param([string]$Title, [string]$Target, [string]$WorkDir = '')
            if (Test-Path $Target) {
              $lnk = $ws.CreateShortcut("$pubDesk\$Title.lnk")
              $lnk.TargetPath = $Target
              $lnk.WorkingDirectory = if ($WorkDir) { $WorkDir } else { [System.IO.Path]::GetDirectoryName($Target) }
              $lnk.Save()
            }
          }
          function New-CleanUrl {
            param([string]$Title, [string]$Url)
            @('[InternetShortcut]', "URL=$Url", 'IconIndex=0') -join "`r`n" | Set-Content -Path "$pubDesk\$Title.url" -Encoding ASCII -Force
          }

          $lnkDrive = $ws.CreateShortcut("$pubDesk\01. Ổ Đĩa Riêng ZENOVA-OS ($($env:MOUNT_LETTER)).lnk")
          $lnkDrive.TargetPath = "$($env:MOUNT_LETTER):\"
          $lnkDrive.Save()

          $lnkData = $ws.CreateShortcut("$pubDesk\02. Thư Mục Dữ Liệu ZENOVA.lnk")
          $lnkData.TargetPath = $env:SHARED_DATA_DIR
          $lnkData.Save()

          New-CleanUrl -Title '03. Web Quản Lý VPS' -Url "http://127.0.0.1:$($env:WEB_PORT)/"
          New-CleanUrl -Title '04. Sunshine Web UI' -Url "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"

          @(
            '@echo off',
            'for /f "tokens=3-4" %%a in (''query session %USERNAME%'') do @if "%%b"=="Active" tscon %%a /dest:console'
          ) -join "`r`n" | Set-Content -Path "$pubDesk\05. Ngắt RDP Giữ Màn Hình.bat" -Encoding ASCII -Force

          $browserExe = if (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') { 'C:\Program Files\Google\Chrome\Application\chrome.exe' } elseif (Test-Path 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe') { 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' } else { $null }
          if ($browserExe) { New-CleanShortcut -Title '06. Trình Duyệt Web' -Target $browserExe }

          $vsExe = if (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe') { 'C:\Program Files\Microsoft VS Code\Code.exe' } elseif (Test-Path 'C:\ALB-Apps\VSCode\Code.exe') { 'C:\ALB-Apps\VSCode\Code.exe' } else { $null }
          if ($vsExe) { New-CleanShortcut -Title '07. Visual Studio Code' -Target $vsExe }

          $dcExeObj = Get-ChildItem "$locData\Discord\app-*" -Filter 'Discord.exe' -EA SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($dcExeObj) { New-CleanShortcut -Title '08. Discord' -Target $dcExeObj.FullName -WorkDir $dcExeObj.DirectoryName }

          if (Test-Path "$locData\Spotify\Spotify.exe") {
            New-CleanShortcut -Title '09. Spotify' -Target "$locData\Spotify\Spotify.exe"
          }

          $bdExe = if (Test-Path 'C:\Program Files\Bandicam\bdcam.exe') { 'C:\Program Files\Bandicam\bdcam.exe' } elseif (Test-Path 'C:\Program Files (x86)\Bandicam\bdcam.exe') { 'C:\Program Files (x86)\Bandicam\bdcam.exe' } else { $null }
          if ($bdExe) { New-CleanShortcut -Title '10. Bandicam' -Target $bdExe }

          $evExe = if (Test-Path 'C:\ALB-Apps\EVKey\EVKey64.exe') { 'C:\ALB-Apps\EVKey\EVKey64.exe' } elseif (Test-Path 'C:\ALB-Apps\EVKey\EVKey32.exe') { 'C:\ALB-Apps\EVKey\EVKey32.exe' } else { $null }
          if ($evExe) {
            New-CleanShortcut -Title '11. EVKey Tiếng Việt' -Target $evExe
            $stEv = $ws.CreateShortcut("$startupDir\EVKey.lnk"); $stEv.TargetPath = $evExe; $stEv.Save()
            Start-Process $evExe -WorkingDirectory 'C:\ALB-Apps\EVKey' -EA SilentlyContinue
          }

          if (Test-Path 'C:\Program Files\StarDesk\StarDesk.exe') {
            New-CleanShortcut -Title '12. StarDesk Remote' -Target 'C:\Program Files\StarDesk\StarDesk.exe'
            Get-Service -Name '*StarDesk*' -EA SilentlyContinue | ForEach-Object { Set-Service -Name $_.Name -StartupType Automatic -EA SilentlyContinue; Start-Service -Name $_.Name -EA SilentlyContinue }
            & schtasks.exe /Create /TN "AISTV-Launch-StarDesk" /TR "`"C:\Program Files\StarDesk\StarDesk.exe`"" /SC ONCE /ST 00:00 /RU $user /RL HIGHEST /IT /F *> $null
            & schtasks.exe /Run /TN "AISTV-Launch-StarDesk" *> $null
          } elseif (Test-Path "$ic\StarDesk.exe") {
            New-CleanShortcut -Title '12. StarDesk Remote' -Target "$ic\StarDesk.exe"
          }

          $rbExeObj = Get-ChildItem @("$locData\Roblox\Versions", 'C:\Program Files (x86)\Roblox\Versions', 'C:\Program Files\Roblox\Versions') -Filter 'RobloxPlayerBeta.exe' -Recurse -EA SilentlyContinue | Select-Object -First 1
          if ($rbExeObj) {
            New-CleanShortcut -Title '13. Roblox Player' -Target $rbExeObj.FullName
          } elseif (Test-Path "$ic\Roblox.exe") {
            New-CleanShortcut -Title '13. Roblox Player' -Target "$ic\Roblox.exe"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:CHOCO_PKGS)) {
            $pkgs = $env:CHOCO_PKGS -split '[,\s]+' | Where-Object { $_ }
            $pkgs | ForEach-Object { & choco install $_ -y --no-progress --limit-output 2>&1 | Out-Null }
          }

          'SESSION_READY=1' >> $env:GITHUB_ENV
          Write-Host "✅ Hoàn tất cài đặt siêu tốc toàn bộ App, Sunshine & Hình nền gốc Zenova!" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🌐 Khởi Chạy Web Quản Lý VPS (Port 8080) & Bảng Thông Tin Kết Nối
        shell: pwsh
        timeout-minutes: 3
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $port = $env:WEB_PORT
          $tsIp = if ($env:TAILSCALE_IP) { $env:TAILSCALE_IP } else { '127.0.0.1' }
          $pubIp = if ($env:DUCKDNS_PUBLIC_IP) { $env:DUCKDNS_PUBLIC_IP } else { 'N/A' }
          $ddns = if ($env:DUCKDNS_URL) { $env:DUCKDNS_URL } else { 'Chưa bật' }
          $rdpHost = if ($env:DUCKDNS_URL) { $env:DUCKDNS_URL } elseif ($tsIp -ne '127.0.0.1') { $tsIp } else { $pubIp }
          $rdpPass = if ($env:RDP_PASS) { $env:RDP_PASS } else { 'Aistv@2026' }

          $stateObj = [ordered]@{
            machineId = $env:MACHINE_ID
            releaseTag = $env:RELEASE_TAG
            user = $env:RDP_USER
            password = $rdpPass
            windowsImage = $env:WINDOWS_IMAGE
            driveLetter = $env:MOUNT_LETTER
            tailscaleIp = $tsIp
            funnelUrl = $env:FUNNEL_URL
            durationMinutes = [int]$env:REQUESTED_MINUTES
            lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $stateObj | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path $env:SHARED_STATE_FILE -Encoding UTF8

          $webLines = @(
            '$ErrorActionPreference = "Continue"',
            '$listener = [System.Net.HttpListener]::new()',
            '$listener.Prefixes.Add("http://+:$($env:WEB_PORT)/")',
            '$listener.Start()',
            '$endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:REQUESTED_MINUTES") * 60)',
            'while ($listener.IsListening) {',
            '  try {',
            '    $ctx = $listener.GetContext()',
            '    $req = $ctx.Request',
            '    $resp = $ctx.Response',
            '    $path = $req.Url.AbsolutePath.ToLower()',
            '    $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()',
            '    $remain = [math]::Max(0, ($endEpoch) - ($now))',
            '    $h = [math]::Floor(($remain) / 3600)',
            '    $m = [math]::Floor((($remain) % 3600) / 60)',
            '    $s = ($remain) % 60',
            '    if (($path -eq "/api/status") -or ($path -eq "/health")) {',
            '      $st = [ordered]@{ machineId = "$env:MACHINE_ID"; releaseTag = "$env:RELEASE_TAG"; status = "ok"; remaining_seconds = $remain; remaining_display = "${h}h${m}m${s}s"; tailscale_ip = "$env:TAILSCALE_IP"; drive = "$env:MOUNT_LETTER"; drive_label = "ZENOVA-OS"; cpu = "$env:CPU_MODEL_INFO" } | ConvertTo-Json -Compress',
            '      $buf = [System.Text.Encoding]::UTF8.GetBytes("$st")',
            '      $resp.ContentType = "application/json; charset=utf-8"',
            '      $resp.ContentLength64 = $buf.Length',
            '      $resp.OutputStream.Write($buf, 0, $buf.Length)',
            '      $resp.OutputStream.Close()',
            '      continue',
            '    }',
            '    if ((($req.HttpMethod) -eq "POST") -and ($path -like "/api/action/*")) {',
            '      $act = "$path" -replace "/api/action/", ""',
            '      if ($act -eq "save") { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "SAVE_NOW" -Encoding UTF8; $rj = ''{"ok":true,"action":"save"}'' }',
            '      elseif (($act -eq "restart") -or ($act -eq "start-new")) { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "RESTART_SESSION" -Encoding UTF8; $rj = ''{"ok":true,"action":"restart"}'' }',
            '      elseif ($act -eq "stop") { Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "STOP_SESSION" -Encoding UTF8; $rj = ''{"ok":true,"action":"stop"}'' }',
            '      else { $rj = ''{"ok":false}'' }',
            '      $buf = [System.Text.Encoding]::UTF8.GetBytes("$rj")',
            '      $resp.ContentType = "application/json; charset=utf-8"',
            '      $resp.ContentLength64 = $buf.Length',
            '      $resp.OutputStream.Write($buf, 0, $buf.Length)',
            '      $resp.OutputStream.Close()',
            '      continue',
            '    }',
            '    $statusMsg = ""',
            '    if (($req.HttpMethod) -eq "POST") {',
            '      if (("$path" -eq "/action/save") -or ("$path" -eq "/save")) {',
            '        Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "SAVE_NOW" -Encoding UTF8',
            '        $statusMsg = "✅ Đã gửi lệnh LƯU NGAY ổ đĩa ZENOVA-OS vào [$($env:RELEASE_TAG)]!"',
            '      } elseif (("$path" -eq "/action/restart") -or ("$path" -eq "/restart")) {',
            '        Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "RESTART_SESSION" -Encoding UTF8',
            '        $statusMsg = "🔁 Đã gửi lệnh LƯU Ổ ĐĨA & KHỞI ĐỘNG PHIÊN MỚI cho máy [$($env:MACHINE_ID)]!"',
            '      } elseif (("$path" -eq "/action/stop") -or ("$path" -eq "/stop")) {',
            '        Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "STOP_SESSION" -Encoding UTF8',
            '        $statusMsg = "🛑 Đã gửi lệnh LƯU Ổ ĐĨA & TẮT HẲN SERVER [$($env:MACHINE_ID)]!"',
            '      }',
            '    }',
            '    $bannerHtml = if ("$statusMsg") { "<div class=''alert''>$statusMsg</div>" } else { "" }',
            '    $htmlLines = @(',
            '      "<!DOCTYPE html><html lang=''vi''><head><meta charset=''utf-8''><meta name=''viewport'' content=''width=device-width, initial-scale=1''><title>ZENOVA-OS Control Panel ($($env:MACHINE_ID))</title>",',
            '      "<style>",',
            '      "* { box-sizing: border-box; font-family: Segoe UI, sans-serif; }",',
            '      "body { background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; display: flex; justify-content: center; }",',
            '      ".card { max-width: 600px; width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }",',
            '      "h1 { margin: 0 0 8px 0; font-size: 22px; color: #38bdf8; }",',
            '      ".sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }",',
            '      ".info { background: #0f172a; border-radius: 12px; padding: 16px; margin-bottom: 20px; }",',
            '      ".row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }",',
            '      ".val { font-weight: 600; color: #4ade80; } .val a { color: #facc15; }",',
            '      ".alert { background: #065f46; color: #ecfdf5; padding: 14px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; }",',
            '      "form { margin-bottom: 12px; }",',
            '      "button { width: 100%; padding: 14px 18px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; color: white; }",',
            '      ".btn-save { background: #0284c7; } .btn-restart { background: #d97706; } .btn-stop { background: #dc2626; }",',
            '      ".note { font-size: 12px; color: #94a3b8; margin-top: 14px; }",',
            '      "</style></head><body><div class=''card''>",',
            '      "<h1>🌌 Bảng Điều Khiển ZENOVA-OS [$($env:MACHINE_ID)]</h1>",',
            '      "<div class=''sub''>Quản lý Lưu ổ đĩa ZENOVA-OS ($($env:MOUNT_LETTER):\ ), Sunshine Stream, Tắt máy & Chuyển phiên</div>",',
            '      "$bannerHtml",',
            '      "<div class=''info''>",',
            '      "<div class=''row''><span>🏷️ Định danh máy:</span><span class=''val''>$($env:MACHINE_ID) ($($env:RELEASE_TAG))</span></div>",',
            '      "<div class=''row''><span>🌐 IP Tailscale RDP:</span><span class=''val''>$($env:TAILSCALE_IP):3389</span></div>",',
            '      "<div class=''row''><span>☀️ Sunshine Web UI:</span><span class=''val''><a href=''https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/'' target=''_blank''>https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/</a></span></div>",',
            '      "<div class=''row''><span>👤 Tài khoản & Mật khẩu:</span><span class=''val''>$($env:RDP_USER) / $($env:RDP_PASS)</span></div>",',
            '      "<div class=''row''><span>💽 Ổ đĩa lưu trữ:</span><span class=''val''>ZENOVA-OS ($($env:MOUNT_LETTER):\)</span></div>",',
            '      "<div class=''row''><span>⚡ Vi xử lý CPU:</span><span class=''val''>$($env:CPU_MODEL_INFO)</span></div>",',
            '      "<div class=''row''><span>⏳ Thời gian tổng:</span><span class=''val''>${h}h ${m}m ${s}s (Chế độ $($env:DISPLAY_TIME))</span></div>",',
            '      "</div>",',
            '      "<form method=''POST'' action=''/action/save''><button type=''submit'' class=''btn-save''><span>💾 Lưu Dữ Liệu Ngay (Không tắt máy)</span><span>→</span></button></form>",',
            '      "<form method=''POST'' action=''/action/restart''><button type=''submit'' class=''btn-restart''><span>🔁 Lưu Ổ Đĩa & Khởi Động Phiên Mới Ngay</span><span>→</span></button></form>",',
            '      "<form method=''POST'' action=''/action/stop''><button type=''submit'' class=''btn-stop''><span>🛑 Lưu Ổ Đĩa & Tắt Hẳn Server</span><span>→</span></button></form>",',
            '      "<div class=''note''>💡 Luôn tắt hoặc khởi động lại bằng nút trên trang web này để lưu 100% ổ đĩa ZENOVA-OS lên Release [$($env:RELEASE_TAG)].</div></div></body></html>"',
            '    )',
            '    $html = $htmlLines -join "`r`n"',
            '    $buf = [System.Text.Encoding]::UTF8.GetBytes("$html")',
            '    $resp.ContentType = "text/html; charset=utf-8"',
            '    $resp.ContentLength64 = $buf.Length',
            '    $resp.OutputStream.Write($buf, 0, $buf.Length)',
            '    $resp.OutputStream.Close()',
            '  } catch {}',
            '}'
          )
          $webScriptPath = 'C:\ALB-Apps\web-panel.ps1'
          Set-Content -Path $webScriptPath -Value ($webLines -join "`r`n") -Encoding UTF8 -Force
          $null = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "pwsh.exe -NoProfile -WindowStyle Hidden -File `"$webScriptPath`""
            CurrentDirectory = 'C:\ALB-Apps'
          } -EA SilentlyContinue
          Start-Sleep -Seconds 2

          $osObj = Get-CimInstance Win32_OperatingSystem -EA SilentlyContinue
          $osName = if ($osObj) { "$($osObj.Caption) (Build $($osObj.BuildNumber))" } else { "$env:WINDOWS_IMAGE" }
          $ramTotal = if ($osObj) { [math]::Round($osObj.TotalVisibleMemorySize / 1MB, 1) } else { 16 }
          $ramFree = if ($osObj) { [math]::Round($osObj.FreePhysicalMemory / 1MB, 1) } else { 12 }

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║    🌌 ALB-VPSFREE-ULTIMATE v70.1 PRO EXTREME — SẴN SÀNG KẾT NỐI!         ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  • Định danh máy     : $($env:MACHINE_ID) (Kho lưu: $($env:RELEASE_TAG))" -ForegroundColor White
          Write-Host "║  • Địa chỉ RDP Host  : ${rdpHost}:3389" -ForegroundColor Green
          Write-Host "║  • IP Tailscale VPN  : $tsIp [$($env:TS_STATUS)]" -ForegroundColor Green
          Write-Host "║  • Tài khoản gốc     : $($env:RDP_USER) (Dùng chung cho cả RDP & Sunshine)" -ForegroundColor Green
          Write-Host "║  • Mật khẩu cố định  : $rdpPass" -ForegroundColor Green
          Write-Host "║  • Web Quản Lý VPS   : http://${tsIp}:$($env:WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "║  • Sunshine Web UI   : https://${tsIp}:$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "║  • Hệ điều hành      : $osName" -ForegroundColor White
          Write-Host "║  • Vi xử lý (CPU)    : $($env:CPU_MODEL_INFO)" -ForegroundColor Green
          Write-Host "║  • Bộ nhớ RAM        : Trống $ramFree GB / Tổng $ramTotal GB" -ForegroundColor Green
          Write-Host "║  • Ổ đĩa riêng       : ZENOVA-OS ($($env:MOUNT_LETTER):\ - $($env:VHD_SIZE_GB_VALIDATED) GB)" -ForegroundColor Green
          Write-Host "║  • Thời gian máy     : $($env:DISPLAY_TIME) (Mặc định 6h - Hỗ trợ tối đa 24h)" -ForegroundColor Yellow
          Write-Host "║  • Hình nền mặc định : $($env:WALLPAPER_STATUS)" -ForegroundColor Magenta
          Write-Host "╚══════════════════════════════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

          $summary = @(
            "## 🌌 ALB-VPSFREE-ULTIMATE v70.1 PRO EXTREME — Thông Tin Kết Nối ZENOVA-OS",
            "",
            "| Hạng mục | Giá trị chi tiết |",
            "|:---|:---|",
            "| 🏷️ **Định danh máy** | ``$($env:MACHINE_ID)`` (Release: ``$($env:RELEASE_TAG)``) |",
            "| 🌐 **Địa chỉ RDP Host** | ``${rdpHost}:3389`` |",
            "| 👤 **Tài khoản RDP & Sunshine** | ``$($env:RDP_USER)`` |",
            "| 🔐 **Mật khẩu cố định** | ``$rdpPass`` |",
            "| 🎛️ **Web Quản Lý VPS** | ``http://${tsIp}:$($env:WEB_PORT)/`` |",
            "| ☀️ **Sunshine Web UI** | ``https://${tsIp}:$($env:SUNSHINE_WEB_PORT)/`` |",
            "| 💽 **Ổ đĩa riêng** | **ZENOVA-OS (``$($env:MOUNT_LETTER):\`` - $($env:VHD_SIZE_GB_VALIDATED) GB)** |",
            "| ⏱️ **Thời gian sử dụng** | **$($env:DISPLAY_TIME)** (Tối đa 24h) |",
            "| ⚡ **Vi xử lý (CPU)** | $($env:CPU_MODEL_INFO) |",
            "| 🧠 **Bộ nhớ RAM** | Trống **$ramFree GB** / Tổng **$ramTotal GB** |",
            "| 🖼️ **Hình nền mặc định** | $($env:WALLPAPER_STATUS) |"
          )
          $summary | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }
          $global:LASTEXITCODE = 0

      - name: ⏳ Duy trì phiên làm việc (Watchdog 6h-24h & Giữ Sunshine/Web Panel/Wallpaper)
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          function Test-Port {
            param([int]$P)
            try {
              $t = [System.Net.Sockets.TcpClient]::new()
              $ok = $t.ConnectAsync('127.0.0.1', $P).Wait(1000)
              $t.Close()
              return $ok
            } catch { return $false }
          }

          $start = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $end = $start + ([long]$env:TOTAL_MINUTES * 60)
          $sig = $env:CONTROL_SIGNAL_FILE
          $u = $env:RDP_USER
          $lastLog = (Get-Date).AddHours(-1)
          $tick = 0
          $wallEnforcedInSession = $false

          while ($true) {
            if (Test-Path $sig) {
              $c = (Get-Content -Raw $sig -EA SilentlyContinue).Trim()
              Remove-Item $sig -Force -EA SilentlyContinue
              if ($c -eq 'SAVE_NOW') {
                & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'manual-web-save'
                $global:LASTEXITCODE = 0
              } elseif ($c -eq 'RESTART_SESSION') {
                'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV
                break
              } elseif ($c -eq 'STOP_SESSION') {
                'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV
                break
              }
            }

            $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $remain = $end - $now
            if ($remain -le 0) { break }

            $tick++

            if ($tick % 2 -eq 0) {
              try {
                @(quser 2>$null) | ForEach-Object {
                  $lineStr = "$_"
                  if ($lineStr -match "^\s*>?$([regex]::Escape($u))\s+") {
                    if ($lineStr -match "\s+Active\s+") {
                      if (-not $wallEnforcedInSession) {
                        & schtasks.exe /Run /TN "ALB-Enforce-Wallpaper" *> $null
                        $wallEnforcedInSession = $true
                      }
                    } else {
                      $wallEnforcedInSession = $false
                      if ($lineStr -notmatch "\s+console\s+") {
                        $parts = (($lineStr -replace '^>', ' ').Trim()) -split '\s+'
                        $sidNum = $parts[1..($parts.Count - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1
                        if ($sidNum -and ($lineStr -match "\s+Disc\s+")) {
                          & tscon $sidNum /dest:console *> $null
                        }
                      }
                    }
                  }
                }
              } catch {}
            }

            if ($tick % 3 -eq 0) {
              if (-not (Test-Port 47990)) {
                $null = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
                  CommandLine = '"C:\Program Files\Sunshine\sunshine.exe"'
                  CurrentDirectory = 'C:\Program Files\Sunshine'
                } -EA SilentlyContinue
              }
              if (-not (Test-Port 8080)) {
                $null = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
                  CommandLine = 'pwsh.exe -NoProfile -WindowStyle Hidden -File "C:\ALB-Apps\web-panel.ps1"'
                  CurrentDirectory = 'C:\ALB-Apps'
                } -EA SilentlyContinue
              }
              if (-not (Test-Port 3389)) {
                Start-Service TermService -EA SilentlyContinue
              }
            }

            if (((Get-Date) - $lastLog).TotalMinutes -ge 5) {
              $h = [math]::Floor($remain / 3600)
              $m = [math]::Floor(($remain % 3600) / 60)
              $sunSt = if (Test-Port 47990) { 'ONLINE' } else { 'RECOVERING' }
              $webSt = if (Test-Port 8080) { 'ONLINE' } else { 'RECOVERING' }
              Write-Host "[$(Get-Date -f 'HH:mm:ss')] 📊 [$($env:MACHINE_ID)] IP: $($env:TAILSCALE_IP) | Chế độ: $($env:DISPLAY_TIME) (Còn ${h}h${m}m) | Sunshine=$sunSt | WebPanel=$webSt" -ForegroundColor Cyan
              $lastLog = Get-Date
            }

            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Lưu toàn bộ ổ đĩa ZENOVA-OS cuối phiên
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          try {
            Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue
            Stop-Process -Name sunshine -Force -EA SilentlyContinue
            & taskkill.exe /F /IM 'StarDesk*' /T *> $null
            if (Test-Path "$env:RUNNER_TEMP\save-data.ps1") {
              & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'session-end'
            }
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🧹 Dọn dẹp hệ thống
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            if (Test-Path $ts) {
              & $ts logout 2>&1 | Out-Null
              & $ts down 2>&1 | Out-Null
            }
            @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Sunshine-Exe-Allow','Tailscale-ICMP') | ForEach-Object {
              Remove-NetFirewallRule -DisplayName $_ -EA SilentlyContinue
            }
            $vhd = "$env:VHD_CONTAINER\zenova-os-disk.vhdx"
            if (Test-Path $vhd) { Dismount-VHD -Path $vhd -EA SilentlyContinue }
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🔁 Kích hoạt phiên tiếp theo (Chained Auto-Restart 6h - 24h)
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || env.FORCE_NEXT_SESSION == '1' || inputs.duration == '6h' || inputs.duration == '12h' || inputs.duration == '18h' || inputs.duration == '24h') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          CHOCO_PKGS: ${{ inputs.choco_packages }}
          OPT_WIN: ${{ inputs.optimize_windows }}
          EN_TS: ${{ inputs.enable_tailscale }}
          EN_DNS: ${{ inputs.enable_duckdns }}
        run: |
          $wfRef = $env:GITHUB_WORKFLOW_REF
          $wfFile = if ($wfRef) { ($wfRef -split '@')[0] -split '/' | Select-Object -Last 1 } else { "$env:GITHUB_WORKFLOW.yml" -replace ' ', '-' }

          $nextDuration = $env:DURATION
          if ($env:FORCE_NEXT_SESSION -ne '1') {
            if ($env:DURATION -eq '24h') { $nextDuration = '18h' }
            elseif ($env:DURATION -eq '18h') { $nextDuration = '12h' }
            elseif ($env:DURATION -eq '12h') { $nextDuration = '6h' }
          }

          $a = @(
            'workflow', 'run', $wfFile,
            '--ref', $env:GITHUB_REF_NAME,
            '-f', "machine_id=$env:MACHINE_ID",
            '-f', "duration=$nextDuration",
            '-f', 'auto_restart=true',
            '-f', "drive_letter=$env:MOUNT_LETTER",
            '-f', "vhd_size_gb=$env:VHD_SIZE_GB_VALIDATED",
            '-f', "windows_image=$env:WIN_IMAGE",
            '-f', "fixed_password=$env:FIXED_PASS",
            '-f', "vdd_resolution=$env:VDD_RES",
            '-f', "choco_packages=$env:CHOCO_PKGS",
            '-f', "optimize_windows=$(("$env:OPT_WIN").ToLower())",
            '-f', "enable_tailscale=$(("$env:EN_TS").ToLower())",
            '-f', "enable_duckdns=$(("$env:EN_DNS").ToLower())"
          )
          & gh @a
          if ($LASTEXITCODE -ne 0) { throw 'Auto-restart fail' }
          Write-Host "✅ Đã kích hoạt phiên nối tiếp ($nextDuration) cho máy [$env:MACHINE_ID]" -ForegroundColor Green
