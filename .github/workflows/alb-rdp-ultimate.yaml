name: 'ZENOVA ULTIMATE VPS (Windows + Linux)'

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: '🖥️ Hệ điều hành (Windows, Linux, hoặc Cả hai)'
        required: false
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'both'
      machine_id:
        description: '🆔 Tên định danh máy (VD: zenova-1)'
        required: true
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      windows_image:
        description: '🪟 Phiên bản Windows (2022 hoặc 2025)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      duration:
        description: '⏱️ Thời gian sử dụng (tối đa 24h - tự động nối phiên liên tục)'
        required: false
        default: '24h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔄 Tự khởi động lại nối tiếp khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💾 Ký tự ổ đĩa ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '💾 Dung lượng ổ đĩa ảo (hỗ trợ tối đa 60TB)'
        required: false
        default: '60TB'
        type: choice
        options:
          - '100GB'
          - '250GB'
          - '500GB'
          - '1TB'
          - '2TB'
          - '5TB'
          - '10TB'
          - '20TB'
          - '40TB'
          - '60TB'
      fixed_password:
        description: '🔑 Mật khẩu RDP / Sunshine / Windows'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: '📌 Mã PIN StarDesk Trung'
        required: false
        default: 'Zenova2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo'
        required: false
        default: '1920x1080@120'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'
      choco_packages:
        description: '📦 App cài thêm bằng choco (tùy chọn)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚡ Tối ưu Windows (Fix lag)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: zenova-ultimate-${{ github.event.inputs.machine_id || 'zenova-1' }}-${{ github.event.inputs.os_type || 'windows' }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. WINDOWS RUNNER (120FPS, TAILSCALE, SUNSHINE, STARDESK, 60TB VHD, APPS)
  # =========================================================================
  Zenova-Windows:
    name: '🪟 Windows RDP (${{ github.event.inputs.windows_image || ''windows-2022'' }} - 120fps)'
    runs-on: ${{ github.event.inputs.windows_image || 'windows-2022' }}
    if: ${{ github.event.inputs.os_type != 'linux' }}
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_KEY || secrets.TAILSCALE_AUTH_KEY || secrets.TS_AUTHKEY || secrets.TAILSCALE || secrets.TS_KEY || secrets.TAILSCALE_TOKEN }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-1' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || 'Zenova Ultimate Machine' }}
      DRIVE_LETTER: ${{ github.event.inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ github.event.inputs.vhd_size_gb || '60TB' }}
      FIXED_PASSWORD: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}
      INPUT_PIN_CODE: ${{ github.event.inputs.pin_code || 'Zenova2026' }}
      DURATION_INPUT: ${{ github.event.inputs.duration || '24h' }}
      AUTO_RESTART: ${{ github.event.inputs.auto_restart }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      ENABLE_DUCKDNS: ${{ github.event.inputs.enable_duckdns }}

    steps:
      # =====================================================================
      # 1. DỰNG Ổ ĐĨA RIÊNG (HỖ TRỢ ĐẾN 60TB VHDX) & CHUẨN BỊ THÔNG SỐ
      # =====================================================================
      - name: 💾 Dựng ổ đĩa riêng (Hỗ trợ đến 60TB) & Chuẩn bị thông số
        shell: pwsh
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          Add-Content -Path $env:GITHUB_ENV -Value "JOB_START_EPOCH=$nowEpoch";

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1' }
          $relTag = "zenova-storage-$cleanId";
          Add-Content -Path $env:GITHUB_ENV -Value "MACHINE_ID=$cleanId";
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$relTag";

          $durStr = "$env:DURATION_INPUT".ToLower().Trim();
          $total = 1440;
          if ($durStr -match '^(\d+)h') { $total = [int]$matches[1] * 60; }
          elseif ($durStr -match '^(\d+)m') { $total = [int]$matches[1]; }
          Add-Content -Path $env:GITHUB_ENV -Value "TOTAL_MINUTES=$total";

          $user = 'zenova';
          $profPath = 'C:\Users\zenova';
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_USER=$user";
          Add-Content -Path $env:GITHUB_ENV -Value "PROFILE_PATH=$profPath";

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          Add-Content -Path $env:GITHUB_ENV -Value "MOUNT_LETTER=$dl";

          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          # Tính dung lượng VHD hỗ trợ tối đa 60TB (60,000 GB)
          $rawSize = "$env:VHD_SIZE_GB".Trim().ToUpper();
          $sizeBytes = 100GB;
          if ($rawSize -match '^(\d+)\s*TB$') {
              $tb = [int64]$matches[1];
              if ($tb -gt 60) { $tb = 60; }
              if ($tb -lt 1) { $tb = 1; }
              $sizeBytes = $tb * 1TB;
          } elseif ($rawSize -match '^(\d+)\s*GB$') {
              $gb = [int64]$matches[1];
              if ($gb -gt 61440) { $gb = 61440; }
              if ($gb -lt 10) { $gb = 10; }
              $sizeBytes = $gb * 1GB;
          } elseif ($rawSize -match '^(\d+)$') {
              $val = [int64]$matches[1];
              if ($val -le 60) { $sizeBytes = $val * 1TB; }
              else {
                  if ($val -gt 61440) { $val = 61440; }
                  $sizeBytes = $val * 1GB;
              }
          }

          Write-Host "💾 Khởi tạo ổ đĩa ảo $dl`: với dung lượng tối đa: $($sizeBytes / 1GB) GB (Dynamic VHDX)..." -ForegroundColor Cyan;
          $mounted = $false;
          try {
              if (-not (Test-Path "$vhdFile")) {
                  New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
              } else { Mount-VHD -Path "$vhdFile"; }
              $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
              if (Test-Path "${dl}:\") { $mounted = $true; }
          } catch {}

          if (-not ($mounted)) {
              Write-Host "⚠️ Chuyển sang chế độ thư mục ảo subst $dl`:..." -ForegroundColor Yellow;
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null;
              & subst "${dl}:" "$fallbackDir";
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY";
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json";
          $profileStoreRoot = "$sharedRoot\Users";
          $baselineFile     = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json');
          $controlSignal    = 'C:\ZENOVA-VHD-HOST\control-signal.txt';

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps", 'C:\Apps') | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null;
          };

          Add-Content -Path $env:GITHUB_ENV -Value "VHD_CONTAINER=$vhdContainer";
          Add-Content -Path $env:GITHUB_ENV -Value "VHD_FILE=$vhdFile";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_ROOT=$sharedRoot";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_SESSION_DIR=$sharedSessionDir";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_DATA_DIR=$sharedDataDir";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_OS_DIR=$sharedOsDir";
          Add-Content -Path $env:GITHUB_ENV -Value "SHARED_STATE_FILE=$sharedStateFile";
          Add-Content -Path $env:GITHUB_ENV -Value "PROFILE_ROOT=$profileStoreRoot";
          Add-Content -Path $env:GITHUB_ENV -Value "CONTROL_SIGNAL_FILE=$controlSignal";

          # Tạo release storage nếu chưa tồn tại
          $null = gh release view "$relTag" --repo "$env:GH_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt');
              Set-Content -Path "$dummy" -Value "Zenova Storage Init" -Encoding UTF8;
              gh release create "$relTag" "$dummy" --repo "$env:GH_REPO" --title "Zenova Storage ($cleanId)" --notes "Auto persistent storage";
          }
          $global:LASTEXITCODE = 0;

      # =====================================================================
      # 2. TẠO SCRIPT LƯU TRỮ VÀ ĐÓNG GÓI Ổ ĐĨA
      # =====================================================================
      - name: 📦 Tạo script lưu trữ ổ đĩa & đóng gói
        shell: pwsh
        run: |
          $scriptLines = @(
              'param([string]$Reason = "session-end")',
              '$ErrorActionPreference = "Continue";',
              '$root  = "$env:SHARED_ROOT";',
              '$osDir = "$env:SHARED_OS_DIR";',
              '$appsToClose = @("chrome", "msedge", "discord", "Spotify", "StarDesk", "Bandicam", "EVKey");',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow(); };',
              'Start-Sleep -Seconds 2;',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              '$regBk = [System.IO.Path]::Combine("$osDir", "Registry");',
              'New-Item -ItemType Directory -Force -Path "$regBk" | Out-Null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null;',
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null;',
              'reg export "HKCU\Control Panel\Desktop" "$regBk\User-Desktop.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" "$regBk\User-Themes.reg" /y *> $null;',
              'if (("$env:RDP_USER") -and ("$env:PROFILE_PATH") -and (Test-Path "$env:PROFILE_PATH")) {',
              '    $profDst = [System.IO.Path]::Combine("$root", "Users", "$env:RDP_USER");',
              '    New-Item -ItemType Directory -Force -Path "$profDst" | Out-Null;',
              '    robocopy "$env:PROFILE_PATH" "$profDst" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD "$env:PROFILE_PATH\AppData\Roaming\Microsoft\Protect" "$env:PROFILE_PATH\AppData\Local\Temp" *> $null;',
              '    $global:LASTEXITCODE = 0;',
              '}',
              'if (Test-Path "C:\Apps") {',
              '    $appsDst = "$root\Apps";',
              '    New-Item -ItemType Directory -Force -Path "$appsDst" | Out-Null;',
              '    robocopy "C:\Apps" "$appsDst" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '}',
              '$packDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "gh-pack");',
              'if (Test-Path "$packDir") { Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$packDir" | Out-Null;',
              '$archiveBase = [System.IO.Path]::Combine("$packDir", "zenova-drive.7z");',
              'Push-Location "$root";',
              '& 7z a -t7z -mx=1 -mmt=on -ssw -v1900m "$archiveBase" "*" "-xr!Pagefile.sys" "-xr!swapfile.sys" *> $null;',
              'Pop-Location;',
              '$chunks = @(Get-ChildItem -Path "$packDir" -Filter "zenova-drive.7z.*" | Sort-Object Name);',
              'if (($chunks.Count) -gt 0) {',
              '    $manifest = [ordered]@{ machineId = "$env:MACHINE_ID"; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); chunkCount = $chunks.Count; };',
              '    $manifestPath = [System.IO.Path]::Combine("$packDir", "drive-manifest.json");',
              '    $manifest | ConvertTo-Json | Set-Content -Path "$manifestPath" -Encoding UTF8;',
              '    $uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @("$manifestPath");',
              '    gh release upload "$env:RELEASE_TAG" @uploadFiles --repo "$env:GH_REPO" --clobber;',
              '}',
              'Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue;',
              'Write-Host "✅ Đã lưu toàn bộ dữ liệu máy lên GitHub Release!" -ForegroundColor Green;',
              'exit 0;'
          );
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1');
          Set-Content -Path "$saveScriptPath" -Value ($scriptLines -join "`r`n") -Encoding UTF8;
          Add-Content -Path $env:GITHUB_ENV -Value "SAVE_SCRIPT_PATH=$saveScriptPath";

      # =====================================================================
      # 3. KHÔI PHỤC TOÀN BỘ Ổ ĐĨA TỪ GITHUB RELEASE
      # =====================================================================
      - name: 🔄 Khôi phục toàn bộ ổ đĩa từ phiên trước
        shell: pwsh
        run: |
          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$dlDir" | Out-Null;

          Write-Host "🔍 Kiểm tra bản lưu phiên trước từ tag $env:RELEASE_TAG..." -ForegroundColor Cyan;
          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
          $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');

          if (-not (Test-Path "$manifestFile")) {
              Write-Host "ℹ️ Chưa có bản sao lưu nào cho máy này (Khởi tạo phiên mới)." -ForegroundColor Gray;
              Add-Content -Path $env:GITHUB_ENV -Value "DATA_RESTORED=1";
              exit 0;
          }

          Write-Host "📦 Đang tải các phân đoạn lưu trữ từ GitHub Release..." -ForegroundColor Green;
          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'zenova-drive.7z.*' --dir "$dlDir";
          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'zenova-drive.7z.001');
          if (Test-Path "$firstChunk") {
              $stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", 'restore-stage');
              New-Item -ItemType Directory -Force -Path "$stage" | Out-Null;
              & 7z x "$firstChunk" "-o$stage" -y -mmt=on *> $null;
              Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue;

              # Khôi phục dữ liệu vào X:\ZENOVA-SYSTEM
              robocopy "$stage" "$env:SHARED_ROOT" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;

              # Khôi phục vào C:\Apps
              if (Test-Path "$stage\Apps") {
                  robocopy "$stage\Apps" 'C:\Apps' /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
              }

              # Khôi phục hồ sơ người dùng
              $oldProf = [System.IO.Path]::Combine("$env:SHARED_ROOT", 'Users', "$env:RDP_USER");
              if (Test-Path "$oldProf") {
                  New-Item -ItemType Directory -Force -Path "$env:PROFILE_PATH" | Out-Null;
                  robocopy "$oldProf" "$env:PROFILE_PATH" /E /XJ /COPY:DAT /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* *> $null;
              }
              Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;

              # Phục hồi Registry nếu có
              $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry');
              if (Test-Path "$regBk") {
                  Get-ChildItem -Path "$regBk" -Filter '*.reg' -Recurse | ForEach-Object { reg import ($_.FullName) *>$null; };
              }
              Write-Host "✅ Đã phục hồi toàn bộ dữ liệu máy từ phiên trước thành công!" -ForegroundColor Green;
          }
          Add-Content -Path $env:GITHUB_ENV -Value "DATA_RESTORED=1";

      # =====================================================================
      # 4. TẠO USER ZENOVA, BẬT RDP & TỐI ƯU HỆ THỐNG FIX LAG
      # =====================================================================
      - name: 🚀 Tạo User Zenova, Bật RDP & Tối Ưu Hệ Thống Fix Lag
        shell: pwsh
        run: |
          $secCfg = "$env:TEMP\secpol.cfg";
          $secDb = "$env:TEMP\secpol.sdb";
          secedit /export /cfg $secCfg *>$null;
          (Get-Content $secCfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content $secCfg;
          secedit /configure /db $secDb /cfg $secCfg /areas SECURITYPOLICY *>$null;
          Remove-Item $secCfg, $secDb -Force -ErrorAction SilentlyContinue;

          $user = 'zenova';
          $pass = "$env:FIXED_PASSWORD";
          if (-not $pass) { $pass = 'Zenova@2026'; }

          net user $user "$pass" /add /comment:"Zenova User" /fullname:"Zenova" *> $null;
          net localgroup Administrators $user /add *> $null;
          net localgroup "Remote Desktop Users" $user /add *> $null;
          net user runneradmin "$pass" *> $null;

          # Tối ưu dịch vụ chống lag
          foreach ($s in @('WSearch', 'SysMain', 'wuauserv')) {
              Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue;
              Stop-Service -Name $s -Force -ErrorAction SilentlyContinue;
          }

          # Tối ưu mạng TCP CTCP & tắt Nagle
          try {
              Set-NetTCPSetting -SettingName InternetCustom -CongestionProvider CTCP -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces' -Name 'TcpAckFrequency' -Value 1 -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces' -Name 'TCPNoDelay' -Value 1 -Force -ErrorAction SilentlyContinue;
          } catch {}

          # Bật Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force;
          Start-Service -Name TermService -ErrorAction SilentlyContinue;
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes *> $null;

      # =====================================================================
      # 5. CÀI ĐẶT TAILSCALE & LIÊN KẾT KEY TỪ REPO SECRET
      # =====================================================================
      - name: 🌐 Cài Đặt Tailscale & Lấy IP Riêng P2P
        shell: pwsh
        run: |
          $tsMsi = "$env:TEMP\tailscale.msi";
          & curl.exe -L -s --retry 3 "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -o "$tsMsi";
          if (Test-Path "$tsMsi") {
              Start-Process msiexec.exe -ArgumentList "/i `"$tsMsi`" /qn /norestart" -Wait;
              Start-Sleep -Seconds 3;
              Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue;
          }

          $tsKey = "$env:TAILSCALE_AUTHKEY";
          $tsIp = "";
          $tsCli = "C:\Program Files\Tailscale\tailscale.exe";

          if (Test-Path "$tsCli") {
              if ($tsKey -and $tsKey.Trim() -ne '') {
                  Write-Host "🔑 Tìm thấy Tailscale Auth Key trong Repo Secrets! Đang liên kết..." -ForegroundColor Green;
                  & "$tsCli" up --authkey="$tsKey" --hostname="zenova-$env:MACHINE_ID" --accept-routes --advertise-exit-node=false --reset *> $null;
                  for ($i = 0; $i -lt 15; $i++) {
                      Start-Sleep -Seconds 2;
                      $checkIp = (& "$tsCli" ip -4 2>$null).Trim();
                      if ($checkIp -match '^100\.') {
                          $tsIp = $checkIp;
                          break;
                      }
                  }
              }
          }

          if ($tsIp) {
              Set-Content -Path "C:\zenova-ts-ip.txt" -Value $tsIp -Encoding UTF8 -Force;
              Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIp";
              Write-Host "🎉 ĐÃ KẾT NỐI TAILSCALE! IP: $tsIp" -ForegroundColor Green;
          } else {
              Set-Content -Path "C:\zenova-ts-ip.txt" -Value "Chưa nhận được IP (Kiểm tra Secret TAILSCALE_AUTHKEY)" -Encoding UTF8 -Force;
          }

      # =====================================================================
      # 6. CÀI ĐẶT DRIVER ẢO (120FPS), CARD ÂM THANH ẢO VB-CABLE & SUNSHINE
      # =====================================================================
      - name: ☀️ Cài Đặt Driver Ảo 120fps, Âm Thanh VB-Cable & Sunshine
        shell: pwsh
        run: |
          # Cài đặt màn hình ảo 120fps
          try {
              & curl.exe -L -s --retry 2 "https://www.amyuni.com/downloads/usbmmidd_v2.zip" -o "C:\usbmmidd.zip";
              if (Test-Path "C:\usbmmidd.zip") {
                  Expand-Archive -Path "C:\usbmmidd.zip" -DestinationPath "C:\usbmmidd" -Force;
                  & "C:\usbmmidd\deviceinstaller64.exe" install "C:\usbmmidd\usbmmidd.inf" usbmmidd *> $null;
                  & "C:\usbmmidd\deviceinstaller64.exe" enableidd 1 *> $null;
              }
          } catch {}

          # Cài đặt Driver âm thanh ảo VB-Audio Cable
          try {
              & curl.exe -L -s --retry 2 "https://download.vb-audio.com/Download_EXTERNAL/VBCABLE_Driver_Pack43.zip" -o "C:\vbcable.zip";
              if (Test-Path "C:\vbcable.zip") {
                  Expand-Archive -Path "C:\vbcable.zip" -DestinationPath "C:\vbcable" -Force;
                  Start-Process -FilePath "C:\vbcable\VBCABLE_Setup_x64.exe" -ArgumentList "-i -h" -Wait -WindowStyle Hidden;
                  Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue;
              }
          } catch {}

          # Cài đặt Sunshine Game Streaming
          $ssMsi = "C:\Sunshine-installer.msi";
          & curl.exe -L -s --retry 3 "https://github.com/LizardByte/Sunshine/releases/download/v2026.914.233613/Sunshine-Windows-AMD64-installer.msi" -o "$ssMsi";
          if (Test-Path "$ssMsi") {
              Start-Process msiexec.exe -ArgumentList "/i `"$ssMsi`" /qn /norestart" -Wait;
          }
          $ssExe = "C:\Program Files\Sunshine\sunshine.exe";
          if (Test-Path "$ssExe") {
              & "$ssExe" --creds zenova Zenova@2026 *> $null;
              Start-Process -FilePath "$ssExe" -WindowStyle Hidden -ErrorAction SilentlyContinue;
          }

          # Khởi động Cloudflare Tunnel cho Sunshine với --no-tls-verify (Tránh 502)
          $cfExe = 'C:\cloudflared.exe';
          if (-not (Test-Path "$cfExe")) {
              & curl.exe -L -s --retry 3 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "$cfExe";
          }
          if (Test-Path "$cfExe") {
              Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url https://127.0.0.1:47990 --no-tls-verify --logfile C:\cloudflared-sunshine.log" -WindowStyle Hidden;
              Start-Sleep -Seconds 5;
              for ($i = 0; $i -lt 10; $i++) {
                  if (Test-Path "C:\cloudflared-sunshine.log") {
                      $c = Get-Content "C:\cloudflared-sunshine.log" -Raw;
                      if ($c -match '(https://[a-zA-Z0-9-]+\.trycloudflare\.com)') {
                          Set-Content -Path "C:\zenova-sunshine-url.txt" -Value $matches[1] -Encoding UTF8 -Force;
                          Add-Content -Path $env:GITHUB_ENV -Value "SUNSHINE_URL=$($matches[1])";
                          break;
                      }
                  }
                  Start-Sleep -Seconds 2;
              }
          }

      # =====================================================================
      # 7. CÀI ĐẶT TRỌN BỘ APP (FIX DISCORD, ROBLOX, EVKEY, MINECRAFT, SPOTIFY, STARDESK)
      # =====================================================================
      - name: 🎮 Cài Đặt Toàn Bộ Ứng Dụng & Sắp Xếp Giao Diện Desktop Chuẩn Đẹp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\Apps', 'C:\Apps\Bloxstrap', 'C:\Apps\EVKey', 'C:\Apps\Minecraft' | Out-Null;

          # 1. FIX LỖI DISCORD FATAL JAVASCRIPT: Dừng updater và cài đặt độc lập
          Get-Process -Name "Discord", "Update" -ErrorAction SilentlyContinue | Stop-Process -Force;
          $discordSetup = "C:\Apps\DiscordSetup.exe";
          & curl.exe -L -s --retry 3 "https://discord.com/api/download?platform=win" -o "$discordSetup";
          if (Test-Path "$discordSetup") {
              Start-Process -FilePath "$discordSetup" -ArgumentList "/s" -Wait;
              Start-Sleep -Seconds 5;
              Get-Process -Name "Discord", "Update" -ErrorAction SilentlyContinue | Stop-Process -Force;
          }

          # 2. FIX LỖI ROBLOX / BLOXSTRAP: Cài .NET 8 Desktop Runtime & VC++ Redistributable
          $net8Exe = "C:\dotnet8.exe";
          & curl.exe -L -s --retry 3 "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe" -o "$net8Exe";
          if (Test-Path "$net8Exe") {
              Start-Process -FilePath "$net8Exe" -ArgumentList "/install /quiet /norestart" -Wait;
          }
          $vcExe = "C:\vcredist_x64.exe";
          & curl.exe -L -s --retry 3 "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o "$vcExe";
          if (Test-Path "$vcExe") {
              Start-Process -FilePath "$vcExe" -ArgumentList "/install /quiet /norestart" -Wait;
          }

          # Cài Bloxstrap v2.7.0 Fix Lag (120 FPS, Direct3D11)
          $bloxExe = "C:\Apps\Bloxstrap\Bloxstrap.exe";
          & curl.exe -L -s --retry 3 "https://github.com/bloxstraplabs/bloxstrap/releases/download/v2.7.0/Bloxstrap-v2.7.0.exe" -o "$bloxExe";
          $bloxCfgDir = "C:\Users\zenova\AppData\Local\Bloxstrap\Modifications\ClientSettings";
          New-Item -ItemType Directory -Force -Path $bloxCfgDir | Out-Null;
          $fastFlags = @{
              "DFIntTaskSchedulerTargetFps" = 120;
              "FFlagDisablePostFx" = "True";
              "FFlagHandleAltEnterFullscreenManually" = "False";
              "FIntFullscreenTitleBarTriggerDelayMillis" = 3600000;
              "FFlagDebugGraphicsPreferD3D11" = "True"
          } | ConvertTo-Json;
          Set-Content -Path "$bloxCfgDir\ClientAppSettings.json" -Value $fastFlags -Encoding UTF8 -Force;

          # 3. CÀI EVKEY BỘ GÕ TIẾNG VIỆT
          $evkZip = "C:\evkey.zip";
          & curl.exe -L -s --retry 3 "https://github.com/lamquangminh/EVKey/releases/download/v5.4.7/EVKey_v5.4.7.zip" -o "$evkZip";
          if (Test-Path "$evkZip") {
              Expand-Archive -Path "$evkZip" -DestinationPath "C:\Apps\EVKey" -Force;
              if (Test-Path "C:\Apps\EVKey\EVKey64.exe") {
                  Start-Process -FilePath "C:\Apps\EVKey\EVKey64.exe" -WindowStyle Hidden -ErrorAction SilentlyContinue;
              }
          }

          # 4. CÀI MINECRAFT HMCL FIX LAG
          $hmclExe = "C:\Apps\Minecraft\HMCL-FixLag.exe";
          & curl.exe -L -s --retry 3 "https://github.com/HMCL-dev/HMCL/releases/download/v3.5.8/HMCL-3.5.8.exe" -o "$hmclExe";

          # 5. CÀI SPOTIFY
          $spotExe = "C:\Apps\SpotifySetup.exe";
          & curl.exe -L -s --retry 3 "https://download.scdn.co/SpotifySetup.exe" -o "$spotExe";
          if (Test-Path "$spotExe") {
              Start-Process -FilePath "$spotExe" -ArgumentList "/silent" -Wait -ErrorAction SilentlyContinue;
          }

          # 6. CÀI STARDESK TRUNG 1.5.3
          $sdDir = "C:\Program Files (x86)\StarDesk";
          New-Item -ItemType Directory -Force -Path $sdDir | Out-Null;
          $sdExe = "$sdDir\StarDesk.exe";
          & curl.exe -L -s --retry 2 "https://raw.githubusercontent.com/Chilledit/file/main/StarDesk_1.5.3.exe" -o "$sdExe";
          $pin = "$env:INPUT_PIN_CODE";
          if (-not $pin) { $pin = "Zenova2026"; }
          "[General]`r`nPassword=$pin`r`nAutoStart=1`r`n" | Out-File -FilePath "$sdDir\config.ini" -Encoding ascii -Force;
          if (Test-Path "$sdExe") {
              Start-Process -FilePath "$sdExe" -ArgumentList "/silent" -WindowStyle Hidden -ErrorAction SilentlyContinue;
          }
          Start-Sleep -Seconds 5;
          $sdId = "";
          for ($i = 0; $i -lt 10; $i++) {
              if (Test-Path "$sdDir\config.ini") {
                  $c = Get-Content "$sdDir\config.ini" -Raw;
                  if ($c -match 'ID\s*=\s*(\d+)') { $sdId = $matches[1]; break; }
              }
              Start-Sleep -Seconds 2;
          }
          if (-not $sdId) { $sdId = "231141232"; }
          Set-Content -Path "C:\zenova-sd-id.txt" -Value $sdId -Encoding utf8 -Force;
          Add-Content -Path $env:GITHUB_ENV -Value "STARDESK_ID=$sdId";

          # 7. SẮP XẾP ICON DESKTOP CHUẨN ĐẸP
          $ws = New-Object -ComObject WScript.Shell;
          foreach ($u in @('zenova', 'runneradmin', 'Public')) {
              $d = "C:\Users\$u\Desktop";
              if (Test-Path $d) {
                  $lnkApps = $ws.CreateShortcut("$d\Kho Ung Dung (C-Apps).lnk");
                  $lnkApps.TargetPath = "C:\Apps";
                  $lnkApps.Save();

                  if (Test-Path "$sdExe") {
                      $lnkSD = $ws.CreateShortcut("$d\StarDesk Trung.lnk");
                      $lnkSD.TargetPath = "$sdExe";
                      $lnkSD.Save();
                  }
                  if (Test-Path "$bloxExe") {
                      $lnkRb = $ws.CreateShortcut("$d\Roblox (Bloxstrap Fix Lag).lnk");
                      $lnkRb.TargetPath = "$bloxExe";
                      $lnkRb.Save();
                  }
                  if (Test-Path "C:\Apps\EVKey\EVKey64.exe") {
                      $lnkEvk = $ws.CreateShortcut("$d\EVKey Tieng Viet.lnk");
                      $lnkEvk.TargetPath = "C:\Apps\EVKey\EVKey64.exe";
                      $lnkEvk.Save();
                  }
                  if (Test-Path "$hmclExe") {
                      $lnkMc = $ws.CreateShortcut("$d\Minecraft (Fix Lag).lnk");
                      $lnkMc.TargetPath = "$hmclExe";
                      $lnkMc.Save();
                  }
              }
          }

      # =====================================================================
      # 8. KHỞI CHẠY WEB QUẢN LÝ VPS (PORT 8080) - CHỐNG 502 TUYỆT ĐỐI
      # =====================================================================
      - name: 🌐 Khởi Chạy Web Quản Lý VPS (Port 8080 - Chống 502)
        shell: pwsh
        run: |
          $webDir = 'C:\zenova-web';
          New-Item -ItemType Directory -Force -Path $webDir | Out-Null;
          $pyServerPath = "$webDir\server.py";
          $pyB64 = '';
          [System.IO.File]::WriteAllBytes($pyServerPath, [System.Convert]::FromBase64String($pyB64));

          $pyExe = (Get-Command python -ErrorAction SilentlyContinue).Source;
          if (-not $pyExe) { $pyExe = 'python'; }
          Start-Process -FilePath $pyExe -ArgumentList "`"$pyServerPath`"", "8080" -WindowStyle Hidden -ErrorAction SilentlyContinue;

          # Đợi server 8080 phản hồi 200 OK trước khi mở Cloudflare Tunnel
          for ($i = 0; $i -lt 15; $i++) {
              try {
                  $res = Invoke-WebRequest -Uri "http://127.0.0.1:8080" -UseBasicParsing -TimeoutSec 2;
                  if ($res.StatusCode -eq 200) { break; }
              } catch {}
              Start-Sleep -Seconds 1;
          }

          $cfExe = 'C:\cloudflared.exe';
          if (Test-Path "$cfExe") {
              Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url http://127.0.0.1:8080 --logfile C:\cloudflared-web.log" -WindowStyle Hidden;
              for ($i = 0; $i -lt 12; $i++) {
                  if (Test-Path "C:\cloudflared-web.log") {
                      $c = Get-Content "C:\cloudflared-web.log" -Raw;
                      if ($c -match '(https://[a-zA-Z0-9-]+\.trycloudflare\.com)') {
                          Set-Content -Path "C:\zenova-web-url.txt" -Value $matches[1] -Encoding UTF8 -Force;
                          Add-Content -Path $env:GITHUB_ENV -Value "WEB_URL=$($matches[1])";
                          break;
                      }
                  }
                  Start-Sleep -Seconds 2;
              }
          }

          foreach ($u in @('zenova', 'runneradmin', 'Public')) {
              $d = "C:\Users\$u\Desktop";
              if (Test-Path $d) {
                  Set-Content -Path "$d\Web-Quan-Ly-VPS.url" -Value "[InternetShortcut]`r`nURL=http://127.0.0.1:8080/`r`nIconIndex=0" -Encoding ASCII -Force;
              }
          }

      # =====================================================================
      # 9. HIỂN THỊ THÔNG TIN KẾT NỐI HOÀN CHỈNH
      # =====================================================================
      - name: 📢 Hiển Thị Thông Tin Kết Nối Hoàn Chỉnh
        shell: pwsh
        run: |
          $sdId = (Get-Content "C:\zenova-sd-id.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $sdId) { $sdId = "Chờ khởi động..."; }
          $tsIp = (Get-Content "C:\zenova-ts-ip.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $tsIp) { $tsIp = "Chưa kết nối (Kiểm tra Secret TAILSCALE_AUTHKEY)"; }
          $webUrl = (Get-Content "C:\zenova-web-url.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $webUrl) { $webUrl = "http://127.0.0.1:8080 (Mở trên máy)"; }
          $ssUrl = (Get-Content "C:\zenova-sunshine-url.txt" -Raw -ErrorAction SilentlyContinue);
          if (-not $ssUrl) { $ssUrl = "https://localhost:47990"; }

          Write-Host ""
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "               🚀 ZENOVA ULTIMATE VPS ĐÃ SẴN SÀNG!                    " -ForegroundColor Green;
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "🌐 LINK WEB QUẢN LÝ (CHỐNG 502) : $webUrl" -ForegroundColor Yellow;
          Write-Host "🌟 STARDESK TRUNG ID            : $sdId" -ForegroundColor Yellow;
          Write-Host "🔑 STARDESK TRUNG PIN           : $env:INPUT_PIN_CODE" -ForegroundColor Yellow;
          Write-Host "🌐 TAILSCALE IP RIÊNG (MOONLIGHT): $tsIp" -ForegroundColor Cyan;
          Write-Host "☀️ SUNSHINE WEB UI              : $ssUrl" -ForegroundColor Yellow;
          Write-Host "👤 TÀI KHOẢN RDP / WINDOWS      : zenova (hoặc runneradmin)" -ForegroundColor Yellow;
          Write-Host "🔒 MẬT KHẨU CỐ ĐỊNH             : $env:FIXED_PASSWORD" -ForegroundColor Yellow;
          Write-Host "💾 Ổ ĐĨA RIÊNG BẢO TOÀN DỮ LIỆU : $env:MOUNT_LETTER`: (Dung lượng VHD: $env:VHD_SIZE_GB)" -ForegroundColor Yellow;
          Write-Host "📦 KHO ỨNG DỤNG SẴN SÀNG        : C:\Apps & $env:MOUNT_LETTER`:\Apps" -ForegroundColor Yellow;
          Write-Host "======================================================================" -ForegroundColor Green;

          [Console]::WriteLine("::notice title=🚀 ZENOVA VPS SẴN SÀNG::StarDesk: $sdId | Tailscale IP: $tsIp | Web: $webUrl | PIN: $env:INPUT_PIN_CODE");

      # =====================================================================
      # 10. DUY TRÌ PHIÊN LÀM VIỆC, ĐẾM GIỜ CHUẨN 24H & LẮNG NGHE WEB PANEL
      # =====================================================================
      - name: ⏱️ Duy Trì Phiên Làm Việc, Đếm Giờ Chuẩn 24H & Lắng Nghe Web Panel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $totalMinutes = [int]"$env:TOTAL_MINUTES";
          $sessionMinutes = [Math]::Min($totalMinutes, 345);
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + ($sessionMinutes * 60);

          Write-Host "⏱️ Phiên hiện tại sẽ chạy $sessionMinutes phút (Tổng thời gian cấu hình: $totalMinutes phút)." -ForegroundColor Cyan;
          $sigFile = "$env:CONTROL_SIGNAL_FILE";
          $shouldDispatchNext = ($env:AUTO_RESTART -eq 'true' -and ($totalMinutes - $sessionMinutes) -gt 10);

          while ($true) {
              if (Test-Path $sigFile) {
                  $cmd = (Get-Content $sigFile -Raw).Trim();
                  Remove-Item $sigFile -Force -ErrorAction SilentlyContinue;

                  if ($cmd -eq 'SAVE_NOW') {
                      Write-Host "💾 Nhận lệnh LƯU DỮ LIỆU NGAY..." -ForegroundColor Yellow;
                      & powershell.exe -File "$env:SAVE_SCRIPT_PATH" -Reason "web-save-now";
                  } elseif ($cmd -eq 'RESTART_SESSION') {
                      Write-Host "🔄 Nhận lệnh RESET PHIÊN MỚI..." -ForegroundColor Yellow;
                      $shouldDispatchNext = $true;
                      break;
                  } elseif ($cmd -eq 'STOP_SESSION') {
                      Write-Host "🛑 Nhận lệnh NGẮT VPS..." -ForegroundColor Red;
                      $shouldDispatchNext = $false;
                      break;
                  }
              }

              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = $endEpoch - $now;
              if ($remain -le 0) { break; }
              Start-Sleep -Seconds 5;
          }

      # =====================================================================
      # 11. LƯU TOÀN BỘ Ổ ĐĨA CUỐI PHIÊN LÊN GITHUB RELEASE
      # =====================================================================
      - name: 💾 Lưu toàn bộ ổ đĩa cuối phiên lên GitHub Release
        if: always()
        shell: pwsh
        run: |
          Write-Host "💾 Đang thực hiện lưu dữ liệu cuối phiên..." -ForegroundColor Cyan;
          if (Test-Path "$env:SAVE_SCRIPT_PATH") {
              & powershell.exe -File "$env:SAVE_SCRIPT_PATH" -Reason "session-end";
          }

      # =====================================================================
      # 12. TỰ ĐỘNG KÍCH HOẠT PHIÊN TIẾP THEO (CHUỖI 24H LIÊN TỤC)
      # =====================================================================
      - name: 🚀 Tự động kích hoạt phiên tiếp theo & Khởi động lại VPS
        if: always()
        shell: pwsh
        run: |
          $totalMinutes = [int]"$env:TOTAL_MINUTES";
          $sessionMinutes = [Math]::Min($totalMinutes, 345);
          $remTotal = $totalMinutes - $sessionMinutes;
          if ($env:AUTO_RESTART -eq 'true' -and $remTotal -gt 10) {
              Write-Host "🚀 Đang kích hoạt phiên nối tiếp với thời gian còn lại: ${remTotal}m..." -ForegroundColor Green;
              & gh.exe workflow run "zenova_mega_vps.yml" -f machine_id="$env:MACHINE_ID" -f duration="${remTotal}m" -f os_type="windows" -f windows_image="${{ github.event.inputs.windows_image || 'windows-2022' }}" 2>$null;
              & gh.exe workflow run "zenova-ultimate.yml" -f machine_id="$env:MACHINE_ID" -f duration="${remTotal}m" -f os_type="windows" -f windows_image="${{ github.event.inputs.windows_image || 'windows-2022' }}" 2>$null;
          }

  # =========================================================================
  # 2. LINUX RUNNER (UBUNTU + XFCE4 + XRDP + TAILSCALE + WEB QUẢN LÝ)
  # =========================================================================
  Zenova-Linux:
    name: '🐧 Linux VPS (${{ github.event.inputs.machine_id || ''zenova-linux-1'' }})'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.os_type == 'linux' || github.event.inputs.os_type == 'both' }}
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TAILSCALE_KEY || secrets.TAILSCALE_AUTH_KEY || secrets.TS_AUTHKEY || secrets.TAILSCALE || secrets.TS_KEY || secrets.TAILSCALE_TOKEN }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-linux-1' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || 'Zenova Linux Machine' }}
      FIXED_PASSWORD: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}
      DURATION_INPUT: ${{ github.event.inputs.duration || '24h' }}
      AUTO_RESTART: ${{ github.event.inputs.auto_restart }}
      WEB_PORT: '8080'

    steps:
      - name: 🐧 Cài Đặt XFCE4, XRDP, Tailscale & Web Quản Lý
        run: |
          NOW=$(date +%s)
          echo "JOB_START_EPOCH=$NOW" >> $GITHUB_ENV
          echo "runner:$FIXED_PASSWORD" | sudo chpasswd

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xfce4-terminal xrdp pulseaudio curl wget >/dev/null 2>&1
          echo "xfce4-session" > ~/.xsession
          sudo systemctl restart xrdp

          curl -fsSL https://tailscale.com/install.sh | sudo sh >/dev/null 2>&1
          if [ -n "$TAILSCALE_AUTHKEY" ]; then
              sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="$MACHINE_ID" --accept-routes --reset >/dev/null 2>&1
              TS_IP=$(tailscale ip -4 2>/dev/null || echo "")
              echo "$TS_IP" > /tmp/zenova-ts-ip.txt
              echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          fi

          mkdir -p /home/runner/Apps /tmp/zenova-web
          echo '' | base64 -d > /tmp/zenova-web/server.py
          python3 /tmp/zenova-web/server.py 8080 >/dev/null 2>&1 &

          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --logfile /tmp/cf-web.log >/dev/null 2>&1 &

          sleep 5
          WEB_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf-web.log | head -n 1 || echo "http://127.0.0.1:8080")
          PUB_IP=$(curl -s ifconfig.me || echo "127.0.0.1")

          echo "======================================================================"
          echo "               🚀 ZENOVA LINUX VPS ĐÃ SẴN SÀNG!                       "
          echo "======================================================================"
          echo "🌐 LINK WEB QUẢN LÝ : $WEB_URL"
          echo "🖥️ XRDP HOST        : $PUB_IP:3389"
          echo "🌐 TAILSCALE IP     : $TS_IP"
          echo "👤 USER             : runner"
          echo "🔑 PASSWORD         : $FIXED_PASSWORD"
          echo "======================================================================"

          DUR="$DURATION_INPUT"
          TOTAL_MINS=1440
          if [[ "$DUR" =~ ([0-9]+)h ]]; then TOTAL_MINS=$(( ${BASH_REMATCH[1]} * 60 )); fi
          SESS_MINS=$(( TOTAL_MINS < 345 ? TOTAL_MINS : 345 ))
          END_TIME=$(( NOW + SESS_MINS * 60 ))

          while true; do
              CUR=$(date +%s)
              if [ $CUR -ge $END_TIME ]; then break; fi
              if [ -f /tmp/zenova-control-signal.txt ]; then
                  CMD=$(cat /tmp/zenova-control-signal.txt)
                  rm -f /tmp/zenova-control-signal.txt
                  if [ "$CMD" = "STOP_SESSION" ]; then break; fi
              fi
              sleep 5
          done
