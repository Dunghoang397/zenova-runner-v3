          $foundImg = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Include '*Zenova*','*wallpaper*','*.png','*.jpg' -Recurse -File -EA SilentlyContinue | Where-Object { $_.Length -gt 20KB } | Select-Object -First 1
