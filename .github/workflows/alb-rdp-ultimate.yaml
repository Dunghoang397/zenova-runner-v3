                Start-Process $inst -ArgumentList '-q','--no-ui' -Wait -NoNewWindow -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 8
              }
            }
            $r = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Filter 'RobloxPlayerBeta.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($r) {
              $ws = New-Object -ComObject WScript.Shell
              $lnk = $ws.CreateShortcut("$desk\Roblox.lnk")
              $lnk.TargetPath = $r.FullName
              $lnk.Save()
            }
            Write-Host "Roblox OK" -ForegroundColor Green
          } catch { Write-Host "Roblox skip" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════
      # EVKEY
      # ═══════════════════════════════════════════
      - name: 📦 Cài EVKey
        timeout-minutes: 3
        shell: pwsh
        run: |
          try {
            $ic = $env:INSTALLER_CACHE
            $ev = 'C:\ALB-Apps\EVKey'
            New-Item -ItemType Directory -Force -Path $ev | Out-Null
            if (-not (Test-Path "$ev\EVKey64.exe")) {
              if (Test-Path "$ic\EVKey.zip") {
                Expand-Archive "$ic\EVKey.zip" $ev -Force
              }
            }
            $exe = $null
            if (Test-Path "$ev\EVKey64.exe") { $exe = "$ev\EVKey64.exe" }
            elseif (Test-Path "$ev\EVKey32.exe") { $exe = "$ev\EVKey32.exe" }
            if ($exe) {
              $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"
              $desk = "$env:PROFILE_PATH\Desktop"
              $ws = New-Object -ComObject WScript.Shell
              $l1 = $ws.CreateShortcut("$startup\EVKey.lnk")
              $l1.TargetPath = $exe
              $l1.Save()
              $l2 = $ws.CreateShortcut("$desk\EVKey.lnk")
              $l2.TargetPath = $exe
              $l2.Save()
              Start-Process $exe -WorkingDirectory $ev -ErrorAction SilentlyContinue
            }
            Write-Host "EVKey OK" -ForegroundColor Green
          } catch { Write-Host "EVKey skip" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════
      # WEB PANEL
      # ═══════════════════════════════════════════
      - name: 🌐 Web Panel
        shell: pwsh
        timeout-minutes: 5
        run: |
          $tsIp = $env:TAILSCALE_IP
          $port = $env:WEB_PORT
          $url = if ($env:FUNNEL_URL) { $env:FUNNEL_URL } else { "http://${tsIp}:${port}" }
          "WEB_PANEL_URL=$url" >> $env:GITHUB_ENV

          $h = New-Object System.Collections.Generic.List[string]
          $h.Add('<!DOCTYPE html>')
          $h.Add('<html><head><meta charset="utf-8"><title>ALB v39</title></head>')
          $h.Add('<body style="background:#07090f;color:#eee;font-family:sans-serif;padding:20px">')
          $h.Add("<h1>ALB v39.0</h1>")
          $h.Add("<p>Machine: $($env:MACHINE_ID)</p>")
          $h.Add("<p>IP: $tsIp</p>")
          $h.Add("<p>Panel: <a href='$url' style='color:#38bdf8'>$url</a></p>")
          $h.Add("<p>User: $($env:RDP_USER)</p>")
          $h.Add("<p>Pass: $($env:RDP_PASS)</p>")
          $h.Add('</body></html>')
          Set-Content "$env:RUNNER_TEMP\panel.html" -Value ($h -join "`r`n") -Encoding UTF8

          $w = New-Object System.Collections.Generic.List[string]
          $w.Add('$ErrorActionPreference = "Continue"')
          $w.Add('$l = [System.Net.HttpListener]::new()')
          $w.Add('$l.Prefixes.Add("http://+:' + $port + '/")')
          $w.Add('$l.Start()')
          $w.Add('while ($l.IsListening) {')
          $w.Add('  try {')
          $w.Add('    $c = $l.GetContext()')
          $w.Add('    $hh = Get-Content -Raw "$env:RUNNER_TEMP\panel.html"')
          $w.Add('    $b = [System.Text.Encoding]::UTF8.GetBytes($hh)')
          $w.Add('    $c.Response.ContentType = "text/html; charset=utf-8"')
          $w.Add('    $c.Response.ContentLength64 = $b.Length')
          $w.Add('    $c.Response.OutputStream.Write($b, 0, $b.Length)')
          $w.Add('    $c.Response.OutputStream.Close()')
          $w.Add('  } catch {}')
          $w.Add('}')
          Set-Content "$env:RUNNER_TEMP\web.ps1" -Value ($w -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile','-WindowStyle','Hidden','-File',"`"$env:RUNNER_TEMP\web.ps1`""
          Start-Sleep -Seconds 2
          Write-Host "OK Web Panel" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      # ═══════════════════════════════════════════
      # WATCHDOG
      # ═══════════════════════════════════════════
      - name: ⏳ Watchdog
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        run: |
          function Test-Port {
            param($P)
            try {
              $t = [System.Net.Sockets.TcpClient]::new()
              $a = $t.ConnectAsync('127.0.0.1', $P)
              if ($a.Wait(1500)) { $t.Close(); return $true }
              $t.Close()
              return $false
            } catch { return $false }
          }

          $start = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH } else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $end = $start + ([long]$env:TOTAL_MINUTES * 60)
          $save = "$env:RUNNER_TEMP\save-data.ps1"
          $sig = $env:CONTROL_SIGNAL_FILE
          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'
          $lastLog = (Get-Date).AddHours(-1)

          while ($true) {
            if (Test-Path $sig) {
              $c = (Get-Content -Raw $sig -ErrorAction SilentlyContinue).Trim()
              Remove-Item $sig -Force -ErrorAction SilentlyContinue
              if ($c -in 'save','SAVE_NOW') { & $save -Reason 'manual'; $global:LASTEXITCODE = 0 }
              elseif ($c -in 'restart','RESTART_SESSION','start-new') { 'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV; break }
              elseif ($c -in 'stop','STOP_SESSION') { 'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV; break }
            }

            $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $remain = $end - $now
            if ($remain -le 0) { break }

            if (((Get-Date) - $lastLog).TotalMinutes -ge 10) {
              $h = [math]::Floor($remain / 3600)
              $m = [math]::Floor(($remain % 3600) / 60)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Còn ${h}h${m}m" -ForegroundColor Cyan
              $lastLog = Get-Date
            }

            if (-not (Test-Port 47990)) {
              Start-Service SunshineService -ErrorAction SilentlyContinue
            }
            if (-not (Test-Port 3389)) {
              Restart-Service TermService -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path $tsExe) {
              $st = & $tsExe status 2>&1 | Out-String
              if ($st -notmatch '100\.') {
                & $tsExe up --reset --unattended 2>&1 | Out-Null
              }
            }
            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          try {
            $s = "$env:RUNNER_TEMP\save-data.ps1"
            if (Test-Path $s) { & $s -Reason 'session-end' }
          } catch { Write-Host "Save skip" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      - name: 🧹 Dọn dẹp
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            if (Test-Path $ts) {
              & $ts logout 2>&1 | Out-Null
              & $ts down 2>&1 | Out-Null
            }
            @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP') |
              ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
            Stop-Service TermService -Force -ErrorAction SilentlyContinue
          } catch {}
          $global:LASTEXITCODE = 0

      - name: 🔁 Auto-restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          WALL_URL: ${{ inputs.wallpaper_url }}
        run: |
          $wf = [System.IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])
          $a = @(
            'workflow', 'run', $wf, '--ref', $env:GITHUB_REF_NAME,
            '-f', "machine_id=$env:MACHINE_ID",
            '-f', "duration=$env:DURATION",
            '-f', 'auto_restart=true',
            '-f', "drive_letter=$env:MOUNT_LETTER",
            '-f', "vhd_size_gb=$env:VHD_SIZE_GB_VALIDATED",
            '-f', "windows_image=$env:WIN_IMAGE",
            '-f', "fixed_password=$env:FIXED_PASS",
            '-f', "vdd_resolution=$env:VDD_RES",
            '-f', "wallpaper_url=$env:WALL_URL"
          )
          & gh @a
          if ($LASTEXITCODE -ne 0) { throw 'Auto-restart fail' }
