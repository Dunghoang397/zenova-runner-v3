              $sdRegDir = [System.IO.Path]::Combine("$sdBackup", "Registry"); if (Test-Path "$sdRegDir") { Get-ChildItem -Path "$sdRegDir" -Filter '*.reg' | ForEach-Object { reg import ($_.FullName) *>$null } }
