          $user = $env:RDP_USER

          function Start-FastJob {
            param([scriptblock]$Block, [object[]]$ArgsList)
            return Start-Job -ScriptBlock $Block -ArgumentList $ArgsList
          }

          $jHw = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            try {
              $usbDir = 'C:\usbmmidd_v2'
              if (Test-Path "$ic\usbmmidd.zip") {
                New-Item -ItemType Directory -Force -Path $usbDir | Out-Null
                & 7z x "$ic\usbmmidd.zip" "-oC:\" -y -mmt=on *> $null
                if (-not (Test-Path "$usbDir\deviceinstaller64.exe")) { & 7z x "$ic\usbmmidd.zip" "-o$usbDir" -y -mmt=on *> $null }
              }
              if (Test-Path "$usbDir\deviceinstaller64.exe") {
                Push-Location $usbDir
                Get-ChildItem $usbDir -Filter '*.cer' -Recurse -EA SilentlyContinue | ForEach-Object {
                  Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *> $null
                  Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *> $null
                }
                & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null
                $wudf = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
                New-Item $wudf -Force | Out-Null
                Set-ItemProperty $wudf '0' '1920,1080,60' -Force
                Set-ItemProperty $wudf '1' '1920,1080,120' -Force
                Set-ItemProperty $wudf '2' '2560,1440,60' -Force
                Set-ItemProperty $wudf '3' '3840,2160,60' -Force
                & .\deviceinstaller64.exe enableidd 1 *> $null
                Pop-Location
              }
              @('MMCSS','AudioEndpointBuilder','Audiosrv') | ForEach-Object { Set-Service -Name $_ -StartupType Automatic -EA SilentlyContinue; Start-Service -Name $_ -EA SilentlyContinue }
              $vbDir = "$ic\VBCable"
              if (Test-Path "$ic\VBCable.zip") { New-Item -ItemType Directory -Force $vbDir | Out-Null; & 7z x "$ic\VBCable.zip" "-o$vbDir" -y -mmt=on *> $null }
              $inf = Get-ChildItem $vbDir -Filter '*64*.inf' -EA SilentlyContinue | Select-Object -First 1
              if ($inf) { pnputil /add-driver $inf.FullName /install *> $null }
            } catch {}
          }

          $jSun = Start-FastJob -ArgsList @($ic, $sunPersist) -Block {
            param($ic, $sunPersist)
