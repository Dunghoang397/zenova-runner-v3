          Write-Host "║ Sun Pass : $($env:SUNSHINE_PASS.PadRight(31))║" -ForegroundColor Yellow
          Write-Host "║ Duration : $($env:TOTAL_MINUTES) phut$(('').PadRight(25))║" -ForegroundColor White
          Write-Host "╚══════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

          $lines = @(
            "## 🖥️ ALB VPSFREE v40.1 — Connection Info",
            "",
            "| Key | Value |",
            "|-----|-------|",
            "| 🏷️ Machine | ``$($env:MACHINE_ID)`` |",
            "| 🌐 RDP Host | ``${host}:3389`` |",
            "| 👤 RDP User | ``$($env:RDP_USER)`` |",
            "| 🔐 RDP Pass | ``$($env:RDP_PASS)`` |",
            "| 🎮 Sunshine URL | ``https://${tsIp}:$($env:SUNSHINE_WEB_PORT)`` |",
            "| 🔑 Sunshine Pass | ``$($env:SUNSHINE_PASS)`` |",
            "| 🌍 Tailscale IP | ``$tsIp`` [$($env:TS_STATUS)] |"
          )
          if ($ddns) { $lines += "| 🦆 DuckDNS | ``$ddns`` |" }
          if ($pubIp) { $lines += "| 📡 Public IP | ``$pubIp`` |" }
          if ($env:CPU_MODEL_INFO) { $lines += "| ⚙️ CPU | $($env:CPU_MODEL_INFO) |" }
          $lines += ""
          $lines += "> ⏱️ Session: **$($env:TOTAL_MINUTES) phút** | Panel: $($env:WEB_PANEL_URL)"

          $lines | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }
          $global:LASTEXITCODE = 0

      - name: ⏳ Watchdog
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        run: |
          function Test-Port {
            param([int]$P)
            try {
              $t = [System.Net.Sockets.TcpClient]::new()
              $a = $t.ConnectAsync('127.0.0.1', $P)
              $ok = $a.Wait(1500)
              $t.Close()
              return $ok
            } catch { return $false }
          }

          $start    = if ($env:JOB_START_EPOCH) { [long]$env:JOB_START_EPOCH }
                      else { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          $end      = $start + ([long]$env:TOTAL_MINUTES * 60)
          $save     = "$env:RUNNER_TEMP\save-data.ps1"
          $sig      = $env:CONTROL_SIGNAL_FILE
          $tsExe    = 'C:\Program Files\Tailscale\tailscale.exe'
          $lastLog  = (Get-Date).AddHours(-1)
          $tick     = 0

          Write-Host "Watchdog start | end=$(([DateTimeOffset]::FromUnixTimeSeconds($end)).ToString('HH:mm:ss')) UTC" -ForegroundColor Cyan

          while ($true) {
            if (Test-Path $sig) {
              $c = (Get-Content -Raw $sig -ErrorAction SilentlyContinue).Trim()
              Remove-Item $sig -Force -ErrorAction SilentlyContinue
              switch ($c) {
                { $_ -in 'save','SAVE_NOW' } {
                  Write-Host "[$(Get-Date -f 'HH:mm:ss')] Manual save..." -ForegroundColor Yellow
                  & $save -Reason 'manual'
                  $global:LASTEXITCODE = 0
                }
                { $_ -in 'restart','RESTART_SESSION','start-new' } {
                  Write-Host "[$(Get-Date -f 'HH:mm:ss')] Restart signal" -ForegroundColor Yellow
                  'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV
                  break
                }
                { $_ -in 'stop','STOP_SESSION' } {
                  Write-Host "[$(Get-Date -f 'HH:mm:ss')] Stop signal" -ForegroundColor Yellow
                  'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV
                  break
                }
              }
              if ($c -in 'restart','RESTART_SESSION','start-new','stop','STOP_SESSION') { break }
            }

            $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $remain = $end - $now
            if ($remain -le 0) {
              Write-Host "[$(Get-Date -f 'HH:mm:ss')] Het thoi gian, thoat" -ForegroundColor Cyan
              break
            }

            if (((Get-Date) - $lastLog).TotalMinutes -ge 5) {
              $h = [math]::Floor($remain / 3600)
              $m = [math]::Floor(($remain % 3600) / 60)
              $sunOk  = if (Test-Port 47990) { "OK" } else { "DOWN" }
              $rdpOk  = if (Test-Port 3389)  { "OK" } else { "DOWN" }
              Write-Host "[$(Get-Date -f 'HH:mm:ss')] Con ${h}h${m}m | RDP=$rdpOk | Sunshine=$sunOk" -ForegroundColor Cyan
              $lastLog = Get-Date
            }

            $tick++

            if ($tick % 6 -eq 0) {
              if (-not (Test-Port 47990)) {
                Write-Host "Sunshine down, khoi dong lai..." -ForegroundColor Yellow
                Start-Service SunshineService,sunshinesvc -ErrorAction SilentlyContinue
              }
              if (-not (Test-Port 3389)) {
                Write-Host "RDP down, khoi dong lai..." -ForegroundColor Yellow
                Restart-Service TermService -Force -ErrorAction SilentlyContinue
              }
            }

            if ($tick % 60 -eq 0 -and (Test-Path $tsExe)) {
              $st = & $tsExe status 2>&1 | Out-String
              if ($st -notmatch '100\.') {
                Write-Host "Tailscale offline, reconnect..." -ForegroundColor Yellow
                & $tsExe up --reset --unattended 2>&1 | Out-Null
              }
            }

            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          try {
            $s = "$env:RUNNER_TEMP\save-data.ps1"
            if (Test-Path $s) {
              Write-Host "Dang luu du lieu phien..." -ForegroundColor Cyan
              & $s -Reason 'session-end'
            } else {
              Write-Host "save-data.ps1 khong ton tai, bo qua" -ForegroundColor Yellow
            }
          } catch { Write-Host "Save skip: $_" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      - name: 🧹 Dọn dẹp
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            if (Test-Path $ts) {
              & $ts logout 2>&1 | Out-Null
              & $ts down 2>&1 | Out-Null
            }
            @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Sunshine-Moonlight-TCP','Sunshine-Moonlight-UDP') |
              ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
            Stop-Service TermService -Force -ErrorAction SilentlyContinue
            Stop-Service SunshineService,sunshinesvc -Force -ErrorAction SilentlyContinue

            try {
              $vhd = "$env:VHD_CONTAINER\alb-os-disk.vhdx"
              if (Test-Path $vhd) { Dismount-VHD -Path $vhd -ErrorAction SilentlyContinue }
            } catch {}
          } catch { Write-Host "Cleanup warn: $_" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0

      - name: 🔁 Auto-restart
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart == true || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        timeout-minutes: 5
        env:
          DURATION:    ${{ inputs.duration }}
          WIN_IMAGE:   ${{ inputs.windows_image }}
          FIXED_PASS:  ${{ inputs.fixed_password }}
          VDD_RES:     ${{ inputs.vdd_resolution }}
          CHOCO_PKGS:  ${{ inputs.choco_packages }}
          OPT_WIN:     ${{ inputs.optimize_windows }}
          EN_TS:       ${{ inputs.enable_tailscale }}
          EN_DNS:      ${{ inputs.enable_duckdns }}
        run: |
          $wfRef  = $env:GITHUB_WORKFLOW_REF
          $wfFile = if ($wfRef) {
            ($wfRef -split '@')[0] -split '/' | Select-Object -Last 1
          } else {
            "$env:GITHUB_WORKFLOW.yml" -replace ' ','-'
          }

          if ([string]::IsNullOrWhiteSpace($wfFile)) {
            Write-Host "Khong xac dinh duoc workflow file" -ForegroundColor Red
            exit 1
          }

          Write-Host "Auto-restart: $wfFile | machine=$env:MACHINE_ID | duration=$env:DURATION" -ForegroundColor Cyan

          $a = @(
            'workflow', 'run', $wfFile,
            '--ref', $env:GITHUB_REF_NAME,
            '-f', "machine_id=$env:MACHINE_ID",
            '-f', "duration=$env:DURATION",
            '-f', 'auto_restart=true',
