name: Zenova Production

on:
  repository_dispatch:
    types: [zenova-create]

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  Zenova-RDP:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Resolve Inputs
        id: resolve
        shell: pwsh
        run: |
          $mid = "${{ github.event.client_payload.machine_id }}"
          $owner = "${{ github.event.client_payload.owner_discord_id }}"
          $dur = "${{ github.event.client_payload.duration }}"
          $img = "${{ github.event.client_payload.windows_image }}"
          $vhd = "${{ github.event.client_payload.vhd_size_gb }}"
          $pwd_ = "${{ github.event.client_payload.fixed_password }}"
          $pkgs = "${{ github.event.client_payload.choco_packages }}"
          $restore = "${{ github.event.client_payload.restore_data }}"
          if (-not $mid) { $mid = "default" }
          if (-not $dur) { $dur = "5h00m" }
          if (-not $vhd) { $vhd = "1024" }
          if (-not $pwd_) { $pwd_ = "ABC123@" }
          if (-not $restore) { $restore = "true" }
          $cid = (($mid).Trim().ToLower() -replace "[^a-z0-9\-]", "-") -replace "\-+","-" -replace "^\-|\-$",""
          $t = 300
          if ($dur -eq "1h") { $t = 60 }
          if ($dur -eq "3h") { $t = 180 }
          @("MACHINE_ID=$cid","OWNER_DISCORD_ID=$owner","TOTAL_MINUTES=$t","WINDOWS_IMAGE=$img","VHD_SIZE_GB=$vhd","FIXED_PASSWORD=$pwd_","CHOCO_PACKAGES=$pkgs","RESTORE_DATA=$restore","RELEASE_TAG=zenova-storage-$cid","JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())") | ForEach-Object { $_ >> "$env:GITHUB_ENV" }
          Write-Host "Machine: $cid | Duration: $t min | Restore: $restore"

      - name: Pre-flight
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -EA SilentlyContinue)) { choco install 7zip -y --no-progress --limit-output }
          if (Get-Command 7z -EA SilentlyContinue) { "HAS_7Z=1" >> "$env:GITHUB_ENV" } else { "HAS_7Z=0" >> "$env:GITHUB_ENV" }
          $b = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion").CurrentBuild
          "OS_BUILD=$b" >> "$env:GITHUB_ENV"

      - name: Fix Lag
        shell: pwsh
        run: |
          $svcs = @("DiagTrack","WSearch","SysMain","WerSvc","XblAuthManager","XblGameSave","XboxNetApiSvc","XboxGipSvc","Spooler","MapsBroker","PcaSvc","TabletInputService","RetailDemo","dmwappushservice","WbioSrvc","PhoneSvc","PrintNotify","WpnService","WpnUserService")
          foreach ($s in $svcs) { try { Stop-Service $s -Force -EA SilentlyContinue; Set-Service $s -StartupType Disabled -EA SilentlyContinue } catch {} }
          try {
              $dwm = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
              if (-not (Test-Path $dwm)) { New-Item $dwm -Force | Out-Null }
              Set-ItemProperty $dwm "VisualFXSetting" 2 -Type DWord -Force -EA SilentlyContinue
              Set-ItemProperty "HKCU:\Control Panel\Desktop" "DragFullWindows" "0" -Force -EA SilentlyContinue
          } catch {}
          try { Set-ItemProperty "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" "AllowTelemetry" 0 -Type DWord -Force -EA SilentlyContinue } catch {}
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /hibernate off
          powercfg /setactive SCHEME_MIN
          Write-Host "Fix lag done"

      - name: Fix Audio
        shell: pwsh
        run: |
          foreach ($s in @("AudioEndpointBuilder","Audiosrv","MMCSS")) { try { Set-Service $s -StartupType Automatic -EA SilentlyContinue; Restart-Service $s -Force -EA SilentlyContinue } catch {} }
          Start-Sleep 3
          try {
              $rk = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render"
              if (Test-Path $rk) {
                  Get-ChildItem $rk -EA SilentlyContinue | ForEach-Object {
                      $pk = Join-Path $_.PSPath "Properties"
                      if (Test-Path $pk) {
                          Set-ItemProperty $pk "{1da5d803-d492-4edd-8c23-e0c0ffee7f0e},5" 0 -Type DWord -Force -EA SilentlyContinue
                      }
                  }
              }
          } catch {}
          Restart-Service Audiosrv -Force -EA SilentlyContinue
          Write-Host "Audio fixed"

      - name: Create Release
        shell: pwsh
        run: |
          $null = gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" 2>&1
          if (($LASTEXITCODE) -ne 0) {
              $dummy = "$env:RUNNER_TEMP\init.txt"
              Set-Content "$dummy" "Zenova" -Encoding UTF8
              gh release create "$env:RELEASE_TAG" "$dummy" --repo "$env:GH_REPO" --title "Zenova ($env:MACHINE_ID)"
          }
          $global:LASTEXITCODE = 0

      - name: Build VHD
        shell: pwsh
        run: |
          $dl = "X"
          $vc = "C:\ZENOVA-VHD"
          New-Item -ItemType Directory -Force -Path "$vc" | Out-Null
          $vf = "$vc\zenova-os.vhdx"
          $sb = ([int64]"$env:VHD_SIZE_GB") * 1GB
          $m = $false
          try {
              if (-not (Test-Path "$vf")) {
                  New-VHD -Path "$vf" -SizeBytes ($sb) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel "ZENOVA" -Confirm:($false) | Out-Null
              } else { Mount-VHD -Path "$vf" }
              $null = Get-PSDrive -Name "$dl" -EA Stop
              if (Test-Path "${dl}:\") { $m = $true }
          } catch {}
          if (-not $m) {
              $fb = "$vc\VIRTUAL"
              New-Item -ItemType Directory -Force -Path "$fb" | Out-Null
              & subst "${dl}:" "$fb"
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -EA SilentlyContinue
          }
          $sr = "${dl}:\ZENOVA-SYSTEM"
          @("$sr\sessions","$sr\DATA","$sr\OS-OVERLAY","$sr\Users","$sr\installer-cache","${dl}:\Apps") | ForEach-Object { New-Item -ItemType Directory -Force -Path "$_" | Out-Null }
          @("VHD_CONTAINER=$vc","VHD_FILE=$vf","SHARED_ROOT=$sr","SHARED_SESSION_DIR=$sr\sessions","SHARED_DATA_DIR=$sr\DATA","SHARED_OS_DIR=$sr\OS-OVERLAY","SHARED_STATE_FILE=$sr\sessions\state.json","PROFILE_ROOT=$sr\Users","CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\zenova-control.txt","INSTALLER_CACHE_PERSIST=$sr\installer-cache","MOUNT_LETTER=$dl") | ForEach-Object { $_ >> "$env:GITHUB_ENV" }

      - name: Restore Data
        shell: pwsh
        run: |
          if ("$env:RESTORE_DATA" -ne "true") { "DATA_RESTORED=1" >> "$env:GITHUB_ENV"; exit 0 }
          $dlDir = "$env:RUNNER_TEMP\gh-restore"
          Remove-Item "$dlDir" -Recurse -Force -EA SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dlDir" | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern "drive-manifest.json" --dir "$dlDir" 2>$null
          $mf = "$dlDir\drive-manifest.json"
          if (-not (Test-Path "$mf")) { "DATA_RESTORED=1" >> "$env:GITHUB_ENV"; exit 0 }
          foreach ($try in 1..3) { gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern "zenova-drive.*" --dir "$dlDir" 2>$null; if (($LASTEXITCODE) -eq 0) { break }; Start-Sleep 8 }
          $fc = Get-ChildItem "$dlDir" -Filter "zenova-drive.*" | Sort-Object Name | Select-Object -First 1
          if (-not $fc) { "DATA_RESTORED=1" >> "$env:GITHUB_ENV"; exit 0 }
          $stage = "$env:VHD_CONTAINER\restore-stage"
          Remove-Item "$stage" -Recurse -Force -EA SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage" | Out-Null
          if ("$env:HAS_7Z" -eq "1") { & 7z x "$($fc.FullName)" "-o$stage" -y -mmt=on *> $null }
          Remove-Item "$dlDir" -Recurse -Force -EA SilentlyContinue
          robocopy "$stage" "$env:SHARED_ROOT" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null
          $global:LASTEXITCODE = 0
          Remove-Item "$stage" -Recurse -Force -EA SilentlyContinue
          "DATA_RESTORED=1" >> "$env:GITHUB_ENV"

      - name: RDP Config
        shell: pwsh
        run: |
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" "fDenyTSConnections" 0 -Force
          $p = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty "$p" "UserAuthentication" 1 -Force
          Set-ItemProperty "$p" "SecurityLayer" 2 -Force
          Restart-Service TermService -Force -EA SilentlyContinue
          Remove-NetFirewallRule -DisplayName "ZENOVA-*" -EA SilentlyContinue
          New-NetFirewallRule -DisplayName "ZENOVA-RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -RemoteAddress "100.64.0.0/10","127.0.0.1" -Profile Any | Out-Null
          Set-Service TermService -StartupType Automatic -EA SilentlyContinue
          Start-Service TermService -EA SilentlyContinue
          tzutil /s "SE Asia Standard Time"

      - name: Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          if (-not ("$env:TAILSCALE_AUTH_KEY")) { exit 1 }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path "$ts")) {
              $cm = "$env:RUNNER_TEMP\ts.msi"
              try { Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$cm" -UseBasicParsing } catch {}
              if (Test-Path "$cm") { Start-Process msiexec.exe -ArgumentList "/i `"$cm`" /quiet /norestart" -Wait }
          }
          if (-not (Test-Path "$ts")) { exit 1 }
          Set-Service "Tailscale" -StartupType Automatic -EA SilentlyContinue
          Start-Service "Tailscale" -EA SilentlyContinue
          Start-Sleep 6
          $th = "zenova-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)"
          & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=$th" --accept-routes --accept-dns --reset --unattended
          if (($LASTEXITCODE) -ne 0) { exit 1 }
          $ip = $null
          1..20 | ForEach-Object { if (-not $ip) { $o = (& "$ts" ip -4 2>&1 | Out-String).Trim(); if ("$o" -match "^\d+\.\d+\.\d+\.\d+$") { $ip = "$o" } else { Start-Sleep 3 } } }
          if (-not $ip) { exit 1 }
          "TAILSCALE_IP=$ip" >> "$env:GITHUB_ENV"

      - name: User Config
        shell: pwsh
        run: |
          $u = "$env:USERNAME"
          $mp = "$env:FIXED_PASSWORD"
          & net accounts /minpwlen:0 /maxpwage:unlimited *> $null
          for ($i=1; $i -le 3; $i++) { & net user "$u" "$mp" *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 2 }
          & net user "$u" /active:yes /expires:never *> $null
          & net localgroup Administrators "$u" /add *> $null
          & net localgroup "Remote Desktop Users" "$u" /add *> $null
          "RDP_USER=$u" >> "$env:GITHUB_ENV"
          "PROFILE_PATH=$env:USERPROFILE" >> "$env:GITHUB_ENV"
          "RDP_PASS=$mp" >> "$env:GITHUB_ENV"

      - name: Publish Installing
        shell: pwsh
        run: |
          $uO = Get-LocalUser -Name "$env:RDP_USER" -EA SilentlyContinue
          $st = [ordered]@{ machineId="$env:MACHINE_ID"; ownerDiscordId="$env:OWNER_DISCORD_ID"; user="$env:RDP_USER"; sid="$($uO.SID.Value)"; password="(secret)"; tailscaleIp="$env:TAILSCALE_IP"; durationMinutes=[int]"$env:TOTAL_MINUTES"; status="installing"; step="installing_apps"; ready=$false; appsReady=$false; lastUpdatedUtc=(Get-Date).ToUniversalTime().ToString("o") }
          New-Item -ItemType Directory -Force -Path (Split-Path "$env:SHARED_STATE_FILE") | Out-Null
          $st | ConvertTo-Json -Depth 5 | Set-Content "$env:SHARED_STATE_FILE" -Encoding UTF8
          $td = "$env:RUNNER_TEMP\state-upload"
          New-Item -ItemType Directory -Force -Path "$td" | Out-Null
          Copy-Item "$env:SHARED_STATE_FILE" "$td\state.json" -Force
          gh release upload "$env:RELEASE_TAG" "$td\state.json" --repo "$env:GH_REPO" --clobber

      - name: Install Apps
        shell: pwsh
        run: |
          $pkgF = "$env:SHARED_OS_DIR\choco-packages.txt"
          $saved = @(); if (Test-Path "$pkgF") { $saved = @(Get-Content "$pkgF" | Where-Object { $_ -match "^[A-Za-z0-9._\-]+$" }) }
          $inp = @()
          if (-not ([string]::IsNullOrWhiteSpace("$env:CHOCO_PACKAGES"))) { $inp = @("$env:CHOCO_PACKAGES" -split "\s+" | Where-Object { $_ }) }
          $preset = @("discord","googlechrome","microsoft-edge","spotify","vscode","evkey","bandicam","tailscale")
          $all = @($preset + $saved + $inp | Select-Object -Unique)
          $all | Set-Content "$pkgF" -Encoding UTF8
          foreach ($pkg in $all) { choco install "$pkg" -y --no-progress --limit-output --cache "$env:SHARED_OS_DIR\choco-cache"; $global:LASTEXITCODE = 0 }

      - name: Publish Ready
        shell: pwsh
        run: |
          $uO = Get-LocalUser -Name "$env:RDP_USER" -EA SilentlyContinue
          $st = [ordered]@{ machineId="$env:MACHINE_ID"; ownerDiscordId="$env:OWNER_DISCORD_ID"; user="$env:RDP_USER"; sid="$($uO.SID.Value)"; password="(secret)"; tailscaleIp="$env:TAILSCALE_IP"; durationMinutes=[int]"$env:TOTAL_MINUTES"; status="ready"; step="ready"; ready=$true; appsReady=$true; lastUpdatedUtc=(Get-Date).ToUniversalTime().ToString("o") }
          $st | ConvertTo-Json -Depth 5 | Set-Content "$env:SHARED_STATE_FILE" -Encoding UTF8
          $td = "$env:RUNNER_TEMP\state-upload"
          Copy-Item "$env:SHARED_STATE_FILE" "$td\state.json" -Force
          gh release upload "$env:RELEASE_TAG" "$td\state.json" --repo "$env:GH_REPO" --clobber

      - name: Keepalive
        id: keepalive
        shell: pwsh
        run: |
          $ee = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60)
          while ($true) {
              $r = ($ee) - ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
              if ($r -le 0) { break }
              Start-Sleep 5
          }