                    <div id="toast" class="toast"></div>

                    <script>
                      let curFileObj = null;
                      const P = () => document.getElementById('pass').value || sessionStorage.rdp_pass || '';
                      function savePass() { sessionStorage.rdp_pass = document.getElementById('pass').value; }
                      if (sessionStorage.rdp_pass) document.getElementById('pass').value = sessionStorage.rdp_pass;

                      function showToast(msg) {
                        const t = document.getElementById('toast');
                        t.innerText = msg;
                        t.style.display = 'block';
                        clearTimeout(window._toastTimer);
                        window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2500);
                      }

                      async function api(path, method='GET', body=null) {
                        const p = P();
                        const sep = path.includes('?') ? '&' : '?';
                        const url = path + (p ? sep + 'pass=' + encodeURIComponent(p) : '');
                        const headers = {'x-admin-password': p, 'x-bot-secret': p};
                        if (body && !(body instanceof FormData)) headers['Content-Type'] = 'application/json';
                        const res = await fetch(url, {
                          method,
                          headers: (body instanceof FormData) ? {'x-admin-password': p, 'x-bot-secret': p} : headers,
                          body: (body instanceof FormData) ? body : (body ? JSON.stringify(body) : undefined)
                        });
                        return await res.json();
                      }

                      async function handleDrop(e) {
                        e.preventDefault();
                        document.getElementById('dropzone').classList.remove('hover');
                        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                          for (const f of e.dataTransfer.files) await uploadFileObject(f);
                        }
                      }

                      async function handleFileSelect(files) {
                        if (files && files.length) {
                          for (const f of files) await uploadFileObject(f);
                        }
                      }

                      async function uploadFileObject(file) {
                        if (!file) return;
                        showToast('⏳ Đang tải lên: ' + file.name + '...');
                        const formData = new FormData();
                        formData.append('file', file, file.name);
                        formData.append('secret', P());
                        try {
                          const r = await api('/api/rdp/upload-file', 'POST', formData);
                          if (r.ok) {
                            showToast('✅ Đã nhận file ' + file.name + ' thành công!');
                            loadFiles();
                          } else {
                            showToast('❌ Lỗi: ' + (r.error || 'Nạp file thất bại'));
                          }
                        } catch (err) {
                          showToast('❌ Lỗi kết nối: ' + err.message);
                        }
                      }

                      async function loadFiles() {
                        try {
                          const res = await api('/api/rdp/files');
                          if (!res.ok) {
                            document.querySelector('#tbl_files tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ef4444;padding:16px">Lỗi tải dữ liệu: ' + (res.error || 'Sai mật khẩu') + '</td></tr>';
                            return;
                          }
                          const files = res.files || [];
                          document.getElementById('stat_files').innerText = files.length;
                          const onlineCount = files.filter(f => f.isOnline).length;
                          document.getElementById('stat_online').innerText = onlineCount;
                          document.getElementById('stat_offline').innerText = files.length - onlineCount;
                          document.getElementById('stat_time').innerText = new Date().toLocaleTimeString('vi-VN');

                          if (!files.length) {
                            document.querySelector('#tbl_files tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:24px">Chưa nhận được file nào từ máy ảo. Hãy chạy máy ảo hoặc kéo thả file JSON vào khu vực bên trên!</td></tr>';
                            return;
                          }

                          document.querySelector('#tbl_files tbody').innerHTML = files.map(f => {
                            const sizeKb = f.size ? (f.size / 1024).toFixed(1) + ' KB' : '-';
                            const dateStr = f.receivedAt ? new Date(f.receivedAt).toLocaleString('vi-VN') : '-';
                            const onlineBadge = f.isOnline
                              ? '<span class="badge" style="background:#065f46;color:#a7f3d0">🟢 Online</span>'
                              : '<span class="badge" style="background:#7f1d1d;color:#fecaca">🔴 Offline</span>';
                            const hbAgo = f.secondsSinceHeartbeat != null ? (f.secondsSinceHeartbeat < 60 ? f.secondsSinceHeartbeat + 's trước' : Math.floor(f.secondsSinceHeartbeat / 60) + 'm trước') : '';
                            return \`<tr>
                              <td><b>\${f.fileName}</b><br><small style="color:#94a3b8">\${sizeKb}</small></td>
                              <td><span class="badge" style="background:#1e3a8a;color:#bfdbfe">\${f.machineId}</span></td>
                              <td><code>\${f.sessionId || '-'}</code></td>
                              <td><code>\${f.ip || '-'}</code><br><small><a href="http://\${f.ip}:8080" target="_blank" style="color:#38bdf8">Web 8080</a> | <a href="https://\${f.ip}:47990" target="_blank" style="color:#fbbf24">Sunshine</a></small></td>
                              <td><code>\${f.user || 'runneradmin'}</code><br><code>\${f.pass || '***'}</code></td>
                              <td>\${onlineBadge}<br><small style="color:#94a3b8">\${hbAgo}</small></td>
                              <td><small>\${dateStr}</small></td>
                              <td>
                                <button onclick="viewFile('\${f.machineId}','\${f.fileName}')" class="purple">👁️ Xem</button>
                                <button onclick="downloadFile('\${f.machineId}','\${f.fileName}')" class="green">⬇️ Tải</button>
                                <button onclick="copyPrompt('\${f.machineId}')">📋 Prompt</button>
                                <button onclick="deleteFile('\${f.machineId}','\${f.fileName}')" class="danger">🗑️</button>
                              </td>
                            </tr>\`;
                          }).join('');
                        } catch (err) {
                          document.querySelector('#tbl_files tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ef4444;padding:16px">Lỗi kết nối máy chủ: ' + err.message + '</td></tr>';
                        }
                      }

                      async function viewFile(mId, fName) {
                        const r = await api('/api/rdp/view-file?machine=' + encodeURIComponent(mId) + '&file=' + encodeURIComponent(fName));
                        if (r.ok) {
                          curFileObj = { name: r.fileName || fName, machine: mId, content: r.content };
                          document.getElementById('m_title').innerText = '📄 ' + curFileObj.name;
                          document.getElementById('m_body').innerText = typeof r.content === 'object' ? JSON.stringify(r.content, null, 2) : r.content;
                          document.getElementById('modal_view').classList.add('open');
                        } else {
                          alert('Không đọc được file: ' + (r.error || 'Thất bại'));
                        }
                      }

                      function closeModal() { document.getElementById('modal_view').classList.remove('open'); }

                      function copyModalJson() {
                        const txt = document.getElementById('m_body').innerText;
                        navigator.clipboard.writeText(txt);
                        showToast('📋 Đã copy toàn bộ JSON vào Clipboard!');
                      }

                      function downloadCurFile() {
                        if (curFileObj) downloadFile(curFileObj.machine, curFileObj.name);
                      }

                      function downloadFile(mId, fName) {
                        window.open('/api/rdp/download-file?machine=' + encodeURIComponent(mId) + '&file=' + encodeURIComponent(fName) + '&pass=' + encodeURIComponent(P()), '_blank');
                      }

                      async function copyPrompt(mId) {
                        const r = await api('/api/rdp/prompt?machine=' + encodeURIComponent(mId));
                        if (r.ok && r.prompt) {
                          navigator.clipboard.writeText(r.prompt);
                          showToast('📋 Đã copy Prompt của máy ' + mId + '!');
                        } else {
                          alert('Chưa có Prompt cho máy ' + mId);
                        }
                      }

                      async function deleteFile(mId, fName) {
                        if (!confirm('Bạn có chắc chắn muốn xóa file ' + fName + '?')) return;
                        const r = await api('/api/rdp/delete-file', 'POST', { machineId: mId, fileName: fName });
                        if (r.ok) {
                          showToast('🗑️ Đã xóa file thành công!');
                          loadFiles();
                        } else {
                          alert('Lỗi xóa: ' + (r.error || 'Thất bại'));
                        }
                      }

                      loadFiles();
                      setInterval(() => {
                        if (document.getElementById('autoRef').checked && !document.getElementById('modal_view').classList.contains('open')) {
                          loadFiles();
                        }
                      }, 5000);
                    </script></body></html>`);
                  }
                });
                return;
              }
              if (listener) return listener.call(this, req, res);
            };
            return opts ? origCreateServer.call(this, opts, wrapped) : origCreateServer.call(this, wrapped);
          };
          '@ | Set-Content -Path "rdp-bridge.js" -Encoding UTF8

          if (Test-Path "index.js") {
              $idxContent = Get-Content "index.js" -Raw
              if ($idxContent -notmatch "rdp-bridge\.js") {
                  $patchedIdx = "require('./rdp-bridge.js');`r`n" + $idxContent
                  [System.IO.File]::WriteAllText((Join-Path $PWD "index.js"), $patchedIdx, [System.Text.UTF8Encoding]::new($false))
                  Write-Host "✅ Đã gắn rdp-bridge.js vào index.js" -ForegroundColor Green
              }
          }

      # 4. MỞ FIREWALL CHO CỔNG
      - name: 🔓 Mở cổng firewall
        run: |
          netsh advfirewall firewall add rule name="BotApp-In" dir=in action=allow protocol=TCP localport=$env:APP_PORT profile=any

      # 5. TAILSCALE
      - name: 🌐 Thiết lập Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          Start-Sleep -Seconds 10

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=bot-cuadat-$env:GITHUB_RUN_ID --accept-routes --reset

          $ip = $null
          for ($i = 0; $i -lt 20; $i++) {
              $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1) | Select-Object -First 1
              if ($ip -match '^\d+\.\d+\.\d+\.\d+$') { break }
              Start-Sleep -Seconds 3
          }
          if ($ip -notmatch '^\d+\.\d+\.\d+\.\d+$') { $ip = "localhost" }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP: $ip" -ForegroundColor Green

      # 5b. TẢI & CÀI TIẾN TRÌNH DUCKDNS TRỎ IP VỀ datdemo.duckdns.org
      - name: 🦆 Cài đặt tiến trình DuckDNS & Trỏ IP về datdemo.duckdns.org
        shell: pwsh
        run: |
          $rawDomain = ("$env:DUCKDNS_DOMAIN").Trim().ToLower()
          if ([string]::IsNullOrWhiteSpace($rawDomain)) { $rawDomain = "datdemo.duckdns.org" }
          $subDomain = $rawDomain -replace '\.duckdns\.org$', ''
          "DUCKDNS_SUBDOMAIN=$subDomain" >> $env:GITHUB_ENV
          "DUCKDNS_FULL_DOMAIN=$subDomain.duckdns.org" >> $env:GITHUB_ENV

          # Tự động tìm DUCKDNS_TOKEN từ secret hoặc trong data.json nếu đã lưu trên web
          $duckToken = ("$env:DUCKDNS_TOKEN").Trim()
          if ([string]::IsNullOrWhiteSpace($duckToken) -and (Test-Path "app\data.json")) {
              try {
                  $dJson = Get-Content "app\data.json" -Raw | ConvertFrom-Json
                  if ($dJson.shared.rdp.duckdns.token) {
                      $duckToken = $dJson.shared.rdp.duckdns.token
                  }
              } catch {}
          }

          $duckDir = Join-Path $env:RUNNER_TEMP "duckdns"
          New-Item -ItemType Directory -Force -Path $duckDir | Out-Null
          $duckScript = Join-Path $duckDir "duckdns-updater.ps1"

          @'
          param(
              [string]$SubDomain,
              [string]$Token,
              [string]$IpMode,
              [string]$TailscaleIp,
              [switch]$Loop
          )
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          function Update-DuckDnsNow {
              $curTok = $Token
              if ([string]::IsNullOrWhiteSpace($curTok)) {
                  $dataFile = Join-Path $env:GITHUB_WORKSPACE "app\data.json"
                  if (Test-Path $dataFile) {
                      try {
                          $dj = Get-Content $dataFile -Raw | ConvertFrom-Json
                          if ($dj.shared.rdp.duckdns.token) { $curTok = $dj.shared.rdp.duckdns.token }
                      } catch {}
                  }
              }
              if ([string]::IsNullOrWhiteSpace($curTok)) {
                  Write-Host "⚠️ [DuckDNS] Chưa có DUCKDNS_TOKEN (thêm vào GitHub Secrets DUCKDNS_TOKEN hoặc dùng lệnh !may duck <token>)" -ForegroundColor Yellow
                  return
              }

              $targetIp = $TailscaleIp
              if ($IpMode -eq 'public' -or [string]::IsNullOrWhiteSpace($targetIp) -or $targetIp -eq 'localhost') {
                  try {
                      $targetIp = (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10).Trim()
                  } catch {
                      $targetIp = ""
                  }
              }

              $url = "https://www.duckdns.org/update?domains=$SubDomain&token=$curTok&ip=$targetIp&verbose=true"
              try {
                  $res = Invoke-RestMethod -Uri $url -Method Get -TimeoutSec 15
                  $lines = ($res -split "`r?`n")
                  Write-Host "🦆 [DuckDNS] Cập nhật $SubDomain.duckdns.org -> $targetIp : $($lines[0])" -ForegroundColor Green
              } catch {
                  Write-Host "⚠️ [DuckDNS] Lỗi cập nhật: $($_.Exception.Message)" -ForegroundColor Yellow
              }
          }

          Update-DuckDnsNow
          if ($Loop) {
              while ($true) {
                  Start-Sleep -Seconds 180
                  Update-DuckDnsNow
              }
          }
          '@ | Set-Content -Path $duckScript -Encoding UTF8

          # Chạy cập nhật ngay lập tức
          & pwsh.exe -NoProfile -File $duckScript -SubDomain $subDomain -Token $duckToken -IpMode $env:DUCKDNS_IP_MODE -TailscaleIp $env:TAILSCALE_IP
          # Khởi chạy tiến trình nền duy trì cập nhật DuckDNS mỗi 3 phút
          Start-Process pwsh.exe -ArgumentList "-NoProfile", "-WindowStyle", "Hidden", "-File", "`"$duckScript`"", "-SubDomain", $subDomain, "-Token", "`"$duckToken`"", "-IpMode", $env:DUCKDNS_IP_MODE, "-TailscaleIp", $env:TAILSCALE_IP, "-Loop"
          Write-Host "✅ Tiến trình nền DuckDNS ($subDomain.duckdns.org) đã khởi chạy!" -ForegroundColor Green

      # 6. CHẠY npm start + GIỮ PHIÊN + LƯU DỮ LIỆU ĐỊNH KỲ
      - name: ▶️ npm start & duy trì
        id: run
        env:
          PORT: ${{ inputs.port }}
          DURATION: ${{ inputs.duration }}
        run: |
          # --- Đổi "5h30m" / "3h" / "1h" thành số phút (mặc định 330 nếu không đọc được) ---
          $totalMinutes = 330
          if ($env:DURATION -match '^\s*(?:(\d+)h)?\s*(?:(\d+)m)?\s*$') {
              $h = if ($Matches[1]) { [int]$Matches[1] } else { 0 }
              $m = if ($Matches[2]) { [int]$Matches[2] } else { 0 }
              if (($h * 60 + $m) -gt 0) { $totalMinutes = $h * 60 + $m }
          }

          # --- Tính giờ kết thúc theo UTC từ lúc job bắt đầu (không lỗi khi qua nửa đêm) ---
          # Tối đa 335 phút vì job timeout = 340 phút
          $jobStart = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START)
          $endTime  = $jobStart.AddMinutes([math]::Min($totalMinutes, 335))

          # Hiển thị giờ Việt Nam kèm ngày
          try   { $tz = [TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time') }
          catch { $tz = [TimeZoneInfo]::Utc }
          function Format-Vn($t) { [TimeZoneInfo]::ConvertTime($t, $tz).ToString('dd/MM/yyyy HH:mm:ss') }

          $appDir = Join-Path $PWD "app"
          function Start-App {
              Start-Process -FilePath "npm.cmd" -ArgumentList "start" `
                  -WorkingDirectory $appDir `
                  -RedirectStandardOutput "$env:TEMP\app.out.log" `
                  -RedirectStandardError  "$env:TEMP\app.err.log" `
                  -PassThru
          }

          $proc = Start-App
          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "┌────────────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│ 🎉 BOT ĐANG CHẠY" -ForegroundColor Cyan
          Write-Host "│ 🌐 Truy cập IP     : http://$($env:TAILSCALE_IP):$($env:APP_PORT)" -ForegroundColor White
          Write-Host "│ 🦆 Truy cập DuckDNS: http://$($env:DUCKDNS_FULL_DOMAIN):$($env:APP_PORT)" -ForegroundColor Yellow
          Write-Host "│ 📥 Trang Nhận File : http://$($env:DUCKDNS_FULL_DOMAIN):$($env:APP_PORT)/rdp-files" -ForegroundColor Cyan
          Write-Host "│ 🎛️ Quản lý RDP/Git : http://$($env:DUCKDNS_FULL_DOMAIN):$($env:APP_PORT)/rdp-manager" -ForegroundColor Green
          Write-Host "│ 📡 Webhook nhận VM : http://$($env:DUCKDNS_FULL_DOMAIN):$($env:APP_PORT)/api/rdp/report" -ForegroundColor Green
          Write-Host "│ ⏰ Kết thúc        : $(Format-Vn $endTime) (giờ VN)" -ForegroundColor White
          Write-Host "└────────────────────────────────────────────────────────────┘" -ForegroundColor Cyan

          $saveEvery = [int]$env:SAVE_EVERY_MINUTES
          $lastLog  = [DateTimeOffset]::UtcNow
          $lastSave = [DateTimeOffset]::UtcNow
          while ([DateTimeOffset]::UtcNow -lt $endTime) {
              # Tự khởi động lại nếu app chết
              if ($proc.HasExited) {
                  Write-Host "[$(Format-Vn ([DateTimeOffset]::UtcNow))] ⚠️ App dừng, khởi động lại..." -ForegroundColor Yellow
                  $proc = Start-App
              }

              # In log app mỗi 60 giây
              if (([DateTimeOffset]::UtcNow - $lastLog).TotalSeconds -ge 60) {
                  Write-Host "----- log gần nhất -----" -ForegroundColor DarkGray
                  Get-Content "$env:TEMP\app.out.log" -Tail 10 -ErrorAction SilentlyContinue
                  Get-Content "$env:TEMP\app.err.log" -Tail 5  -ErrorAction SilentlyContinue
                  $left = [math]::Floor(($endTime - [DateTimeOffset]::UtcNow).TotalMinutes)
                  Write-Host "⏳ Còn khoảng $left phút | DuckDNS: $($env:DUCKDNS_FULL_DOMAIN) -> $($env:TAILSCALE_IP)" -ForegroundColor Blue
                  $lastLog = [DateTimeOffset]::UtcNow
              }

              # Lưu dữ liệu định kỳ
              if (([DateTimeOffset]::UtcNow - $lastSave).TotalMinutes -ge $saveEvery) {
                  & "$env:RUNNER_TEMP\sync.ps1" save
                  $lastSave = [DateTimeOffset]::UtcNow
              }

              Start-Sleep -Seconds 10
          }

          Write-Host "🎯 HẾT THỜI GIAN PHIÊN NÀY!" -ForegroundColor Red
          exit 0

      # 7. DỌN DẸP (dừng bot trước rồi mới lưu lần cuối để file không bị ghi dở)
      - name: 🧹 Dọn dẹp
        if: always()
        run: |
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          if (Test-Path "$env:RUNNER_TEMP\sync.ps1") {
              & "$env:RUNNER_TEMP\sync.ps1" save
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" down 2>$null
          netsh advfirewall firewall delete rule name="BotApp-In" 2>$null
          Write-Host "🎉 Dọn dẹp hoàn tất!" -ForegroundColor Green
          exit 0

      # 8. TỰ CHẠY LẠI PHIÊN MỚI (chỉ khi phiên vừa rồi chạy hết giờ bình thường, không phải bị hủy/lỗi)
      - name: 🔁 Kích hoạt phiên tiếp theo
        if: ${{ always() && inputs.auto_restart && steps.run.outcome == 'success' }}
        env:
          GH_REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
        run: |
          $wf = [System.IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])
          Write-Host "Chạy lại workflow: $wf (ref: $env:GITHUB_REF_NAME)"
          gh workflow run $wf --ref $env:GITHUB_REF_NAME -f duration=$env:DURATION -f port=$env:APP_PORT -f auto_restart=true -f duckdns_domain=$env:DUCKDNS_DOMAIN -f duckdns_ip_mode=$env:DUCKDNS_IP_MODE
          if ($LASTEXITCODE -ne 0) { throw "Không kích hoạt được phiên mới" }
          Write-Host "✅ Đã kích hoạt phiên tiếp theo" -ForegroundColor Green
