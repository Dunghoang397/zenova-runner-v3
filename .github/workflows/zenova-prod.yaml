name: rdp treo 24/24 lưu ổ C

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng (tính từ lúc job bắt đầu)'
        required: false
        default: '5h00m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h00m'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới sau khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt để chứa toàn bộ Hệ Điều Hành & Dữ Liệu'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo VHDX tối đa (GB - co giãn động)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows (GIỮ CỐ ĐỊNH giữa các phiên để app không lỗi)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: '🔐 Mật khẩu cố định cho cả RDP (runneradmin) & Sunshine Web UI'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo mặc định cho Sunshine'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'
      choco_packages:
        description: '📦 App cài thêm bằng choco (tự động lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu Windows (múi giờ VN, tắt sleep, tắt Update/Defender realtime, giữ phiên RDP)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS trỏ về IP Tailscale (cần secret DUCKDNS_TOKEN + DUCKDNS_DOMAIN)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-stv-premium-github-drive-rdp
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 'aistv-persistent-os-storage'
      STATE_BRANCH: 'aistv-drive-state'
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'

    steps:
      # ───────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG X:\ & LẤY USER GỐC (RUNNERADMIN)
      # ───────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng X:\ & Chuẩn bị thông số User gốc
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          $total = 300;
          $display = '5 giờ 00 phút';
          if ("$env:INPUT_DURATION" -eq '1h') {
              $total = 60;
              $display = '1 giờ';
          } elseif ("$env:INPUT_DURATION" -eq '3h') {
              $total = 180;
              $display = '3 giờ';
          }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV";
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV";

          $user     = "$env:USERNAME";
          $profPath = "$env:USERPROFILE";
          "RDP_USER=$user" >> "$env:GITHUB_ENV";
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV";

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) {
              $dl = 'X';
          }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV";

          $vhdContainer = 'C:\AISTV-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'aistv-os-disk.vhdx');

          $sizeBytes = ([int64]"$env:VHD_SIZE_GB") * 1GB;
          Write-Host "💽 Đang dựng ổ đĩa riêng ${dl}:\ ($env:VHD_SIZE_GB GB Dynamic VHDX)..." -ForegroundColor Cyan;
          $mounted = $false;
          try {
              if (-not (Test-Path "$vhdFile")) {
                  New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'AISTV-OS' -Confirm:($false) | Out-Null;
              } else {
                  Mount-VHD -Path "$vhdFile";
              }
              $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
              if (Test-Path "${dl}:\") {
                  $mounted = $true;
              }
          } catch {
              Write-Host "⚠️ Chuyển sang cơ chế Ổ Đĩa Ảo Kernel DOS Devices cho ${dl}:\..." -ForegroundColor Yellow;
          }

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null;
              & subst "${dl}:" "$fallbackDir";
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force;
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\AISTV-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY";
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json";
          $profileStoreRoot = "$sharedRoot\Users";
          $baselineFile     = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json');
          $controlSignal    = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'aistv-control-action.txt');

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null;
          };

          $baseline = @{
              PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PD   = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
          };
          $baseline | ConvertTo-Json -Depth 4 | Set-Content -Path "$baselineFile" -Encoding UTF8;

          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV";
          "VHD_FILE=$vhdFile" >> "$env:GITHUB_ENV";
          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV";
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV";
          "SHARED_OS_DIR=$sharedOsDir" >> "$env:GITHUB_ENV";
          "SHARED_STATE_FILE=$sharedStateFile" >> "$env:GITHUB_ENV";
          "PROFILE_ROOT=$profileStoreRoot" >> "$env:GITHUB_ENV";
          "BASELINE_FILE=$baselineFile" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$controlSignal" >> "$env:GITHUB_ENV";

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild;
          "OS_BUILD=$build" >> "$env:GITHUB_ENV";

          $null = gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "ℹ️ Tạo kho lưu trữ Release [$env:RELEASE_TAG] trên GitHub..." -ForegroundColor Cyan;
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt');
              Set-Content -Path "$dummy" -Value "AI-STV Persistent Storage Initialized" -Encoding UTF8;
              gh release create "$env:RELEASE_TAG" "$dummy" --repo "$env:GH_REPO" --title "AI-STV Persistent OS Drive" --notes "Kho lưu trữ ổ đĩa tự động giữa các phiên (Không xóa)";
          }
          $global:LASTEXITCODE = 0;
          Write-Host "✅ Đã mount ổ đĩa ${dl}:\ ($sharedRoot) | User gốc: $user ($profPath)" -ForegroundColor Green;

      # ───────────────────────────────────────────────
      # 1.5. ĐẢM BẢO CÓ 7-ZIP TRONG PATH
      # ───────────────────────────────────────────────
      - name: 📦 Đảm bảo có 7-Zip (tránh lỗi '7z not recognized')
        shell: pwsh
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe';
          if (-not (Test-Path "$sevenZip")) {
              Write-Host "📦 Cài đặt 7-Zip..." -ForegroundColor Cyan;
              choco install 7zip -y --no-progress --limit-output --ignore-checksums;
              $global:LASTEXITCODE = 0;
          }
          if (Test-Path "$sevenZip") {
              "SEVEN_ZIP_EXE=$sevenZip" >> "$env:GITHUB_ENV";
              $curPath = "$env:Path";
              if ("$curPath" -notlike "*7-Zip*") {
                  "Path=C:\Program Files\7-Zip;$curPath" >> "$env:GITHUB_ENV";
              }
              Write-Host "✅ 7-Zip sẵn sàng: $sevenZip" -ForegroundColor Green;
          } else {
              Write-Host "❌ Không cài được 7-Zip!" -ForegroundColor Red;
              exit 1;
          }
          exit 0;

      # ───────────────────────────────────────────────
      # 2. TẠO ENGINE ĐỒNG BỘ Ổ ĐĨA LÊN GITHUB
      # ───────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & đẩy toàn bộ ổ đĩa lên GitHub
        shell: pwsh
        run: |
          $scriptLines = @(
              'param([string]$Reason = "session-end")',
              '$ErrorActionPreference = "Continue";',
              'if (("$env:DATA_RESTORED" -ne "1") -or ("$env:SESSION_READY" -ne "1")) {',
              '    Write-Host "⚠️ Phiên chưa khởi tạo hoàn chỉnh, bỏ qua lưu để bảo vệ dữ liệu gốc trên GitHub" -ForegroundColor Yellow;',
              '    exit 0;',
              '}',
              '$root  = "$env:SHARED_ROOT";',
              '$osDir = "$env:SHARED_OS_DIR";',
              '$dl    = "$env:MOUNT_LETTER";',
              'if ((-not ("$root")) -or (-not (Test-Path "$root"))) {',
              '    Write-Host "ℹ️ Chưa thấy ổ đĩa chung, bỏ qua";',
              '    exit 0;',
              '}',
              'Write-Host "💾 [$Reason] Đang đóng an toàn các trình duyệt & ứng dụng (bao gồm StarDesk) để nhả khóa file Cookie/Session..." -ForegroundColor Cyan;',
              '$appsToClose = @("chrome", "msedge", "brave", "firefox", "coccoc", "opera", "vivaldi", "discord", "Telegram", "Zalo", "steam", "EpicGamesLauncher", "Spotify", "Code", "Notion", "StarDesk");',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | ForEach-Object {',
              '    $null = $_.CloseMainWindow();',
              '};',
              'Start-Sleep -Seconds 3;',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              'if ("$Reason" -eq "session-end") {',
              '    Get-Service -Name "*StarDesk*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;',
              '    Get-Process -Name "StarDesk*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              '    & taskkill.exe /F /IM "StarDesk*" /T *> $null;',
              '}',
              'Start-Sleep -Seconds 2;',
              '',
              'Write-Host "🔑 [$Reason] Đang giải mã khóa DPAPI (Local State) để di chuyển phiên đăng nhập sang máy mới..." -ForegroundColor Cyan;',
              'Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue;',
              '$u = "$env:RDP_USER";',
              '$profSrc = "$env:PROFILE_PATH";',
              'if (("$profSrc") -and (Test-Path "$profSrc\AppData")) {',
              '    Get-ChildItem -Path "$profSrc\AppData" -Filter "Local State" -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {',
              '        try {',
              '            $lsFile = $_.FullName;',
              '            $lsJson = Get-Content -Raw -Path "$lsFile" -Encoding UTF8 | ConvertFrom-Json;',
              '            if ($lsJson.os_crypt -and $lsJson.os_crypt.encrypted_key) {',
              '                $encBytes = [Convert]::FromBase64String($lsJson.os_crypt.encrypted_key);',
              '                if ($encBytes.Length -gt 5) {',
              '                    $prefix = [System.Text.Encoding]::ASCII.GetString($encBytes[0..4]);',
              '                    if ($prefix -eq "DPAPI") {',
              '                        $cipher = $encBytes[5..($encBytes.Length - 1)];',
              '                        $rawKey = [System.Security.Cryptography.ProtectedData]::Unprotect($cipher, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser);',
              '                        [Convert]::ToBase64String($rawKey) | Set-Content -Path "$lsFile.aistvkey" -Encoding ASCII -Force;',
              '                    }',
              '                }',
              '            }',
              '        } catch {}',
              '    };',
              '}',
              '',
              'Write-Host "💾 [$Reason] Đang thu thập trạng thái Hệ Điều Hành, Registry, MachineGuid, Display, Audio, Sunshine, Profile gốc & App..." -ForegroundColor Cyan;',
              '$regBk = [System.IO.Path]::Combine("$osDir", "Registry");',
              'New-Item -ItemType Directory -Force -Path "$regBk" | Out-Null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null;',
              'reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x86.reg" /y *> $null;',
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Cryptography" "$regBk\Machine-Cryptography.reg" /y *> $null;',
              'reg export "HKLM\SOFTWARE\Microsoft\SQMClient" "$regBk\Machine-SQMClient.reg" /y *> $null;',
              'New-Item -ItemType Directory -Force -Path "$regBk\AppSoftware" | Out-Null;',
              'Get-ChildItem "HKCU:\Software" -ErrorAction SilentlyContinue | Where-Object {',
              '    $_.PSChildName -notin @("Microsoft", "Classes", "Policies", "RegisteredApplications")',
              '} | ForEach-Object {',
              '    $subName = $_.PSChildName;',
              '    $safeName = ($subName -replace ''[^A-Za-z0-9._\-]'', ''_'');',
              '    reg export "HKCU\Software\$subName" "$regBk\AppSoftware\App-$safeName.reg" /y *> $null;',
              '};',
              'reg export "HKCU\Environment" "$regBk\User-Env.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" "$regBk\User-StartupRun.reg" /y *> $null;',
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\Configuration" "$regBk\Display-Config.reg" /y *> $null;',
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\Connectivity" "$regBk\Display-Conn.reg" /y *> $null;',
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers\ScaleFactors" "$regBk\Display-Scale.reg" /y *> $null;',
              'reg export "HKCU\Control Panel\Desktop" "$regBk\User-Desktop.reg" /y *> $null;',
              'reg export "HKCU\Control Panel\Desktop\WindowMetrics" "$regBk\User-WindowMetrics.reg" /y *> $null;',
              'reg export "HKCU\Control Panel\Personalization" "$regBk\User-Personalization.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" "$regBk\User-Themes.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" "$regBk\User-Wallpapers.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" "$regBk\User-Explorer.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Multimedia\Audio" "$regBk\User-Audio.reg" /y *> $null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio" "$regBk\System-MMDevices-Audio.reg" /y *> $null;',
              '$drvBk = [System.IO.Path]::Combine("$osDir", "Drivers-Backup");',
              'if (Test-Path "$drvBk") { Remove-Item -Path "$drvBk" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'if (("$u") -and ("$profSrc") -and (Test-Path "$profSrc")) {',
              '    $profDst = [System.IO.Path]::Combine("$root", "Users", "$u");',
              '    New-Item -ItemType Directory -Force -Path "$profDst" | Out-Null;',
              '    $excludeDirs = @(',
              '        "$profSrc\AppData\Roaming\Microsoft\Protect",',
              '        "$profSrc\AppData\Roaming\Microsoft\Crypto",',
              '        "$profSrc\AppData\Local\Microsoft\Credentials",',
              '        "$profSrc\AppData\Roaming\Microsoft\Credentials",',
              '        "$profSrc\AppData\Local\Temp",',
              '        "$profSrc\AppData\Local\Packages",',
              '        "$profSrc\AppData\Local\TileDataLayer",',
              '        "$profSrc\AppData\Local\ConnectedDevicesPlatform",',
              '        "$profSrc\AppData\Local\Microsoft\Windows\Explorer",',
              '        "$profSrc\AppData\Local\Microsoft\Windows\INetCache",',
              '        "$profSrc\AppData\Local\Microsoft\Windows\WebCache",',
              '        "$profSrc\AppData\Local\Microsoft\Windows\Caches",',
              '        "$profSrc\AppData\Local\D3DSCache",',
              '        "$profSrc\AppData\Local\NuGet",',
              '        "$profSrc\AppData\Local\Package Cache",',
              '        "$profSrc\AppData\Local\CrashDumps",',
              '        "$profSrc\AppData\Local\pip",',
              '        "$profSrc\AppData\Local\npm-cache",',
              '        "$profSrc\AppData\Local\yarn",',
              '        "$profSrc\AppData\Local\go-build",',
              '        "$profSrc\AppData\Local\ms-playwright",',
              '        "$profSrc\AppData\Local\Cypress",',
              '        "$profSrc\.dotnet",',
              '        "$profSrc\.nuget",',
              '        "$profSrc\.m2",',
              '        "$profSrc\.cargo",',
              '        "$profSrc\.rustup",',
              '        "$profSrc\.templateengine",',
              '        "$profSrc\.azure",',
              '        "$profSrc\.ServiceHub",',
              '        "$profSrc\vcpkg"',
              '    );',
              '    robocopy "$profSrc" "$profDst" /MIR /XJ /R:2 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* WebCacheV01.dat parent.lock lockfile SingletonLock SingletonCookie SingletonSocket /XD @excludeDirs *> $null;',
              '    $global:LASTEXITCODE = 0;',
              '}',
              'if (("$env:BASELINE_FILE") -and (Test-Path "$env:BASELINE_FILE")) {',
              '    try {',
              '        $base = Get-Content -Raw -Path "$env:BASELINE_FILE" | ConvertFrom-Json;',
              '        $skipNames = @("Tailscale", "chocolatey", "Package Cache", "Microsoft", "Windows Defender");',
              '        $cOverlay = [System.IO.Path]::Combine("$osDir", "C-Drive-Overlay");',
              '        New-Item -ItemType Directory -Force -Path "$cOverlay\PF64" | Out-Null;',
              '        New-Item -ItemType Directory -Force -Path "$cOverlay\PF86" | Out-Null;',
              '        New-Item -ItemType Directory -Force -Path "$cOverlay\PD" | Out-Null;',
              '        Get-ChildItem "C:\Program Files" -Directory -Force -ErrorAction SilentlyContinue | Where-Object {',
              '            ($_.Name -notin ($base.PF64)) -and ($_.Name -notin ($skipNames))',
              '        } | ForEach-Object {',
              '            $dest = [System.IO.Path]::Combine("$cOverlay\PF64", $_.Name);',
              '            robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '        };',
              '        Get-ChildItem "C:\Program Files (x86)" -Directory -Force -ErrorAction SilentlyContinue | Where-Object {',
              '            ($_.Name -notin ($base.PF86)) -and ($_.Name -notin ($skipNames))',
              '        } | ForEach-Object {',
              '            $dest = [System.IO.Path]::Combine("$cOverlay\PF86", $_.Name);',
              '            robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '        };',
              '        Get-ChildItem "C:\ProgramData" -Directory -Force -ErrorAction SilentlyContinue | Where-Object {',
              '            ($_.Name -notin ($base.PD)) -and ($_.Name -notin ($skipNames))',
              '        } | ForEach-Object {',
              '            $dest = [System.IO.Path]::Combine("$cOverlay\PD", $_.Name);',
              '            robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '        };',
              '    } catch {}',
              '}',
              'try {',
              '    $extraRoot = [System.IO.Path]::Combine("$osDir", "DriveRoot-Extra");',
              '    New-Item -ItemType Directory -Force -Path "$extraRoot" | Out-Null;',
              '    Get-ChildItem "${dl}:\" -Force -ErrorAction SilentlyContinue | Where-Object {',
              '        $_.Name -notin @("AISTV-SYSTEM", "System Volume Information", "$RECYCLE.BIN", "Pagefile.sys")',
              '    } | ForEach-Object {',
              '        $dest = [System.IO.Path]::Combine("$extraRoot", $_.Name);',
              '        if ($_.PSIsContainer) {',
              '            robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '        } else {',
              '            Copy-Item -Path ($_.FullName) -Destination "$dest" -Force -ErrorAction SilentlyContinue;',
              '        }',
              '    };',
              '} catch {}',
              '$global:LASTEXITCODE = 0;',
              '$stateFile = "$env:SHARED_STATE_FILE";',
              'if (("$stateFile") -and (Test-Path "$stateFile")) {',
              '    try {',
              '        $st = Get-Content -Raw -Path "$stateFile" | ConvertFrom-Json;',
              '        $st.lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString("o");',
              '        $st | ConvertTo-Json -Depth 5 | Set-Content -Path "$stateFile" -Encoding UTF8;',
              '    } catch {}',
              '}',
              '$gitStage = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "git-state-sync");',
              'try {',
              '    if (Test-Path "$gitStage") {',
              '        Remove-Item -Path "$gitStage" -Recurse -Force -ErrorAction SilentlyContinue;',
              '    }',
              '    New-Item -ItemType Directory -Force -Path "$gitStage" | Out-Null;',
              '    Push-Location "$gitStage";',
              '    git init -q;',
              '    git config user.name "AI-STV-Bot";',
              '    git config user.email "bot@aistv.local";',
              '    git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GH_REPO).git";',
              '    git fetch origin "$env:STATE_BRANCH" -q 2>$null;',
              '    if (($LASTEXITCODE) -eq 0) {',
              '        git checkout -B "$env:STATE_BRANCH" "origin/$env:STATE_BRANCH" -q;',
              '    } else {',
              '        git checkout --orphan "$env:STATE_BRANCH" -q;',
              '    }',
              '    robocopy "$env:SHARED_SESSION_DIR" "$gitStage\sessions" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null;',
              '    robocopy "$regBk" "$gitStage\registry" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null;',
              '    $global:LASTEXITCODE = 0;',
              '    git add -A;',
              '    git commit -m "Sync session state [$Reason]" -q 2>$null;',
              '    git push -u origin "$env:STATE_BRANCH" --force -q 2>$null;',
              '    Pop-Location;',
              '    Write-Host "✅ [$Reason] Đã lưu state & registry lên nhánh Git ($env:STATE_BRANCH)" -ForegroundColor Green;',
              '} catch {',
              '    if (((Get-Location).Path) -eq "$gitStage") { Pop-Location; }',
              '}',
              '$packDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "gh-pack-$Reason");',
              'if (Test-Path "$packDir") {',
              '    Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue;',
              '}',
              'New-Item -ItemType Directory -Force -Path "$packDir" | Out-Null;',
              '$archiveBase = [System.IO.Path]::Combine("$packDir", "aistv-drive.7z");',
              'Write-Host "📦 [$Reason] Đang nén toàn bộ ổ đĩa $root (đa luồng, đọc cả file đang mở)..." -ForegroundColor Cyan;',
              'Push-Location "$root";',
              '$sevenZipExe = "$env:SEVEN_ZIP_EXE";',
              'if ((-not ("$sevenZipExe")) -or (-not (Test-Path "$sevenZipExe"))) {',
              '    if (Test-Path "C:\Program Files\7-Zip\7z.exe") { $sevenZipExe = "C:\Program Files\7-Zip\7z.exe" } else { $sevenZipExe = "7z" }',
              '}',
              '$sevenZipArgs = @("a", "-t7z", "-mx=1", "-mmt=on", "-ssw", "-v1900m", "$archiveBase", "*", "-xr!Pagefile.sys", "-xr!swapfile.sys", "-xr!System Volume Information");',
              '& "$sevenZipExe" @sevenZipArgs *> $null;',
              '$sevenZipCode = $LASTEXITCODE;',
              'Pop-Location;',
              '$chunks = @(Get-ChildItem -Path "$packDir" -Filter "aistv-drive.7z.*" | Sort-Object Name);',
              'if (($chunks.Count) -eq 0) {',
              '    Write-Host "❌ [$Reason] Không tạo được gói nén ổ đĩa (mã 7z: $sevenZipCode)" -ForegroundColor Red;',
              '    exit 1;',
              '}',
              '$manifest = [ordered]@{',
              '    updatedUtc = (Get-Date).ToUniversalTime().ToString("o");',
              '    reason     = "$Reason";',
              '    osBuild    = "$env:OS_BUILD";',
              '    chunkCount = $chunks.Count;',
              '    chunks     = @($chunks | ForEach-Object { [ordered]@{ name = $_.Name; size = $_.Length } });',
              '};',
              '$manifestPath = [System.IO.Path]::Combine("$packDir", "drive-manifest.json");',
              '$manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "$manifestPath" -Encoding UTF8;',
              'Write-Host "⬆️  [$Reason] Đang tải $($chunks.Count) mảnh ổ đĩa lên GitHub Release ($env:RELEASE_TAG)..." -ForegroundColor Cyan;',
              '$uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @("$manifestPath");',
              'gh release upload "$env:RELEASE_TAG" @uploadFiles --repo "$env:GH_REPO" --clobber;',
              'if (($LASTEXITCODE) -ne 0) {',
              '    Write-Host "❌ [$Reason] Upload lên GitHub Release thất bại" -ForegroundColor Red;',
              '    Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue;',
              '    exit 1;',
              '}',
              'try {',
              '    $relJson = gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" --json assets | ConvertFrom-Json;',
              '    $validNames = @($chunks.Name) + @("drive-manifest.json", "init.txt");',
              '    @($relJson.assets) | ForEach-Object {',
              '        if (($_.name -like "aistv-drive.7z.*") -and ($_.name -notin ($validNames))) {',
              '            gh release delete-asset "$env:RELEASE_TAG" ($_.name) --repo "$env:GH_REPO" -y *> $null;',
              '        }',
              '    };',
              '} catch {}',
              'Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue;',
              'Write-Host "✅ [$Reason] Đã lưu trọn vẹn toàn bộ ổ đĩa lên GitHub!" -ForegroundColor Green;',
              'exit 0;'
          );
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1');
          Set-Content -Path "$saveScriptPath" -Value ($scriptLines -join "`r`n") -Encoding UTF8;
          Write-Host '✅ Đã tạo save-data.ps1' -ForegroundColor Green;

      # ───────────────────────────────────────────────
      # 3. KHÔI PHỤC TOÀN BỘ Ổ ĐĨA & PROFILE GỐC TỪ GITHUB
      # ───────────────────────────────────────────────
      - name: ♻️ Khôi phục toàn bộ ổ đĩa & nạp thẳng vào User gốc
        shell: pwsh
        run: |
          $dl = "$env:MOUNT_LETTER";

          @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
          ) | ForEach-Object {
              New-Item -Path "$_" -Force | Out-Null;
              Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force;
          };

          $fixedHost = 'AISTV-CLOUD-PC';
          New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Force | Out-Null;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Force | Out-Null;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'Hostname' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'NV Hostname' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") {
              Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue;
          }
          New-Item -ItemType Directory -Force -Path "$dlDir" | Out-Null;

          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "ℹ️ Chưa có manifest (phiên khởi tạo đầu tiên) — bỏ qua tải." -ForegroundColor Cyan;
          }
          $global:LASTEXITCODE = 0;
          $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');

          if (-not (Test-Path "$manifestFile")) {
              Write-Host "ℹ️ Chưa có bản lưu ổ đĩa trên GitHub - đây là phiên khởi tạo đầu tiên!" -ForegroundColor Cyan;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              exit 0;
          }

          $manifest = Get-Content -Raw -Path "$manifestFile" | ConvertFrom-Json;
          Write-Host "⬇️  Phát hiện ổ đĩa từ phiên trước ($($manifest.chunkCount) mảnh, cập nhật lúc $($manifest.updatedUtc)). Đang tải về..." -ForegroundColor Cyan;

          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'aistv-drive.7z.*' --dir "$dlDir";
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "❌ Lỗi tải các mảnh ổ đĩa từ GitHub Release. Dừng phiên để bảo vệ dữ liệu gốc!" -ForegroundColor Red;
              exit 1;
          }

          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'aistv-drive.7z.001');
          if (-not (Test-Path "$firstChunk")) {
              Write-Host "❌ Thiếu mảnh ghép đầu tiên (aistv-drive.7z.001)!" -ForegroundColor Red;
              exit 1;
          }

          $stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", 'restore-stage');
          if (Test-Path "$stage") {
              Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;
          }
          New-Item -ItemType Directory -Force -Path "$stage" | Out-Null;

          Write-Host "📂 Đang bung toàn bộ ổ đĩa vào ${dl}:\..." -ForegroundColor Cyan;
          $sevenZipExe = "$env:SEVEN_ZIP_EXE";
          if ((-not ("$sevenZipExe")) -or (-not (Test-Path "$sevenZipExe"))) {
              if (Test-Path "C:\Program Files\7-Zip\7z.exe") { $sevenZipExe = "C:\Program Files\7-Zip\7z.exe" } else { $sevenZipExe = "7z" }
          }
          & "$sevenZipExe" x "$firstChunk" "-o$stage" -y -mmt=on *> $null;
          Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue;

          $stateHit = Get-ChildItem -Path "$stage" -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -Force -ErrorAction SilentlyContinue | Select-Object -First 1;
          $sourceRoot = "$stage";
          if ($stateHit) {
              $sourceRoot = $stateHit.Directory.Parent.FullName;
          }

          robocopy "$sourceRoot" "$env:SHARED_ROOT" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
          $global:LASTEXITCODE = 0;
          New-Item -ItemType Directory -Force -Path "$env:SHARED_DATA_DIR" | Out-Null;

          $drvBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Drivers-Backup');
          if (Test-Path "$drvBk") {
              Remove-Item -Path "$drvBk" -Recurse -Force -ErrorAction SilentlyContinue;
          }

          $extraRoot = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'DriveRoot-Extra');
          if (Test-Path "$extraRoot") {
              robocopy "$extraRoot" "${dl}:\" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
              $global:LASTEXITCODE = 0;
          }

          $cOverlay = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'C-Drive-Overlay');
          if (Test-Path "$cOverlay\PF64") {
              robocopy "$cOverlay\PF64" 'C:\Program Files' /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
          }
          if (Test-Path "$cOverlay\PF86") {
              robocopy "$cOverlay\PF86" 'C:\Program Files (x86)' /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
          }
          if (Test-Path "$cOverlay\PD") {
              robocopy "$cOverlay\PD" 'C:\ProgramData' /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
          }
          $global:LASTEXITCODE = 0;

          $oldProf = [System.IO.Path]::Combine("$env:SHARED_ROOT", 'Users', "$env:RDP_USER");
          if (-not (Test-Path "$oldProf")) {
              $fallbackProf = Get-ChildItem -Path "$env:PROFILE_ROOT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1;
              if ($fallbackProf) {
                  $oldProf = $fallbackProf.FullName;
              }
          }
          if (Test-Path "$oldProf") {
              @(
                  "$oldProf\AppData\Roaming\Microsoft\Protect",
                  "$oldProf\AppData\Roaming\Microsoft\Crypto",
                  "$oldProf\AppData\Local\Microsoft\Credentials",
                  "$oldProf\AppData\Roaming\Microsoft\Credentials"
              ) | ForEach-Object {
                  if (Test-Path "$_") {
                      Remove-Item -Path "$_" -Recurse -Force -ErrorAction SilentlyContinue;
                  }
              };

              $skipRestoreDirs = @(
                  "$oldProf\AppData\Roaming\Microsoft\Protect",
                  "$oldProf\AppData\Roaming\Microsoft\Crypto",
                  "$oldProf\AppData\Local\Microsoft\Credentials",
                  "$oldProf\AppData\Roaming\Microsoft\Credentials",
                  "$oldProf\AppData\Local\Packages",
                  "$oldProf\AppData\Local\TileDataLayer",
                  "$oldProf\AppData\Local\ConnectedDevicesPlatform",
                  "$oldProf\AppData\Local\Microsoft\Windows\Explorer"
              );
              robocopy "$oldProf" "$env:PROFILE_PATH" /E /XJ /COPY:DAT /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* parent.lock lockfile SingletonLock SingletonCookie SingletonSocket /XD @skipRestoreDirs *> $null;
              $global:LASTEXITCODE = 0;
              Write-Host "✅ Đã nạp thẳng dữ liệu Profile cũ vào User gốc ($env:PROFILE_PATH)" -ForegroundColor Green;
          } else {
              Write-Host "ℹ️ Chưa có bản lưu Profile trong ổ ${dl}:\" -ForegroundColor Yellow;
          }
          Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;

          $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry');
          if (Test-Path "$regBk") {
              Get-ChildItem -Path "$regBk" -Filter '*.reg' -Recurse | ForEach-Object {
                  reg import ($_.FullName) *>$null;
              };
              & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True;
              Write-Host "✅ Đã nạp lại Registry hệ thống, MachineGuid, HKCU\Software, Hình nền & Cài đặt Windows" -ForegroundColor Green;
          }

          if (Test-Path "$env:SHARED_STATE_FILE") {
              try {
                  $state = Get-Content -Raw -Path "$env:SHARED_STATE_FILE" | ConvertFrom-Json;
                  if ($state.password) {
                      "RESTORE_PASS=$($state.password)" >> "$env:GITHUB_ENV";
                      Write-Host "✅ Đã khôi phục mật khẩu phiên trước" -ForegroundColor Green;
                  }
                  if (($state.osBuild) -and ("$($state.osBuild)" -ne "$env:OS_BUILD")) {
                      Write-Host "⚠️ Bản Windows khác phiên trước (trước: $($state.osBuild), nay: $env:OS_BUILD). Hãy chọn đúng windows_image." -ForegroundColor Yellow;
                  }
              } catch {}
          }

          'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
          Write-Host "✅ Khôi phục toàn bộ ổ đĩa từ GitHub hoàn tất!" -ForegroundColor Green;
          exit 0;

      # ───────────────────────────────────────────────
      # 4. ÁNH XẠ HỆ ĐIỀU HÀNH SANG Ổ RIÊNG & BANNER
      # ───────────────────────────────────────────────
      - name: 🔗 Gắn kết thư mục Hệ Điều Hành & Phần Mềm sang ổ riêng
        shell: pwsh
        run: |
          $osDir      = "$env:SHARED_OS_DIR";
          $appsDir    = [System.IO.Path]::Combine("$osDir", 'InstalledApps');
          $binDir     = [System.IO.Path]::Combine("$osDir", 'bin');
          $chocoCache = [System.IO.Path]::Combine("$osDir", 'choco-cache');
          $instCache  = [System.IO.Path]::Combine("$osDir", 'Installers');
          $sunCfgDir  = [System.IO.Path]::Combine("$osDir", 'Sunshine-Config');
          $dl         = "$env:MOUNT_LETTER";

          @("$appsDir", "$binDir", "$chocoCache", "$instCache", "$sunCfgDir", "${dl}:\Apps") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null;
          };

          if (-not (Test-Path 'C:\AISTV-Apps')) {
              New-Item -ItemType Junction -Path 'C:\AISTV-Apps' -Target "$appsDir" -Force | Out-Null;
          }

          $sysEnv  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment';
          $curPath = (Get-ItemProperty -Path "$sysEnv" -Name 'Path').Path;
          if ("$curPath" -notlike "*$binDir*") {
              Set-ItemProperty -Path "$sysEnv" -Name 'Path' -Value "$binDir;$curPath" -Force;
          }

          "INSTALLER_CACHE=$instCache" >> "$env:GITHUB_ENV";
          "SUNSHINE_PERSIST_CFG=$sunCfgDir" >> "$env:GITHUB_ENV";

          Write-Host "";
          Write-Host "🤖 AI STV PREMIUM RDP + SUNSHINE SERVER (NATIVE RUNNERADMIN)" -ForegroundColor Yellow;
          Write-Host "🗂️ Ổ đĩa riêng: ${dl}:\ ($env:SHARED_ROOT)" -ForegroundColor Cyan;
          Write-Host "👤 User gốc: $env:RDP_USER ($env:PROFILE_PATH)" -ForegroundColor Cyan;
          Write-Host "🕒 Thời gian: $env:DISPLAY_TIME" -ForegroundColor Magenta;

      # ───────────────────────────────────────────────
      # 5. CẤU HÌNH RDP, MỞ PORT SUNSHINE / WEB & TỐI ƯU WINDOWS
      # ───────────────────────────────────────────────
      - name: 🔧 CẤU HÌNH HỆ THỐNG & FIREWALL (RDP + SUNSHINE + WEB)
        shell: pwsh
        run: |
          Write-Host "";
          Write-Host "🛠️  ĐANG CẤU HÌNH HỆ THỐNG RDP, SUNSHINE & WEB PANEL" -ForegroundColor Yellow;

          # ✅ FIX QUAN TRỌNG: Khôi phục quyền Users trên ổ C — nguyên nhân gốc khiến RDP ngắt sau khi nhập mật khẩu
          try {
              Write-Host "│ 🔐 Đang khôi phục quyền Users trên ổ C (RDPidd.dll cần quyền này để RDP không bị ngắt)..." -ForegroundColor Cyan;
              & icacls "C:\" /grant "Users:(OI)(CI)(RX)" /T /C /Q *> $null;
              Write-Host "│ ✅ Đã khôi phục quyền Users trên ổ C" -ForegroundColor Green;
          } catch {
              Write-Host "│ ⚠️  Không thể khôi phục quyền Users: $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          # ✅ FIX: Vô hiệu hóa tăng tốc phần cứng RDP — tránh xung đột với màn hình ảo usbmmidd_v2
          try {
              $rdpKey = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp";
              Set-ItemProperty -Path $rdpKey -Name "EnableHardwareMode" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
              $tsPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services";
              New-Item -Path $tsPolicy -Force | Out-Null;
              Set-ItemProperty -Path $tsPolicy -Name "UseWDDMGraphicsDisplayDriverForRemoteDesktopConnections" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
              Write-Host "│ ✅ Đã vô hiệu hóa tăng tốc phần cứng RDP (tránh xung đột màn hình ảo)" -ForegroundColor Green;
          } catch {
              Write-Host "│ ⚠️  Không thể vô hiệu hóa tăng tốc phần cứng RDP: $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          $stepsList = @(
              @{Name = "Bật Remote Desktop"; Script = {
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force;
              }},
              @{Name = "Cấu hình bảo mật RDP & Mở khóa truyền Âm thanh"; Script = {
                  $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp';
                  Set-ItemProperty -Path "$p" -Name 'UserAuthentication' -Value 0 -Force;
                  Set-ItemProperty -Path "$p" -Name 'SecurityLayer' -Value 0 -Force;
                  Set-ItemProperty -Path "$p" -Name 'fDisableAudioCapture' -Value 0 -Type DWord -Force;
                  Set-ItemProperty -Path "$p" -Name 'fDisableCam' -Value 0 -Type DWord -Force;
              }},
              @{Name = "Mở port RDP (3389), Web (8080) & Sunshine (47984-48010) cho Tailscale"; Script = {
                  Remove-NetFirewallRule -DisplayName 'RDP-Premium' -ErrorAction SilentlyContinue;
                  Remove-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -ErrorAction SilentlyContinue;
                  Remove-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -ErrorAction SilentlyContinue;

                  New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -RemoteAddress '100.64.0.0/10','127.0.0.1' -Profile Any | Out-Null;
                  New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -RemoteAddress '100.64.0.0/10','127.0.0.1' -Profile Any | Out-Null;
                  New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -RemoteAddress '100.64.0.0/10','127.0.0.1' -Profile Any | Out-Null;
              }},
              @{Name = "Khởi động dịch vụ RDP"; Script = {
                  Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue;
                  Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue;
                  Start-Service -Name TermService -ErrorAction SilentlyContinue;
                  Start-Service -Name UmRdpService -ErrorAction SilentlyContinue;
              }}
          );

          $stepsList | ForEach-Object {
              $item = $_;
              try {
                  & ($item.Script);
                  Write-Host "│ ✅ $($item.Name)" -ForegroundColor Green;
              } catch {
                  Write-Host "│ ⚠️  $($item.Name) - bỏ qua lỗi nhỏ: $($_.Exception.Message)" -ForegroundColor Yellow;
              }
          };
          exit 0;

      - name: ⚙️ TỐI ƯU WINDOWS
        if: ${{ inputs.optimize_windows }}
        shell: pwsh
        run: |
          Write-Host "";
          Write-Host "⚙️  ĐANG TỐI ƯU WINDOWS" -ForegroundColor Yellow;

          $tweaksList = @(
              @{Name = "Múi giờ Việt Nam (UTC+7)"; Script = { tzutil /s 'SE Asia Standard Time'; }},
              @{Name = "Tắt sleep / tắt màn hình / hibernate"; Script = {
                  powercfg /change standby-timeout-ac 0;
                  powercfg /change monitor-timeout-ac 0;
                  powercfg /change disk-timeout-ac 0;
                  powercfg /hibernate off;
              }},
              @{Name = "Giữ phiên RDP (không tự ngắt khi rảnh/ngắt kết nối)"; Script = {
                  $p = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services';
                  New-Item -Path "$p" -Force | Out-Null;
                  Set-ItemProperty -Path "$p" -Name 'MaxIdleTime' -Value 0 -Type DWord -Force;
                  Set-ItemProperty -Path "$p" -Name 'MaxDisconnectionTime' -Value 0 -Type DWord -Force;
                  Set-ItemProperty -Path "$p" -Name 'fResetBroken' -Value 0 -Type DWord -Force;
              }},
              @{Name = "Tắt Windows Update"; Script = {
                  Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue;
                  Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue;
                  Stop-Service -Name UsoSvc -Force -ErrorAction SilentlyContinue;
                  Set-Service -Name UsoSvc -StartupType Disabled -ErrorAction SilentlyContinue;
              }},
              @{Name = "Tắt Defender realtime"; Script = {
                  Set-MpPreference -DisableRealtimeMonitoring ($true) -ErrorAction Stop;
              }}
          );

          $tweaksList | ForEach-Object {
              $tw = $_;
              try {
                  & ($tw.Script);
                  Write-Host "│ ✅ $($tw.Name)" -ForegroundColor Green;
              } catch {
                  Write-Host "│ ⚠️  $($tw.Name) - bỏ qua: $($_.Exception.Message)" -ForegroundColor Yellow;
              }
          };
          exit 0;

      - name: 📦 CÀI APP (Tự động lưu danh sách gói vào ổ riêng cho các phiên sau)
        shell: pwsh
        env:
          PKGS: ${{ inputs.choco_packages }}
        run: |
          $pkgListFile = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'installed-choco-packages.txt');
          $savedPkgs = @();
          if (Test-Path "$pkgListFile") {
              $savedPkgs = @(Get-Content -Path "$pkgListFile" | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' });
          }
          $inputPkgs = @();
          if (-not ([string]::IsNullOrWhiteSpace("$env:PKGS"))) {
              if ("$env:PKGS" -notmatch '^[A-Za-z0-9 ._\-]*$') {
                  Write-Host "❌ Danh sách app chứa ký tự không hợp lệ" -ForegroundColor Red;
                  exit 1;
              }
              $inputPkgs = @("$env:PKGS" -split '\s+' | Where-Object { $_ });
          }
          $allPkgs = @($savedPkgs + $inputPkgs | Select-Object -Unique);
          if (($allPkgs.Count) -gt 0) {
              $allPkgs | Set-Content -Path "$pkgListFile" -Encoding UTF8;
              $allPkgs | ForEach-Object {
                  $pkg = "$_";
                  Write-Host "📦 Cài $pkg..." -ForegroundColor Cyan;
                  choco install "$pkg" -y --no-progress --limit-output;
                  if ((($LASTEXITCODE) -ne 0) -and (($LASTEXITCODE) -ne 3010)) {
                      Write-Host "│ ⚠️  Cài $pkg lỗi (mã $LASTEXITCODE), bỏ qua" -ForegroundColor Yellow;
                  }
                  $global:LASTEXITCODE = 0;
              };
          }
          exit 0;

      # ───────────────────────────────────────────────
      # 6. CÀI DRIVER MÀN HÌNH ẢO (VDD), ÂM THANH ẢO ĐA TẦNG & SUNSHINE
      # ───────────────────────────────────────────────
      - name: 🖥️🔊☀️ Cài Màn Hình Ảo (VDD), Âm Thanh Ảo Tự Động (VB-Audio + Fallback) & Sunshine
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $ErrorActionPreference = 'Continue';
          $ProgressPreference    = 'SilentlyContinue';
          $instCache             = "$env:INSTALLER_CACHE";
          $sunPersistCfg         = "$env:SUNSHINE_PERSIST_CFG";
          $dl                    = "$env:MOUNT_LETTER";
          $chocoExe              = 'C:\ProgramData\chocolatey\bin\choco.exe';

          Write-Host "";
          Write-Host "🖥️  1. ĐANG CÀI ĐẶT DRIVER MÀN HÌNH ẢO (VIRTUAL DISPLAY DRIVER)..." -ForegroundColor Yellow;

          $resParts = "$env:VDD_RES" -split '[@x]';
          $vWidth   = if (($resParts.Count) -ge 1) { [int]$resParts[0] } else { 1920 };
          $vHeight  = if (($resParts.Count) -ge 2) { [int]$resParts[1] } else { 1080 };
          $vHz      = if (($resParts.Count) -ge 3) { [int]$resParts[2] } else { 60 };

          $vddCacheDir = [System.IO.Path]::Combine("$instCache", 'VDD');
          New-Item -ItemType Directory -Force -Path "$vddCacheDir" | Out-Null;
          $usbDir = 'C:\usbmmidd_v2';

          try {
              $usbZip = [System.IO.Path]::Combine("$vddCacheDir", 'usbmmidd_v2.zip');
              if (-not (Test-Path "$usbZip")) {
                  Invoke-WebRequest -Uri 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -OutFile "$usbZip" -UseBasicParsing -TimeoutSec 45;
              }
              if (Test-Path "$usbZip") {
                  Expand-Archive -Path "$usbZip" -DestinationPath 'C:\' -Force;
                  if (Test-Path "$usbDir\deviceinstaller64.exe") {
                      Push-Location "$usbDir";
                      Get-ChildItem -Path "$usbDir" -Filter '*.cer' -Recurse | ForEach-Object {
                          Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null;
                          Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null;
                      };
                      & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null;

                      $wudfPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters';
                      New-Item -Path "$wudfPath" -Force | Out-Null;
                      Set-ItemProperty -Path "$wudfPath" -Name '0' -Value '1920,1080,60' -Type String -Force;
                      Set-ItemProperty -Path "$wudfPath" -Name '1' -Value '1920,1080,120' -Type String -Force;
                      Set-ItemProperty -Path "$wudfPath" -Name '2' -Value '2560,1440,60' -Type String -Force;
                      Set-ItemProperty -Path "$wudfPath" -Name '3' -Value '3840,2160,60' -Type String -Force;

                      & .\deviceinstaller64.exe enableidd 1 *> $null;
                      Pop-Location;
                      Start-Sleep -Seconds 2;

                      $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry');
                      if (Test-Path "$regBk\Display-Config.reg") {
                          reg import "$regBk\Display-Config.reg" *>$null;
                          reg import "$regBk\Display-Conn.reg" *>$null;
                          reg import "$regBk\Display-Scale.reg" *>$null;
                          Write-Host "│ ✅ Đã khôi phục độ phân giải & tỷ lệ Scale đã lưu từ phiên trước" -ForegroundColor Green;
                      } else {
                          $csLines = @(
                              'using System;',
                              'using System.Runtime.InteropServices;',
                              'public class DisplaySetter {',
                              '    [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]',
                              '    public struct DEVMODE {',
                              '        [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;',
                              '        public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;',
                              '        public int dmFields; public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation;',
                              '        public int dmDisplayFixedOutput; public short dmColor; public short dmDuplex; public short dmYResolution;',
                              '        public short dmTTOption; public short dmCollate;',
                              '        [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;',
                              '        public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;',
                              '        public int dmDisplayFlags; public int dmDisplayFrequency;',
                              '        public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType;',
                              '        public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;',
                              '    }',
                              '    [DllImport("user32.dll", CharSet = CharSet.Ansi)]',
                              '    public static extern int EnumDisplaySettings(string lpszDeviceName, int iModeNum, ref DEVMODE lpDevMode);',
                              '    [DllImport("user32.dll", CharSet = CharSet.Ansi)]',
                              '    public static extern int ChangeDisplaySettings(ref DEVMODE lpDevMode, int dwFlags);',
                              '    public static void SetRes(int w, int h, int hz) {',
                              '        DEVMODE dm = new DEVMODE();',
                              '        dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));',
                              '        if (EnumDisplaySettings(null, -1, ref dm) != 0) {',
                              '            dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmDisplayFrequency = hz;',
                              '            dm.dmFields = 0x00080000 | 0x00100000 | 0x00400000;',
                              '            ChangeDisplaySettings(ref dm, 0x01);',
                              '        }',
                              '    }',
                              '}'
                          );
                          if (-not ('DisplaySetter' -as [type])) {
                              Add-Type -TypeDefinition ($csLines -join "`r`n") -ErrorAction SilentlyContinue;
                          }
                          [DisplaySetter]::SetRes($vWidth, $vHeight, $vHz);
                          Write-Host "│ ✅ Đã cài và áp dụng màn hình ảo USBMMIDD_v2 (${vWidth}x${vHeight}@${vHz}Hz)" -ForegroundColor Green;
                      }
                  }
              }
          } catch {
              Write-Host "│ ⚠️  USBMMIDD_v2 lỗi nhẹ: $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          Write-Host "";
          Write-Host "🔊  2. TỰ ĐỘNG CÀI ĐẶT & BẬT CARD ÂM THANH ẢO (VB-AUDIO + DỰ PHÒNG ĐA TẦNG)..." -ForegroundColor Yellow;
          try {
              @('MMCSS', 'AudioEndpointBuilder', 'Audiosrv') | ForEach-Object {
                  Set-Service -Name "$_" -StartupType Automatic -ErrorAction SilentlyContinue;
                  Start-Service -Name "$_" -ErrorAction SilentlyContinue;
              };

              $vbCacheDir = [System.IO.Path]::Combine("$instCache", 'VBCable');
              $vbZip      = [System.IO.Path]::Combine("$vbCacheDir", 'VBCABLE_Driver_Pack43.zip');
              New-Item -ItemType Directory -Force -Path "$vbCacheDir" | Out-Null;

              if (-not (Test-Path "$vbZip")) {
                  try {
                      Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -OutFile "$vbZip" -UseBasicParsing -TimeoutSec 45;
                  } catch {
                      Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip' -OutFile "$vbZip" -UseBasicParsing -TimeoutSec 45;
                  }
              }
              if ((Test-Path "$vbZip") -and (-not (Test-Path "$vbCacheDir\VBCABLE_Setup_x64.exe"))) {
                  Expand-Archive -Path "$vbZip" -DestinationPath "$vbCacheDir" -Force;
              }

              Get-ChildItem -Path "$vbCacheDir" -Include '*.cer','*.cat','*.sys','*.exe' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                  if ($_.Extension -eq '.cer') {
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null;
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null;
                  } else {
                      $sig = Get-AuthenticodeSignature -FilePath ($_.FullName) -ErrorAction SilentlyContinue;
                      if ($sig -and $sig.SignerCertificate) {
                          $storeRoot = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine');
                          $storeRoot.Open('ReadWrite');
                          $storeRoot.Add($sig.SignerCertificate);
                          $storeRoot.Close();
                          $storePub = New-Object System.Security.Cryptography.X509Certificates.X509Store('TrustedPublisher', 'LocalMachine');
                          $storePub.Open('ReadWrite');
                          $storePub.Add($sig.SignerCertificate);
                          $storePub.Close();
                      }
                  }
              };

              $getAudioDevices = {
                  Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object {
                      ($_.Class -in @('MEDIA','AudioEndpoint')) -and
                      ($_.FriendlyName -match 'VB-Audio|CABLE|Virtual Audio|Steam') -and
                      ($_.Status -eq 'OK')
                  }
              };

              $vbInf = Get-ChildItem -Path "$vbCacheDir" -Filter '*64*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1;
              if (-not ($vbInf)) {
                  $vbInf = Get-ChildItem -Path "$vbCacheDir" -Filter '*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1;
              }
              if ($vbInf) {
                  pnputil /add-driver "$($vbInf.FullName)" /install *> $null;
                  if (Test-Path "$usbDir\deviceinstaller64.exe") {
                      Push-Location ($vbInf.DirectoryName);
                      & "$usbDir\deviceinstaller64.exe" install ($vbInf.Name) 'VBAudioVACWDM' *> $null;
                      Pop-Location;
                  }
              }

              $audioDev = & $getAudioDevices;
              if ((-not ($audioDev)) -and (Test-Path "$vbCacheDir\VBCABLE_Setup_x64.exe")) {
                  $vbJob = Start-Job -ScriptBlock {
                      param($dir)
                      Start-Process -FilePath "$dir\VBCABLE_Setup_x64.exe" -ArgumentList '-i', '-h' -WorkingDirectory "$dir" -Wait;
                  } -ArgumentList "$vbCacheDir";
                  $doneVb = Wait-Job -Job ($vbJob) -Timeout 20;
                  if (-not ($doneVb)) {
                      Stop-Job -Job ($vbJob) -ErrorAction SilentlyContinue;
                      Get-Process -Name 'VBCABLE*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
                  }
                  Remove-Job -Job ($vbJob) -Force -ErrorAction SilentlyContinue;
              }

              $audioDev = & $getAudioDevices;
              if (-not ($audioDev)) {
                  Write-Host "│ 🔄 Chuyển sang Tầng 2: Cài đặt gói vb-cable tự động qua Chocolatey..." -ForegroundColor Cyan;
                  $chocoVbJob = Start-Job -ScriptBlock {
                      param($choco)
                      if (Test-Path $choco) { & $choco install vb-cable -y --no-progress --limit-output --ignore-checksums }
                      else { choco install vb-cable -y --no-progress --limit-output --ignore-checksums }
                  } -ArgumentList $chocoExe;
                  $doneChocoVb = Wait-Job -Job ($chocoVbJob) -Timeout 45;
                  if (-not ($doneChocoVb)) {
                      Stop-Job -Job ($chocoVbJob) -ErrorAction SilentlyContinue;
                      Get-Process -Name 'VBCABLE*','choco' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
                  }
                  Remove-Job -Job ($chocoVbJob) -Force -ErrorAction SilentlyContinue;
              }

              $audioDev = & $getAudioDevices;
              if (-not ($audioDev)) {
                  Write-Host "│ 🔄 Chuyển sang Tầng 3: Cài đặt Virtual Audio Cable dự phòng..." -ForegroundColor Cyan;
                  $vacJob = Start-Job -ScriptBlock {
                      param($choco)
                      if (Test-Path $choco) { & $choco install virtual-audio-cable -y --no-progress --limit-output --ignore-checksums }
                      else { choco install virtual-audio-cable -y --no-progress --limit-output --ignore-checksums }
                  } -ArgumentList $chocoExe;
                  $doneVac = Wait-Job -Job ($vacJob) -Timeout 45;
                  if (-not ($doneVac)) {
                      Stop-Job -Job ($vacJob) -ErrorAction SilentlyContinue;
                  }
                  Remove-Job -Job ($vacJob) -Force -ErrorAction SilentlyContinue;
              }

              pnputil /scan-devices *> $null;
              Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { ($_.Class -in @('MEDIA','AudioEndpoint')) -and ($_.Status -ne 'OK') } | ForEach-Object {
                  Enable-PnpDevice -InstanceId ($_.InstanceId) -Confirm:($false) -ErrorAction SilentlyContinue *> $null;
              };
              Restart-Service -Name 'Audiosrv' -Force -ErrorAction SilentlyContinue;
              Start-Sleep -Seconds 2;

              $finalAudio = @(Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object {
                  ($_.Class -in @('MEDIA','AudioEndpoint')) -and
                  ($_.FriendlyName -match 'VB-Audio|CABLE|Virtual Audio|Speaker|Line') -and
                  ($_.Status -eq 'OK')
              } | Select-Object -ExpandProperty FriendlyName -Unique);
              if (($finalAudio.Count) -gt 0) {
                  $audioNames = $finalAudio -join ', ';
                  "AUDIO_DEVICE_NAME=$audioNames" >> "$env:GITHUB_ENV";
                  Write-Host "│ ✅ Đã cài đặt & bật thành công thiết bị âm thanh ảo: $audioNames" -ForegroundColor Green;
              } else {
                  "AUDIO_DEVICE_NAME=Windows Virtual Audio (Active)" >> "$env:GITHUB_ENV";
                  Write-Host "│ ✅ Đã bật dịch vụ Windows Audio & nạp Driver âm thanh ảo" -ForegroundColor Green;
              }
          } catch {
              Write-Host "│ ⚠️  Âm thanh ảo lỗi nhẹ: $($_.Exception.Message)" -ForegroundColor Yellow;
          }
          $global:LASTEXITCODE = 0;

          Write-Host "";
          Write-Host "☀️  3. ĐANG TẢI & CÀI ĐẶT SUNSHINE..." -ForegroundColor Yellow;

          $sunDir = 'C:\Program Files\Sunshine';
          $sunExe = "$sunDir\sunshine.exe";
          $sunCfg = "$sunDir\config";

          if (-not (Test-Path "$sunExe")) {
              Write-Host "│ 🧹 Xóa khóa Registry Sunshine cũ (nếu có) để chống treo bộ cài NSIS..." -ForegroundColor Cyan;
              Remove-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*Sunshine*' -Recurse -Force -ErrorAction SilentlyContinue;
              Remove-Item -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*Sunshine*' -Recurse -Force -ErrorAction SilentlyContinue;
              Remove-Item -Path 'HKLM:\SOFTWARE\LizardByte*' -Recurse -Force -ErrorAction SilentlyContinue;
              & sc.exe stop SunshineService *> $null;
              & sc.exe delete SunshineService *> $null;
              & sc.exe stop sunshinesvc *> $null;
              & sc.exe delete sunshinesvc *> $null;

              Write-Host "│ 📦 Đang cài đặt Sunshine qua Chocolatey (khống chế tối đa 90s chống treo)..." -ForegroundColor Cyan;
              $installJob = Start-Job -ScriptBlock {
                  param($choco)
                  if (Test-Path $choco) { & $choco install sunshine -y --no-progress --limit-output --ignore-checksums }
                  else { choco install sunshine -y --no-progress --limit-output --ignore-checksums }
              } -ArgumentList $chocoExe;
              $completed = Wait-Job -Job ($installJob) -Timeout 90;
              if (-not ($completed)) {
                  Write-Host "│ ⚠️  Bộ cài NSIS chờ quá 90s, tự động đóng tiến trình cài đặt để tiếp tục..." -ForegroundColor Yellow;
                  Stop-Job -Job ($installJob) -ErrorAction SilentlyContinue;
                  Get-Process | Where-Object { ($_.Name -match 'sunshine|choco') -and ($_.Name -ne 'sunshinesvc') } | Stop-Process -Force -ErrorAction SilentlyContinue;
              } else {
                  Receive-Job -Job ($installJob) | Out-Null;
              }
              Remove-Job -Job ($installJob) -Force -ErrorAction SilentlyContinue;
              $global:LASTEXITCODE = 0;
          } else {
              Write-Host "│ ⚡ Đã khôi phục sẵn Sunshine từ ổ ${dl}:\ (Không cần tải hay cài lại)!" -ForegroundColor Green;
          }

          if (Test-Path "$sunExe") {
              Stop-Service -Name 'SunshineService' -Force -ErrorAction SilentlyContinue;
              Stop-Service -Name 'sunshinesvc' -Force -ErrorAction SilentlyContinue;
              Stop-Process -Name 'sunshine' -Force -ErrorAction SilentlyContinue;
              Start-Sleep -Seconds 2;

              if (-not ($sunPersistCfg)) { $sunPersistCfg = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Sunshine-Config'); }
              New-Item -ItemType Directory -Force -Path "$sunPersistCfg" | Out-Null;

              if (Test-Path "$sunCfg") {
                  $item = Get-Item "$sunCfg" -Force;
                  if (($item.Attributes) -notmatch 'ReparsePoint') {
                      $persistEmpty = $true;
                      if ($sunPersistCfg -and (Test-Path "$sunPersistCfg")) {
                          $persistEmpty = (@(Get-ChildItem "$sunPersistCfg" -Force -ErrorAction SilentlyContinue).Count -eq 0);
                      }
                      if ($persistEmpty) {
                          Copy-Item -Path "$sunCfg\*" -Destination "$sunPersistCfg" -Recurse -Force -ErrorAction SilentlyContinue;
                      }
                      Remove-Item -Path "$sunCfg" -Recurse -Force -ErrorAction SilentlyContinue;
                      New-Item -ItemType Junction -Path "$sunCfg" -Target "$sunPersistCfg" -Force | Out-Null;
                  }
              } else {
                  New-Item -ItemType Junction -Path "$sunCfg" -Target "$sunPersistCfg" -Force | Out-Null;
              }
              Write-Host "│ ✅ Đã gắn kết cấu hình Sunshine <-> $sunPersistCfg" -ForegroundColor Green;

              $confFile = [System.IO.Path]::Combine("$sunPersistCfg", 'sunshine.conf');
              if (-not (Test-Path "$confFile")) {
                  $defaultConf = @(
                      "sunshine_name = AISTV-Cloud-$($env:MOUNT_LETTER)",
                      "min_log_level = info",
                      "origin_web_ui_allowed = wan",
                      "upnp = disabled",
                      "address_family = both"
                  ) -join "`r`n";
                  Set-Content -Path "$confFile" -Value "$defaultConf" -Encoding UTF8;
              } else {
                  $curConf = Get-Content -Raw -Path "$confFile" -ErrorAction SilentlyContinue;
                  if ("$curConf" -notmatch 'origin_web_ui_allowed') {
                      Add-Content -Path "$confFile" -Value "`r`norigin_web_ui_allowed = wan" -Encoding UTF8;
                  }
              }
          } else {
              Write-Host "│ ❌ Không tìm thấy sunshine.exe sau khi cài!" -ForegroundColor Red;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ───────────────────────────────────────────────
      # 7. TAILSCALE
      # ───────────────────────────────────────────────
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          Write-Host "";
          Write-Host "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG" -ForegroundColor Yellow;

          if (-not ("$env:TAILSCALE_AUTH_KEY")) {
              Write-Host "❌ Thiếu secret TAILSCALE_AUTH_KEY" -ForegroundColor Red;
              exit 1;
          }

          $ProgressPreference = 'SilentlyContinue';
          $ts = 'C:\Program Files\Tailscale\tailscale.exe';

          if (-not (Test-Path "$ts")) {
              Remove-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*Tailscale*' -Recurse -Force -ErrorAction SilentlyContinue;
              Remove-Item -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*Tailscale*' -Recurse -Force -ErrorAction SilentlyContinue;
              Get-Process -Name 'msiexec' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
              Start-Sleep -Seconds 2;

              $msiCache = [System.IO.Path]::Combine("$env:INSTALLER_CACHE", 'tailscale-premium.msi');
              if ((Test-Path "$msiCache") -and ((Get-Item "$msiCache").Length -lt 5MB)) {
                  Remove-Item -Path "$msiCache" -Force -ErrorAction SilentlyContinue;
              }
              if (-not (Test-Path "$msiCache")) {
                  try {
                      Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile "$msiCache" -UseBasicParsing;
                  } catch {}
              }
              if (Test-Path "$msiCache") {
                  $localMsi = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'tailscale-setup.msi');
                  Copy-Item -Path "$msiCache" -Destination "$localMsi" -Force;
                  Start-Process msiexec.exe -ArgumentList "/i `"$localMsi`" /quiet /norestart" -Wait;
              }

              if (-not (Test-Path "$ts")) {
                  Write-Host "│ ⚠️  MSI chưa bung được file, chuyển sang bộ cài EXE trực tiếp..." -ForegroundColor Yellow;
                  $exePath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'tailscale-setup-latest.exe');
                  try {
                      Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile "$exePath" -UseBasicParsing;
                      if (Test-Path "$exePath") {
                          Start-Process -FilePath "$exePath" -ArgumentList '/S', '/norestart' -Wait;
                      }
                  } catch {}
              }

              if (-not (Test-Path "$ts")) {
                  Write-Host "│ ⚠️  Đang cài Tailscale dự phòng qua Chocolatey..." -ForegroundColor Yellow;
                  choco install tailscale -y --no-progress --limit-output --ignore-checksums;
                  $global:LASTEXITCODE = 0;
              }
          }

          if (-not (Test-Path "$ts")) {
              Write-Host "❌ Không tìm thấy tailscale.exe sau cả 3 phương thức cài đặt!" -ForegroundColor Red;
              exit 1;
          }
          Write-Host "│ ✅ Đã cài Tailscale ($ts)" -ForegroundColor Green;

          Set-Service -Name 'Tailscale' -StartupType Automatic -ErrorAction SilentlyContinue;
          Start-Service -Name 'Tailscale' -ErrorAction SilentlyContinue;
          Start-Sleep -Seconds 6;

          & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=ai-stv-premium-$env:GITHUB_RUN_ID" --accept-routes --accept-dns --reset --unattended;
          if (($LASTEXITCODE) -ne 0) {
              Start-Sleep -Seconds 5;
              & "$ts" up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=ai-stv-premium-$env:GITHUB_RUN_ID" --accept-routes --accept-dns --reset;
              if (($LASTEXITCODE) -ne 0) {
                  Write-Host "❌ Lỗi kết nối Tailscale" -ForegroundColor Red;
                  exit 1;
              }
          }
          Write-Host "│ ✅ Kết nối Tailscale thành công" -ForegroundColor Green;

          $ip = $null;
          1..20 | ForEach-Object {
              if (-not ($ip)) {
                  $out = (& "$ts" ip -4 2>&1 | Out-String).Trim();
                  if ("$out" -match '^\d+\.\d+\.\d+\.\d+$') {
                      $ip = "$out";
                  } else {
                      Start-Sleep -Seconds 3;
                  }
              }
          };

          if (-not ($ip)) {
              Write-Host "❌ Không lấy được IP Tailscale" -ForegroundColor Red;
              exit 1;
          }

          "TAILSCALE_IP=$ip" >> "$env:GITHUB_ENV";
          Write-Host "✅ Địa chỉ IP: $ip" -ForegroundColor Green;
          exit 0;

      # ───────────────────────────────────────────────
      # 8. CẤU HÌNH MẬT KHẨU USER GỐC (RUNNERADMIN), SỬA SETTINGS & BẬT SUNSHINE
      # ───────────────────────────────────────────────
      - name: 👤 Đặt mật khẩu User gốc (runneradmin), Bảo vệ Settings & Bật Sunshine
        shell: pwsh
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
        run: |
          $user     = "$env:RDP_USER";
          $profPath = "$env:PROFILE_PATH";

          Write-Host "";
          Write-Host "👤 ĐANG CẤU HÌNH USER GỐC (GIỮ NGUYÊN TÊN): $user" -ForegroundColor Yellow;

          if (-not ([string]::IsNullOrWhiteSpace("$env:RDP_PASSWORD_SECRET"))) {
              $matKhau = ("$env:RDP_PASSWORD_SECRET").Trim();
              $source  = 'secret';
              Write-Host "│ ℹ️  Dùng mật khẩu cố định từ secret RDP_PASSWORD" -ForegroundColor Blue;
          } elseif (-not ([string]::IsNullOrWhiteSpace("$env:FIXED_PASS_INPUT"))) {
              $matKhau = ("$env:FIXED_PASS_INPUT").Trim();
              $source  = 'fixed_input';
              Write-Host "│ ℹ️  Dùng mật khẩu cố định từ input" -ForegroundColor Blue;
          } elseif ("$env:RESTORE_PASS") {
              $matKhau = "$env:RESTORE_PASS";
              $source  = 'restored';
              Write-Host "│ ℹ️  Dùng mật khẩu đã lưu từ phiên trước" -ForegroundColor Blue;
          } else {
              $matKhau = 'Aistv@2026';
              $source  = 'default_fixed';
              Write-Host "│ ℹ️  Dùng mật khẩu cố định mặc định: $matKhau" -ForegroundColor Blue;
          }

          try {
              & net accounts /maxpwage:unlimited *> $null;
              $secCfg = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.cfg');
              $secDb  = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.sdb');
              & secedit /export /cfg "$secCfg" *> $null;
              if (Test-Path "$secCfg") {
                  $rawSec = Get-Content -Raw -Path "$secCfg";
                  $rawSec = $rawSec -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0';
                  $rawSec = $rawSec -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0';
                  Set-Content -Path "$secCfg" -Value "$rawSec" -Encoding Unicode;
                  & secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY *> $null;
                  Remove-Item -Path "$secCfg", "$secDb" -Force -ErrorAction SilentlyContinue;
              }
          } catch {}

          $securePass = ConvertTo-SecureString "$matKhau" -AsPlainText -Force;
          try {
              Set-LocalUser -Name "$user" -Password ($securePass) -PasswordNeverExpires ($true) -ErrorAction Stop;
          } catch {
              & net user "$user" "$matKhau" /active:yes /expires:never *> $null;
          }

          try {
              $acct = Get-CimInstance -ClassName Win32_UserAccount -Filter "Name='$user' AND LocalAccount=True" -ErrorAction Stop;
              if ($acct) {
                  Set-CimInstance -InputObject $acct -Property @{ PasswordExpires = $false } -ErrorAction Stop;
                  Write-Host "│ ✅ Đã tắt hết hạn mật khẩu qua CIM cho $user" -ForegroundColor Green;
              }
          } catch {
              Write-Host "│ ℹ️  Bỏ qua PasswordExpires qua CIM (Set-LocalUser đã xử lý): $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          Add-LocalGroupMember -Group 'Administrators' -Member "$user" -ErrorAction SilentlyContinue;
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member "$user" -ErrorAction SilentlyContinue;
          Enable-LocalUser -Name "$user" -ErrorAction SilentlyContinue;

          try {
              Set-Service -Name 'AppXSvc' -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name 'AppXSvc' -ErrorAction SilentlyContinue;
              Set-Service -Name 'StateRepository' -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name 'StateRepository' -ErrorAction SilentlyContinue;
              & icacls "$profPath\AppData\Local\Packages" /grant "*S-1-15-2-1:(OI)(CI)F" /T /C /Q *> $null;
              if (Test-Path 'C:\Windows\ImmersiveControlPanel\appxmanifest.xml') {
                  Add-AppxPackage -Register 'C:\Windows\ImmersiveControlPanel\appxmanifest.xml' -DisableDevelopmentMode -ErrorAction SilentlyContinue;
              }
              Write-Host "│ ✅ Đã kích hoạt & bảo vệ Windows Settings (ImmersiveControlPanel)" -ForegroundColor Green;
          } catch {}

          $global:LASTEXITCODE = 0;
          "RDP_PASS=$matKhau" >> "$env:GITHUB_ENV";
          "RDP_PASS_SOURCE=$source" >> "$env:GITHUB_ENV";

          # 🔐 BẮT BUỘC NHẬP MẬT KHẨU KHI KẾT NỐI RDP
          $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services';
          New-Item -Path "$tsPolicy" -Force | Out-Null;
          Set-ItemProperty -Path "$tsPolicy" -Name 'fPromptForPassword' -Value 1 -Type DWord -Force;
          Write-Host "│ ✅ Đã bật bắt buộc nhập mật khẩu khi kết nối RDP (fPromptForPassword=1)" -ForegroundColor Green;

          # Cấu hình AutoAdminLogon để vào thẳng màn hình chính sau khi RDP session được tạo
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon';
          Set-ItemProperty -Path "$winlogon" -Name 'AutoAdminLogon' -Value '1' -Force;
          Set-ItemProperty -Path "$winlogon" -Name 'DefaultUserName' -Value "$user" -Force;
          Set-ItemProperty -Path "$winlogon" -Name 'DefaultPassword' -Value "$matKhau" -Force;
          Set-ItemProperty -Path "$winlogon" -Name 'DefaultDomainName' -Value "$env:COMPUTERNAME" -Force;
          Write-Host "│ ✅ Đã bật AutoAdminLogon (vào thẳng màn hình chính sau khi nhập đúng mật khẩu RDP)" -ForegroundColor Green;

          # 🔑 Tái mã hóa khóa DPAPI (Local State) theo SID & Mật khẩu của máy mới để giữ phiên đăng nhập App/Trình duyệt
          try {
              Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue;
              if (Test-Path "$profPath\AppData") {
                  $rekeyCount = 0;
                  Get-ChildItem -Path "$profPath\AppData" -Filter 'Local State.aistvkey' -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
                      try {
                          $keyFile = $_.FullName;
                          $lsFile  = $keyFile -replace '\.aistvkey$', '';
                          if (Test-Path "$lsFile") {
                              $rawB64  = (Get-Content -Raw -Path "$keyFile" -Encoding ASCII).Trim();
                              $rawKey  = [Convert]::FromBase64String("$rawB64");
                              $newEnc  = [System.Security.Cryptography.ProtectedData]::Protect($rawKey, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser);
                              $dpapiPrefix = [System.Text.Encoding]::ASCII.GetBytes('DPAPI');
                              $finalBytes  = New-Object byte[] ($dpapiPrefix.Length + $newEnc.Length);
                              [Array]::Copy($dpapiPrefix, 0, $finalBytes, 0, $dpapiPrefix.Length);
                              [Array]::Copy($newEnc, 0, $finalBytes, $dpapiPrefix.Length, $newEnc.Length);

                              $lsJson = Get-Content -Raw -Path "$lsFile" -Encoding UTF8 | ConvertFrom-Json;
                              if ($lsJson.os_crypt) {
                                  $lsJson.os_crypt.encrypted_key = [Convert]::ToBase64String($finalBytes);
                                  if ($lsJson.os_crypt.PSObject.Properties['app_bound_encrypted_key']) {
                                      $lsJson.os_crypt.PSObject.Properties.Remove('app_bound_encrypted_key');
                                  }
                                  $lsJson | ConvertTo-Json -Depth 32 -Compress | Set-Content -Path "$lsFile" -Encoding UTF8 -Force;
                                  $rekeyCount++;
                              }
                          }
                      } catch {}
                  };
                  Write-Host "│ ✅ Đã đồng bộ khóa phiên đăng nhập DPAPI cho $rekeyCount ứng dụng/trình duyệt!" -ForegroundColor Green;
              }
          } catch {}

          # Đồng bộ tài khoản Sunshine & bật dịch vụ Sunshine trên User gốc
          $sunDir = 'C:\Program Files\Sunshine';
          $sunExe = "$sunDir\sunshine.exe";
          $sunPersistCfg = "$env:SUNSHINE_PERSIST_CFG";
          $userSid = (Get-LocalUser -Name "$user").SID.Value;

          if (Test-Path "$sunExe") {
              & icacls "$sunDir" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null;
              & icacls "$sunPersistCfg" /grant "*${userSid}:(OI)(CI)F" /T /C /Q *> $null;

              Push-Location "$sunDir";
              & "$sunExe" --creds "$user" "$matKhau" *> $null;
              Pop-Location;
              Write-Host "│ ✅ Đã đồng bộ tài khoản Sunshine Web UI -> User: $user | Pass: (Cố định)" -ForegroundColor Green;

              $svcExe = "$sunDir\tools\sunshinesvc.exe";
              $svcObj = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1;
              if ((-not ($svcObj)) -and (Test-Path "$svcExe")) {
                  & sc.exe create SunshineService binPath= "`"$svcExe`"" start= auto DisplayName= "Sunshine Gamestream Service" *> $null;
                  $svcObj = Get-Service -Name 'SunshineService' -ErrorAction SilentlyContinue;
              }

              if ($svcObj) {
                  Set-Service -Name ($svcObj.Name) -StartupType Automatic -ErrorAction SilentlyContinue;
                  Start-Service -Name ($svcObj.Name) -ErrorAction SilentlyContinue;
                  Write-Host "│ ✅ Đã bật dịch vụ $($svcObj.Name) (Running trên Console User gốc)" -ForegroundColor Green;
              } else {
                  Start-Process -FilePath "$sunExe" -WorkingDirectory "$sunDir" -WindowStyle Hidden;
                  Write-Host "│ ✅ Đã chạy trực tiếp Sunshine trong phiên Console của $user" -ForegroundColor Green;
              }
              "SUNSHINE_READY=1" >> "$env:GITHUB_ENV";
          }

          try {
              $desktopDir = [System.IO.Path]::Combine("$profPath", 'Desktop');
              New-Item -ItemType Directory -Force -Path "$desktopDir" | Out-Null;
              $ws = New-Object -ComObject WScript.Shell;

              @("$desktopDir", 'C:\Users\Public\Desktop') | ForEach-Object {
                  $d = "$_";
                  $lnk1 = $ws.CreateShortcut("$d\O-DIA-RIENG-AISTV.lnk");
                  $lnk1.TargetPath = "$($env:MOUNT_LETTER):\";
                  $lnk1.Save();

                  $lnk2 = $ws.CreateShortcut("$d\AISTV-SHARED.lnk");
                  $lnk2.TargetPath = "$env:SHARED_DATA_DIR";
                  $lnk2.Save();

                  $lnk3 = $ws.CreateShortcut("$d\WEB-QUAN-LY-RDP.url");
                  $lnk3.TargetPath = "http://127.0.0.1:$($env:WEB_PORT)/";
                  $lnk3.Save();

                  $lnk4 = $ws.CreateShortcut("$d\SUNSHINE-WEB-UI.url");
                  $lnk4.TargetPath = "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/";
                  $lnk4.Save();

                  $tsconBat = "$d\NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat";
                  $batLines = @(
                      '@echo off',
                      'for /f "tokens=3-4" %%a in (''query session %USERNAME%'') do @if "%%b"=="Active" tscon %%a /dest:console'
                  );
                  Set-Content -Path "$tsconBat" -Value ($batLines -join "`r`n") -Encoding ASCII;
              };
              Write-Host "│ ✅ Đã tạo đầy đủ Shortcut ổ đĩa riêng & Sunshine trên Desktop User gốc" -ForegroundColor Green;
          } catch {}

          'SESSION_READY=1' >> "$env:GITHUB_ENV";
          Write-Host "✅ User gốc [$user] ($profPath) đã sẵn sàng trên Console!" -ForegroundColor Green;
          exit 0;

      # ───────────────────────────────────────────────
      # 9. DUCKDNS
      # ───────────────────────────────────────────────
      - name: 🦆 CẬP NHẬT DUCKDNS
        if: ${{ inputs.enable_duckdns }}
        shell: pwsh
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        run: |
          Write-Host "";
          Write-Host "🦆 ĐANG CẬP NHẬT DUCKDNS" -ForegroundColor Yellow;

          if ((-not ("$env:DUCKDNS_TOKEN")) -or (-not ("$env:DUCKDNS_DOMAIN"))) {
              Write-Host "⚠️ Thiếu secret DUCKDNS_TOKEN hoặc DUCKDNS_DOMAIN, bỏ qua DuckDNS" -ForegroundColor Yellow;
              exit 0;
          }
          if (-not ("$env:TAILSCALE_IP")) {
              Write-Host "⚠️ Chưa có IP Tailscale, bỏ qua DuckDNS" -ForegroundColor Yellow;
              exit 0;
          }

          $domain = (("$env:DUCKDNS_DOMAIN").Trim().ToLower()) -replace '\.duckdns\.org$', '';
          if ("$domain" -notmatch '^[a-z0-9-]+$') {
              Write-Host "⚠️ DUCKDNS_DOMAIN không hợp lệ (chỉ nhập 1 tên, vd: myrdp)" -ForegroundColor Yellow;
              exit 0;
          }

          $ok = $false;
          1..3 | ForEach-Object {
              if (-not ($ok)) {
                  try {
                      $uri = "https://www.duckdns.org/update?domains=$domain&token=$($env:DUCKDNS_TOKEN)&ip=$($env:TAILSCALE_IP)";
                      $res = Invoke-RestMethod -Uri "$uri" -TimeoutSec 20;
                      if (("$res").Trim() -eq 'OK') {
                          $ok = $true;
                      }
                  } catch {}
                  if (-not ($ok)) { Start-Sleep -Seconds 5; }
              }
          };

          if ($ok) {
              "DUCKDNS_HOST=${domain}.duckdns.org" >> "$env:GITHUB_ENV";
              Write-Host "✅ ${domain}.duckdns.org -> $env:TAILSCALE_IP" -ForegroundColor Green;
          } else {
              Write-Host "⚠️ DuckDNS trả KO hoặc lỗi mạng (kiểm tra lại token / tên miền)" -ForegroundColor Yellow;
          }
          exit 0;

      # ───────────────────────────────────────────────
      # 10. KHỞI CHẠY WEB PANEL QUẢN LÝ & CÀI LẠI / MỞ STARDESK
      # ───────────────────────────────────────────────
      - name: 🌐 Khởi chạy Web Quản Lý RDP & Sunshine (Port 8080) & Ghi State
        shell: pwsh
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
        run: |
          $savePass = $null;
          if ("$env:RDP_PASS_SOURCE" -ne 'secret') {
              $savePass = "$env:RDP_PASS";
          }

          $uObj = Get-LocalUser -Name "$env:RDP_USER" -ErrorAction SilentlyContinue;
          $userSid = $uObj.SID.Value;

          $state = [ordered]@{
              user            = "$env:RDP_USER";
              sid             = "$userSid";
              password        = $savePass;
              passwordSource  = "$env:RDP_PASS_SOURCE";
              windowsImage    = "$env:WINDOWS_IMAGE";
              osBuild         = "$env:OS_BUILD";
              driveLetter     = "$env:MOUNT_LETTER";
              tailscaleIp     = "$env:TAILSCALE_IP";
              durationMinutes = [int]"$env:TOTAL_MINUTES";
              startUtc        = (Get-Date).ToUniversalTime().ToString('o');
              runId           = "$env:GITHUB_RUN_ID";
              lastUpdatedUtc  = (Get-Date).ToUniversalTime().ToString('o');
          };
          $stateFilePath = "$env:SHARED_STATE_FILE";
          $state | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path "$stateFilePath" -Encoding UTF8;

          $keep = [System.IO.Path]::Combine("$env:SHARED_DATA_DIR", '.gitkeep');
          if (-not (Test-Path "$keep")) {
              New-Item -ItemType File -Path "$keep" -Force | Out-Null;
          }

          $webLines = @(
              '$ErrorActionPreference = "Continue";',
              '$listener = [System.Net.HttpListener]::new();',
              'try { $listener.Prefixes.Add("http://+:$($env:WEB_PORT)/"); } catch {}',
              'if (($listener.Prefixes.Count) -eq 0) { $listener.Prefixes.Add("http://*:$($env:WEB_PORT)/"); }',
              '$listener.Start();',
              '$endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60);',
              'while ($listener.IsListening) {',
              '    try {',
              '        $ctx  = $listener.GetContext();',
              '        $req  = $ctx.Request;',
              '        $resp = $ctx.Response;',
              '        $path = $req.Url.AbsolutePath.ToLower();',
              '        $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();',
              '        $remain = [math]::Max(0, ($endEpoch) - ($now));',
              '        $h      = [math]::Floor(($remain) / 3600);',
              '        $m      = [math]::Floor((($remain) % 3600) / 60);',
              '        $s      = ($remain) % 60;',
              '        $statusMsg = "";',
              '        if (($req.HttpMethod) -eq "POST") {',
              '            if ("$path" -eq "/action/save") {',
              '                Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "SAVE_NOW" -Encoding UTF8;',
              '                $statusMsg = "✅ Đã gửi lệnh LƯU NGAY! Kiểm tra log GitHub Actions (quá trình nén mất khoảng 20-40 giây).";',
              '            } elseif ("$path" -eq "/action/restart") {',
              '                Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "RESTART_SESSION" -Encoding UTF8;',
              '                $statusMsg = "🔁 Đã gửi lệnh LƯU & KHỞI ĐỘNG PHIÊN MỚI! Hệ thống sẽ đóng gói ổ đĩa đẩy lên GitHub và bật phiên mới...";',
              '            } elseif ("$path" -eq "/action/stop") {',
              '                Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "STOP_SESSION" -Encoding UTF8;',
              '                $statusMsg = "🛑 Đã gửi lệnh LƯU & TẮT HẲN SERVER! Hệ thống sẽ đóng gói toàn bộ ổ đĩa lên GitHub trước khi tắt...";',
              '            }',
              '        }',
              '        $bannerHtml = if ("$statusMsg") { "<div class=''alert''>$statusMsg</div>" } else { "" };',
              '        $htmlLines = @(',
              '            "<!DOCTYPE html><html lang=''vi''><head><meta charset=''utf-8''><meta name=''viewport'' content=''width=device-width, initial-scale=1''><title>AI-STV Control Panel</title>",',
              '            "<style>",',
              '            "* { box-sizing: border-box; font-family: Segoe UI, sans-serif; }",',
              '            "body { background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; display: flex; justify-content: center; }",',
              '            ".card { max-width: 560px; width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; }",',
              '            "h1 { margin: 0 0 8px 0; font-size: 22px; color: #38bdf8; }",',
              '            ".sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }",',
              '            ".info { background: #0f172a; border-radius: 12px; padding: 16px; margin-bottom: 20px; }",',
              '            ".row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }",',
              '            ".val { font-weight: 600; color: #4ade80; } .val a { color: #facc15; }",',
              '            ".alert { background: #065f46; color: #ecfdf5; padding: 14px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; }",',
              '            "form { margin-bottom: 12px; }",',
              '            "button { width: 100%; padding: 14px 18px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; color: white; }",',
              '            ".btn-save { background: #0284c7; } .btn-restart { background: #d97706; } .btn-stop { background: #dc2626; }",',
              '            ".note { font-size: 12px; color: #94a3b8; margin-top: 14px; }",',
              '            "</style></head><body><div class=''card''>",',
              '            "<h1>🎛️ Bảng Điều Khiển AI-STV (RDP + Sunshine)</h1>",',
              '            "<div class=''sub''>Quản lý Lưu ổ đĩa $($env:MOUNT_LETTER):\, Sunshine Stream, Tắt máy & Chuyển phiên</div>",',
              '            "$bannerHtml",',
              '            "<div class=''info''>",',
              '            "<div class=''row''><span>🌐 IP Tailscale:</span><span class=''val''>$($env:TAILSCALE_IP)</span></div>",',
              '            "<div class=''row''><span>☀️ Sunshine Web UI:</span><span class=''val''><a href=''https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/'' target=''_blank''>https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/</a></span></div>",',
              '            "<div class=''row''><span>👤 Tài khoản gốc:</span><span class=''val''>$($env:RDP_USER)</span></div>",',
              '            "<div class=''row''><span>🔊 Âm thanh ảo:</span><span class=''val''>$($env:AUDIO_DEVICE_NAME)</span></div>",',
              '            "<div class=''row''><span>💽 Ổ đĩa lưu trữ:</span><span class=''val''>$($env:MOUNT_LETTER):\ ($($env:SHARED_ROOT))</span></div>",',
              '            "<div class=''row''><span>⏳ Thời gian còn lại:</span><span class=''val''>${h}h ${m}m ${s}s</span></div>",',
              '            "</div>",',
              '            "<form method=''POST'' action=''/action/save''><button type=''submit'' class=''btn-save''><span>💾 Lưu Dữ Liệu Ngay (Không tắt máy)</span><span>→</span></button></form>",',
              '            "<form method=''POST'' action=''/action/restart''><button type=''submit'' class=''btn-restart''><span>🔁 Lưu Ổ Đĩa & Khởi Động Phiên Mới Ngay</span><span>→</span></button></form>",',
              '            "<form method=''POST'' action=''/action/stop''><button type=''submit'' class=''btn-stop''><span>🛑 Lưu Ổ Đĩa & Tắt Hẳn Server</span><span>→</span></button></form>",',
              '            "<div class=''note''>💡 Luôn tắt hoặc khởi động lại bằng nút trên trang web này để lưu 100% ổ đĩa lên Release.</div></div></body></html>"',
              '        );',
              '        $html = $htmlLines -join "`r`n";',
              '        $buf = [System.Text.Encoding]::UTF8.GetBytes("$html");',
              '        $resp.ContentType = "text/html; charset=utf-8";',
              '        $resp.ContentLength64 = $buf.Length;',
              '        $resp.OutputStream.Write($buf, 0, $buf.Length);',
              '        $resp.OutputStream.Close();',
              '    } catch {}',
              '}'
          );
          $webScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'web-panel.ps1');
          Set-Content -Path "$webScriptPath" -Value ($webLines -join "`r`n") -Encoding UTF8;
          Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScriptPath`"";
          Write-Host "✅ Đã khởi chạy Web Quản Lý tại: http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Green;
          exit 0;

      # ───────────────────────────────────────────────
      # 10.5. CÀI ĐẶT LẠI & MỞ STARDESK (SAU KHI HỆ THỐNG ĐÃ MỞ SẴN SÀNG)
      # ───────────────────────────────────────────────
      - name: 🚀 Cài đặt lại & Mở StarDesk (Sau khi mọi thứ đã cài xong và máy đã mở)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $user          = "$env:RDP_USER";
          $installerPath = 'C:\Users\runneradmin\Downloads\StarDesk_1.5.2.exe';
          $appDir        = 'C:\Program Files\StarDesk';
          $appExe        = 'C:\Program Files\StarDesk\StarDesk.exe';

          Write-Host "";
          Write-Host "🚀 ĐANG CÀI ĐẶT LẠI & KHỞI CHẠY STARDESK (GIỮ NGUYÊN DỮ LIỆU ĐÃ LƯU)..." -ForegroundColor Yellow;

          if (-not (Test-Path "$installerPath")) {
              $altInstaller = [System.IO.Path]::Combine("$env:PROFILE_PATH", 'Downloads', 'StarDesk_1.5.2.exe');
              if (Test-Path "$altInstaller") {
                  $installerPath = "$altInstaller";
              }
          }

          if (Test-Path "$installerPath") {
              Write-Host "│ 📦 Tìm thấy bộ cài: $installerPath. Đang tiến hành cài đặt lại..." -ForegroundColor Cyan;

              Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;
              Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
              Start-Sleep -Seconds 2;

              $sdInstallJob = Start-Job -ScriptBlock {
                  param($exe)
                  Start-Process -FilePath "$exe" -ArgumentList '/S' -Wait;
              } -ArgumentList "$installerPath";

              $doneInstall = Wait-Job -Job ($sdInstallJob) -Timeout 60;
              if (-not ($doneInstall)) {
                  Write-Host "│ ⚠️  Bộ cài chạy quá 60s, tự động đóng tiến trình cài đặt để tiếp tục..." -ForegroundColor Yellow;
                  Stop-Job -Job ($sdInstallJob) -ErrorAction SilentlyContinue;
                  Get-Process -Name 'StarDesk_1.5.2*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
              }
              Remove-Job -Job ($sdInstallJob) -Force -ErrorAction SilentlyContinue;

              if ((-not (Test-Path "$appExe")) -and (-not (Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue))) {
                  Write-Host "│ 🔄 Chạy trực tiếp bộ cài $installerPath..." -ForegroundColor Cyan;
                  $proc = Start-Process -FilePath "$installerPath" -PassThru -ErrorAction SilentlyContinue;
                  $waited = 0;
                  while (($waited -lt 45) -and (-not (Test-Path "$appExe"))) {
                      Start-Sleep -Seconds 2;
                      $waited += 2;
                  }
                  Start-Sleep -Seconds 3;
                  if (($proc) -and (-not ($proc.HasExited))) {
                      Stop-Process -Id ($proc.Id) -Force -ErrorAction SilentlyContinue;
                  }
              }
              Write-Host "│ ✅ Đã hoàn tất chạy bộ cài đặt StarDesk_1.5.2.exe" -ForegroundColor Green;
          } else {
              Write-Host "│ ⚠️  Không tìm thấy file cài đặt tại $installerPath (sẽ thử mở trực tiếp nếu đã có sẵn)" -ForegroundColor Yellow;
          }

          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | ForEach-Object {
              Set-Service -Name ($_.Name) -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name ($_.Name) -ErrorAction SilentlyContinue;
              Write-Host "│ ✅ Đã bật dịch vụ $($_.Name)" -ForegroundColor Green;
          };

          if (Test-Path "$appExe") {
              try {
                  & schtasks.exe /Create /TN "AISTV-Launch-StarDesk" /TR "`"$appExe`"" /SC ONLOGON /RU "$user" /RL HIGHEST /IT /F *> $null;
                  & schtasks.exe /Run /TN "AISTV-Launch-StarDesk" *> $null;
                  Start-Sleep -Seconds 3;
              } catch {}

              if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) {
                  Start-Process -FilePath "$appExe" -WorkingDirectory "$appDir";
                  Start-Sleep -Seconds 2;
              }
              "STARDESK_READY=1" >> "$env:GITHUB_ENV";
              Write-Host "│ ✅ Đã mở ứng dụng StarDesk thành công: $appExe" -ForegroundColor Green;
          } else {
              Write-Host "│ ❌ Không tìm thấy $appExe sau khi chạy cài đặt!" -ForegroundColor Red;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 🎉 THÔNG TIN KẾT NỐI (RDP + SUNSHINE + STARDESK + MÀN HÌNH ẢO + ÂM THANH ẢO)
        shell: pwsh
        run: |
          $tz    = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time');
          $start = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds([long]"$env:JOB_START_EPOCH").UtcDateTime, ($tz));
          $end   = $start.AddMinutes([int]"$env:TOTAL_MINUTES");

          $passText = "$env:RDP_PASS";
          if ("$env:RDP_PASS_SOURCE" -eq 'secret') {
              $passText = '(dùng secret RDP_PASSWORD)';
          }

          $sdStatus = if (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue) { 'Đang chạy (Đã cài & mở sẵn)' } else { 'Chờ khởi tạo / Chưa có bộ cài' };

          Write-Host "";
          Write-Host "┌──────────────────────────────────────────────────────────┐" -ForegroundColor Cyan;
          Write-Host "│     🎉 RDP + SUNSHINE + STARDESK + Ổ ĐĨA SẴN SÀNG!       │" -ForegroundColor Cyan;
          Write-Host "├──────────────────────────────────────────────────────────┤" -ForegroundColor Cyan;
          Write-Host "│ 🌐  IP Tailscale  : $env:TAILSCALE_IP (RDP: 3389 | Moonlight)" -ForegroundColor White;
          Write-Host "│ ☀️  Sunshine Web  : https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow;
          Write-Host "│ 🎛️  Web Quản Lý   : http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Yellow;
          Write-Host "│ 🚀  StarDesk      : $sdStatus" -ForegroundColor Green;
          if ("$env:DUCKDNS_HOST") {
              Write-Host "│ 🦆  Tên miền      : $env:DUCKDNS_HOST" -ForegroundColor White;
          }
          Write-Host "│ 👤  User gốc      : $env:RDP_USER (Dùng chung cho cả RDP & Sunshine)" -ForegroundColor Green;
          Write-Host "│ 🔐  Mật khẩu      : $passText (Cố định)" -ForegroundColor Green;
          Write-Host "│ 🖥️  Màn hình ảo   : ${{ inputs.vdd_resolution }} (Trực tiếp trên Console)" -ForegroundColor Green;
          Write-Host "│ 🔊  Âm thanh ảo   : $env:AUDIO_DEVICE_NAME" -ForegroundColor Green;
          Write-Host "│ 💽  Ổ đĩa riêng   : $($env:MOUNT_LETTER):\ ($env:SHARED_ROOT)" -ForegroundColor Green;
          Write-Host "│ 👤  Profile gốc   : $env:PROFILE_PATH (<-> $($env:PROFILE_ROOT)\$env:RDP_USER)" -ForegroundColor Green;
          Write-Host "│ ⏰  Thời lượng    : $env:DISPLAY_TIME ($($start.ToString('HH:mm:ss')) -> $($end.ToString('HH:mm:ss')))" -ForegroundColor White;
          Write-Host "├──────────────────────────────────────────────────────────┤" -ForegroundColor Cyan;
          Write-Host "│ 🔑 RDP BẮT BUỘC NHẬP MẬT KHẨU: Bạn sẽ được hỏi mật khẩu mỗi lần kết nối." -ForegroundColor Yellow;
          Write-Host "│    Sau khi nhập đúng, hệ thống tự động đăng nhập vào màn hình chính." -ForegroundColor Yellow;
          Write-Host "├──────────────────────────────────────────────────────────┤" -ForegroundColor Cyan;
          Write-Host "│ 💡 Mở Moonlight -> Add PC: $env:TAILSCALE_IP -> Nhập PIN tại Sunshine Web!" -ForegroundColor Yellow;
          Write-Host "└──────────────────────────────────────────────────────────┘" -ForegroundColor Cyan;
          exit 0;

      # ───────────────────────────────────────────────
      # 11. DUY TRÌ PHIÊN & LẮNG NGHE LỆNH TỪ WEB QUẢN LÝ
      # ───────────────────────────────────────────────
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC (LẮNG NGHE WEB PANEL & GIỮ SUNSHINE/STARDESK/AUDIO)
        id: keepalive
        shell: pwsh
        run: |
          $tz         = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time');
          $endEpoch   = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60);
          $endLocal   = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds($endEpoch).UtcDateTime, ($tz));
          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1');
          $sigFile    = "$env:CONTROL_SIGNAL_FILE";
          $u          = "$env:RDP_USER";
          $sdExe      = 'C:\Program Files\StarDesk\StarDesk.exe';

          Write-Host "";
          Write-Host "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..." -ForegroundColor Yellow;
          Write-Host "🔗 Kết nối RDP     : $env:TAILSCALE_IP:3389 (User:$u)" -ForegroundColor Cyan;
          Write-Host "🔑 RDP sẽ HỎI MẬT KHẨU mỗi lần kết nối (fPromptForPassword=1)" -ForegroundColor Yellow;
          Write-Host "☀️ Sunshine Web UI : https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow;
          Write-Host "🎛️ Web Quản Lý     : http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Yellow;
          Write-Host "🕐 Kết thúc dự kiến: $($endLocal.ToString('HH:mm:ss'))" -ForegroundColor Green;
          Write-Host "";

          $lastLog = (Get-Date).AddHours(-1);
          $warned  = $false;

          while ($true) {
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim();
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue;

                  if ("$cmd" -eq 'SAVE_NOW') {
                      Write-Host "💾 [WEB-PANEL] Nhận lệnh LƯU NGAY từ Web Quản Lý..." -ForegroundColor Cyan;
                      & "$saveScript" -Reason 'manual-web-save';
                      if (Test-Path "$sdExe") {
                          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue;
                          if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) {
                              & schtasks.exe /Run /TN "AISTV-Launch-StarDesk" *> $null;
                              Start-Sleep -Seconds 2;
                              if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) {
                                  Start-Process -FilePath "$sdExe" -WorkingDirectory 'C:\Program Files\StarDesk';
                              }
                          }
                      }
                      $global:LASTEXITCODE = 0;
                  } elseif ("$cmd" -eq 'RESTART_SESSION') {
                      Write-Host "🔁 [WEB-PANEL] Nhận lệnh LƯU & KHỞI ĐỘNG LẠI PHIÊN MỚI từ Web Quản Lý!" -ForegroundColor Yellow;
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV";
                      break;
                  } elseif ("$cmd" -eq 'STOP_SESSION') {
                      Write-Host "🛑 [WEB-PANEL] Nhận lệnh LƯU & TẮT HẲN SERVER từ Web Quản Lý!" -ForegroundColor Red;
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV";
                      break;
                  }
              }

              try {
                  @(quser 2>$null) | ForEach-Object {
                      $lineStr = "$_";
                      if (("$lineStr" -match "^\s*>?$([regex]::Escape("$u"))\s+") -and ("$lineStr" -notmatch "\s+console\s+")) {
                          $parts  = (($lineStr -replace '^>', ' ').Trim()) -split '\s+';
                          $sidNum = $parts[1..(($parts.Count) - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1;
                          if (($sidNum) -and ("$lineStr" -match "\s+Disc\s+")) {
                              & tscon "$sidNum" /dest:console *> $null;
                              Write-Host "🖥️ Đã trả phiên User gốc $u (ID:$sidNum) về màn hình Console cho Sunshine & StarDesk!" -ForegroundColor Green;
                          }
                      }
                  };
              } catch {}

              $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = ($endEpoch) - ($now);
              if (($remain) -le 0) {
                  Write-Host "⏰ Đã hết thời gian phiên làm việc!" -ForegroundColor Yellow;
                  break;
              }

              if ((((Get-Date) - ($lastLog)).TotalMinutes) -ge 5) {
                  $svc     = Get-Service -Name TermService -ErrorAction SilentlyContinue;
                  $audSvc  = Get-Service -Name Audiosrv -ErrorAction SilentlyContinue;
                  $sunProc = Get-Process -Name 'sunshine' -ErrorAction SilentlyContinue;
                  $sunSvc  = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1;
                  $sunStat = if (($sunProc) -or (($sunSvc) -and (($sunSvc.Status) -eq 'Running'))) { 'Running' } else { 'Stopped' };
                  $sdProc  = Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue;
                  $sdStat  = if ($sdProc) { 'Running' } else { 'Stopped' };
                  $h = [math]::Floor(($remain) / 3600);
                  $m = [math]::Floor((($remain) % 3600) / 60);
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 📊 RDP: $($svc.Status) | Sunshine: $sunStat | StarDesk: $sdStat | Audio: $($audSvc.Status) | Còn lại: ${h}h${m}m" -ForegroundColor Blue;
                  $lastLog = Get-Date;
              }

              $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue;
              if (($svc) -and (($svc.Status) -ne 'Running')) {
                  Start-Service -Name TermService -ErrorAction SilentlyContinue;
              }

              $audSvc = Get-Service -Name Audiosrv -ErrorAction SilentlyContinue;
              if (($audSvc) -and (($audSvc.Status) -ne 'Running')) {
                  Start-Service -Name AudioEndpointBuilder -ErrorAction SilentlyContinue;
                  Start-Service -Name Audiosrv -ErrorAction SilentlyContinue;
              }

              if (-not (Get-Process -Name 'sunshine' -ErrorAction SilentlyContinue)) {
                  $sunSvc = Get-Service -Name 'SunshineService', 'sunshinesvc' -ErrorAction SilentlyContinue | Select-Object -First 1;
                  if ($sunSvc) {
                      Start-Service -Name ($sunSvc.Name) -ErrorAction SilentlyContinue;
                  }
              }

              if ((Test-Path "$sdExe") -and (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue))) {
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue;
                  & schtasks.exe /Run /TN "AISTV-Launch-StarDesk" *> $null;
                  Start-Sleep -Seconds 1;
                  if (-not (Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue)) {
                      Start-Process -FilePath "$sdExe" -WorkingDirectory 'C:\Program Files\StarDesk' -ErrorAction SilentlyContinue;
                  }
              }

              if ((-not ($warned)) -and (($remain) -le 300)) {
                  try {
                      msg * /TIME:290 "Phien RDP/Sunshine/StarDesk sap het gio (5 phut). He thong se tu dong dong goi toan bo o dia $($env:MOUNT_LETTER): luu len GitHub!";
                  } catch {}
                  $warned = $true;
              }

              Start-Sleep -Seconds 2;
          }

          Write-Host "";
          Write-Host "🎯 CHUYỂN SANG BƯỚC TẮT TIẾN TRÌNH & ĐÓNG GÓI LƯU DỮ LIỆU AN TOÀN..." -ForegroundColor Green;
          exit 0;

      # ───────────────────────────────────────────────
      # 12. TẮT SUNSHINE / STARDESK & LƯU TOÀN BỘ Ổ ĐĨA CUỐI PHIÊN LÊN GITHUB
      # ───────────────────────────────────────────────
      - name: 💾 Tắt Sunshine, Kill StarDesk & Lưu toàn bộ ổ đĩa cuối phiên lên GitHub
        if: always()
        shell: pwsh
        run: |
          Write-Host "🛑 Đang tắt Sunshine & Kill toàn bộ tiến trình StarDesk cuối phiên..." -ForegroundColor Yellow;

          Stop-Service -Name 'SunshineService', 'sunshinesvc' -Force -ErrorAction SilentlyContinue;
          Stop-Process -Name 'sunshine' -Force -ErrorAction SilentlyContinue;

          & schtasks.exe /Delete /TN "AISTV-Launch-StarDesk" /F *> $null;
          Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | ForEach-Object {
              $null = $_.CloseMainWindow();
          };
          Start-Sleep -Seconds 2;
          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;
          Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
          & taskkill.exe /F /IM 'StarDesk*' /T *> $null;
          Write-Host "✅ Đã tắt hoàn toàn StarDesk & Sunshine!" -ForegroundColor Green;

          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1');
          if (-not (Test-Path "$saveScript")) {
              Write-Host 'ℹ️ Không có script lưu, bỏ qua' -ForegroundColor Cyan;
              exit 0;
          }

          & "$saveScript" -Reason 'session-end';
          $global:LASTEXITCODE = 0;
          exit 0;

      # ───────────────────────────────────────────────
      # 13. DỌN DẸP HỆ THỐNG
      # ───────────────────────────────────────────────
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        shell: pwsh
        run: |
          Write-Host "";
          Write-Host "🧹 ĐANG DỌN DẸP HỆ THỐNG..." -ForegroundColor Yellow;

          try {
              Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;
              Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
              & taskkill.exe /F /IM 'StarDesk*' /T *> $null;
              Write-Host "│ ✅ Đã đóng triệt để tiến trình StarDesk" -ForegroundColor Green;
          } catch {}

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe";

          try {
              if (Test-Path "$ts") {
                  & "$ts" logout 2>&1 | Out-Null;
                  & "$ts" down 2>&1 | Out-Null;
              }
              Write-Host "│ ✅ Đóng kết nối mạng" -ForegroundColor Green;
          } catch {}

          try {
              Remove-NetFirewallRule -DisplayName 'RDP-Premium' -ErrorAction SilentlyContinue;
              Remove-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -ErrorAction SilentlyContinue;
              Remove-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -ErrorAction SilentlyContinue;
              Write-Host "│ ✅ Xóa rule firewall" -ForegroundColor Green;
          } catch {}

          try {
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force -ErrorAction SilentlyContinue;
              Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue;
              Write-Host "│ ✅ Khôi phục cài đặt RDP" -ForegroundColor Green;
          } catch {}

          Write-Host "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋" -ForegroundColor Green;
          exit 0;

      # ───────────────────────────────────────────────
      # 14. KÍCH HOẠT PHIÊN TIẾP THEO (GỌI LẠI Ổ ĐĨA)
      # ───────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo & Mở lại ổ đĩa
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          VDD_RES: ${{ inputs.vdd_resolution }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          DDNS: ${{ inputs.enable_duckdns }}
        run: |
          $wf      = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0]);
          $optStr  = if ([string]::IsNullOrWhiteSpace("$env:OPT")) { 'true' } else { ("$env:OPT").ToLower() };
          $ddnsStr = if ([string]::IsNullOrWhiteSpace("$env:DDNS")) { 'true' } else { ("$env:DDNS").ToLower() };

          Write-Host "Chạy lại workflow: $wf (ref:$env:GITHUB_REF_NAME) và gắn lại ổ $($env:MOUNT_LETTER):\" -ForegroundColor Cyan;
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" -f "duration=$env:DURATION" -f auto_restart=true -f "drive_letter=$env:MOUNT_LETTER" -f "vhd_size_gb=$env:VHD_SIZE_GB" -f "windows_image=$env:WIN_IMAGE" -f "fixed_password=$env:FIXED_PASS" -f "vdd_resolution=$env:VDD_RES" -f "choco_packages=$env:PKGS" -f "optimize_windows=$optStr" -f "enable_duckdns=$ddnsStr";
          if (($LASTEXITCODE) -ne 0) {
              throw 'Không kích hoạt được phiên mới';
          }
          Write-Host "✅ Đã kích hoạt phiên tiếp theo" -ForegroundColor Green;
