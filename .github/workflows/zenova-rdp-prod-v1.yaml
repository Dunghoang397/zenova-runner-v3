name: Zenova RDP Production

on:
  repository_dispatch:
    types: [zenova-create]
  workflow_dispatch:
    inputs:
      machine_id:
        required: true
        type: string
      owner_discord_id:
        required: false
        default: ""
        type: string
      duration:
        required: false
        default: "5h00m"
        type: string
      windows_image:
        required: false
        default: "windows-2025"
        type: string
      vhd_size_gb:
        required: false
        default: "1024"
        type: string
      fixed_password:
        required: false
        default: "ABC123@"
        type: string
      choco_packages:
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

jobs:
  Zenova-RDP:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve Inputs
        shell: pwsh
        run: |
          $mid = "${{ github.event.client_payload.machine_id }}"
          if (-not $mid) { $mid = "${{ inputs.machine_id }}" }
          "MACHINE_ID=$mid" >> "$env:GITHUB_ENV"
          Write-Host "Machine: $mid"